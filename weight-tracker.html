<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F7F6F3; --surface:#FFFFFF; --border:#E5E3DE;
  --text:#1A1917; --muted:#7A7671; --accent:#1A1917;
  --green:#16A34A; --red:#DC2626; --amber:#D97706; --blue:#2563EB;
  --green-bg:#F0FDF4; --red-bg:#FEF2F2; --amber-bg:#FFFBEB;
  --radius:8px; --sans:'Geist',sans-serif; --mono:'Geist Mono',monospace;
}
[data-theme="sand"]{--bg:#F8F7FF;--surface:#FFFFFF;--border:#E2E0F0;--text:#1A1830;--muted:#6B6880;--accent:#4F46E5;}
[data-theme="navy"]{--bg:#161925;--surface:#1F2437;--border:#2D3348;--text:#E8EAF0;--muted:#8890A8;--accent:#818CF8;--green:#34D399;--red:#F87171;--green-bg:#0a1f0e;--red-bg:#2a0a0a;}
[data-theme="dark"]{--bg:#111113;--surface:#1C1C1E;--border:#2C2C2E;--text:#F5F5F7;--muted:#8E8E93;--accent:#60A5FA;--green:#34D399;--red:#F87171;--green-bg:#0a1f0e;--red-bg:#2a0a0a;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-family:var(--sans);background:var(--bg);color:var(--text);}
body{min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select{font-family:inherit;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);color-scheme:light;}
[data-theme="dark"] input,[data-theme="dark"] select{color-scheme:dark;}
[data-theme="navy"] input,[data-theme="navy"] select{color-scheme:dark;}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;}
.app-title{font-size:14px;font-weight:600;letter-spacing:-.01em;}
.sync-dot{font-size:11px;color:var(--muted);margin-left:8px;}
.icon-btn{width:32px;height:32px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);transition:background .15s;flex-shrink:0;}
.icon-btn:hover{background:var(--border);color:var(--text);}

/* Page */
.page{max-width:560px;margin:0 auto;padding:20px 16px 80px;}

/* Entry form */
.entry-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px;}
.entry-card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:14px;}
.entry-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.field input{padding:9px 12px;font-size:15px;outline:none;border-radius:var(--radius);}
.field input:focus{border-color:var(--accent);}
.field-weight{flex:0 0 130px;}
.field-weight input{font-family:var(--mono);font-size:20px;font-weight:500;}
.field-dt{flex:1;min-width:160px;}
.btn-add{height:40px;padding:0 20px;border-radius:var(--radius);background:var(--accent);color:var(--bg);font-size:13px;font-weight:600;flex-shrink:0;transition:opacity .15s;align-self:flex-end;}
.btn-add:hover{opacity:.85;}
[data-theme="dark"] .btn-add{color:#111113;}

/* Goal card */
.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px;}
.goal-card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;}
.goal-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.goal-summary{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.6;}
.goal-summary b{color:var(--text);}
.prog-bar{height:6px;border-radius:3px;background:var(--border);margin-top:10px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .4s;}
/* Milestones */
.milestone-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.milestone-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);font-size:13px;}
.milestone-item.reached{border-color:var(--green);background:var(--green-bg);}
.milestone-badge{font-family:var(--mono);font-size:13px;font-weight:600;min-width:60px;}
.milestone-label{flex:1;color:var(--muted);font-size:12px;}
.milestone-date{font-size:11px;color:var(--muted);font-family:var(--mono);}
.milestone-del{opacity:0;font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0 2px;transition:opacity .15s;}
.milestone-item:hover .milestone-del{opacity:1;}
.milestone-del:hover{color:var(--red);}
.milestone-reached-badge{font-size:10px;background:var(--green);color:#fff;padding:1px 7px;border-radius:10px;font-weight:600;}
.add-milestone-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:flex-end;}
.ms-toggle{font-size:12px;color:var(--blue);cursor:pointer;background:none;border:none;padding:4px 0;display:flex;align-items:center;gap:4px;margin-top:8px;}

/* Chart */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px;}
.chart-card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.chart-wrap{position:relative;width:100%;height:200px;}
canvas{width:100%!important;display:block;}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:center;}
.stat-val{font-size:22px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em;}
.stat-box.good .stat-val{color:var(--green);}
.stat-box.bad .stat-val{color:var(--red);}

/* Log */
.log-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.log-card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:14px 16px;border-bottom:1px solid var(--border);}
.log-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px;}
.log-item:last-child{border-bottom:none;}
.log-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.log-weight{font-family:var(--mono);font-size:16px;font-weight:600;min-width:55px;}
.log-delta{font-family:var(--mono);font-size:12px;font-weight:500;min-width:50px;text-align:right;}
.log-date{font-size:11px;color:var(--muted);flex:1;}
.log-del{opacity:0;font-size:11px;color:var(--muted);transition:opacity .15s;background:none;border:none;cursor:pointer;padding:0 4px;}
.log-item:hover .log-del{opacity:1;}
.log-del:hover{color:var(--red);}
.log-item{flex-wrap:wrap;}
.log-comment{width:100%;padding:3px 0 2px 22px;font-size:12px;color:var(--muted);font-style:italic;cursor:pointer;line-height:1.4;}
.log-comment:hover{color:var(--text);}
.log-comment-add{width:100%;padding:3px 0 2px 22px;font-size:12px;color:var(--border);cursor:pointer;transition:color .15s;}
.log-comment-add:hover{color:var(--muted);}
.log-comment-input{width:calc(100% - 22px);margin-left:22px;margin-top:4px;margin-bottom:4px;font-family:var(--sans);font-size:12px;padding:5px 9px;border:1px solid var(--accent);border-radius:6px;background:var(--bg);color:var(--text);outline:none;resize:none;}
.log-empty{padding:30px;text-align:center;color:var(--muted);font-size:13px;}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:8px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Section toggle */
.chart-period{display:flex;gap:4px;}
.period-btn{font-size:11px;padding:3px 10px;border-radius:10px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:transparent;transition:all .15s;}
.period-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}
[data-theme="dark"] .period-btn.active{color:#111113;}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:4px;">
    <span class="app-title">🏋️ Weight Tracker</span>
    <span class="sync-dot" id="sync-dot">⚫ Local</span>
  </div>
  <div style="display:flex;gap:6px;">
    <button class="icon-btn" onclick="handleDriveBtn()" title="Synchroniser depuis Drive">☁</button>
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">☀︎</button>
  </div>
</div>

<div class="page">

  <!-- Entry form -->
  <div class="entry-card">
    <h2>Saisir mon poids</h2>
    <div class="entry-row">
      <div class="field field-weight">
        <label>Poids (kg)</label>
        <input type="number" id="in-weight" step="0.1" min="30" max="300" placeholder="75.5" onkeydown="if(event.key==='Enter')addEntry()">
      </div>
      <div class="field field-dt">
        <label>Date &amp; heure</label>
        <input type="datetime-local" id="in-dt">
      </div>
      <button class="btn-add" onclick="addEntry()">+ Ajouter</button>
    </div>
  </div>

  <!-- Goal -->
  <div class="goal-card">
    <h2>Mon objectif</h2>
    <div class="goal-row">
      <div class="field" style="flex:0 0 120px;">
        <label>Objectif (kg)</label>
        <input type="number" id="in-goal-weight" step="0.1" min="30" max="300" placeholder="70" oninput="updateGoal()">
      </div>
      <div class="field" style="flex:1;min-width:150px;">
        <label>Date cible</label>
        <input type="date" id="in-goal-date" oninput="updateGoal()">
      </div>
    </div>
    <div class="goal-summary" id="goal-summary"></div>
    <div class="prog-bar" id="prog-bar" style="display:none;"><div class="prog-fill" id="prog-fill"></div></div>

    <!-- Objectifs intermédiaires -->
    <button class="ms-toggle" onclick="toggleMilestones()">
      <span id="ms-chevron">▸</span> <span id="ms-toggle-label">Objectifs intermédiaires</span>
    </button>
    <div id="ms-panel" style="display:none;">
      <div class="milestone-list" id="ms-list"></div>
      <div class="add-milestone-row">
        <div class="field" style="flex:0 0 110px;">
          <label>Poids (kg)</label>
          <input type="number" id="ms-in-weight" step="0.1" min="30" max="300" placeholder="73" onkeydown="if(event.key==='Enter')addMilestone()">
        </div>
        <div class="field" style="flex:0 0 150px;">
          <label>Date cible</label>
          <input type="date" id="ms-in-date">
        </div>
        <div class="field" style="flex:1;min-width:120px;">
          <label>Label (optionnel)</label>
          <input type="text" id="ms-in-label" placeholder="Ex: Avant les vacances" onkeydown="if(event.key==='Enter')addMilestone()">
        </div>
        <button class="btn-add" onclick="addMilestone()" style="height:38px;padding:0 14px;font-size:12px;">+ Ajouter</button>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="stats-row" style="display:none;">
    <div class="stat-box" id="stat-current">
      <div class="stat-val" id="stat-current-val">—</div>
      <div class="stat-lbl">Actuel</div>
    </div>
    <div class="stat-box" id="stat-delta">
      <div class="stat-val" id="stat-delta-val">—</div>
      <div class="stat-lbl">Depuis début</div>
    </div>
    <div class="stat-box" id="stat-trend">
      <div class="stat-val" id="stat-trend-val">—</div>
      <div class="stat-lbl">Cette semaine</div>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-card" id="chart-card" style="display:none;">
    <h2>
      Courbe
      <div class="chart-period">
        <button class="period-btn active" data-p="14" onclick="setPeriod(14,this)">2 sem</button>
        <button class="period-btn" data-p="30" onclick="setPeriod(30,this)">1 mois</button>
        <button class="period-btn" data-p="90" onclick="setPeriod(90,this)">3 mois</button>
        <button class="period-btn" data-p="0" onclick="setPeriod(0,this)">Tout</button>
      </div>
    </h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <!-- Log -->
  <div class="log-card">
    <h2>Historique</h2>
    <div id="log-list"><div class="log-empty">Aucune mesure encore. Ajoute ton premier poids !</div></div>
  </div>

</div>

<div id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ── Constants ──────────────────────────────────────────────────────────────
const APP='weight-tracker', SK='td_v4_'+APP, TK='td_theme_'+APP, TOK='td_tok_'+APP;
const CLIENT_ID='962903341875-aucgsp0h46olec36evehi500n2tgk32m.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/drive';
const THEMES=['light','sand','navy','dark'], ICONS={light:'☀︎',sand:'○',navy:'◑',dark:'☾'};
const DRIVE_FILE='weight-tracker.json';

// ── State ──────────────────────────────────────────────────────────────────
let S = {entries:[], goalWeight:null, goalDate:null};
let accessToken=sessionStorage.getItem(TOK)||null;
let tokenClient=null, driveFileId=null, saveTimer=null;
let chartPeriod=14;

// ── ensureState ────────────────────────────────────────────────────────────
function ensureState(){
  if(!Array.isArray(S.entries))S.entries=[];
  if(S.goalWeight===undefined)S.goalWeight=null;
  if(S.goalDate===undefined)S.goalDate=null;
  if(!Array.isArray(S.milestones))S.milestones=[];
  S.entries.forEach(e=>{
    if(!e.id)e.id='w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    if(!e.ts)e.ts=Date.now();
    if(!e.comment)e.comment='';
  });
  // Sort newest first for display, oldest first for chart
  S.entries.sort((a,b)=>b.ts-a.ts);
}

// ── Boot ───────────────────────────────────────────────────────────────────
function load(){
  try{const r=localStorage.getItem(SK);if(r)S=JSON.parse(r);}catch(e){}
  ensureState();
  // Restore goal inputs
  if(S.goalWeight){document.getElementById('in-goal-weight').value=S.goalWeight;}
  if(S.goalDate){document.getElementById('in-goal-date').value=S.goalDate;}
  // Default datetime = now
  document.getElementById('in-dt').value=localDatetimeStr(new Date());
  renderAll();
  initDrive();
}

function renderAll(){
  renderGoal();
  renderMilestones();
  renderStats();
  renderChart();
  renderLog();
}

// ── Datetime helpers ───────────────────────────────────────────────────────
function localDatetimeStr(d){
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short',year:'2-digit'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
}

// ── Add entry ──────────────────────────────────────────────────────────────
function addEntry(){
  const wVal=document.getElementById('in-weight').value;
  const dtVal=document.getElementById('in-dt').value;
  if(!wVal){toast('Entre un poids');return;}
  const w=parseFloat(wVal);
  if(isNaN(w)||w<20||w>400){toast('Poids invalide');return;}
  const ts=dtVal?new Date(dtVal).getTime():Date.now();
  S.entries.push({id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),weight:w,ts});
  ensureState();
  document.getElementById('in-weight').value='';
  document.getElementById('in-dt').value=localDatetimeStr(new Date());
  document.getElementById('in-weight').focus();
  autoSave();renderAll();
  toast('✓ '+w.toFixed(1)+' kg enregistré');
}

// ── Delete entry ───────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function editComment(id){
  const item=document.getElementById('log-item-'+id);if(!item)return;
  const e=S.entries.find(x=>x.id===id);if(!e)return;
  // Replace the comment line with an input
  const existing=item.querySelector('.log-comment,.log-comment-add');
  if(!existing)return;
  const inp=document.createElement('textarea');
  inp.className='log-comment-input';
  inp.rows=2;inp.value=e.comment||'';
  inp.placeholder='Ajouter un commentaire…';
  inp.style.display='block';
  existing.replaceWith(inp);
  inp.focus();inp.selectionStart=inp.selectionEnd=inp.value.length;
  const save=()=>{
    e.comment=inp.value.trim();
    autoSave();renderLog();
  };
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();inp.blur();}
    if(ev.key==='Escape'){inp.value=e.comment||'';inp.blur();}
  });
}

function delEntry(id){
  S.entries=S.entries.filter(e=>e.id!==id);
  autoSave();renderAll();toast('Supprimé');
}

// ── Goal ───────────────────────────────────────────────────────────────────
function updateGoal(){
  S.goalWeight=parseFloat(document.getElementById('in-goal-weight').value)||null;
  S.goalDate=document.getElementById('in-goal-date').value||null;
  autoSave();renderGoal();renderChart();
}

// ── Milestones ────────────────────────────────────────────────────────────
function toggleMilestones(){
  const panel=document.getElementById('ms-panel');
  const chev=document.getElementById('ms-chevron');
  const open=panel.style.display==='none';
  panel.style.display=open?'':'none';
  chev.textContent=open?'▾':'▸';
  if(open)renderMilestones();
}

function addMilestone(){
  const w=parseFloat(document.getElementById('ms-in-weight').value);
  const d=document.getElementById('ms-in-date').value;
  const label=document.getElementById('ms-in-label').value.trim();
  if(!w||isNaN(w)){toast('Entre un poids cible');return;}
  S.milestones=S.milestones||[];
  S.milestones.push({id:'ms'+Date.now().toString(36),weight:w,date:d||null,label:label||null});
  S.milestones.sort((a,b)=>b.weight-a.weight); // heaviest first (milestones go down)
  document.getElementById('ms-in-weight').value='';
  document.getElementById('ms-in-date').value='';
  document.getElementById('ms-in-label').value='';
  autoSave();renderMilestones();renderChart();
  toast('✓ Objectif intermédiaire ajouté');
}

function delMilestone(id){
  S.milestones=S.milestones.filter(m=>m.id!==id);
  autoSave();renderMilestones();renderChart();
}

function renderMilestones(){
  const el=document.getElementById('ms-list');if(!el)return;
  const sorted=[...S.entries].sort((a,b)=>b.ts-a.ts);
  const current=sorted[0]?.weight;
  if(!S.milestones||!S.milestones.length){
    el.innerHTML='<div style="font-size:12px;color:var(--muted);padding:4px 0;">Aucun objectif intermédiaire.</div>';
    // Update toggle label
    const lbl=document.getElementById('ms-toggle-label');
    if(lbl)lbl.textContent='Objectifs intermédiaires';
    return;
  }
  const reached=S.milestones.filter(m=>current!==undefined&&current<=m.weight).length;
  const lbl=document.getElementById('ms-toggle-label');
  if(lbl)lbl.textContent=`Objectifs intermédiaires (${reached}/${S.milestones.length} atteints)`;

  el.innerHTML=S.milestones.map(m=>{
    const isReached=current!==undefined&&current<=m.weight;
    const diff=current!==undefined?(current-m.weight).toFixed(1):null;
    const daysStr=m.date?`<span class="milestone-date">${formatGoalDate(m.date)}</span>`:'';
    const reachedBadge=isReached?'<span class="milestone-reached-badge">✓ Atteint</span>':'';
    const diffStr=diff!==null&&!isReached?`<span style="font-size:11px;color:var(--red);font-family:var(--mono);">+${diff} kg</span>`:'';
    return `<div class="milestone-item${isReached?' reached':''}" id="ms-item-${m.id}">
      <span style="font-size:14px;">${isReached?'✅':'🎯'}</span>
      <span class="milestone-badge" style="color:${isReached?'var(--green)':'var(--text)'};">${m.weight} kg</span>
      <span class="milestone-label">${m.label?esc(m.label):''}</span>
      ${daysStr}${reachedBadge}${diffStr}
      <button class="milestone-del" onclick="delMilestone('${m.id}')" title="Supprimer">✕</button>
    </div>`;
  }).join('');
}

function renderGoal(){
  const el=document.getElementById('goal-summary');
  const pb=document.getElementById('prog-bar');
  const pf=document.getElementById('prog-fill');
  if(!S.goalWeight){el.textContent='Définis un objectif de poids et une date cible.';pb.style.display='none';return;}
  const sorted=[...S.entries].sort((a,b)=>b.ts-a.ts);
  const current=sorted[0]?.weight;
  const start=sorted[sorted.length-1]?.weight;
  if(!current){el.innerHTML='Objectif : <b>'+S.goalWeight+' kg</b>'+(S.goalDate?' avant le <b>'+formatGoalDate(S.goalDate)+'</b>':'');pb.style.display='none';return;}
  const diff=(current-S.goalWeight).toFixed(1);
  const diffStart=start?(current-start).toFixed(1):null;
  const losing=parseFloat(diff)<0;
  // Days remaining
  let daysStr='';
  if(S.goalDate){
    const days=Math.ceil((new Date(S.goalDate)-new Date())/(86400000));
    daysStr=days>0?` · <b>${days} jour${days>1?'s':''}</b> restants`:' · <b style="color:var(--red)">Date dépassée</b>';
  }
  el.innerHTML=(losing
    ? `🎯 Plus que <b style="color:var(--green)">${Math.abs(diff)} kg</b> à perdre pour atteindre <b>${S.goalWeight} kg</b>`
    : `🎯 <b style="color:var(--red)">${diff} kg</b> au-dessus de l'objectif <b>${S.goalWeight} kg</b>`)
    +daysStr;
  // Progress bar
  if(start&&start!==S.goalWeight){
    pb.style.display='';
    const total=start-S.goalWeight;
    const done=start-current;
    const pct=Math.max(0,Math.min(100,(done/total)*100));
    pf.style.width=pct+'%';
    pf.style.background=pct>=100?'var(--green)':(pct>0?'var(--accent)':'var(--border)');
  } else {pb.style.display='none';}
}

function formatGoalDate(d){
  return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
}

// ── Stats ──────────────────────────────────────────────────────────────────
function renderStats(){
  const row=document.getElementById('stats-row');
  if(!S.entries.length){row.style.display='none';return;}
  row.style.display='grid';
  const sorted=[...S.entries].sort((a,b)=>b.ts-a.ts);
  const current=sorted[0].weight;
  const first=sorted[sorted.length-1].weight;
  // Current
  document.getElementById('stat-current-val').textContent=current.toFixed(1)+' kg';
  // Delta since start
  const delta=current-first;
  const dEl=document.getElementById('stat-delta');
  const dVal=document.getElementById('stat-delta-val');
  dVal.textContent=(delta>=0?'+':'')+delta.toFixed(1)+' kg';
  dEl.className='stat-box '+(delta<0?'good':delta>0?'bad':'');
  // Week trend
  const weekAgo=Date.now()-7*86400000;
  const weekEntries=sorted.filter(e=>e.ts>=weekAgo);
  const tEl=document.getElementById('stat-trend');
  const tVal=document.getElementById('stat-trend-val');
  if(weekEntries.length>=2){
    const wDelta=weekEntries[0].weight-weekEntries[weekEntries.length-1].weight;
    tVal.textContent=(wDelta>=0?'+':'')+wDelta.toFixed(1)+' kg';
    tEl.className='stat-box '+(wDelta<0?'good':wDelta>0?'bad':'');
  } else {tVal.textContent='—';tEl.className='stat-box';}
}

// ── Chart ──────────────────────────────────────────────────────────────────
function setPeriod(p,btn){
  chartPeriod=p;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.toggle('active',b===btn));
  renderChart();
}

function renderChart(){
  const card=document.getElementById('chart-card');
  if(S.entries.length<2){card.style.display='none';return;}
  card.style.display='';
  const canvas=document.getElementById('chart');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.offsetWidth;
  const H=200;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  // Filter by period
  let pts=[...S.entries].sort((a,b)=>a.ts-b.ts);
  if(chartPeriod>0){const cutoff=Date.now()-chartPeriod*86400000;pts=pts.filter(e=>e.ts>=cutoff);}
  if(pts.length<2){ctx.clearRect(0,0,W,H);return;}

  const PAD={t:20,r:16,b:30,l:48};
  const weights=pts.map(p=>p.weight);
  let minW=Math.min(...weights), maxW=Math.max(...weights);
  if(S.goalWeight){minW=Math.min(minW,S.goalWeight);maxW=Math.max(maxW,S.goalWeight);}
  if(S.milestones&&S.milestones.length){S.milestones.forEach(m=>{minW=Math.min(minW,m.weight);maxW=Math.max(maxW,m.weight);});}
  const range=maxW-minW||1;
  minW-=range*0.1; maxW+=range*0.1;
  const cW=W-PAD.l-PAD.r, cH=H-PAD.t-PAD.b;

  function xOf(i){return PAD.l+cW*(pts.length===1?0.5:i/(pts.length-1));}
  function yOf(w){return PAD.t+cH*(1-(w-minW)/(maxW-minW));}

  // Detect theme
  const isDark=['dark','navy'].includes(localStorage.getItem(TK));
  const textColor=isDark?'#8E8E93':'#7A7671';
  const borderColor=isDark?'#2C2C2E':'#E5E3DE';

  // Grid lines
  ctx.strokeStyle=borderColor; ctx.lineWidth=1;
  const steps=4;
  for(let i=0;i<=steps;i++){
    const y=PAD.t+cH*(i/steps);
    ctx.beginPath();ctx.setLineDash([3,4]);ctx.moveTo(PAD.l,y);ctx.lineTo(W-PAD.r,y);ctx.stroke();
    const wLabel=maxW-(i/steps)*(maxW-minW);
    ctx.setLineDash([]);ctx.fillStyle=textColor;ctx.font='11px '+getComputedStyle(document.documentElement).getPropertyValue('--mono');
    ctx.textAlign='right';ctx.fillText(wLabel.toFixed(1),PAD.l-6,y+4);
  }

  // Goal line
  if(S.goalWeight&&S.goalWeight>=minW&&S.goalWeight<=maxW){
    const gy=yOf(S.goalWeight);
    ctx.strokeStyle='rgba(22,163,74,0.5)';ctx.lineWidth=1.5;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(PAD.l,gy);ctx.lineTo(W-PAD.r,gy);ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle='rgba(22,163,74,0.8)';ctx.font='11px '+getComputedStyle(document.documentElement).getPropertyValue('--sans');
    ctx.textAlign='left';ctx.fillText('objectif '+S.goalWeight+' kg',PAD.l+4,gy-4);
  }

  // Milestone lines
  if(S.milestones&&S.milestones.length){
    S.milestones.forEach(m=>{
      if(m.weight<minW||m.weight>maxW)return;
      const my=yOf(m.weight);
      ctx.strokeStyle='rgba(37,99,235,0.4)';ctx.lineWidth=1;ctx.setLineDash([4,5]);
      ctx.beginPath();ctx.moveTo(PAD.l,my);ctx.lineTo(W-PAD.r,my);ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle='rgba(37,99,235,0.7)';
      ctx.font='10px '+getComputedStyle(document.documentElement).getPropertyValue('--sans');
      ctx.textAlign='right';
      ctx.fillText((m.label||m.weight+' kg'),W-PAD.r-4,my-3);
    });
  }

  // Colored segments
  ctx.setLineDash([]);
  for(let i=1;i<pts.length;i++){
    const losing=pts[i].weight<=pts[i-1].weight;
    ctx.strokeStyle=losing?'var(--green)':'var(--red)';
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(xOf(i-1),yOf(pts[i-1].weight));ctx.lineTo(xOf(i),yOf(pts[i].weight));ctx.stroke();
  }

  // Dots
  pts.forEach((p,i)=>{
    const losing=i===0?false:p.weight<=pts[i-1].weight;
    const color=losing?'var(--green)':'var(--red)';
    ctx.beginPath();ctx.arc(xOf(i),yOf(p.weight),4,0,Math.PI*2);
    ctx.fillStyle=isDark?'#1C1C1E':'#FFFFFF';ctx.fill();
    ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();
  });

  // X labels (first, last, and some in between)
  ctx.fillStyle=textColor;ctx.font='10px '+getComputedStyle(document.documentElement).getPropertyValue('--mono');
  ctx.textAlign='center';
  const labelIdxs=[0,...(pts.length>4?[Math.floor(pts.length/2)]:[]),(pts.length-1)].filter((v,i,a)=>a.indexOf(v)===i);
  labelIdxs.forEach(i=>{ctx.fillText(fmtDateShort(pts[i].ts),xOf(i),H-PAD.b+14);});
}

// ── Log ────────────────────────────────────────────────────────────────────
function renderLog(){
  const el=document.getElementById('log-list');
  if(!S.entries.length){el.innerHTML='<div class="log-empty">Aucune mesure encore. Ajoute ton premier poids !</div>';return;}
  const sorted=[...S.entries].sort((a,b)=>b.ts-a.ts);
  el.innerHTML=sorted.map((e,i)=>{
    const prev=sorted[i+1];
    const delta=prev?e.weight-prev.weight:null;
    const losing=delta!==null&&delta<0;
    const gaining=delta!==null&&delta>0;
    const dotColor=delta===null?'var(--muted)':losing?'var(--green)':'var(--red)';
    const deltaStr=delta===null?'':(delta>=0?'+':'')+delta.toFixed(1)+' kg';
    const deltaColor=losing?'var(--green)':gaining?'var(--red)':'var(--muted)';
    const commentHtml=e.comment
      ? `<div class="log-comment" onclick="editComment('${e.id}')" title="Cliquer pour modifier">💬 ${esc(e.comment)}</div>`
      : `<div class="log-comment-add" onclick="editComment('${e.id}')" title="Ajouter un commentaire">+ Ajouter un commentaire…</div>`;
    return `<div class="log-item" id="log-item-${e.id}">
      <span class="log-dot" style="background:${dotColor};"></span>
      <span class="log-weight">${e.weight.toFixed(1)} kg</span>
      <span class="log-date">${fmtDate(e.ts)}</span>
      <span class="log-delta" style="color:${deltaColor};">${deltaStr}</span>
      <button class="log-del" onclick="delEntry('${e.id}')" title="Supprimer">✕</button>
      ${commentHtml}
    </div>`;
  }).join('');
}

// ── Theme ──────────────────────────────────────────────────────────────────
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t==='light'?'':t);
  document.getElementById('theme-btn').textContent=ICONS[t]||'☀︎';
  localStorage.setItem(TK,t);
  renderChart();
}
function toggleTheme(){const c=localStorage.getItem(TK)||'light';applyTheme(THEMES[(THEMES.indexOf(c)+1)%THEMES.length]);}

// ── Persist ────────────────────────────────────────────────────────────────
function persist(){ensureState();try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function autoSave(){persist();setSyncDot('pending');clearTimeout(saveTimer);saveTimer=setTimeout(pushToDrive,2000);}
function setSyncDot(s){document.getElementById('sync-dot').textContent={local:'⚫ Local',pending:'🟡...',ok:'🟢 Sync ✓',error:'🔴 Erreur'}[s]||'⚫ Local';}

// ── Drive ──────────────────────────────────────────────────────────────────
function initDrive(){
  if(!window.google){setTimeout(initDrive,500);return;}
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,prompt:'',callback:resp=>{
    if(resp.error){setSyncDot('error');return;}
    accessToken=resp.access_token;
    sessionStorage.setItem(TOK,accessToken);
    sessionStorage.setItem(TOK+'_exp',Date.now()+3500000);
    pushToDrive();
    startPoll();
  }});
  if(accessToken){pushToDrive();startPoll();}
}
function handleDriveBtn(){
  if(!tokenClient){toast('Drive non initialisé');return;}
  if(accessToken){pullFromDrive();toast('Chargement depuis Drive…');}
  else tokenClient.requestAccessToken();
}
function findDriveFile(){
  const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  return fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime+desc`,{headers:{Authorization:'Bearer '+accessToken}})
    .then(r=>r.json()).then(d=>{
      if(d.files&&d.files[0]){
        if(!_lastModTime)_lastModTime=d.files[0].modifiedTime;
        return d.files[0].id;
      }
      return null;
    });
}
function pushToDrive(){
  if(!accessToken)return;
  setSyncDot('pending');
  const body=JSON.stringify(S);
  findDriveFile().then(fid=>{
    driveFileId=fid;
    if(fid){return fetch(`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body});}
    return fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'})})
      .then(r=>r.json()).then(m=>{driveFileId=m.id;return fetch(`https://www.googleapis.com/upload/drive/v3/files/${m.id}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body});});
  }).then(r=>{
    if(!r||r.status>=400){setSyncDot('error');return;}
    setSyncDot('ok');
    // Update last mod time after push
    if(driveFileId)fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?fields=modifiedTime`,{headers:{Authorization:'Bearer '+accessToken}})
      .then(r=>r.json()).then(d=>{if(d.modifiedTime)_lastModTime=d.modifiedTime;}).catch(()=>{});
  }).catch(()=>setSyncDot('error'));
}
function pullFromDrive(){
  if(!accessToken)return;
  findDriveFile().then(fid=>{
    if(!fid){toast('Aucun fichier Drive trouvé');return;}
    driveFileId=fid;
    return fetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,{headers:{Authorization:'Bearer '+accessToken}});
  }).then(r=>r?r.json():null).then(data=>{
    if(!data)return;
    S=data;ensureState();
    persist();
    if(S.goalWeight)document.getElementById('in-goal-weight').value=S.goalWeight;
    if(S.goalDate)document.getElementById('in-goal-date').value=S.goalDate;
    renderAll();setSyncDot('ok');
    toast('↻ Synchronisé depuis Drive');
  }).catch(()=>{setSyncDot('error');toast('Erreur Drive');});
}

// ── Polling ────────────────────────────────────────────────────────────────
let _lastModTime=null, _pollInterval=null;
function startPoll(){
  if(_pollInterval)return;
  _pollInterval=setInterval(pollOnce,20000); // every 20s
}
function pollOnce(){
  if(!accessToken||!driveFileId)return;
  fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?fields=modifiedTime`,{headers:{Authorization:'Bearer '+accessToken}})
    .then(r=>r.json()).then(d=>{
      if(!d.modifiedTime)return;
      if(_lastModTime&&d.modifiedTime!==_lastModTime){
        _lastModTime=d.modifiedTime;
        pullFromDrive();
      } else {
        _lastModTime=d.modifiedTime;
      }
    }).catch(()=>{});
}

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2500);}

// ── Window resize → redraw chart ───────────────────────────────────────────
window.addEventListener('resize',()=>{clearTimeout(window._rTimer);window._rTimer=setTimeout(renderChart,150);});

// ── Init ───────────────────────────────────────────────────────────────────
applyTheme(localStorage.getItem(TK)||'light');
load();
</script>
