<style>
:root{--bg:#F7F6F3;--card:#FFFFFF;--text:#1f1d1a;--muted:#6f6b64;--border:#e2dfd8;--accent:#c4552d;--accent-text:#fff;--green:#2e7d4f;--red:#b3261e;--amber:#9a6700;--blue:#2563EB;--card-fade:#FFFFFF}
[data-theme="sand"]{--bg:#F8F7FF;--card:#FFFFFF;--text:#1d1b2e;--muted:#6b6880;--border:#e1def2;--accent:#5b4bd1;--card-fade:#FFFFFF}
[data-theme="navy"]{--bg:#161925;--card:#1e2233;--text:#e8eaf2;--muted:#9aa0b8;--border:#2c3148;--accent:#e08a5f;--accent-text:#161925;--green:#5fbf86;--red:#e57373;--amber:#e0b04a;--blue:#60A5FA;--card-fade:#1e2233}
[data-theme="dark"]{--bg:#111113;--card:#1a1a1d;--text:#ececec;--muted:#9b9b9f;--border:#2b2b30;--accent:#e08a5f;--accent-text:#111113;--green:#5fbf86;--red:#e57373;--amber:#e0b04a;--blue:#60A5FA;--card-fade:#1a1a1d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Geist',-apple-system,Segoe UI,Roboto,sans-serif;font-weight:400;font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit}
input,textarea,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;color-scheme:light}
[data-theme="navy"] input,[data-theme="navy"] textarea,[data-theme="navy"] select,[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select{color-scheme:dark}
input[type="search"]{-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:64px}
label.fl{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;font-family:'Geist Mono',monospace;letter-spacing:.02em}
#boot{display:block;padding:8px 14px;background:var(--amber);color:#fff;font-size:13px}
.header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);height:52px}
.header h1{font-size:16px;font-weight:500;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header small{color:var(--muted);font-family:'Geist Mono',monospace;font-size:11px;font-weight:400;margin-left:6px}
.syncs{font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap}
.iconbtn{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;width:40px;height:36px;cursor:pointer}
.tabs{position:sticky;top:52px;z-index:99;display:flex;background:var(--bg);border-bottom:1px solid var(--border)}
.tab{flex:1;min-height:44px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;padding:0 6px;font-weight:500;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.page{max-width:760px;margin:0 auto;padding:14px 14px 80px}
.section{display:none}.section.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15px;font-weight:500}
.muted{color:var(--muted);font-size:13px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.grow{flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;margin:1px 0 0;flex:none;padding:0}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.deliv{margin-top:6px;padding-top:8px;border-top:1px dashed var(--border);font-size:13px;color:var(--muted)}
.deliv b{color:var(--text);font-weight:500}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;min-height:32px;line-height:26px;margin:0 6px 6px 0}
.pill.active{color:var(--text);border-color:var(--text)}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;border:1px solid;font-size:12px;background:transparent;font-family:'Geist Mono',monospace}
.c-prohibited{color:#B3261E}.c-high{color:#9A6700}.c-transparency{color:#2563EB}.c-minimal{color:#2E7D4F}
[data-theme="navy"] .c-prohibited,[data-theme="dark"] .c-prohibited{color:#E57373}
[data-theme="navy"] .c-high,[data-theme="dark"] .c-high{color:#E0B04A}
[data-theme="navy"] .c-transparency,[data-theme="dark"] .c-transparency{color:#60A5FA}
[data-theme="navy"] .c-minimal,[data-theme="dark"] .c-minimal{color:#5FBF86}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;cursor:pointer}
.item h3{margin:0 0 4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:200;overflow:auto;padding:12px}
.modal.open{display:block}
.modal .card{max-width:620px;margin:20px auto}
.yn{display:flex;align-items:center;gap:10px;padding:8px 0;min-height:44px;border-bottom:1px solid var(--border)}
.yn span{flex:1;font-size:14px}
.yn input{width:24px;height:24px;flex:none;padding:0}
.result{border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px}
.result ul{margin:6px 0 0;padding-left:18px}
.warn{color:var(--amber);font-size:13px;margin-top:6px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;margin:8px 0;min-height:44px;cursor:pointer;line-height:1.4}
.opt.ok{border-color:var(--green);color:var(--green)}
.opt.ko{border-color:var(--red);color:var(--red)}
.opt[disabled]{cursor:default}
.pt{margin:14px 0 0}.pt b{display:block;font-weight:500;margin-bottom:2px}
.src a{color:var(--blue);word-break:break-word}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;display:none;z-index:300;font-size:14px;max-width:92vw}
#toast button{background:transparent;border:0;color:inherit;text-decoration:underline;margin-left:10px;cursor:pointer}
@media (max-width:520px){.header h1 .long{display:none}.page{padding:12px 12px 80px}.tab{font-size:13px}}
</style>
</head>

 en: { title: "Foundations: ML, LLMs, RAG and agents",
  intro: "Understand how these systems produce their output, so you can see where risk sits.",
  bridge: "You already assess data processing. Here you learn to read a model: its inputs (data), its probabilistic behaviour and its outputs (decisions), so you can ask data scientists the right questions.",
  action: "Pick an AI tool used around you. In five lines: which model, what data goes in and out, RAG or agent?",
  pts: [["Supervised learning", "The model learns from labelled examples (an input and the expected answer) and generalises to new cases. Its quality depends mostly on the example data, not only on the algorithm."],
   ["LLMs", "A large language model (transformer architecture) is trained to predict what comes next in a text. It produces plausible text without checking facts, which is the source of hallucinations."],
   ["RAG", "Retrieval-augmented generation adds excerpts from a document base to the question. It reduces errors without removing them, and creates other risks: document leakage, a poisoned knowledge base."],
   ["Agents", "An agent combines an LLM, tools and a decision loop to act (send a message, change a database). The wider its autonomy and access rights, the bigger the impact of a mistake."]],
  quiz: [
   { q: "Why can an LLM state something false with confidence?", o: ["It reads a wrong source in real time", "It generates statistically plausible text without checking facts", "It was designed to mislead", "It does not recognise the language of the question"], a: 1, e: "An LLM predicts the most plausible continuation of a text. Plausible is not true, hence the need for controls." },
   { q: "What does a RAG do?", o: ["It retrains the model for every question", "It replaces the model with a database", "It adds excerpts from a document base to the question", "It removes every risk of hallucination"], a: 2, e: "RAG enriches the request with retrieved documents. It reduces errors without eliminating them and brings its own risks (document access, poisoned content)." },
   { q: "What most increases the potential impact of an agent’s mistake?", o: ["Its access rights to tools and its level of autonomy", "The length of its instructions", "The name of the model used", "The interface language"], a: 0, e: "An agent acts. Its permissions and autonomy set what a mistake can cause." },
   { q: "In supervised learning, what does result quality depend on first?", o: ["The computer’s power", "The quality and representativeness of the example data", "The colour of the interface", "The number of people using the system"], a: 1, e: "The model generalises from the examples it saw: biased or unrepresentative data gives a model that fails elsewhere." }] } },

{ id: 'l2', plan: 1, gap: 1, src: [],
 fr: { title: "Le cycle de vie d’un système IA",
  intro: "Cartographier les étapes pour savoir où chaque risque peut apparaître et qui en répond.",
  bridge: "Le cycle de vie d’un système IA ressemble à celui d’un traitement : finalité, collecte, usage, conservation. Votre pratique de la protection dès la conception (art. 25 du RGPD) s’applique à chaque étape.",
  action: "Dessinez le cycle de vie d’un cas d’usage réel et marquez les trois points où le risque est le plus élevé.",
  pts: [["Cadrage et conception", "On fixe la finalité, les données nécessaires et les personnes concernées. C’est ici que se décident la plupart des risques structurants : finalité floue, données inadaptées, impact mal anticipé."],
   ["Données et entraînement", "Collecte, nettoyage, étiquetage, entraînement ou réglage fin. Provenance, base légale, qualité et biais se traitent à cette étape."],
   ["Évaluation et déploiement", "Tests avant mise en service (performance, robustesse, biais), puis intégration, supervision humaine et information des utilisateurs."],
   ["Exploitation et fin de vie", "Suivi de la dérive, journalisation, gestion des incidents, mises à jour, retrait. Un modèle performant peut se dégrader quand les données réelles s’éloignent de celles de l’entraînement."]],
  quiz: [
   { q: "À quelle étape se décident la plupart des risques structurants ?", o: ["L’exploitation", "Le cadrage et la conception", "Le retrait du système", "La rédaction du manuel utilisateur"], a: 1, e: "La finalité, les données et les personnes concernées sont fixées dès le cadrage : une erreur ici se propage à toute la suite." },
   { q: "Qu’appelle-t-on dérive (drift) ?", o: ["Un changement de fournisseur", "Une panne du serveur", "Une mise à jour de la documentation", "La dégradation des performances quand les données réelles s’éloignent de celles d’entraînement"], a: 3, e: "Le monde change : un modèle correct au lancement peut devenir moins fiable. D’où le suivi en exploitation." },
   { q: "Lequel de ces éléments relève de la phase d’exploitation ?", o: ["La définition de la finalité", "Le choix du jeu d’entraînement", "La journalisation et le suivi des incidents", "Le premier cahier des charges"], a: 2, e: "L’exploitation couvre le suivi, la journalisation et la gestion des incidents une fois le système en service." },
   { q: "Pourquoi cartographier le cycle de vie avant d’évaluer un système ?", o: ["Pour localiser où chaque risque peut apparaître et qui en est responsable", "Pour allonger le projet", "Parce que la loi impose cette forme exacte", "Pour choisir le nom du modèle"], a: 0, e: "La cartographie relie chaque risque à une étape et à un responsable, ce qui structure l’évaluation." }] },
 en: { title: "The lifecycle of an AI system",
  intro: "Map the stages to see where each risk can appear and who answers for it.",
  bridge: "The AI lifecycle resembles a processing lifecycle: purpose, collection, use, retention. Your privacy-by-design practice (GDPR Art. 25) applies at every stage.",
  action: "Draw the lifecycle of a real use case and mark the three points where risk is highest.",
  pts: [["Scoping and design", "Purpose, required data and affected people are set here. Most structural risks are decided at this stage: vague purpose, unsuitable data, impact not anticipated."],
   ["Data and training", "Collection, cleaning, labelling, training or fine-tuning. Provenance, legal basis, quality and bias are handled at this stage."],
   ["Evaluation and deployment", "Pre-release testing (performance, robustness, bias), then integration, human oversight and user information."],
   ["Operation and end of life", "Drift monitoring, logging, incident handling, updates, retirement. A model that performs well can degrade when real-world data moves away from the training data."]],
  quiz: [
   { q: "At which stage are most structural risks decided?", o: ["Operation", "Scoping and design", "System retirement", "Writing the user manual"], a: 1, e: "Purpose, data and affected people are set at scoping: a mistake here spreads to everything after." },
   { q: "What is drift?", o: ["A change of supplier", "A server outage", "A documentation update", "Performance degrading as real-world data moves away from the training data"], a: 3, e: "The world changes: a model that was fine at launch can become less reliable. Hence monitoring in operation." },
   { q: "Which of these belongs to the operation phase?", o: ["Defining the purpose", "Choosing the training set", "Logging and incident follow-up", "The first requirements document"], a: 2, e: "Operation covers monitoring, logging and incident handling once the system is in use." },
   { q: "Why map the lifecycle before assessing a system?", o: ["To see where each risk can appear and who is responsible", "To make the project longer", "Because the law requires this exact form", "To pick the model name"], a: 0, e: "The map ties each risk to a stage and an owner, which structures the assessment." }] } },

{ id: 'l3', plan: 2, gap: 1, src: [],
 fr: { title: "Données, biais et évaluation",
  intro: "Savoir d’où viennent les données et vérifier ce que vaut réellement un modèle.",
  bridge: "L’exactitude et la minimisation (art. 5 du RGPD) deviennent ici des tests mesurables. Le biais est le pendant technique de la non-discrimination.",
  action: "Prenez un modèle ou un outil et cherchez sa fiche (model card) : usage prévu, données, limites. Notez ce qui manque.",
  pts: [["Provenance et qualité", "Savoir d’où viennent les données, avec quels droits et quelles lacunes. Un jeu non représentatif donne un modèle qui échoue sur les groupes absents."],
   ["Biais", "Un biais peut venir des données (historique discriminant), du choix des variables ou de l’usage du système. Il faut mesurer la performance par sous-groupe, pas seulement en moyenne."],
   ["Évaluer", "Séparer les données d’entraînement et de test, choisir des métriques adaptées au coût des erreurs, tester la robustesse et les cas limites. Pour un LLM, évaluer aussi l’exactitude factuelle et la sensibilité à la formulation."],
   ["Documenter", "Les fiches de modèle (model cards) et de jeux de données décrivent l’usage prévu, les données, les limites et les résultats d’évaluation. Elles servent aussi de preuve de conformité."]],
  quiz: [
   { q: "Un modèle affiche 95 % de précision globale mais échoue sur un sous-groupe. Que conclure ?", o: ["Le modèle est fiable pour tous", "La moyenne masque un écart : il faut mesurer par sous-groupe", "Le sous-groupe doit être exclu des tests", "Il suffit d’augmenter la précision globale"], a: 1, e: "Une moyenne peut cacher une performance très faible sur une population donnée. L’évaluation par sous-groupe révèle ces écarts." },
   { q: "Pourquoi séparer données d’entraînement et données de test ?", o: ["Pour estimer la performance sur des données que le modèle n’a pas vues", "Pour réduire le coût de stockage", "Pour accélérer l’entraînement", "Pour éviter de documenter le modèle"], a: 0, e: "Un modèle évalué sur ses propres données d’entraînement paraît meilleur qu’il ne l’est. Des données mises de côté donnent une estimation réaliste." },
   { q: "Comment choisir la métrique d’évaluation ?", o: ["Toujours prendre la précision globale", "Prendre la métrique la plus répandue", "Selon le coût des différents types d’erreur dans l’usage visé", "Laisser le fournisseur choisir sans vérifier"], a: 2, e: "Selon l’usage, un faux négatif et un faux positif n’ont pas le même coût : la métrique doit refléter ce risque." },
   { q: "À quoi sert une fiche de modèle (model card) ?", o: ["À faire la promotion du modèle", "À remplacer les tests", "À stocker les accès", "À décrire l’usage prévu, les données, les limites et les résultats d’évaluation"], a: 3, e: "Une fiche de modèle explicite le périmètre et les limites du modèle, pour les utilisateurs comme pour les audits." }] },
 en: { title: "Data, bias and evaluation",
  intro: "Know where the data comes from and check what a model is really worth.",
  bridge: "Accuracy and minimisation (GDPR Art. 5) become measurable tests here. Bias is the technical counterpart of non-discrimination.",
  action: "Take a model or tool and look for its model card: intended use, data, limits. Note what is missing.",
  pts: [["Provenance and quality", "Know where the data comes from, under what rights and with what gaps. An unrepresentative set gives a model that fails on the missing groups."],
   ["Bias", "Bias can come from the data (a discriminatory history), from the choice of variables or from how the system is used. Measure performance by subgroup, not only on average."],
   ["Evaluating", "Separate training and test data, choose metrics that fit the cost of errors, test robustness and edge cases. For an LLM, also evaluate factual accuracy and sensitivity to wording."],
   ["Documenting", "Model cards and dataset sheets describe intended use, data, limits and evaluation results. They also serve as compliance evidence."]],
  quiz: [
   { q: "A model shows 95% overall accuracy but fails on one subgroup. What follows?", o: ["The model is reliable for everyone", "The average hides a gap: measure by subgroup", "The subgroup should be left out of testing", "Raising overall accuracy is enough"], a: 1, e: "An average can hide very poor performance on a given population. Subgroup evaluation reveals such gaps." },
   { q: "Why separate training data from test data?", o: ["To estimate performance on data the model has not seen", "To cut storage costs", "To speed up training", "To avoid documenting the model"], a: 0, e: "A model tested on its own training data looks better than it is. Held-out data gives a realistic estimate." },
   { q: "How should the evaluation metric be chosen?", o: ["Always use overall accuracy", "Use the most common metric", "According to the cost of each type of error in the intended use", "Let the supplier choose without checking"], a: 2, e: "Depending on the use, a false negative and a false positive do not cost the same: the metric must reflect that risk." },
   { q: "What is a model card for?", o: ["Promoting the model", "Replacing tests", "Storing access credentials", "Describing intended use, data, limits and evaluation results"], a: 3, e: "A model card makes the model’s scope and limits explicit, for users and for audits." }] } },

{ id: 'l4', plan: 3, gap: 1,
 src: [["HackerOne, OWASP Top 10 for LLMs 2025", "https://www.hackerone.com/blog/owasp-top-10-llms-2025-how-genai-risks-are-evolving"]],
 fr: { title: "Risques propres aux LLM (OWASP Top 10 2025)",
  intro: "Le référentiel OWASP classe les dix principaux risques des applications fondées sur des LLM.",
  bridge: "Les fuites (LLM02) recoupent votre expertise sur la sécurité du traitement (art. 32 du RGPD). L’injection de prompt est le risque nouveau à apprendre.",
  action: "Sur un outil que vous êtes autorisé à tester, essayez une injection de prompt simple cachée dans un document fictif, et notez ce qui se passe.",
  pts: [["Injection de prompt (LLM01)", "Des instructions glissées dans l’entrée ou dans un contenu externe détournent le comportement du modèle. À traiter comme un risque permanent, pas comme un bogue ponctuel."],
   ["Fuites (LLM02 et LLM07)", "Divulgation d’informations sensibles ou personnelles (LLM02) et fuite du prompt système (LLM07). Aucun secret ne doit figurer dans un prompt."],
   ["Actions et sorties (LLM05 et LLM06)", "Sortie du modèle transmise sans validation à d’autres systèmes (LLM05), et excès de fonctions, de droits ou d’autonomie (LLM06) : une erreur de texte devient une action."],
   ["Le reste de la liste", "LLM03 chaîne d’approvisionnement, LLM04 empoisonnement des données et du modèle, LLM08 faiblesses des vecteurs et embeddings, LLM09 désinformation, LLM10 consommation non maîtrisée. LLM07 à LLM10 sont signalées comme nouvelles dans la version 2025."]],
  quiz: [
   { q: "Quelle entrée occupe la première place (LLM01) de l’OWASP Top 10 for LLM 2025 ?", o: ["Prompt Injection", "Unbounded Consumption", "Misinformation", "Supply Chain"], a: 0, e: "Prompt Injection est LLM01 : des entrées conçues, directes ou via un contenu externe, manipulent le comportement du modèle." },
   { q: "Laquelle de ces entrées est signalée comme nouvelle en 2025 ?", o: ["Prompt Injection", "Sensitive Information Disclosure", "System Prompt Leakage", "Excessive Agency"], a: 2, e: "System Prompt Leakage (LLM07) fait partie des entrées signalées comme nouvelles, avec LLM08, LLM09 et LLM10." },
   { q: "Un agent dispose d’un droit de suppression alors que sa tâche est seulement de lire des fichiers. Quel risque est illustré ?", o: ["Misinformation", "Excessive Agency", "Prompt Injection", "Unbounded Consumption"], a: 1, e: "Excessive Agency (LLM06) : trop de fonctions, de droits ou d’autonomie transforment une sortie inattendue en dommage." },
   { q: "Pourquoi ne faut-il pas mettre de secret dans le prompt système ?", o: ["Il ralentit le modèle", "Il est supprimé après chaque réponse", "Il est chiffré automatiquement", "Il peut être extrait par un attaquant (fuite du prompt système)"], a: 3, e: "Un prompt système peut être extrait : identifiants ou logique sensible qui s’y trouvent peuvent être exposés." }] },
 en: { title: "LLM-specific risks (OWASP Top 10 2025)",
  intro: "The OWASP list ranks the ten main risks of applications built on LLMs.",
  bridge: "Leaks (LLM02) overlap with your expertise on security of processing (GDPR Art. 32). Prompt injection is the new risk to learn.",
  action: "On a tool you are allowed to test, try a simple prompt injection hidden in a fictional document, and note what happens.",
  pts: [["Prompt injection (LLM01)", "Instructions slipped into the input or into external content hijack the model’s behaviour. Treat it as a permanent risk, not a one-off bug."],
   ["Leaks (LLM02 and LLM07)", "Disclosure of sensitive or personal information (LLM02) and leakage of the system prompt (LLM07). No secret should appear in a prompt."],
   ["Actions and outputs (LLM05 and LLM06)", "Model output passed to other systems without validation (LLM05), and excess functions, permissions or autonomy (LLM06): a text error becomes an action."],
   ["The rest of the list", "LLM03 supply chain, LLM04 data and model poisoning, LLM08 vector and embedding weaknesses, LLM09 misinformation, LLM10 unbounded consumption. LLM07 to LLM10 are flagged as new in the 2025 version."]],
  quiz: [
   { q: "Which entry holds first place (LLM01) in the OWASP Top 10 for LLM 2025?", o: ["Prompt Injection", "Unbounded Consumption", "Misinformation", "Supply Chain"], a: 0, e: "Prompt Injection is LLM01: crafted inputs, direct or through external content, manipulate the model’s behaviour." },
   { q: "Which of these is flagged as new in 2025?", o: ["Prompt Injection", "Sensitive Information Disclosure", "System Prompt Leakage", "Excessive Agency"], a: 2, e: "System Prompt Leakage (LLM07) is among the entries flagged as new, with LLM08, LLM09 and LLM10." },
   { q: "An agent has delete rights while its task is only to read files. Which risk is this?", o: ["Misinformation", "Excessive Agency", "Prompt Injection", "Unbounded Consumption"], a: 1, e: "Excessive Agency (LLM06): too much functionality, permission or autonomy turns an unexpected output into damage." },
   { q: "Why keep secrets out of the system prompt?", o: ["It slows the model down", "It is deleted after each reply", "It is encrypted automatically", "It can be extracted by an attacker (system prompt leakage)"], a: 3, e: "System prompts can be extracted, so credentials or sensitive logic placed there can be exposed." }] } },

{ id: 'l5', plan: 3, gap: 2,
 src: [["CASRAI, NIST Govern-Map-Measure-Manage", "https://casrai.org/guides/nist-govern-map-measure-manage-framework"], ["URM Consulting, structure of ISO 42001", "https://urmconsulting.com/faq/how-is-iso-42001-structured"]],
 fr: { title: "NIST AI RMF et ISO/IEC 42001",
  intro: "Deux cadres complémentaires : l’un pour gérer le risque, l’autre pour un système de management auditable.",
  bridge: "Le NIST AI RMF et l’AIPD (art. 35 du RGPD) partagent une même logique : contexte, risques, mesures, suivi. L’ISO 42001 suit le modèle de système de management que vous connaissez avec l’ISO 27001.",
  action: "Associez Govern, Map, Measure et Manage aux étapes de votre processus actuel d’AIPD. Que vous manque-t-il ?",
  pts: [["Les quatre fonctions du NIST AI RMF", "Govern (transversale : politiques, responsabilités, culture, tiers), Map (contexte du système), Measure (évaluation avec méthodes et métriques) et Manage (priorisation, traitement, suivi, incidents)."],
   ["Comment les utiliser", "Map, Measure et Manage s’appliquent système par système ; Govern les rend reproductibles dans l’organisation. Le profil IA générative NIST AI 600-1 (juillet 2024) décline le cadre pour les risques de l’IA générative."],
   ["ISO/IEC 42001", "Norme de système de management de l’IA, bâtie sur la structure harmonisée ISO (comme l’ISO 27001). Les exigences obligatoires figurent aux articles 4 à 10."],
   ["Les annexes", "Annexe A : mesures de référence, non obligatoires, appliquées selon leur pertinence. Annexe B : guide de mise en œuvre de ces mesures. Annexe C : objectifs et sources de risque. Annexe D : usage selon les domaines ou secteurs."]],
  quiz: [
   { q: "Quelle fonction du NIST AI RMF est transversale ?", o: ["Map", "Measure", "Manage", "Govern"], a: 3, e: "Govern traverse les trois autres : politiques, responsabilités, culture et supervision des tiers." },
   { q: "Où figurent les exigences obligatoires de l’ISO/IEC 42001 ?", o: ["Dans l’annexe A", "Dans les articles 4 à 10", "Dans l’annexe D", "Dans le profil NIST AI 600-1"], a: 1, e: "Comme dans les autres normes ISO de management, les exigences figurent aux articles 4 à 10 ; les annexes les accompagnent." },
   { q: "Les mesures de l’annexe A de l’ISO/IEC 42001 sont…", o: ["Toutes obligatoires", "Réservées aux grandes entreprises", "Appliquées selon leur pertinence, sans être toutes obligatoires", "Remplacées par l’annexe D"], a: 2, e: "L’annexe A fournit des mesures de référence ; l’organisation les applique selon leur pertinence et peut définir les siennes." },
   { q: "Quelle fonction du NIST produit les preuves sur lesquelles s’appuie Manage ?", o: ["Measure", "Govern", "Map", "Aucune"], a: 0, e: "Measure évalue le système au regard des caractéristiques de fiabilité et produit les preuves que Manage utilise pour prioriser et traiter les risques." }] },
 en: { title: "NIST AI RMF and ISO/IEC 42001",
  intro: "Two complementary frameworks: one to manage risk, one for an auditable management system.",
  bridge: "NIST AI RMF and the DPIA (GDPR Art. 35) share one logic: context, risks, measures, follow-up. ISO 42001 follows the management-system model you know from ISO 27001.",
  action: "Match Govern, Map, Measure and Manage to the steps of your current DPIA process. What is missing?",
  pts: [["The four NIST AI RMF functions", "Govern (cross-cutting: policies, accountability, culture, third parties), Map (system context), Measure (evaluation with methods and metrics) and Manage (prioritising, treating, monitoring, incidents)."],
   ["How to use them", "Map, Measure and Manage apply system by system; Govern makes them repeatable across the organisation. The Generative AI Profile NIST AI 600-1 (July 2024) adapts the framework to generative AI risks."],
   ["ISO/IEC 42001", "An AI management system standard built on the ISO harmonised structure (like ISO 27001). The mandatory requirements sit in clauses 4 to 10."],
   ["The annexes", "Annex A: reference controls, not mandatory, applied according to relevance. Annex B: implementation guidance for those controls. Annex C: objectives and risk sources. Annex D: use across domains or sectors."]],
  quiz: [
   { q: "Which NIST AI RMF function is cross-cutting?", o: ["Map", "Measure", "Manage", "Govern"], a: 3, e: "Govern runs underneath the other three: policies, accountability, culture and third-party oversight." },
   { q: "Where are the mandatory requirements of ISO/IEC 42001?", o: ["In Annex A", "In clauses 4 to 10", "In Annex D", "In the NIST AI 600-1 profile"], a: 1, e: "As in other ISO management system standards, the requirements are in clauses 4 to 10; the annexes support them." },
   { q: "The controls in Annex A of ISO/IEC 42001 are…", o: ["All mandatory", "Reserved for large companies", "Applied according to relevance, not all mandatory", "Replaced by Annex D"], a: 2, e: "Annex A gives reference controls; organisations apply them according to relevance and may define their own." },
   { q: "Which NIST function produces the evidence Manage acts on?", o: ["Measure", "Govern", "Map", "None"], a: 0, e: "Measure evaluates the system against trustworthiness characteristics and produces the evidence Manage uses to prioritise and treat risks." }] } },

{ id: 'l6', plan: 4, gap: 2,
 src: [["European Commission, GPAI obligations under the AI Act", "https://digital-strategy.ec.europa.eu/en/factpages/general-purpose-ai-obligations-under-ai-act"], ["Spicy Advisory, Digital Omnibus : ce qui change", "https://spicyadvisory.com/fr/blog/digital-omnibus-ai-act-2026-what-changed"], ["Tech Insider, report de l’AI Act", "https://tech-insider.org/fr/ai-act-report-2026/"]],
 fr: { title: "GPAI, fournisseurs et calendrier de l’AI Act",
  intro: "Savoir ce que doit un fournisseur de modèle à usage général, et ce que le déployeur doit lui demander.",
  bridge: "Comme pour la sous-traitance RGPD, le déployeur doit obtenir de son fournisseur la documentation et des garanties contractuelles, et qualifier le rôle de chaque partie.",
  action: "Pour un fournisseur d’IA réel, listez les documents à lui demander et vérifiez ce qu’il publie déjà.",
  pts: [["Obligations de base des fournisseurs de GPAI", "Documentation technique, politique de respect du droit d’auteur et résumé public des données d’entraînement (selon un modèle publié par la Commission). Elles s’appliquent depuis le 2 août 2025."],
   ["Risque systémique", "Un modèle est présumé à risque systémique au-delà de 10^25 FLOP de calcul d’entraînement (seuil en cours de révision selon la Commission). S’ajoutent : notification à la Commission, évaluation et atténuation des risques, signalement des incidents, cybersécurité."],
   ["Code de bonnes pratiques", "Outil volontaire jugé adéquat par la Commission et les États membres pour démontrer la conformité. Les chapitres Transparence et Droit d’auteur concernent tous les fournisseurs ; le chapitre Sécurité concerne le risque systémique."],
   ["Calendrier après le Digital Omnibus", "Le règlement (UE) 2026/1744 reporte le haut risque de l’annexe III au 2 décembre 2027 et celui de l’annexe I au 2 août 2028. Il ne reporte ni l’article 50 (transparence, 2 août 2026) ni le régime GPAI."],
   ["Côté déployeur", "Qualifier son rôle (fournisseur ou déployeur), demander la documentation du fournisseur, contractualiser les engagements et surveiller l’usage réel."]],
  quiz: [
   { q: "Au-delà de quel calcul d’entraînement un modèle est-il présumé à risque systémique ?", o: ["10^20 FLOP", "10^23 FLOP", "10^25 FLOP", "10^30 FLOP"], a: 2, e: "L’AI Act fixe la présomption à 10^25 FLOP ; 10^23 FLOP sert, dans les lignes directrices de la Commission, à qualifier un modèle de GPAI. Le seuil de risque systémique est en cours de révision." },
   { q: "Quelle obligation s’impose à tout fournisseur de GPAI ?", o: ["Notifier la Commission avant chaque mise à jour", "Publier un résumé des données d’entraînement", "Obtenir une certification ISO 42001", "Fournir le code source du modèle"], a: 1, e: "Obligations de base : documentation technique, politique de droit d’auteur et résumé public des données d’entraînement." },
   { q: "Le Digital Omnibus a-t-il reporté l’article 50 (transparence) ?", o: ["Oui, au 2 décembre 2027", "Oui, au 2 août 2028", "Non, il reste applicable au 2 août 2026", "Il l’a supprimé"], a: 2, e: "Le report concerne les obligations du haut risque. La transparence de l’article 50 s’applique toujours le 2 août 2026." },
   { q: "Le code de bonnes pratiques GPAI est…", o: ["Obligatoire pour tous", "Réservé aux déployeurs", "Abrogé par le Digital Omnibus", "Un outil volontaire pour démontrer la conformité"], a: 3, e: "Il est volontaire, mais la Commission et les États membres l’ont jugé adéquat pour démontrer la conformité." }] },
 en: { title: "GPAI, suppliers and the AI Act timeline",
  intro: "Know what a general-purpose model provider owes, and what the deployer should ask for.",
  bridge: "As with GDPR subcontracting, the deployer must obtain documentation and contractual guarantees from the supplier, and qualify each party’s role.",
  action: "For a real AI supplier, list the documents to request from them and check what they already publish.",
  pts: [["Baseline obligations for GPAI providers", "Technical documentation, a copyright compliance policy and a public summary of training data (using a template published by the Commission). They apply from 2 August 2025."],
   ["Systemic risk", "A model is presumed to pose systemic risk above 10^25 FLOP of training compute (threshold under review, per the Commission). Added duties: notify the Commission, assess and mitigate risks, report incidents, ensure cybersecurity."],
   ["Code of Practice", "A voluntary tool the Commission and Member States found adequate to show compliance. The Transparency and Copyright chapters concern all providers; the Safety and Security chapter concerns systemic risk."],
   ["Timeline after the Digital Omnibus", "Regulation (EU) 2026/1744 postpones Annex III high-risk to 2 December 2027 and Annex I to 2 August 2028. It postpones neither Article 50 (transparency, 2 August 2026) nor the GPAI regime."],
   ["On the deployer side", "Qualify your role (provider or deployer), request the supplier’s documentation, contract for commitments and monitor real use."]],
  quiz: [
   { q: "Above what training compute is a model presumed to pose systemic risk?", o: ["10^20 FLOP", "10^23 FLOP", "10^25 FLOP", "10^30 FLOP"], a: 2, e: "The AI Act sets the presumption at 10^25 FLOP; 10^23 FLOP is used in the Commission’s guidelines to qualify a model as GPAI. The systemic-risk threshold is under review." },
   { q: "Which obligation applies to every GPAI provider?", o: ["Notify the Commission before each update", "Publish a summary of the training data", "Obtain ISO 42001 certification", "Supply the model’s source code"], a: 1, e: "Baseline duties: technical documentation, copyright policy and a public training-data summary." },
   { q: "Did the Digital Omnibus postpone Article 50 (transparency)?", o: ["Yes, to 2 December 2027", "Yes, to 2 August 2028", "No, it still applies on 2 August 2026", "It removed it"], a: 2, e: "The postponement concerns high-risk obligations. Article 50 transparency still applies on 2 August 2026." },
   { q: "The GPAI Code of Practice is…", o: ["Mandatory for everyone", "Reserved for deployers", "Repealed by the Digital Omnibus", "A voluntary tool to show compliance"], a: 3, e: "It is voluntary, but the Commission and Member States found it an adequate way to demonstrate compliance." }] } },

{ id: 'l7', plan: 6, gap: 3, src: [],
 fr: { title: "Mettre en place le dispositif de gouvernance IA",
  intro: "Passer de l’expertise au dispositif en fonctionnement : c’est ce qui distingue un poste de direction.",
  bridge: "Vous avez déjà construit un registre des traitements et un comité de pilotage. Un registre des systèmes IA et un comité de gouvernance IA suivent le même principe, avec une classification de risque en plus.",
  action: "Saisissez un premier cas d’usage réel dans l’onglet Cas et classez-le.",
  pts: [["Inventaire des systèmes IA", "Point de départ de tout dispositif : on ne gouverne pas ce que l’on ne voit pas. L’inventaire recense chaque cas d’usage, son porteur, son fournisseur, ses données et sa classification (onglet Cas de cette app). Il inclut les usages non déclarés (shadow AI)."],
   ["Admission et validation", "Un cas d’usage passe par une fiche d’intake, une classification, puis une validation proportionnée au risque : déclaration pour le risque minimal, comité pour le haut risque."],
   ["Rôles et comité", "Définir qui décide, qui conseille et qui contrôle : sponsor exécutif, responsable de la gouvernance IA, juridique et DPO, sécurité, métiers. Un comité au mandat clair évite de tout bloquer comme de tout laisser passer."],
   ["Piloter et convaincre", "Quelques indicateurs suffisent : part des systèmes inventoriés, délai de validation, incidents, actions en retard. Le discours à la direction relie la conformité à la confiance, à la vitesse d’adoption et à la réduction du risque."]],
  quiz: [
   { q: "Quel est le point de départ d’un dispositif de gouvernance IA ?", o: ["Rédiger la charte éthique", "Inventorier les systèmes et cas d’usage IA, y compris non déclarés", "Acheter un outil de conformité", "Former le comité de direction"], a: 1, e: "On ne gouverne pas ce que l’on ne voit pas : l’inventaire passe en premier, y compris le shadow AI." },
   { q: "Comment proportionner la validation d’un cas d’usage ?", o: ["Même comité pour tous", "Selon le budget du projet", "Selon la classification de risque : simple déclaration pour le risque minimal, comité pour le haut risque", "Selon l’ancienneté du porteur"], a: 2, e: "Une validation proportionnée garde les usages à faible risque rapides et concentre l’examen là où le préjudice est le plus grand." },
   { q: "Qu’est-ce que le shadow AI ?", o: ["Un type de modèle propriétaire", "Un audit externe", "Une IA de cybersécurité", "Des outils d’IA adoptés par des équipes en dehors de tout cadre validé"], a: 3, e: "Le shadow AI est l’usage d’outils d’IA hors de tout cadre validé ; l’inventaire et des règles claires le réduisent." },
   { q: "Quel indicateur est pertinent pour piloter le dispositif ?", o: ["Part des systèmes IA inventoriés et classés", "Nombre de pages de politique rédigées", "Nombre de réunions tenues", "Taille de l’équipe"], a: 0, e: "La couverture de l’inventaire et de la classification montre quelle part du parc IA est réellement gouvernée." }] },
 en: { title: "Setting up the AI governance system",
  intro: "Moving from expertise to a working system is what distinguishes a leadership role.",
  bridge: "You have already built a record of processing and a steering committee. An AI system register and an AI governance committee follow the same principle, with a risk classification on top.",
  action: "Enter a first real use case in the Cases tab and classify it.",
  pts: [["AI system inventory", "The starting point of any system: you cannot govern what you cannot see. The inventory lists each use case, its owner, supplier, data and classification (the Cases tab of this app). It includes undeclared use (shadow AI)."],
   ["Intake and approval", "A use case goes through an intake form, a classification, then an approval proportionate to risk: a declaration for minimal risk, a committee for high risk."],
   ["Roles and committee", "Define who decides, who advises and who checks: executive sponsor, AI governance lead, legal and DPO, security, business owners. A committee with a clear mandate avoids blocking everything as well as letting everything through."],
   ["Steering and persuading", "A few indicators are enough: share of systems inventoried, approval lead time, incidents, overdue actions. The message to management ties compliance to trust, adoption speed and risk reduction."]],
  quiz: [
   { q: "What is the starting point of an AI governance system?", o: ["Writing the ethics charter", "Inventorying AI systems and use cases, including undeclared ones", "Buying a compliance tool", "Training the executive committee"], a: 1, e: "You cannot govern what you cannot see: the inventory comes first, including shadow AI." },
   { q: "How should approval be proportioned?", o: ["Same committee for everything", "By project budget", "By risk classification: a simple declaration for minimal risk, a committee for high risk", "By the owner’s seniority"], a: 2, e: "Proportionate approval keeps low-risk uses fast and concentrates scrutiny where harm is greatest." },
   { q: "What is shadow AI?", o: ["A proprietary model type", "An external audit", "A cybersecurity AI", "AI tools adopted by teams outside any approved framework"], a: 3, e: "Shadow AI is use of AI tools outside any validated framework; the inventory and clear rules reduce it." },
   { q: "Which indicator is relevant for steering the system?", o: ["Share of AI systems inventoried and classified", "Pages of policy written", "Number of meetings held", "Size of the team"], a: 0, e: "Coverage of the inventory and classification shows how much of the AI estate is actually under governance." }] } },

{ id: 'l8', plan: 4, gap: 2,
 src: [["AI Act Service Desk, Article 5 (prohibited practices)", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5"], ["AI Act Service Desk, Article 99 (penalties)", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-99"], ["AI Act Service Desk, Article 25 (value chain)", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-25"], ["AI Act Service Desk, Article 4 (AI literacy)", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-4"]],
 fr: { title: "AI Act : architecture, rôles, interdictions et sanctions",
  intro: "Comprendre la logique du texte : une approche par les risques où les obligations dépendent du niveau du système et du rôle de l’organisation.",
  bridge: "Comme le RGPD distingue responsable de traitement et sous-traitant, l’AI Act distingue fournisseur et déployeur. Et comme le RGPD, il prévoit des sanctions proportionnées au chiffre d’affaires.",
  action: "Listez cinq outils d’IA utilisés dans une organisation que vous connaissez. Pour chacun, indiquez le niveau de risque probable et le rôle (fournisseur ou déployeur).",
  pts: [["Quatre niveaux de risque", "Pratiques interdites, systèmes à haut risque, obligations de transparence (article 50) et risque minimal. Les modèles d’IA à usage général relèvent d’un régime à part."],
   ["Pratiques interdites (article 5)", "Dix familles, notamment : manipulation nuisible, exploitation de vulnérabilités, scoring social, prédiction du risque criminel fondée seulement sur le profilage, moissonnage non ciblé d’images faciales, inférence des émotions au travail et à l’école (sauf raisons médicales ou de sécurité), catégorisation biométrique de traits sensibles, identification biométrique à distance en temps réel dans l’espace public par les forces de l’ordre (exceptions étroites). Deux interdictions s’ajoutent à partir du 2 décembre 2026 : les images sexuellement explicites d’une personne identifiable sans consentement, et les contenus pédopornographiques générés ou manipulés."],
   ["Fournisseur ou déployeur", "Le fournisseur met le système sur le marché ; le déployeur l’utilise. Selon l’article 25, un déployeur ou un tiers devient fournisseur d’un système à haut risque s’il y appose son nom ou sa marque, le modifie substantiellement, ou change la finalité d’un système (y compris à usage général) de sorte qu’il devienne à haut risque."],
   ["Sanctions (article 99)", "Jusqu’à 35 M€ ou 7 % du chiffre d’affaires mondial pour les pratiques interdites ; 15 M€ ou 3 % pour la plupart des autres obligations, dont la transparence de l’article 50 ; 7,5 M€ ou 1 % pour des informations inexactes aux autorités. Pour une entreprise, le montant le plus élevé s’applique ; pour les PME, le plus bas."],
   ["Maîtrise de l’IA (article 4)", "Fournisseurs et déployeurs doivent prendre des mesures pour développer la maîtrise de l’IA de leur personnel, selon les connaissances, le contexte d’usage et les personnes concernées. Le texte précise qu’ils n’ont pas à garantir un niveau précis à chaque individu. Le Digital Omnibus a modifié cet article."]],
  quiz: [
   { q: "Quel est le plafond d’amende pour une pratique interdite (article 5) ?", o: ["7,5 M€ ou 1 %", "15 M€ ou 3 %", "35 M€ ou 7 % du chiffre d’affaires mondial", "20 M€ ou 4 %"], a: 2, e: "L’article 99 fixe 35 M€ ou 7 % pour les pratiques interdites. Les 20 M€ ou 4 % sont ceux du RGPD : ne pas confondre." },
   { q: "Quand un déployeur devient-il fournisseur d’un système à haut risque ?", o: ["Dès qu’il l’utilise", "S’il y appose son nom, le modifie substantiellement ou change sa finalité pour le rendre à haut risque", "Seulement s’il est établi hors de l’UE", "Jamais"], a: 1, e: "Article 25 : marque, modification substantielle ou changement de finalité font basculer vers le rôle de fournisseur, avec ses obligations." },
   { q: "Laquelle de ces pratiques relève de l’article 5 ?", o: ["Un chatbot de service client", "L’inférence des émotions des salariés au travail, hors raisons médicales ou de sécurité", "Un filtre antispam", "Un moteur de recommandation de films"], a: 1, e: "L’inférence des émotions au travail et dans l’éducation est interdite, sauf raisons médicales ou de sécurité." },
   { q: "L’article 4 impose aux fournisseurs et déployeurs de…", o: ["Garantir un niveau précis de maîtrise de l’IA à chaque salarié", "Former uniquement les juristes", "Prendre des mesures pour développer la maîtrise de l’IA de leur personnel, selon le contexte", "Faire certifier chaque employé"], a: 2, e: "Il s’agit de mesures adaptées au contexte, sans garantie d’un niveau précis pour chaque personne." }] },
 en: { title: "AI Act: architecture, roles, prohibitions and penalties",
  intro: "Understand the logic of the text: a risk-based approach where obligations depend on the level of the system and the organisation’s role.",
  bridge: "As GDPR distinguishes controller and processor, the AI Act distinguishes provider and deployer. And like GDPR, it sets penalties scaled to turnover.",
  action: "List five AI tools used in an organisation you know. For each, give the likely risk level and the role (provider or deployer).",
  pts: [["Four risk levels", "Prohibited practices, high-risk systems, transparency obligations (Article 50) and minimal risk. General-purpose AI models fall under a separate regime."],
   ["Prohibited practices (Article 5)", "Ten families, notably: harmful manipulation, exploiting vulnerabilities, social scoring, predicting criminal risk solely from profiling, untargeted scraping of facial images, inferring emotions at work and in education (except medical or safety reasons), biometric categorisation of sensitive traits, real-time remote biometric identification in public spaces for law enforcement (narrow exceptions). Two prohibitions are added from 2 December 2026: sexually explicit images of an identifiable person without consent, and generated or manipulated child sexual abuse material."],
   ["Provider or deployer", "The provider places the system on the market; the deployer uses it. Under Article 25, a deployer or third party becomes the provider of a high-risk system if it puts its own name or trademark on it, substantially modifies it, or changes the purpose of a system (including a general-purpose one) so that it becomes high-risk."],
   ["Penalties (Article 99)", "Up to €35 million or 7% of worldwide turnover for prohibited practices; €15 million or 3% for most other obligations, including Article 50 transparency; €7.5 million or 1% for incorrect information to authorities. For a company the higher amount applies; for SMEs, the lower."],
   ["AI literacy (Article 4)", "Providers and deployers must take measures to develop the AI literacy of their staff, according to knowledge, context of use and the people affected. The text states they need not guarantee a specific level for each individual. The Digital Omnibus amended this article."]],
  quiz: [
   { q: "What is the maximum fine for a prohibited practice (Article 5)?", o: ["€7.5 million or 1%", "€15 million or 3%", "€35 million or 7% of worldwide turnover", "€20 million or 4%"], a: 2, e: "Article 99 sets €35 million or 7% for prohibited practices. €20 million or 4% are GDPR figures: do not confuse them." },
   { q: "When does a deployer become the provider of a high-risk system?", o: ["As soon as it uses it", "If it puts its name on it, substantially modifies it or changes its purpose so that it becomes high-risk", "Only if it is established outside the EU", "Never"], a: 1, e: "Article 25: trademark, substantial modification or change of purpose shift you into the provider role, with its obligations." },
   { q: "Which of these falls under Article 5?", o: ["A customer service chatbot", "Inferring employees’ emotions at work, outside medical or safety reasons", "A spam filter", "A film recommendation engine"], a: 1, e: "Inferring emotions in the workplace and in education is prohibited, except for medical or safety reasons." },
   { q: "Article 4 requires providers and deployers to…", o: ["Guarantee a specific AI literacy level for each employee", "Train only lawyers", "Take measures to develop their staff’s AI literacy, according to context", "Have every employee certified"], a: 2, e: "These are context-appropriate measures, with no guarantee of a specific level for each person." }] } },

{ id: 'l9', plan: 4, gap: 2,
 src: [["AI Act Service Desk, Article 6 (classification)", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-6"], ["AI Act Service Desk, Article 26 (deployers)", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-26"], ["AI Act Service Desk, Article 27 (fundamental rights impact assessment)", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-27"], ["Spicy Advisory, Digital Omnibus : ce qui change", "https://spicyadvisory.com/fr/blog/digital-omnibus-ai-act-2026-what-changed"]],
 fr: { title: "AI Act : systèmes à haut risque et obligations",
  intro: "Savoir classer un système, puis distinguer ce que doit faire le fournisseur et ce que doit faire le déployeur.",
  bridge: "Les obligations du déployeur ressemblent à celles d’un responsable de traitement : respecter la notice, superviser, informer, tenir des journaux. L’article 26 renvoie d’ailleurs lui-même à l’AIPD.",
  action: "Prenez un cas d’usage de tri de CV : relève-t-il de l’annexe III ? Listez ce que doit faire le fournisseur et ce que doit faire le client déployeur.",
  pts: [["Deux voies de classification (article 6)", "Un système est à haut risque soit parce qu’il est un composant de sécurité d’un produit de l’annexe I soumis à une évaluation par un tiers, soit parce qu’il relève d’un cas d’usage de l’annexe III."],
   ["La dérogation de l’article 6(3)", "Un système de l’annexe III n’est pas à haut risque s’il ne présente pas de risque important pour la santé, la sécurité ou les droits fondamentaux, par exemple s’il accomplit une tâche procédurale étroite ou préparatoire. Le fournisseur doit documenter cette analyse avant la mise sur le marché et l’enregistrer. Mais un système de l’annexe III qui réalise du profilage de personnes est toujours à haut risque."],
   ["Obligations du fournisseur", "Gestion des risques, gouvernance des données, documentation technique, journalisation, information des déployeurs, contrôle humain, exactitude, robustesse et cybersécurité, puis évaluation de conformité."],
   ["Obligations du déployeur (article 26)", "Utiliser le système selon la notice ; confier la supervision humaine à des personnes compétentes ; veiller à la pertinence des données d’entrée qu’il maîtrise ; surveiller et informer le fournisseur ; signaler les incidents graves ; conserver les journaux au moins six mois ; informer les représentants des travailleurs et les salariés avant un usage au travail ; informer les personnes concernées pour les systèmes de l’annexe III qui décident ou aident à décider."],
   ["Analyse d’impact sur les droits fondamentaux (article 27)", "Certains déployeurs doivent la réaliser avant le premier déploiement : organismes de droit public, entités privées fournissant des services publics, et déployeurs de certains systèmes de l’annexe III (points 5 b et c). Elle peut reprendre des parties d’une AIPD mais reste une obligation distincte."],
   ["Calendrier", "Après le Digital Omnibus, les obligations haut risque de l’annexe III s’appliquent au 2 décembre 2027 et celles de l’annexe I au 2 août 2028."]],
  quiz: [
   { q: "Un système de l’annexe III qui réalise du profilage de personnes est…", o: ["Exempté par l’article 6(3)", "Toujours considéré comme à haut risque", "À risque minimal", "Interdit"], a: 1, e: "L’article 6 précise que le profilage de personnes dans l’annexe III est toujours à haut risque, malgré la dérogation." },
   { q: "Pendant combien de temps minimum un déployeur conserve-t-il les journaux sous son contrôle ?", o: ["30 jours", "Un an", "Cinq ans", "Au moins six mois"], a: 3, e: "L’article 26 prévoit au moins six mois, sauf autre loi applicable." },
   { q: "L’analyse d’impact sur les droits fondamentaux (article 27) est…", o: ["Identique à l’AIPD et la remplace", "Réservée aux fournisseurs", "Une obligation distincte de certains déployeurs, qui peut reprendre des éléments d’une AIPD", "Supprimée par le Digital Omnibus"], a: 2, e: "Elle est distincte, mais un dossier bien construit peut alimenter les deux, comme le prévoit l’article 27." },
   { q: "À quelle date s’appliquent les obligations haut risque de l’annexe III après le Digital Omnibus ?", o: ["2 août 2026", "2 décembre 2027", "2 août 2028", "1er janvier 2030"], a: 1, e: "Le règlement 2026/1744 les reporte au 2 décembre 2027 ; l’annexe I passe au 2 août 2028." }] },
 en: { title: "AI Act: high-risk systems and obligations",
  intro: "Know how to classify a system, then tell what the provider must do from what the deployer must do.",
  bridge: "A deployer’s duties resemble a controller’s: follow the instructions, supervise, inform, keep logs. Article 26 itself points to the DPIA.",
  action: "Take a CV-screening use case: is it Annex III? List what the provider must do and what the deploying client must do.",
  pts: [["Two classification routes (Article 6)", "A system is high-risk either because it is a safety component of an Annex I product subject to third-party assessment, or because it falls under an Annex III use case."],
   ["The Article 6(3) derogation", "An Annex III system is not high-risk if it poses no significant risk to health, safety or fundamental rights, for example if it performs a narrow procedural or preparatory task. The provider must document this assessment before placing it on the market and register it. But an Annex III system that profiles natural persons is always high-risk."],
   ["Provider obligations", "Risk management, data governance, technical documentation, logging, information to deployers, human oversight, accuracy, robustness and cybersecurity, then conformity assessment."],
   ["Deployer obligations (Article 26)", "Use the system per its instructions; assign human oversight to competent people; ensure input data it controls is relevant; monitor and inform the provider; report serious incidents; keep logs at least six months; inform workers’ representatives and workers before workplace use; inform affected people for Annex III systems that make or assist decisions."],
   ["Fundamental rights impact assessment (Article 27)", "Some deployers must carry it out before first deployment: public bodies, private entities providing public services, and deployers of certain Annex III systems (points 5(b) and (c)). It may reuse parts of a DPIA but remains a separate duty."],
   ["Timeline", "After the Digital Omnibus, Annex III high-risk obligations apply from 2 December 2027 and Annex I from 2 August 2028."]],
  quiz: [
   { q: "An Annex III system that profiles natural persons is…", o: ["Exempted by Article 6(3)", "Always considered high-risk", "Minimal risk", "Prohibited"], a: 1, e: "Article 6 states that profiling of persons under Annex III is always high-risk, despite the derogation." },
   { q: "For how long at minimum must a deployer keep logs under its control?", o: ["30 days", "One year", "Five years", "At least six months"], a: 3, e: "Article 26 requires at least six months, unless other law provides otherwise." },
   { q: "The fundamental rights impact assessment (Article 27) is…", o: ["The same as the DPIA and replaces it", "Reserved for providers", "A separate duty of some deployers that can reuse elements of a DPIA", "Removed by the Digital Omnibus"], a: 2, e: "It is distinct, but a well-built file can feed both, as Article 27 allows." },
   { q: "When do Annex III high-risk obligations apply after the Digital Omnibus?", o: ["2 August 2026", "2 December 2027", "2 August 2028", "1 January 2030"], a: 1, e: "Regulation 2026/1744 postpones them to 2 December 2027; Annex I moves to 2 August 2028." }] } },

{ id: 'l10', plan: 2, gap: 2,
 src: [["GDPR Article 22 (gdpr-info.eu)", "https://gdpr-info.eu/art-22-gdpr/"], ["GDPR Article 83 (gdpr-info.eu)", "https://gdpr-info.eu/art-83-gdpr/"], ["AI Act Service Desk, Article 26", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-26"], ["AI Act Service Desk, Article 27", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-27"]],
 fr: { title: "RGPD et IA : décisions automatisées, AIPD et sanctions",
  intro: "Relier vos outils RGPD (article 22, AIPD) à l’AI Act, pour traiter un cas d’usage IA dans un seul dossier cohérent.",
  bridge: "C’est votre terrain : l’article 22 et l’AIPD existent depuis 2018. Le nouveau réflexe consiste à relier chaque cas d’usage IA à ces deux outils et à l’AI Act dans un même dossier.",
  action: "Prenez un scoring ou un tri automatisé que vous connaissez : relève-t-il de l’article 22 ? Quelles garanties sont en place ?",
  pts: [["Article 22 : décision automatisée", "La personne a le droit de ne pas faire l’objet d’une décision fondée uniquement sur un traitement automatisé, profilage compris, produisant des effets juridiques ou l’affectant de manière significative. Trois exceptions : nécessité contractuelle, loi autorisant avec garanties, consentement explicite."],
   ["Garanties à prévoir", "Pour le contrat et le consentement : au minimum une intervention humaine, la possibilité d’exprimer son point de vue et de contester la décision. Pas de décision fondée sur des données sensibles, sauf consentement explicite ou intérêt public important avec garanties."],
   ["AIPD et AI Act", "L’article 26 de l’AI Act demande au déployeur d’utiliser les informations du fournisseur pour son AIPD. L’article 27 permet de reprendre des éléments de l’AIPD dans l’analyse d’impact sur les droits fondamentaux. Un dossier bien construit alimente les deux."],
   ["Sanctions RGPD (article 83)", "Deux paliers : jusqu’à 10 M€ ou 2 % du chiffre d’affaires mondial (notamment les obligations des articles 25 à 39 : protection dès la conception, sécurité, AIPD) ; jusqu’à 20 M€ ou 4 % (principes de l’article 5, bases légales, droits des personnes, transferts hors UE). Le montant le plus élevé s’applique."],
   ["Deux textes, deux logiques", "Le RGPD s’applique dès qu’il y a des données personnelles, quel que soit le niveau de risque IA. Être conforme à l’AI Act ne vaut pas conformité au RGPD, et inversement."]],
  quiz: [
   { q: "Que prévoit l’article 22 du RGPD ?", o: ["L’interdiction de tout algorithme", "Le droit de ne pas faire l’objet d’une décision fondée uniquement sur un traitement automatisé ayant des effets significatifs, sous réserve d’exceptions", "Le droit d’obtenir le code source", "Un droit à l’effacement automatique"], a: 1, e: "L’article 22 protège contre les décisions purement automatisées à effets significatifs, avec trois exceptions encadrées." },
   { q: "Quelles garanties minimales pour une décision automatisée fondée sur le contrat ou le consentement ?", o: ["Aucune", "Un audit annuel externe", "Intervention humaine, possibilité d’exprimer son point de vue et de contester la décision", "Une certification ISO"], a: 2, e: "Ces trois garanties sont le socle exigé par l’article 22 pour ces deux exceptions." },
   { q: "Quel plafond RGPD s’applique à la violation des principes de l’article 5 ?", o: ["10 M€ ou 2 %", "20 M€ ou 4 %", "35 M€ ou 7 %", "5 M€ ou 1 %"], a: 1, e: "L’article 83(5) vise les principes, bases légales, droits des personnes et transferts : 20 M€ ou 4 %. Les 35 M€ ou 7 % sont ceux de l’AI Act pour les pratiques interdites." },
   { q: "Comment l’AIPD sert-elle l’AI Act ?", o: ["Elle n’a aucun lien", "Elle remplace l’évaluation de conformité du fournisseur", "Elle est interdite pour les systèmes à haut risque", "Elle peut être reprise en partie dans l’analyse d’impact sur les droits fondamentaux, et s’appuie sur les informations du fournisseur"], a: 3, e: "Les articles 26 et 27 de l’AI Act organisent cette articulation avec l’AIPD." }] },
 en: { title: "GDPR and AI: automated decisions, DPIA and penalties",
  intro: "Link your GDPR tools (Article 22, DPIA) to the AI Act, to handle an AI use case in one coherent file.",
  bridge: "This is your ground: Article 22 and the DPIA have existed since 2018. The new reflex is to link each AI use case to these two tools and to the AI Act in one file.",
  action: "Take an automated scoring or triage you know: does it fall under Article 22? What safeguards are in place?",
  pts: [["Article 22: automated decisions", "People have the right not to be subject to a decision based solely on automated processing, including profiling, that produces legal effects or similarly significantly affects them. Three exceptions: contractual necessity, authorising law with safeguards, explicit consent."],
   ["Safeguards to provide", "For contract and consent: at least human intervention, the ability to express a point of view and to contest the decision. No decisions based on special category data, except with explicit consent or substantial public interest with safeguards."],
   ["DPIA and the AI Act", "AI Act Article 26 asks the deployer to use the provider’s information for its DPIA. Article 27 allows elements of the DPIA to be reused in the fundamental rights impact assessment. A well-built file feeds both."],
   ["GDPR penalties (Article 83)", "Two tiers: up to €10 million or 2% of worldwide turnover (notably obligations in Articles 25 to 39: privacy by design, security, DPIA); up to €20 million or 4% (Article 5 principles, legal bases, data subject rights, transfers outside the EU). The higher amount applies."],
   ["Two texts, two logics", "GDPR applies whenever personal data is involved, whatever the AI risk level. AI Act compliance does not equal GDPR compliance, and vice versa."]],
  quiz: [
   { q: "What does GDPR Article 22 provide?", o: ["A ban on all algorithms", "The right not to be subject to a decision based solely on automated processing with significant effects, subject to exceptions", "The right to obtain the source code", "An automatic right to erasure"], a: 1, e: "Article 22 protects against purely automated decisions with significant effects, with three framed exceptions." },
   { q: "What minimum safeguards apply to an automated decision based on contract or consent?", o: ["None", "An annual external audit", "Human intervention, the ability to express a point of view and to contest the decision", "An ISO certification"], a: 2, e: "These three safeguards are the floor Article 22 requires for those two exceptions." },
   { q: "Which GDPR ceiling applies to breaching the Article 5 principles?", o: ["€10 million or 2%", "€20 million or 4%", "€35 million or 7%", "€5 million or 1%"], a: 1, e: "Article 83(5) covers principles, legal bases, data subject rights and transfers: €20 million or 4%. €35 million or 7% is the AI Act figure for prohibited practices." },
   { q: "How does the DPIA serve the AI Act?", o: ["It has no link", "It replaces the provider’s conformity assessment", "It is forbidden for high-risk systems", "It can be partly reused in the fundamental rights impact assessment, and relies on the provider’s information"], a: 3, e: "AI Act Articles 26 and 27 set up this link with the DPIA." }] } },

{ id: 'l11', plan: 3, gap: 2,
 src: [["CMS, EDPB Opinion 28/2024: key takeaways", "https://cms.law/en/int/legal-updates/edpb-opinion-28-2024-key-takeaways-on-processing-personal-data-in-the-context-of-ai-models"]],
 fr: { title: "RGPD et entraînement des modèles (avis EDPB 28/2024)",
  intro: "Savoir poser les bonnes questions sur les données d’entraînement, qui sont le point de contact entre RGPD et IA générative.",
  bridge: "Vous connaissez les bases légales et le test de mise en balance de l’intérêt légitime. Le nouveau point : les appliquer à l’entraînement, avec un modèle qui peut mémoriser des données.",
  action: "Pour un modèle utilisé par un client, rédigez cinq questions à poser au fournisseur sur les données d’entraînement.",
  pts: [["Anonymat d’un modèle", "Il s’apprécie au cas par cas. La probabilité d’extraire des données personnelles de l’entraînement, directement ou par déduction probabiliste, doit être négligeable, et celle d’en obtenir par des requêtes, même involontaires, insignifiante. On tient compte des moyens raisonnablement utilisables."],
   ["Intérêt légitime", "L’article 6(1)(f) n’est pas une base par défaut. Le responsable doit démontrer, par un test en trois étapes, que le traitement est proportionné, nécessaire et efficace. Comptent les attentes raisonnables des personnes et les mesures d’atténuation : pseudonymisation ou données synthétiques, transparence allant au-delà des articles 13 et 14, droit d’opposition dès le départ."],
   ["Illicéité en phase de développement", "Un traitement illicite pendant le développement peut affecter la licéité du traitement ultérieur ou de l’exploitation du modèle (articles 5(1)(a) et 6). Les autorités peuvent infliger des amendes, limiter temporairement le traitement, ordonner l’effacement de tout ou partie du jeu de données ou le réentraînement du modèle."],
   ["Côté déployeur", "Avant d’acheter ou d’intégrer un modèle, demander au fournisseur comment les données d’entraînement ont été obtenues, sur quelle base légale, et si le modèle est considéré comme anonyme. L’avis ne dit pas comment ces obligations se répartissent avec l’AI Act : cela se juge au cas par cas."]],
  quiz: [
   { q: "L’intérêt légitime peut-il servir de base par défaut pour entraîner un modèle ?", o: ["Oui, dans tous les cas", "Seulement pour les petites entreprises", "Non, pas par défaut : il faut démontrer par un test en trois étapes que le traitement est proportionné, nécessaire et efficace", "Jamais, le consentement est obligatoire"], a: 2, e: "L’avis 28/2024 exclut un usage automatique de l’intérêt légitime et exige une démonstration, avec des mesures d’atténuation." },
   { q: "Un modèle est considéré comme anonyme si…", o: ["Son éditeur le déclare", "L’extraction de données personnelles de l’entraînement est négligeable, y compris via des requêtes, selon une analyse au cas par cas", "Il est hébergé dans l’UE", "Il a plus d’un milliard de paramètres"], a: 1, e: "L’anonymat se démontre : ni la déclaration de l’éditeur ni la taille du modèle ne suffisent." },
   { q: "Quelle conséquence possible d’un traitement illicite pendant le développement ?", o: ["Aucune une fois le modèle déployé", "Une simple recommandation", "Une certification obligatoire", "Une amende, une limitation du traitement, l’effacement de données ou le réentraînement du modèle"], a: 3, e: "Les autorités peuvent aller jusqu’à ordonner l’effacement de tout ou partie du jeu de données ou le réentraînement." },
   { q: "Que demander à un fournisseur de modèle avant intégration ?", o: ["La provenance des données d’entraînement, la base légale et le caractère anonyme ou non du modèle", "Son chiffre d’affaires", "Le nom de ses développeurs", "Rien : c’est son seul sujet"], a: 0, e: "Ce sont les trois éléments qui conditionnent la licéité de l’usage du modèle chez le déployeur." }] },
 en: { title: "GDPR and model training (EDPB Opinion 28/2024)",
  intro: "Know the right questions to ask about training data, the point where GDPR meets generative AI.",
  bridge: "You know legal bases and the legitimate interest balancing test. The new point: applying them to training, with a model that can memorise data.",
  action: "For a model used by a client, write five questions to put to the supplier about training data.",
  pts: [["Model anonymity", "Assessed case by case. The likelihood of extracting personal data from training, directly or by probabilistic inference, must be negligible, and the risk of obtaining it through queries, even unintentionally, insignificant. Reasonably available means are taken into account."],
   ["Legitimate interest", "Article 6(1)(f) is not a default basis. The controller must show, through a three-step test, that processing is proportionate, necessary and effective. Reasonable expectations and mitigating measures count: pseudonymisation or synthetic data, transparency beyond Articles 13 and 14, an opt-out from the outset."],
   ["Unlawfulness in the development phase", "Unlawful processing during development can affect the lawfulness of later processing or operation of the model (Articles 5(1)(a) and 6). Authorities may impose fines, temporarily limit processing, order erasure of all or part of the dataset or retraining of the model."],
   ["On the deployer side", "Before buying or integrating a model, ask the supplier how training data was obtained, on what legal basis, and whether the model is considered anonymous. The Opinion does not say how these duties split with the AI Act: that is assessed case by case."]],
  quiz: [
   { q: "Can legitimate interest serve as a default basis for training a model?", o: ["Yes, in all cases", "Only for small companies", "No, not by default: a three-step test must show the processing is proportionate, necessary and effective", "Never, consent is mandatory"], a: 2, e: "Opinion 28/2024 rules out automatic reliance on legitimate interest and requires a demonstration, with mitigating measures." },
   { q: "A model is considered anonymous if…", o: ["Its publisher says so", "Extracting personal data from training is negligible, including via queries, on a case-by-case analysis", "It is hosted in the EU", "It has over a billion parameters"], a: 1, e: "Anonymity must be demonstrated: neither the publisher’s claim nor model size is enough." },
   { q: "What is a possible consequence of unlawful processing during development?", o: ["None once the model is deployed", "A simple recommendation", "A mandatory certification", "A fine, a processing limit, data erasure or retraining of the model"], a: 3, e: "Authorities can go as far as ordering erasure of all or part of the dataset or retraining." },
   { q: "What should you ask a model supplier before integration?", o: ["Where training data came from, the legal basis, and whether the model is anonymous", "Its revenue", "Its developers’ names", "Nothing: it is only their concern"], a: 0, e: "These three elements condition the lawfulness of using the model on the deployer’s side." }] } },

{ id: 'l12', plan: 4, gap: 2,
 src: [["Thomas Helbing, CJEU C-311/18 Schrems II", "https://www.thomashelbing.com/en/wissen/dsgvo-hub/rechtsprechung/1.4.50-eugh-schrems-ii"], ["BCLP, EDPB Recommendations 01/2020", "https://www.bclplaw.com/en-US/events-insights-news/what-do-the-edpb-recommendations-for-schrems-ii-mean-for-your-organization.html"], ["GDPR Article 46 (gdpr-info.eu)", "https://gdpr-info.eu/art-46-gdpr/"], ["Next Levels, EU-US Data Privacy Framework 2026", "https://next-levels.de/en/wiki/eu-us-data-privacy-framework"], ["Legal 500, Latombe and the DPF", "https://www.legal500.com/intelligence/france/privacy/appeal-seeking-annulment-of-the-data-privacy-framework-dismissed"]],
 fr: { title: "Transferts hors UE : Schrems II et Data Privacy Framework",
  intro: "Comprendre pourquoi un contrat ne suffit pas pour envoyer des données aux États-Unis, et où en est le cadre actuel. Très présent dès qu’on utilise un fournisseur d’IA américain.",
  bridge: "Le chapitre V du RGPD fait déjà partie de votre pratique. Ici, ce sont les invalidations successives (Schrems I et II) qui expliquent la prudence face au cadre actuel.",
  action: "Choisissez un fournisseur américain d’un de vos clients : est-il certifié DPF ? Quel outil de secours existe ? Quelles données partent ?",
  pts: [["L’arrêt Schrems II (16 juillet 2020, C-311/18)", "La CJUE invalide le Privacy Shield : les accès des services de renseignement américains, notamment au titre de FISA 702, ne sont pas limités à ce qui est nécessaire et proportionné, et les personnes ne disposent pas d’une protection juridique effective."],
   ["Les clauses contractuelles types", "Elles restent valides en principe, mais un contrat ne lie pas les autorités du pays tiers. Avant le transfert, l’exportateur doit évaluer si le pays de destination assure un niveau de protection équivalent. Sinon, il ajoute des mesures supplémentaires, et si elles ne suffisent pas, il suspend le transfert."],
   ["La feuille de route de l’EDPB", "Recommandations 01/2020 : cartographier les transferts, identifier l’outil utilisé, évaluer son efficacité dans le pays tiers, adopter des mesures supplémentaires (techniques, contractuelles, organisationnelles), accomplir les étapes procédurales, puis réévaluer périodiquement."],
   ["Les outils de l’article 46", "Sans décision d’adéquation, des garanties appropriées sont nécessaires : clauses types adoptées par la Commission, règles d’entreprise contraignantes, codes de conduite ou certifications assortis d’engagements contraignants, entre autres. Il faut des droits opposables et des voies de recours effectives."],
   ["Le Data Privacy Framework", "Décision d’adéquation du 10 juillet 2023 (UE 2023/1795) : les transferts vers des organisations américaines certifiées n’exigent pas d’outil supplémentaire. Le Tribunal de l’UE a rejeté le recours Latombe le 3 septembre 2025 (T-553/23) ; un pourvoi (C-703/25 P) est signalé comme pendant. Un site spécialisé évoque aussi un risque lié à l’indépendance de la FTC (à vérifier). Bon réflexe : vérifier la certification du fournisseur et garder des clauses types de secours."]],
  quiz: [
   { q: "Qu’a invalidé l’arrêt Schrems II ?", o: ["Les clauses contractuelles types", "Le Privacy Shield", "Le RGPD", "Les règles d’entreprise contraignantes"], a: 1, e: "Le Privacy Shield a été invalidé le 16 juillet 2020. Les clauses types ont été jugées valides en principe." },
   { q: "Selon Schrems II, que doit faire l’exportateur qui utilise des clauses types ?", o: ["Rien : le contrat suffit", "Obtenir l’accord de l’État destinataire", "Évaluer le niveau de protection dans le pays de destination et, si besoin, ajouter des mesures supplémentaires ou suspendre le transfert", "Chiffrer systématiquement toutes les données"], a: 2, e: "Un contrat ne lie pas les autorités du pays tiers : l’évaluation au cas par cas est indispensable." },
   { q: "Que dit le Tribunal de l’UE dans l’affaire Latombe (3 septembre 2025) ?", o: ["Il invalide le DPF", "Il rejette le recours en annulation : la décision d’adéquation reste en vigueur", "Il suspend tous les transferts vers les États-Unis", "Il demande une nouvelle décision à la Commission"], a: 1, e: "Le recours T-553/23 est rejeté, la décision du 10 juillet 2023 reste en vigueur, avec une possibilité de pourvoi devant la Cour de justice." },
   { q: "Quel réflexe pratique face à un fournisseur américain qui invoque le DPF ?", o: ["Vérifier sa certification sur le registre du DPF et garder des clauses types de secours", "Ne rien vérifier", "Interdire tout transfert vers les États-Unis", "Exiger le code source"], a: 0, e: "Le cadre reste contesté et a déjà un précédent d’invalidation pour ses prédécesseurs : un plan B est prudent." }] },
 en: { title: "Transfers outside the EU: Schrems II and the Data Privacy Framework",
  intro: "Understand why a contract is not enough to send data to the US, and where the current framework stands. It matters whenever you use a US AI provider.",
  bridge: "GDPR Chapter V is already part of your practice. Here, the successive invalidations (Schrems I and II) explain the caution around the current framework.",
  action: "Pick a US supplier of one of your clients: is it DPF-certified? What fallback tool exists? What data leaves?",
  pts: [["The Schrems II judgment (16 July 2020, C-311/18)", "The CJEU invalidates the Privacy Shield: US intelligence access, notably under FISA 702, was not limited to what is necessary and proportionate, and people lacked effective legal protection."],
   ["Standard contractual clauses", "They remain valid in principle, but a contract does not bind the authorities of the third country. Before the transfer, the exporter must assess whether the destination country ensures equivalent protection. If not, it adds supplementary measures, and if these are not enough, it suspends the transfer."],
   ["The EDPB roadmap", "Recommendations 01/2020: map transfers, identify the tool used, assess its effectiveness in the third country, adopt supplementary measures (technical, contractual, organisational), complete procedural steps, then re-evaluate periodically."],
   ["Article 46 tools", "Without an adequacy decision, appropriate safeguards are needed: Commission standard clauses, binding corporate rules, codes of conduct or certifications with binding commitments, among others. Enforceable rights and effective remedies must exist."],
   ["The Data Privacy Framework", "Adequacy decision of 10 July 2023 (EU 2023/1795): transfers to certified US organisations need no additional tool. The EU General Court dismissed the Latombe action on 3 September 2025 (T-553/23); an appeal (C-703/25 P) is reported as pending. A specialist site also flags a risk around the FTC’s independence (to be verified). Good reflex: check the supplier’s certification and keep standard clauses as a fallback."]],
  quiz: [
   { q: "What did the Schrems II judgment invalidate?", o: ["Standard contractual clauses", "The Privacy Shield", "The GDPR", "Binding corporate rules"], a: 1, e: "The Privacy Shield was invalidated on 16 July 2020. Standard clauses were held valid in principle." },
