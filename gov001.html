   { q: "Under Schrems II, what must an exporter using standard clauses do?", o: ["Nothing: the contract is enough", "Obtain the destination state’s approval", "Assess the level of protection in the destination country and, if needed, add supplementary measures or suspend the transfer", "Systematically encrypt all data"], a: 2, e: "A contract does not bind the third country’s authorities: case-by-case assessment is essential." },
   { q: "What did the EU General Court decide in Latombe (3 September 2025)?", o: ["It invalidated the DPF", "It dismissed the annulment action: the adequacy decision remains in force", "It suspended all transfers to the US", "It asked the Commission for a new decision"], a: 1, e: "Action T-553/23 was dismissed; the 10 July 2023 decision remains in force, with a possible appeal to the Court of Justice." },
   { q: "What is the practical reflex with a US supplier relying on the DPF?", o: ["Check its certification on the DPF register and keep standard clauses as a fallback", "Check nothing", "Ban all transfers to the US", "Demand the source code"], a: 0, e: "The framework remains challenged and its predecessors were invalidated: a plan B is prudent." }] } }
];

var CASEPITCH = {
l1: { src: ["Global News", "https://globalnews.ca/news/10297307/air-canada-chatbot-error-bc-ruling/amp"],
 fr: { ct: "Air Canada et son chatbot (2024)", cs: "Un client demande au chatbot du site comment fonctionne le tarif de deuil. Le chatbot invente une règle. Air Canada refuse ensuite de rembourser et plaide que le chatbot est une entité distincte. Le tribunal de la Colombie-Britannique rejette cet argument et condamne la compagnie.", ck: "Un système génératif produit du texte plausible, pas des faits vérifiés. L’entreprise reste responsable de ce que son outil dit à ses clients.",
  an: "Un stagiaire brillant qui a tout lu mais ne dit jamais « je ne sais pas » : il complète avec ce qui sonne juste.", say: "Un modèle de langage prédit le mot suivant le plus probable. Il écrit très bien, mais il ne vérifie rien. Branché sur vos documents (RAG), il se trompe moins, sans jamais être infaillible. Ce qu’il dit à vos clients vous engage : il faut donc des sources visibles et un humain pour les cas sensibles.", q: "Pourquoi l’outil invente-t-il ?", r: "Il est conçu pour produire une suite crédible, pas pour garantir le vrai. Les documents internes réduisent le risque sans l’éliminer.", av: "Dire « l’IA est intelligente » ou « l’IA hallucine » sans l’expliquer. Parlez de prédiction et de responsabilité." },
 en: { ct: "Air Canada and its chatbot (2024)", cs: "A customer asks the website chatbot how the bereavement fare works. The chatbot invents a rule. Air Canada then refuses a refund and argues the chatbot is a separate entity. The British Columbia tribunal rejects that argument and orders the airline to pay.", ck: "A generative system produces plausible text, not verified facts. The company remains responsible for what its tool tells customers.",
  an: "A brilliant intern who has read everything but never says “I don’t know”: they fill in whatever sounds right.", say: "A language model predicts the most likely next word. It writes very well but verifies nothing. Connected to your documents (RAG) it errs less, never to zero. What it tells your customers binds you: so show sources and keep a human for sensitive cases.", q: "Why does the tool make things up?", r: "It is built to produce a credible continuation, not to guarantee truth. Internal documents reduce the risk without removing it.", av: "Saying “AI is smart” or “AI hallucinates” without explaining. Talk about prediction and accountability." } },
l2: { src: ["Daily Hive", "https://dailyhive.com/seattle/zillow-offers-shutting-down"],
 fr: { ct: "Zillow Offers (2021)", cs: "Zillow utilisait des modèles de prix pour acheter et revendre des maisons. Les prix se sont écartés des prédictions, l’activité a été arrêtée fin 2021, avec des dépréciations de plusieurs centaines de millions de dollars et des suppressions de postes.", ck: "Un modèle performant en test peut échouer en production quand le monde change. Il faut surveiller après le déploiement, avec des seuils d’arrêt décidés à l’avance.",
  an: "Une carte routière imprimée l’an dernier : très bien tant que les routes n’ont pas changé.", say: "Un système d’IA ne s’arrête pas à la mise en service. Les données évoluent, les performances dérivent. Il faut donc suivre des indicateurs, nommer un responsable et prévoir à l’avance dans quels cas on suspend l’outil.", q: "Si c’est validé avant lancement, pourquoi surveiller ?", r: "Parce que la validation date d’un moment donné. Le monde réel évolue ensuite, et la performance aussi.", av: "Présenter la conformité comme un tampon unique. C’est un suivi continu." },
 en: { ct: "Zillow Offers (2021)", cs: "Zillow used pricing models to buy and resell homes. Prices diverged from predictions, the business was shut down at the end of 2021, with write-downs of several hundred million dollars and layoffs.", ck: "A model that does well in testing can fail in production when the world changes. Monitor after deployment, with stop thresholds set in advance.",
  an: "A road map printed last year: fine until the roads change.", say: "An AI system does not stop at go-live. Data changes, performance drifts. So track indicators, name an owner, and decide in advance when the tool gets suspended.", q: "If it was validated before launch, why monitor?", r: "Because validation is a snapshot. The real world moves afterwards, and so does performance.", av: "Presenting compliance as a one-off stamp. It is continuous monitoring." } },
l3: { src: ["Reuters (via MediaWell)", "https://mediawell.ssrc.org/news-items/amazon-scraps-secret-ai-recruiting-tool-that-showed-bias-against-women-reuters/?pdf=49279"],
 fr: { ct: "L’outil de recrutement d’Amazon (révélé en 2018)", cs: "Amazon a développé un outil de tri de CV entraîné sur des années de candidatures, majoritairement masculines. L’outil pénalisait les CV qui mentionnaient « women’s ». Il a été abandonné.", ck: "Le biais vient des données d’origine : un modèle reproduit le passé. Mesurer les écarts de résultat entre groupes fait partie de l’évaluation.",
  an: "Demander à un nouvel arrivant d’imiter les anciens recrutements : il copiera aussi leurs habitudes.", say: "Une IA apprend sur l’historique. Si l’historique favorisait certains profils, elle les favorisera aussi, sans que personne l’ait décidé. On contrôle donc les données d’entrée et on compare les résultats entre groupes avant et après le lancement.", q: "Peut-on retirer le biais en supprimant le genre des données ?", r: "Pas toujours : d’autres informations (mots, parcours) peuvent le remplacer. Il faut mesurer les résultats.", av: "Promettre un système « sans biais ». Parlez de biais identifiés, mesurés et réduits." },
 en: { ct: "Amazon’s recruiting tool (reported 2018)", cs: "Amazon built a CV screening tool trained on years of applications, mostly from men. The tool penalised CVs mentioning “women’s”. It was abandoned.", ck: "Bias comes from the source data: a model reproduces the past. Measuring outcome gaps between groups is part of evaluation.",
  an: "Asking a newcomer to imitate past hiring: they will copy its habits too.", say: "An AI learns from history. If history favoured certain profiles, it will too, with nobody deciding so. So control input data and compare results across groups before and after launch.", q: "Can we remove bias by deleting gender from the data?", r: "Not always: other information (words, career paths) can stand in for it. You have to measure outcomes.", av: "Promising a “bias-free” system. Speak of biases identified, measured and reduced." } },
l4: { src: ["Gigazine", "https://gigazine.net/gsc_news/en/20230214-bing-chatgpt-discloses-secrets"],
 fr: { ct: "Le prompt système de Bing Chat dévoilé (2023)", cs: "Peu après le lancement de Bing Chat, un étudiant a obtenu par simple conversation que l’assistant révèle son nom de code interne et ses instructions cachées.", ck: "Un modèle suit des instructions écrites en langage naturel, et un utilisateur peut en écrire d’autres. Les secrets ne doivent pas se trouver dans le prompt.",
  an: "Un standardiste qui obéit à tout appelant convaincant, y compris à celui qui se fait passer pour la direction.", say: "Avec un LLM, la consigne et la demande de l’utilisateur arrivent dans le même canal. Un message habile peut donc détourner l’outil. On limite donc ses accès, on ne met aucun secret dans ses instructions, et on contrôle ce qu’il peut déclencher.", q: "Un pare-feu suffit-il ?", r: "Non, l’attaque est un texte légitime en apparence. On combine droits minimaux, filtrage des sorties et validation humaine des actions sensibles.", av: "Réduire le sujet à un problème de cybersécurité classique. C’est un risque d’usage autant que technique." },
 en: { ct: "Bing Chat’s system prompt exposed (2023)", cs: "Shortly after Bing Chat launched, a student got the assistant, through plain conversation, to reveal its internal codename and hidden instructions.", ck: "A model follows instructions written in natural language, and a user can write others. Secrets do not belong in the prompt.",
  an: "A receptionist who obeys any convincing caller, including one pretending to be management.", say: "With an LLM the instruction and the user’s request arrive on the same channel. A clever message can hijack the tool. So limit its access, keep secrets out of its instructions, and control what it can trigger.", q: "Is a firewall enough?", r: "No, the attack looks like legitimate text. Combine least privilege, output filtering and human approval of sensitive actions.", av: "Reducing it to a classic cybersecurity issue. It is a usage risk as much as a technical one." } },
l5: { src: ["Convergence India (Anthropic ISO 42001)", "https://convergenceindia.org/industry-news/artificial-intelligence/anthropic-bags-iso-42001-certification-for-responsible-ai-118948"],
 fr: { ct: "Un fournisseur certifié ISO 42001", cs: "Anthropic, l’éditeur de Claude, a annoncé une certification ISO/IEC 42001 pour son système de management de l’IA. Précision : c’est l’éditeur de l’outil qui vous répond ici, lisez donc cet exemple avec recul.", ck: "Une certification de management ne dit rien d’un produit précis : elle atteste que l’organisation a un système, pas que chaque usage chez votre client est conforme.",
  an: "Un restaurant certifié sur ses procédures d’hygiène : bon signe, mais ça ne garantit pas chaque assiette.", say: "ISO 42001 certifie la façon dont une organisation gère ses systèmes d’IA : rôles, risques, contrôles, amélioration continue. Pour un client, c’est un indice de maturité d’un fournisseur, à lire avec le périmètre précis de la certification. Cela ne remplace pas l’analyse de son propre usage.", q: "Mon fournisseur est certifié, suis-je conforme ?", r: "Non. Vous restez responsable de votre usage. La certification aide à choisir un fournisseur, pas à s’exonérer.", av: "Confondre certification d’organisation et conformité à l’AI Act." },
 en: { ct: "A supplier certified to ISO 42001", cs: "Anthropic, the maker of Claude, announced ISO/IEC 42001 certification for its AI management system. Note: the maker of this tool is answering you here, so read this example with some distance.", ck: "A management certification says nothing about a specific product: it shows the organisation has a system, not that each use at your client is compliant.",
  an: "A restaurant certified on its hygiene procedures: a good sign, but no guarantee for every plate.", say: "ISO 42001 certifies how an organisation manages its AI systems: roles, risks, controls, continual improvement. For a client it is a maturity signal for a supplier, to be read with the certificate’s exact scope. It does not replace analysing one’s own use.", q: "My supplier is certified, am I compliant?", r: "No. You remain responsible for your use. Certification helps pick a supplier, not escape responsibility.", av: "Confusing an organisation certificate with AI Act compliance." } },
l6: { src: ["Hello Partner", "https://hellopartner.com/meta-refuses-to-sign-eu-ai-code-of-practice-in-shocking-statement/"],
 fr: { ct: "Meta et le code de bonnes pratiques GPAI (2025)", cs: "Meta a annoncé qu’elle ne signerait pas le code de bonnes pratiques européen pour les modèles d’IA à usage général, alors que d’autres grands fournisseurs l’ont signé.", ck: "Le code est volontaire, mais ne pas le signer ne dispense pas des obligations du règlement. Pour un client, la position du fournisseur est une information de due diligence.",
  an: "Un code de bonne conduite que l’on peut ne pas signer, tout en restant soumis à la loi.", say: "Les fabricants de grands modèles ont des obligations propres dans l’AI Act. Un code de bonnes pratiques les aide à les démontrer. S’ils ne le signent pas, ils doivent prouver autrement qu’ils respectent le texte. Pour vous, c’est un critère de choix à documenter.", q: "Dois-je éviter un modèle dont le fournisseur n’a pas signé ?", r: "Pas automatiquement. Demandez comment il démontre sa conformité, puis décidez selon votre usage.", av: "Présenter le code comme obligatoire ou comme un label de qualité." },
 en: { ct: "Meta and the GPAI Code of Practice (2025)", cs: "Meta announced it would not sign the EU Code of Practice for general-purpose AI models, while other major providers signed.", ck: "The code is voluntary, but not signing does not remove the Regulation’s obligations. For a client, the provider’s position is due diligence information.",
  an: "A code of conduct you may decline to sign, while remaining subject to the law.", say: "Makers of large models have their own obligations under the AI Act. A code of practice helps them demonstrate compliance. If they do not sign, they must show otherwise that they meet the text. For you, it is a selection criterion to document.", q: "Should I avoid a model whose provider did not sign?", r: "Not automatically. Ask how it demonstrates compliance, then decide based on your use.", av: "Presenting the code as mandatory or as a quality label." } },
l7: { src: ["Fortune", "https://fortune.com/2023/05/02/samsung-bans-employee-use-chatgpt-data-leak"],
 fr: { ct: "Samsung et ChatGPT (2023)", cs: "Des salariés ont collé du code source interne dans un outil d’IA grand public. Samsung a ensuite restreint l’usage des outils d’IA générative par son personnel.", ck: "Interdire ne suffit pas : sans outil autorisé et sans règles simples, l’usage passe en clandestin (shadow AI).",
  an: "Interdire les clés USB sans fournir de partage de fichiers : les gens trouveront un autre moyen.", say: "Vos équipes utilisent déjà l’IA. La bonne réponse est de leur donner un outil approuvé, une règle de trois lignes sur ce qu’on peut y mettre, et un inventaire des usages. On passe de l’interdit au cadre.", q: "Peut-on simplement interdire ChatGPT ?", r: "On peut le bloquer, mais l’usage se déplace sur des appareils personnels. Mieux vaut proposer une alternative encadrée.", av: "Lancer une charte de dix pages que personne ne lit." },
 en: { ct: "Samsung and ChatGPT (2023)", cs: "Employees pasted internal source code into a consumer AI tool. Samsung then restricted staff use of generative AI tools.", ck: "Banning is not enough: without an approved tool and simple rules, use goes underground (shadow AI).",
  an: "Banning USB sticks without providing file sharing: people will find another way.", say: "Your teams already use AI. The right answer is to give them an approved tool, a three-line rule on what can go in, and an inventory of uses. You move from prohibition to a framework.", q: "Can we simply ban ChatGPT?", r: "You can block it, but use shifts to personal devices. Better to offer a governed alternative.", av: "Launching a ten-page charter nobody reads." } },
l8: { src: ["Infosecurity Magazine", "https://infosecurity-magazine.com/news/clearview-ai-fined-30m-netherlands"],
 fr: { ct: "Clearview AI et les autorités néerlandaises (2024)", cs: "Clearview a constitué une base de reconnaissance faciale en récupérant des images sur Internet. L’autorité néerlandaise lui a infligé une amende d’environ 30 millions d’euros en 2024. Le moissonnage non ciblé d’images faciales figure aujourd’hui parmi les pratiques interdites de l’article 5 de l’AI Act.", ck: "Une pratique d’abord sanctionnée par le RGPD devient, avec l’AI Act, interdite en tant que telle. Les deux textes se superposent.",
  an: "Un feu rouge : certaines pratiques ne se négocient pas, on ne les rend pas « plus sûres ».", say: "L’AI Act classe les usages par risque. Tout en haut, quelques pratiques sont interdites, par exemple la notation sociale ou le moissonnage de visages. En dessous, des obligations dépendent de votre rôle : fabricant ou utilisateur. Commençons par savoir où se situent vos outils.", q: "Mon chatbot est-il concerné ?", r: "Probablement par la transparence et la formation du personnel, rarement par l’interdit. Il faut classer l’usage, pas l’outil.", av: "Dire « l’AI Act interdit l’IA ». Il interdit des pratiques précises." },
 en: { ct: "Clearview AI and the Dutch authority (2024)", cs: "Clearview built a facial recognition database by scraping images from the Internet. The Dutch authority fined it about €30 million in 2024. Untargeted scraping of facial images is now among the prohibited practices in Article 5 of the AI Act.", ck: "A practice first sanctioned under GDPR becomes prohibited as such under the AI Act. The two texts overlap.",
  an: "A red light: some practices are not negotiable, you do not make them “safer”.", say: "The AI Act sorts uses by risk. At the top, a few practices are banned, such as social scoring or face scraping. Below that, obligations depend on your role: maker or user. Let’s start by finding where your tools sit.", q: "Does my chatbot fall under this?", r: "Probably under transparency and staff training, rarely under the bans. You classify the use, not the tool.", av: "Saying “the AI Act bans AI”. It bans specific practices." } },
l9: { src: ["DutchNews", "https://www.dutchnews.nl/news/2021/01/dutch-government-collapses-in-fall-out-from-child-benefit-scandal/"],
 fr: { ct: "Le scandale des allocations familiales néerlandais (2021)", cs: "L’administration fiscale néerlandaise a utilisé des critères de risque pour repérer des fraudes aux allocations de garde d’enfants. Des milliers de familles ont été accusées à tort, certaines ruinées. Le gouvernement a démissionné en janvier 2021.", ck: "Un système qui décide de l’accès à des prestations est exactement le type d’usage que l’AI Act classe à haut risque : supervision humaine, information, voies de recours.",
  an: "Un contrôleur automatique qui sanctionne sans que personne ne relise : l’erreur s’étend à grande échelle avant d’être vue.", say: "« Haut risque » ne veut pas dire « interdit ». Cela veut dire : documenter, surveiller, garder un humain compétent dans la boucle, informer les personnes concernées. Le fabricant et l’utilisateur n’ont pas les mêmes obligations, d’où l’importance de savoir qui est qui.", q: "Mon outil de tri de CV est-il à haut risque ?", r: "Le recrutement figure dans la liste de l’annexe III, donc très probablement. Il faut vérifier la finalité exacte.", av: "Faire peur avec les amendes plutôt que d’expliquer les mesures concrètes." },
 en: { ct: "The Dutch childcare benefits scandal (2021)", cs: "The Dutch tax authority used risk criteria to flag childcare benefit fraud. Thousands of families were wrongly accused, some ruined. The government resigned in January 2021.", ck: "A system deciding access to benefits is exactly the kind of use the AI Act classes as high-risk: human oversight, information, avenues of redress.",
  an: "An automatic inspector who penalises without anyone double-checking: the error spreads at scale before it is seen.", say: "“High-risk” does not mean “banned”. It means: document, monitor, keep a competent human in the loop, inform affected people. The maker and the user have different obligations, hence the need to know who is who.", q: "Is my CV screening tool high-risk?", r: "Recruitment is on the Annex III list, so very probably. Check the exact purpose.", av: "Scaring with fines instead of explaining concrete measures." } },
l10: { src: ["Bird & Bird, SCHUFA ruling", "https://twobirds.com/en/insights/2023/global/key-takeaways-from-the-schufa-case-of-the-cjeu"],
 fr: { ct: "SCHUFA, CJUE C-634/21 (7 décembre 2023)", cs: "Une personne se voit refuser un prêt à cause d’un score de solvabilité établi par SCHUFA. La Cour juge que la production du score peut elle-même constituer une décision automatisée au sens de l’article 22 lorsque la banque s’en remet largement à lui.", ck: "Un « simple score » n’est pas une aide neutre : si le décideur le suit presque toujours, l’article 22 s’applique à celui qui le calcule.",
  an: "Un arbitre vidéo que l’arbitre central suit à chaque fois : c’est lui qui décide en réalité.", say: "Dès qu’un humain valide une proposition de la machine sans vraiment l’examiner, la décision reste automatisée au regard du RGPD. L’intervention humaine doit être réelle : quelqu’un qui comprend, peut changer la décision et le fait parfois.", q: "Si un conseiller valide toujours, on est protégé ?", r: "Pas s’il suit systématiquement le score. L’humain doit avoir une vraie marge d’appréciation.", av: "Parler de « supervision humaine » sans dire ce qui la rend réelle." },
 en: { ct: "SCHUFA, CJEU C-634/21 (7 December 2023)", cs: "A person is refused a loan because of a creditworthiness score produced by SCHUFA. The Court holds that producing the score can itself be an automated decision under Article 22 when the bank relies heavily on it.", ck: "A “mere score” is not a neutral aid: if the decision-maker almost always follows it, Article 22 applies to whoever computes it.",
  an: "A video referee that the main referee follows every time: in reality it decides.", say: "As soon as a human rubber-stamps the machine’s proposal without really examining it, the decision remains automated under GDPR. Human involvement must be real: someone who understands, can change the outcome, and sometimes does.", q: "If an adviser always signs off, are we covered?", r: "Not if they systematically follow the score. The human needs genuine discretion.", av: "Saying “human oversight” without saying what makes it real." } },
l11: { src: ["Bloomberg Government", "https://news.bgov.com/ip-law/openai-hit-with-first-ever-ai-gdpr-fine-by-italian-privacy-body"],
 fr: { ct: "Garante contre OpenAI (décembre 2024)", cs: "L’autorité italienne a infligé 15 millions d’euros à OpenAI, notamment pour absence de base légale suffisante pour l’entraînement de son modèle et manque de transparence. La décision est susceptible de recours.", ck: "Les données d’entraînement relèvent du RGPD. Base légale, information des personnes et possibilité de s’opposer doivent être traitées dès la conception.",
  an: "Une recette dont on ne connaît pas l’origine des ingrédients : bon goût, mais impossible de prouver qu’ils sont licites.", say: "Avant d’utiliser un modèle, demandez trois choses au fournisseur : d’où viennent les données, sur quelle base légale, et le modèle peut-il en recracher ? Les réponses conditionnent votre propre conformité.", q: "Les données d’entraînement sont-elles mon problème ?", r: "En partie. Un traitement illicite en amont peut affecter l’usage du modèle en aval. Documentez vos vérifications.", av: "Affirmer que le modèle est « anonyme » sans preuve." },
 en: { ct: "Garante v OpenAI (December 2024)", cs: "The Italian authority fined OpenAI €15 million, notably for lacking a sufficient legal basis for training its model and for lack of transparency. The decision is open to appeal.", ck: "Training data falls under GDPR. Legal basis, information to people and the ability to object must be handled by design.",
  an: "A recipe whose ingredients’ origin is unknown: tastes fine, but you cannot prove they were lawful.", say: "Before using a model, ask the supplier three things: where the data came from, on what legal basis, and can the model regurgitate it? The answers condition your own compliance.", q: "Is training data my problem?", r: "Partly. Unlawful processing upstream can affect use of the model downstream. Document your checks.", av: "Claiming the model is “anonymous” without evidence." } },
l12: { src: ["Hunton, Irish DPC fines Meta", "https://hunton.sitepilot11.firmseek.com/privacy-and-cybersecurity-law-blog/irish-regulator-fines-meta-1-2-billion-euros-and-orders-it-to-cease-data-transfers-to-the-u-s"],
 fr: { ct: "Meta : 1,2 milliard d’euros (mai 2023)", cs: "La DPC irlandaise a infligé 1,2 milliard d’euros à Meta pour des transferts de données d’utilisateurs européens vers les États-Unis fondés sur des clauses types, et lui a ordonné de cesser ces transferts.", ck: "Les clauses types ne suffisent pas toutes seules : il faut évaluer le pays de destination et ajouter des mesures. Le cadre a changé depuis avec le DPF, mais le raisonnement reste le même.",
  an: "Une lettre de recommandation qui ne lie pas la douane du pays d’arrivée : utile, mais pas suffisante.", say: "Envoyer des données hors UE suppose un outil juridique (adéquation, clauses types) et une analyse du pays de destination. Aujourd’hui, un fournisseur américain certifié DPF simplifie la vie, mais gardons un plan B et vérifions sa certification.", q: "Mon fournisseur est américain, c’est interdit ?", r: "Non. Il faut un outil de transfert valide, vérifier la certification DPF et savoir quelles données partent.", av: "Dire que « tout transfert vers les États-Unis est illégal »." },
 en: { ct: "Meta: €1.2 billion (May 2023)", cs: "The Irish DPC fined Meta €1.2 billion for transferring EU users’ data to the US on standard clauses, and ordered it to stop those transfers.", ck: "Standard clauses are not enough alone: assess the destination country and add measures. The framework has since changed with the DPF, but the reasoning is the same.",
  an: "A reference letter that does not bind the arrival country’s customs: helpful, not sufficient.", say: "Sending data outside the EU needs a legal tool (adequacy, standard clauses) and an analysis of the destination country. Today a DPF-certified US supplier simplifies things, but keep a plan B and check its certification.", q: "My supplier is American, is that banned?", r: "No. You need a valid transfer tool, to check DPF certification, and to know which data leaves.", av: "Saying “any transfer to the US is illegal”." } }

var LV = null;
function modById(id) { var i; for (i = 0; i < LEARN.length; i++) if (LEARN[i].id === id) return LEARN[i]; return null; }
function lrec(id) { var r = S.learn[id]; return r ? r : { read: false, best: -1, last: -1, n: 0, note: '', mine: '', upd: 0 }; }
function saveL(id, patch) {
  var r = JSON.parse(JSON.stringify(lrec(id))), k;
  for (k in patch) r[k] = patch[k];
  r.upd = Date.now(); S.learn[id] = r; autoSave();
}
function toggleRead(id) { saveL(id, { read: !lrec(id).read }); renderLearn(); }
function quizScore(m) {
  var qs = m[LANG].quiz, i, ok = 0;
  for (i = 0; i < qs.length; i++) if (LV.answers[i] === qs[i].a) ok++;
  return ok;
}
function pickAnswer(j) {
  if (!LV || LV.mode !== 'quiz' || LV.sel >= 0 || isNaN(j)) return;
  LV.sel = j; LV.answers[LV.i] = j; renderLearn();
}
function nextQuestion() {
  if (!LV || LV.mode !== 'quiz' || LV.sel < 0) return;
  var m = modById(LV.mod), n = m[LANG].quiz.length;
  LV.i++; LV.sel = -1;
  if (LV.i >= n) {
    var pct = Math.round(quizScore(m) / n * 100), r = lrec(LV.mod);
    saveL(LV.mod, { best: Math.max(r.best, pct), last: pct, n: (r.n || 0) + 1 });
  }
  renderLearn(); window.scrollTo(0, 0);
}
function nextStep() {
  var i, r;
  for (i = 0; i < LEARN.length; i++) { r = lrec(LEARN[i].id); if (!r.read) return { id: LEARN[i].id, k: 'l.doRead' }; }
  for (i = 0; i < LEARN.length; i++) { r = lrec(LEARN[i].id); if (r.best < 0) return { id: LEARN[i].id, k: 'l.doQuizFirst' }; }
  for (i = 0; i < LEARN.length; i++) { r = lrec(LEARN[i].id); if (r.best < 75) return { id: LEARN[i].id, k: 'l.doQuiz' }; }
  return null;
}
function renderLearn() {
  var ae = document.activeElement;
  if (ae && (ae.id === 'l-note' || ae.id === 'l-mine')) return;
  var h = '', i, j, g, m, c, r;
  if (!LV) {
    var rd = 0, sum = 0, cnt = 0;
    for (i = 0; i < LEARN.length; i++) { r = lrec(LEARN[i].id); if (r.read) rd++; if (r.best >= 0) { sum += r.best; cnt++; } }
    h += '<div class="card"><p class="muted" style="margin:0 0 8px">' + esc(t('l.intro')) + '</p><h3>' + esc(t('l.progress', { x: rd, y: LEARN.length })) + (cnt ? ' · ' + esc(t('l.avg', { z: Math.round(sum / cnt) })) : '') + '</h3><div class="bar"><i style="width:' + Math.round(rd / LEARN.length * 100) + '%"></i></div>';
    for (g = 1; g <= 3; g++) {
      var tot = 0, rdg = 0;
      for (i = 0; i < LEARN.length; i++) if (LEARN[i].gap === g) { tot++; if (lrec(LEARN[i].id).read) rdg++; }
      h += '<div class="muted" style="margin-top:6px">' + esc(t('l.gaptag', { x: g })) + ' · ' + esc(t('l.gap' + g)) + ' : ' + rdg + '/' + tot + '</div>';
    }
    h += '</div>';
    var ns = nextStep();
    if (ns) {
      var nm = modById(ns.id);
      h += '<div class="card item" data-act="l-open" data-id="' + ns.id + '"><div style="min-width:0"><div class="muted">' + esc(t('l.nextstep')) + '</div><h3 style="margin:2px 0 0">' + esc(t(ns.k, { x: nm[LANG].title })) + '</h3></div><span>→</span></div>';
    } else h += '<div class="card"><h3>' + esc(t('l.nextstep')) + '</h3><p class="muted" style="margin:0">' + esc(t('l.alldone')) + '</p></div>';
    for (i = 0; i < LEARN.length; i++) {
      m = LEARN[i]; r = lrec(m.id); c = m[LANG];
      h += '<div class="card item" data-act="l-open" data-id="' + m.id + '"><div style="min-width:0"><h3>' + (i + 1) + '. ' + esc(c.title) + '</h3><div class="muted">' + esc(t('l.gaptag', { x: m.gap })) + ' · ' + esc(t('l.linked', { x: m.plan })) + '</div></div><div style="text-align:right;white-space:nowrap">' + (r.read ? '<span class="badge c-minimal" style="border-color:currentColor">' + esc(t('l.read')) + '</span>' : '') + (r.best >= 0 ? '<div class="muted" style="margin-top:4px">' + esc(t('l.best', { x: r.best })) + '</div>' : '') + '</div></div>';
    }
  } else {
    m = modById(LV.mod);
    if (!m) { LV = null; renderLearn(); return; }
    c = m[LANG]; r = lrec(m.id);
    h += '<button class="btn" data-act="l-back" style="margin-bottom:10px">' + esc(t('l.back')) + '</button>';
    if (LV.mode === 'lesson') {
      h += '<div class="card"><div class="muted">' + esc(t('l.gaptag', { x: m.gap })) + ' · ' + esc(t('l.gap' + m.gap)) + ' · ' + esc(t('l.linked', { x: m.plan })) + '</div><h3 style="margin-top:6px">' + esc(c.title) + '</h3><p class="muted" style="margin:0">' + esc(c.intro) + '</p>';
      for (j = 0; j < c.pts.length; j++) h += '<div class="pt"><b>' + esc(c.pts[j][0]) + '</b><span>' + esc(c.pts[j][1]) + '</span></div>';
      h += '</div>';
      h += '<div class="card"><h3>' + esc(t('l.bridge')) + '</h3><p style="margin:0">' + esc(c.bridge) + '</p></div>';
      var cp = CASEPITCH[m.id], cpl = cp ? cp[LANG] : null;
      if (cpl) {
        h += '<div class="card"><h3>' + esc(t('l.case')) + ' · ' + esc(cpl.ct) + '</h3><p style="margin:0 0 8px">' + esc(cpl.cs) + '</p><p style="margin:0 0 8px"><b>' + esc(t('l.caseLesson')) + '</b> ' + esc(cpl.ck) + '</p><div class="muted"><a href="' + esc(cp.src[1]) + '" target="_blank" rel="noopener">' + esc(cp.src[0]) + '</a></div></div>';
        h += '<div class="card"><h3>' + esc(t('l.pitch')) + '</h3><div class="pt"><b>' + esc(t('l.analogy')) + '</b><span>' + esc(cpl.an) + '</span></div><div class="pt"><b>' + esc(t('l.say')) + '</b><span>' + esc(cpl.say) + '</span></div><div class="pt"><b>' + esc(t('l.ask')) + '</b><span>« ' + esc(cpl.q) + ' » — ' + esc(cpl.r) + '</span></div><div class="pt"><b>' + esc(t('l.avoid')) + '</b><span>' + esc(cpl.av) + '</span></div><label class="fl" for="l-mine" style="margin-top:10px">' + esc(t('l.mine')) + '</label><textarea id="l-mine" data-act="l-mine" data-id="' + m.id + '" placeholder="' + esc(t('l.minePh')) + '">' + esc(r.mine || '') + '</textarea></div>';
      }
      h += '<div class="card"><h3>' + esc(t('l.action')) + '</h3><p style="margin:0 0 10px">' + esc(c.action) + '</p><label class="fl" for="l-note">' + esc(t('l.note')) + '</label><textarea id="l-note" data-act="l-note" data-id="' + m.id + '" placeholder="' + esc(t('l.notePh')) + '">' + esc(r.note || '') + '</textarea></div>';
      h += '<div class="card src"><h3>' + esc(t('l.sources')) + '</h3>';
      if (m.src.length) {
        for (j = 0; j < m.src.length; j++) h += '<div><a href="' + esc(m.src[j][1]) + '" target="_blank" rel="noopener">' + esc(m.src[j][0]) + '</a></div>';
        h += '<p class="muted" style="margin:8px 0 0">' + esc(t('l.srcnote')) + '</p>';
      } else h += '<p class="muted" style="margin:0">' + esc(t('l.nosrc')) + '</p>';
      h += '</div>';
      h += '<div class="row"><button class="btn primary grow" data-act="l-start" data-id="' + m.id + '">' + esc(t('l.start')) + '</button><button class="btn grow" data-act="l-read" data-id="' + m.id + '">' + esc(r.read ? t('l.unmark') : t('l.mark')) + '</button></div>';
    } else {
      var qs = c.quiz, n = qs.length;
      if (LV.i < n) {
        var q = qs[LV.i];
        h += '<div class="card"><div class="muted">' + esc(t('l.q', { x: LV.i + 1, y: n })) + '</div><div class="bar"><i style="width:' + Math.round(LV.i / n * 100) + '%"></i></div><h3>' + esc(q.q) + '</h3>';
        for (j = 0; j < q.o.length; j++) {
          var cl = '';
          if (LV.sel >= 0) { if (j === q.a) cl = ' ok'; else if (j === LV.sel) cl = ' ko'; }
          h += '<button class="opt' + cl + '" data-act="l-pick" data-v="' + j + '"' + (LV.sel >= 0 ? ' disabled' : '') + '>' + esc(q.o[j]) + '</button>';
        }
        if (LV.sel >= 0) {
          h += '<div class="fb"><b>' + esc(LV.sel === q.a ? t('l.right') : t('l.wrong')) + '</b> ' + esc(q.e) + '</div>';
          h += '<div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="l-next">' + esc(LV.i + 1 >= n ? t('l.finish') : t('l.next')) + '</button></div>';
        }
        h += '</div>';
      } else {
        var ok = quizScore(m), pct2 = Math.round(ok / n * 100);
        h += '<div class="card"><h3>' + esc(t('l.score', { x: ok, y: n, z: pct2 })) + '</h3><p class="muted" style="margin:0">' + esc(pct2 >= 75 ? t('l.good') : t('l.low')) + '</p>';
        var missed = 0;
        for (j = 0; j < n; j++) if (LV.answers[j] !== qs[j].a) {
          if (!missed) h += '<h3 style="margin-top:14px">' + esc(t('l.review')) + '</h3>';
          missed++;
          h += '<div class="pt"><b>' + esc(qs[j].q) + '</b><span>' + esc(t('l.answer')) + ' : ' + esc(qs[j].o[qs[j].a]) + '. ' + esc(qs[j].e) + '</span></div>';
        }
        h += '</div><div class="row"><button class="btn primary grow" data-act="l-start" data-id="' + m.id + '">' + esc(t('l.retry')) + '</button><button class="btn grow" data-act="l-open" data-id="' + m.id + '">' + esc(t('l.lesson')) + '</button></div>';
      }
    }
  }
  $('tab-learn').innerHTML = h;
}

/* ---------- modal forms ---------- */
function ynRow(id, key, val) { return '<div class="yn"><span>' + esc(t(key)) + '</span><input type="checkbox" id="' + id + '"' + (val ? ' checked' : '') + '></div>'; }
function readAnswers() {
  return { prohibited: $('q-prohibited').checked, highrisk: $('q-highrisk').checked, people: $('q-people').checked, gpai: $('q-gpai').checked, pdata: $('q-pdata').checked, vulnerable: $('q-vulnerable').checked, autonomy: $('f-autonomy').value };
}
function refreshResult() { $('res-box').innerHTML = resultHtml(readAnswers()); }
function openModal(html) { $('modal-card').innerHTML = html; $('modal').className = 'modal open'; $('modal').scrollTop = 0; }
function closeModal() { $('modal').className = 'modal'; $('modal-card').innerHTML = ''; renderAll(); }
function openCase(id) {
  var c = null, i;
  for (i = 0; i < S.cases.length; i++) if (S.cases[i].id === id) c = S.cases[i];
  var a = (c && c.a) || {}, h = '<h3>' + esc(c ? t('edit') : t('new')) + '</h3>';
  h += '<label class="fl">' + esc(t('f.name')) + '</label><input id="f-name" value="' + esc(c ? c.name : '') + '">';
  h += '<label class="fl">' + esc(t('f.owner')) + '</label><input id="f-owner" value="' + esc(c ? c.owner : '') + '">';
  h += '<label class="fl">' + esc(t('f.system')) + '</label><input id="f-system" value="' + esc(c ? c.system : '') + '">';
  h += '<label class="fl">' + esc(t('f.purpose')) + '</label><textarea id="f-purpose">' + esc(c ? c.purpose : '') + '</textarea>';
  h += '<label class="fl">' + esc(t('f.status')) + '</label><select id="f-status">';
  ['idea', 'pilot', 'prod', 'stopped'].forEach(function (s) { h += '<option value="' + s + '"' + ((c ? c.status : 'idea') === s ? ' selected' : '') + '>' + esc(t('st.' + s)) + '</option>'; });
  h += '</select>';
  h += '<label class="fl" style="margin-top:16px">' + esc(t('q.title')) + '</label>';
  h += ynRow('q-prohibited', 'q.prohibited', a.prohibited) + ynRow('q-highrisk', 'q.highrisk', a.highrisk) + ynRow('q-people', 'q.people', a.people) + ynRow('q-gpai', 'q.gpai', a.gpai) + ynRow('q-pdata', 'q.pdata', a.pdata) + ynRow('q-vulnerable', 'q.vulnerable', a.vulnerable);
  h += '<label class="fl">' + esc(t('f.autonomy')) + '</label><select id="f-autonomy">';
  ['rec', 'human', 'auto'].forEach(function (s) { var v = s === 'rec' ? 'rec' : s; h += '<option value="' + v + '"' + ((a.autonomy || 'rec') === v ? ' selected' : '') + '>' + esc(t('aut.' + s)) + '</option>'; });
  h += '</select>';
  h += '<div id="res-box"></div>';
  h += '<label class="fl">' + esc(t('f.notes')) + '</label><textarea id="f-notes">' + esc(c ? c.notes : '') + '</textarea>';
  h += '<div class="row" style="margin-top:14px"><button class="btn primary grow" data-act="case-save" data-id="' + (c ? c.id : '') + '">' + esc(t('b.save')) + '</button><button class="btn grow" data-act="modal-close">' + esc(t('b.cancel')) + '</button>' + (c ? '<button class="btn danger" data-act="case-del" data-id="' + c.id + '">' + esc(t('b.delete')) + '</button>' : '') + '</div>';
  openModal(h);
  refreshResult();
}
function saveCase(id) {
  var name = $('f-name').value.replace(/^\s+|\s+$/g, '');
  if (!name) { toast(t('t.nameReq')); return; }
  var rec = { id: id || uid(), name: name, owner: $('f-owner').value, system: $('f-system').value, purpose: $('f-purpose').value, status: $('f-status').value, notes: $('f-notes').value, a: readAnswers(), upd: Date.now() }, i, found = false;
  for (i = 0; i < S.cases.length; i++) if (S.cases[i].id === rec.id) { S.cases[i] = rec; found = true; }
  if (!found) S.cases.push(rec);
  autoSave(); closeModal(); toast(t('t.saved'));
}
function delCase(id) {
  var i;
  for (i = 0; i < S.cases.length; i++) if (S.cases[i].id === id) {
    var old = JSON.parse(JSON.stringify(S.cases[i]));
    S.cases[i].del = true; S.cases[i].upd = Date.now();
    undoItem = { kind: 'case', rec: old };
  }
  autoSave(); closeModal(); toast(t('t.deleted'), true);
}
function openTrain(id) {
  var x = null, i;
  for (i = 0; i < S.trainings.length; i++) if (S.trainings[i].id === id) x = S.trainings[i];
  var h = '<h3>' + esc(x ? t('edit') : t('tr.add')) + '</h3>';
  h += '<label class="fl">' + esc(t('tr.name')) + '</label><input id="t-name" value="' + esc(x ? x.name : '') + '">';
  h += '<label class="fl">' + esc(t('tr.provider')) + '</label><input id="t-provider" value="' + esc(x ? x.provider : '') + '">';
  h += '<label class="fl">' + esc(t('tr.price')) + '</label><input id="t-price" type="number" inputmode="decimal" value="' + esc(x ? x.price : '') + '">';
  h += '<label class="fl">' + esc(t('tr.date')) + '</label><input id="t-date" type="date" value="' + esc(x ? x.date : '') + '">';
  h += '<label class="fl">' + esc(t('tr.status')) + '</label><select id="t-status">';
  TRST.forEach(function (s) { h += '<option value="' + s + '"' + ((x ? x.status : 'idea') === s ? ' selected' : '') + '>' + esc(trLabel(s)) + '</option>'; });
  h += '</select>';
  h += '<label class="fl">' + esc(t('tr.notes')) + '</label><textarea id="t-notes">' + esc(x ? x.notes : '') + '</textarea>';
  h += '<div class="row" style="margin-top:14px"><button class="btn primary grow" data-act="tr-save" data-id="' + (x ? x.id : '') + '">' + esc(t('b.save')) + '</button><button class="btn grow" data-act="modal-close">' + esc(t('b.cancel')) + '</button>' + (x ? '<button class="btn danger" data-act="tr-del" data-id="' + x.id + '">' + esc(t('b.delete')) + '</button>' : '') + '</div>';
  openModal(h);
}
function saveTrain(id) {
  var name = $('t-name').value.replace(/^\s+|\s+$/g, '');
  if (!name) { toast(t('t.nameReq')); return; }
  var rec = { id: id || uid(), name: name, provider: $('t-provider').value, price: parseFloat($('t-price').value) || 0, date: $('t-date').value, status: $('t-status').value, notes: $('t-notes').value, upd: Date.now() }, i, found = false;
  for (i = 0; i < S.trainings.length; i++) if (S.trainings[i].id === rec.id) { S.trainings[i] = rec; found = true; }
  if (!found) S.trainings.push(rec);
  autoSave(); closeModal(); toast(t('t.saved'));
}
function delTrain(id) {
  var i;
  for (i = 0; i < S.trainings.length; i++) if (S.trainings[i].id === id) {
    undoItem = { kind: 'train', rec: JSON.parse(JSON.stringify(S.trainings[i])) };
    S.trainings[i].del = true; S.trainings[i].upd = Date.now();
  }
  autoSave(); closeModal(); toast(t('t.deleted'), true);
}
function doUndo() {
  if (!undoItem) return;
  var list = undoItem.kind === 'case' ? S.cases : S.trainings, i;
  for (i = 0; i < list.length; i++) if (list[i].id === undoItem.rec.id) { list[i] = undoItem.rec; list[i].upd = Date.now(); list[i].del = false; }
  undoItem = null; $('toast').style.display = 'none'; autoSave(); renderAll();
}

/* ---------- theme, font size ---------- */
var THEMES = ['light', 'sand', 'navy', 'dark'];
var THEME_ICONS = { light: '☀︎', sand: '○', navy: '◑', dark: '☾' };
var FS_STEPS = [0.8, 0.9, 1.0, 1.1, 1.2, 1.35, 1.5];
function applyTheme(th) {
  document.documentElement.setAttribute('data-theme', th === 'light' ? '' : th);
  $('theme-btn').textContent = THEME_ICONS[th] || '☀︎';
  localStorage.setItem(K.theme, th);
  renderSettings();
}
function toggleTheme() { var cur = localStorage.getItem(K.theme) || 'light'; applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]); }
function applyFontSize(idx) {
  idx = Math.max(0, Math.min(FS_STEPS.length - 1, idx));
  var page = document.querySelector('.page'), sc = FS_STEPS[idx];
  if (window.CSS && CSS.supports && CSS.supports('zoom', '1')) page.style.zoom = sc;
  localStorage.setItem(K.fs, String(idx));
  renderSettings();
}

/* ---------- events ---------- */
function showTab(name) {
  var tabs = document.querySelectorAll('.tab'), secs = document.querySelectorAll('.section'), i;
  for (i = 0; i < tabs.length; i++) tabs[i].className = 'tab' + (tabs[i].getAttribute('data-tab') === name ? ' active' : '');
  for (i = 0; i < secs.length; i++) secs[i].className = 'section' + (secs[i].id === 'tab-' + name ? ' active' : '');
  window.scrollTo(0, 0);
}
function exportData() {
  var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'gov001-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
document.addEventListener('click', function (e) {
  var tabBtn = e.target.closest ? e.target.closest('[data-tab]') : null;
  if (tabBtn) { showTab(tabBtn.getAttribute('data-tab')); return; }
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
  if (act === 'plan') return; // handled by change
  if (act === 'lang') { LANG = v; localStorage.setItem(K.lang, v); applyStatic(); renderAll(); if (modalOpen()) { /* keep form closed on language switch */ closeModal(); } }
  else if (act === 'theme') toggleTheme();
  else if (act === 'fs') { var cur = parseInt(localStorage.getItem(K.fs) || '2', 10); applyFontSize(v === '0' ? 2 : cur + parseInt(v, 10)); }
  else if (act === 'filter') { filterCls = v; renderCases(); }
  else if (act === 'l-open') { LV = { mod: id, mode: 'lesson' }; renderLearn(); window.scrollTo(0, 0); }
  else if (act === 'l-back') { LV = null; renderLearn(); window.scrollTo(0, 0); }
  else if (act === 'l-read') toggleRead(id);
  else if (act === 'l-start') { LV = { mod: id, mode: 'quiz', i: 0, answers: [], sel: -1 }; renderLearn(); window.scrollTo(0, 0); }
  else if (act === 'l-pick') pickAnswer(parseInt(v, 10));
  else if (act === 'l-next') nextQuestion();
  else if (act === 'case-new') openCase('');
  else if (act === 'case-edit') openCase(id);
  else if (act === 'case-save') saveCase(id);
  else if (act === 'case-del') delCase(id);
  else if (act === 'tr-new') openTrain('');
  else if (act === 'tr-edit') openTrain(id);
  else if (act === 'tr-save') saveTrain(id);
  else if (act === 'tr-del') delTrain(id);
  else if (act === 'modal-close') closeModal();
  else if (act === 'undo') doUndo();
  else if (act === 'drive-connect') connectDrive();
  else if (act === 'drive-sync') { syncNow(); }
  else if (act === 'drive-off') disconnectDrive();
  else if (act === 'export') exportData();
  else if (act === 'import') $('imp-file').click();
  else if (act === 'reset-plan') { if (window.confirm(t('t.confirm'))) { var k, now = Date.now(); for (k in S.plan.done) S.plan.done[k] = { d: false, t: now }; autoSave(); renderPlan(); } }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.getAttribute && el.getAttribute('data-act') === 'plan') {
    S.plan.done[el.getAttribute('data-id')] = { d: !!el.checked, t: Date.now() };
    autoSave(); renderPlan(); return;
  }
  if (el.getAttribute && el.getAttribute('data-act') === 'l-mine') {
    saveL(el.getAttribute('data-id'), { mine: el.value }); return;
  }
  if (el.getAttribute && el.getAttribute('data-act') === 'l-note') {
    saveL(el.getAttribute('data-id'), { note: el.value }); return;
  }
  if (modalOpen() && el.id && (el.id.indexOf('q-') === 0 || el.id === 'f-autonomy')) refreshResult();
});
$('imp-file').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try { var o = JSON.parse(rd.result); S = mergeState(S, o); ensureState(); autoSave(); renderAll(); toast(t('t.imported')); }
    catch (err) { toast(t('t.badfile')); }
  };
  rd.readAsText(f); e.target.value = '';
});

/* ---------- init ---------- */
LANG = localStorage.getItem(K.lang) || ((navigator.language || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
load();
applyStatic();
applyTheme(localStorage.getItem(K.theme) || 'light');
applyFontSize(parseInt(localStorage.getItem(K.fs) || '2', 10));
setSync(tokenValid() ? 'pending' : 'local');
renderAll();
if (tokenValid()) syncNow();
setInterval(function () { if (!document.hidden && tokenValid() && !modalOpen()) syncNow(); }, 60000);
$('boot').style.display = 'none';
})();
</script>
