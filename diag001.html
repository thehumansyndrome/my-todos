/* [id, domaine, tailles, poids(1-3), énoncé FR, référence FR, action FR si « Non », action FR si « Partiel »] — traductions EN dans EN_Q */
const FLASH=[["f1", "R1", "PMG", 3, "Un DPO (ou à défaut un référent protection des données) est désigné, identifié en interne et dispose de temps et de moyens.", "RGPD art. 37-39", "Désigner un DPO/référent, formaliser sa lettre de mission et le déclarer à la CNIL.", "Consolider le rôle du DPO/référent : lettre de mission, temps dédié, moyens et accès direct à la direction."], ["f2", "R1", "PMG", 2, "Les collaborateurs manipulant des données personnelles sont sensibilisés ou formés régulièrement.", "RGPD art. 39.1.b", "Déployer un module de sensibilisation annuel + sessions ciblées (RH, marketing, IT).", "Étendre la sensibilisation aux populations non couvertes, la rendre annuelle et suivre les taux de complétion."], ["f3", "R1", "MG", 2, "La conformité est pilotée : comité, indicateurs, reporting à la direction, plan de contrôle.", "RGPD art. 5.2, 24", "Installer une comitologie et un tableau de bord conformité trimestriel.", "Compléter le pilotage : indicateurs manquants, fréquence formalisée du comité et reporting régulier à la direction."], ["f4", "R1", "G", 2, "Un réseau de relais couvre les filiales / métiers et, en cas de responsabilité conjointe ou de sous-traitance intra-groupe, les obligations respectives sont définies par accord ou contrat.", "RGPD art. 24, 26, 28.3", "Structurer un réseau de relais et des accords intra-groupe (responsabilité conjointe, sous-traitance interne).", "Combler les trous du réseau de relais et formaliser les responsabilités intra-groupe encore implicites."], ["f5", "R2", "PMG", 3, "Le registre des activités de traitement existe, est complet et tenu à jour (revue au moins annuelle recommandée).", "RGPD art. 30", "Constituer ou rafraîchir le registre par ateliers métiers ; instaurer une revue annuelle.", "Compléter les traitements manquants du registre et instaurer une revue annuelle pilotée."], ["f6", "R3", "PMG", 3, "Chaque traitement repose sur une base légale de l’article 6.1 et a une durée de conservation définie et appliquée (purge).", "RGPD art. 5.1.e, 5.2 ; art. 6.1", "Établir le référentiel des bases légales et des durées ; planifier les purges.", "Documenter les bases légales et durées manquantes, puis vérifier que les purges sont réellement exécutées."], ["f7", "R4", "PMG", 2, "Les personnes sont informées (mentions, politique de confidentialité) à chaque point de collecte.", "RGPD art. 12-14", "Auditer les points de collecte et harmoniser les mentions d'information.", "Corriger les points de collecte non couverts ou incomplets et harmoniser les mentions existantes."], ["f8", "R4", "PMG", 3, "Une procédure permet de traiter les demandes de droits dans le délai d’un mois (prolongeable de deux mois), avec traçabilité.", "RGPD art. 12, 15-22", "Formaliser la procédure, un point d'entrée unique et un registre des demandes.", "Fiabiliser la procédure existante : point d'entrée unique, vérification d'identité, suivi du délai et registre."], ["f9", "R4", "PMG", 2, "Les cookies et traceurs du site / des apps respectent le consentement (refus aussi simple que l'acceptation).", "LIL art. 82 ; lignes directrices CNIL", "Auditer les traceurs et paramétrer une CMP conforme.", "Corriger les écarts de la CMP (refus aussi simple, traceurs déposés avant consentement, durée) et la réauditer."], ["f10", "R5", "PMG", 3, "Les sous-traitants sont recensés et leurs contrats contiennent les clauses de l'article 28.", "RGPD art. 28", "Inventorier les sous-traitants et régulariser les contrats (DPA).", "Compléter l'inventaire des sous-traitants et régulariser en priorité les contrats sans clauses article 28."], ["f11", "R5", "PMG", 2, "Les transferts hors UE sont identifiés et encadrés (décision d’adéquation, ou garanties appropriées telles que les CCT avec analyse d’impact du transfert).", "RGPD art. 44-49 ; recommandations CEPD 01/2020", "Cartographier les transferts, signer les CCT et documenter les TIA.", "Compléter la cartographie des transferts et documenter les CCT et TIA manquants."], ["f12", "R6 const EN_Q={"f1": ["A DPO (or failing that, a data protection lead) is appointed, known internally, and has time and resources.", "Appoint a DPO/lead, formalise their mission letter and register them with the CNIL.", "Consolidate the DPO/lead role: mission letter, dedicated time, resources and direct access to senior management."], "f2": ["Staff handling personal data receive regular awareness or training.", "Roll out an annual awareness module plus targeted sessions (HR, marketing, IT).", "Extend awareness to uncovered populations, make it annual and track completion rates."], "f3": ["Compliance is steered: committee, indicators, reporting to management, control plan.", "Set up a governance committee and a quarterly compliance dashboard.", "Complete the steering: missing indicators, formal committee frequency and regular reporting to management."], "f4": ["A network of relays covers subsidiaries / business lines and, for joint controllership or intra-group processing, respective obligations are set out in an arrangement or contract.", "Build a relay network and intra-group agreements (joint controllership, internal processing).", "Fill the gaps in the relay network and formalise intra-group responsibilities that are still implicit."], "f5": ["The record of processing activities exists, is complete and kept up to date (at least an annual review recommended).", "Build or refresh the record through business workshops; set up an annual review.", "Add the missing processing activities to the record and set up a managed annual review."], "f6": ["Each processing activity relies on a legal basis under Article 6(1) and has a defined, enforced retention period (purge).", "Establish the legal basis and retention reference; schedule purges.", "Document the missing legal bases and retention periods, then check purges are actually run."], "f7": ["Individuals are informed (notices, privacy policy) at every collection point.", "Audit collection points and harmonise privacy notices.", "Fix uncovered or incomplete collection points and harmonise existing notices."], "f8": ["A procedure handles rights requests within one month (extendable by two months), with traceability.", "Formalise the procedure, a single entry point and a request log.", "Strengthen the existing procedure: single entry point, identity check, deadline tracking and log."], "f9": ["Website / app cookies and trackers comply with consent (refusing as easy as accepting).", "Audit trackers and configure a compliant CMP.", "Fix CMP gaps (easy refusal, trackers set before consent, duration) and re-audit."], "f10": ["Processors are listed and their contracts include Article 28 clauses.", "Inventory processors and regularise contracts (DPA).", "Complete the processor inventory and regularise first the contracts lacking Article 28 clauses."], "f11": ["Transfers outside the EU are identified and framed (adequacy decision, or appropriate safeguards such as SCCs with a transfer impact assessment).", "Map transfers, sign SCCs and document TIAs.", "Complete the transfer map and document the missing SCCs and TIAs."], "f12": ["Security measures proportionate to risks are in place (access rights, encryption, backups, logging).", "Run a risk analysis and a security plan aligned with the CNIL security guide.", "Close the identified security gaps (access, encryption, backups, logging) based on the risk analysis."], "f13": ["A breach procedure allows notifying the CNIL within 72 hours when the breach poses a risk, and a register of all breaches is kept.", "Write the procedure and register, and test them through a crisis exercise.", "Complete the procedure (criteria, decision path, templates), keep the register and test it through an exercise."], "f14": ["High-risk processing activities are covered by a DPIA.", "List processing subject to DPIA and carry out the missing assessments.", "Carry out the missing DPIAs and update outdated ones."], "f15": ["Data protection is built into projects from the design stage (privacy by design).", "Add a privacy milestone to the project methodology and procurement.", "Make the privacy milestone systematic and binding in the project methodology and procurement."], "f16": ["An inventory of AI systems and use cases exists (bought, built, embedded, generative AI, shadow AI).", "Launch an AI system inventory and create an AI register.", "Complete the inventory (embedded AI, shadow AI, generative AI) and keep it continuously updated."], "f17": ["An AI lead and an AI governance body are identified (with DPO, CISO, legal, business).", "Appoint an AI lead and set up an AI governance committee.", "Formalise the AI lead's mandate and the committee charter, and ensure all key functions attend."], "f18": ["An AI management system (ISO/IEC 42001 type) is in place or planned.", "Scope an AI management system and connect it with existing ISMS / QMS.", "Structure the AI management system project: scope, roadmap and links with ISMS and QMS."], "f19": ["For each system, the company's role is qualified (provider, deployer, importer, distributor).", "Qualify the role for each system and record the rationale.", "Qualify the role of the remaining systems and document the rationale for each."], "f20": ["Systems are classified by risk level (prohibited, high-risk, transparency, minimal).", "Apply a classification grid and document Article 6.3 exemptions.", "Classify the remaining systems and document Article 6.3 exemptions."], "f21": ["The absence of prohibited practices has been checked (social scoring, manipulation, emotion recognition at work…).", "Screen every use case against Article 5 and stop prohibited uses.", "Extend Article 5 screening to all use cases and record the conclusions."], "f22": ["An AI literacy programme trains staff according to their role.", "Roll out an AI training path per population.", "Extend AI training to uncovered populations and tailor it to roles (users, overseers, decision-makers)."], "f23": ["A charter / policy governs generative AI use (confidential data, approved tools, verification).", "Publish a generative AI charter and a list of approved tools.", "Complete the charter (approved tools, forbidden data, human verification) and have everyone accept it."], "f24": ["Transparency obligations are handled: notice of AI interaction, labelling of generated content, deepfakes.", "List chatbots and synthetic content and deploy notices and labelling.", "Cover the remaining chatbots and synthetic content and check the quality of notices and labelling."], "f25": ["For deployed high-risk systems: human oversight, log retention, information of individuals, FRIA where required.", "Build the deployer compliance plan by end 2027.", "Complete the missing deployer obligations (oversight, logs, information, FRIA) before December 2027."], "f26": ["If the company develops or places high-risk systems on the market: provider requirements are anticipated (otherwise N/A).", "Run a provider gap analysis and plan the conformity assessment.", "Complete the provider gap analysis and plan the requirements not yet covered."], "f27": ["Contracts with AI vendors cover documentation, AI Act compliance, intellectual property and data reuse.", "Add standard AI clauses to procurement and renegotiate key contracts.", "Extend AI clauses to existing contracts and new purchases."], "f28": ["GDPR / AI interplay is handled: legal basis for training data, DPIA, automated decision-making.", "Cover each AI system processing personal data with a DPIA including the AI dimension.", "Extend the AI-aware DPIA to all AI systems processing personal data and document training legal bases."], "r101": ["DPO appointed where required, contact details published and notified to the CNIL.", "Appoint and register the DPO.", "Publish the DPO's contact details and check the CNIL notification."], "r102": ["The DPO is involved early, independent, free of conflicts of interest, with sufficient resources.", "Formalise the DPO's mission letter and budget.", "Strengthen the DPO's independence and resources, and involve them early in every project."], "r103": ["A data protection policy approved by management is circulated.", "Draft the general policy and have it approved.", "Update the policy, have it approved by management and circulate it to all."], "r104": ["Roles and responsibilities (business, IT, relays) are defined.", "Establish a data protection RACI.", "Complete the RACI for uncovered roles and communicate it."], "r105": ["An annual report and indicators are presented to management.", "Set up an annual DPO report and KPIs.", "Formalise the annual report and complete the indicators presented to management."], "r106": ["A compliance control / audit plan is executed.", "Define a multi-year control plan.", "Run the control plan regularly and track corrective actions."], "r107": ["The role of each group entity is qualified (controller, joint controller, processor), an arrangement sets out joint controllers’ obligations and each subsidiary has a relay.", "Formalise intra-group agreements and the relay network.", "Formalise the missing intra-group agreements and complete the relay network per subsidiary."], "r108": ["An awareness and training programme for staff involved in processing is deployed.", "Roll out a training plan with completion tracking.", "Extend training to uncovered populations and track completion."], "r201": ["Controller's record complete (controller and DPO contact details, purposes, categories of data subjects and data, recipients, transfers, erasure time limits, security measures).", "Complete the record.", "Complete the missing fields of the record (recipients, retention, security measures)."], "r202": ["Processor's record kept for activities carried out on behalf of clients.", "Create the processor record.", "Complete the processor record for all activities carried out on behalf of clients."], "r203": ["A process keeps the record up to date (new projects, periodic review).", "Set up an annual review and a project trigger.", "Make updates systematic: mandatory project trigger and recorded annual review."], "r204": ["The map of applications and data flows is linked to the record.", "Link the record with the CMDB / IT map.", "Link the remaining applications and flows to the record."], "r205": ["Sensitive and criminal-offence data are identified with their applicable exception.", "List sensitive data and justify the exception.", "Complete the inventory of sensitive data and document the applicable exception for each."], "r301": ["Each processing purpose relies on one of the legal bases of Article 6(1) (consent, performance of a contract or pre-contractual steps, legal obligation, vital interests, public task or exercise of official authority, legitimate interests).", "Determine the legal basis of each purpose and record it (record of processing, processing sheet) so it can be demonstrated.", "Document the missing legal bases and correct inappropriate ones."], "r302": ["Consent, where it is the legal basis, is freely given, specific, informed and unambiguous, demonstrable and as easy to withdraw as to give.", "Review consent journeys and keep proof.", "Fix non-compliant consent journeys and set up proof retention."], "r303": ["Where legitimate interest is relied on, the balancing against data subjects’ interests and rights is carried out and can be demonstrated.", "Write the balancing tests (LIA).", "Write the missing balancing tests and review insufficient ones."], "r304": ["Only necessary data is collected (data minimisation).", "Review forms and mandatory fields.", "Remove the remaining unnecessary fields and review mandatory fields."], "r305": ["Retention periods are defined and purging / archiving is effective in systems.", "Build the retention reference and automate purges.", "Complete the retention reference and make purges effective in all systems."], "r306": ["Data reuse is subject to a purpose-compatibility test.", "Introduce a compatibility test for any new use.", "Apply the compatibility test to all new reuses."], "r401": ["Privacy notices are complete at every collection point (direct and indirect).", "Upgrade privacy notices.", "Complete incomplete notices and cover indirect collection."], "r402": ["Employees and candidates are informed of HR processing.", "Issue an HR privacy notice.", "Complete HR information (candidates, monitoring tools, new processing)."], "r403": ["The rights-request procedure is operational: channel, identity check, one-month deadline, log.", "Formalise and tool the procedure.", "Complete the procedure (identity check, deadline, log) and test it."], "r404": ["Systems technically allow access, erasure, restriction and portability.", "Check technical capability per application.", "Close the technical limits identified on the applications concerned."], "r405": ["Cookies and trackers: prior consent, equally easy refusal, proof, 6-month duration recommended.", "Audit and reconfigure the CMP.", "Fix CMP gaps and check proof retention."], "r406": ["Direct marketing complies with opt-in / opt-out rules and objection lists.", "Review marketing rules and objection handling.", "Fix non-compliant campaigns and make objection handling reliable."], "r501": ["An inventory of processors and sub-processors is kept.", "Draw up the processor inventory.", "Complete the inventory, including sub-processors."], "r502": ["Contracts include all mandatory clauses of Article 28.3.", "Regularise contracts with a standard DPA.", "Add the missing clauses to existing contracts with a standard DPA."], "r503": ["Processors are assessed before contracting and then monitored (questionnaires, audits).", "Set up graduated third-party due diligence.", "Make processor assessments systematic and introduce periodic checks."], "r504": ["Transfers outside the EU are mapped, including remote access and cloud hosting.", "Map transfers.", "Complete the transfer map (remote access, cloud, support)."], "r505": ["Each transfer relies on a valid tool (adequacy decision, 2021 SCCs, BCRs); for Article 46 safeguards, a transfer impact assessment is carried out.", "Sign SCCs and document TIAs.", "Document the missing TIAs and update pre-2021 SCCs."], "r506": ["BCRs or an equivalent intra-group framework govern internal transfers.", "Assess the case for BCRs.", "Formalise the existing intra-group framework or launch a BCR project."], "r601": ["A risk analysis underpins security measures; an information security policy exists.", "Carry out the risk analysis and formalise the security policy.", "Update the risk analysis and complete the security policy."], "r602": ["Access management: least privilege, periodic review, strong authentication on sensitive access.", "Set up access reviews and MFA.", "Introduce regular access reviews and extend MFA to the remaining sensitive access."], "r603": ["Encryption of endpoints, flows and sensitive databases; pseudonymisation where relevant.", "Deploy encryption at rest and in transit.", "Extend encryption to endpoints, flows and databases not yet covered."], "r604": ["Logging of data access and monitoring of security events.", "Enable and use access logs.", "Extend logging to the remaining applications and organise its review."], "r605": ["Tested backups and a business continuity / recovery plan.", "Test restores and formalise the BCP/DRP.", "Test restores regularly and complete the BCP/DRP."], "r606": ["Regular penetration tests and security audits, with patch follow-up.", "Plan pentests and vulnerability management.", "Make tests regular and formalise patch follow-up."], "r701": ["Procedure for detecting, qualifying and escalating data breaches.", "Write the procedure and qualification grid.", "Complete the procedure: qualification grid, escalation path and responsibilities."], "r702": ["A breach register is kept, including non-notified breaches.", "Create the breach register.", "Complete the register, including non-notified breaches."], "r703": ["Ability to notify the CNIL within 72 hours and to inform individuals without undue delay in case of high risk.", "Prepare notification templates and a decision path.", "Prepare the missing notification templates and test the 72-hour deadline."], "r704": ["Processors are contractually required to notify any breach without undue delay.", "Add the alert clause to contracts.", "Add the alert clause to contracts that lack it."], "r705": ["Crisis exercises include a data breach scenario.", "Organise an annual exercise.", "Add the data breach scenario to existing crisis exercises."], "r801": ["Project methodology and procurement include a data protection milestone from the design stage.", "Add a privacy-by-design checklist.", "Make the privacy-by-design milestone mandatory and check its application."], "r802": ["Criteria identify processing subject to DPIA (CNIL lists, 9 EDPB criteria).", "Formalise the DPIA trigger grid.", "Complete the trigger grid with the CNIL list and the 9 EDPB criteria."], "r803": ["Required DPIAs are carried out, approved and reviewed.", "Carry out the missing DPIAs.", "Carry out the missing DPIAs and schedule the review of existing ones."], "r804": ["The DPO’s advice is sought when carrying out the DPIA; the CNIL is consulted beforehand if residual risk remains high.", "Involve the DPO in each DPIA and record their advice (good practice).", "Record the DPO's opinion systematically and formalise the CNIL consultation criterion."], "r805": ["Default settings are the most protective (privacy by default).", "Review default settings.", "Review the default settings of the remaining applications."], "a101": ["An AI compliance lead is appointed with a clear mandate.", "Appoint an AI lead.", "Formalise the AI lead's mandate, scope and resources."], "a102": ["An AI governance committee brings together DPO, CISO, legal, data and business.", "Set up the committee and its charter.", "Formalise the committee charter and bring in the missing functions."], "a103": ["An AI policy approved by management sets principles, risk appetite and prohibitions.", "Draft the AI policy.", "Complete the policy (risk appetite, prohibitions) and have it approved by management."], "a104": ["An AI system register lists all use cases (built, bought, embedded).", "Create the AI system register.", "Complete the register (embedded AI, bought AI, shadow AI) and keep it updated."], "a105": ["Every new use case goes through a validation (intake) process before go-live.", "Set up an intake process for use cases.", "Make the intake process mandatory for every new use case."], "a106": ["An AI management system (ISO/IEC 42001) is deployed or planned.", "Scope an AI management system project.", "Structure the AI management system project: scope, schedule and owners."], "a201": ["Each tool is assessed against the definition of an \"AI system\".", "Apply an AI system qualification test.", "Apply the qualification test to the remaining tools and record the conclusions."], "a202": ["The role (provider, deployer, importer, distributor) is determined per system.", "Qualify and record the role.", "Qualify the role of the remaining systems and record the rationale."], "a203": ["Each use case is screened against prohibited practices.", "Run the Article 5 screening and stop prohibited uses.", "Extend Article 5 screening to the remaining use cases."], "a204": ["High-risk classification is carried out (Annex I regulated products, Annex III use cases).", "Classify systems with the Annex I / III grid.", "Complete the classification of the remaining systems against Annexes I and III."], "a205": ["Any Article 6.3 exemption is documented.", "Document exemption assessments.", "Document the exemptions not yet recorded."], "a206": ["The risk of being requalified as provider (own brand, substantial modification, change of purpose) is controlled.", "Govern modifications and white-labelling.", "Complete the governance of substantial modifications and white-label uses."], "a301": ["Measures are taken to ensure a sufficient level of AI literacy among staff, adapted to their knowledge and the context of use.", "Roll out the AI literacy path.", "Extend the path to uncovered populations and track completion."], "a302": ["A generative AI usage charter is circulated and accepted.", "Publish the generative AI charter.", "Complete the charter and have all users accept it."], "a303": ["A list of approved AI tools exists; shadow AI is detected and handled.", "Build the tool catalogue and usage controls.", "Complete the tool catalogue and set up shadow AI detection."], "a304": ["Confidential and personal data entered into AI tools is controlled (settings, no reuse for training).", "Configure enterprise plans and input rules.", "Extend enterprise plans and input rules to all tools in use."], "a401": ["Individuals are informed when they interact with an AI system (chatbots, voicebots).", "Add the AI interaction notice.", "Add the AI interaction notice to the remaining chatbots and voicebots."], "a402": ["As provider: synthetic content is marked in a machine-readable format.", "Implement marking / watermarking.", "Extend marking to uncovered synthetic content."], "a403": ["Individuals exposed to emotion recognition or biometric categorisation are informed.", "Inform and check lawfulness (Article 5).", "Complete the information of exposed individuals and check lawfulness under Article 5."], "a404": ["Deepfakes and AI-generated texts of public interest are disclosed as such.", "Define editorial labelling rules.", "Apply labelling rules to all relevant content."], "a501": ["High-risk systems are used in accordance with the provider's instructions.", "Collect instructions and formalise conditions of use.", "Collect the missing instructions and formalise the remaining conditions of use."], "a502": ["Human oversight is assigned to competent, trained people with the necessary authority.", "Appoint and train human overseers.", "Complete the appointment and training of overseers and clarify their authority."], "a503": ["Relevance and representativeness of input data under the deployer's control are ensured.", "Set up quality checks on input data.", "Extend quality checks to uncovered input data."], "a504": ["Operation is monitored; risks and serious incidents are reported to the provider and the authority.", "Define the monitoring and reporting process.", "Complete the monitoring process and formalise incident reporting."], "a505": ["Automatically generated logs are kept for at least six months.", "Configure log retention.", "Extend six-month log retention to the remaining systems."], "a506": ["Worker representatives and affected employees are informed before workplace deployment.", "Consult the works council and inform employees.", "Complete information and works council consultation on the remaining systems."], "a507": ["Individuals subject to decisions assisted by an Annex III system are informed and can obtain an explanation.", "Organise information and the right to explanation.", "Complete the information of individuals and make the right to explanation operational."], "a508": ["A fundamental rights impact assessment (FRIA) is carried out where required; the DPIA relies on the provider's documentation.", "Design a FRIA template linked with the DPIA.", "Complete the FRIA template and link it with the DPIA on the remaining systems."], "a601": ["A risk management system covers the whole life cycle.", "Set up the AI risk management process.", "Extend risk management to all life-cycle phases."], "a602": ["Governance of training, validation and test data (quality, bias, representativeness).", "Formalise data set governance.", "Complete data set governance (bias, representativeness, traceability)."], "a603": ["Technical documentation (Annex IV) and automatic event logging.", "Produce the technical documentation and enable logging.", "Complete the missing technical documentation and logging."], "a604": ["Instructions for use and a design that enables human oversight.", "Write the instructions and specify human oversight measures.", "Complete the instructions and human oversight measures."], "a605": ["Accuracy, robustness and cybersecurity are specified, tested and measured.", "Define metrics and test campaigns.", "Complete the metrics and extend test campaigns."], "a606": ["A quality management system is documented.", "Extend the QMS to AI requirements.", "Add the missing AI requirements to the QMS."], "a607": ["Conformity assessment, EU declaration, CE marking and registration in the EU database.", "Plan the conformity assessment path.", "Complete the conformity path (EU declaration, CE marking, registration)."], "a608": ["Post-market monitoring and serious incident notification.", "Build the post-market monitoring plan.", "Complete the post-market monitoring plan and the notification path."], "a701": ["Contracts with AI vendors contain dedicated clauses (compliance, documentation, audit, IP, data).", "Roll out standard AI clauses.", "Extend AI clauses to existing contracts."], "a702": ["Documentation from providers of integrated general-purpose AI models is obtained and used.", "Require GPAI documentation from vendors.", "Obtain the missing GPAI documentation and use it in the risk analysis."], "a703": ["If the company provides a GPAI model: technical documentation, copyright policy, training data summary (otherwise N/A).", "Apply the GPAI code of practice.", "Complete the missing items (documentation, copyright policy, data summary)."], "a704": ["Using personal data to train or fine-tune models relies on a legal basis and appropriate information.", "Document legal basis and information for training data sets.", "Complete the legal basis and information for the remaining training data sets."], "a705": ["Fully automated decisions with significant effects are identified and governed.", "List automated decisions and guarantee human intervention.", "Complete the list of automated decisions and guarantee human intervention."], "a706": ["AI systems processing personal data undergo a DPIA covering AI-specific risks.", "Add an AI component to the DPIA method.", "Extend the AI component to all DPIAs of the systems concerned."], "t101": ["The purpose of the processing is specified, explicit and legitimate.", "Define a specified, explicit and legitimate purpose and state it in the record entry and the privacy notice.", "Clarify the purpose (too broad or vague) and check its legitimacy in light of the organisation's activities.", "GDPR art. 5.1.b"], "t102": ["The processing relies on one of the legal bases of Article 6(1) (consent, performance of a contract or pre-contractual steps, legal obligation, vital interests, public task or exercise of official authority, legitimate interests), appropriate to its purpose; where legitimate interest is relied on, the balancing against data subjects’ interests and rights is carried out.", "Determine the legal basis appropriate to the purpose (balancing test for legitimate interest) and keep the rationale so it can be demonstrated.", "Review whether the legal basis fits the purpose and complete the balancing test where legitimate interest is relied on.", "GDPR art. 6.1; art. 5.2"], "t103": ["Any reuse of data for another purpose has undergone a compatibility test.", "Carry out the compatibility test for each reuse.", "Complete and record the existing compatibility tests.", "GDPR art. 6.4"], "t201": ["Only data necessary for the purpose is collected (minimisation).", "Review collected data with the business and remove unnecessary fields.", "Remove the remaining superfluous data and justify each mandatory field.", "GDPR art. 5.1.c"], "t202": ["If sensitive or criminal-offence data is processed, ensure its processing relies on a valid exception.", "Check the applicable exception (Art. 9(2)) or, for criminal-offence data, the authorised framework (Art. 10), or stop collecting this data.", "Complete the justification of the exception for each sensitive data item.", "GDPR art. 9, 10"], "t203": ["A retention period is defined and actually enforced (purge or archiving).", "Define the retention period and configure purging in the application.", "Make purging effective and verifiable in the application.", "GDPR art. 5.1.e"], "t204": ["Measures ensure data accuracy and updating.", "Set up quality checks and an update process.", "Complete the data quality checks.", "GDPR art. 5.1.d"], "t301": ["Individuals are fully informed, at the time of collection or, if data is obtained indirectly, within one month at the latest.", "Draft and publish the privacy notice for the processing.", "Complete the privacy notice (purpose, legal basis, retention, rights, recipients).", "GDPR art. 13, 14"], "t302": ["The rights applicable to this processing (access, rectification, erasure, restriction, objection, portability where applicable) can technically be exercised.", "Make the application able to handle data subject requests.", "Close the technical limits identified (erasure, portability…).", "GDPR art. 15-21"], "t303": ["Any fully automated decision with significant effects is identified and governed (human intervention, right to contest).", "Set up human intervention and a way to contest decisions.", "Formalise human intervention and inform individuals of their right to contest.", "GDPR art. 22"], "t401": ["The processors involved are identified and bound by an Article 28 contract.", "List the processors and sign the missing DPAs.", "Add the missing clauses to existing contracts.", "GDPR art. 28"], "t402": ["Any transfers outside the EU (including remote access or support) are identified and framed.", "Map transfers and frame them (SCCs, transfer impact assessment).", "Document the missing transfer impact assessments.", "GDPR chapter V"], "t403": ["Internal and external recipients are identified and limited to need.", "Identify recipients and restrict access to what is strictly needed.", "Complete the list of recipients and review excessive access.", "GDPR art. 5, 30"], "t501": ["Application access rights follow least privilege and are reviewed periodically.", "Define access profiles per role and set up a periodic review.", "Set up periodic access reviews and remove unnecessary access.", "GDPR art. 32"], "t502": ["Data is encrypted in transit and at rest where the risk warrants it; pseudonymisation is used where relevant.", "Implement encryption and assess pseudonymisation.", "Extend encryption to flows or storage not yet covered.", "GDPR art. 32.1.a"], "t503": ["Data access is logged and logs are reviewed.", "Enable access logging and define how it is reviewed.", "Organise log review and log retention.", "GDPR art. 32; CNIL logging recommendation"], "t601": ["The processing is in the record with an up-to-date entry.", "Create the record entry for the processing.", "Update the record entry (retention, recipients, security measures).", "GDPR art. 30"], "t602": ["The need for a DPIA has been assessed and, if required, the DPIA is completed before go-live.", "Assess the need for a DPIA and carry it out if required.", "Finalise the DPIA (measures, residual risks) before go-live.", "GDPR art. 35"], "t603": ["The DPO’s advice was sought for the DPIA.", "Seek the DPO’s advice and record it in the DPIA (good practice).", "Formally record the DPO's opinion and the follow-up of their recommendations.", "GDPR art. 35.2, 39.1.c"], "t604": ["Default settings are the most protective (privacy by default).", "Review the application's default settings.", "Complete the review of default settings.", "GDPR art. 25.2"], "t701": ["The AI system is qualified: role (provider or deployer) and risk level (prohibited, high-risk, transparency, minimal).", "Qualify the system, the organisation's role and the risk level.", "Document the qualification and the rationale for the risk level.", "AI Act art. 3, 5, 6"], "t702": ["Individuals are informed that they interact with AI or that content is generated.", "Add the AI interaction notice and marking of generated content.", "Complete notices or marking on the channels not yet covered.", "AI Act art. 50"], "t703": ["Effective human oversight of the system's outputs is organised.", "Appoint and train overseers and define their power to stop the system.", "Formalise human oversight and train the overseers.", "AI Act art. 14, 26; GDPR art. 22"], "t704": ["The vendor contract excludes reuse of data for training and covers documentation and audit.", "Negotiate AI clauses (no reuse, documentation, audit).", "Add the missing clauses to the vendor contract.", "GDPR art. 28.3.a; good practice"], "t705": ["AI-specific risks (bias, errors, prompt injection, data leakage) are tested and included in the DPIA.", "Test AI-specific risks and include them in the DPIA.", "Complete the tests and document their results in the DPIA.", "GDPR art. 35; CNIL AI recommendations"], "t504": ["The risk of the processing to the rights and freedoms of individuals is assessed (high risk or not) and used to size the security measures.", "Assess the risk level of the processing (EDPB criteria) and derive the required security measures.", "Document the risk assessment and link it explicitly to the security measures chosen.", "GDPR art. 24, 32.1, 35"], "t505": ["Each supporting application implements the security measures required for the processing's risk level (organisation's Security by Design framework where applicable).", "For each supporting application, run a gap analysis against the measures required for this risk level and plan their implementation.", "Implement the remaining measures on the applications concerned, or formalise a risk acceptance.", "GDPR art. 25, 32"]};

/* ============ QUESTIONNAIRE ============ */
function renderQuest(){const d=getD();if(!d){$('tab-quest').innerHTML=noDossier();return;}
  const all=qs(d),show=all.filter(q=>qFilter==='all'||(qFilter==='todo'?!(d.answers[q[0]]&&d.answers[q[0]].i!=null):DOMS[q[1]][0]===qFilter));
  const pills=d.type==='aipd'?[['all','q.all'],['todo','q.todo']]:[['all','q.all'],['RGPD','reg.RGPD'],['IA','reg.IA'],['todo','q.todo']];
  let html=`<h2>${esc(d.client)}</h2><span class="badge b-size">${sizeL(d.size)}</span><span class="badge ${TBADGE[d.type]}">${typeL(d.type)}</span><span class="badge ${d.status==='closed'?'b-closed':'b-open'}">${t('st.'+d.status)}</span>
  ${d.status==='closed'?`<div class="poc" style="margin-top:10px">${t('q.closedBan',{d:fdate(d.closedAt||d.date)})} <button class="btn sm" onclick="reopenD('${d.id}')">${t('a.reopen')}</button></div>`:''}
  <div class="row" style="margin-top:10px"><label class="small">${t('a.auditor')}<input value="${esc(d.auditor)}" onchange="setMeta('auditor',this.value)"></label><label class="small">${t('h.scope')}<input value="${esc(d.scope)}" onchange="setMeta('scope',this.value)"></label></div>
  ${d.type==='fin'||d.type==='trt'?docsCard(d):''}${d.type==='trt'?appCard(d):''}
  <div class="progress"><div id="pg"></div></div><div class="small muted" id="pg-t"></div>
  <div class="pills">${pills.map(p=>`<button class="pill ${qFilter===p[0]?'on':''}" onclick="qFilter='${p[0]}';renderQuest()">${t(p[1])}</button>`).join('')}</div>`;
  let last='';show.forEach(q=>{if(q[1]!==last){last=q[1];const r=DOMS[last][0];
    html+=`<div class="dom"><h3><span class="badge ${r==='IA'?'b-ia':r==='AIPD'?'b-aipd':'b-rgpd'}">${regL(r)}</span>${esc(domN(last))}</h3>${d.type==='aipd'?'':`<button class="btn sm ghost" onclick="domNA('${last}')">${t('q.domNA')}</button>`}</div>`;}
    const a=d.answers[q[0]]||{};
    html+=`<div class="card q ${a.i!=null?'done':''}" id="q-${q[0]}" style="margin-top:8px"><p>${esc(qText(q))}</p><span class="mono muted">${refHTML(q)}${q[3]===3&&d.type!=='aipd'?t('q.crit'):''}</span>
    <div class="opts">${OPTS[d.type].map((o,i)=>`<button class="opt ${a.i===i?'sel '+o[2]:''}" data-c="${o[2]}" onclick="setAns('${q[0]}',${i})">${t(o[0])}</button>`).join('')}</div>
    <button class="link" onclick="this.nextElementSibling.classList.toggle('open')">${a.n?t('q.noteE'):t('q.note')}</button>
    <textarea class="note-t ${a.n?'open':''}" placeholder="${esc(t('q.notePh'))}" oninput="setNote('${q[0]}',this.value)">${esc(a.n||'')}</textarea>
    <div class="att" id="att-${q[0]}">${attHTML(d,q[0])}</div></div>`;});
  if(!show.length)html+=`<div class="empty">${t('q.empty')}</div>`;
  html+=`<div class="row noprint" style="margin-top:18px"><button class="btn primary" onclick="go('res')">${d.type==='aipd'?t('q.toAipd'):t('q.toRes')}</button></div>`;
  $('tab-quest').innerHTML=html;updProg();}
function updProg(){const d=getD();if(!d||!$('pg'))return;const s=score(d,()=>true);$('pg').style.width=(s.tot?s.ans/s.tot*100:0)+'%';$('pg-t').textContent=t('q.prog',{a:s.ans,t:s.tot});}
function setAns(id,i){const d=getD();if(!d||locked(d))return;const a=d.answers[id]=d.answers[id]||{};a.i=(a.i===i?null:i);
  const el=$('q-'+id);if(el){el.classList.toggle('done',a.i!=null);el.querySelectorAll('.opt').forEach((b,k)=>{b.className='opt'+(k===a.i?' sel '+b.getAttribute('data-c'):'');});}
  updProg();autoSave();}
function setMeta(k,v){const d=getD();if(!d||locked(d))return;d[k]=v.trim();autoSave();}
/* ---- pièces jointes / evidence attachments ---- */
const MAXMB=25,isUrl=u=>/^https:\/\/[^\s"'<>]+$/i.test(String(u||''));
function attOf(d,id){const a=d&&d.answers[id];return a&&Array.isArray(a.f)?a.f:[];}
function attN(d,id){return attOf(d,id).length;}
function attHTML(d,id){const L=attOf(d,id),ro=d.status==='closed';
  return (L.length?'<div class="chips">':'')+L.map((f,k)=>`<span class="chip">${f.kind==='url'?'🔗':'📎'}${isUrl(f.link)?`<a href="${esc(f.link)}" target="_blank" rel="noopener noreferrer" title="${esc(f.name)}">${esc(f.name)}</a>`:`<span>${esc(f.name)}</span>`}${f.size?`<span class="muted">${fsize(f.size)}</span>`:''}${ro?'':`<button title="×" onclick="delAtt('${id}',${k})">×</button>`}</span>`).join('')+(L.length?'</div>':'')
   +(ro?'':`<span class="acts"><label class="link">${t('q.att')}<input type="file" multiple onchange="addFiles('${id}',this)"></label><button class="link" onclick="addLink('${id}')">${t('q.attLink')}</button></span>`);}
function fsize(n){return n<1048576?Math.max(1,Math.round(n/1024))+(LANG==='fr'?' Ko':' KB'):(n/1048576).toFixed(1)+(LANG==='fr'?' Mo':' MB');}
function attRefresh(d,id){const el=$('att-'+id);if(el)el.innerHTML=attHTML(d,id);}
function attPush(d,id,o){const a=d.answers[id]=d.answers[id]||{};(a.f=Array.isArray(a.f)?a.f:[]).push(o);}
function addLink(id){const d=getD();if(!d||locked(d))return;const u=(prompt(t('q.attLinkQ'),'https://')||'').trim();if(!u||u==='https://')return;
  if(!isUrl(u)){toast(t('q.attLinkBad'));return;}let nm=u;try{const x=new URL(u);nm=x.hostname+decodeURIComponent(x.pathname).replace(/\/$/,'');}catch(e){}
  attPush(d,id,{kind:'url',name:nm.slice(0,120),link:u,at:Date.now()});autoSave();attRefresh(d,id);}
function addFiles(id,inp){const d=getD();if(!d||locked(d))return;const L=Array.prototype.slice.call(inp.files||[]);inp.value='';if(!L.length)return;
  const st=S.settings;if(!st.attOk){if(!confirm(t('q.attWarn',{f:FOLDER})))return;st.attOk=1;autoSave();}
  if(!tok){driveConnect(function(){upFiles(d,id,L);});return;}upFiles(d,id,L);}
async function evFolder(d){if(d.drive.ev)return d.drive.ev;const p=await ensureFolder();
  const c=await dfetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'preuves-'+slug(d.client)+'-'+d.type+'-'+d.id,mimeType:'application/vnd.google-apps.folder',parents:[p]})});
  d.drive.ev=(await c.json()).id;autoSave();return d.drive.ev;}
async function upOne(file,parent){const meta=JSON.stringify({name:file.name,parents:[parent]}),mime=file.type||'application/octet-stream',F='&fields=id,name,mimeType,size,webViewLink';
  if(file.size<=5*1048576){const b='x'+uid(),body=new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: '+mime+'\r\n\r\n',file,'\r\n--'+b+'--']);
    return (await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart'+F,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:body})).json();}
  const s=await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable'+F,{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':mime,'X-Upload-Content-Length':String(file.size)},body:meta});
  const loc=s.headers.get('Location');if(!loc)throw new Error('resumable');const r=await fetch(loc,{method:'PUT',headers:{'Content-Type':mime},body:file});if(!r.ok)throw new Error(r.status);return r.json();}
async function upFiles(d,id,L){if(!tok)return;let ok=0;toast(t('q.attUp',{n:L.length}));setSync('pend');
  for(let i=0;i<L.length;i++){const f=L[i];if(f.size>MAXMB*1048576){toast(t('q.attBig',{f:f.name,m:MAXMB}));continue;}
    try{const j=await upOne(f,await evFolder(d));attPush(d,id,{kind:'drive',id:j.id,name:j.name||f.name,mime:j.mimeType||f.type,size:+(j.size||f.size),link:j.webViewLink||('https://drive.google.com/file/d/'+j.id+'/view'),at:Date.now()});ok++;autoSave();attRefresh(d,id);}
    catch(e){toast(t('q.attFail',{f:f.name,e:e.message}));}}
  setSync(ok?'ok':'err');if(ok)toast(t('q.attOk',{n:ok}));}
function delAtt(id,k){const d=getD();if(!d||locked(d))return;const L=attOf(d,id),f=L[k];if(!f||!confirm(t('q.attDelQ')))return;L.splice(k,1);autoSave();attRefresh(d,id);
  if(f.kind==='drive'&&f.id&&tok&&!S.diags.some(x=>Object.keys(x.answers||{}).some(q=>attOf(x,q).some(g=>g.id===f.id))))
    dfetch('https://www.googleapis.com/drive/v3/files/'+f.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})}).catch(function(){});}
function attStats(d){let n=0,q=0;qs(d).forEach(x=>{const c=attN(d,x[0]);if(c){n+=c;q++;}});return {n:n,q:q};}
function attReport(d){const L=qs(d).filter(q=>attN(d,q[0]));if(!L.length)return '';let m=`\n## ${t('rep.att')}\n\n`;
  L.forEach(q=>{m+=`- **${qRef(q)}** — ${attOf(d,q[0]).map(f=>`[${f.name.replace(/[\[\]]/g,'')}](${f.link})`).join(', ')}\n`;});return m;}
function setNote(id,v){const d=getD();if(!d||locked(d))return;(d.answers[id]=d.answers[id]||{}).n=v;autoSave();}
function domNA(k){const d=getD();if(!d||locked(d))return;const na=OPTS[d.type].length-1;qs(d).filter(byDom(k)).forEach(q=>{(d.answers[q[0]]=d.answers[q[0]]||{}).i=na;});autoSave();renderQuest();toast(t('t.domNA'));}

/* ============ RÉSULTATS ============ */
function radar(d,reg){const ks=domsOf(d,reg),n=ks.length,c=160,R=110;if(n<3)return '';
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c+r*Math.cos(a),c+r*Math.sin(a)];};
  let g='';[.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${ks.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--border)"/>`;});
  const vals=ks.map(k=>score(d,byDom(k)).pct);
  ks.forEach((k,i)=>{const e=pt(i,R),l=pt(i,R+16),an=Math.abs(l[0]-c)<8?'middle':l[0]>c?'start':'end';
    g+=`<line x1="${c}" y1="${c}" x2="${e[0]}" y2="${e[1]}" stroke="var(--border)"/><text x="${l[0]}" y="${l[1]+4}" text-anchor="${an}" font-size="11" fill="var(--muted)">${esc(domS(k))}</text>`;});
  const colr=reg==='IA'?'var(--violet)':'var(--blue)';
  g+=`<polygon points="${vals.map((v,i)=>pt(i,R*(v||0)/100).join(',')).join(' ')}" fill="${colr}" fill-opacity=".18" stroke="${colr}" stroke-width="2"/>`;
  return `<svg viewBox="-90 -10 500 340" style="width:100%;max-width:440px;display:block;margin:0 auto" role="img" aria-label="Radar ${regL(reg)}">${g}</svg>`;}
function baseLine(d,reg,p){const bf=baseFor(d);if(!bf)return `<div class="small muted" style="margin-top:4px">${t('r.baseNone',{k:MINB_RES})}</div>`;const s=bf.b.g[reg];if(!s)return '';
  const rk=rankOf(p,s.vals);return `<div class="small" style="margin-top:4px">${t('r.base',{n:bf.b.n,s:bf.same?t('r.baseSize'):'',m:s.mean,p:rk==null?'—':t('r.pctTop',{x:rk})})}</div>`;}
function renderRes(){const d=getD();if(!d){$('tab-res').innerHTML=noDossier();return;}
  if(d.type==='aipd'){renderAipd(d);return;}
  const blk=reg=>{const s=score(d,byReg(reg));const bars=domsOf(d,reg).map(k=>{const p=score(d,byDom(k)).pct;
    return `<div class="bar"><span class="l">${esc(domN(k))}</span><span class="t"><div style="width:${p||0}%;background:${col(p)}"></div></span><span class="v mono">${p==null?'n/a':p+'%'}</span></div>`}).join('');
    return `<div class="card"><h3>${regL(reg)}</h3><div class="big" style="color:${col(s.pct)}">${s.pct==null?'—':s.pct+' %'}</div><div class="small muted">${level(d,s.pct)} · ${t('r.answers',{a:s.ans,t:s.tot})}</div>${d.type==='trt'?'':baseLine(d,reg,s.pct)}${radar(d,reg)}${bars}</div>`};
  const gp=gaps(d),rows=gp.slice(0,d.type==='flash'?15:99).map(x=>`<tr><td><span class="badge b-p${x.p}">P${x.p}</span></td><td>${esc(regL(DOMS[x.q[1]][0]))}</td><td>${esc(qText(x.q))}<div class="mono muted">${refHTML(x.q)}${attN(d,x.q[0])?`<span class="att-n">📎 ${attN(d,x.q[0])}</span>`:''}</div></td><td><span class="small muted">${x.k}</span><br>${esc(x.a)}</td></tr>`).join('');
  $('tab-res').innerHTML=`<h2>${t('r.h',{c:esc(d.client),t:t(d.type==='fin'?'r.hFin':d.type==='trt'?'r.hTrt':'r.hFlash')})}</h2>
  <div class="scores">${blk('RGPD')}${blk('IA')}</div>
  <div class="card"><h3>${t('r.plan',{n:gp.length})}</h3><p class="small muted">${t('r.planHint')}${attStats(d).n?' · 📎 '+t('r.att',attStats(d)):''}</p>
  <div class="tw"><table><thead><tr><th>${t('r.prio')}</th><th>${t('r.text')}</th><th>${t('r.gap')}</th><th>${t('r.action')}</th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="muted">${t('r.noGap')}</td></tr>`}</tbody></table></div></div>
  <div class="card"><h3>${t('r.cal')}</h3><div class="tw"><table><tbody>${CAL.map(c=>`<tr><td class="mono">${fdate(c[0])}</td><td>${esc(c[1][LANG==='en'?1:0])}</td><td><span class="badge ${c[2]==='in'?'b-p1':'b-p2'}">${t(c[2]==='in'?'r.calIn':'r.calNext')}</span></td></tr>`).join('')}</tbody></table></div>
  <p class="small muted" style="margin-top:6px">${t('r.calNote')}</p></div>
  <div class="row noprint"><button class="btn" onclick="dl('${APP}-report-'+LANG+'.md',buildReport(getD()))">${t('r.export')}</button><button class="btn" onclick="window.print()">${t('r.print')}</button><button class="btn" onclick="BF.type=getD().type;BF.cmp=getD().id;go('bench')" ${d.type==='trt'?'style="display:none"':''}>${t('tab.bench')} →</button>${d.demo?'':`<button class="btn" onclick="archiveD('${d.id}')">${t('r.archive')}</button>`}<button class="btn primary" onclick="go('prop')">${t('r.toProp')}</button></div>`;}
function aipdQual(d){const v=id=>{const a=d.answers[id];return a&&a.i!=null?OPTS.aipd[a.i][0]:null;};const C=['c1','c2','c3','c4','c5','c6','c7','c8','c9'];
  const crit=C.filter(k=>v(k)==='o.yes').length,unc=C.filter(k=>v(k)==='o.unsure').length;
  let vk;if(v('q0')==='o.no')vk='ai.v0';else if(crit>=2)vk='ai.v1';else if(crit+unc>=2)vk='ai.v2';else if(crit===1)vk='ai.v3';else vk='ai.v4';
  const flags=[];if(v('s1')!=='o.no'){if(v('s2')==='o.yes')flags.push([t('ai.f.ban'),t('ai.f.banD')]);if(v('s3')==='o.yes')flags.push([t('ai.f.hr'),t('ai.f.hrD')]);if(v('s4')==='o.yes')flags.push([t('ai.f.tr'),t('ai.f.trD')]);if(v('s5')==='o.yes')flags.push([t('ai.f.fria'),t('ai.f.friaD')]);if(v('s6')==='o.yes')flags.push([t('ai.f.prov'),t('ai.f.provD')]);}
  return {vk:vk,verdict:t(vk),crit:crit,unc:unc,flags:flags,ai:v('s1')==='o.no'?'no':v('s1')?'yes':null};}
function setStep(k,st){const d=getD();if(!d||locked(d))return;d.steps[k]=st;autoSave();renderRes();}
function renderAipd(d){const q=aipdQual(d),sc=q.vk==='ai.v1'?'var(--red)':(q.vk==='ai.v2'||q.vk==='ai.v3')?'var(--amber)':'var(--green)';

  <div class="scores"><div class="card"><h3>${t('ai.rgpd')}</h3><div class="verdict" style="color:${sc}">${esc(q.verdict)}</div><div class="small muted">${t('ai.critL',{c:q.crit,u:q.unc})}</div></div>
  <div class="card"><h3>${t('ai.act')}</h3>${q.ai==='no'?`<div class="verdict">${t('ai.out')}</div>`:q.flags.length?q.flags.map(f=>`<div style="margin:6px 0"><span class="badge b-p1">${esc(f[0])}</span> <span class="small">${esc(f[1])}</span></div>`).join(''):`<div class="small muted">${t('ai.noFlag')}</div>`}</div></div>
  <div class="card"><h3>${t('ai.kit',{d:done,t:AIPD_STEPS.length})}</h3><p class="small muted">${t('ai.kitP')}</p>
  <div class="row noprint" style="margin:8px 0"><button class="btn primary" onclick="copyTxt(promptOf('pre'))">${t('ai.pre')}</button></div><div class="steps">${steps}</div></div>
  <div class="card"><h3>${t('ai.grid')}</h3><ul class="small" style="margin-left:18px">${t('ai.g').map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="row noprint"><button class="btn" onclick="dl('${APP}-qualification-'+LANG+'.md',buildReport(getD()))">${t('ai.exp')}</button><button class="btn" onclick="window.print()">${t('r.print')}</button>${d.demo?'':`<button class="btn" onclick="archiveD('${d.id}')">${t('r.archive')}</button>`}</div>`;}

function benchChart(rows){const nar=(window.innerWidth||1000)<600,W=nar?380:720,L=nar?150:240,R=nar?44:60,H0=44,rh=nar?30:34,fs=nar?11:12,cut=nar?17:34,X=v=>L+(W-L-R)*v/100,h=H0+rows.length*rh+30;
  let g=`<text x="0" y="16" font-size="13" font-weight="600" fill="var(--text)">${esc(t('b.chart'))}</text>`;
  (nar?[0,50,100]:[0,25,50,75,100]).forEach(v=>{g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${H0-8}" y2="${h-30}" stroke="var(--border)"/><text x="${X(v)}" y="${h-14}" text-anchor="middle" font-size="11" fill="var(--muted)">${v} %</text>`;});
  rows.forEach((r,i)=>{const y=H0+i*rh+rh/2,s=r.s;
    g+=`<text x="${L-10}" y="${y+4}" text-anchor="end" font-size="${fs}" fill="var(--text)"><title>${esc(r.l)}</title>${esc(r.l.length>cut?r.l.slice(0,cut-1)+'…':r.l)}</text>`;
    if(s){g+=`<rect x="${X(s.p25)}" y="${y-7}" width="${Math.max(2,X(s.p75)-X(s.p25))}" height="14" rx="3" fill="var(--soft)" stroke="var(--border)"/><line x1="${X(s.mean)}" x2="${X(s.mean)}" y1="${y-11}" y2="${y+11}" stroke="var(--muted)" stroke-width="2"/>`;}
    if(r.v!=null){g+=`<circle cx="${X(r.v)}" cy="${y}" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/><text x="${W-R+8}" y="${y+4}" font-size="${fs}" font-family="Geist Mono,monospace" fill="var(--text)">${r.v} %</text>`;}});

function baseReport(d){const bf=baseFor(d);if(!bf)return '';const b=bf.b,fr=LANG==='fr';
  let m=`\n## ${t('b.rep')}\n\n${t('b.repN',{n:b.n,t:typeL(d.type),s:bf.same?t('r.baseSize'):''})}\n\n| ${t('b.dom')} | ${t('b.client')} | ${t('b.mean')} | P25–P75 | ${t('b.delta')} |\n|---|---|---|---|---|\n`;
  ['RGPD','IA'].forEach(r=>{const s=b.g[r],v=score(d,byReg(r)).pct;if(s)m+=`| **${regL(r)} — ${fr?'global':'overall'}** | ${v==null?'—':v+' %'} | ${s.mean} % | ${s.p25}–${s.p75} % | ${v==null?'—':(v-s.mean>0?'+':'')+(v-s.mean)} |\n`;});
  Object.keys(DOMS).forEach(k=>{const s=b.dom[k];if(!s||!qs(d).some(byDom(k)))return;const v=score(d,byDom(k)).pct;m+=`| ${domN(k)} | ${v==null?'—':v+' %'} | ${s.mean} % | ${s.p25}–${s.p75} % | ${v==null?'—':(v-s.mean>0?'+':'')+(v-s.mean)} |\n`;});
  if(b.n<MINB)m+=`\n> ${t('b.small',{n:b.n,k:MINB})}\n`;return m;}
function buildReport(d){const fr=LANG==='fr',st=t('st.'+d.status);
  if(d.type==='aipd'){const q=aipdQual(d);let m=fr?`# Qualification AIPD / AI Act — ${d.client}\n\n- Périmètre : ${d.scope||'n/c'}\n- Auditeur : ${d.auditor||'n/c'}\n- Date : ${fdate(d.date)}\n- Statut : ${st}\n\n## Conclusion\n\n- RGPD : **${q.verdict}** (${q.crit} critère(s) CEPD rempli(s), ${q.unc} incertain(s))\n- AI Act : `:`# DPIA / AI Act qualification — ${d.client}\n\n- Scope: ${d.scope||'n/a'}\n- Auditor: ${d.auditor||'n/a'}\n- Date: ${fdate(d.date)}\n- Status: ${st}\n\n## Conclusion\n\n- GDPR: **${q.verdict}** (${q.crit} EDPB criteria met, ${q.unc} unsure)\n- AI Act: `;
    m+=(q.ai==='no'?t('ai.out'):q.flags.length?q.flags.map(f=>f[0]+' — '+f[1]).join(' ; '):t('ai.noFlag'))+`\n\n## ${fr?'Réponses':'Answers'}\n\n| Question | ${fr?'Réponse':'Answer'} | ${fr?'Référence':'Reference'} | Note |\n|---|---|---|---|\n`;
    qs(d).forEach(x=>{const a=d.answers[x[0]]||{};m+=`| ${qText(x)} | ${a.i!=null?optL(d,a.i):'—'} | ${qRef(x)} | ${(a.n||'').replace(/\n/g,' ')} |\n`;});m+=attReport(d);
    m+=`\n## ${fr?'Avancement du kit AIPD':'DPIA kit progress'}\n\n`;AIPD_STEPS.forEach((s,i)=>{m+=`- ${s[0]} ${stepL(i)} : ${t('ai.'+(d.steps[s[0]]||'todo'))}\n`;});return m;}
  const r=score(d,byReg('RGPD')),i=score(d,byReg('IA'));
  let m=fr?`# ${d.type==='trt'?'Rapport d\u2019audit de traitement':'Rapport de diagnostic '+(d.type==='fin'?'de conformité':'flash de maturité')} — ${d.client}\n\n- Taille : ${sizeL(d.size)}\n- Secteur : ${d.sector||'n/c'}\n- Date : ${fdate(d.date)}\n- Périmètre : ${d.scope||'n/c'}\n- Auditeur : ${d.auditor||'n/c'}\n- Statut : ${st}\n${d.type==='trt'?appLine(d).map(l=>'- '+l+'\n').join(''):''}\n## Synthèse\n\n| Référentiel | Score | Appréciation |\n|---|---|---|\n`
    :`# ${d.type==='trt'?'Processing audit':d.type==='fin'?'Compliance assessment':'Flash maturity assessment'} report — ${d.client}\n\n- Size: ${sizeL(d.size)}\n- Industry: ${d.sector||'n/a'}\n- Date: ${fdate(d.date)}\n- Scope: ${d.scope||'n/a'}\n- Auditor: ${d.auditor||'n/a'}\n- Status: ${st}\n${d.type==='trt'?appLine(d).map(l=>'- '+l+'\n').join(''):''}\n## Summary\n\n| Framework | Score | Rating |\n|---|---|---|\n`;
  m+=`| ${regL('RGPD')} | ${r.pct==null?'—':r.pct+' %'} | ${level(d,r.pct)} |\n| ${regL('IA')} | ${i.pct==null?'—':i.pct+' %'} | ${level(d,i.pct)} |\n\n## ${fr?'Scores par domaine':'Scores by domain'}\n\n| ${t('b.dom')} | Score |\n|---|---|\n`;
  Object.keys(DOMS).forEach(k=>{if(qs(d).some(byDom(k))){const p=score(d,byDom(k)).pct;m+=`| ${regL(DOMS[k][0])} — ${domN(k)} | ${p==null?'n/a':p+' %'} |\n`;}});
  m+=baseReport(d);
  m+=docsReport(d);
  m+=`\n## ${fr?'Plan d’action priorisé':'Prioritised action plan'}\n\n| Prio | ${fr?'Référence':'Reference'} | ${t('r.gap')} | Type | Action |\n|---|---|---|---|---|\n`;gaps(d).forEach(x=>{m+=`| P${x.p} | ${qRef(x.q)} | ${qText(x.q)} | ${x.k} | ${x.a} |\n`;});
  const notes=qs(d).filter(q=>d.answers[q[0]]&&d.answers[q[0]].n);if(notes.length){m+=`\n## ${fr?'Constats et preuves':'Findings and evidence'}\n\n`;notes.forEach(q=>{m+=`- **${qRef(q)}** — ${d.answers[q[0]].n.replace(/\n/g,' ')}\n`;});}
  m+=attReport(d);return m;}

function buildProposalFR(d){const st=S.settings,sz=d?d.size:'M',cl=d?d.client:'[Client]',V=st.vendor||t('s.vendorPh'),df=st.days.flash[sz],dn=st.days.fin[sz];

  const n=k=>ctx?k+1:k;
  return `# Proposition — Diagnostic de conformité RGPD & IA Act\n\n**Pour :** ${cl} (${sizeL(sz)})\n**Par :** ${V}\n**Date :** ${fdate(Date.now())} — validité 60 jours\n
## 1. Contexte et enjeux\n\n- Le RGPD est pleinement contrôlé par la CNIL : sanctions jusqu'à 20 M€ ou 4 % du chiffre d'affaires mondial.\n- Le règlement européen sur l'IA s'applique par vagues : pratiques interdites depuis février 2025, transparence (art. 50) depuis août 2026, systèmes à haut risque au 2 décembre 2027. Sanctions jusqu'à 35 M€ ou 7 % du chiffre d'affaires mondial.\n- Les deux textes se recouvrent : tout système d'IA traitant des données personnelles relève des deux régimes. Les traiter ensemble évite de payer deux fois la cartographie, la gouvernance et les analyses d'impact.\n- Pour ${cl}, l'enjeu est de savoir **où il se situe, ce qui est urgent et combien cela coûte**, avant d'engager un programme.\n${ctx}

## ${n(3)}. Démarche\n\n| Étape | Contenu | Résultat |\n|---|---|---|\n| Cadrage | Périmètre, interlocuteurs, collecte documentaire | Plan d'intervention |\n| Analyse | Entretiens, revue des preuves, cotation | Grille de contrôles renseignée |\n| Consolidation | Scoring, priorisation, chiffrage | Plan d'action |\n| Restitution | Comité de pilotage + synthèse direction | Décision de lancement |\n

## ${n(5)}. Équipe\n\n- Un directeur de mission, expert protection des données et gouvernance de l'IA\n- Un ou deux consultants conformité (RGPD / IA Act)\n- Un expert cybersécurité mobilisé sur le domaine sécurité\n

function md2html(m){const Ls=m.split('\n');let h='',ul=false,tb=false;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');

  $('tab-prop').innerHTML=`<div class="row noprint" style="margin-bottom:12px;align-items:center"><span class="small muted" style="flex:3 1 200px">${d?t('p.custom',{c:esc(d.client)}):t('p.generic')} ${t('p.hint')}</span>
  <button class="btn" onclick="copyTxt(buildProposal(getD()))">${t('p.copy')}</button><button class="btn" onclick="dl('proposal-gdpr-ai-act-'+LANG+'.md',buildProposal(getD()))">${t('p.dl')}</button><button class="btn" onclick="window.print()">${t('r.print')}</button></div>
  <div class="card doc">${md2html(m)}</div>`;}

/* ============ RÉGLAGES ============ */
const FS=[.8,.9,1,1.1,1.2,1.35,1.5];
function applyFS(i){i=Math.max(0,Math.min(FS.length-1,i));const pg=document.querySelector('.page');if(window.CSS&&CSS.supports&&CSS.supports('zoom','1'))pg.style.zoom=FS[i];else{pg.style.transformOrigin='top center';pg.style.transform='scale('+FS[i]+')';}try{localStorage.setItem(FK,i)}catch(e){}const l=$('fs-l');if(l)l.textContent=Math.round(FS[i]*100)+'%';}
const fsIdx=()=>{const v=parseInt(localStorage.getItem(FK)||'2',10);return isNaN(v)?2:v;};
function renderSet(){const st=S.settings,num=(k,z)=>`<input type="number" min="0" step="0.5" value="${st.days[k][z]}" onchange="S.settings.days.${k}.${z}=parseFloat(this.value)||0;autoSave()">`,dn=S.diags.filter(d=>d.demo).length;
  $('tab-set').innerHTML=`<div class="card"><h3>${t('s.lang')}</h3><div class="row"><button id="lang-fr" class="btn grow ${LANG==='fr'?'primary':''}" onclick="setLang('fr')">Français</button><button id="lang-en" class="btn grow ${LANG==='en'?'primary':''}" onclick="setLang('en')">English</button></div></div>
  <h2>${t('s.offer')}</h2><div class="card"><div class="row"><label class="small">${t('s.vendor')}<input value="${esc(st.vendor)}" placeholder="${esc(t('s.vendorPh'))}" onchange="S.settings.vendor=this.value.trim();autoSave()"></label>
  <label class="small">${t('s.tjm')}<input type="number" min="0" step="50" value="${st.tjm}" onchange="S.settings.tjm=parseFloat(this.value)||0;autoSave()"></label></div>
  <div class="tw" style="margin-top:10px"><table><thead><tr><th>${t('s.days')}</th>${Object.keys(SIZES).map(k=>`<th>${sizeL(k)}</th>`).join('')}</tr></thead><tbody>
  <tr><td>${typeL('flash')}</td><td>${num('flash','P')}</td><td>${num('flash','M')}</td><td>${num('flash','G')}</td></tr>
  <tr><td>${typeL('fin')}</td><td>${num('fin','P')}</td><td>${num('fin','M')}</td><td>${num('fin','G')}</td></tr></tbody></table></div>
  <p class="small muted" style="margin-top:6px">${t('s.daysNote')}</p></div>
  <h2>${t('s.demo')}</h2><div class="card"><p class="small muted">${t('s.demoP')}</p>${dn?`<p class="small" style="margin-top:6px">${t('s.demoN',{n:dn})}</p>`:''}
  <div class="row" style="margin-top:8px"><button class="btn" onclick="loadDemo()">${t('s.demoLoad')}</button>${dn?`<button class="btn danger" onclick="delDemo()">${t('s.demoDel')}</button>`:''}</div></div>
  <h2>${t('s.disp')}</h2><div class="card"><div class="row" style="align-items:center"><button class="btn" onclick="applyFS(fsIdx()-1)">A−</button><span id="fs-l" class="mono" style="text-align:center">${Math.round(FS[fsIdx()]*100)}%</span><button class="btn" onclick="applyFS(fsIdx()+1)">A+</button><button class="btn ghost" onclick="applyFS(2)">${t('s.reset')}</button></div></div>
  <h2>${t('s.data')}</h2><div class="card"><div class="row"><button class="btn" onclick="dl('${APP}.json',JSON.stringify(S,null,2))">${t('s.exp')}</button>
  <button class="btn" onclick="$('imp').click()">${t('s.imp')}</button><input type="file" id="imp" accept=".json" style="display:none" onchange="impJSON(this)">
  <button class="btn danger" onclick="if(confirm(t('s.wipeQ'))){S.diags=[];cur=null;autoSave();go('dossiers');}">${t('s.wipe')}</button></div></div>
  <h2>${t('s.drive')}</h2><div class="card"><label class="small">${t('s.cid')}<input id="cid" placeholder="xxxxxxxx.apps.googleusercontent.com" value="${esc(cidGet())}" onchange="localStorage.setItem(CIDK,this.value.trim())"></label>
  <p class="small muted" style="margin-top:6px">${t('s.driveP',{f:'<span class="mono">'+APP+'.json</span>',d:'<span class="mono">'+FOLDER+'</span>',s:'<span class="mono">drive.file</span>'})}</p>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="driveConnect()">${tok?t('s.reconn'):t('s.conn')}</button></div></div>
  <p class="small muted" style="text-align:center;margin-top:18px">${APP} · <span class="ver">v3.12</span> · ${VDATE}</p>`;}
function impJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);ensureState();autoSave();go('dossiers');toast(t('t.imp'));}catch(e){toast(t('t.badFile'));}};r.readAsText(f);}

/* ============ DÉMONSTRATION ============ */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function loadDemo(){S.diags=S.diags.filter(d=>!d.demo);const R=rng(42),secs=['Banque','Assurance','Industrie','Distribution','Santé','Services','Secteur public'],sz=['P','M','M','G'];let n=0;
  for(let i=1;i<=20;i++){const m=.25+R()*.6,size=sz[Math.floor(R()*sz.length)],sector=secs[Math.floor(R()*secs.length)],code='DEMO-'+(i<10?'0':'')+i;
    ['flash','fin'].forEach(type=>{const d=newD({client:code,sector:sector,size:size,type:type,auditor:'Demo'});d.demo=true;d.status='closed';d.date=Date.now()-Math.floor(R()*330)*864e5;d.closedAt=d.date;
      const dm={};qs(d).forEach(q=>{if(dm[q[1]]===undefined)dm[q[1]]=Math.min(.95,Math.max(.05,m+(R()-.5)*.4));const p=dm[q[1]],r=R(),last=OPTS[type].length-1;
        d.answers[q[0]]={i:r<.04?last:r<p*.7?2:r<p*.7+.3?1:0};});S.diags.push(d);n++;});}
  S.settings.showDemo=true;autoSave();renderAll(true);toast(t('t.demoOk',{n:n}));}
function delDemo(){S.diags=S.diags.filter(d=>!d.demo);if(cur&&!getD())cur=null;autoSave();renderAll(true);toast(t('t.demoDel'));}

/* ============ UTILITAIRES ============ */
let toastT;function toast(x,b,fn){$('toast-t').textContent=x;const bt=$('toast-b');bt.textContent=b||'';bt.onclick=()=>{if(fn)fn();$('toast').style.display='none';};$('toast').style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>{$('toast').style.display='none';},b?6000:2500);}
function dl(name,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
function copyTxt(x){(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast(t('t.copied'))).catch(()=>{const e=document.createElement('textarea');e.value=x;document.body.appendChild(e);e.select();document.execCommand('copy');e.remove();toast(t('t.copied'));});}
const THEMES=['light','sand','navy','dark'],TI={light:'☀︎',sand:'○',navy:'◑',dark:'☾'};
function applyTheme(x){document.documentElement.setAttribute('data-theme',x==='light'?'':x);$('theme-btn').textContent=TI[x]||'☀︎';try{localStorage.setItem(TK,x)}catch(e){}}
function toggleTheme(){const c=localStorage.getItem(TK)||'light';applyTheme(THEMES[(THEMES.indexOf(c)+1)%THEMES.length]);}

/* ============ GOOGLE DRIVE ============ */
let tok=sessionStorage.getItem(TOKK)||null,fileId=null,syncCode='loc';
function setSync(s){syncCode=s;$('sync').textContent=t('sync.'+s);}
function driveConnect(after){const cid=cidGet();if(!cid){go('set');toast(t('t.cid'));return;}
  if(!(window.google&&google.accounts)){toast(t('t.gis'));return;}
  google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r&&r.access_token){tok=r.access_token;sessionStorage.setItem(TOKK,tok);drivePull();if(typeof after==='function')after();}else setSync('err');}}).requestAccessToken();}
async function dfetch(u,o){o=o||{};const r=await fetch(u,Object.assign({},o,{headers:Object.assign({Authorization:'Bearer '+tok},o.headers||{})}));
  if(r.status===401){tok=null;sessionStorage.removeItem(TOKK);throw new Error('401');}if(!r.ok)throw new Error(r.status);return r;}
async function findFile(){if(fileId)return fileId;const r=await dfetch("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("name='"+APP+".json' and trashed=false")+"&fields=files(id)");
  const j=await r.json();fileId=j.files&&j.files[0]?j.files[0].id:null;return fileId;}
async function drivePull(){if(!tok)return;try{if(await findFile()){const r=await dfetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media');const j=await r.json();
    if(j&&(j.updated||0)>(S.updated||0)){S=j;ensureState();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}renderAll();}else if((S.updated||0)>(j.updated||0)){await drivePush();return;}
    setSync('ok');}else await drivePush();}catch(e){setSync('err');}}
async function drivePush(){if(!tok)return;try{const body=JSON.stringify(S);
    if(!(await findFile())){const b='x'+uid(),meta=JSON.stringify({name:APP+'.json',mimeType:'application/json'});
      const r=await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
        body:'--'+b+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--'});fileId=(await r.json()).id;}
    else await dfetch('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body});
    setSync('ok');}catch(e){setSync('err');}}
let folderId=null;
async function ensureFolder(){if(folderId)return folderId;
  const r=await dfetch("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("name='"+FOLDER+"' and mimeType='application/vnd.google-apps.folder' and trashed=false")+"&fields=files(id)");
  const j=await r.json();if(j.files&&j.files[0]){folderId=j.files[0].id;return folderId;}
  const c=await dfetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FOLDER,mimeType:'application/vnd.google-apps.folder'})});
  folderId=(await c.json()).id;return folderId;}
async function upsert(name,body,mime,id){if(id){try{await dfetch('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':mime},body:body});return id;}catch(e){if(String(e.message)==='401')throw e;}}
  const b='x'+uid(),meta=JSON.stringify({name:name,mimeType:mime,parents:[await ensureFolder()]});
  const r=await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
    body:'--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: '+mime+'\r\n\r\n'+body+'\r\n--'+b+'--'});return (await r.json()).id;}
const slug=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'audit';
function auditPayload(d){const o={schema:'diag001-audit/1',app:APP,version:VER,lang:LANG,exportedAt:new Date().toISOString(),audit:d};
  if(d.type==='aipd')o.qualification=aipdQual(d);else{o.scores={rgpd:score(d,byReg('RGPD')).pct,ia:score(d,byReg('IA')).pct,domaines:{}};
    Object.keys(DOMS).forEach(k=>{if(qs(d).some(byDom(k)))o.scores.domaines[k]=score(d,byDom(k)).pct;});
    const bf=baseFor(d);if(bf)o.baseline={n:bf.b.n,memeTaille:bf.same,rgpd:bf.b.g.RGPD?bf.b.g.RGPD.mean:null,ia:bf.b.g.IA?bf.b.g.IA.mean:null};
    o.piecesJointes=qs(d).filter(q=>attN(d,q[0])).map(q=>({id:q[0],reference:q[5],fichiers:attOf(d,q[0]).map(f=>({nom:f.name,type:f.kind,lien:f.link,taille:f.size||null}))}));
    o.ecarts=gaps(d).map(x=>({id:x.q[0],priorite:'P'+x.p,reference:x.q[5],ecart:x.q[4],reponse:x.v===0?'non':'partiel',type:x.v===0?'mise_en_place':'mise_a_niveau',action:x.v===0?x.q[6]:x.q[7]}));}
  return o;}
async function archiveD(id,silent){const d=S.diags.find(x=>x.id===id);if(!d)return;if(d.demo){if(!silent)toast(t('t.demoArch'));return false;}if(!tok){driveConnect(function(){archiveD(id);});return;}
  try{setSync('pend');const base='audit-'+slug(d.client)+'-'+d.type+'-'+new Date(d.date).toISOString().slice(0,10)+'-'+d.id;
    d.drive.json=await upsert(base+'.json',JSON.stringify(auditPayload(d),null,2),'application/json',d.drive.json);
    d.drive.md=await upsert(base+'.md',buildReport(d),'text/markdown',d.drive.md);
    d.drive.at=Date.now();autoSave();setSync('ok');if(!silent){toast(t('t.archived',{f:FOLDER}));renderAll();}return true;}
  catch(e){setSync('err');if(!silent)toast(t('t.archFail',{e:e.message}));return false;}}
async function archiveAll(){if(!tok){driveConnect(archiveAll);return;}let ok=0;const L=S.diags.filter(d=>!d.demo);for(let i=0;i<L.length;i++){if(await archiveD(L[i].id,true))ok++;}toast(t('t.archN',{n:ok}));renderAll();}
async function listArchives(){if(!tok){driveConnect(listArchives);return;}const box=$('arch');if(!box)return;box.innerHTML=`<p class="small muted">${t('arch.reading')}</p>`;
  try{const f=await ensureFolder();const r=await dfetch("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("'"+f+"' in parents and trashed=false and mimeType='application/json'")+"&orderBy=modifiedTime desc&pageSize=100&fields=files(id,name,modifiedTime)");
    const j=await r.json(),L=j.files||[];
    box.innerHTML=L.length?`<div class="tw"><table><thead><tr><th>${t('arch.file')}</th><th>${t('arch.mod')}</th><th></th></tr></thead><tbody>${L.map(x=>{const known=S.diags.some(d=>d.drive&&d.drive.json===x.id);
      return `<tr><td class="mono">${esc(x.name)}</td><td class="mono">${fdate(x.modifiedTime)}</td><td>${known?`<span class="small muted">${t('arch.present')}</span>`:`<button class="btn sm" onclick="restoreArchive('${x.id}')">${t('arch.restore')}</button>`}</td></tr>`;}).join('')}</tbody></table></div>`:`<p class="small muted">${t('arch.none')}</p>`;}
  catch(e){box.innerHTML=`<p class="small muted">${t('arch.fail',{e:esc(e.message)})}</p>`;}}
async function restoreArchive(fid){try{const r=await dfetch('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media');const j=await r.json();
  if(!j||!j.audit||!j.audit.id){toast(t('t.badArch'));return;}const a=j.audit;a.drive=a.drive||{};a.drive.json=fid;
  const i=S.diags.findIndex(d=>d.id===a.id);if(i>=0)S.diags[i]=a;else S.diags.push(a);ensureState();autoSave();renderAll();toast(t('t.restored',{c:a.client}));}
  catch(e){toast(t('t.restFail',{e:e.message}));}}
setInterval(()=>{if(tok&&!saveT)drivePull();},60000);
let rsT=null;window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){if(tab==='bench'){const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))renderBench();}},250);});

/* ============ INIT ============ */
LANG=localStorage.getItem(LANG_KEY)||((navigator.language||'fr').toLowerCase().indexOf('fr')===0?'fr':'en');
load();applyTheme(localStorage.getItem(TK)||'light');applyStatic();applyFS(fsIdx());go('dossiers');if(tok)drivePull();
$('boot').style.display='none';

</script>
