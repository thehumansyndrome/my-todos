function ensureState(){

/* ============ SCORING ============ */
function val(d,q){const a=d.answers[q[0]];if(!a||a.i==null)return undefined;return OPTS[d.type][a.i][1];}
function score(d,filter){let num=0,den=0,ans=0,tot=0;
  qs(d).filter(filter).forEach(q=>{tot++;const v=val(d,q);if(v===undefined)return;ans++;if(v===null)return;num+=v*q[3];den+=q[3];});
  return {pct:den?Math.round(num/den*100):null,ans,tot};}
const byReg=r=>q=>DOMS[q[1]][0]===r, byDom=k=>q=>q[1]===k;
function level(d,p){if(p==null)return '—';
  if(d.type==='flash')return p<20?'Niveau 1 · Initial':p<40?'Niveau 2 · Émergent':p<60?'Niveau 3 · Défini':p<80?'Niveau 4 · Maîtrisé':'Niveau 5 · Optimisé';
  return p<50?'Non-conformités majeures':p<75?'Conformité partielle':p<90?'Conformité avancée':'Conforme';}
function col(p){return p==null?'var(--muted)':p<40?'var(--red)':p<70?'var(--amber)':'var(--green)'}
function gaps(d){return qs(d).map(q=>{const v=val(d,q);if(v==null||v>=1)return null;
  const w=q[3],p=(w===3&&v===0)?1:((w===3)||(w===2&&v===0))?2:3;return {q,v,p,g:w*(1-v),a:v===0?q[6]:(q[7]||q[6]),k:v===0?'Mise en place':'Mise à niveau'};}).filter(Boolean).sort((a,b)=>a.p-b.p||b.g-a.g);}

function sumD(d){if(d.type==='aipd'){const q=aipdQual(d);return `<b>${esc(q.verdict)}</b> · ${q.crit} critère${q.crit>1?'s':''} CEPD${q.flags.length?' · '+q.flags.map(f=>esc(f[0])).join(', '):''}`;}
  const r=score(d,byReg('RGPD')),i=score(d,byReg('IA'));return `RGPD <b style="color:${col(r.pct)}">${r.pct==null?'—':r.pct+' %'}</b> · IA Act <b style="color:${col(i.pct)}">${i.pct==null?'—':i.pct+' %'}</b>`;}
function dCard(d){const s=score(d,()=>true),dr=d.drive&&d.drive.at?`<span class="small muted"> · ☁ archivé le ${new Date(d.drive.at).toLocaleDateString('fr-FR')}</span>`:'';

    <span class="badge b-size">${SIZES[d.size].l}</span><span class="badge ${TBADGE[d.type]}">${TYPES[d.type]}</span><span class="badge ${d.status==='closed'?'b-closed':'b-open'}">${d.status==='closed'?'Clôturé':'En cours'}</span>
    <div class="small muted" style="margin-top:6px">${esc(d.sector||'Secteur non renseigné')} · ${new Date(d.date).toLocaleDateString('fr-FR')}${d.auditor?' · '+esc(d.auditor):''} · ${s.ans}/${s.tot} réponses${dr}</div>
    ${d.scope?`<div class="small" style="margin-top:4px">Périmètre : ${esc(d.scope)}</div>`:''}
    <div class="small" style="margin-top:4px">${sumD(d)}</div></div>
    <div class="row" style="flex:1 1 220px;justify-content:flex-end"><button class="btn sm primary" onclick="openD('${d.id}')">Ouvrir</button>
    ${d.type==='flash'?`<button class="btn sm" onclick="toFin('${d.id}')">→ Diag. fin</button>`:''}
    <button class="btn sm" onclick="dupD('${d.id}')" title="Nouvel audit à partir de celui-ci">Ré-auditer</button>
    ${d.status==='closed'?`<button class="btn sm" onclick="reopenD('${d.id}')">Rouvrir</button>`:`<button class="btn sm" onclick="closeD('${d.id}')">Clôturer</button>`}

/* ============ HISTORIQUE ============ */
function renderHist(){const by={};S.diags.forEach(d=>{const k=d.client.trim().toLowerCase();(by[k]=by[k]||[]).push(d);});
  const keys=Object.keys(by).sort();
  if(!keys.length){$('tab-hist').innerHTML='<div class="empty">Aucun audit pour l\'instant.</div>';return;}
  const pct=(d,r)=>d.type==='aipd'?null:score(d,byReg(r)).pct;
  const fmt=(v,prev)=>{if(v==null)return '—';let x=v+' %';if(prev!=null){const dl=v-prev;if(dl)x+=` <span class="${dl>0?'delta-up':'delta-dn'}">${dl>0?'▲':'▼'} ${Math.abs(dl)}</span>`;}return x;};
  $('tab-hist').innerHTML=`<h2>Historique par client</h2><p class="small muted">Évolution des scores entre audits du même type. Le delta compare chaque audit au précédent du même type.</p>`+keys.map(k=>{
    const L=by[k].slice().sort((a,b)=>a.date-b.date),last={};
    const rows=L.map(d=>{const r=pct(d,'RGPD'),i=pct(d,'IA'),pv=last[d.type]||{};last[d.type]={r:r,i:i};
      return `<tr><td class="mono">${new Date(d.date).toLocaleDateString('fr-FR')}</td><td><span class="badge ${TBADGE[d.type]}">${TYPES[d.type]}</span></td><td>${d.type==='aipd'?esc(aipdQual(d).verdict):fmt(r,pv.r)}</td><td>${d.type==='aipd'?'':fmt(i,pv.i)}</td><td class="w small">${esc(d.scope||'')}</td><td><button class="btn sm" onclick="openD('${d.id}')">Ouvrir</button></td></tr>`;}).join('');
    return `<div class="card"><h3>${esc(L[0].client)}</h3><div class="tw"><table class="hist"><thead><tr><th>Date</th><th>Type</th><th>RGPD</th><th>IA Act</th><th>Périmètre</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}).join('');}

  let html=`<h2>${esc(d.client)}</h2><span class="badge b-size">${SIZES[d.size].l}</span><span class="badge ${TBADGE[d.type]}">${TYPES[d.type]}</span><span class="badge ${d.status==='closed'?'b-closed':'b-open'}">${d.status==='closed'?'Clôturé':'En cours'}</span>
  ${d.status==='closed'?`<div class="poc" style="margin-top:10px">Audit clôturé le ${new Date(d.closedAt||d.date).toLocaleDateString('fr-FR')} : lecture seule. <button class="btn sm" onclick="reopenD('${d.id}')">Rouvrir</button></div>`:''}
  <div class="row" style="margin-top:10px"><label class="small">Auditeur<input value="${esc(d.auditor)}" onchange="setMeta('auditor',this.value)"></label><label class="small">Périmètre<input value="${esc(d.scope)}" onchange="setMeta('scope',this.value)"></label></div>
  <div class="progress"><div id="pg"></div></div><div class="small muted" id="pg-t"></div>
  <div class="pills">${(d.type==='aipd'?[['all','Tout'],['todo','Non répondus']]:[['all','Tout'],['RGPD','RGPD'],['IA','IA Act'],['todo','Non répondus']]).map(p=>`<button class="pill ${qFilter===p[0]?'on':''}" onclick="qFilter='${p[0]}';renderQuest()">${p[1]}</button>`).join('')}</div>`;
  let last='';show.forEach(q=>{if(q[1]!==last){last=q[1];const dm=DOMS[last];
    html+=`<div class="dom"><h3><span class="badge ${dm[0]==='IA'?'b-ia':dm[0]==='AIPD'?'b-aipd':'b-rgpd'}">${dm[0]==='IA'?'IA Act':dm[0]}</span>${esc(dm[1])}</h3>${d.type==='aipd'?'':`<button class="btn sm ghost" onclick="domNA('${last}')">Domaine N/A</button>`}</div>`;}

function radar(d,reg){const ks=Object.keys(DOMS).filter(k=>DOMS[k][0]===reg&&qs(d).some(byDom(k))),n=ks.length,c=160,R=110;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c+r*Math.cos(a),c+r*Math.sin(a)];};
  let g='';[.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${ks.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--border)"/>`;});
  const vals=ks.map(k=>score(d,byDom(k)).pct);
  ks.forEach((k,i)=>{const e=pt(i,R),l=pt(i,R+16),an=Math.abs(l[0]-c)<8?'middle':l[0]>c?'start':'end';
    g+=`<line x1="${c}" y1="${c}" x2="${e[0]}" y2="${e[1]}" stroke="var(--border)"/><text x="${l[0]}" y="${l[1]+4}" text-anchor="${an}" font-size="11" fill="var(--muted)">${esc(DOMS[k][2])}</text>`;});
  const colr=reg==='IA'?'var(--violet)':'var(--blue)';
  g+=`<polygon points="${vals.map((v,i)=>pt(i,R*(v||0)/100).join(',')).join(' ')}" fill="${colr}" fill-opacity=".18" stroke="${colr}" stroke-width="2"/>`;
  return `<svg viewBox="-90 -10 500 340" style="width:100%;max-width:440px;display:block;margin:0 auto" role="img" aria-label="Radar ${reg}">${g}</svg>`;}
function aipdQual(d){const v=id=>{const a=d.answers[id];return a&&a.i!=null?OPTS.aipd[a.i][0]:null;};
  const crit=['c1','c2','c3','c4','c5','c6','c7','c8','c9'].filter(k=>v(k)==='Oui').length,unc=['c1','c2','c3','c4','c5','c6','c7','c8','c9'].filter(k=>v(k)==='Incertain').length;
  let verdict;if(v('q0')==='Non')verdict='Hors RGPD — pas d\'AIPD';else if(crit>=2)verdict='AIPD requise';else if(crit+unc>=2)verdict='AIPD probable — lever les incertitudes';else if(crit===1)verdict='AIPD recommandée';else verdict='AIPD non requise a priori — documenter';
  const flags=[];if(v('s1')!=='Non'){if(v('s2')==='Oui')flags.push(['Pratique interdite','Arrêt du projet (art. 5)']);if(v('s3')==='Oui')flags.push(['Haut risque','Exigences applicables au 2 déc. 2027 (annexe III)']);if(v('s4')==='Oui')flags.push(['Transparence','Art. 50, en vigueur']);if(v('s5')==='Oui')flags.push(['FRIA','Art. 27, à articuler avec l\'AIPD']);if(v('s6')==='Oui')flags.push(['Fournisseur','Obligations du fournisseur (art. 16)']);}
  return {verdict:verdict,crit:crit,unc:unc,flags:flags,ai:v('s1')};}

  const done=AIPD_STEPS.filter(s=>d.steps[s[0]]==='done').length;
  $('tab-res').innerHTML=`<h2>${esc(d.client)} — qualification AIPD / AI Act</h2>${d.scope?`<p class="small muted">Périmètre : ${esc(d.scope)}</p>`:''}

  <div class="card"><h3>Kit AIPD assistée par IA — avancement ${done}/${AIPD_STEPS.length}</h3><p class="small muted">Collez d'abord le préambule dans l'outil IA <b>validé par le client</b>, puis le prompt de l'étape. L'IA rédige les premiers jets ; le DPO qualifie, arbitre et signe.</p>

  <div class="card"><h3>Grille de contrôle avant livraison</h3><ul class="small" style="margin-left:18px">${['Chaque fait est confirmé par le questionnaire ou un entretien','Aucun point [À CONFIRMER] ne subsiste','Chaque article cité est vérifié dans le texte','Gravité et vraisemblance fixées par le DPO et le métier','Mesures précises, datées, avec porteur nommé','Constats de la relecture adverse (P7) traités','Aucune donnée réelle passée par un outil non autorisé','Avis du DPO rédigé et signé par lui'].map(x=>`<li>${x}</li>`).join('')}</ul></div>

  const blk=(reg,lab)=>{const s=score(d,byReg(reg));const bars=Object.keys(DOMS).filter(k=>DOMS[k][0]===reg&&qs(d).some(byDom(k))).map(k=>{const p=score(d,byDom(k)).pct;

  <div class="card"><h3>Calendrier d'application de l'IA Act</h3><div class="tw"><table><tbody>${CAL.map(c=>`<tr><td class="mono">${c[0]}</td><td>${esc(c[1])}</td><td><span class="badge ${c[2]==='En vigueur'?'b-p1':'b-p2'}">${c[2]}</span></td></tr>`).join('')}</tbody></table></div>
  <p class="small muted" style="margin-top:6px">Calendrier tel que modifié par le règlement (UE) 2026/1744 (« omnibus IA »), en vigueur depuis le 27 juillet 2026. À revérifier avant chaque restitution client.</p></div>

function buildReport(d){if(d.type==='aipd'){const q=aipdQual(d);let m=`# Qualification AIPD / AI Act — ${d.client}\n\n- Périmètre : ${d.scope||'n/c'}\n- Auditeur : ${d.auditor||'n/c'}\n- Date : ${new Date(d.date).toLocaleDateString('fr-FR')}\n- Statut : ${d.status==='closed'?'clôturé':'en cours'}\n\n## Conclusion\n\n- RGPD : **${q.verdict}** (${q.crit} critère(s) CEPD rempli(s), ${q.unc} incertain(s))\n- AI Act : ${q.ai==='Non'?'hors champ':q.flags.length?q.flags.map(f=>f[0]+' — '+f[1]).join(' ; '):'aucune obligation spécifique identifiée'}\n\n## Réponses\n\n| Question | Réponse | Référence | Note |\n|---|---|---|---|\n`;
    qs(d).forEach(x=>{const a=d.answers[x[0]]||{};m+=`| ${x[4]} | ${a.i!=null?OPTS.aipd[a.i][0]:'—'} | ${x[5]} | ${(a.n||'').replace(/\n/g,' ')} |\n`;});
    m+=`\n## Avancement du kit AIPD\n\n`;AIPD_STEPS.forEach(s=>{m+=`- ${s[0]} ${s[1]} : ${({todo:'à faire',doing:'en cours',done:'fait'})[d.steps[s[0]]||'todo']}\n`;});return m;}
  const r=score(d,byReg('RGPD')),i=score(d,byReg('IA'));let m=`# Rapport de diagnostic ${d.type==='fin'?'de conformité':'flash de maturité'} — ${d.client}\n\n- Taille : ${SIZES[d.size].l}\n- Secteur : ${d.sector||'n/c'}\n- Date : ${new Date(d.date).toLocaleDateString('fr-FR')}\n- Périmètre : ${d.scope||'n/c'}\n- Auditeur : ${d.auditor||'n/c'}\n- Statut : ${d.status==='closed'?'clôturé':'en cours'}\n\n## Synthèse\n\n| Référentiel | Score | Appréciation |\n|---|---|---|\n| RGPD | ${r.pct==null?'—':r.pct+' %'} | ${level(d,r.pct)} |\n| IA Act | ${i.pct==null?'—':i.pct+' %'} | ${level(d,i.pct)} |\n\n## Scores par domaine\n\n| Domaine | Score |\n|---|---|\n`;
  Object.keys(DOMS).forEach(k=>{if(qs(d).some(byDom(k))){const p=score(d,byDom(k)).pct;m+=`| ${DOMS[k][0]} — ${DOMS[k][1]} | ${p==null?'n/a':p+' %'} |\n`;}});
  m+=`\n## Plan d'action priorisé\n\n| Prio | Référence | Écart | Type | Action |\n|---|---|---|---|---|\n`;gaps(d).forEach(x=>{m+=`| P${x.p} | ${x.q[5]} | ${x.q[4]} | ${x.k} | ${x.a} |\n`;});
  const notes=qs(d).filter(q=>d.answers[q[0]]&&d.answers[q[0]].n);if(notes.length){m+=`\n## Constats et preuves\n\n`;notes.forEach(q=>{m+=`- **${q[5]}** — ${d.answers[q[0]].n.replace(/\n/g,' ')}\n`;});}
  return m;}

/* ============ PROPOSITION ============ */
const eur=n=>Math.round(n).toLocaleString('fr-FR')+' € HT';
function buildProposal(d){const st=S.settings,sz=d?d.size:'M',cl=d?d.client:'[Client]',V=st.vendor,df=st.days.flash[sz],dn=st.days.fin[sz];
  const plan={P:'2 à 3 semaines',M:'4 à 6 semaines',G:'8 à 10 semaines'}[sz],itw={P:'4 à 6',M:'8 à 12',G:'15 à 25'}[sz];
  let ctx='';if(d&&d.type!=='aipd'){const r=score(d,byReg('RGPD')).pct,i=score(d,byReg('IA')).pct,g=gaps(d).filter(x=>x.p===1).slice(0,5);
    if(r!=null||i!=null){ctx=`\n## 2. Ce que révèle le ${d.type==='fin'?'diagnostic':'diagnostic flash'} déjà réalisé\n\n- Score RGPD : **${r==null?'n/c':r+' %'}** (${level(d,r)})\n- Score IA Act : **${i==null?'n/c':i+' %'}** (${level(d,i)})\n`;
      if(g.length){ctx+=`\nÉcarts critiques identifiés :\n\n`+g.map(x=>`- ${x.q[4]} *(${x.q[5]})*`).join('\n')+'\n';}}}
  return `# Proposition — Diagnostic de conformité RGPD & IA Act\n\n**Pour :** ${cl} (${SIZES[sz].l})\n**Par :** ${V}\n**Date :** ${new Date().toLocaleDateString('fr-FR')} — validité 60 jours\n
## 1. Contexte et enjeux\n\n- Le RGPD est pleinement contrôlé par la CNIL : sanctions jusqu'à 20 M€ ou 4 % du chiffre d'affaires mondial.\n- Le règlement européen sur l'IA s'applique par vagues : pratiques interdites depuis février 2025, transparence (art. 50) depuis août 2026, systèmes à haut risque au 2 décembre 2027. Sanctions jusqu'à 35 M€ ou 7 % du chiffre d'affaires mondial.\n- Les deux textes se recouvrent : tout système d'IA traitant des données personnelles relève des deux régimes. Les traiter ensemble évite de payer deux fois la cartographie, la gouvernance et les analyses d'impact.\n- Pour ${cl}, l'enjeu est de savoir **où il se situe, ce qui est urgent et combien cela coûte**, avant d'engager un programme.\n${ctx}
## ${ctx?3:2}. Notre offre en trois paliers\n\n### Palier 1 — Diagnostic flash de maturité\n\n- 1 atelier de 2 heures avec DPO / DSI / juridique, questionnaire adapté à la taille de l'entreprise\n- Livrables : score de maturité RGPD et IA Act, radar par domaine, 10 écarts prioritaires, restitution d'une heure\n- Charge : **${df} j** — délai : 1 semaine\n\n### Palier 2 — Diagnostic fin de conformité\n\n- Revue documentaire (registre, politiques, contrats, AIPD, inventaire IA)\n- ${itw} entretiens métiers et IT\n- Évaluation contrôle par contrôle sur 8 domaines RGPD et 7 domaines IA Act, avec preuves\n- Classification des systèmes d'IA (interdit / haut risque / transparence / minimal) et qualification du rôle (fournisseur / déployeur)\n- Livrables : rapport de conformité, cartographie des risques, plan d'action priorisé P1/P2/P3 chiffré, feuille de route 12 mois, synthèse COMEX\n- Charge : **${dn} j** — délai : ${plan}\n\n### Palier 3 — Accompagnement à la remédiation (optionnel)\n\n- Mise à niveau du registre, AIPD / FRIA, contrats, procédures\n- Mise en place de la gouvernance IA : registre des systèmes, comité, charte IA générative, formation\n- DPO ou AI Compliance Officer à temps partagé\n- Charge définie à l'issue du palier 2, en régie ou au forfait\n
## ${ctx?4:3}. Démarche\n\n| Étape | Contenu | Résultat |\n|---|---|---|\n| Cadrage | Périmètre, interlocuteurs, collecte documentaire | Plan d'intervention |\n| Analyse | Entretiens, revue des preuves, cotation | Grille de contrôles renseignée |\n| Consolidation | Scoring, priorisation, chiffrage | Plan d'action |\n| Restitution | Comité de pilotage + synthèse direction | Décision de lancement |\n
## ${ctx?5:4}. Budget\n\n| Palier | Charge | Montant |\n|---|---|---|\n| 1 — Diagnostic flash | ${df} j | ${eur(df*st.tjm)} |\n| 2 — Diagnostic fin | ${dn} j | ${eur(dn*st.tjm)} |\n| 3 — Remédiation | selon plan d'action | sur devis |\n\nLe palier 1 est déduit du palier 2 en cas d'enchaînement sous 3 mois.\n
## ${ctx?6:5}. Équipe\n\n- Un directeur de mission, expert protection des données et gouvernance de l'IA\n- Un ou deux consultants conformité (RGPD / IA Act)\n- Un expert cybersécurité mobilisé sur le domaine sécurité\n
## ${ctx?7:6}. Prérequis côté ${cl}\n\n- Un sponsor et un interlocuteur unique (DPO, RSSI ou juridique)\n- Mise à disposition des documents existants sous 5 jours ouvrés\n- Disponibilité des interlocuteurs pour les entretiens\n
## ${ctx?8:7}. Pourquoi ${V}\n\n- Une grille unique RGPD + IA Act, calibrée par taille d'entreprise : pas de sur-qualité pour une PME, pas d'angle mort pour un groupe\n- Un résultat actionnable : chaque écart est relié à un article, une priorité et une action\n- La capacité d'enchaîner sur la remédiation technique (sécurité, data, IA) sans changer d'interlocuteur\n
## ${ctx?9:8}. Prochaines étapes\n\n- Échange de 30 minutes pour valider le périmètre\n- Signature et planification de l'atelier flash sous 2 semaines\n- Restitution et décision sur le palier 2\n`;}
function md2html(m){const L=m.split('\n');let h='',ul=false,tb=false;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
  const close=()=>{if(ul){h+='</ul>';ul=false;}if(tb){h+='</tbody></table></div>';tb=false;}};
  L.forEach(l=>{if(/^\|/.test(l)){if(/^\|[-| ]+\|$/.test(l))return;const c=l.split('|').slice(1,-1).map(x=>x.trim());
      if(!tb){close();h+='<div class="tw"><table><thead><tr>'+c.map(x=>'<th>'+inl(x)+'</th>').join('')+'</tr></thead><tbody>';tb=true;}else h+='<tr>'+c.map(x=>'<td>'+inl(x)+'</td>').join('')+'</tr>';return;}
    if(/^- /.test(l)){if(!ul){close();h+='<ul>';ul=true;}h+='<li>'+inl(l.slice(2))+'</li>';return;}
    close();const m3=l.match(/^(#{1,3}) (.*)/);if(m3)h+=`<h${m3[1].length}>${inl(m3[2])}</h${m3[1].length}>`;else if(l.trim())h+='<p>'+inl(l)+'</p>';});
  close();return h;}

  <div class="tw" style="margin-top:10px"><table><thead><tr><th>Charge (jours)</th><th>PME</th><th>Moyenne / ETI</th><th>Grande</th></tr></thead><tbody>
  <tr><td>Diagnostic flash</td><td>${num('flash','P')}</td><td>${num('flash','M')}</td><td>${num('flash','G')}</td></tr>
  <tr><td>Diagnostic fin</td><td>${num('fin','P')}</td><td>${num('fin','M')}</td><td>${num('fin','G')}</td></tr></tbody></table></div>
  <p class="small muted" style="margin-top:6px">Valeurs par défaut indicatives : à caler sur votre grille tarifaire.</p></div>
  <h2>Affichage</h2><div class="card"><div class="row" style="align-items:center"><button class="btn" onclick="applyFS(fsIdx()-1)">A−</button><span id="fs-l" class="mono" style="text-align:center">${Math.round(FS[fsIdx()]*100)}%</span><button class="btn" onclick="applyFS(fsIdx()+1)">A+</button><button class="btn ghost" onclick="applyFS(2)">Reset</button></div></div>
  <h2>Données</h2><div class="card"><div class="row"><button class="btn" onclick="dl('${APP}.json',JSON.stringify(S,null,2))">Exporter JSON</button>
  <button class="btn" onclick="$('imp').click()">Importer JSON</button><input type="file" id="imp" accept=".json" style="display:none" onchange="impJSON(this)">
  <button class="btn danger" onclick="if(confirm('Effacer tous les dossiers ?')){S.diags=[];cur=null;autoSave();go('dossiers');}">Tout effacer</button></div></div>
  <h2>Google Drive</h2><div class="card"><label class="small">Client ID OAuth (prérempli avec celui de vos autres apps)<input id="cid" placeholder="xxxxxxxx.apps.googleusercontent.com" value="${esc(cidGet())}" onchange="localStorage.setItem(CIDK,this.value.trim())"></label>
  <p class="small muted" style="margin-top:6px">Synchronisation de travail : <span class="mono">${APP}.json</span>. Archives d'audit : dossier <span class="mono">${FOLDER}</span>. Portée <span class="mono">drive.file</span> : l'app ne voit que les fichiers qu'elle a créés.</p>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="driveConnect()">${tok?'Reconnecter Drive':'Connecter Drive'}</button></div></div>
  <p class="small muted" style="text-align:center;margin-top:18px">${APP} · <span class="ver">v2.1</span> · ${VDATE}</p>`;}
function impJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);ensureState();autoSave();go('dossiers');toast('Import réussi');}catch(e){toast('Fichier invalide');}};r.readAsText(f);}

/* ============ UTILITAIRES ============ */
let toastT;function toast(t,b,fn){$('toast-t').textContent=t;const bt=$('toast-b');bt.textContent=b||'';bt.onclick=()=>{fn&&fn();$('toast').style.display='none';};$('toast').style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>$('toast').style.display='none',b?6000:2500);}
function dl(name,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
function copyTxt(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copié')).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('Copié');});}
const THEMES=['light','sand','navy','dark'],TI={light:'☀︎',sand:'○',navy:'◑',dark:'☾'};
function applyTheme(t){document.documentElement.setAttribute('data-theme',t==='light'?'':t);$('theme-btn').textContent=TI[t]||'☀︎';localStorage.setItem(TK,t);}
function toggleTheme(){const c=localStorage.getItem(TK)||'light';applyTheme(THEMES[(THEMES.indexOf(c)+1)%THEMES.length]);}

/* ============ GOOGLE DRIVE ============ */
let tok=sessionStorage.getItem(TOKK)||null,fileId=null;
function setSync(s){$('sync').textContent={loc:'⚫ Local',pend:'🟡 En attente',ok:'🟢 Sync ✓',err:'🔴 Erreur'}[s];}
function driveConnect(after){const cid=cidGet();if(!cid){go('set');toast('Renseignez le Client ID OAuth');return;}
  if(!(window.google&&google.accounts)){toast('Librairie Google non chargée');return;}
  google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r&&r.access_token){tok=r.access_token;sessionStorage.setItem(TOKK,tok);drivePull();if(typeof after==='function')after();}else setSync('err');}}).requestAccessToken();}
async function dfetch(u,o){o=o||{};const r=await fetch(u,Object.assign({},o,{headers:Object.assign({Authorization:'Bearer '+tok},o.headers||{})}));
  if(r.status===401){tok=null;sessionStorage.removeItem(TOKK);throw new Error('401');}if(!r.ok)throw new Error(r.status);return r;}
async function findFile(){if(fileId)return fileId;const r=await dfetch("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("name='"+APP+".json' and trashed=false")+"&fields=files(id)");
  const j=await r.json();fileId=j.files&&j.files[0]?j.files[0].id:null;return fileId;}
async function drivePull(){if(!tok)return;try{if(await findFile()){const r=await dfetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media');const j=await r.json();
    if(j&&(j.updated||0)>(S.updated||0)){S=j;ensureState();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}renderAll();}else if((S.updated||0)>(j.updated||0)){await drivePush();return;}
    setSync('ok');}else await drivePush();}catch(e){setSync('err');}}
async function drivePush(){if(!tok)return;try{const body=JSON.stringify(S);
    if(!(await findFile())){const b='x'+uid(),meta=JSON.stringify({name:APP+'.json',mimeType:'application/json'});
      const r=await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
        body:`--${b}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`});fileId=(await r.json()).id;}
    else await dfetch('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
    setSync('ok');}catch(e){setSync('err');}}

/* ============ ARCHIVES D'AUDIT (un JSON + un rapport par audit) ============ */
let folderId=null;
async function ensureFolder(){if(folderId)return folderId;
  const r=await dfetch("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("name='"+FOLDER+"' and mimeType='application/vnd.google-apps.folder' and trashed=false")+"&fields=files(id)");
  const j=await r.json();if(j.files&&j.files[0]){folderId=j.files[0].id;return folderId;}
  const c=await dfetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FOLDER,mimeType:'application/vnd.google-apps.folder'})});
  folderId=(await c.json()).id;return folderId;}
async function upsert(name,body,mime,id){if(id){try{await dfetch('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':mime},body:body});return id;}catch(e){if(String(e.message)==='401')throw e;}}
  const b='x'+uid(),meta=JSON.stringify({name:name,mimeType:mime,parents:[await ensureFolder()]});
  const r=await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
    body:'--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: '+mime+'\r\n\r\n'+body+'\r\n--'+b+'--'});return (await r.json()).id;}
const slug=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'audit';
function auditPayload(d){const o={schema:'diag001-audit/1',app:APP,version:VER,exportedAt:new Date().toISOString(),audit:d};
  if(d.type==='aipd')o.qualification=aipdQual(d);else{o.scores={rgpd:score(d,byReg('RGPD')).pct,ia:score(d,byReg('IA')).pct,domaines:{}};
    Object.keys(DOMS).forEach(k=>{if(qs(d).some(byDom(k)))o.scores.domaines[k]=score(d,byDom(k)).pct;});
    o.ecarts=gaps(d).map(x=>({id:x.q[0],priorite:'P'+x.p,reference:x.q[5],ecart:x.q[4],reponse:x.v===0?'non':'partiel',type:x.k,action:x.a}));}
  return o;}
async function archiveD(id,silent){const d=S.diags.find(x=>x.id===id);if(!d)return;if(!tok){driveConnect(function(){archiveD(id);});return;}
  try{setSync('pend');const base='audit-'+slug(d.client)+'-'+d.type+'-'+new Date(d.date).toISOString().slice(0,10)+'-'+d.id;
    d.drive.json=await upsert(base+'.json',JSON.stringify(auditPayload(d),null,2),'application/json',d.drive.json);
    d.drive.md=await upsert(base+'.md',buildReport(d),'text/markdown',d.drive.md);
    d.drive.at=Date.now();autoSave();setSync('ok');if(!silent){toast('Audit archivé dans '+FOLDER);renderAll();}return true;}
  catch(e){setSync('err');if(!silent)toast('Archivage impossible ('+e.message+')');return false;}}
async function archiveAll(){if(!tok){driveConnect(archiveAll);return;}let ok=0;for(let i=0;i<S.diags.length;i++){if(await archiveD(S.diags[i].id,true))ok++;}toast(ok+' audit(s) archivé(s)');renderAll();}
async function listArchives(){if(!tok){driveConnect(listArchives);return;}const box=$('arch');if(!box)return;box.innerHTML='<p class="small muted">Lecture du dossier…</p>';
  try{const f=await ensureFolder();const r=await dfetch("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("'"+f+"' in parents and trashed=false and mimeType='application/json'")+"&orderBy=modifiedTime desc&pageSize=100&fields=files(id,name,modifiedTime)");
    const j=await r.json(),L=j.files||[];
    box.innerHTML=L.length?`<div class="tw"><table><thead><tr><th>Fichier</th><th>Modifié</th><th></th></tr></thead><tbody>${L.map(x=>{const known=S.diags.some(d=>d.drive&&d.drive.json===x.id);
      return `<tr><td class="mono">${esc(x.name)}</td><td class="mono">${new Date(x.modifiedTime).toLocaleDateString('fr-FR')}</td><td>${known?'<span class="small muted">présent</span>':`<button class="btn sm" onclick="restoreArchive('${x.id}')">Restaurer</button>`}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="small muted">Aucune archive pour l\'instant.</p>';}
  catch(e){box.innerHTML='<p class="small muted">Lecture impossible ('+esc(e.message)+').</p>';}}
async function restoreArchive(fid){try{const r=await dfetch('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media');const j=await r.json();
  if(!j||!j.audit||!j.audit.id){toast('Archive invalide');return;}const a=j.audit;a.drive=a.drive||{};a.drive.json=fid;
  const i=S.diags.findIndex(d=>d.id===a.id);if(i>=0)S.diags[i]=a;else S.diags.push(a);ensureState();autoSave();renderAll();toast('Audit restauré : '+a.client);}
  catch(e){toast('Restauration impossible ('+e.message+')');}}
setInterval(()=>{if(tok&&!saveT)drivePull();else if(tok&&$('sync').textContent.startsWith('🟢'))drivePull();},60000);

/* ============ INIT ============ */
load();applyTheme(localStorage.getItem(TK)||'light');applyFS(fsIdx());go('dossiers');if(tok)drivePull();
$('boot').style.display='none';
</script>
</body>
</html>
