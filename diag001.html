1.a", "Mettre en place le chiffrement des flux et des stockages contenant des données sensibles ou à risque, et étudier la pseudonymisation pour les usages qui le permettent (tests, statistiques).", "Étendre le chiffrement aux flux ou stockages non couverts et évaluer la pseudonymisation des environnements de test.", "RGPD art. 32.1.a", "RGPD art. 32.1.a"], ["t503", "T5", "PMG", 2, "Les accès aux données sont journalisés et les journaux exploités.", "RGPD art. 32 ; recommandation CNIL journalisation", "Activer la journalisation des accès aux données (qui, quand, quelle action), en définir la durée de conservation et organiser son exploitation pour détecter les accès anormaux.", "Organiser l'exploitation des journaux (analyse, alertes), définir leur durée de conservation et les protéger contre la modification.", "RGPD art. 32.1 ; recommandation CNIL journalisation", "RGPD art. 32.1 ; recommandation CNIL journalisation"], ["t504", "T5", "PMG", 2, "Le niveau de risque du traitement pour les droits et libertés des personnes est évalué (risque élevé ou non) et sert à dimensionner les mesures de sécurité.", "RGPD art. 24, 32.1, 35", "Évaluer le niveau de risque du traitement pour les personnes au regard des critères du CEPD (données sensibles, grande échelle, personnes vulnérables, profilage…) et en déduire les mesures de sécurité exigées.", "Compléter l’évaluation du risque au regard des critères du CEPD et en dériver explicitement les mesures de sécurité retenues.", "RGPD art. 24.1, 32.1, 35.1 ; lignes directrices WP248 rév.01", "RGPD art. 24.1, 32.1 ; lignes directrices WP248 rév.01"], ["t505", "T5", "PMG", 3, "Chaque application support met en œuvre les mesures de sécurité exigées pour le niveau de risque du traitement (référentiel Security by Design de l’organisation le cas échéant).", "RGPD art. 25, 32", "Réaliser, pour chaque application support, l’analyse d’écart aux mesures exigées pour ce niveau de risque et planifier leur mise en œuvre.", "Mettre en œuvre les mesures restantes sur les applications concernées, ou formaliser une acceptation de risque.", "RGPD art. 25.1, 32.1", "RGPD art. 25.1, 32.1"], ["t601", "T6", "PMG", 3, "Le traitement est inscrit au registre avec une fiche à jour.", "RGPD art. 30", "Constituer la fiche registre du traitement avec toutes les mentions de l'art. 30.1 : finalités, catégories de personnes et de données, destinataires, transferts, durées de conservation, mesures de sécurité.", "Mettre à jour la fiche registre sur les mentions obsolètes ou manquantes (durées, destinataires, transferts, mesures de sécurité).", "RGPD art. 30.1", "RGPD art. 30.1.d, 30.1.e, 30.1.f, 30.1.g"], ["t602", "T6", "PMG", 3, "La nécessité d’une AIPD a été évaluée et, si elle est requise, l’AIPD est réalisée avant la mise en production.", "RGPD art. 35", "Qualifier le besoin d’AIPD (art. 35.1, critères du CEPD ; présumée pour les systèmes à haut risque au sens de l’AI Act) et la réaliser avant la mise en production si elle est requise.", "Finaliser l'AIPD avant la mise en production : évaluation des risques, mesures, risques résiduels et conseil du DPO ; consulter la CNIL si le risque résiduel reste élevé.", "RGPD art. 35.1 ; AI Act art. 26.9 ; lignes directrices WP248 rév.01 ; recommandations CNIL IA", "RGPD art. 35.1, 35.2, 35.7, 36.1"], ["t603", "T6", "PMG", 2, "Le conseil du DPO a été demandé lors de l’AIPD.", "RGPD art. 35.2, 39.1.c ; lignes directrices WP243 rév.01 §4.2 ; lignes directrices WP248 rév.01 (III.D.b)", "Demander le conseil du DPO lors de l'AIPD et le consigner dans l'AIPD avec la suite qui lui est donnée (bonne pratique).", "Associer le DPO à la version finale de l’AIPD (et pas seulement de façon informelle) ; suivre la prise en compte de ses recommandations (bonne pratique).", "RGPD art. 35.2 ; lignes directrices WP248 rév.01 (III.D.b)", "RGPD art. 35.2 ; lignes directrices WP243 rév.01 §4.2"], ["t604", "T6", "PMG", 1, "Les paramètres par défaut sont les plus protecteurs (privacy by default).", "RGPD art. 25.2", "Revoir les paramètres par défaut de l'application pour qu'ils soient les plus protecteurs : données collectées, durée de conservation, visibilité et partage limités au nécessaire.", "Compléter la revue des paramètres par défaut (données, durée, visibilité) sur les fonctionnalités non couvertes.", "RGPD art. 25.2", "RGPD art. 25.2"], ["t701", "T7", "PMG", 3, "Le système d’IA est qualifié : rôle (fournisseur ou déployeur) et niveau de risque (interdit, haut risque, transparence, minimal).", "AI Act art. 3, 5, 6", "Qualifier le système au regard de la définition de système d'IA (art. 3.1), le rôle de l'organisation (fournisseur ou déployeur) et le niveau de risque (pratique interdite, haut risque au titre des annexes I ou III, transparence, risque minimal).", "Compléter la qualification (rôle ou niveau de risque manquant) et justifier le classement, notamment toute exemption de l’art. 6.3, dont la documentation est obligatoire (art. 6.4).", "AI Act art. 3, 5, 6", "AI Act art. 6.3, 6.4"], ["t702", "T7", "PMG", 3, "Si le traitement s’appuie sur un système d’IA qui interagit avec des personnes ou génère des contenus, les personnes en sont informées et les contenus sont marqués ou signalés.", "AI Act art. 50", "Qualifier le rôle de l’organisation (fournisseur ou déployeur) et mettre en place les mentions d’interaction IA et le marquage ou le signalement des contenus requis.", "Compléter les mentions ou le marquage sur les canaux non couverts et vérifier que l’information est donnée au plus tard lors de la première interaction ou exposition.", "AI Act art. 50.1, 50.2, 50.3, 50.4", "AI Act art. 50.5"], ["t703", "T7", "PMG", 3, "Un contrôle humain effectif est organisé sur les sorties du système.", "AI Act art. 14, 26 ; RGPD art. 22", "Désigner et former des superviseurs humains compétents, définir leur pouvoir de corriger, d'ignorer ou d'arrêter les sorties du système, et vérifier qu'aucune décision produisant des effets juridiques n'est entièrement automatisée hors des exceptions de l'article 22 du RGPD.", "Formaliser le contrôle humain (rôles, points de contrôle, pouvoir d'arrêt) et former les superviseurs.", "AI Act art. 14, 26.2 ; RGPD art. 22", "AI Act art. 14, 26.2"], ["t704", "T7", "PMG", 2, "Le contrat avec le fournisseur exclut la réutilisation des données pour l’entraînement (art. 28.3.a, si sous-traitant), prévoit le droit d’audit (art. 28.3.h) et couvre la documentation (pratique de place).", "RGPD art. 28.3.a, 28.3.h ; pratique de place", "Négocier les clauses IA du contrat fournisseur : non-réutilisation des données pour l'entraînement (art. 28.3.a, si sous-traitant), droit d'audit (art. 28.3.h) et accès à la documentation (pratique de place).", "Compléter les clauses manquantes du contrat fournisseur (non-réutilisation des données, audit, documentation).", "RGPD art. 28.3.a, 28.3.h ; pratique de place", "RGPD art. 28.3.a, 28.3.h ; pratique de place"], ["t705", "T7", "PMG", 2, "Lorsqu’une AIPD est requise, les risques propres à l’IA (biais, erreurs, injection de prompt, fuite de données) y sont évalués (art. 35.7) et testés (bonne pratique).", "RGPD art. 35.7 ; recommandations CNIL IA", "Évaluer dans l'AIPD les risques propres à l'IA (biais, erreurs, injection de prompt, fuite ou mémorisation de données) ; les tester avant la mise en production (bonne pratique).", "Compléter l’évaluation des risques IA dans l’AIPD ; compléter les tests et en consigner les résultats (bonne pratique).", "RGPD art. 35.7 ; recommandations CNIL IA", "RGPD art. 35.7 ; recommandations CNIL IA"]];
const EN_Q={"f1": ["A DPO is appointed where mandatory (otherwise a data protection lead — good practice), known internally, and has time and resources.", "Appoint a DPO where mandatory (Art. 37(1)) or otherwise a data protection lead (good practice) without calling them “DPO”, otherwise Art. 37 to 39 apply; register the DPO with the CNIL and formalise their mission letter (good practice).", "Give the DPO/lead the necessary time and resources (Art. 38(2)), ensure reporting to the highest management level (Art. 38(3)), make them known internally and formalise their mission letter (good practice)."], "f2": ["Staff handling personal data receive regular awareness or training.", "Roll out awareness for the staff concerned, with an annual module and targeted HR, marketing and IT sessions (industry practice).", "Extend awareness to uncovered populations and renew it regularly; track completion rates (industry practice)."], "f3": ["Compliance is monitored and reviewed (Art. 24(1), 39(1)(b)); a committee, indicators and reporting to management steer it (industry practice).", "Define and run a compliance control plan; set up a committee and a quarterly dashboard (industry practice).", "Run the control plan and review the measures; complete indicators, committee frequency and reporting to management (industry practice)."], "f4": ["For joint controllership or intra-group processing, respective obligations are set out in an arrangement or contract; a network of relays covers subsidiaries / business lines (industry practice).", "Conclude intra-group joint-controller arrangements (Art. 26) or processing contracts (Art. 28(3)); build a relay network (industry practice).", "Conclude the missing arrangements (Art. 26) or contracts (Art. 28(3)); fill the gaps in the relay network (industry practice)."], "f5": ["The record of processing activities exists, is complete and kept up to date; at least an annual review is recommended (industry practice).", "Build the record of processing activities through workshops with stakeholders and set up an annual review (industry practice).", "Complete the record of processing activities through workshops with the stakeholders concerned, update outdated entries and set up an annual review (industry practice)."], "f6": ["Each processing activity relies on a legal basis under Article 6(1) and has a defined, enforced retention period (purge).", "Establish the reference framework of legal bases and retention periods; define and implement the associated purges.", "Complete the reference framework of legal bases and retention periods; define the missing purges and check they are actually run."], "f7": ["Individuals are informed at each collection point through an information notice that refers, where relevant, to the privacy policy (layered information).", "Audit collection points and implement the information notices, with a link to the privacy policy.", "Fix uncovered or incomplete collection points, and harmonise existing notices and their link to the privacy policy."], "f8": ["A procedure handles rights requests within one month (extendable by two months); a request log ensures traceability (industry practice).", "Formalise and implement the procedure for handling data subject rights requests and the associated deadline tracking; set up a single entry point and a request log (industry practice).", "Complete the procedure for handling data subject rights requests (identity check where there is reasonable doubt, associated deadline tracking) and implement it effectively; complete the single entry point and the request log (industry practice)."], "f9": ["Website / app cookies and trackers comply with consent (refusing as easy as accepting).", "Audit the cookies and trackers placed on websites and apps, then configure a compliant CMP: prior consent for non-exempt trackers, refusal as easy as acceptance, proof retention and the 6-month validity of the choice recommended by the CNIL.", "Fix CMP gaps (easy refusal, trackers set before consent) and re-audit; align the choice retention period with the CNIL recommendation (6 months)."], "f10": ["Processors are listed and their contracts include Article 28 clauses.", "List the processors (service providers processing personal data on the organisation's behalf), check their guarantees and bring contracts into line with the Art. 28(3) clauses (instructions, confidentiality, security, sub-processing, assistance, return or deletion of data, audit).", "Complete the processor inventory and regularise first the contracts lacking the Article 28 clauses."], "f11": ["Transfers outside the EU are identified and framed (adequacy decision, or appropriate safeguards such as SCCs with a transfer impact assessment).", "Map transfers and frame each one with a Chapter V tool (adequacy decision, SCCs, BCRs…); carry out a TIA for those based on Article 46 safeguards.", "Complete the transfer mapping, frame the transfers not yet covered with a Chapter V tool (adequacy decision, SCCs, BCRs…) and carry out the missing TIAs for transfers based on Article 46 safeguards."], "f12": ["Security measures proportionate to risks are in place (access rights, encryption, backups, logging…).", "Carry out a risk analysis and implement a security plan appropriate to the risk: access management, encryption, tested backups, access logging, patch management.", "Complete the risk analysis and implement the missing measures of the security plan, appropriate to the risk."], "f13": ["A breach procedure allows notifying the CNIL within 72 hours when the breach poses a risk, and a register of all breaches is kept.", "Write and implement a breach management procedure and the associated register; test them through a crisis exercise (good practice).", "Complete the breach management procedure (criteria, decision path, templates) and keep the associated register; test them through a crisis exercise (good practice)."], "f14": ["High-risk processing activities are covered by a DPIA.", "Identify the processing operations likely to result in a high risk (CNIL list of operations requiring a DPIA, EDPB criteria) and carry out a DPIA for each before it starts.", "Carry out the missing DPIAs for uncovered high-risk processing and review those that are outdated (change in the processing or the risk)."], "f15": ["Data protection is built into projects from the design stage (privacy by design).", "Insert a privacy milestone into the project methodology and procurement, covering in particular data minimisation from the design stage.", "Make the privacy milestone mandatory in the project methodology and procurement, include data minimisation from the design stage, and check it is applied."], "f16": ["An inventory of AI systems and AI use cases exists (bought, built, embedded, generative AI, shadow AI).", "List all AI systems used or developed (purchased, developed in-house, embedded in software, generative AI, shadow AI) and their AI use cases, then create an AI register (one entry per system and AI use case) stating the owner, purpose, data processed and the organisation's role.", "Complete the inventory with the categories not yet covered (AI embedded in software, shadow AI, generative AI) and keep it continuously updated through purchasing and projects."], "f17": ["An AI lead and an AI governance body are identified (with DPO, CISO, legal, business).", "Appoint an AI lead responsible for compliance and set up an AI governance committee bringing together the DPO, CISO, legal and business teams, with a defined mandate and meeting frequency.", "Formalise the AI lead's mandate and the committee charter, and ensure all key functions attend."], "f18": ["An AI management system (ISO/IEC 42001 type) is in place or planned.", "Scope an AIMS (scope, AI policy, roles, risk assessment process) and link it with the existing ISMS and QMS to share common processes (internal audit, management review, document control).", "Structure the AIMS project: define its scope, roadmap and owners, and link it with the ISMS and QMS."], "f19": ["For each system, the company's role is qualified (provider, deployer, importer, distributor).", "For each AI system, qualify the organisation's role (provider, deployer, importer, distributor) against the Art. 3 definitions, check the cases of requalification as provider (Art. 25) and record the rationale (market practice).", "Qualify the role for the systems not yet analysed, check the cases of requalification as provider (Art. 25) and record the rationale (market practice)."], "f20": ["Systems are classified by risk level (prohibited, high-risk, transparency, minimal).", "Apply a classification grid to each system (prohibited practice, high-risk under Annex I or III, transparency obligation, minimal risk) and document any Art. 6(3) exemption before placing on the market or putting into service.", "Classify the systems not yet assessed using the same grid and document the Art. 6(3) exemptions that have not been documented."], "f21": ["The absence of prohibited practices has been checked (social scoring, manipulation, emotion recognition at work…).", "Screen each AI use case against the Art. 5 prohibited practices (manipulation, exploitation of vulnerabilities, social scoring, emotion recognition at work or in education, sensitive biometric categorisation…) and stop prohibited uses immediately.", "Extend the Art. 5 screening to the AI use cases not yet examined, stop any prohibited use identified and record the conclusions (market practice)."], "f22": ["An AI literacy programme trains staff according to their role.", "Roll out an AI training path tailored to each population (users, supervisors, developers, decision-makers), taking into account their knowledge and the context in which the systems are used.", "Extend AI training to uncovered populations and tailor it to roles (users, overseers, decision-makers)."], "f23": ["A charter / policy governs generative AI use (confidential data, approved tools, verification).", "Draft and circulate a generative AI usage charter (authorised tools, data that must not be entered, human review of generated content) and publish the list of approved tools.", "Complete the charter (approved tools, forbidden data, human verification) and have everyone accept it."], "f24": ["If the organisation provides an AI system intended to interact directly with natural persons or generating synthetic content, people are informed they are interacting with an AI (Art. 50(1)) and the content is marked (Art. 50(2)); if it deploys an emotion recognition or biometric categorisation system, or generates deepfakes or texts published on matters of public interest, the people exposed are informed and such content is disclosed (Art. 50(3), 50(4)).", "List the systems concerned, qualify the organisation’s role (provider or deployer) for each and implement the required notices and marking.", "Cover the remaining systems and check that the information is clear and given at the latest at the first interaction or exposure."], "f25": ["For deployed high-risk systems: human oversight, log retention, information of individuals, FRIA where required.", "Build the deployer compliance plan for your high-risk systems by the end of 2027: human oversight by competent people, log retention for at least six months, information of affected persons and employees, FRIA where required.", "Complete by the end of 2027 the deployer compliance plan for your high-risk systems: human oversight, logs, information to individuals and FRIA where required."], "f26": ["If the company develops or places high-risk systems on the market: provider requirements are anticipated (otherwise N/A).", "Run a gap analysis against the provider requirements (risk management, data governance, technical documentation, logging, transparency, human oversight, robustness, quality management system) and plan the conformity assessment before placing on the market.", "Complete the gap analysis on the requirements not yet analysed and plan their implementation and the conformity assessment."], "f27": ["Contracts with AI vendors include the required clauses (GDPR Art. 28 where a processor; AI Act Art. 25(4) for high-risk system components); documentation, intellectual property and data reuse are addressed (industry practice).", "Define standard AI clauses for purchasing (Art. 28 clauses where the supplier is a processor; Art. 25(4) information and assistance for components of high-risk systems; documentation, intellectual property and no reuse of data as market practice) and renegotiate the contracts of the most critical systems first.", "Add the standard AI clauses to existing contracts that lack them and make them mandatory for any new AI purchase."], "f28": ["GDPR / AI alignment is ensured: legal basis for training data, DPIA where the processing is likely to result in a high risk (presumed for high-risk systems under the AI Act), automated decision-making.", "For each AI system processing personal data: determine the legal basis for training data (often legitimate interest, with a balancing test) and inform individuals; assess whether a DPIA is needed (Art. 35(1); presumed for high-risk systems under the AI Act) and carry it out with an AI section where required; identify fully automated decisions and frame them (Art. 22).", "Complete the missing elements: legal basis and information for the remaining training datasets, DPIA with an AI section for high-risk processing, framing of automated decisions (Art. 22)."], "r101": ["DPO appointed where required, contact details published and notified to the CNIL.", "Appoint a DPO where mandatory (Art. 37(1)), publish their contact details and communicate them to the CNIL (Art. 37(7)).", "Publish the DPO's contact details (website, privacy notices) and check that they have been communicated to the CNIL and are up to date."], "r102": ["The DPO is involved early, independent, free of conflicts of interest, with sufficient resources.", "Give the DPO the necessary resources (time, budget, access to data and processing, training; Art. 38(2)), guarantee their independence and early involvement in projects; formalise their engagement letter (good practice).", "Strengthen the DPO's independence (no instructions on their tasks, reporting to the highest management level, no conflict of interest) and resources, and systematically involve them early in projects."], "r103": ["A data protection policy is implemented where proportionate (Art. 24(2)); approved by management and circulated (industry practice).", "Draft a data protection policy where proportionate to the processing (principles, roles, key processes: records, rights, breaches, DPIA, processors); have it approved by management and circulated (market practice).", "Update the policy (missing processes, regulatory changes); have it approved by management and circulated to all (market practice)."], "r104": ["Roles and responsibilities (business, IT, relays) are defined.", "Establish a data protection responsibility matrix (management, business, IT, CISO, DPO, local relays) for the key processes: records, rights, breaches, DPIA, processors.", "Complete the responsibility matrix for the roles and processes not covered and make it known to those concerned."], "r105": ["The DPO reports directly to the highest management level (Art. 38(3)); an annual report with indicators is presented (good practice).", "Organise direct DPO reporting to management; set up an annual report and KPIs (good practice).", "Make DPO reporting to management effective; formalise the annual report and complete the indicators (good practice)."], "r106": ["A compliance control / audit plan is executed.", "Define a compliance control plan, ideally multi-year (market practice), specifying scopes, frequency, owners and follow-up of corrective actions.", "Run the control plan at the planned frequency, record the results and track corrective actions until closure."], "r107": ["The role of each group entity is qualified (controller, joint controller, processor) and an arrangement sets out joint controllers’ obligations; each subsidiary has a relay (industry practice).", "Conclude the required intra-group agreements (Art. 26, 28(3)); build the relay network (industry practice).", "Conclude the missing joint-controller arrangements or intra-group processing contracts; complete the relay network per subsidiary (industry practice)."], "r108": ["An awareness and training programme for staff involved in processing is deployed.", "Roll out an awareness and training plan tailored to the populations involved in processing (all staff, managers, HR, marketing, IT); track completion rates (market practice).", "Extend training to the populations not covered and keep it up to date; track completion (market practice)."], "r201": ["Controller's record complete (controller and DPO contact details, purposes, categories of data subjects and data, recipients, transfers, erasure time limits, security measures).", "Build the record of processing activities with all Art. 30(1) items: controller and DPO contact details, purposes, categories of data subjects and data, recipients, transfers outside the EU, erasure time limits, description of security measures.", "Complete the missing items of the record for each processing activity, in particular recipients, transfers, erasure time limits and security measures."], "r202": ["Processor's record kept for activities carried out on behalf of clients.", "Where the organisation acts as a processor for clients, create the processor record: name and contact details of each client, categories of processing carried out on its behalf, transfers outside the EU, description of security measures.", "Complete the processor record for all activities carried out on behalf of clients and for the missing Art. 30(2) items."], "r203": ["The record is kept up to date (Art. 30); a project trigger and a periodic review ensure this (industry practice).", "Update the record; introduce a project trigger (any new or modified processing) and an annual review with business teams (market practice).", "Update outdated entries; make the project trigger mandatory and record the annual review (industry practice)."], "r204": ["The map of applications and data flows is linked to the record.", "Link the record to the IT map or CMDB: attach to each processing activity the applications, databases and data flows supporting it (market practice).", "Attach to the record the applications and data flows not yet linked to it."], "r205": ["Sensitive and criminal-offence data are identified with their applicable exception.", "List sensitive and criminal-offence data, and check for each the Art. 9(2) exception or the framework authorised under Art. 10.", "Complete the inventory of sensitive and criminal-offence data, and check the exception (Art. 9(2)) or authorised framework (Art. 10) for those lacking one."], "r301": ["Each processing purpose relies on one of the legal bases of Article 6(1) (consent, performance of a contract or pre-contractual steps, legal obligation, vital interests, public task or exercise of official authority, legitimate interests).", "Determine the legal basis of each purpose and record it (record of processing, processing sheet) so it can be demonstrated.", "Determine the missing legal bases, correct inappropriate ones and record them so they can be demonstrated."], "r302": ["Consent, where it is the legal basis, is freely given, specific, informed and unambiguous, demonstrable and as easy to withdraw as to give.", "Review consent journeys so that consent is freely given, specific, informed and unambiguous (no pre-ticked boxes, separate purposes), as easy to withdraw as to give, and keep proof of consent (date, version of the information, choice made).", "Fix non-compliant consent journeys (pre-ticked boxes, bundled consent, difficult withdrawal) and set up proof retention."], "r303": ["Where legitimate interest is relied on, the balancing against data subjects’ interests and rights is carried out and can be demonstrated.", "For each processing based on legitimate interest, carry out and record a balancing test: interest pursued, necessity of the processing, impact on individuals and their reasonable expectations, safeguards in place.", "Carry out the missing balancing tests and review insufficient ones; if the balance is unfavourable, revisit the processing."], "r304": ["Only necessary data is collected (data minimisation).", "Review with business teams the data collected (forms, mandatory fields, imports), remove data not necessary for the purpose and make only essential fields mandatory.", "Remove unnecessary data still collected and justify each remaining mandatory field."], "r305": ["Retention periods are defined and purging / archiving is effective in systems.", "Establish the retention schedule per data category; define and implement the related purges.", "Complete the retention period framework; define the missing purges and check they are actually run in all systems."], "r306": ["Data reuse is subject to a purpose-compatibility test.", "Introduce a compatibility test for any reuse of data (link between purposes, context of collection, nature of the data, consequences for individuals, safeguards); where not compatible, the new processing must rely on its own legal basis.", "Apply the compatibility test to existing unassessed reuses and make it systematic for new ones."], "r401": ["Privacy notices are complete at every collection point (direct and indirect).", "Draft and publish privacy notices at each collection point (forms, websites, apps, contracts, phone reception) with the Art. 13 and 14 information; for indirect collection, inform individuals within one month.", "Complete incomplete notices, cover indirect collection (information within one month) and harmonise the link to the privacy policy."], "r402": ["Employees and candidates are informed of HR processing.", "Circulate an HR privacy notice to employees and candidates covering HR processing (payroll, career management, recruitment, activity monitoring tools); inform employees before any monitoring device is introduced.", "Complete HR information for the audiences or processing not covered (candidates, monitoring tools, new processing)."], "r403": ["The procedure for handling data subject rights requests is operational: channel, identity check where there is reasonable doubt, one-month deadline; request log (industry practice).", "Formalise and implement the procedure for handling data subject rights requests and the associated deadline tracking; set up a single entry point and a request log (industry practice).", "Complete the procedure for handling data subject rights requests (identity check where there is reasonable doubt, associated deadline tracking) and implement it effectively; complete the single entry point and the request log (industry practice)."], "r404": ["Systems technically allow access, erasure, restriction and portability.", "Check for each application the technical ability to respond to rights (extracting a person's data, erasure, restriction, export in a structured format for portability) and plan the necessary changes.", "Close the identified technical gaps (erasure, restriction, export) on the applications concerned."], "r405": ["Cookies and trackers: prior consent, equally easy refusal, proof, 6-month duration recommended.", "Audit the cookies and trackers placed, then reconfigure the CMP: prior consent for non-exempt trackers, refusal as easy as acceptance, proof retention, 6-month validity of the choice recommended by the CNIL.", "Fix the CMP gaps (refusal as easy as acceptance, trackers placed before consent, validity period of the choice) and check that proof of consent is retained."], "r406": ["Direct marketing complies with opt-in / opt-out rules and objection lists.", "Review direct marketing rules: prior consent (opt-in) for electronic marketing to consumers, except for similar products or services offered to existing customers; right to object (opt-out) in every message; handling of objections and of the Bloctel list for telemarketing.", "Fix non-compliant campaigns and make objection handling reliable (prompt processing, synchronisation across tools, suppression lists)."], "r501": ["An inventory of processors and sub-processors is kept.", "List processors and sub-processors (service, data processed, location, contract) and keep the inventory updated with each new purchase.", "Complete the inventory, in particular with authorised sub-processors and their location."], "r502": ["Contracts include all mandatory clauses of Article 28.3.", "Bring contracts into line with the Art. 28(3) clauses: subject matter, duration, nature and purpose, documented instructions, confidentiality, security, sub-processing, assistance (rights, breaches, impact assessments), return or deletion of data at the end of the contract, audit.", "Add the missing clauses to existing contracts, starting with processors handling sensitive or large volumes of data."], "r503": ["Processors are assessed before contracting (Art. 28(1)) and then monitored periodically (good practice).", "Set up a pre-contract assessment of processors (security guarantees, certifications, data location, sub-processors; Art. 28(1)), graded according to risk, and periodic checks (good practice).", "Make processor assessment before contracting systematic (Art. 28(1)); introduce periodic checks (good practice)."], "r504": ["Transfers outside the EU are mapped, including remote access and cloud hosting.", "Map personal data transfers outside the EU/EEA: cloud hosting and services, processors and sub-processors established outside the EU, remote access from a third country (support, maintenance, administration), intra-group flows and one-off disclosures to third parties; for each, specify the destination country and the transfer tool (adequacy decision, standard contractual clauses, BCR, derogation).", "Complete the map with unrecorded transfers (sub-processors, remote access, support, intra-group flows) and specify for each the destination country and the transfer tool."], "r505": ["Each transfer relies on a valid tool (adequacy decision, 2021 SCCs, BCRs); for Article 46 safeguards, a transfer impact assessment is carried out.", "Frame each transfer (adequacy, 2021 SCCs, BCRs) and carry out TIAs for transfers based on Article 46.", "Carry out the missing TIAs and replace any pre-2021 SCCs, which have no longer been valid since 27 December 2022."], "r506": ["BCRs or an equivalent intra-group framework govern internal transfers.", "Assess whether BCRs are appropriate given the volume and nature of intra-group flows; otherwise, cover these flows with an intra-group agreement incorporating the SCCs.", "Frame the remaining intra-group flows with an intra-group agreement incorporating the SCCs, or start a BCR process."], "r601": ["A risk analysis underpins security measures (Art. 32(1), 32(2)); an information security policy exists (industry practice).", "Carry out a risk analysis and implement a security plan appropriate to the risk; formalise the security policy (industry practice).", "Complete the risk analysis and implement the missing measures of the security plan; complete the security policy (industry practice)."], "r602": ["Access management: least privilege, periodic review, strong authentication on sensitive access.", "Define an access policy based on least privilege, set up periodic access reviews and MFA on sensitive access.", "Complete the framework: apply least privilege to profiles not yet reviewed, introduce regular access reviews and extend MFA to the remaining sensitive access."], "r603": ["Encryption of endpoints, flows and sensitive databases; pseudonymisation where relevant.", "Deploy encryption of workstations and removable media, data flows and databases containing sensitive data; use pseudonymisation where relevant (testing, statistics, analytics).", "Extend encryption to the workstations, flows and databases not yet covered and assess pseudonymisation for suitable uses."], "r604": ["Logging of data access and monitoring of security events.", "Enable logging of access to personal data (who, when, what action) on the relevant applications, protect the logs and organise their analysis to detect abnormal behaviour.", "Extend logging to the remaining applications, define the log retention period and organise their review."], "r605": ["Tested backups and a business continuity / recovery plan.", "Set up regular backups, periodically test restores and formalise a BCP/DRP for critical processing.", "Regularly test restores, record the results and complete the BCP/DRP for processing not covered."], "r606": ["Regular penetration tests and security audits, with patch follow-up.", "Schedule regular penetration tests and security audits on exposed or sensitive applications, and set up vulnerability management (monitoring, prioritisation and patch tracking).", "Make testing regular, extend its scope and formalise patch tracking until closure."], "r701": ["Procedure for detecting, qualifying and escalating data breaches.", "Write and implement a breach detection, qualification and escalation procedure (qualification grid, decision path).", "Complete the procedure: risk qualification grid for individuals, escalation path (DPO, CISO, management), responsibilities and deadlines."], "r702": ["A breach register is kept, including non-notified breaches.", "Set up a register of all breaches, including those not notified: facts, effects, measures taken and rationale for the decision whether or not to notify.", "Complete the register with non-notified breaches and missing items (facts, effects, measures taken)."], "r703": ["Ability to notify the CNIL within 72 hours and to inform individuals without undue delay in case of high risk.", "Prepare the CNIL notification and individual communication templates with the required information (nature of the breach, categories and approximate number of individuals, consequences, measures taken, contact details of the data protection officer or other contact point), and define a decision path compatible with the 72-hour deadline.", "Prepare the missing templates (CNIL notification, communication to individuals) and test the decision circuit within the 72-hour deadline."], "r704": ["Processors are contractually required to notify any breach without undue delay.", "Add to processing contracts a clause requiring the processor to notify any breach without undue delay after becoming aware of it, with the information needed to assess it; setting a precise deadline (24 to 48 hours) is market practice.", "Add the breach notification clause to contracts that lack it, or make it more precise (deadline, content of the alert)."], "r705": ["Crisis exercises include a data breach scenario.", "Run at least one crisis exercise per year including a data breach scenario (detection, assessment, notification decision, communication) and derive an improvement plan from it.", "Add the data breach scenario to existing crisis exercises and track the implementation of lessons learned."], "r801": ["Project methodology and procurement include a data protection milestone from the design stage.", "Insert a privacy milestone into the project methodology and procurement, covering in particular data minimisation from the design stage.", "Make the privacy milestone mandatory in the project methodology and procurement, include data minimisation from the design stage, and check it is applied."], "r802": ["Criteria identify processing subject to DPIA (CNIL lists, 9 EDPB criteria).", "Formalise a DPIA trigger grid combining the CNIL list of processing requiring a DPIA and the 9 EDPB criteria (a DPIA is in principle required as soon as two criteria are met).", "Complete the trigger grid with the CNIL list and the 9 EDPB criteria, and apply it to existing processing and every new project."], "r803": ["Required DPIAs are carried out, approved and reviewed.", "Carry out the required DPIAs before the processing starts (description, necessity and proportionality, risks, measures), have them approved and plan their review.", "Carry out the missing DPIAs and plan the review of existing ones, in particular when the risk changes."], "r804": ["The DPO’s advice is sought when carrying out the DPIA; the CNIL is consulted beforehand if residual risk remains high.", "Seek the DPO's advice for each DPIA and record it with the follow-up given (good practice); consult the CNIL before processing starts if the residual risk remains high.", "Involve the DPO in the DPIAs where they were not and clarify the criterion for prior consultation of the CNIL (high residual risk)."], "r805": ["Default settings are the most protective (privacy by default).", "Review the default settings of applications and services so they are the most protective: data collected, retention period, visibility and sharing limited to what is necessary.", "Review the default settings of the remaining applications against the same criteria (data, retention, visibility)."], "a101": ["An AI compliance lead is appointed with a clear mandate.", "Appoint an AI compliance lead with a clear mandate: scope, responsibilities, reporting line and resources.", "Formalise the AI lead's mandate, scope, reporting line and resources."], "a102": ["An AI governance committee brings together DPO, CISO, legal, data and business.", "Set up an AI governance committee bringing together the DPO, CISO, legal, data and business teams, with a charter (tasks, membership, frequency, decision rules).", "Formalise the committee charter (tasks, frequency, decision rules) and involve the missing functions."], "a103": ["An AI policy approved by management sets principles, risk appetite and prohibitions.", "Draft an AI policy setting out usage principles, risk appetite, prohibited uses and roles, and have it approved by management.", "Complete the policy on the missing points (risk appetite, prohibited uses, roles) and have it approved by management."], "a104": ["A register lists AI systems (developed, purchased, embedded, shadow AI) and, for each, its AI use cases.", "Build the register of AI systems and their AI use cases (system × AI use case), qualifying for each AI use case the organisation’s role and the risk level.", "Complete the register (embedded and purchased AI, shadow AI, unlisted AI use cases) and set up its continuous update."], "a105": ["Every new AI use case goes through a validation (intake) process before go-live.", "Set up a use-case approval process before go-live: request form, qualification (role, risk level, personal data), DPO and CISO opinions, committee decision.", "Make the approval process mandatory for every new AI use case, including purchased tools, and apply it to live AI use cases not yet approved."], "a106": ["An AI management system (ISO/IEC 42001) is deployed or planned.", "Scope an AIMS project (scope, AI policy, roles, risk assessment process, roadmap), linking it with the existing ISMS and QMS.", "Structure the AIMS project: scope, schedule, owners and link with the ISMS and QMS."], "a201": ["Each tool is assessed against the definition of an \"AI system\".", "Apply to each tool a qualification test against the Art. 3(1) definition (a system operating with some degree of autonomy that infers from the input it receives how to generate outputs) and record the conclusion.", "Apply the qualification test to the tools not yet assessed and record the conclusions."], "a202": ["The role (provider, deployer, importer, distributor) is determined per system.", "For each system, qualify the organisation's role (provider, deployer, importer, distributor) against the Art. 3 definitions and record the rationale (market practice).", "Qualify the role (provider, deployer, importer, distributor) of the systems not yet analysed, check for each the cases of requalification as provider (name or trademark affixed, substantial modification, change of intended purpose) and record the rationale (market practice)."], "a203": ["Each AI use case is screened against prohibited practices.", "Screen each AI use case against the Art. 5 prohibited practices, stop prohibited uses immediately and record the conclusions (market practice).", "Extend the Art. 5 screening to the AI use cases not yet examined and stop any prohibited use identified."], "a204": ["High-risk classification is carried out (Annex I regulated products, Annex III use cases).", "Classify each system: high-risk if it is a regulated product or a safety component of one (Annex I), or if it falls within an Annex III area (biometrics, employment, education, access to essential services…).", "Complete the classification of the systems not yet assessed against Annexes I and III."], "a205": ["Where a system falling within an Annex III high-risk area is considered not high-risk (Art. 6(3) exemption), this assessment is documented.", "For any Annex III system considered not high-risk, document the Art. 6(3) assessment (narrow procedural task, improvement of a human activity, pattern detection without replacing human assessment, preparatory task) before placing on the market or putting into service.", "Document the exemptions not yet recorded for Annex III systems considered not high-risk and check that no exempted system profiles individuals, which rules out the exemption."], "a206": ["The risk of being requalified as provider (own brand, substantial modification, change of purpose) is controlled.", "Control the situations leading to requalification as provider (putting one's name or trademark on a high-risk system, substantial modification, change of intended purpose towards a high-risk use) through prior approval of such changes.", "Complete the controls over substantial modifications, white-label uses and changes of intended purpose."], "a301": ["Measures are taken to ensure a sufficient level of AI literacy among staff, adapted to their knowledge and the context of use.", "Roll out an AI literacy path tailored to each population (users, supervisors, developers, decision-makers), their knowledge and the context in which systems are used.", "Extend the path to the populations not covered and keep it up to date; track completion (market practice)."], "a302": ["A generative AI usage charter is circulated and accepted.", "Draft and publish a generative AI usage charter (authorised tools, data that must not be entered, human review of content, intellectual property) and organise its acceptance by users.", "Complete the charter on the missing points and organise its acceptance by all users."], "a303": ["A list of approved AI tools exists; shadow AI is detected and handled.", "Establish the catalogue of approved AI tools and set up usage controls (filtering, network flow analysis, declaration by teams) to detect and address shadow AI.", "Complete the tool catalogue, set up shadow AI detection and a handling process (regularisation or blocking)."], "a304": ["Confidential and personal data entered into AI tools is controlled (settings, no reuse for training).", "Subscribe to enterprise offers for the AI tools used (no reuse of data for training, processing agreement, data location) and define input rules prohibiting confidential or sensitive data in non-approved tools.", "Extend enterprise offers and input rules to all AI tools in use."], "a401": ["As a provider: AI systems intended to interact directly with people (chatbots, voicebots) are designed to inform them that they are interacting with an AI.", "List the AI systems intended to interact directly with people (chatbots, voicebots, virtual assistants) and build in, by design, clear information that the person is dealing with an AI, at the latest at the first interaction, unless this is obvious to a reasonably well-informed person.", "Extend the information to conversational systems not yet covered and check that it is clear, distinguishable, accessible and given at the latest at the first interaction."], "a402": ["As provider: synthetic content is marked in a machine-readable format.", "Implement marking of synthetic content (audio, image, video, text) in a machine-readable and detectable format (watermark, metadata, fingerprint) that is effective, interoperable and robust as far as technically feasible.", "Extend marking to the synthetic content and distribution channels not covered."], "a403": ["As a deployer: people exposed to an emotion recognition or biometric categorisation system are informed of its operation.", "First check that the system is lawful (emotion recognition is prohibited at work and in education, Art. 5(1)(f)), then inform exposed people of its operation and process the data in line with the GDPR.", "Complete the information of exposed people and check each system's lawfulness under Art. 5."], "a404": ["As a deployer: deepfakes and AI-generated texts published to inform the public on matters of public interest are disclosed as such.", "Define labelling rules: disclose as AI-generated or manipulated deepfakes (image, audio, video) and texts published on matters of public interest, unless reviewed by a human under editorial responsibility; provide a suitable notice for artistic or satirical works.", "Apply the labelling rules to all content and channels concerned and monitor their application."], "a501": ["High-risk systems are used in accordance with the provider's instructions.", "For each high-risk system deployed, obtain the provider's instructions for use, extract the conditions of use (intended purpose, performance limits, expected input data, human oversight measures, maintenance) and turn them into internal usage rules communicated to users.", "Obtain the missing instructions, formalise usage rules for the systems not yet covered and check that actual use stays within the provider's intended purpose (use outside that purpose may requalify the deployer as a provider)."], "a502": ["Human oversight is assigned to competent, trained people with the necessary authority.", "Appoint competent human supervisors for each high-risk system, train them on the system's operation and limits and give them the necessary authority, in particular to disregard or stop its outputs.", "Complete the appointment and training of human supervisors and formalise their authority (disregard, correct or stop the system)."], "a503": ["Relevance and representativeness of input data under the deployer's control are ensured.", "Set up quality checks on input data under the organisation's control (relevance and representativeness for the intended purpose), before and during use of the system.", "Extend quality checks to the input data and systems not covered, checking their relevance and representativeness against the provider's intended purpose."], "a504": ["Operation is monitored; risks and serious incidents are reported to the provider and the authority.", "Define an operational monitoring process in line with the instructions for use: in case of risk, inform the provider and the authority and suspend use; in case of a serious incident, immediately inform the provider, then the importer or distributor and the market surveillance authority.", "Complete the monitoring process and formalise the reporting path for risks and serious incidents (recipients, deadlines, owners)."], "a505": ["Automatically generated logs are kept for at least six months.", "Configure retention of logs automatically generated by high-risk systems, where under the organisation's control, for at least six months (or longer if applicable law requires), with secured access.", "Extend log retention to at least six months on the remaining high-risk systems and secure access to them."], "a506": ["As an employer deployer: before a high-risk AI system is put into service or used at the workplace, workers' representatives and affected employees are informed that they will be subject to it.", "Before each high-risk AI system is put into service at the workplace, inform workers' representatives and affected employees that they will be subject to it; in France, in companies with at least 50 employees, inform and consult the CSE on the introduction of this new technology.", "Complete the information of workers' representatives and employees for the high-risk AI systems not yet covered and, in France (companies with at least 50 employees), the consultation of the CSE before they are put into service."], "a507": ["Individuals subject to decisions assisted by an Annex III system are informed and can obtain an explanation.", "Inform people subject to decisions made or assisted by an Annex III high-risk system, and set up a process allowing them to obtain a clear explanation of the system's role in the decision.", "Complete the information of individuals and make the right to explanation operational (contact point, deadline, content of the reply)."], "a508": ["Where required (public bodies, public services, credit, life and health insurance), a FRIA is carried out before first use and complements the DPIA, which relies on the provider’s instructions for use.", "Identify the high-risk systems subject to a FRIA, carry it out before first use in conjunction with the DPIA, and notify its results to the market surveillance authority.", "Carry out the missing FRIAs, link them with the DPIA and notify their results to the market surveillance authority (Art. 27(3))."], "a601": ["A risk management system covers the whole life cycle.", "Set up a risk management process covering the system's whole lifecycle: risk identification and analysis, estimation, mitigation measures, testing and regular review.", "Extend risk management to all lifecycle phases (design, development, deployment, post-market)."], "a602": ["Governance of training, validation and test data (quality, bias, representativeness).", "Formalise the governance of training, validation and test datasets: origin and collection, preparation, bias examination, representativeness and traceability.", "Complete dataset governance on the points not covered (bias, representativeness, traceability, identified gaps)."], "a603": ["Technical documentation (Annex IV) and automatic event logging.", "Produce the technical documentation covering the Annex IV items and design the system to automatically record events (logging) throughout its lifetime.", "Complete the technical documentation on the missing Annex IV items (description of the system and its purpose, data used, testing methods and results, human oversight measures, risk management system) and automatic event logging."], "a604": ["Instructions for use and a design that enables human oversight.", "Draft the instructions for use for deployers (intended purpose, performance, limits, human oversight measures, maintenance) and design the system to allow effective human oversight (understanding, interpretation, interruption).", "Complete the instructions for use on the missing Art. 13(3) items (provider identity, intended purpose, performance level and limits, input data, human oversight measures, lifetime and maintenance) and the measures enabling supervisors to understand, interpret, disregard or stop the system (Art. 14(4))."], "a605": ["Accuracy, robustness and cybersecurity are specified, tested and measured.", "Define accuracy, robustness and cybersecurity metrics, declare them in the instructions for use and run test campaigns, including against AI-specific attacks (data poisoning, adversarial examples).", "Complete the accuracy, robustness and cybersecurity metrics declared in the instructions for use and extend test campaigns to the risks not covered, in particular AI-specific attacks (data poisoning, adversarial examples, model manipulation)."], "a606": ["A quality management system is documented.", "Set up a QMS covering the AI requirements of Art. 17, or extend the existing QMS: compliance strategy, design and verification procedures, data management, risk management, post-market monitoring, serious incident reporting, document control and accountability.", "Complete the QMS with the missing Art. 17 AI requirements (compliance strategy, data management, risk management, post-market monitoring, incident reporting)."], "a607": ["Conformity assessment, EU declaration, CE marking and registration in the EU database.", "Plan the conformity assessment route (internal control or notified body as applicable), then the EU declaration of conformity, CE marking and registration in the EU database.", "Complete the conformity assessment route on the missing steps (EU declaration, CE marking, registration in the EU database)."], "a608": ["Post-market monitoring and serious incident notification.", "Build a post-market monitoring plan (collection and analysis of performance data) and a path for notifying serious incidents to the authority within the Art. 73 deadlines.", "Complete the post-market monitoring plan (performance data collected and analysed throughout the system's lifetime) and the serious incident notification path: no later than 15 days after becoming aware, 10 days in the event of death, 2 days for a widespread infringement or disruption of critical infrastructure."], "a701": ["Contracts with AI vendors include the required clauses (GDPR Art. 28 where a processor; Art. 25(4) for high-risk system components) and dedicated clauses: audit, IP, data (industry practice).", "Roll out standard AI clauses in supplier contracts: GDPR Art. 28 clauses where the supplier is a processor, Art. 25(4) information and assistance for components of high-risk systems, and dedicated clauses (audit, intellectual property, data use; market practice).", "Add the AI clauses to existing contracts that lack them, starting with critical systems."], "a702": ["The documentation that general-purpose AI model providers must make available (Art. 53(1)(b)) is obtained and used (good practice).", "Require general-purpose AI model providers to supply the documentation they must make available (capabilities, limitations, integration conditions) and use it in the risk analysis (good practice).", "Obtain the missing documentation from general-purpose AI model providers and use it in the risk analysis (good practice)."], "a703": ["If the company provides a general-purpose AI model: technical documentation, copyright policy, training data summary (otherwise N/A).", "Prepare the model's technical documentation, documentation for downstream integrators, a copyright policy and the public summary of training data; adhering to the general-purpose AI code of practice helps demonstrate compliance.", "Complete the missing items (technical documentation, documentation for integrators, copyright policy, training data summary)."], "a704": ["Where personal data is used to train or fine-tune models, this processing relies on an appropriate legal basis; in case of reuse, purpose compatibility is checked, and individuals are informed.", "For each training dataset containing personal data: determine the legal basis (often legitimate interest, with a balancing test), carry out the compatibility test in case of reuse (Art. 6(4)) and inform individuals (Art. 13 or 14).", "Complete the legal basis, compatibility test and information to individuals for the remaining training datasets."], "a705": ["If fully automated decisions produce legal or similarly significant effects, they fall under an Art. 22(2) exception and are accompanied by the Art. 22(3) safeguards.", "List automated decisions, check they fall under an Art. 22(2) exception and implement the safeguards (human intervention, expressing one’s view, contesting the decision).", "Complete the inventory, check the Art. 22(2) exception for each decision and complete the safeguards (human intervention, expressing one’s view, contesting the decision)."], "a706": ["Where an AI system processes personal data and the processing is likely to result in a high risk — which is presumed for high-risk systems under the AI Act — the DPIA covers AI-specific risks.", "Add an AI section to the DPIA method: specific risks (bias, errors, opacity, data leakage or memorisation, misuse), training data quality and human oversight, drawing on the provider's instructions for use.", "Extend the AI section to all DPIAs of the systems concerned and update their existing DPIAs."], "t101": ["The purpose of the processing is specified, explicit and legitimate.", "Define a specified, explicit and legitimate purpose and state it in the record entry and the privacy notice.", "Clarify the purpose (too broad or vague) and check its legitimacy in light of the organisation's activities.", "GDPR art. 5.1.b"], "t102": ["The processing relies on one of the legal bases of Article 6(1) (consent, performance of a contract or pre-contractual steps, legal obligation, vital interests, public task or exercise of official authority, legitimate interests), appropriate to its purpose; where legitimate interest is relied on, the balancing against data subjects’ interests and rights is carried out.", "Determine the legal basis appropriate to the purpose (balancing test for legitimate interest) and keep the rationale so it can be demonstrated.", "Review whether the legal basis fits the purpose and complete the balancing test where legitimate interest is relied on.", "GDPR art. 6.1; art. 5.2"], "t103": ["Any reuse of data for another purpose has undergone a compatibility test.", "For each reuse of data for another purpose, carry out and record the compatibility test (link between purposes, context of collection, nature of the data, consequences for individuals, safeguards).", "Carry out the test for unassessed reuses and complete insufficient tests against the Article 6(4) criteria.", "GDPR art. 6.4"], "t201": ["Only data necessary for the purpose is collected (minimisation).", "Review collected data with the business, remove unnecessary fields and apply minimisation from the design stage.", "Remove unnecessary data still collected and justify each mandatory field against the purpose.", "GDPR art. 5.1.c"], "t202": ["If sensitive or criminal-offence data is processed, ensure its processing relies on a valid exception.", "Check the applicable exception (Art. 9(2)) or, for criminal-offence data, the authorised framework (Art. 10), or stop collecting this data.", "Review the exception relied on for each category of sensitive data (Art. 9(2)) and, for criminal-offence data, confirm the processing is authorised by law or carried out under the control of official authority (Art. 10).", "GDPR art. 9, 10"], "t203": ["A retention period is defined and actually enforced (purge or archiving).", "Define the retention period for each data category, then define and implement the related purges in the application.", "Define the missing purges and check that they actually run in the application, including test environments and exports.", "GDPR art. 5.1.e"], "t204": ["Measures ensure data accuracy and updating.", "Set up quality checks at data entry and a process for updating and correcting inaccurate data.", "Complete quality checks and the process for correcting inaccurate data.", "GDPR art. 5.1.d"], "t301": ["Individuals are fully informed, at the time of collection or, if data is obtained indirectly, within one month at the latest.", "Draft and publish the processing’s information notice at each collection point, with a link to the privacy policy.", "Complete the notice (Art. 13 or 14: purposes, legal basis, recipients, retention, rights, complaint to the CNIL…) and its link to the privacy policy; for indirect collection, inform within one month.", "GDPR art. 13, 14; WP260 rev.01 guidelines"], "t302": ["The rights applicable to this processing (access, rectification, erasure, restriction, objection, portability where applicable) can technically be exercised.", "Make the application able to respond to rights requests: extraction of a person's data, rectification, erasure, restriction, objection and structured export for portability where applicable.", "Close the identified technical gaps (erasure, restriction, export for portability…).", "GDPR art. 15-21"], "t303": ["If a fully automated decision produces legal or similarly significant effects, it falls under an Art. 22(2) exception and is accompanied by the Art. 22(3) safeguards (human intervention, expressing one’s view, contesting the decision).", "Check the Art. 22(2) exception; implement human intervention, the possibility to express one’s view and a way to contest the decision (Art. 22(3)).", "Check the Art. 22(2) exception, formalise human intervention and inform individuals of their right to express their view and contest the decision.", "GDPR art. 22.2, 22.3"], "t401": ["The processors involved are identified and bound by an Article 28 contract.", "List the processing’s processors and regularise the contracts with the Article 28(3) clauses.", "Add the missing Art. 28(3) clauses to existing contracts and list the sub-processors.", "GDPR art. 28"], "t402": ["Any transfers outside the EU (including remote access or support) are identified and framed.", "Map transfers (including remote access and support) and frame each one with a Chapter V tool (adequacy decision, SCCs, BCRs…); carry out a TIA for those based on Article 46 safeguards.", "Complete the transfer mapping, frame the transfers not yet covered with a Chapter V tool (adequacy decision, SCCs, BCRs…) and carry out the missing TIAs for transfers based on Article 46 safeguards.", "GDPR chapter V"], "t403": ["Internal and external recipients are identified and limited to need.", "Identify internal and external recipients of the data, check that each needs it for their role and restrict access to what is strictly necessary.", "Complete the list of internal and external recipients, check each one's need to know, remove any excessive access found and update the record entry.", "GDPR art. 5, 30"], "t501": ["Application access rights follow least privilege and are reviewed periodically.", "Define an access profile per role based on least privilege and introduce a periodic access review, at least annually (market practice).", "Introduce the periodic access review, remove unnecessary access and handle leavers and internal moves.", "GDPR art. 32"], "t502": ["Data is encrypted in transit and at rest where the risk warrants it; pseudonymisation is used where relevant.", "Implement encryption of flows and storage containing sensitive or at-risk data, and consider pseudonymisation for suitable uses (testing, statistics).", "Extend encryption to the flows or storage not covered and assess pseudonymisation of test environments.", "GDPR art. 32.1.a"], "t503": ["Data access is logged and logs are reviewed.", "Enable logging of data access (who, when, what action), define its retention period and organise its review to detect abnormal access.", "Organise log review (analysis, alerts), define their retention period and protect them against tampering.", "GDPR art. 32; CNIL logging recommendation"], "t601": ["The processing is in the record with an up-to-date entry.", "Create the processing's record entry with all Art. 30(1) items: purposes, categories of data subjects and data, recipients, transfers, retention periods, security measures.", "Update the record entry on outdated or missing items (retention, recipients, transfers, security measures).", "GDPR art. 30"], "t602": ["The need for a DPIA has been assessed and, if required, the DPIA is completed before go-live.", "Assess whether a DPIA is needed (Art. 35(1), EDPB criteria; presumed for high-risk systems under the AI Act) and carry it out before go-live where required.", "Finalise the DPIA before go-live: risk assessment, measures, residual risks and DPO advice; consult the CNIL if the residual risk remains high.", "GDPR art. 35"], "t603": ["The DPO’s advice was sought for the DPIA.", "Seek the DPO's advice during the DPIA and record it in the DPIA together with the follow-up given (good practice).", "Involve the DPO in the final version of the DPIA (not only informally); track how their recommendations are taken into account (good practice).", "GDPR art. 35.2, 39.1.c; WP243 rev.01 guidelines §4.2; WP248 rev.01 guidelines (III.D.b)"], "t604": ["Default settings are the most protective (privacy by default).", "Review the application's default settings so they are the most protective: data collected, retention period, visibility and sharing limited to what is necessary.", "Complete the review of default settings (data, retention, visibility) on the features not covered.", "GDPR art. 25.2"], "t701": ["The AI system is qualified: role (provider or deployer) and risk level (prohibited, high-risk, transparency, minimal).", "Qualify the system against the AI system definition (Art. 3(1)), the organisation's role (provider or deployer) and the risk level (prohibited practice, high-risk under Annex I or III, transparency, minimal risk).", "Complete the qualification (missing role or risk level) and justify the classification, in particular any Art. 6(3) exemption, which must be documented (Art. 6(4)).", "AI Act art. 3, 5, 6"], "t702": ["If the processing relies on an AI system that interacts with individuals or generates content, individuals are informed and the content is marked or disclosed.", "Qualify the organisation’s role (provider or deployer) and implement the required AI interaction notices and content marking or disclosure.", "Complete notices or marking on uncovered channels and check that information is given at the latest at the first interaction or exposure.", "AI Act art. 50"], "t703": ["Effective human oversight of the system's outputs is organised.", "Appoint and train competent human supervisors, define their power to correct, disregard or stop the system's outputs, and check that no decision producing legal effects is fully automated outside the GDPR Art. 22 exceptions.", "Formalise human oversight (roles, checkpoints, power to stop) and train the supervisors.", "AI Act art. 14, 26; GDPR art. 22"], "t704": ["The vendor contract excludes reuse of data for training (Art. 28(3)(a), where a processor), provides for audit rights (Art. 28(3)(h)) and covers documentation (industry practice).", "Negotiate the AI clauses of the supplier contract: no reuse of data for training (Art. 28(3)(a), if processor), audit right (Art. 28(3)(h)) and access to documentation (market practice).", "Add the missing clauses to the supplier contract (no reuse of data, audit, documentation).", "GDPR art. 28.3.a, 28.3.h; industry practice"], "t705": ["Where a DPIA is required, AI-specific risks (bias, errors, prompt injection, data leakage) are assessed in it (Art. 35(7)) and tested (good practice).", "Assess AI-specific risks in the DPIA (bias, errors, prompt injection, data leakage or memorisation); test them before go-live (good practice).", "Complete the AI risk assessment in the DPIA; complete the tests and record their results (good practice).", "GDPR art. 35.7; CNIL AI recommendations"], "t504": ["The risk of the processing to the rights and freedoms of individuals is assessed (high risk or not) and used to size the security measures.", "Assess the processing's risk level for individuals against the EDPB criteria (sensitive data, large scale, vulnerable people, profiling…) and derive the required security measures.", "Complete the risk assessment against the EDPB criteria and explicitly derive the selected security measures from it.", "GDPR art. 24, 32.1, 35"], "t505": ["Each supporting application implements the security measures required for the processing's risk level (organisation's Security by Design framework where applicable).", "For each supporting application, run a gap analysis against the measures required for this risk level and plan their implementation.", "Implement the remaining measures on the applications concerned, or formalise a risk acceptance.", "GDPR art. 25, 32"]};

const ck=d=>String(d.client||'').trim().toLowerCase();
const normS=x=>String(x||'').trim().toLowerCase();

function baseline(o){const by={};
  S.diags.forEach(d=>{if(d.type!==o.type)return;if(!o.open&&d.status!=='closed')return;if(o.size&&o.size!=='all'&&d.size!==o.size)return;
    if(o.sector&&o.sector!=='all'&&normS(d.sector)!==o.sector)return;if(o.excl&&ck(d)===o.excl)return;if(completion(d)<.5)return;
    const k=ck(d);if(!by[k]||by[k].date<d.date)by[k]=d;});
  const L=Object.keys(by).map(k=>by[k]);const res={n:L.length,demo:L.filter(d=>d.demo).length,g:{},dom:{}};
  ['RGPD','IA'].forEach(r=>{res.g[r]=stat(L.map(d=>score(d,byReg(r)).pct).filter(x=>x!=null));});
  Object.keys(DOMS).forEach(k=>{if(DOMS[k][0]==='AIPD')return;res.dom[k]=stat(L.map(d=>qs(d).some(byDom(k))?score(d,byDom(k)).pct:null).filter(x=>x!=null));});

function dupD(id){const o=S.diags.find(d=>d.id===id);if(!o)return;const d=JSON.parse(JSON.stringify(o));d.id=uid();d.date=Date.now();d.status='open';d.drive={};d.closedAt=null;d.from=o.id;delete d.demo;
  S.diags.push(d);cur=d.id;autoSave();go('quest');toast(t('t.dup'));}
function closeD(id){const d=S.diags.find(x=>x.id===id);if(!d)return;d.status='closed';d.closedAt=Date.now();autoSave();renderAll();
  if(d.demo)return;if(tok)archiveD(id);else toast(t('t.closedNoDrive'));}
function reopenD(id){const d=S.diags.find(x=>x.id===id);if(!d)return;d.status='open';autoSave();renderAll();toast(t('t.reopened'));}
function delD(id){const i=S.diags.findIndex(d=>d.id===id);if(i<0)return;lastDel=S.diags.splice(i,1)[0];if(cur===id)cur=null;autoSave();renderDossiers();
  toast(t('t.deleted'),t('t.undo'),()=>{if(lastDel){S.diags.push(lastDel);lastDel=null;autoSave();renderDossiers();}});}

/* ============ HISTORIQUE ============ */
function renderHist(){const by={};S.diags.forEach(d=>{if(d.demo&&!S.settings.showDemo)return;const k=ck(d);(by[k]=by[k]||[]).push(d);});
  const keys=Object.keys(by).sort();
  if(!keys.length){$('tab-hist').innerHTML=`<div class="empty">${t('a.none')}</div>`;return;}
  const pct=(d,r)=>d.type==='aipd'?null:score(d,byReg(r)).pct;
  const fmt=(v,prev)=>{if(v==null)return '—';let x=v+' %';if(prev!=null){const dl=v-prev;if(dl)x+=` <span class="${dl>0?'delta-up':'delta-dn'}">${dl>0?'▲':'▼'} ${Math.abs(dl)}</span>`;}return x;};
  $('tab-hist').innerHTML=`<h2>${t('h.h')}</h2><p class="small muted">${t('h.p')}</p>`+keys.map(k=>{
    const L=by[k].slice().sort((a,b)=>a.date-b.date),last={};
    const rows=L.map(d=>{const r=pct(d,'RGPD'),i=pct(d,'IA'),pv=last[d.type]||{};last[d.type]={r:r,i:i};
      return `<tr><td class="mono">${fdate(d.date)}</td><td><span class="badge ${TBADGE[d.type]}">${typeL(d.type)}</span></td><td>${d.type==='aipd'?esc(aipdQual(d).verdict):fmt(r,pv.r)}</td><td>${d.type==='aipd'?'':fmt(i,pv.i)}</td><td class="w small">${esc(d.scope||'')}</td><td><button class="btn sm" onclick="openD('${d.id}')">${t('a.open')}</button></td></tr>`;}).join('');
    return `<div class="card"><h3>${esc(L[0].client)}</h3><div class="tw"><table class="hist"><thead><tr><th>${t('h.date')}</th><th>${t('h.type')}</th><th>${regL('RGPD')}</th><th>${regL('IA')}</th><th>${t('h.scope')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}).join('');}

function renderQuest(){const d=getD();if(!d){$('tab-quest').innerHTML=noDossier();return;}
  const all=qs(d),show=all.filter(q=>qFilter==='all'||(qFilter==='todo'?!(d.answers[q[0]]&&d.answers[q[0]].i!=null):DOMS[q[1]][0]===qFilter));

  ${d.type==='fin'||d.type==='trt'?docsCard(d):''}${d.type==='trt'?appCard(d):''}${aiCard(d)}

  ${d.type==='aipd'?'':`<p class="small muted">${t('q.bpNote')}</p>`}<div class="pills">${pills.map(p=>`<button class="pill ${qFilter===p[0]?'on':''}" onclick="qFilter='${p[0]}';renderQuest()">${t(p[1])}</button>`).join('')}</div>`;
  const glSeen={};let last='';show.forEach(q=>{if(q[1]!==last){last=q[1];const r=DOMS[last][0];
    html+=`<div class="dom"><h3><span class="badge ${r==='IA'?'b-ia':r==='AIPD'?'b-aipd':'b-rgpd'}">${regL(r)}</span>${esc(domN(last))}</h3>${d.type==='aipd'?'':`<button class="btn sm ghost" onclick="domNA('${last}')">${t('q.domNA')}</button>`}</div>`;}
    const a=d.answers[q[0]]||{};
    html+=`<div class="card q ${a.i!=null?'done':''}" id="q-${q[0]}" style="margin-top:8px"><p>${glossify(esc(qText(q)),glSeen)}</p><span class="mono muted">${refShow(q)}${q[3]===3&&d.type!=='aipd'?t('q.crit'):''}</span> ${bpTag(q)}
    <div class="opts">${OPTS[d.type].map((o,i)=>`<button class="opt ${a.i===i?'sel '+o[2]:''}" data-c="${o[2]}" onclick="setAns('${q[0]}',${i})">${t(o[0])}</button>`).join('')}</div>
    <button class="link" onclick="this.nextElementSibling.classList.toggle('open')">${a.n?t('q.noteE'):t('q.note')}</button>
    <textarea class="note-t ${a.n?'open':''}" placeholder="${esc(t('q.notePh'))}" oninput="setNote('${q[0]}',this.value)">${esc(a.n||'')}</textarea>
    ${GATE[q[0]]?`<div class="poc gate-w" id="gw-${q[0]}" style="margin-top:8px;${a.i===0?'':'display:none'}">${t('ai.gateW')}</div>`:''}

  $('tab-quest').innerHTML=html;updProg();}
function updProg(){const d=getD();if(!d||!$('pg'))return;const s=score(d,()=>true);$('pg').style.width=(s.tot?s.ans/s.tot*100:0)+'%';$('pg-t').textContent=t('q.prog',{a:s.ans,t:s.tot});}
