, "RGPD art. 24.1, 39.1.b ; pratique de place"], ["f4", "R1", "G", 2, "En cas de responsabilité conjointe ou de sous-traitance intra-groupe, les obligations respectives sont définies par accord ou contrat ; un réseau de relais couvre les filiales / métiers (pratique de place).", "RGPD art. 26, 28.3 ; pratique de place", "Conclure les accords de responsabilité conjointe (art. 26) ou contrats de sous-traitance (art. 28.3) intra-groupe ; structurer un réseau de relais (pratique de place).", "Conclure les accords (art. 26) ou contrats (art. 28.3) manquants ; combler les trous du réseau de relais (pratique de place).", "RGPD art. 26.1, 28.3 ; pratique de place", "RGPD art. 26.1, 28.3 ; pratique de place"], ["f5", "R2", "PMG", 3, "Le registre des activités de traitement existe, est complet et tenu à jour ; une revue au moins annuelle est recommandée (pratique de place).", "RGPD art. 30", "Constituer le registre des traitements via des ateliers avec les parties prenantes et instaurer une revue annuelle (pratique de place).", "Compléter le registre des traitements via des ateliers avec les parties prenantes concernées, mettre à jour les fiches obsolètes et instaurer une revue annuelle (pratique de place).", "RGPD art. 30.1, 30.3 ; pratique de place", "RGPD art. 30.1 ; pratique de place"], ["f6", "R3", "PMG", 3, "Chaque traitement repose sur une base légale de l’article 6.1 et a une durée de conservation définie et appliquée (purge).", "RGPD art. 5.1.e, 5.2 ; art. 6.1", "Établir le référentiel des bases légales et des durées de conservation ; définir et mettre en place les purges associées.", "Compléter le référentiel des bases légales et des durées de conservation ; définir les purges manquantes et vérifier qu’elles sont réellement exécutées.", "RGPD art. 6.1, 5.1.e", "RGPD art. 6.1, 5.1.e, 5.2"], ["f7", "R4", "PMG", 2, "Les personnes sont informées à chaque point de collecte par une mention d’information qui renvoie, le cas échéant, à la politique de confidentialité (information par niveaux).", "RGPD art. 12-14 ; lignes directrices WP260 rév.01", "Auditer les points de collecte et implémenter les mentions d’information, avec un renvoi vers la politique de confidentialité.", "Corriger les points de collecte non couverts ou incomplets, harmoniser les mentions existantes et leur renvoi vers la politique de confidentialité.", "RGPD art. 12.1, 13, 14 ; lignes directrices WP260 rév.01", "RGPD art. 13, 14 ; lignes directrices WP260 rév.01"], ["f8", "R4", "PMG", 3, "Une procédure permet de traiter les demandes de droits dans le délai d’un mois (prolongeable de deux mois) ; un registre des demandes en assure la traçabilité (pratique de place).", "RGPD art. 12, 15-22", "Formaliser et mettre en place la procédure de gestion des demandes d’exercice des droits et le suivi du délai associé ; mettre en place un point d’entrée unique et un registre des demandes (pratique de place).", "Compléter la procédure de gestion des demandes d’exercice des droits (vérification d’identité en cas de doute raisonnable, suivi du délai associé) et la mettre effectivement en œuvre ; compléter le point d’entrée unique et le registre des demandes (pratique de place).", "RGPD art. 12.3 ; pratique de place", "RGPD art. 12.3, 12.6 ; pratique de place"], ["f9", "R4", "PMG", 2, "Les cookies et traceurs du site / des apps respectent le consentement (refus aussi simple que l'acceptation).", "LIL art. 82 ; lignes directrices et recommandation CNIL cookies", "Auditer les cookies et traceurs déposés sur les sites et applications, puis paramétrer une CMP conforme : consentement préalable pour les traceurs non exemptés, refus aussi simple que l'acceptation, conservation de la preuve et durée de validité du choix de 6 mois recommandée par la CNIL.", "Corriger les écarts de la CMP (refus aussi simple, traceurs déposés avant consentement) et la réauditer ; aligner la durée de conservation du choix sur la recommandation CNIL (6 mois).", "LIL art. 82 ; lignes directrices et recommandation CNIL cookies", "LIL art. 82 ; lignes directrices et recommandation CNIL cookies"], ["f10", "R5", "PMG", 3, "Les sous-traitants sont recensés et leurs contrats contiennent les clauses de l'article 28.", "RGPD art. 28", "Inventorier les sous-traitants (prestataires qui traitent des données personnelles pour le compte de l'organisation), vérifier leurs garanties et régulariser les contrats avec les clauses de l'article 28.3 (instructions, confidentialité, sécurité, sous-traitance ultérieure, assistance, sort des données, audit).", "Compléter l’inventaire des sous-traitants et régulariser en priorité les contrats sans les clauses de l’article 28.", "RGPD art. 28.1, 28.3", "RGPD art. 28.3"], ["f11", "R5", "PMG", 2, "Les transferts hors UE sont identifiés et encadrés (décision d’adéquation, ou garanties appropriées telles que les CCT avec analyse d’impact du transfert).", "RGPD art. 44-49 ; recommandations CEPD 01/2020", "Cartographier les transferts et encadrer chacun par un outil du chapitre V (décision d’adéquation, CCT, BCR…) ; réaliser une TIA pour ceux fondés sur les garanties de l’article 46.", "Compléter la cartographie des transferts, encadrer ceux qui ne le sont pas par un outil du chapitre V (décision d’adéquation, CCT, BCR…) et réaliser les TIA manquantes pour les transferts fondés sur les garanties de l’article 46.", "RGPD art. 30.1.e, 44-49 ; recommandations CEPD 01/2020", "RGPD art. 44-49 ; recommandations CEPD 01/2020"], ["f12", "R6", "PMG", 3, "Des mesures de sécurité proportionnées aux risques sont en place (habilitations, chiffrement, sauvegardes, journalisation…).", "RGPD art. 32", "Réaliser une analyse de risques et implémenter un plan de sécurisation adéquat au regard du risque : gestion des habilitations, chiffrement, sauvegardes testées, journalisation des accès, gestion des correctifs.", "Compléter l’analyse de risques et mettre en œuvre les mesures manquantes du plan de sécurisation, de manière adéquate au regard du risque.", "RGPD art. 32.1, 32.2 ; guide sécurité CNIL", "RGPD art. 32.1, 32.2 ; guide sécurité CNIL"], ["f13", "R7", "PMG", 3, "Une procédure de gestion des violations permet de notifier la CNIL dans les 72 heures lorsque la violation présente un risque, et un registre de toutes les violations est tenu.", "RGPD art. 33-34 ; guide ANSSI exercice de crise cyber", "Rédiger et implémenter une procédure de gestion des violations et le registre associé ; les tester par un exercice de crise (bonne pratique).", "Compléter la procédure de gestion des violations (critères, circuit de décision, modèles) et tenir le registre associé ; les tester par un exercice de crise (bonne pratique).", "RGPD art. 33.1, 33.5, 34 ; guide ANSSI exercice de crise cyber", "RGPD art. 33.1, 33.5 ; guide ANSSI exercice de crise cyber"], ["f14", "R8", "PMG", 3, "Les traitements à risque élevé font l'objet d'une AIPD.", "RGPD art. 35", "Recenser les traitements susceptibles d'engendrer un risque élevé (liste CNIL des traitements soumis à AIPD, critères du CEPD) et réaliser une AIPD pour chacun avant sa mise en œuvre.", "Réaliser les AIPD manquantes pour les traitements à risque élevé non couverts et réexaminer celles qui sont obsolètes (évolution du traitement ou du risque).", "RGPD art. 35.1, 35.3, 35.4 ; lignes directrices WP248 rév.01", "RGPD art. 35.1, 35.11"], ["f15", "R8", "PMG", 2, "La protection des données est intégrée dès la conception des projets (privacy by design).", "RGPD art. 25", "Insérer un jalon privacy dans la méthodologie projet et les achats, intégrant notamment la minimisation des données dès la conception.", "Rendre le jalon privacy obligatoire dans la méthodologie projet et les achats, y intégrer la minimisation des données dès la conception et vérifier son application.", "RGPD art. 25.1, 5.1.c", "RGPD art. 25.1, 5.1.c"], ["f16", "A1", "PMG", 3, "Un inventaire des systèmes et cas d'usage d'IA existe (IA achetée, développée, embarquée, IA générative, shadow AI).", "Pratique de place ; AI Act art. 3, 6", "Recenser tous les systèmes d'IA utilisés ou développés (IA achetée, développée en interne, embarquée dans des logiciels, IA générative, shadow AI) et leurs cas d'usage IA, puis créer un registre IA (un enregistrement par système et par cas d'usage IA) précisant le responsable, la finalité, les données traitées et le rôle de l'organisation.", "Compléter l'inventaire avec les catégories non couvertes (IA embarquée dans les logiciels, shadow AI, IA générative) et instaurer sa mise à jour continue via les achats et les projets.", "Pratique de place ; AI Act art. 3.1, 6", "Pratique de place ; AI Act art. 3.1, 6"], ["f17", "A1", "PMG", 2, "Un responsable et une instance de gouvernance de l'IA sont identifiés (avec DPO, RSSI, juridique, métiers).", "Bonne pratique ; ISO/IEC 42001", "Nommer un pilote IA chargé de la conformité et installer un comité de gouvernance IA réunissant DPO, RSSI, juridique et métiers, avec un mandat et une fréquence de réunion définis.", "Formaliser le mandat du pilote IA et la charte du comité, et assurer la présence de toutes les fonctions clés.", "Bonne pratique ; ISO/IEC 42001", "Bonne pratique ; ISO/IEC 42001"], ["f18", "A1", "G", 2, "Un système de management de l'IA (type ISO/IEC 42001) est en place ou en projet.", "ISO/IEC 42001", "Cadrer un SMIA (périmètre, politique IA, rôles, processus d'évaluation des risques) et l'articuler avec le SMSI et le SMQ existants pour mutualiser les processus communs (audit interne, revue de direction, gestion documentaire).", "Structurer le projet de SMIA : définir son périmètre, sa feuille de route et ses responsables, et l'articuler avec le SMSI et le SMQ.", "ISO/IEC 42001", "ISO/IEC 42001"], ["f19", "A2", "PMG", 3, "Pour chaque système, le rôle de l'entreprise est qualifié (fournisseur, déployeur, importateur, distributeur).", "AI Act art. 3, 25", "Pour chaque système d'IA, qualifier le rôle de l'organisation (fournisseur, déployeur, importateur, distributeur) au regard des définitions de l'article 3, vérifier les cas de requalification en fournisseur (art. 25) et consigner la justification (pratique de place).", "Qualifier le rôle des systèmes non encore analysés, vérifier les cas de requalification en fournisseur (art. 25) et consigner la justification (pratique de place).", "AI Act art. 3.3-3.7, 25 ; pratique de place", "AI Act art. 3.3-3.7, 25 ; pratique de place"], ["f20", "A2", "PMG", 3, "Les systèmes sont classés par niveau de risque (interdit, haut risque, transparence, minimal).", "AI Act art. 5, 6, 50 ; annexes I et III", "Appliquer une grille de classification à chaque système (pratique interdite, haut risque au titre des annexes I ou III, obligation de transparence, risque minimal) et documenter toute exemption fondée sur l'article 6.3 avant la mise sur le marché ou la mise en service.", "Classer les systèmes non encore évalués selon la même grille et documenter les exemptions de l'article 6.3 qui ne l'ont pas été.", "AI Act art. 6, 6.4 ; annexes I et III", "AI Act art. 6.3, 6.4"], ["f21", "A2", "PMG", 3, "L'absence de pratiques interdites a été vérifiée (notation sociale, manipulation, reconnaissance des émotions au travail…).", "AI Act art. 5 — applicable depuis le 2 fév. 2025", "Passer chaque cas d'usage IA au crible des pratiques interdites de l'article 5 (manipulation, exploitation des vulnérabilités, notation sociale, reconnaissance des émotions au travail ou à l'école, catégorisation biométrique sensible…) et arrêter immédiatement les usages prohibés.", "Étendre l'analyse de l'article 5 aux cas d'usage IA non encore examinés, arrêter les usages prohibés identifiés et consigner les conclusions (pratique de place).", "AI Act art. 5", "AI Act art. 5 ; pratique de place"], ["f22", "A3", "PMG", 2, "Un programme de maîtrise de l'IA (AI literacy) forme les collaborateurs selon leur rôle.", "AI Act art. 4 (portée revue par le règl. 2026/1744 — à vérifier)", "Déployer un parcours de formation IA adapté à chaque population (utilisateurs, superviseurs, développeurs, décideurs), tenant compte de leurs connaissances et du contexte d'utilisation des systèmes.", "Étendre la formation IA aux populations non couvertes et l'adapter aux rôles (utilisateurs, superviseurs, décideurs).", "AI Act art. 4 (portée revue par le règl. 2026/1744 — à vérifier)", "AI Act art. 4 (portée revue par le règl. 2026/1744 — à vérifier)"], ["f23", "A3", "PMG", 3, "Une charte / politique encadre l'usage de l'IA générative (données confidentielles, outils autorisés, vérification).", "Bonne pratique ; RGPD art. 32 ; recommandations ANSSI IA générative", "Rédiger et diffuser une charte d'usage de l'IA générative (outils autorisés, données interdites à la saisie, vérification humaine des contenus produits) et publier la liste des outils approuvés.", "Compléter la charte (outils autorisés, données interdites, vérification humaine) et la faire accepter par tous.", "Bonne pratique ; recommandations ANSSI IA générative", "Bonne pratique ; recommandations ANSSI IA générative"], ["f24", "A4", "PMG", 3, "Si l’organisation fournit un système d’IA destiné à interagir directement avec des personnes physiques ou générant des contenus de synthèse, les personnes sont informées qu’elles interagissent avec une IA (art. 50.1) et les contenus sont marqués (art. 50.2) ; si elle déploie un système de reconnaissance des émotions ou de catégorisation biométrique, ou génère des deepfakes ou des textes publiés sur des sujets d’intérêt public, les personnes exposées sont informées et ces contenus signalés (art. 50.3, 50.4).", "AI Act art. 50 — applicable depuis le 2 août 2026", "Recenser les systèmes concernés, qualifier le rôle de l’organisation (fournisseur ou déployeur) pour chacun et mettre en place les mentions et le marquage requis.", "Couvrir les systèmes restants et vérifier que l’information est claire et donnée au plus tard lors de la première interaction ou exposition.", "AI Act art. 50.1, 50.2, 50.3, 50.4", "AI Act art. 50.5"], ["f25", "A5", "MG", 3, "Pour les systèmes à haut risque déployés : contrôle humain, conservation des logs, information des personnes, FRIA si requise.", "AI Act art. 26, 27 — 2 déc. 2027 (annexe III)", "Construire le plan de mise en conformité déployeur pour vos systèmes à haut risque d'ici fin 2027 : contrôle humain par des personnes compétentes, conservation des journaux au moins six mois, information des personnes concernées et des salariés, FRIA lorsqu'elle est requise.", "Compléter d’ici fin 2027 le plan de mise en conformité déployeur pour vos systèmes à haut risque : contrôle humain, journaux, information des personnes et FRIA lorsqu’elle est requise.", "AI Act art. 26.2, 26.6, 26.7, 26.11, 27", "AI Act art. 26.2, 26.6, 26.11, 27"], ["f26", "A6", "PMG", 2, "Si l'entreprise développe ou met sur le marché des systèmes à haut risque : les exigences fournisseur sont anticipées (sinon N/A).", "AI Act art. 9-17, 43 — 2 déc. 2027 / 2 août 2028", "Réaliser un gap analysis au regard des exigences fournisseur (gestion des risques, gouvernance des données, documentation technique, journalisation, transparence, contrôle humain, robustesse, système de management de la qualité) et planifier l'évaluation de conformité avant la mise sur le marché.", "Compléter le gap analysis sur les exigences non encore analysées et planifier leur mise en œuvre ainsi que l'évaluation de conformité.", "AI Act art. 9-17, 43", "AI Act art. 9-17, 43"], ["f27", "A7", "PMG", 2, "Les contrats avec les fournisseurs d’IA intègrent les clauses requises (RGPD art. 28 si sous-traitant ; AI Act art. 25.4 pour les composants de systèmes à haut risque) ; documentation, propriété intellectuelle et réutilisation des données sont traitées (pratique de place).", "RGPD art. 28 ; AI Act art. 25.4 ; pratique de place", "Définir des clauses IA types pour les achats (clauses de l'article 28 si le fournisseur est sous-traitant ; informations et assistance de l'art. 25.4 pour les composants de systèmes à haut risque ; documentation, propriété intellectuelle et non-réutilisation des données en pratique de place) et renégocier en priorité les contrats des systèmes les plus critiques.", "Intégrer les clauses IA types aux contrats existants qui ne les contiennent pas et les rendre obligatoires pour tout nouvel achat d'IA.", "RGPD art. 28.3 ; AI Act art. 25.4 ; pratique de place", "RGPD art. 28.3 ; AI Act art. 25.4 ; pratique de place"], ["f28", "A7", "PMG", 3, "L'articulation RGPD / IA est assurée : base légale des données d'entraînement, AIPD lorsque le traitement présente un risque élevé (présumé pour les systèmes à haut risque au sens de l’AI Act), décision automatisée.", "RGPD art. 6, 22, 35 ; AI Act art. 26.9 ; recommandations CNIL IA", "Pour chaque SIA traitant des données personnelles : déterminer la base légale des données d’entraînement (souvent l’intérêt légitime, avec mise en balance) et informer les personnes ; évaluer la nécessité d’une AIPD (art. 35.1 ; présumée pour les systèmes à haut risque au sens de l’AI Act) et la réaliser avec un volet IA si elle est requise ; identifier les décisions entièrement automatisées et les encadrer (art. 22).", "Compléter les éléments manquants : base légale et information pour les jeux d’entraînement restants, AIPD avec volet IA pour les traitements à risque élevé, encadrement des décisions automatisées (art. 22).", "RGPD art. 6.1, 14, 22, 35.1 ; AI Act art. 26.9 ; recommandations CNIL IA", "RGPD art. 6.1, 22, 35.1 ; recommandations CNIL IA"]];
const FIN=[["r101", "R1", "PMG", 3, "DPO désigné lorsque requis, coordonnées publiées et communiquées à la CNIL.", "art. 37", "Désigner un DPO lorsqu’il est obligatoire (art. 37.1), publier ses coordonnées et les communiquer à la CNIL (art. 37.7).", "Publier les coordonnées du DPO (site internet, mentions d'information) et vérifier qu'elles ont été communiquées à la CNIL et sont à jour.", "art. 37.1, 37.7", "art. 37.7"], ["r102", "R1", "PMG", 2, "Le DPO est associé en amont, indépendant, sans conflit d'intérêts, avec des ressources suffisantes.", "art. 38 ; guide CNIL du DPO (fiches 4-5)", "Doter le DPO des ressources nécessaires (temps, budget, accès aux données et aux traitements, formation ; art. 38.2), garantir son indépendance et son association en amont des projets ; formaliser sa lettre de mission (bonne pratique).", "Renforcer l'indépendance du DPO (aucune instruction sur ses missions, rapport au plus haut niveau, absence de conflit d'intérêts) et ses moyens, et l'associer systématiquement en amont des projets.", "art. 38.1, 38.2, 38.3 ; guide CNIL du DPO (fiches 4-5)", "art. 38.1, 38.2, 38.3, 38.6"], ["r103", "R1", "PMG", 2, "Une politique de protection des données est mise en œuvre lorsque c’est proportionné (art. 24.2) ; validée par la direction et diffusée (pratique de place).", "art. 24.2", "Rédiger une politique de protection des données lorsque c'est proportionné aux traitements (principes, rôles, processus clés : registre, droits, violations, AIPD, sous-traitants) ; la faire valider par la direction et la diffuser (pratique de place).", "Mettre à jour la politique (processus manquants, évolutions réglementaires) ; la faire valider par la direction et la diffuser à tous (pratique de place).", "art. 24.2 ; pratique de place", "art. 24.2 ; pratique de place"], ["r104", "R1", "PMG", 2, "Rôles et responsabilités (métiers, IT, relais) sont définis.", "Pratique de place ; art. 24", "Établir une matrice des responsabilités protection des données (direction, métiers, IT, RSSI, DPO, relais) pour les processus clés : registre, droits, violations, AIPD, sous-traitants.", "Compléter la matrice des responsabilités pour les rôles et processus non couverts et la faire connaître aux personnes concernées.", "Pratique de place ; art. 24.1", "Pratique de place ; art. 24.1"], ["r105", "R1", "MG", 2, "Le DPO fait directement rapport au plus haut niveau de la direction (art. 38.3) ; un bilan annuel avec indicateurs est présenté (bonne pratique).", "art. 38.3 ; lignes directrices WP243 rév.01 §3.3 ; bonne pratique", "Organiser le reporting direct du DPO à la direction ; mettre en place un rapport annuel et des KPI (bonne pratique).", "Rendre le reporting du DPO à la direction effectif ; formaliser le bilan annuel et compléter les indicateurs (bonne pratique).", "art. 38.3 ; lignes directrices WP243 rév.01 §3.3", "art. 38.3 ; lignes directrices WP243 rév.01 §3.3"], ["r106", "R1", "MG", 2, "Un plan de contrôle / d'audit de conformité est exécuté.", "art. 24.1, 39.1.b", "Définir un plan de contrôle de la conformité, idéalement pluriannuel (pratique de place), précisant les périmètres, la fréquence, les responsables et le suivi des actions correctives.", "Exécuter le plan de contrôle selon la fréquence prévue, consigner les résultats et suivre les actions correctives jusqu'à leur clôture.", "art. 24.1, 39.1.b ; pratique de place", "art. 24.1, 39.1.b"], ["r107", "R1", "G", 2, "Le rôle de chaque entité du groupe est qualifié (responsable, responsable conjoint, sous-traitant) et un accord définit les obligations des responsables conjoints ; un relais existe par filiale (pratique de place).", "art. 26, 28.3 ; pratique de place", "Conclure les accords intra-groupe requis (art. 26, 28.3) ; structurer le réseau de relais (pratique de place).", "Conclure les accords de responsabilité conjointe ou contrats de sous-traitance intra-groupe manquants ; compléter le réseau de relais par filiale (pratique de place).", "art. 26.1, 28.3 ; pratique de place", "art. 26.1, 28.3 ; pratique de place"], ["r108", "R1", "PMG", 2, "Un programme de sensibilisation et de formation du personnel participant aux traitements est déployé.", "art. 39.1.b", "Déployer un plan de sensibilisation et de formation adapté aux populations qui participent aux traitements (ensemble des salariés, managers, RH, marketing, IT) ; suivre les taux de complétion (pratique de place).", "Étendre la formation aux populations non couvertes et l'actualiser ; tracer la complétion (pratique de place).", "art. 39.1.b ; pratique de place", "art. 39.1.b ; pratique de place"], ["r201", "R2", "PMG", 3, "Registre du responsable de traitement complet (coordonnées du responsable et du DPO, finalités, catégories de personnes et de données, destinataires, transferts, délais d’effacement, mesures de sécurité).", "art. 30.1", "Constituer le registre des activités de traitement avec toutes les mentions de l'art. 30.1 : coordonnées du responsable et du DPO, finalités, catégories de personnes et de données, destinataires, transferts hors UE, délais d'effacement, description des mesures de sécurité.", "Compléter les mentions manquantes du registre pour chaque activité de traitement, notamment destinataires, transferts, délais d'effacement et mesures de sécurité.", "art. 30.1", "art. 30.1.d, 30.1.e, 30.1.f, 30.1.g"], ["r202", "R2", "PMG", 2, "Registre du sous-traitant tenu pour les activités réalisées pour le compte de clients.", "art. 30.2", "Si l'organisation agit comme sous-traitant pour des clients, créer le registre sous-traitant : nom et coordonnées de chaque client, catégories de traitements effectués pour son compte, transferts hors UE, description des mesures de sécurité.", "Compléter le registre sous-traitant pour toutes les activités menées pour le compte de clients et pour les mentions manquantes de l'article 30.2.", "art. 30.2", "art. 30.2"], ["r203", "R2", "PMG", 2, "Le registre est tenu à jour (art. 30) ; un déclencheur projet et une revue périodique le garantissent (pratique de place).", "art. 30 ; pratique de place", "Mettre à jour le registre ; instaurer un déclencheur projet (toute création ou modification de traitement) et une revue annuelle avec les métiers (pratique de place).", "Mettre à jour les fiches obsolètes ; rendre le déclencheur projet obligatoire et tracer la revue annuelle (pratique de place).", "art. 30.1 ; pratique de place", "art. 30.1 ; pratique de place"], ["r204", "R2", "MG", 2, "La cartographie des applications et des flux de données est reliée au registre.", "Pratique de place ; art. 30, 32", "Relier le registre à la cartographie SI ou à la CMDB : rattacher à chaque traitement les applications, bases de données et flux qui le supportent (pratique de place).", "Rattacher au registre les applications et flux de données qui ne le sont pas encore.", "Pratique de place ; art. 30.1", "Pratique de place ; art. 30.1"], ["r205", "R2", "PMG", 3, "Les données sensibles et relatives aux infractions sont identifiées avec leur exception applicable.", "art. 9, 10", "Recenser les données sensibles et d’infractions, et vérifier pour chacune l’exception de l’art. 9.2 ou le cadre autorisé par l’art. 10.", "Compléter le recensement des données sensibles et d’infractions, et vérifier l’exception (art. 9.2) ou le cadre autorisé (art. 10) pour celles qui n’en ont pas.", "art. 9.2, 10", "art. 9.2, 10"], ["r301", "R3", "PMG", 3, "Chaque finalité de traitement repose sur l’une des bases légales de l’article 6.1 (consentement, exécution d’un contrat ou de mesures précontractuelles, obligation légale, sauvegarde des intérêts vitaux, mission d’intérêt public ou relevant de l’autorité publique, intérêts légitimes).", "art. 6.1 ; art. 5.2", "Déterminer la base légale de chaque finalité et la consigner (registre, fiche de traitement) pour pouvoir la démontrer.", "Déterminer les bases légales manquantes, corriger celles qui sont inadaptées et les consigner pour pouvoir les démontrer.", "art. 6.1, 5.2", "art. 6.1, 5.2"], ["r302", "R3", "PMG", 2, "Le consentement, lorsqu’il est la base légale, est libre, spécifique, éclairé et univoque, démontrable et aussi simple à retirer qu’à donner.", "art. 4.11, 7", "Revoir les parcours de consentement pour qu'il soit libre, spécifique, éclairé et univoque (case non pré-cochée, finalités distinctes), aussi simple à retirer qu'à donner, et conserver la preuve du consentement (date, version de l'information, choix exprimé).", "Corriger les parcours de consentement non conformes (cases pré-cochées, consentement groupé, retrait difficile) et mettre en place la conservation de la preuve.", "art. 4.11, 7.1, 7.3", "art. 4.11, 7.1, 7.3"], ["r303", "R3", "PMG", 2, "Lorsque l’intérêt légitime est retenu, la mise en balance avec les intérêts et droits des personnes est réalisée et peut être démontrée.", "art. 6.1.f ; art. 5.2", "Pour chaque traitement fondé sur l'intérêt légitime, réaliser et consigner un test de mise en balance : intérêt poursuivi, nécessité du traitement, impact sur les personnes et leurs attentes raisonnables, garanties mises en place.", "Réaliser les tests de mise en balance manquants et revoir ceux qui sont insuffisants ; si la mise en balance est défavorable, revoir le traitement.", "art. 6.1.f, 5.2", "art. 6.1.f"], ["r304", "R3", "PMG", 2, "Seules les données nécessaires sont collectées (minimisation).", "art. 5.1.c", "Revoir avec les métiers les données collectées (formulaires, champs obligatoires, imports), supprimer celles qui ne sont pas nécessaires à la finalité et ne rendre obligatoires que les champs indispensables.", "Supprimer les données non nécessaires encore collectées et justifier chaque champ obligatoire restant.", "art. 5.1.c, 25.2", "art. 5.1.c, 25.2"], ["r305", "R3", "PMG", 3, "Les durées de conservation sont définies et la purge / l'archivage sont effectifs dans les systèmes.", "art. 5.1.e", "Établir le référentiel des durées de conservation par catégorie de données ; définir et mettre en place les purges associées.", "Compléter le référentiel des durées de conservation ; définir les purges manquantes et vérifier qu’elles sont réellement exécutées dans tous les systèmes.", "art. 5.1.e, 30.1.f", "art. 5.1.e"], ["r306", "R3", "MG", 1, "Les réutilisations de données font l'objet d'un test de compatibilité des finalités.", "art. 6.4", "Instaurer un test de compatibilité pour toute réutilisation de données (lien entre les finalités, contexte de collecte, nature des données, conséquences pour les personnes, garanties) ; à défaut de compatibilité, le nouveau traitement doit reposer sur sa propre base légale.", "Appliquer le test de compatibilité aux réutilisations existantes non évaluées et le rendre systématique pour les nouvelles.", "art. 6.4", "art. 6.4"], ["r401", "R4", "PMG", 3, "Les mentions d'information sont complètes à chaque point de collecte (directe et indirecte).", "art. 13, 14", "Rédiger et publier les mentions d'information à chaque point de collecte (formulaires, sites, applications, contrats, accueil téléphonique) avec les informations des articles 13 et 14 ; pour la collecte indirecte, informer les personnes dans un délai d'un mois.", "Compléter les mentions incomplètes, couvrir les collectes indirectes (information dans le délai d’un mois) et harmoniser le renvoi vers la politique de confidentialité.", "art. 12.1, 13, 14, 14.3", "art. 13, 14.3 ; lignes directrices WP260 rév.01"], ["r402", "R4", "PMG", 2, "Les salariés et candidats sont informés des traitements RH.", "art. 13 ; Code du travail L1221-9, L1222-4", "Diffuser une notice d'information RH aux salariés et aux candidats couvrant les traitements RH (paie, gestion de carrière, recrutement, outils de contrôle de l'activité) ; informer les salariés avant la mise en place de tout dispositif de contrôle.", "Compléter l'information RH pour les publics ou traitements non couverts (candidats, outils de surveillance, nouveaux traitements).", "art. 13 ; Code du travail L1221-9, L1222-4", "art. 13 ; Code du travail L1221-9, L1222-4"], ["r403", "R4", "PMG", 3, "La procédure de gestion des demandes d’exercice des droits est opérationnelle : canal, vérification d’identité en cas de doute raisonnable, délai d’un mois ; registre des demandes (pratique de place).", "art. 12, 15-22 ; pratique de place", "Formaliser et mettre en place la procédure de gestion des demandes d’exercice des droits et le suivi du délai associé ; mettre en place un point d’entrée unique et un registre des demandes (pratique de place).", "Compléter la procédure de gestion des demandes d’exercice des droits (vérification d’identité en cas de doute raisonnable, suivi du délai associé) et la mettre effectivement en œuvre ; compléter le point d’entrée unique et le registre des demandes (pratique de place).", "RGPD art. 12.3 ; pratique de place", "RGPD art. 12.3, 12.6 ; pratique de place"], ["r404", "R4", "PMG", 2, "Les systèmes permettent techniquement l'accès, l'effacement, la limitation et la portabilité.", "art. 15-20", "Vérifier pour chaque application la capacité technique à répondre aux droits (extraction des données d'une personne, effacement, limitation, export dans un format structuré pour la portabilité) et planifier les évolutions nécessaires.", "Combler les limites techniques identifiées (effacement, limitation, export) sur les applications concernées.", "art. 15-20, 25.1", "art. 15-20"], ["r405", "R4", "PMG", 2, "Cookies et traceurs : consentement préalable, refus aussi simple, preuve, durée de 6 mois recommandée.", "LIL art. 82 ; lignes directrices et recommandation CNIL cookies", "Auditer les cookies et traceurs déposés, puis reconfigurer la CMP : consentement préalable pour les traceurs non exemptés, refus aussi simple que l'acceptation, conservation de la preuve, durée de validité du choix de 6 mois recommandée par la CNIL.", "Corriger les écarts de la CMP (refus aussi simple que l'acceptation, traceurs déposés avant consentement, durée de validité du choix) et vérifier la conservation de la preuve du consentement.", "LIL art. 82 ; lignes directrices et recommandation CNIL cookies", "LIL art. 82 ; RGPD art. 7.1 ; lignes directrices et recommandation CNIL cookies"], ["r406", "R4", "PMG", 2, "La prospection commerciale respecte opt-in / opt-out et les listes d'opposition.", "CPCE L34-5 ; art. 21", "Revoir les règles de prospection : consentement préalable (opt-in) pour la prospection électronique des particuliers, sauf pour des produits ou services analogues proposés à des clients ; droit d'opposition (opt-out) dans chaque message ; prise en compte des oppositions et de la liste Bloctel pour le démarchage téléphonique.", "Corriger les campagnes non conformes et fiabiliser la gestion des oppositions (prise en compte rapide, synchronisation entre outils, listes repoussoirs).", "CPCE L34-5 ; Code de la consommation L223-1 ; art. 21.2, 21.3", "CPCE L34-5 ; art. 21.3"], ["r501", "R5", "PMG", 3, "Un inventaire des sous-traitants et sous-traitants ultérieurs est tenu.", "art. 28", "Inventorier les sous-traitants et les sous-traitants ultérieurs (prestation, données traitées, localisation, contrat) et maintenir l'inventaire à jour à chaque nouvel achat.", "Compléter l'inventaire, notamment avec les sous-traitants ultérieurs autorisés et leur localisation.", "art. 28.2, 30.1.d", "art. 28.2, 28.4"], ["r502", "R5", "PMG", 3, "Les contrats comportent l'ensemble des clauses obligatoires de l'article 28.3.", "art. 28.3", "Régulariser les contrats avec les clauses de l'article 28.3 : objet, durée, nature et finalité, instructions documentées, confidentialité, sécurité, sous-traitance ultérieure, assistance (droits, violations, analyses d'impact), sort des données en fin de contrat, audit.", "Compléter les clauses manquantes des contrats existants, en priorité ceux des sous-traitants traitant des données sensibles ou en grand volume.", "art. 28.3", "art. 28.3"], ["r503", "R5", "MG", 2, "Les sous-traitants sont évalués avant contractualisation (art. 28.1) puis contrôlés périodiquement (bonne pratique).", "art. 28.1, 28.3.h ; lignes directrices CEPD 07/2020 ; bonne pratique", "Mettre en place une évaluation des sous-traitants avant contractualisation (garanties de sécurité, certifications, localisation des données, sous-traitants ultérieurs ; art. 28.1), graduée selon le risque, et des contrôles périodiques (bonne pratique).", "Systématiser l’évaluation des sous-traitants avant contractualisation (art. 28.1) ; instaurer des contrôles périodiques (bonne pratique).", "art. 28.1, 28.3.h ; lignes directrices CEPD 07/2020", "art. 28.1, 28.3.h ; lignes directrices CEPD 07/2020"], ["r504", "R5", "PMG", 3, "Les transferts hors UE sont cartographiés, y compris les accès distants et l'hébergement cloud.", "art. 44", "Cartographier les transferts de données personnelles hors UE/EEE : hébergement et services cloud, sous-traitants et sous-traitants ultérieurs établis hors UE, accès à distance depuis un pays tiers (support, maintenance, administration), flux intra-groupe et envois ponctuels à des tiers ; préciser pour chacun le pays destinataire et l'outil d'encadrement (décision d'adéquation, clauses contractuelles types, BCR, dérogation).", "Compléter la cartographie avec les transferts non recensés (sous-traitants ultérieurs, accès à distance, support, flux intra-groupe) et préciser pour chacun le pays destinataire et l'outil d'encadrement.", "art. 30.1.e, 44-46, 49", "art. 30.1.e, 44-46, 49"], ["r505", "R5", "PMG", 3, "Chaque transfert repose sur un outil valide (décision d’adéquation, CCT 2021, BCR) ; pour les garanties de l’article 46, une analyse d’impact du transfert est réalisée.", "art. 45-47 ; CJUE Schrems II ; recommandations CEPD 01/2020", "Encadrer chaque transfert (adéquation, CCT 2021, BCR) et réaliser les TIA pour les transferts fondés sur l’article 46.", "Réaliser les TIA manquantes et remplacer les éventuelles CCT antérieures à 2021, qui ne sont plus valables depuis le 27 décembre 2022.", "art. 45, 46.2.c ; recommandations CEPD 01/2020", "art. 46 ; CJUE Schrems II ; recommandations CEPD 01/2020"], ["r506", "R5", "G", 1, "Des BCR ou un dispositif intra-groupe équivalent encadrent les transferts internes.", "art. 47", "Étudier l'opportunité de BCR au regard du volume et de la nature des flux intra-groupe ; à défaut, encadrer ces flux par un accord intra-groupe intégrant les CCT.", "Encadrer les flux intra-groupe restants par un accord intra-groupe intégrant les CCT, ou instruire des BCR.", "art. 46.2.c, 47", "art. 46.2.c, 47"], ["r601", "R6", "PMG", 3, "Une analyse de risques fonde les mesures de sécurité (art. 32.1, 32.2) ; une PSSI existe (pratique de place).", "art. 32.1, 32.2 ; pratique de place", "Réaliser une analyse de risques et implémenter un plan de sécurisation adéquat au regard du risque ; formaliser la PSSI (pratique de place).", "Compléter l’analyse de risques et mettre en œuvre les mesures manquantes du plan de sécurisation ; compléter la PSSI (pratique de place).", "art. 32.1, 32.2 ; pratique de place", "art. 32.1, 32.2 ; pratique de place"], ["r602", "R6", "PMG", 3, "Gestion des habilitations : moindre privilège, revue périodique, authentification forte sur les accès sensibles.", "art. 32 ; guide sécurité CNIL", "Définir une politique d'habilitations fondée sur le moindre privilège, mettre en place des revues périodiques des habilitations et l'authentification multifacteur sur les accès sensibles.", "Compléter le dispositif : appliquer le moindre privilège aux profils non revus, instaurer des revues d'habilitations régulières et étendre l'authentification multifacteur aux accès sensibles restants.", "art. 32.1 ; guide sécurité CNIL", "art. 32.1 ; guide sécurité CNIL"], ["r603", "R6", "PMG", 2, "Chiffrement des postes, flux et bases sensibles ; pseudonymisation lorsque pertinent.", "art. 32.1.a", "Déployer le chiffrement des postes de travail et supports amovibles, des flux et des bases contenant des données sensibles ; recourir à la pseudonymisation lorsqu'elle est pertinente (tests, statistiques, analyses).", "Étendre le chiffrement aux postes, flux et bases encore non couverts et évaluer la pseudonymisation pour les usages qui s'y prêtent.", "art. 32.1.a ; guide sécurité CNIL", "art. 32.1.a ; guide sécurité CNIL"], ["r604", "R6", "PMG", 2, "Journalisation des accès aux données et supervision des événements de sécurité.", "art. 32 ; recommandation CNIL journalisation", "Activer la journalisation des accès aux données personnelles (qui, quand, quelle action) sur les applications concernées, protéger les journaux et organiser leur analyse pour détecter les comportements anormaux.", "Étendre la journalisation aux applications restantes, définir la durée de conservation des journaux et organiser leur exploitation.", "art. 32.1 ; recommandation CNIL journalisation", "art. 32.1 ; recommandation CNIL journalisation"], ["r605", "R6", "PMG", 2, "Sauvegardes testées et plan de continuité / reprise.", "art. 32.1.b-c", "Mettre en place des sauvegardes régulières, tester périodiquement les restaurations et formaliser un PCA/PRA pour les traitements critiques.", "Tester régulièrement les restaurations, consigner les résultats et compléter le PCA/PRA pour les traitements non couverts.", "art. 32.1.b, 32.1.c", "art. 32.1.b, 32.1.c"], ["r606", "R6", "MG", 2, "Tests d'intrusion et audits de sécurité réguliers, suivi des correctifs.", "art. 32.1.d", "Planifier des tests d'intrusion et audits de sécurité réguliers sur les applications exposées ou sensibles, et mettre en place une gestion des vulnérabilités (veille, priorisation et suivi des correctifs).", "Rendre les tests réguliers, étendre leur périmètre et formaliser le suivi des correctifs jusqu'à leur clôture.", "art. 32.1.d", "art. 32.1.d"], ["r701", "R7", "PMG", 3, "Procédure de détection, qualification et escalade des violations de données.", "art. 33", "Rédiger et implémenter une procédure de détection, de qualification et d’escalade des violations (grille de qualification, circuit de décision).", "Compléter la procédure : grille de qualification du risque pour les personnes, circuit d'escalade (DPO, RSSI, direction), responsabilités et délais.", "art. 33.1, 33.4", "art. 33.1, 33.4"], ["r702", "R7", "PMG", 3, "Registre des violations tenu, y compris celles non notifiées.", "art. 33.5", "Mettre en place le registre de toutes les violations, y compris celles non notifiées : faits, effets, mesures prises et justification de la décision de notifier ou non.", "Compléter le registre avec les violations non notifiées et les éléments manquants (faits, effets, mesures prises).", "art. 33.5", "art. 33.5"], ["r703", "R7", "PMG", 3, "Capacité à notifier la CNIL dans les 72 heures et à informer les personnes dans les meilleurs délais en cas de risque élevé.", "art. 33.1, 34", "Préparer les modèles de notification à la CNIL et de communication aux personnes reprenant les informations exigées (nature de la violation, catégories et nombre approximatif de personnes, conséquences, mesures prises, coordonnées du délégué à la protection des données ou d'un autre point de contact), et définir un circuit de décision compatible avec le délai de 72 heures.", "Préparer les modèles manquants (notification CNIL, communication aux personnes) et tester le circuit de décision dans le délai de 72 heures.", "art. 33.1, 33.3, 34", "art. 33.1, 33.3, 34.1"], ["r704", "R7", "PMG", 2, "Les sous-traitants sont tenus contractuellement de notifier toute violation dans les meilleurs délais.", "art. 33.2", "Ajouter aux contrats de sous-traitance une clause obligeant le sous-traitant à notifier toute violation dans les meilleurs délais après en avoir pris connaissance, avec les informations utiles à sa qualification ; fixer un délai précis (24 à 48 heures) relève de la pratique de place.", "Ajouter la clause de notification des violations aux contrats qui ne la contiennent pas, ou la préciser (délai, contenu de l'alerte).", "art. 28.3.f, 33.2 ; pratique de place", "art. 28.3.f, 33.2"], ["r705", "R7", "MG", 1, "Des exercices de gestion de crise incluent le scénario violation de données.", "Bonne pratique ; art. 32.1.d ; guide ANSSI exercice de crise cyber", "Organiser au moins un exercice de crise par an incluant un scénario de violation de données (détection, qualification, décision de notification, communication) et en tirer un plan d'amélioration.", "Intégrer le scénario de violation de données aux exercices de crise existants et suivre la mise en œuvre des enseignements tirés.", "Bonne pratique ; art. 32.1.d ; guide ANSSI exercice de crise cyber", "Bonne pratique ; art. 32.1.d ; guide ANSSI exercice de crise cyber"], ["r801", "R8", "PMG", 3, "La méthodologie projet et les achats intègrent un jalon protection des données dès la conception.", "art. 25", "Insérer un jalon privacy dans la méthodologie projet et les achats, intégrant notamment la minimisation des données dès la conception.", "Rendre le jalon privacy obligatoire dans la méthodologie projet et les achats, y intégrer la minimisation des données dès la conception et vérifier son application.", "RGPD art. 25.1, 5.1.c", "RGPD art. 25.1, 5.1.c"], ["r802", "R8", "PMG", 3, "Des critères permettent d'identifier les traitements soumis à AIPD (listes CNIL, 9 critères du CEPD).", "art. 35.1, 35.4", "Formaliser une grille de déclenchement AIPD combinant la liste CNIL des traitements soumis à AIPD et les 9 critères du CEPD (une AIPD est en principe requise dès que deux critères sont remplis).", "Compléter la grille de déclenchement avec la liste CNIL et les 9 critères du CEPD, et l'appliquer aux traitements existants et à chaque nouveau projet.", "art. 35.1, 35.4 ; lignes directrices WP248 rév.01", "art. 35.4 ; lignes directrices WP248 rév.01"], ["r803", "R8", "PMG", 3, "Les AIPD requises sont réalisées, validées et revues.", "art. 35.7, 35.11", "Réaliser les AIPD requises avant la mise en œuvre des traitements concernés (description, nécessité et proportionnalité, risques, mesures), les faire valider et prévoir leur réexamen.", "Réaliser les AIPD manquantes et planifier le réexamen de celles qui existent, notamment en cas d'évolution du risque.", "art. 35.1, 35.7", "art. 35.7, 35.11"], ["r804", "R8", "PMG", 2, "Le conseil du DPO est demandé lors de la réalisation de l’AIPD ; la CNIL est consultée préalablement si le risque résiduel reste élevé.", "art. 35.2, 36.1 ; lignes directrices WP248 rév.01 (III.D.b)", "Demander le conseil du DPO lors de chaque AIPD et le consigner avec la suite donnée (bonne pratique) ; consulter la CNIL avant la mise en œuvre si le risque résiduel reste élevé.", "Associer le DPO aux AIPD où il ne l’a pas été et clarifier le critère de consultation préalable de la CNIL (risque résiduel élevé).", "art. 35.2, 36.1 ; lignes directrices WP248 rév.01 (III.D.b)", "art. 35.2, 36.1"], ["r805", "R8", "PMG", 1, "Les paramètres par défaut sont les plus protecteurs (privacy by default).", "art. 25.2", "Revoir les paramétrages par défaut des applications et services pour qu'ils soient les plus protecteurs : données collectées, durée de conservation, visibilité et partage limités au nécessaire.", "Revoir les paramétrages par défaut des applications restantes selon les mêmes critères (données, durée, visibilité).", "art. 25.2", "art. 25.2"], ["a104", "A1", "PMG", 3, "Un registre recense les systèmes d’IA (développés, achetés, embarqués, shadow AI) et, pour chacun, ses cas d’usage IA.", "Pratique de place ; art. 6, 26, 49", "Constituer le registre des SIA et de leurs cas d’usage IA (système × cas d’usage IA), en qualifiant pour chaque cas d’usage IA le rôle de l’organisation et le niveau de risque.", "Compléter le registre (IA embarquée, achetée, shadow AI, cas d’usage IA non recensés) et instaurer sa mise à jour continue.", "Pratique de place ; art. 26, 49", "Pratique de place ; art. 26, 49"], ["a101", "A1", "PMG", 3, "Un responsable de la conformité IA est désigné avec un mandat clair.", "Bonne pratique ; ISO/IEC 42001 §5", "Nommer un pilote de la conformité IA avec un mandat clair : périmètre, responsabilités, rattachement et moyens.", "Formaliser le mandat, le périmètre, le rattachement et les moyens du pilote IA.", "Bonne pratique ; ISO/IEC 42001 §5", "Bonne pratique ; ISO/IEC 42001 §5"], ["a102", "A1", "PMG", 2, "Un comité de gouvernance IA réunit DPO, RSSI, juridique, data et métiers.", "Pratique de place", "Installer un comité de gouvernance IA réunissant DPO, RSSI, juridique, data et métiers, doté d'une charte (missions, composition, fréquence, modalités de décision).", "Formaliser la charte du comité (missions, fréquence, modalités de décision) et y associer les fonctions manquantes.", "Pratique de place", "Pratique de place"], ["a103", "A1", "PMG", 2, "Une politique IA validée par la direction fixe principes, appétence au risque et interdits.", "ISO/IEC 42001 §5.2", "Rédiger une politique IA fixant les principes d'usage, l'appétence au risque, les usages interdits et les rôles, et la faire valider par la direction.", "Compléter la politique sur les points manquants (appétence au risque, usages interdits, rôles) et la faire valider par la direction.", "Bonne pratique ; ISO/IEC 42001 §5.2", "Bonne pratique ; ISO/IEC 42001 §5.2"], ["a105", "A1", "PMG", 2, "Tout nouveau cas d'usage IA passe par un processus de validation (intake) avant mise en service.", "Pratique de place", "Mettre en place un circuit de validation des cas d'usage IA avant mise en service : fiche de demande, qualification (rôle, niveau de risque, données personnelles), avis du DPO et du RSSI, décision du comité.", "Rendre le circuit de validation obligatoire pour tout nouveau cas d'usage IA, y compris les outils achetés, et l'appliquer aux cas d'usage IA en service non encore validés.", "Pratique de place", "Pratique de place"], ["a106", "A1", "G", 1, "Un système de management de l'IA (ISO/IEC 42001) est déployé ou planifié.", "ISO/IEC 42001", "Cadrer un projet SMIA (périmètre, politique IA, rôles, processus d'évaluation des risques, feuille de route) en l'articulant avec le SMSI et le SMQ existants.", "Structurer le projet SMIA : périmètre, planning, responsables et articulation avec le SMSI et le SMQ.", "Bonne pratique ; ISO/IEC 42001", "Bonne pratique ; ISO/IEC 42001"], ["a201", "A2", "PMG", 2, "Chaque outil est évalué au regard de la définition de « système d'IA ».", "art. 3.1 ; lignes directrices de la Commission", "Appliquer à chaque outil un test de qualification au regard de la définition de l'article 3.1 (système fonctionnant avec un certain degré d'autonomie qui, à partir des entrées reçues, infère la manière de générer des sorties) et tracer la conclusion.", "Appliquer le test de qualification aux outils non encore évalués et tracer les conclusions.", "art. 3.1 ; lignes directrices de la Commission", "art. 3.1 ; lignes directrices de la Commission"], ["a202", "A2", "PMG", 3, "Le rôle (fournisseur, déployeur, importateur, distributeur) est déterminé par système.", "art. 3.3-3.7", "Pour chaque système, qualifier le rôle de l'organisation (fournisseur, déployeur, importateur, distributeur) au regard des définitions de l'article 3 et tracer la justification (pratique de place).", "Qualifier le rôle (fournisseur, déployeur, importateur, distributeur) des systèmes non encore analysés, vérifier pour chacun les cas de requalification en fournisseur (nom ou marque apposé, modification substantielle, changement de destination) et tracer la justification (pratique de place).", "art. 3.3-3.7 ; pratique de place", "art. 3.3-3.7, 25.1 ; pratique de place"], ["a203", "A2", "PMG", 3, "Chaque cas d'usage IA est passé au crible des pratiques interdites.", "art. 5 — depuis le 2 fév. 2025", "Passer chaque cas d'usage IA au crible des pratiques interdites de l'article 5, arrêter immédiatement les usages prohibés et consigner les conclusions (pratique de place).", "Étendre l'analyse de l'article 5 aux cas d'usage IA non encore examinés et arrêter les usages prohibés identifiés.", "art. 5 ; pratique de place", "art. 5"], ["a204", "A2", "PMG", 3, "La classification haut risque est réalisée (annexe I produits réglementés, annexe III cas d'usage).", "art. 6.1, 6.2", "Classer chaque système : haut risque s'il est un produit ou un composant de sécurité d'un produit réglementé (annexe I), ou s'il relève d'un domaine de l'annexe III (biométrie, emploi, éducation, accès aux services essentiels…).", "Compléter la classification des systèmes non encore évalués au regard des annexes I et III.", "art. 6.1, 6.2 ; annexes I et III", "art. 6.1, 6.2 ; annexes I et III"], ["a205", "A2", "PMG", 2, "Lorsqu'un système relevant d'un domaine à haut risque de l'annexe III est considéré comme non à haut risque (exemption de l'article 6.3), cette évaluation est documentée.", "art. 6.3, 6.4", "Pour tout système relevant de l'annexe III considéré comme non à haut risque, documenter l'évaluation fondée sur l'article 6.3 (tâche procédurale étroite, amélioration d'une activité humaine, détection de schémas sans remplacer l'évaluation humaine, tâche préparatoire) avant sa mise sur le marché ou sa mise en service.", "Documenter les exemptions non tracées pour les systèmes de l'annexe III considérés comme non à haut risque et vérifier qu'aucun système exempté n'effectue de profilage de personnes, ce qui exclut l'exemption.", "art. 6.3, 6.4", "art. 6.3, 6.4"], ["a206", "A2", "MG", 2, "Le risque de requalification en fournisseur (marque propre, modification substantielle, changement de destination) est maîtrisé.", "art. 25", "Encadrer les situations de requalification en fournisseur (apposition de son nom ou de sa marque sur un système à haut risque, modification substantielle, changement de destination vers un usage à haut risque) par une validation préalable de ces changements.", "Compléter l'encadrement des modifications substantielles, des usages en marque blanche et des changements de destination.", "art. 25.1", "art. 25.1"], ["a301", "A3", "PMG", 2, "Des mesures sont prises pour garantir un niveau suffisant de maîtrise de l’IA du personnel, adapté à ses connaissances et au contexte d’utilisation.", "art. 4 (portée revue par le règl. 2026/1744 — à vérifier)", "Déployer un parcours de maîtrise de l'IA adapté aux populations (utilisateurs, superviseurs, développeurs, décideurs), à leurs connaissances et au contexte d'utilisation des systèmes.", "Étendre le parcours aux populations non couvertes et l'actualiser ; tracer la complétion (pratique de place).", "art. 4 (portée revue par le règl. 2026/1744 — à vérifier)", "art. 4 (portée revue par le règl. 2026/1744 — à vérifier) ; pratique de place"], ["a302", "A3", "PMG", 3, "Une charte d'usage de l'IA générative est diffusée et acceptée.", "Bonne pratique ; recommandations ANSSI IA générative", "Rédiger et publier une charte d'usage de l'IA générative (outils autorisés, données interdites à la saisie, vérification humaine des contenus, propriété intellectuelle) et organiser son acceptation par les utilisateurs.", "Compléter la charte sur les points manquants et organiser son acceptation par tous les utilisateurs.", "Bonne pratique ; recommandations ANSSI IA générative", "Bonne pratique ; recommandations ANSSI IA générative"], ["a303", "A3", "PMG", 2, "Une liste d'outils d'IA approuvés existe ; le shadow AI est détecté et traité.", "Pratique de place ; RGPD art. 32", "Établir le catalogue des outils d'IA approuvés et mettre en place un contrôle des usages (filtrage, analyse des flux réseau, déclaration par les équipes) pour détecter et traiter le shadow AI.", "Compléter le catalogue d'outils, mettre en place la détection du shadow AI et un processus de traitement (régularisation ou blocage).", "Pratique de place ; RGPD art. 32", "Pratique de place ; RGPD art. 32"], ["a304", "A3", "PMG", 2, "Les données confidentielles et personnelles saisies dans les outils d'IA sont encadrées (paramétrage, non-réutilisation pour l'entraînement).", "RGPD art. 5, 28, 32", "Souscrire des offres entreprise pour les outils d'IA utilisés (non-réutilisation des données pour l'entraînement, contrat de sous-traitance, localisation des données) et définir des règles de saisie interdisant les données confidentielles ou sensibles dans les outils non approuvés.", "Généraliser les offres entreprise et les règles de saisie à tous les outils d'IA utilisés.", "RGPD art. 5.1.f, 28.3, 32", "RGPD art. 5.1.f, 28.3, 32"], ["a401", "A4", "PMG", 3, "En tant que fournisseur : les systèmes d'IA destinés à interagir directement avec des personnes (chatbots, voicebots) sont conçus pour les informer qu'elles interagissent avec une IA.", "art. 50.1 — depuis le 2 août 2026", "Recenser les systèmes d'IA destinés à interagir directement avec des personnes (chatbots, voicebots, assistants virtuels) et intégrer dès leur conception une information claire indiquant que la personne échange avec une IA, au plus tard lors de la première interaction, sauf si c'est évident pour une personne raisonnablement informée.", "Étendre l'information aux systèmes conversationnels non couverts et vérifier qu'elle est claire, distinguable, accessible et donnée au plus tard lors de la première interaction.", "art. 50.1, 50.5", "art. 50.1, 50.5"], ["a402", "A4", "PMG", 2, "En tant que fournisseur : les contenus synthétiques sont marqués dans un format lisible par machine.", "art. 50.2 — 2 août 2026 (systèmes déjà sur le marché : 2 déc. 2026)", "Implémenter un marquage des contenus synthétiques (audio, image, vidéo, texte) dans un format lisible par machine et détectable (filigrane, métadonnées, empreinte), efficace, interopérable et robuste dans la mesure du possible.", "Étendre le marquage aux contenus synthétiques et aux canaux de diffusion non couverts.", "art. 50.2", "art. 50.2"], ["a403", "A4", "PMG", 2, "En tant que déployeur : les personnes exposées à un système de reconnaissance des émotions ou de catégorisation biométrique sont informées de son fonctionnement.", "art. 50.3", "Vérifier d'abord la licéité du système (la reconnaissance des émotions est interdite au travail et dans l'enseignement, art. 5.1.f), puis informer les personnes exposées de son fonctionnement et traiter les données conformément au RGPD.", "Compléter l'information des personnes exposées et vérifier la licéité de chaque système au regard de l'article 5.", "art. 50.3, 5.1.f", "art. 50.3, 5.1.f"], ["a404", "A4", "PMG", 2, "En tant que déployeur : les deepfakes et les textes générés par IA publiés pour informer le public sur des questions d'intérêt public sont signalés comme tels.", "art. 50.4", "Définir des règles d'étiquetage : signaler comme générés ou manipulés par IA les deepfakes (image, audio, vidéo) et les textes publiés sur des questions d'intérêt public, sauf relecture humaine sous responsabilité éditoriale ; prévoir une mention adaptée pour les œuvres artistiques ou satiriques.", "Appliquer les règles d'étiquetage à tous les contenus et canaux concernés et contrôler leur application.", "art. 50.4", "art. 50.4"], ["a501", "A5", "PMG", 3, "Les systèmes à haut risque sont utilisés conformément à la notice du fournisseur.", "art. 26.1", "Pour chaque système à haut risque déployé, obtenir la notice d'utilisation du fournisseur, en extraire les conditions d'usage (finalité prévue, limites de performance, données d'entrée attendues, mesures de contrôle humain, maintenance) et les traduire en règles internes d'utilisation communiquées aux utilisateurs.", "Obtenir les notices manquantes, formaliser les règles d'usage des systèmes non couverts et vérifier que les usages réels restent dans la finalité prévue par le fournisseur (un usage hors de cette finalité peut faire requalifier le déployeur en fournisseur).", "art. 13.3, 26.1", "art. 13.3, 25.1.c, 26.1"], ["a502", "A5", "PMG", 3, "Le contrôle humain est confié à des personnes compétentes, formées et dotées de l'autorité nécessaire.", "art. 26.2", "Désigner pour chaque système à haut risque des superviseurs humains compétents, les former au fonctionnement et aux limites du système et leur donner l'autorité nécessaire, notamment pour ignorer ou interrompre ses résultats.", "Compléter la désignation et la formation des superviseurs humains et formaliser leur autorité (ignorer, corriger ou arrêter le système).", "art. 26.2", "art. 26.2"], ["a503", "A5", "PMG", 2, "La pertinence et la représentativité des données d'entrée sous contrôle du déployeur sont assurées.", "art. 26.4", "Mettre en place des contrôles de qualité des données d'entrée dont l'organisation a la maîtrise (pertinence et représentativité au regard de la finalité prévue), avant et pendant l'utilisation du système.", "Étendre les contrôles qualité aux données d'entrée et aux systèmes non couverts, en vérifiant leur pertinence et leur représentativité au regard de la finalité prévue par le fournisseur.", "art. 26.4", "art. 26.4"], ["a504", "A5", "PMG", 2, "Le fonctionnement est surveillé ; risques et incidents graves sont signalés au fournisseur et à l'autorité.", "art. 26.5, 73", "Définir un processus de surveillance du fonctionnement conforme à la notice : en cas de risque, informer le fournisseur et l'autorité et suspendre l'utilisation ; en cas d'incident grave, informer immédiatement le fournisseur, puis l'importateur ou le distributeur et l'autorité de surveillance.", "Compléter le processus de surveillance et formaliser le circuit de signalement des risques et incidents graves (destinataires, délais, responsables).", "art. 26.5, 73", "art. 26.5, 73"], ["a505", "A5", "PMG", 2, "Les journaux générés automatiquement sont conservés au moins six mois.", "art. 26.6", "Paramétrer la conservation des journaux générés automatiquement par les systèmes à haut risque, lorsqu'ils sont sous le contrôle de l'organisation, pendant au moins six mois (ou plus si le droit applicable l'exige), en sécurisant leur accès.", "Étendre la conservation des journaux à six mois au moins sur les systèmes à haut risque restants et sécuriser leur accès.", "art. 26.6", "art. 26.6"], ["a506", "A5", "PMG", 3, "En tant qu'employeur déployeur : avant la mise en service ou l'utilisation d'un système d'IA à haut risque sur le lieu de travail, les représentants du personnel et les salariés concernés sont informés qu'ils y seront soumis.", "art. 26.7", "Avant la mise en service de chaque système d'IA à haut risque sur le lieu de travail, informer les représentants du personnel et les salariés concernés qu'ils y seront soumis ; en France, dans les entreprises d'au moins 50 salariés, informer et consulter le CSE sur l'introduction de cette nouvelle technologie.", "Compléter l'information des représentants du personnel et des salariés pour les systèmes d'IA à haut risque non couverts et, en France (entreprises d'au moins 50 salariés), la consultation du CSE avant leur mise en service.", "art. 26.7 ; Code du travail L2312-8", "art. 26.7 ; Code du travail L2312-8"], ["a507", "A5", "PMG", 3, "Les personnes faisant l'objet de décisions assistées par un système annexe III sont informées et peuvent obtenir une explication.", "art. 26.11, 86", "Informer les personnes faisant l'objet de décisions prises ou assistées par un système à haut risque de l'annexe III, et mettre en place un processus leur permettant d'obtenir une explication claire du rôle du système dans la décision.", "Compléter l'information des personnes et rendre le droit à l'explication opérationnel (point de contact, délai, contenu de la réponse).", "art. 26.11, 86", "art. 26.11, 86"], ["a508", "A5", "PMG", 2, "Lorsqu’elle est requise (organismes publics, services publics, crédit, assurance vie et santé), une FRIA est réalisée avant la mise en service et complète l’AIPD, qui s’appuie sur la notice du fournisseur.", "art. 27, 26.9", "Identifier les systèmes à haut risque soumis à la FRIA, la réaliser avant leur mise en service en l’articulant avec l’AIPD, et notifier ses résultats à l’autorité de surveillance du marché.", "Réaliser les FRIA manquantes, les articuler avec l’AIPD et notifier leurs résultats à l’autorité de surveillance du marché (art. 27.3).", "art. 27.1, 27.3, 27.4, 26.9", "art. 27.1, 27.3, 27.4"], ["a601", "A6", "PMG", 3, "Un système de gestion des risques couvre tout le cycle de vie.", "art. 9", "Mettre en place un processus de gestion des risques couvrant tout le cycle de vie du système : identification et analyse des risques, estimation, mesures d'atténuation, tests et réexamen régulier.", "Étendre la gestion des risques à toutes les phases du cycle de vie (conception, développement, déploiement, après commercialisation).", "art. 9", "art. 9"], ["a602", "A6", "PMG", 3, "Gouvernance des données d'entraînement, de validation et de test (qualité, biais, représentativité).", "art. 10", "Formaliser la gouvernance des jeux de données d'entraînement, de validation et de test : origine et collecte, préparation, examen des biais, représentativité et traçabilité.", "Compléter la gouvernance des jeux de données sur les points non couverts (biais, représentativité, traçabilité, lacunes identifiées).", "art. 10", "art. 10"], ["a603", "A6", "PMG", 2, "Documentation technique (annexe IV) et journalisation automatique des événements.", "art. 11, 12", "Produire la documentation technique couvrant les éléments de l'annexe IV et concevoir le système pour qu'il enregistre automatiquement les événements (journalisation) tout au long de sa durée de vie.", "Compléter la documentation technique sur les éléments de l'annexe IV manquants (description du système et de sa finalité, données utilisées, méthodes de test et résultats, mesures de contrôle humain, système de gestion des risques) et la journalisation automatique des événements.", "art. 11, 12 ; annexe IV", "art. 11, 12 ; annexe IV"], ["a604", "A6", "PMG", 2, "Notice d'utilisation et conception permettant le contrôle humain.", "art. 13, 14", "Rédiger la notice d'utilisation destinée aux déployeurs (finalité, performances, limites, mesures de contrôle humain, maintenance) et concevoir le système pour permettre un contrôle humain effectif (compréhension, interprétation, interruption).", "Compléter la notice sur les éléments manquants de l'art. 13.3 (identité du fournisseur, finalité prévue, niveau de performance et limites, données d'entrée, mesures de contrôle humain, durée de vie et maintenance) et les mesures permettant aux superviseurs de comprendre, interpréter, ignorer ou interrompre le système (art. 14.4).", "art. 13.3, 14.4", "art. 13.3, 14.4"], ["a605", "A6", "PMG", 2, "Exactitude, robustesse et cybersécurité sont spécifiées, testées et mesurées.", "art. 15", "Définir des métriques d'exactitude, de robustesse et de cybersécurité, les déclarer dans la notice et organiser des campagnes de test, y compris contre les attaques propres à l'IA (empoisonnement des données, exemples adverses).", "Compléter les métriques d'exactitude, de robustesse et de cybersécurité déclarées dans la notice et étendre les campagnes de test aux risques non couverts, notamment les attaques propres à l'IA (empoisonnement des données, exemples adverses, manipulation du modèle).", "art. 15", "art. 15"], ["a606", "A6", "PMG", 2, "Un système de gestion de la qualité est documenté.", "art. 17", "Mettre en place un SMQ couvrant les exigences IA de l'art. 17, ou étendre le SMQ existant : stratégie de conformité, procédures de conception et de vérification, gestion des données, gestion des risques, surveillance après commercialisation, signalement des incidents graves, gestion documentaire et responsabilités.", "Compléter le SMQ avec les exigences IA manquantes de l'article 17 (stratégie de conformité, gestion des données, gestion des risques, surveillance après commercialisation, signalement des incidents).", "art. 17", "art. 17"], ["a607", "A6", "PMG", 3, "Évaluation de conformité, déclaration UE, marquage CE et enregistrement dans la base de données de l'UE.", "art. 43, 47-49", "Planifier le parcours d'évaluation de conformité (contrôle interne ou organisme notifié selon le cas), puis la déclaration UE de conformité, le marquage CE et l'enregistrement dans la base de données de l'UE.", "Compléter le parcours d'évaluation de conformité sur les étapes manquantes (déclaration UE, marquage CE, enregistrement dans la base de données de l'UE).", "art. 43, 47-49", "art. 47, 48, 49"], ["a608", "A6", "PMG", 2, "Surveillance après commercialisation et notification des incidents graves.", "art. 72, 73", "Bâtir un plan de surveillance après commercialisation (collecte et analyse des données de performance) et un circuit de notification des incidents graves à l'autorité dans les délais de l'article 73.", "Compléter le plan de surveillance après commercialisation (données de performance collectées et analysées tout au long de la vie du système) et le circuit de notification des incidents graves : au plus tard 15 jours après en avoir eu connaissance, 10 jours en cas de décès, 2 jours en cas d'infraction de grande ampleur ou d'atteinte à une infrastructure critique.", "art. 72, 73", "art. 72, 73.2, 73.3, 73.4"], ["a701", "A7", "PMG", 3, "Les contrats avec les fournisseurs d’IA intègrent les clauses requises (RGPD art. 28 si sous-traitant ; art. 25.4 pour les composants de systèmes à haut risque) et des clauses dédiées : audit, PI, données (pratique de place).", "art. 25.4 (haut risque) ; RGPD art. 28 ; pratique de place", "Déployer des clauses IA types dans les contrats fournisseurs : clauses de l'article 28 du RGPD si le fournisseur est sous-traitant, informations et assistance de l'art. 25.4 pour les composants de systèmes à haut risque, et clauses dédiées (audit, propriété intellectuelle, usage des données ; pratique de place).", "Intégrer les clauses IA aux contrats existants qui ne les contiennent pas, en priorité pour les systèmes critiques.", "art. 25.4 ; RGPD art. 28.3 ; pratique de place", "art. 25.4 ; RGPD art. 28.3 ; pratique de place"], ["a702", "A7", "PMG", 2, "La documentation que les fournisseurs de modèles d’IA à usage général doivent mettre à disposition (art. 53.1.b) est obtenue et exploitée (bonne pratique).", "Bonne pratique ; art. 53.1.b — depuis le 2 août 2025", "Exiger des fournisseurs de modèles d'IA à usage général la documentation qu'ils doivent mettre à disposition (capacités, limites, conditions d'intégration) et l'exploiter dans l'analyse des risques (bonne pratique).", "Obtenir la documentation manquante des fournisseurs de modèles d'IA à usage général et l'exploiter dans l'analyse des risques (bonne pratique).", "Bonne pratique ; art. 53.1.b", "Bonne pratique ; art. 53.1.b"], ["a703", "A7", "MG", 2, "Si l'entreprise fournit un modèle d'IA à usage général : documentation technique, politique de droit d'auteur, résumé des données d'entraînement (sinon N/A).", "art. 53", "Établir la documentation technique du modèle, la documentation destinée aux intégrateurs, une politique de respect du droit d'auteur et le résumé public des données d'entraînement ; l'adhésion au code de bonnes pratiques pour l'IA à usage général permet de démontrer la conformité.", "Compléter les éléments manquants (documentation technique, documentation pour les intégrateurs, politique de droit d'auteur, résumé des données d'entraînement).", "art. 53.1, 56", "art. 53.1"], ["a704", "A7", "PMG", 3, "Lorsque des données personnelles servent à entraîner ou affiner des modèles, ce traitement repose sur une base légale adaptée ; en cas de réutilisation, la compatibilité des finalités est vérifiée, et les personnes sont informées.", "RGPD art. 6.1, 6.4, 13, 14 ; recommandations CNIL IA", "Pour chaque jeu d’entraînement contenant des données personnelles : déterminer la base légale (souvent l’intérêt légitime, avec mise en balance), réaliser le test de compatibilité en cas de réutilisation (art. 6.4) et informer les personnes (art. 13 ou 14).", "Compléter la base légale, le test de compatibilité et l’information des personnes pour les jeux d’entraînement restants.", "RGPD art. 6.1, 6.1.f, 6.4, 13, 14 ; recommandations CNIL IA", "RGPD art. 6.1, 6.4, 14 ; recommandations CNIL IA"], ["a705", "A7", "PMG", 3, "Si des décisions entièrement automatisées produisent des effets juridiques ou significatifs, elles relèvent d’une exception de l’art. 22.2 et sont assorties des garanties de l’art. 22.3.", "RGPD art. 22.2, 22.3", "Recenser les décisions automatisées, vérifier qu’elles relèvent d’une exception de l’art. 22.2 et mettre en place les garanties (intervention humaine, expression du point de vue, contestation).", "Compléter le recensement, vérifier l’exception de l’art. 22.2 pour chaque décision et compléter les garanties (intervention humaine, expression du point de vue, contestation).", "RGPD art. 22.2, 22.3", "RGPD art. 22.2, 22.3"], ["a706", "A7", "PMG", 2, "Lorsqu’un SIA traite des données personnelles et que le traitement est susceptible d’engendrer un risque élevé — ce qui est présumé pour les systèmes à haut risque au sens de l’AI Act — l’AIPD intègre les risques propres à l’IA.", "RGPD art. 35 ; AI Act art. 26.9, 27.4 ; recommandations CNIL IA", "Enrichir la méthode AIPD d'un volet IA : risques propres (biais, erreurs, opacité, fuite ou mémorisation de données, détournement), qualité des données d'entraînement et contrôle humain, en s'appuyant sur la notice du fournisseur.", "Étendre le volet IA à toutes les AIPD des systèmes concernés et mettre à jour les AIPD existantes de ces systèmes.", "RGPD art. 35.7 ; AI Act art. 26.9 ; recommandations CNIL IA", "RGPD art. 35.7 ; recommandations CNIL IA"]];
const TRT=[["t101", "T1", "PMG", 3, "La finalité du traitement est déterminée, explicite et légitime.", "RGPD art. 5.1.b", "Définir une finalité déterminée, explicite et légitime, et l’exprimer dans la fiche registre et la mention d’information.", "Préciser la finalité (trop large ou imprécise) et vérifier sa légitimité au regard des activités de l’organisation.", "RGPD art. 5.1.b, 13.1.c, 30.1.b", "RGPD art. 5.1.b"], ["t102", "T1", "PMG", 3, "Le traitement repose sur l’une des bases légales de l’article 6.1 (consentement, exécution d’un contrat ou de mesures précontractuelles, obligation légale, sauvegarde des intérêts vitaux, mission d’intérêt public ou relevant de l’autorité publique, intérêts légitimes), appropriée à sa finalité ; si l’intérêt légitime est retenu, la mise en balance avec les intérêts et droits des personnes est réalisée.", "RGPD art. 6.1 ; art. 5.2", "Déterminer la base légale appropriée à la finalité (mise en balance si intérêt légitime) et conserver la justification pour pouvoir la démontrer.", "Revoir l’adéquation de la base légale à la finalité et compléter la mise en balance si l’intérêt légitime est retenu.", "RGPD art. 6.1, 5.2", "RGPD art. 6.1, 6.1.f"], ["t103", "T1", "PMG", 2, "Toute réutilisation des données pour une autre finalité a fait l’objet d’un test de compatibilité.", "RGPD art. 6.4", "Pour chaque réutilisation des données pour une autre finalité, réaliser et consigner le test de compatibilité (lien entre finalités, contexte de collecte, nature des données, conséquences pour les personnes, garanties).", "Réaliser le test pour les réutilisations non évaluées et compléter les tests insuffisants au regard des critères de l’article 6.4.", "RGPD art. 6.4", "RGPD art. 6.4"], ["t201", "T2", "PMG", 3, "Seules les données nécessaires à la finalité sont collectées (minimisation).", "RGPD art. 5.1.c", "Revoir les données collectées avec le métier, supprimer les champs non nécessaires et appliquer la minimisation dès la conception.", "Supprimer les données non nécessaires encore collectées et justifier chaque champ obligatoire au regard de la finalité.", "RGPD art. 5.1.c, 25.1", "RGPD art. 5.1.c"], ["t202", "T2", "PMG", 3, "Si des données sensibles ou relatives aux infractions sont traitées, s’assurer que leur traitement repose sur une exception valide.", "RGPD art. 9, 10", "Vérifier l’exception applicable (art. 9.2) ou, pour les infractions, le cadre autorisé (art. 10), ou cesser de collecter ces données.", "Revoir l’exception retenue pour chaque catégorie de données sensibles (art. 9.2) et, pour les données d’infractions, confirmer que le traitement est autorisé par la loi ou placé sous le contrôle de l’autorité publique (art. 10).", "RGPD art. 9.2, 10", "RGPD art. 9.2, 10"], ["t203", "T2", "PMG", 3, "Une durée de conservation est définie et réellement appliquée (purge ou archivage).", "RGPD art. 5.1.e", "Définir la durée de conservation de chaque catégorie de données, puis définir et mettre en place les purges associées dans l'application.", "Définir les purges manquantes et vérifier qu'elles sont réellement exécutées dans l'application, y compris dans les environnements de test et les exports.", "RGPD art. 5.1.e", "RGPD art. 5.1.e"], ["t204", "T2", "PMG", 1, "Des mesures garantissent l’exactitude et la mise à jour des données.", "RGPD art. 5.1.d", "Mettre en place des contrôles de qualité à la saisie et un processus de mise à jour et de rectification des données inexactes.", "Compléter les contrôles de qualité et le processus de rectification des données inexactes.", "RGPD art. 5.1.d, 16", "RGPD art. 5.1.d, 16"], ["t301", "T3", "PMG", 3, "Les personnes sont informées de manière complète, lors de la collecte ou, si les données sont obtenues indirectement, dans un délai d’un mois au plus.", "RGPD art. 13, 14 ; lignes directrices WP260 rév.01", "Rédiger et publier la mention d’information du traitement à chaque point de collecte, avec un renvoi vers la politique de confidentialité.", "Compléter la mention (art. 13 ou 14 : finalités, base légale, destinataires, durées, droits, réclamation auprès de la CNIL…) et son renvoi vers la politique de confidentialité ; en collecte indirecte, informer dans le délai d’un mois.", "RGPD art. 12.1, 13, 14 ; lignes directrices WP260 rév.01", "RGPD art. 13, 14, 14.3 ; lignes directrices WP260 rév.01"], ["t302", "T3", "PMG", 2, "Les droits applicables à ce traitement (accès, rectification, effacement, limitation, opposition, portabilité lorsqu’elle s’applique) peuvent être exercés techniquement.", "RGPD art. 15-21", "Rendre l'application capable de répondre aux demandes de droits : extraction des données d'une personne, rectification, effacement, limitation, opposition et export structuré pour la portabilité lorsqu'elle s'applique.", "Combler les limites techniques identifiées (effacement, limitation, export pour la portabilité…).", "RGPD art. 15-21, 25.1", "RGPD art. 17, 18, 20"], ["t303", "T3", "PMG", 3, "Si une décision entièrement automatisée produit des effets juridiques ou significatifs, elle relève d’une exception de l’art. 22.2 et est assortie des garanties de l’art. 22.3 (intervention humaine, expression du point de vue, contestation).", "RGPD art. 22.2, 22.3", "Vérifier l’exception de l’art. 22.2 ; mettre en place une intervention humaine, la possibilité d’exprimer son point de vue et une voie de contestation (art. 22.3).", "Vérifier l’exception de l’art. 22.2, formaliser l’intervention humaine et informer les personnes de leur droit d’exprimer leur point de vue et de contester la décision.", "RGPD art. 22.2, 22.3", "RGPD art. 22.2, 22.3, 13.2.f"], ["t401", "T4", "PMG", 3, "Les sous-traitants du traitement sont identifiés et liés par un contrat conforme à l’article 28.", "RGPD art. 28", "Recenser les sous-traitants du traitement et régulariser les contrats avec les clauses de l’article 28.3.", "Compléter les clauses de l'article 28.3 manquantes dans les contrats existants et recenser les sous-traitants ultérieurs.", "RGPD art. 28.1, 28.3", "RGPD art. 28.2, 28.3"], ["t402", "T4", "PMG", 3, "Les éventuels transferts hors UE (y compris accès distant ou support) sont identifiés et encadrés.", "RGPD chapitre V", "Cartographier les transferts (y compris accès distants et support) et encadrer chacun par un outil du chapitre V (décision d’adéquation, CCT, BCR…) ; réaliser une TIA pour ceux fondés sur les garanties de l’article 46.", "Compléter la cartographie des transferts, encadrer ceux qui ne le sont pas par un outil du chapitre V (décision d’adéquation, CCT, BCR…) et réaliser les TIA manquantes pour les transferts fondés sur les garanties de l’article 46.", "RGPD art. 44-49 ; recommandations CEPD 01/2020", "RGPD art. 44-49 ; recommandations CEPD 01/2020"], ["t403", "T4", "PMG", 2, "Les destinataires internes et externes des données sont identifiés et limités au besoin.", "RGPD art. 5, 30", "Identifier les destinataires internes et externes des données, vérifier que chacun en a besoin pour sa mission et restreindre les accès au strict nécessaire.", "Compléter la liste des destinataires internes et externes, vérifier pour chacun le besoin d'en connaître, retirer les accès excessifs constatés et mettre à jour la fiche registre.", "RGPD art. 5.1.f, 30.1.d, 32.4", "RGPD art. 5.1.f, 30.1.d, 32.4"], ["t501", "T5", "PMG", 3, "Les habilitations à l’application suivent le moindre privilège et sont revues périodiquement.", "RGPD art. 32", "Définir un profil d'habilitation par rôle selon le moindre privilège et instaurer une revue périodique des habilitations, au moins annuelle (pratique de place).", "Instaurer la revue périodique des habilitations, retirer les accès inutiles et traiter les départs et mobilités.", "RGPD art. 32.1, 32.4 ; guide sécurité CNIL ; pratique de place", "RGPD art. 32.1, 32.4 ; guide sécurité CNIL"], ["t502", "T5", "PMG", 2, "Les données sont chiffrées en transit et au repos lorsque le risque le justifie ; la pseudonymisation est utilisée si pertinente.", "RGPD art. 32.
