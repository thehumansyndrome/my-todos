<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pcm001</title>
<script>
window.addEventListener('error', function (e) {
  var b = document.getElementById('boot-err');
  if (!b) return;
  b.style.display = 'block';
  b.textContent = 'JS error: ' + (e.message || e) + (e.lineno ? ' (line ' + e.lineno + ')' : '');
});

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --text:#1F1E1C; --muted:#6B6862; --border:#E4E1DA; --soft:#EFEDE7;
  --accent:#C96442; --accent-text:#FFFFFF; --green:#2E7D4F; --red:#B3392F; --card-fade:#FFFFFF;
  --t-emp:#C2410C; --t-tra:#1D4ED8; --t-per:#7C3AED; --t-rev:#92400E; --t-pro:#A16207; --t-reb:#BE123C;
}
[data-theme="sand"]{ --bg:#F8F7FF; --card:#FFFFFF; --text:#22213A; --muted:#6C6A86; --border:#E3E1F2; --soft:#EFEEFA; --card-fade:#FFFFFF; }
[data-theme="navy"]{ --bg:#161925; --card:#1F2333; --text:#E6E8F0; --muted:#9AA0B4; --border:#2E3347; --soft:#262B3D; --accent:#E08A68; --accent-text:#161925; --green:#5FBF84; --red:#E57373; --card-fade:#1F2333;
  --t-emp:#FB923C; --t-tra:#60A5FA; --t-per:#A78BFA; --t-rev:#D6A26B; --t-pro:#FACC15; --t-reb:#FB7185; }
[data-theme="dark"]{ --bg:#111113; --card:#1A1A1D; --text:#ECEBE8; --muted:#9C9A95; --border:#2B2B2F; --soft:#222226; --accent:#E08A68; --accent-text:#111113; --green:#5FBF84; --red:#E57373; --card-fade:#1A1A1D;
  --t-emp:#FB923C; --t-tra:#60A5FA; --t-per:#A78BFA; --t-rev:#D6A26B; --t-pro:#FACC15; --t-reb:#FB7185; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px;background:var(--bg);color:var(--text);color-scheme:light;border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%}
[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select,
[data-theme="navy"] input,[data-theme="navy"] textarea,[data-theme="navy"] select{color-scheme:dark}
textarea{resize:vertical;min-height:80px;line-height:1.45}
#boot{display:block;padding:14px 16px;background:var(--soft);color:var(--muted);font-size:13px;text-align:center}
#boot-err{display:none;padding:12px 16px;background:#B3392F;color:#fff;font-size:13px;font-family:'Geist Mono',monospace}

.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 16px;height:52px}
.brand{font-weight:500;font-size:16px;white-space:nowrap}
.brand small{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.brand .long{color:var(--muted);font-weight:400;margin-left:6px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;background:none;border:none;padding:6px}
.iconbtn{background:none;border:1px solid var(--border);border-radius:8px;min-width:40px;height:36px;font-size:15px}
.tabs{position:sticky;top:52px;z-index:99;background:var(--bg);border-bottom:1px solid var(--border);display:flex;gap:2px;padding:0 10px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:12px 10px;color:var(--muted);white-space:nowrap;min-height:44px}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
.page{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.section{display:none}
.section.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;font-weight:500;margin-bottom:8px}
.card h3{font-size:15px;font-weight:500;margin:14px 0 6px}
.card h3:first-child{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:500}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.lede{font-size:14px;color:var(--muted);margin-bottom:12px}
.pill{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;background:transparent;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-family:'Geist Mono',monospace;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:0 6px;margin-left:6px}
ul.clean{list-style:none}
ul.clean li{padding:4px 0 4px 16px;position:relative}
ul.clean li::before{content:'';position:absolute;left:2px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}

/* test */
.progress{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin:6px 0 14px}
.progress span{display:block;height:100%;background:var(--accent)}
.q{font-size:17px;font-weight:500;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;min-height:48px}
.opt .rank{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted)}
.opt.r1{border-color:var(--accent)}
.opt.r1 .rank{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.opt.r2{border-color:var(--muted)}
.opt.r2 .rank{border-color:var(--text);color:var(--text)}

/* building */
.bld{display:flex;flex-direction:column;gap:4px;margin:8px 0 4px}
.floor{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--bg)}
.floor .n{font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted);width:16px}
.floor .nm{width:120px;font-weight:500}
.floor .bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.floor .bar span{display:block;height:100%}
.floor .lab{font-size:11px;font-family:'Geist Mono',monospace;white-space:nowrap}
.floor.base{border-width:2px}
@media (max-width:420px){.floor .nm{width:96px;font-size:14px}}

/* people */
.person{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--card);width:100%;text-align:left;min-height:52px}
.person .nm{font-weight:500}
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px solid var(--soft);cursor:pointer}
.chk:last-child{border-bottom:none}
.chk input{width:20px;height:20px;flex:0 0 20px;margin-top:2px;accent-color:var(--accent)}
.cat{font-size:12px;font-family:'Geist Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
.cat:first-child{margin-top:0}
.scorebar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.scorebar .nm{width:110px}
.scorebar .bar{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.scorebar .bar span{display:block;height:100%}
.scorebar .v{width:22px;text-align:right;font-family:'Geist Mono',monospace;color:var(--muted)}
.talk{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:8px 0}
.ep{border-top:1px solid var(--soft);padding:8px 0;font-size:14px}
.ord{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:4px;background:var(--bg)}
.ord .nm{flex:1;font-weight:500}
.ord button{min-width:40px;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.typecard{cursor:pointer}
.typecard .head{display:flex;align-items:center;gap:10px}
.typecard .body{display:none;margin-top:12px}
.typecard.open .body{display:block}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:200;display:none;align-items:center;gap:12px;max-width:calc(100% - 32px)}
.toast button{background:none;border:none;color:var(--accent);font-weight:500;padding:4px}
.footer{text-align:center;font-size:12px;color:var(--muted);font-family:'Geist Mono',monospace;margin-top:20px}
.hidden{display:none !important}
@media (max-width:520px){
  .brand .long{display:none}
  .header{padding:10px 12px;gap:6px}
  .tab{padding:12px 8px;font-size:14px}
}
</style>
</head>

<div id="boot">Chargement… / Loading… — si ce message reste affiché, JavaScript ne s’exécute pas : ouvre le fichier dans Chrome ou Safari. / If this stays, JavaScript is not running: open the file in Chrome or Safari.</div>
<div id="boot-err"></div>

<div class="header">
  <div class="brand">pcm001<small>app <span class="ver">v1.0</span></small><span class="long" data-i18n="app.long"></span></div>

  <button class="iconbtn" id="theme-btn" onclick="toggleTheme()" data-i18n-aria="a.theme">☀︎</button>
</div>
<div class="tabs" id="tabs">
  <button class="tab active" data-tab="me" onclick="go('me')" data-i18n="tab.me"></button>
  <button class="tab" data-tab="people" onclick="go('people')" data-i18n="tab.people"></button>
  <button class="tab" data-tab="stress" onclick="go('stress')" data-i18n="tab.stress"></button>
  <button class="tab" data-tab="guide" onclick="go('guide')" data-i18n="tab.guide"></button>
  <button class="tab" data-tab="settings" onclick="go('settings')" data-i18n-aria="tab.settings">⚙︎</button>
</div>

<div class="page">
  <div id="tab-me" class="section active"></div>
  <div id="tab-people" class="section"></div>
  <div id="tab-stress" class="section"></div>
  <div id="tab-guide" class="section"></div>
  <div id="tab-settings" class="section">
    <div class="card">
      <h2>🌐 Langue / Language</h2>
      <div class="row">
        <button class="btn grow" id="lang-fr" onclick="setLang('fr')">Français</button>
        <button class="btn grow" id="lang-en" onclick="setLang('en')">English</button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="s.drive"></h2>
      <p class="lede" id="drive-info"></p>
      <div class="row">
        <button class="btn primary grow" id="drive-btn" onclick="driveConnect()"></button>
        <button class="btn grow" id="drive-sync-btn" onclick="syncNow(false)" data-i18n="s.syncNow"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="s.display"></h2>
      <div class="row" style="margin-bottom:10px">
        <span class="grow" data-i18n="s.theme"></span>
        <button class="btn" onclick="toggleTheme()" id="theme-name"></button>
      </div>
      <div class="row">
        <span class="grow" data-i18n="s.fontsize"></span>
        <button class="btn" onclick="stepFont(-1)">A−</button>
        <span id="font-size-label" class="mono small" style="min-width:44px;text-align:center">100%</span>
        <button class="btn" onclick="stepFont(1)">A+</button>
        <button class="btn ghost" onclick="applyFontSize(2)" data-i18n="s.reset"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="s.data"></h2>
      <div class="row">
        <button class="btn grow" onclick="exportJson()" data-i18n="s.export"></button>
        <button class="btn grow" onclick="document.getElementById('imp').click()" data-i18n="s.import"></button>
        <input type="file" id="imp" accept="application/json,.json" class="hidden" onchange="importJson(this)">
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn danger grow" onclick="resetAll()" data-i18n="s.wipe"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="s.about"></h2>
      <p class="small muted" data-i18n-html="s.aboutTxt"></p>
    </div>
    <div class="footer">pcm001 · v1.0 · 2026-10-02</div>
  </div>
</div>
<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-btn" class="hidden"></button></div>

function hsh(s) { var x = 7; for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) | 0; return x; }

  if (!S.self || typeof S.self !== 'object') S.self = { draft: { b: {}, p: {} }, results: [] };

  if (!Array.isArray(S.people)) S.people = [];

function computeResult() {
  var bs = {}, firsts = {}, ps = {};
  TT.forEach(function (k) { bs[k] = 0; firsts[k] = 0; ps[k] = 0; });
  QB.forEach(function (q) {
    var a = S.self.draft.b[q.id] || [];
    if (a[0]) { bs[a[0]] += 2; firsts[a[0]]++; }
    if (a[1]) bs[a[1]] += 1;
  });
  QP.forEach(function (q) { var a = S.self.draft.p[q.id]; if (a) ps[a]++; });
  var order = TT.slice().sort(function (a, b) { return (bs[b] - bs[a]) || (firsts[b] - firsts[a]) || (TT.indexOf(a) - TT.indexOf(b)); });
  var max = 0; TT.forEach(function (k) { if (ps[k] > max) max = ps[k]; });
  var tied = order.filter(function (k) { return ps[k] === max; });
  var phase = tied[0];
  return { id: uid(), date: today(), order: order, bs: bs, ps: ps, base: order[0], phase: phase, tie: tied.length > 1 ? tied : null, manual: false };
}

/* =========================================================
   GOOGLE DRIVE SYNC
   ========================================================= */
var tok = null;
try { tok = JSON.parse(sessionStorage.getItem(TOK_KEY) || 'null'); } catch (e) { tok = null; }
var tokenClient = null, fileId = '', syncCode = 'local', syncAt = null, syncing = false;
try { fileId = localStorage.getItem(FID_KEY) || ''; } catch (e) {}
function tokValid() { return !!(tok && tok.t && tok.exp > Date.now() + 30000); }
function setSync(code) {
  syncCode = code;
  if (code === 'ok') syncAt = new Date();
  var el = document.getElementById('sync-st');
  var txt = t('sync.' + code);
  if (code === 'ok' && syncAt) txt += ' ' + syncAt.toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit' });
  if (window.innerWidth < 520) txt = txt.split(' ')[0] + (code === 'ok' && syncAt ? ' ' + syncAt.toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit' }) : '');
  el.textContent = txt;
  el.title = code === 'err' ? t('sync.reauth') : t('sync.' + code);
}
function syncClick() { if (syncCode === 'err' || !tokValid()) go('settings'); else syncNow(false); }
function initGis() {
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true;
  s.onload = function () {
    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPE,
        callback: function (resp) {
          if (!resp || resp.error || !resp.access_token) { setSync('err'); return; }
          tok = { t: resp.access_token, exp: Date.now() + (parseInt(resp.expires_in, 10) || 3600) * 1000 };
          try { sessionStorage.setItem(TOK_KEY, JSON.stringify(tok)); } catch (e) {}
          renderSettings();
          syncNow(false);
        }
      });
    } catch (e) { /* GIS unavailable */ }
  };
  s.onerror = function () { tokenClient = null; };
  document.head.appendChild(s);
}
function driveConnect() {
  if (!tokenClient) { toast(t('sync.wait')); return; }
  tokenClient.requestAccessToken({ prompt: '' });
}
function gfetch(url, opt) {
  opt = opt || {};
  opt.headers = opt.headers || {};
  opt.headers.Authorization = 'Bearer ' + tok.t;
  return fetch(url, opt).then(function (r) {
    if (r.status === 401) { tok = null; try { sessionStorage.removeItem(TOK_KEY); } catch (e) {} throw new Error('auth'); }
    if (r.status === 404) { fileId = ''; try { localStorage.removeItem(FID_KEY); } catch (e) {} throw new Error('404'); }
    if (!r.ok) throw new Error('http ' + r.status);
    return r;
  });
}
function findFile() {
  if (fileId) return Promise.resolve(fileId);
  var q = encodeURIComponent("name='" + DRIVE_NAME + "' and trashed=false");
  return gfetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)')
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.files && j.files.length) { fileId = j.files[0].id; try { localStorage.setItem(FID_KEY, fileId); } catch (e) {} } return fileId; });
}
function readRemote() { return gfetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media').then(function (r) { return r.json(); }); }
function pushRemote() {
  var body = JSON.stringify(S);
  if (fileId) {
    return gfetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media&fields=id', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: body });
  }
  var bd = 'pcm001b' + Date.now();
  var multi = '--' + bd + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name: DRIVE_NAME, mimeType: 'application/json' }) +
    '\r\n--' + bd + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + bd + '--';
  return gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + bd }, body: multi })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.id) { fileId = j.id; try { localStorage.setItem(FID_KEY, fileId); } catch (e) {} } });
}
function adoptRemote(remote) {
  S = remote; ensureState(); saveLocal();
  renderAll();
}
function syncNow(quiet) {
  if (!tokValid()) { setSync(tok ? 'err' : 'local'); if (!quiet && !tok) go('settings'); return; }
  if (syncing) return;
  syncing = true;
  setSync('pending');
  findFile()
    .then(function (id) {
      if (!id) return pushRemote();
      return readRemote().then(function (remote) {
        var ru = remote && typeof remote.updatedAt === 'number' ? remote.updatedAt : 0;
        if (ru > (S.updatedAt || 0)) { adoptRemote(remote); if (!quiet) toast(t('sync.pulled')); return null; }
        if (ru < (S.updatedAt || 0)) return pushRemote();
        return null;
      });
    })
    .then(function () { syncing = false; setSync('ok'); renderSettings(); })
    .catch(function (e) {
      syncing = false;
      if (e && e.message === '404') { syncNow(quiet); return; }
      setSync('err'); renderSettings();
    });
}
function poll() {
  if (!tokValid() || pushTimer || syncing) return;
  if (document.visibilityState && document.visibilityState !== 'visible') return;
  if (UI.test || UI.manual) return;
  syncNow(true);
}

/* ---------------- RENDER ALL ---------------- */
function renderAll() {
  renderMe(); renderPeople(); renderStress(); renderGuide(); renderSettings();
  setSync(syncCode);
}

/* ---------------- INIT ---------------- */
(function init() {
  var saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
  LANG = saved || ((navigator.language || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
  loadLocal();
  applyTheme(localStorage.getItem(TK) || 'light');
  applyStatic();
  applyFontSize(parseInt(localStorage.getItem(FS_KEY) || '2', 10));
  setSync(tokValid() ? 'pending' : (tok ? 'err' : 'local'));
  renderAll();
  initGis();
  if (tokValid()) syncNow(true);
  setInterval(poll, 60000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') poll(); });
  window.addEventListener('resize', function () { setSync(syncCode); });
  document.getElementById('boot').style.display = 'none';
})();
</script>
