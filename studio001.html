[`Dead notes`,`muted bass ghost notes`,`Pitchless bass notes played with the string blocked. Purely rhythmic, they fill the 16th notes in funk.`,'style:funk'],
[`Octave bass`,``,`Alternating the fundamental and its octave in eighth notes. Disco's most typical bass move.`,'style:disco'],
[`Outrun`,``,`Synthwave's fast, driving side, inspired by 80s racing games and title sequences.`,'style:synthwave'],
[`Phaser`,``,`A comb-filtering effect that sweeps across the spectrum, creating a swirling motion. A frequent companion to the filter in French Touch.`,'style:french'],
[`Polymeter`,``,`Layering loops of different lengths, for instance 3 steps against 16. The offsets create techno's hypnotic feel.`,'style:techno'],
[`Bridge`,`middle eight`,`A single section placed after the second chorus, providing contrast before the final chorus.`,'style:pop'],
[`Pre-chorus`,``,`A short section between verse and chorus that raises the tension so the chorus can release it.`,'style:pop'],
[`Bitcrusher`,`resolution reduction, 12-bit`,`Deliberate degradation of resolution or sample rate, to recapture the grain of early samplers.`,'style:boombap'],
[`Chorus`,`hook`,`A song's most memorable, densest section, repeated identically. In pop: wider, higher, fuller than the verse.`,'style:pop'],
[`Gated reverb`,``,`A large reverb abruptly cut off by a noise gate after a fraction of a second. The 80s snare sound.`,'style:synthwave'],
[`Hi-hat roll`,``,`A burst of 32nd-note or triplet hi-hats with ramping velocities. A signature of trap-influenced hip-hop.`,'style:hiphop'],
[`Rumble`,``,`Continuous low end between the kicks of a techno track, obtained by sending the kick into a low-pass filtered reverb, ducked by the kick.`,'style:techno'],
[`Sample`,``,`An extract from an existing recording, reused as raw material. Subject to clearance if it comes from a protected work.`,'style:french'],
[`Scratch`,``,`A sound produced by moving a record by hand under the needle. Used as rhythmic punctuation, especially in boom bap choruses.`,'style:boombap'],
[`Slap`,``,`A bass technique: the thumb strikes the string, the index finger snaps it. Percussive, bright sound, typical of funk and disco.`,'style:funk'],
[`SP-1200`,`E-mu SP-1200`,`A 1987 12-bit sampler with a very short sampling time. Its gritty grain is inseparable from boom bap.`,'style:boombap'],
[`Stab`,``,`A very short chord hit, used as a harmonic percussion. Organ in house, horns in funk, delay-treated chord in techno.`,'style:house'],
[`The One`,``,`Funk's founding principle: every musician accents the first beat of the bar, and syncopates freely in between.`,'style:funk'],
[`Topline`,`vocal line`,`The vocal melody and its lyrics, written over an existing production. In pop, it's what makes the song.`,'style:pop'],
[`TR-909`,``,`A 1983 drum machine. Its kick, hi-hats and clap are the drum sound of house and techno.`,'style:house'],
[`Trap`,``,`A hip-hop movement born in the southern United States: long 808s, hi-hat rolls, snare on the 3, dark atmospheres.`,'style:hiphop'],
[`Two-step`,``,`Drum & bass's basic pattern: kick on the 1, snare on the 2, kick just before the 3, snare on the 4.`,'style:dnb'],
[`Vamp`,``,`One or two chords repeated indefinitely, on top of which the groove settles. The basis of funk and disco.`,'style:funk'],
[`Vocal chop`,``,`An isolated fragment of voice replayed rhythmically, like an instrument. Common in house and electronic pop.`,'style:house'],

[`Multitrack`,``,`A recorder that splits instruments across independent tracks, which can be redone and mixed separately.`,'era:70s'],
[`Tape saturation`,``,`The gentle compression and rounded highs produced by a tape recorded hot. Analog "warmth".`,'era:70s'],
[`Overdub`,`re-recording`,`Adding a new part on top of an existing recording, while listening to what's already on tape.`,'era:70s'],
[`Bleed`,`spill`,`Sound from one instrument picked up by another's mic when several musicians play in the same room. Glues the ensemble together.`,'era:70s'],
[`Wow and flutter`,``,`Slight pitch variations caused by speed irregularities in a tape or a turntable.`,'era:70s'],
[`MIDI`,``,`A 1983 standard that transmits notes and settings between instruments, sequencers and computers. It's not sound, it's instructions.`,'era:80s'],
[`Sequencer`,``,`A machine or piece of software that records and replays notes. Lets you program a part instead of playing it.`,'era:80s'],
[`Noise gate`,`gate`,`Cuts the signal when it drops below a threshold. Cleans up a take, or truncates a reverb for the gated effect.`,'era:80s'],
[`Console automation`,``,`Recording of the mixing console's fader movements. Appeared in the late 70s, became widespread in the 80s.`,'era:80s'],
[`Time-stretch`,``,`Changing a sound's length without changing its pitch. Early algorithms left a metallic grain that became a signature.`,'era:90s'],
[`Home studio`,`project studio`,`A personal studio made possible first by affordable digital multitracks, then by the computer.`,'era:90s'],
[`Crate digging`,`digging`,`Searching through bins of vinyl for passages to sample.`,'era:90s'],
[`Loudness war`,``,`The race for the loudest possible master, from the 90s to the late 2000s, at the expense of dynamics. Streaming normalization ended it.`,'era:00s'],
[`DAW`,`digital audio workstation`,`Software that combines recording, instruments, effects and mixing. Ableton Live, Logic, Pro Tools, Reaper.`,'era:00s'],
[`In the box`,`ITB`,`Producing and mixing entirely inside the computer, with no outboard gear.`,'era:00s'],
[`Plugin`,`VST, AU`,`A software instrument or effect that loads into a DAW.`,'era:00s'],
[`Comping`,``,`Assembling the best take from fragments of several takes, sometimes syllable by syllable.`,'era:00s'],
[`Drum replacement`,``,`Replacing or reinforcing each hit of a recorded drum kit with a sample.`,'era:00s'],
[`Quantize amount`,`quantize strength`,`How far, as a percentage, a note actually travels toward the grid. At 50%, each note goes halfway.`,'focus:swing'],
[`Microtiming`,``,`Millisecond-level offsets from the grid that give a groove its character.`,'focus:swing'],
[`Ahead of / behind the beat`,`laid back`,`Consistently playing a touch early (edgy) or a touch late (laid-back) relative to the pulse.`,'focus:swing'],
[`Shuffle`,``,`Swing close to a triplet, around 66%. Also: the old name for the swing control on drum machines.`,'focus:swing'],
[`Triplet`,``,`Three equal notes in the time of two. A 66.7% swing amounts to playing the first and third note of a triplet.`,'focus:swing'],
[`Groove template`,`Extract Groove`,`A placement and velocity fingerprint lifted from a recording, applicable to other clips.`,'focus:swing'],
[`Track Delay`,``,`A millisecond setting that pushes an entire track forward or back. The simplest microtiming tool there is.`,'focus:swing'],
[`Drunk beat`,`Dilla feel`,`An unquantized groove where instruments carry contradictory offsets, associated with J Dilla and later neo-soul.`,'focus:swing'],
[`OTT`,`extreme multiband compression`,`A multiband compression setting that lifts quiet details and squashes loud ones in every band. The hyper-detailed sound of the 2010s; use sparingly.`,'era:10s'],
[`Type beat`,``,`An instrumental posted online referencing a known artist's name, so rappers and singers can find and buy it.`,'era:10s'],
[`Future bass`,``,`A 2010s electronic style: wide synth chords, rhythmically chopped and modulated, over half-time grooves.`,'era:10s'],
[`Loudness normalization`,`streaming normalization`,`A platform's automatic alignment of every track's perceived volume. Ended the loudness war.`,'era:10s'],
[`Stems`,``,`A track's sub-mixes: vocals, drums, bass, instruments. Traded to collaborate or remix.`,'era:20s'],
[`Stem separation`,`demixing`,`Using AI to isolate vocals, drums, bass and the rest from an already-mixed file.`,'era:20s'],
[`AI generation`,`text-to-music`,`Producing a track or a passage from a text description. Commercial usage terms are changing fast.`,'era:20s'],
[`Spatial audio`,`Dolby Atmos, immersive audio`,`A mix where sounds are placed in three-dimensional space, played back on headphones or a multichannel system.`,'era:20s'],
[`Sped-up version`,`nightcore`,`A track played faster and higher, popularized by short-form video and later released officially. Its counterpart: slowed and reverbed.`,'era:20s'],
[`Log drum`,`amapiano`,`A percussive, tuned bass sound, a signature of South African amapiano, placed in syncopations between straight and swung.`,'era:20s'],
[`Drill`,``,`A hip-hop style: heavily slid 808s, triplet hi-hats, offset snare, dark atmospheres.`,'era:20s'],

[`Distributor`,`aggregator`,`An intermediary that delivers your music to streaming platforms and pays you master royalties.`,'focus:marketing'],
[`ISRC`,``,`A recording's unique identifier. It's what lets streams be counted and royalties attributed correctly.`,'focus:marketing'],
[`UPC / EAN`,``,`A release's identifier as a whole (single, EP, album), like a record's barcode.`,'focus:marketing'],
[`Pre-save`,``,`A link that lets a listener add a track to their library before release, so it appears there on day one.`,'focus:marketing'],
[`Release Radar`,``,`Spotify's personalized playlist that surfaces new releases from an artist's followers every Friday.`,'focus:marketing'],
[`Editorial playlist`,``,`A playlist curated by the platform's own team. Reached only through the official pitch, never by paying.`,'focus:marketing'],
[`Algorithmic playlist`,``,`A playlist generated per listener from their own listening. It reacts to genuine engagement around a track.`,'focus:marketing'],
[`Curator`,``,`Someone who runs a playlist, blog, channel or show and chooses the tracks they feature.`,'focus:marketing'],
[`Artificial streaming`,`fake streams`,`Streams produced by bots or click farms. Prohibited, unpaid, and penalized by platforms.`,'focus:marketing'],
[`Smart link`,`link in bio`,`A page that gathers every link for a release and routes each visitor to their platform of choice.`,'focus:marketing'],
[`EPK`,`electronic press kit`,`An online page that gathers bio, photos, music, highlights and contact info, sent to industry professionals.`,'focus:marketing'],
[`Publishing / master rights`,`copyright and neighboring rights`,`Two separate streams: publishing rights pay the work (composition, lyrics), master rights pay the recording and its performers.`,'focus:marketing'],
[`Performing rights organization`,`PRO`,`A body that collects and distributes publishing royalties. Sacem in France, ASCAP/BMI/SESAC in the US.`,'focus:marketing'],
[`Sync`,`synchronization`,`Using a piece of music in a film, series, ad or game, under license.`,'focus:marketing'],
[`Split sheet`,``,`A written document that sets each collaborator's share of a work and a recording.`,'focus:marketing'],
[`Demo`,``,`A finished, unreleased track sent to a label to pitch it for release.`,'focus:marketing']
];

EN.QUIZ={
compo:[
 {q:`How many distinct notes does a scale like G minor contain?`,o:[`7`,`5`,`8`,`12`],e:`G A B♭ C D E♭ F: seven notes. 12 notes would be the full chromatic scale.`,ref:`Key`},
 {q:`You keep the same melody but change the chords under it. What changes the most?`,o:[`The perceived emotion`,`The tempo`,`The key, necessarily`,`The volume`],e:`Harmony carries the emotion: the same melody can sound sad, epic or funky depending on the chords.`,ref:`Harmony`},
 {q:`In the Gm – C alternation, which note gives the dorian (funk / disco) color?`,o:[`The natural E`,`The B flat`,`The F sharp`,`The D`],e:`G minor contains an E♭. The C major chord (C–E–G) brings a natural E: the major sixth characteristic of the dorian mode.`,ref:`the progression demo (Funk / disco)`},
 {q:`In a minor key, which chord gives the feeling of rest, of "home"?`,o:[`The i`,`The v`,`The VII`,`The ii°`],e:`The first degree is the resting point. Tension chords (v, VII, ii°) make you want to return there: that's what makes a loop go round.`,ref:`the 7 chords of the key`},
 {q:`A syncopation is…`,o:[`An accent placed between the strong beats`,`A key change`,`A four-note chord`,`A one-bar silence`],e:`Moving a 16th note off the beat creates rhythmic surprise: the basis of groove.`,ref:`Rhythm`},
 {q:`Which variation best preserves a motif's identity?`,o:[`Keep the rhythm and change only the last note`,`Change every note and the rhythm`,`Play it only once so it doesn't wear out`,`Change key on every repeat`],e:`A motif is recognized by its rhythm first. Only one thing changes at a time, or the listener hears a new idea.`,ref:`the motif and variation demo`},
 {q:`Your melody is in the scale but sounds "off" against the chords. Most effective fix?`,o:[`Place notes belonging to the current chord on the strong beats`,`Add more notes`,`Move the melody up an octave`,`Add reverb`],e:`Being in the scale isn't enough: accented notes must lean on the chord of the moment. Other notes are passing tones.`,ref:`the method, step 4`},
 {q:`Your track has three different melodies and no one remembers any of them. Best move?`,o:[`Keep the strongest one and repeat it with small variations`,`Add a fourth, catchier melody`,`Turn the melodies up in the mix`,`Change key`],e:`A hook is memorized through repetition. More ideas = less memorization, and mixing doesn't fix a composition problem.`,ref:`Melody & hook`}],
groove:[
 {q:`What is the backbeat?`,o:[`The snare or clap on beats 2 and 4`,`The kick on every beat`,`An open hi-hat on the offbeats`,`A roll at the end of a bar`],e:`It's the answer to the kick, the accent you clap your hands on. Almost all popular music rests on it.`,ref:`Roles`},
 {q:`"Four-on-the-floor" means…`,o:[`A kick on each of the four beats`,`Four drum tracks`,`A tempo of 4 BPM`,`Four bars of intro`],e:`It's the skeleton of disco, house and techno: a continuous, steady pulse.`,ref:`rhythmic signatures by style`},
 {q:`What does swing do?`,o:[`It delays the even 16th notes, creating a bounce`,`It gradually speeds up the tempo`,`It raises the velocity of the strong beats`,`It adds reverb to the hi-hats`],e:`At 50% everything is straight. The higher you go, the later the second 16th note of each pair arrives, up to a triplet feel.`,ref:`Swing, and the sequencer slider`},
 {q:`A ghost note is…`,o:[`A very soft hit placed between the accents`,`A note deleted by mistake`,`A kick with no attack`,`A note played outside the key`],e:`You don't consciously notice it, but it fills the space and gives the beat its motion.`,ref:`Ghost notes`},
 {q:`Why give hi-hats a hierarchy of velocities?`,o:[`Identical hits sound like a machine gun; accents create the pulse`,`To lower the overall volume`,`To avoid saturating the master`,`Because hi-hats have no pitch`],e:`Strong beats, medium offbeats, weak 16ths: that relief is what makes a hi-hat line "breathe".`,ref:`the "three ways to play it" demo`},
 {q:`In a classic house pattern, where does the open hi-hat fall?`,o:[`On every offbeat, between two kicks`,`At the same time as every kick`,`Only on beat 1`,`On beats 2 and 4 with the clap`],e:`Kick on the beat, open hi-hat on the "and": this low/high alternation is house's engine.`,ref:`the sequencer's House preset`},
 {q:`You apply 60% swing to the hi-hats but the bass stays straight. Result?`,o:[`Offsets that sound like mistakes: every rhythmic element needs the same swing`,`A richer groove, this is recommended`,`No audible difference`,`The bass becomes louder`],e:`Two different grids stacked together produce flams. Groove is a shared grid, common to everyone.`,ref:`the method, step 4`},
 {q:`You use a very long 808-style kick, and your bassline becomes unreadable. Why?`,o:[`A long kick occupies the low end continuously: shorten it or let it be the bass`,`The kick is too high-pitched`,`It's missing swing`,`The tempo is too slow`],e:`A long kick IS a bass. Either it takes on that role alone, or you shorten it to free space between hits.`,ref:`anatomy of a kick`},
 {q:`Your beat has a good pattern but sounds rigid and lifeless. First move?`,o:[`Work on velocities and a light swing, without adding anything`,`Add a percussion loop`,`Raise the tempo by 10 BPM`,`Compress the drum bus harder`],e:`The problem is almost always execution, not content. Three well-accented elements groove more than ten flat ones.`,ref:`the classic mistake`}],
bass:[
 {q:`What is the bass's dual role?`,o:[`It links rhythm (with the kick) and harmony (chord fundamentals)`,`It replaces the kick and hi-hats`,`It plays the lead melody and backing vocals`,`It's only there to fill the spectrum`],e:`It's the only part that belongs to both the rhythm section and the harmony at once.`,ref:`A dual role`},
 {q:`Below 100–120 Hz, the low end should be…`,o:[`Mono, centered`,`As wide as possible`,`Panned left`,`Reverbed`],e:`Stereo low end cancels out in mono and becomes unpredictable on a big system. Width is worked above that.`,ref:`Mono`},
 {q:`Why does a pure sine bass disappear on a phone?`,o:[`The speaker reproduces nothing below 150–200 Hz, and a sine has no harmonics above that`,`The phone over-compresses the signal`,`A sine wave is always too quiet`,`The phone plays in mono`],e:`No fundamental reproduced, no harmonics to suggest it: there is literally nothing left.`,ref:`the two-layer demo (sub alone + small speakers)`},
 {q:`What does light saturation on a sub do?`,o:[`Creates harmonics that make the note audible on small systems`,`Makes it lower`,`Widens it in stereo`,`Reduces its volume`],e:`The ear reconstructs the fundamental from its harmonics: you "hear" a 49 Hz the speaker isn't actually playing.`,ref:`Fundamental and harmonics`},
 {q:`What does note length change on a bassline?`,o:[`The groove: short notes bounce, held notes push`,`The track's key`,`The tempo`,`Nothing, only the starting position matters`],e:`Silence between notes is part of the rhythm. It's often the single most effective fix on a bassline that "isn't working".`,ref:`the bassline demo (length slider)`},
 {q:`You're stacking a sub and a mid layer. What treatment on the mid layer?`,o:[`A high-pass around 100–120 Hz, so it doesn't double the sub`,`A low-pass at 100 Hz`,`A boost at 50 Hz`,`None, both should cover the whole spectrum`],e:`Two sources in the sub create beating and cancellations. Each layer gets its own zone.`,ref:`the method, step 5`},
 {q:`Your track is in C. The low C fundamental sits at 33 Hz. What do you do?`,o:[`Play the bass an octave higher (65 Hz), reinforcing it with layers if needed`,`Boost 33 Hz with EQ`,`Keep 33 Hz: lower is always better`,`Put the bass in stereo`],e:`At 33 Hz, most systems reproduce nothing, and your limiter is working for a sound nobody hears.`,ref:`the key decides the weight`},
 {q:`In a classic house line, where do the bass notes fall to coexist with the kick with zero processing?`,o:[`On the offbeats, between the kicks`,`Exactly on every kick`,`Only on beat 1`,`In continuous 16th notes`],e:`Kick on the beat, bass on the "and": they never play together, so they never mask each other. Arrangement solves the problem before mixing does.`,ref:`the bassline demo (Offbeat)`},
 {q:`Your bass is huge on headphones but absent in the car and on the phone. Fix?`,o:[`Add harmonics: saturation or a mid layer`,`Turn the sub up 6 dB`,`Add reverb to the bass`,`Widen the bass in stereo`],e:`Turning up the sub changes nothing on systems that can't reproduce it, and eats into the master's headroom.`,ref:`the classic mistake`}],
arr:[
 {q:`In dance music, sections typically move forward in blocks of…`,o:[`8 or 16 bars`,`3 or 5 bars`,`10 bars`,`Exactly 1 minute`],e:`Powers of 2 (4, 8, 16, 32) structure almost all club music: the listener and the DJ anticipate the changes.`,ref:`Block structure`},
 {q:`Why remove the kick and bass during a break?`,o:[`So their return creates impact`,`To save CPU`,`Because reverb can't handle low frequencies`,`To shorten the track`],e:`Tension / release: no dip, no peak. The drop's impact comes from the absence that precedes it.`,ref:`Tension / release`},
 {q:`Your 8-bar loop is complete and sounds good. What's the fastest way to turn it into a track?`,o:[`Duplicate it across 5 minutes, then remove elements to carve out the sections`,`Compose a new loop for each section`,`Add tracks until it lasts 5 minutes`,`Slow down the tempo`],e:`This is subtractive arrangement: start from the densest moment (the final drop) and remove to create the intro, break and outro.`,ref:`the Ableton exercise`},
 {q:`What does a riser do?`,o:[`Announces a new section by raising tension`,`Increases the master's volume`,`Replaces the bassline`,`Fixes the tempo`],e:`Rising pitch and volume: the listener understands something is coming, and waits for it.`,ref:`transition tools`},
 {q:`Why cut everything for a beat right before the drop?`,o:[`Silence creates maximum contrast and reinforces the impact`,`To let the limiter rest`,`So the DJ can talk`,`To avoid a phase issue`],e:`Impact is about difference. Nothing contrasts more with "everything" than "nothing".`,ref:`the build demo (silence alone)`},
 {q:`How many elements can genuinely hold attention at the same time?`,o:[`Three or four`,`Only one`,`Eight to ten`,`As many as there are tracks`],e:`Rhythm, bass, harmony, vocal or lead. Beyond that, parts compete: if one comes in, another should drop out.`,ref:`density and attention`},
 {q:`You want drop 2 to top drop 1. What do you do?`,o:[`Keep an element in reserve for drop 2`,`Simply turn drop 2's volume up`,`Make drop 1 longer`,`Remove the break`],e:`A lead, a bass octave, an open hi-hat: whatever hasn't been heard yet makes the peak.`,ref:`Keep a reserve`},
 {q:`Your drop falls flat even though every element plays there. Most likely cause?`,o:[`Those elements were already playing just before: there's no contrast`,`It's missing an extra track`,`The master isn't loud enough`,`The tempo is too slow`],e:`If the bass and kick are already there during the build, nothing can "arrive". Pull them out 8 bars before.`,ref:`Contrast and the arrangement grid`}],
sd:[
 {q:`Which waveform contains every harmonic and sounds rich and bright?`,o:[`Sawtooth`,`Sine`,`Square`,`White noise`],e:`A sine has only the fundamental, a square only odd harmonics. Sawtooth is the ideal raw material for a filter.`,ref:`Waveform`},
 {q:`A low-pass filter set at 300 Hz…`,o:[`Attenuates what's above 300 Hz`,`Attenuates what's below 300 Hz`,`Only boosts the zone around 300 Hz`,`Cuts the volume 300 times a second`],e:`Low-pass = lets the low through. It's the resonance, not the filter itself, that accentuates the zone around the cutoff.`,ref:`Filter`},
 {q:`You want to turn a percussive bass into a pad, without changing preset. What do you change first?`,o:[`The envelope's attack (and release), by lengthening them`,`The waveform`,`The pan`,`The key`],e:`The percussive or floaty character comes from the volume envelope. Test it in the demo with a 300 ms attack.`,ref:`ADSR envelope`},
 {q:`What is an LFO for?`,o:[`Automatically varying a setting over time`,`Producing low notes`,`Filtering highs`,`Increasing the number of voices`],e:`It's an oscillator too slow to be heard, used like an invisible hand on a knob.`,ref:`the LFO demo`},
 {q:`A square LFO synced to 1/16 on the cutoff produces…`,o:[`A choppy, rhythmic effect, synced to the tempo`,`A slow rise over 16 bars`,`A wider stereo sound`,`No audible effect`],e:`A square wave switches abruptly between open and closed; at 1/16 that chops the sound into 16th notes.`,ref:`the LFO demo`},
 {q:`What does unison with detune produce?`,o:[`A thicker, wider sound`,`A lower sound`,`A shorter sound`,`A perfectly stable mono sound`],e:`Several slightly detuned copies beat against each other: density, width, motion.`,ref:`the unison demo`},
 {q:`You're after a metallic bell or electric-piano sound. Which synthesis?`,o:[`FM`,`Subtractive with a sine`,`A very closed low-pass`,`Unison on a sawtooth`],e:`Frequency modulation generates inharmonic partials, typical of metallic timbres. In Live: Operator.`,ref:`four synthesis families`},
 {q:`You put 7 heavily detuned unison voices on your bass. The low end is blurry and unstable. Why?`,o:[`Detuned voices cancel each other out at times in the low end: the sub should stay a single, mono voice`,`There aren't enough voices`,`The cutoff is too low`,`The tempo is too fast`],e:`Beating between voices creates level dips that are very audible in the low end. Unison on the mid layer, sub kept separate and mono.`,ref:`the method, step 6`},
 {q:`Your lead synth is harsh and masks the vocal. First move on the sound-design side?`,o:[`Lower the low-pass cutoff`,`Increase the resonance`,`Switch from sine to sawtooth`,`Shorten the release`],e:`The harshness comes from high harmonics: lowering the cutoff removes them at the source, before you even touch the mix.`,ref:`Filter`}],
voix:[
 {q:`In a vocoder, what role does the voice play?`,o:[`Modulator`,`Carrier`,`Limiter`,`Metronome`],e:`The voice modulates the synth: it imposes its articulation onto it, band by band.`,ref:`Vocoder: modulator and carrier`},
 {q:`What determines the pitches heard at a vocoder's output?`,o:[`The carrier (the synth)`,`The melody sung into the mic`,`The number of bands`,`The tempo`],e:`The voice only supplies articulation. You could speak in a monotone: the notes come from the keyboard.`,ref:`Who decides what`},
 {q:`What tells an "ah" from an "ee" sung on the same note?`,o:[`Formants, resonance peaks tied to the shape of the mouth`,`The volume`,`The fundamental frequency`,`The room's reverb`],e:`The source (vocal cords) is the same; it's the filter (the mouth) that changes. The vowel demo shows this with three filters.`,ref:`the vowel demo`},
 {q:`What's the effect of a vocoder's band count?`,o:[`Few bands: robotic and blurry. Many: precise and intelligible`,`More bands = more volume`,`More bands = a lower sound`,`No audible effect`],e:`Each band is a "pixel" of the voice's spectrum. 8 to 16 gives a retro grain, 32 to 40 modern clarity.`,ref:`the vocoder demo (4 vs 32 bands)`},
 {q:`Why do "s", "t", "ch" sounds come through poorly in a vocoder?`,o:[`They're pitchless noise, which a harmonic carrier reproduces poorly`,`They're too low-pitched`,`The mic doesn't pick them up`,`The limiter removes them`],e:`Unvoiced consonants are broadband noise. The fix: add noise to the carrier at those moments — that's the Unvoiced setting's job.`,ref:`Voiced / unvoiced`},
 {q:`What's the difference between a vocoder and Auto-Tune style pitch correction?`,o:[`A vocoder replaces the sound source with a synth; correction keeps the voice and snaps its pitch`,`None, they're two names for the same effect`,`A vocoder only works in mono`,`Pitch correction adds chords`],e:`With a vocoder you no longer hear the singer's vocal cords, only their articulation. With correction, it's still their voice.`,ref:`four effects people confuse`},
 {q:`Your vocoder sounds dull and unintelligible. The carrier is a low sine. Fix?`,o:[`A harmonic-rich carrier: sawtooth, played as held chords`,`Turn up the voice volume`,`Add reverb`,`Reduce the band count to 4`],e:`A vocoder sculpts existing harmonics. A sine has none: there's nothing to sculpt between 300 Hz and 3 kHz.`,ref:`the classic mistake`},
 {q:`On a lead vocal, where should you place the high-pass?`,o:[`Around 80–100 Hz`,`Around 1 kHz`,`Around 20 Hz, so pointless`,`Always around 500 Hz`],e:`Below 80–100 Hz, a vocal contains only handling noise, plosives and rumble.`,ref:`the lead vocal chain, step 1`},
 {q:`Whole words disappear from your vocoded voice when the singer sings quietly. What do you do?`,o:[`Compress the voice before the vocoder to stabilize its level`,`Add more bands`,`Change the carrier's key`,`Turn up the reverb`],e:`The voice's level opens the bands. Quiet voice = closed bands = silence. A steady modulator is the condition for an intelligible vocoder.`,ref:`making a vocoder intelligible`}],
mix:[
 {q:`What's the first mixing tool, before any plugin?`,o:[`Volume faders`,`The compressor`,`Reverb`,`The limiter`],e:`Volume balance does most of the work in a mix. A plugin doesn't fix a wobbly balance.`,ref:`Volume balance`},
 {q:`Why put a high-pass on vocals, pads and hi-hats?`,o:[`To remove useless low end that piles up and gets in the way of the kick and bass`,`To make them louder`,`To add brightness`,`To make them mono`],e:`Each track adds a bit of inaudible low end on its own; added together, they muddy the bottom of the spectrum.`,ref:`Subtractive EQ`},
 {q:`Kick and bass are fighting around 60 Hz. What do you do?`,o:[`Give the sub to one of them and carve the other out there`,`Boost 60 Hz on both`,`Add reverb to the bass`,`Pan the bass left`],e:`Two sources can't dominate the same zone. You decide who owns the sub and carve out the other. The low end stays centered.`,ref:`the kick / bass example`},
 {q:`You want to naturally add brightness across a vocal's whole top end. Which filter?`,o:[`A high shelf`,`A notch`,`A high-pass`,`A very narrow bell at 10 kHz`],e:`A shelf gently boosts everything beyond a frequency. A narrow bell would create an artificial resonance.`,ref:`the 5 filter shapes`},
 {q:`What's the right rule for setting Q?`,o:[`Narrow cuts, wide boosts`,`Wide cuts, narrow boosts`,`Always the highest possible Q`,`Q has no audible effect`],e:`A narrow cut removes a flaw without damaging the rest. A narrow boost sounds resonant and artificial; wide, it stays natural.`,ref:`the Q rule`},
 {q:`How do you precisely locate an offending frequency in a sound?`,o:[`Narrow bell at +10 dB, sweep the spectrum, then cut where it's most unpleasant`,`Cut randomly until it improves`,`Solo the track and turn up the volume`,`Add reverb to mask it`],e:`This is the sweep technique: exaggerate to find it, then flip the gain with restraint (−3 to −6 dB).`,ref:`the method, step 3`},
 {q:`In the demo, the EQ'd pad sounds thin soloed but the mix sounds better. Conclusion?`,o:[`Normal: you judge an EQ move in the mix, not in solo`,`Undo the EQ: the pad should sound good alone`,`Boost the pad's low end back up`,`Turn the kick down`],e:`Each track only needs its share of the spectrum. A "complete" sound in solo is often a cluttering sound in the mix.`,ref:`the EQ-in-context demo`},
 {q:`Your mix sounds "muddy", lacking definition. Which zone to check first?`,o:[`The low-mids, 250–500 Hz`,`Air, 12–20 kHz`,`The high-mids, 2–6 kHz`,`The sub, 20–60 Hz`],e:`It's the zone where almost every instrument piles up. A slight dip on pads and guitars often clears everything up.`,ref:`the frequency map`}],
comp:[
 {q:`A compressor's threshold is…`,o:[`The level above which it starts acting`,`The speed at which it reacts`,`The volume added at the output`,`The frequency it processes`],e:`Below the threshold, the compressor does nothing. Speed is the attack; output volume is the make-up gain.`,ref:`Threshold`},
 {q:`Ratio 4:1. The signal overshoots the threshold by 8 dB. By how much does it overshoot at the output?`,o:[`2 dB`,`4 dB`,`8 dB`,`32 dB`],e:`8 ÷ 4 = 2. The overshoot is divided by the ratio.`,ref:`Ratio`},
 {q:`You want to control the snare while keeping its punch. Which attack?`,o:[`Slow, 20–30 ms`,`As fast as possible`,`Doesn't matter, only the ratio counts`,`The same as the release`],e:`A slow attack lets the initial hit (the transient) through before compressing the body of the sound.`,ref:`Attack, check it in the demo`},
 {q:`To get the French-house "pumping" on a pad, the compressor is…`,o:[`Placed on the pad and triggered by the kick`,`Placed on the kick and triggered by the pad`,`Placed on the master with no sidechain`,`Replaced by a reverb`],e:`Sidechain: the compressor processes the pad but listens to the kick. On every kick, the pad ducks and comes back.`,ref:`the sidechain demo`},
 {q:`Parallel compression means…`,o:[`Blending the untouched signal with a heavily compressed copy`,`Chaining two compressors one after the other`,`Compressing left and right separately`,`Compressing only the highs`],e:`You keep the original signal's hits and add the crushed copy's density underneath.`,ref:`the parallel compression demo`},
 {q:`Which compressor character to pick for "gluing" a drum bus or a mix?`,o:[`A bus-style VCA, like Glue Compressor`,`A FET pushed hard`,`A noise gate`,`None: a bus should never be compressed`],e:`Precise and transparent, with 2–3 dB of reduction: it ties elements together without imposing an aggressive color.`,ref:`four compressor characters`},
 {q:`Why start setting a compressor with a very low threshold and a high ratio?`,o:[`To clearly hear the effect of attack and release before dialing it in`,`Because it's the recommended final setting`,`To protect the speakers`,`To gain volume`],e:`At 1–2 dB of reduction, time settings are almost inaudible. You exaggerate to dial it in, then back off to reason.`,ref:`the method, step 2`},
 {q:`The compressed version sounds better to you, but it's also louder. What do you do?`,o:[`You compare at matched volume before deciding`,`You keep it: louder is better`,`You raise the ratio even more`,`You add a second compressor`],e:`The ear almost always prefers the louder one. Adjust make-up so bypass on/off sit at the same level, then judge.`,ref:`the classic mistake`}],
space:[
 {q:`In a mix, a dry sound (no reverb) is perceived as…`,o:[`Close`,`Distant`,`Lower`,`Wider`],e:`Reverb is a distance cue: the more of it there is, the farther away the source seems.`,ref:`Reverb`},
 {q:`What is a reverb's pre-delay for?`,o:[`Separating the direct sound from the reverb so it stays up front`,`Lengthening the reverb tail`,`Locking the reverb to the key`,`Reducing CPU usage`],e:`20–40 ms of silence before the reverb: the brain first perceives the clear voice, then the space behind it.`,ref:`Pre-delay`},
 {q:`At 120 BPM, how long is an eighth note (1/8)?`,o:[`250 ms`,`500 ms`,`125 ms`,`375 ms`],e:`Quarter note = 60,000 ÷ 120 = 500 ms. The eighth note is half that: 250 ms. 375 ms would be the dotted eighth.`,ref:`the delay calculator`},
 {q:`Which reverb is the classic choice for a vocal or snare: dense, bright, 1 to 2 s?`,o:[`Plate`,`Spring`,`A 5 s hall`,`None, they should stay dry`],e:`A plate gives body and shine without drawing an identifiable room, so without pushing the source back.`,ref:`four types of reverb`},
 {q:`On a delay, what does feedback set?`,o:[`The number of repeats`,`The time between repeats`,`The dry signal's volume`,`The stereo width`],e:`Part of the output is fed back into the input: the more there is, the longer the echoes last. Near 100%, they never die out.`,ref:`the delay demo`},
 {q:`Why darken (low-pass) a delay's repeats?`,o:[`So they recede behind the source, like a natural echo`,`To make them louder`,`To speed them up`,`To save CPU`],e:`In nature, an echo loses its highs. Repeats as bright as the original fight with it.`,ref:`the delay demo`},
 {q:`Dense verse: the vocal needs space without being drowned. You favor…`,o:[`A subtle delay rather than a long reverb`,`A loud 4 s hall`,`A 100% wet reverb insert`,`No effect, and you turn the vocal up 6 dB`],e:`Delay fills the silences between words and leaves the words themselves clear; a long reverb adds a continuous haze.`,ref:`the method, step 5`},
 {q:`Blurry mix, cluttered low end, and a different reverb inserted on every track. What's the fix?`,o:[`One shared reverb on a return, with a high-pass on that return`,`Lengthen each reverb's decay`,`Also add reverb to the kick and bass`,`Turn up the overall volume`],e:`A shared space gives coherence, and the high-pass stops the reverb from adding mud. Kick and bass stay dry.`,ref:`Send / return`}],
master:[
 {q:`What does LUFS measure?`,o:[`Perceived loudness, averaged over time`,`The instantaneous peak level`,`Stereo width`,`The number of tracks`],e:`A peak meter sees spikes; LUFS reflects what the ear feels as "loud". It's the platforms' unit.`,ref:`LUFS`},
 {q:`Why set the limiter's ceiling at −1 dBTP instead of 0?`,o:[`MP3/AAC encoding can recreate higher peaks`,`To gain 1 dB of volume`,`Because platforms reject 0 dB files`,`To widen the stereo image`],e:`Lossy compression alters the waveform: without headroom, some peaks exceed 0 and clip on playback.`,ref:`Limiter & true peak`},
 {q:`Your master is at −8 LUFS. On a platform that normalizes to −14 LUFS, it will be…`,o:[`Turned down about 6 dB`,`Turned up about 6 dB`,`Played as-is, louder than others`,`Rejected`],e:`−14 − (−8) = −6 dB. It will play at the same level as everything else, but with the dynamics you crushed.`,ref:`the LUFS simulator`},
 {q:`In a mastering chain, where does the limiter sit?`,o:[`Last (before any dither)`,`First`,`Right before the EQ`,`It doesn't matter`],e:`Any processing placed after it can recreate peaks above the ceiling it's supposed to guarantee.`,ref:`the chain, in order`},
 {q:`Why check your mix in mono?`,o:[`To catch elements that cancel out through phase opposition`,`Because streaming plays back in mono`,`To gain volume`,`To reduce file size`],e:`What's wide through phase inversion disappears when left and right are summed, as on many small systems.`,ref:`the mono compatibility demo`},
 {q:`Which mix should you send to mastering?`,o:[`Peaks around −6 dB, no limiter on the master, as a 24-bit WAV`,`As loud as possible, already limited`,`A 320 kbps MP3`,`Normalized to 0 dB with a maximizer`],e:`Headroom leaves room for processing, and a lossless file avoids stacking degradations.`,ref:`before mastering`},
 {q:`At matched volume, the version with the limiter pushed hard doesn't sound better than the original. Conclusion?`,o:[`The gain was an illusion of loudness: back off`,`Push it even harder`,`Disable the level matching`,`Add a second limiter`],e:`If the advantage disappears at matched level, only the downsides remain: flattened transients and listening fatigue.`,ref:`the limiter demo`},
 {q:`After the limiter, your kick has lost its impact. What do you do?`,o:[`Reduce the limiter's input gain: it's crushing the transients`,`Push the limiter harder still`,`Add highs to the master`,`Sum the track to mono`],e:`Beyond a few dB of reduction, transients are the first thing to disappear. Quieter, but alive.`,ref:`the classic mistake`}],
'style:disco':[
 {q:`In disco, where does the open hi-hat fall?`,o:[`On every offbeat`,`On every beat, with the kick`,`Only on beat 4`,`On beats 2 and 4`],e:`Kick on the beat, open hi-hat on the "and": the alternation house will later borrow wholesale.`,ref:`Disco · Drums`},
 {q:`What's disco's most typical bass move?`,o:[`Fundamental and octave alternating in eighth notes`,`One held note per chord`,`A long 808 with slides`,`16th notes everywhere except on the kick`],e:`Two notes, maximum energy. It's also a line that reads clearly on any system.`,ref:`Disco · Bass`},
 {q:`How do you write disco strings?`,o:[`In phrases that come and go, in 4- or 8-bar blocks`,`As a continuous pad from start to finish`,`In unison with the bass`,`Only in the intro`],e:`Strings phrase and punctuate. A permanent pad clogs the mids and kills any sense of entrance.`,ref:`Disco · Harmony and instruments`},
 {q:`Your disco production sounds stiff and synthetic. Most likely cause?`,o:[`Everything is quantized 100% with flat velocities`,`The tempo is too slow`,`It's missing an 808`,`There isn't enough sidechain`],e:`Disco is played music: micro-timing and lively velocities make the difference, before any choice of sounds.`,ref:`Disco · Pitfalls`}],
'style:nudisco':[
 {q:`What's nu-disco's typical tempo range?`,o:[`110–122 BPM`,`125–135 BPM`,`85–95 BPM`,`170–175 BPM`],e:`Slower than house: that held-back tempo is what gives the groove its laid-back feel.`,ref:`Nu Disco · ID card`},
 {q:`What's the sidechain difference between nu-disco and French Touch?`,o:[`Dosed for bounce in nu-disco, deep for pumping in French Touch`,`None, it's the same setting`,`Nu-disco never uses it`,`French Touch places it on the kick`],e:`3 to 6 dB of reduction versus 8 to 12 dB: same tool, opposite intent.`,ref:`Nu Disco · Sonic signature`},
 {q:`How do you get nu-disco's typical drums?`,o:[`A programmed skeleton, doubled by real percussion loops`,`Only a sped-up sampled break`,`A drum machine alone, no swing`,`An acoustic kit recorded in one take`],e:`The machine / human blend is the signature: the precision of a programmed kick, the life of a tambourine and congas.`,ref:`Nu Disco · Drums`},
 {q:`Your nu-disco track at 126 BPM sounds like house. What do you do?`,o:[`Slow down below 122 BPM`,`Add sidechain`,`Remove the bass`,`Add hi-hat rolls`],e:`Past 122 BPM, the groove tightens and tips into house. The style hinges on its tempo first.`,ref:`Nu Disco · Pitfalls`}],
'style:french':[
 {q:`In French Touch, what's the main "instrument"?`,o:[`The filter, continuously automated`,`The piano`,`The 808`,`The lead guitar`],e:`The loop never changes: it's the filter opening and closing that tells the story.`,ref:`French Touch · The filter`},
 {q:`How long is a typical French Touch loop?`,o:[`One to two bars`,`Sixteen bars`,`A whole verse`,`Half a second`],e:`Short enough to become hypnotic, long enough to hold a syncopation on the repeat.`,ref:`French Touch · The loop`},
 {q:`How do you set the sidechain for the French Touch pump?`,o:[`8 to 12 dB of reduction, release timed so the sound returns just before the next kick`,`1 dB of reduction, a very long release`,`On the kick, triggered by the pad`,`Only on the hi-hats`],e:`Deep and rhythmic: the sound ducks on every kick and swells back up in between. Everything but the drums runs through it.`,ref:`French Touch · Sonic signature`},
 {q:`You want to release a track built on a sample from a 70s record. What should you do?`,o:[`Get clearance from the rights holders, replay the loop yourself, or start from royalty-free material`,`Nothing, under 5 seconds it's free to use`,`Filtering the sample makes it legal`,`Slow it down by 2 BPM`],e:`No duration is "free" by default, and transforming an extract doesn't change its status. General information, not legal advice.`,ref:`French Touch · Pitfalls`}],
'style:hiphop':[
 {q:`In trap-influenced hip-hop, where does the snare fall?`,o:[`On beat 3 (half-time feel)`,`On beats 2 and 4`,`On every beat`,`On the offbeats`],e:`At 140 BPM with the snare on the 3, the track feels like it's at 70: that's half-time.`,ref:`Hip Hop · Drums`},
 {q:`What role does the 808 play in a hip-hop beat?`,o:[`It acts as bass and part of the kick, tuned to the key`,`It replaces the hi-hats`,`It plays the lead melody up top`,`It's only used for transitions`],e:`It's a note: it has to be in the track's key, like any bass.`,ref:`Hip Hop · The 808`},
 {q:`How do you get a slide between two 808 notes in Live?`,o:[`Glide turned on in mono legato mode, with two overlapping notes`,`By automating volume`,`By adding a delay`,`By doubling the track`],e:`In legato, the second note doesn't re-trigger the attack: the pitch slides from one to the other.`,ref:`Hip Hop · In Ableton Live`},
 {q:`Your hip-hop beat's low end is a mush. Most likely cause?`,o:[`A long kick stacked with a long 808`,`Too many hi-hat rolls`,`A snare that's too loud`,`A tempo that's too fast`],e:`Two long sounds in the same zone. A short kick over the 808, with a light sidechain ducking the 808 from the kick.`,ref:`Hip Hop · Pitfalls`}],
'style:boombap':[
 {q:`What swing characterizes boom bap?`,o:[`Pronounced, 58–66%`,`None, 50%`,`Very light, 51–52%`,`Different every bar`],e:`It's a pad sampler's swing, clearly audible, which makes the beat drag.`,ref:`Boom Bap · The swing`},
 {q:`In boom bap, why low-pass filter the sample?`,o:[`To leave room for the vocal and the drums`,`To make it louder`,`To make it legal`,`To speed up the tempo`],e:`The sample becomes a warm, dull background; the top of the spectrum stays free for the snare and the rapper.`,ref:`Boom Bap · The sample`},
 {q:`How do you get a boom bap kit's "lazy" feel?`,o:[`Leave the snare a few milliseconds late, unquantized`,`Speed up the tempo`,`Set every velocity to maximum`,`Add hi-hat rolls`],e:`A constant snare delay gives the impression the drummer is dragging, without the tempo actually moving.`,ref:`Boom Bap · The swing`},
 {q:`Your boom bap beat sounds too clean and modern. Fix?`,o:[`Sounds taken from real breaks, resolution reduction, saturation, less extreme high end`,`Add a very deep sub`,`Widen the stereo`,`Raise the master's level`],e:`The style is defined by its grain: 12-bit samplers, vinyl, mids up front.`,ref:`Boom Bap · Sonic signature`}],
'style:pop':[
 {q:`In current pop, when should the first chorus arrive?`,o:[`Before about 45 seconds`,`After 2 minutes`,`Never before the bridge`,`Right at the end`],e:`Very short intro, verse, pre-chorus, chorus: the listener needs to have heard the hook before drifting off.`,ref:`Pop · Form`},
 {q:`What's the pre-chorus for?`,o:[`Raising the tension so the chorus can release it`,`Introducing the musicians`,`Replacing the bridge`,`Slowing the track down`],e:`It's a ramp: harmony left hanging, rising density, sometimes a gap right before the chorus.`,ref:`Pop · Form`},
 {q:`How do you make a pop chorus "lift off"?`,o:[`Wider (panned doubles), denser and higher than the verse`,`The exact same production, just louder`,`Remove the vocal`,`Slow the tempo`],e:`Contrast is what makes a chorus: a narrow, stripped-down verse, a wide, full chorus.`,ref:`Pop · Verse / chorus contrast`},
 {q:`During the verse, a synth lead is fighting the vocal. What do you do?`,o:[`Remove it or move it into the gaps between vocal phrases`,`Turn both up 3 dB`,`Add reverb to the vocal`,`Widen the synth`],e:`Nothing should compete with the vocal between 1 and 4 kHz while it's singing. It's an arrangement problem before it's a mix problem.`,ref:`Pop · Arrangement`}],
'style:house':[
 {q:`What sets house apart from a simple kick / clap pulse?`,o:[`Lightly swung hi-hats and percussion`,`A tempo above 140 BPM`,`No bass at all`,`A snare on beat 3`],e:`The 16th-note bounce, between 54 and 60%, is what makes house "roll".`,ref:`House · Drums`},
 {q:`What are parallel chords?`,o:[`The same chord shape moved as-is to other roots`,`Two chords played at once`,`Chords played an octave apart`,`An eight-chord progression`],e:`Inherited from samplers and the Chord device: you transpose the whole chord shape, without fitting it to the scale.`,ref:`House · The chords`},
 {q:`What kind of intro suits a house track aimed at DJs?`,o:[`16 to 32 bars of rhythm alone`,`Under 10 seconds`,`An a cappella verse`,`None, start with the drop`],e:`A DJ needs time and stable elements to beatmatch and layer the two tracks.`,ref:`House · Pitfalls`},
 {q:`Your eight-chord house progression breaks the hypnotic effect. What do you do?`,o:[`Cut it down to two well-voiced chords`,`Add four more`,`Change key every section`,`Remove the kick`],e:`The hypnosis comes from repetition. The richness lives in the voicing and the sound, not the chord count.`,ref:`House · Pitfalls`}],
'style:techno':[
 {q:`In techno, what is the rumble?`,o:[`A low growl between the kicks, made from a reverbed, filtered kick`,`A snare roll`,`A piano melody`,`A vocal effect`],e:`It plays the role of the bass without playing any notes, and ducks on every kick hit.`,ref:`Techno · The rumble`},
 {q:`What "composes" a techno track?`,o:[`The slow modulation of settings: cutoff, decay, reverb`,`A complex chord progression`,`The lyrics`,`Tempo changes`],e:`The material is minimal and fixed. It's its continuous evolution that creates the narrative.`,ref:`Techno · The synth`},
 {q:`In what order do you build a rumble?`,o:[`Send from the kick → reverb → low-pass around 120 Hz → sidechained by the kick → saturation`,`Saturation → limiter → kick`,`Reverb on the master`,`High-pass at 120 Hz then delay`],e:`The reverb builds the material, the low-pass keeps only the low end, the sidechain makes it duck under the kick.`,ref:`Techno · In Ableton Live`},
 {q:`Your 8-bar techno loop, repeated 40 times, is boring. Fix?`,o:[`Slowly modulate its settings, without adding a melody`,`Add a melody and chords`,`Raise the tempo to 170`,`Add a pop vocal`],e:`The difference between hypnotic and boring is motion. A melody would take it out of the style.`,ref:`Techno · Pitfalls`}],
'style:funk':[
 {q:`What does "The One" refer to?`,o:[`The shared accent every musician plays on the first beat of the bar`,`An album's first track`,`A single-note chord`,`The drum solo`],e:`Everyone lines up on the "one", and syncopates freely in between. That's what holds the whole thing together.`,ref:`Funk · "The One"`},
 {q:`Two funk instruments play exactly the same rhythm. Conclusion?`,o:[`One of the two is redundant`,`Ideal, it reinforces the groove`,`Add a third one`,`Pan them both to the center`],e:`Funk is an interlocking puzzle: each part occupies the 16th notes the others leave free.`,ref:`Funk · Arrangement`},
 {q:`How do you play funk rhythm guitar?`,o:[`Two or three muted strings in 16th notes, never the full chord`,`Big, held open chords`,`Slow arpeggios with lots of reverb`,`Distorted power chords`],e:`Percussive and thin: it adds rhythm without clogging the mids.`,ref:`Funk · Guitar and keys`},
 {q:`After heavy compression on the drum bus, your funk groove has vanished. Why?`,o:[`Compression flattened the ghost notes and the accents`,`The tempo changed`,`The swing was removed`,`The bass became mono`],e:`Funk's groove lives in the gap between accents and ghost notes. Boosting one and squashing the other flattens it.`,ref:`Funk · Mix and master`}],
'style:electrofunk':[
 {q:`What drum sounds define electro-funk?`,o:[`Drum machines: 808-type and LinnDrum`,`A sampled jazz break`,`An acoustic kit played with brushes`,`Hand percussion only`],e:`The timbre of early-80s machines is part of the style's identity, cowbell included.`,ref:`Electro-funk · Drums`},
 {q:`How is the electro-funk bass built?`,o:[`A synth played like a slap bass: octaves, syncopations, slides`,`An upright bass played with a bow`,`A held sine sub`,`It's absent`],e:`The phrasing comes from funk, the sound from the synth: fast envelope filter, resonance, glide.`,ref:`Electro-funk · Bass`},
 {q:`How do you treat the lead vocal to stay within electro-funk?`,o:[`Talk box or vocoder, with a rich carrier, and an intelligible voice`,`A natural voice drowned in a hall reverb`,`A vocal pitched very high`,`A spoken voice only, no effect`],e:`The robotic voice is the lead: it must stay understandable, hence a sawtooth carrier and exaggerated articulation.`,ref:`Electro-funk · Vocals`},
 {q:`Your track sounds like stiff electro, not funk. What's missing?`,o:[`Swing on the 16th notes, around 54–58%`,`More distortion`,`A faster tempo`,`Less bass`],e:`The sounds are mechanical, but the placement has to stay loose. Without swing, funk disappears.`,ref:`Electro-funk · Pitfalls`}],
'style:synthwave':[
 {q:`Which snare treatment signs synthwave?`,o:[`Gated reverb`,`A bitcrusher`,`A flanger`,`None, it's dry`],e:`A large reverb cut off sharply after a fraction of a second: the 80s snare sound.`,ref:`Synthwave · Drums`},
 {q:`How does the synthwave bass behave?`,o:[`Continuous eighth notes on the fundamental, almost no syncopation`,`Very long notes with slides`,`A syncopated slap line`,`It only plays on the offbeats`],e:`It's a steady engine. It drives forward, it doesn't dance.`,ref:`Synthwave · Bass`},
 {q:`How do you build a gated reverb in Live?`,o:[`Reverb, then Gate with its sidechain listening to the snare`,`Gate, then Limiter`,`Two delays in series`,`A chorus on the master`],e:`The gate opens with the hit and slams shut abruptly: the reverb tail gets truncated.`,ref:`Synthwave · In Ableton Live`},
 {q:`Your synthwave mix is drowned and blurry. Fix?`,o:[`Keep the kick and bass dry, and clean up the pads' low-mids`,`Add a third pad`,`Put reverb on the bass`,`Widen the kick`],e:`Space is reserved for the lead, the snare and the pads. The rhythm engine stays dry and centered.`,ref:`Synthwave · Mix and master`}],
'style:dnb':[
 {q:`What's the two-step pattern?`,o:[`Kick on the 1, snare on the 2, kick just before the 3, snare on the 4`,`Kick on all 4 beats`,`Snare only on the 3`,`Two kicks per beat`],e:`Two kicks and two snares per bar: at 174 BPM, that's plenty.`,ref:`Drum & bass · Drums`},
 {q:`Where does drum & bass's tension come from?`,o:[`The contrast between a very fast drum part and a slow low end`,`Constant key changes`,`The absence of bass`,`An accelerating tempo`],e:`The drums race at 174 BPM while the bass and pads move at half that: fast and floaty at once.`,ref:`Drum & bass · Bass`},
 {q:`How do you build a usable Reese bass?`,o:[`A mono sine sub, plus a detuned-saw layer cut below 120 Hz`,`Seven unison voices across the whole spectrum`,`A single, heavily saturated sine`,`Two detuned subs`],e:`Detuning makes a sound beat; in the sub, that creates gaps. Reserve it for the mid layer.`,ref:`Drum & bass · Bass`},
 {q:`In drum & bass, your snare disappears behind the bass. Why?`,o:[`It lacks body around 200 Hz and the bass's mid layer masks it`,`It's too short`,`The tempo is too slow`,`There are too many hi-hats`],e:`The snare has to cut through: weight at the bottom, a crack up top, and a bass that leaves it room.`,ref:`Drum & bass · The snare`}],
'focus:swing':[
 {q:`What does a 50% swing correspond to?`,o:[`No swing: the 16th notes are perfectly even`,`Half the notes are removed`,`An exact triplet`,`The tempo is halved`],e:`50% means the second note of every pair falls exactly halfway. An exact triplet corresponds to 66.7%.`,ref:`Swing · the essentials`},
 {q:`In today's music (hip-hop, house, funk), which subdivision gets swung?`,o:[`16th notes`,`Eighth notes`,`Quarter notes`,`Whole notes`],e:`Swinging eighth notes gives a blues or jazz shuffle. Almost all current production swings 16th notes and leaves eighths straight.`,ref:`Swing · the essentials`},
 {q:`A pad-sampler beat is quantized 100% with 62% swing. How is that possible?`,o:[`You quantize to a grid that is itself swung`,`It's impossible, the two settings cancel out`,`Swing only applies to the kick`,`Quantization only affects velocities`],e:`Quantizing means snapping to a grid. Nothing forces that grid to be even: steady and swung aren't contradictory.`,ref:`Swing · the essentials`},
 {q:`Why does 58% swing read better at 90 BPM than at 140 BPM?`,o:[`The same ratio represents more milliseconds at a slow tempo`,`Swing gets disabled above 120 BPM`,`Hi-hats are louder at slow tempos`,`The ear can't hear swing at fast tempos, period`],e:`The ear perceives durations. 8% of a 16th-note pair is 27 ms at 90 BPM, 17 ms at 140 BPM.`,ref:`Swing · the lab (tempo slider)`},
 {q:`What does 50% quantize strength do?`,o:[`It moves each note halfway toward the grid`,`It quantizes every other note`,`It halves the tempo`,`It applies 50% swing`],e:`You tighten up an imprecise take while keeping part of the musician's original feel.`,ref:`Swing · the essentials`},
 {q:`You want a laid-back, "sat-back" feel without touching the notes. What move in Live?`,o:[`A positive Track Delay of 10 to 25 ms on the snare track`,`Raise the tempo`,`Quantize 100% with no swing`,`Add 20 ms of randomization to every track`],e:`A constant offset on a single instrument reads as character. Beyond roughly 30 ms, it reads as a flam.`,ref:`Swing · in Ableton Live`},
 {q:`How does trap-influenced hip-hop create rhythmic movement?`,o:[`A straight grid, but hi-hat rolls and triplet flows`,`Very heavy swing on every element`,`No quantization at all`,`Tempo changes`],e:`The contrast between a strictly binary grid and triplet figures replaces swing.`,ref:`Swing · swing in today's music`},
 {q:`You added 15 ms of random offset everywhere to "humanize" it, and the beat sounds clumsy. Why?`,o:[`A drummer is irregular in a consistent way, not randomly: you need constant, per-instrument offsets`,`15 ms is too little`,`You should have randomized the tempo too`,`Randomization only works on the kick`],e:`Groove comes from a repeated intent: snare always a touch late, hi-hats always a touch early. Pure randomness only produces imprecision.`,ref:`Swing · pitfalls`},
 {q:`Your sampled drum loop and your programmed hi-hats produce flams. Likely cause?`,o:[`The loop has its own swing, different from your hi-hats'`,`The loop is too loud`,`The project's tempo is too slow`,`The hi-hats are in mono`],e:`Extract the loop's groove and apply it to the hi-hats, so everyone shares the same grid.`,ref:`Swing · in Ableton Live (Extract Groove)`}],
'era:70s':[
 {q:`What medium do you record on in the 70s?`,o:[`Multitrack tape, 16 then 24 tracks`,`A computer hard drive`,`Digital cassettes`,`Directly to vinyl`],e:`The limited track count forces early decisions, and bouncing tracks down with no way back.`,ref:`70s · ID card`},
 {q:`Why do 70s records sound like performances?`,o:[`The rhythm section plays together, in the same room, without a systematic click`,`Everything is sequenced`,`Vocals are corrected note by note`,`Mastering is very loud`],e:`The tempo breathes, the mics pick up a bit of everyone, and decisions are made in the moment.`,ref:`70s · the working method`},
 {q:`Which treatment brings a modern mix closer to a 70s sound?`,o:[`Gentle saturation, highs softened beyond 10–12 kHz, dry, dead drums`,`Gated reverb on the snare`,`Deep sidechain across the whole mix`,`A limiter pushed 10 dB`],e:`Tape rounds off the highs and compresses gently; the drums are dampened and closely mic'd, with no reverb.`,ref:`70s · getting this sound today`}],
'era:80s':[
 {q:`Which 1983 standard lets every machine talk to each other?`,o:[`MIDI`,`MP3`,`USB`,`VST`],e:`One keyboard can drive several synths, a sequencer can play a whole arrangement: layering and programming become widespread.`,ref:`80s · the working method`},
 {q:`Why does the swing-as-percentage setting appear in the 80s?`,o:[`Drum machines quantize by default: flexibility has to be reintroduced`,`Drummers had forgotten how to play`,`Magnetic tape was drifting`,`The CD forced it`],e:`Perfectly regular rhythm becomes the norm. "Shuffle" is the manufacturers' answer.`,ref:`80s · sonic signatures`},
 {q:`Which elements instantly signal an 80s production?`,o:[`Gated snare, chorus on the pads, FM bells and electric pianos`,`Sampled break and vinyl crackle`,`808 with slides and hi-hat rolls`,`Dampened drums and real strings`],e:`Big digital reverbs, crystalline timbres against warm pads, and machine-like precision.`,ref:`80s · sonic signatures`}],
'era:90s':[
 {q:`Which instrument becomes central in the 90s?`,o:[`The sampler`,`The tape recorder`,`The FM synth`,`Pitch correction`],e:`Chop, loop, reorder: hip-hop, jungle, trip-hop, big beat and French Touch all come from the same gesture.`,ref:`90s · ID card`},
 {q:`Why sample a 45 RPM pressing of a record, then slow it down in the sampler?`,o:[`To save very limited memory, with a bonus grain`,`To get around copyright`,`To tune the sample`,`Because turntables couldn't play 33 RPM`],e:`A sound played faster is shorter, so it takes up less memory. Pitched back down, it loses highs: that's part of the "grain".`,ref:`90s · the working method`},
 {q:`You want a 90s-grain time-stretch in Live. Which Warp mode should you avoid?`,o:[`Complex Pro, too transparent`,`Beats`,`Texture`,`Re-Pitch`],e:`Artifacts were part of the sound. Beats or Texture pushed to the extreme, or Re-Pitch for the "turntable speed" effect.`,ref:`90s · getting this sound today`}],
'era:00s':[
 {q:`What does producing "in the box" mean?`,o:[`Doing everything inside the computer: instruments, effects, mixing`,`Recording in a soundproof booth`,`Only using drum machines`,`Mixing on an analog console`],e:`Unlimited tracks, infinite undo, total recall: for the first time, no more technical constraints.`,ref:`2000s · ID card`},
 {q:`What is the 2000s' specific "constraint"?`,o:[`Abundance: too many choices, too many presets, too many tracks`,`The number of tracks`,`Sampler memory`,`The price of machines`],e:`When everything is possible and reversible, finishing a track becomes the problem. Hence the value of self-imposed limits.`,ref:`2000s · ID card`},
 {q:`Why is mastering as loud today as in 2008 counter-productive?`,o:[`Platforms normalize loudness: a crushed master just gets turned down and sounds smaller`,`Today's limiters are worse`,`MP3 no longer exists`,`Today's speakers clip faster`],e:`At matched volume, only the downsides remain: flattened transients and listening fatigue.`,ref:`2000s · pitfalls`}],
'era:10s':[
 {q:`What ends the loudness war in the mid-2010s?`,o:[`Loudness normalization by streaming platforms`,`Limiters being banned`,`The return of vinyl`,`MP3 being abandoned`],e:`Once every track is brought to the same perceived loudness, mastering louder gains nothing and only costs dynamics.`,ref:`2010s · the working method`},
 {q:`Why do intros get shorter in the streaming era?`,o:[`Listeners can skip instantly, and a play only counts after about thirty seconds`,`Files need to be lighter`,`Platforms cap track length`,`DJs no longer need them`],e:`The format follows the attention economy: hook very early, shorter tracks.`,ref:`2010s · ID card`},
 {q:`You're using Multiband Dynamics' OTT preset. How do you avoid a fatiguing sound?`,o:[`Dial it in with the Amount control, and don't put it on every track`,`Push it to 100% on the master`,`Stack it twice`,`Put it before every instrument and on every return`],e:`This kind of compression lifts every detail: spectacular on a lead, exhausting when it's everywhere.`,ref:`2010s · pitfalls`}],
'era:20s':[
 {q:`What is stem separation for?`,o:[`Isolating vocals, drums, bass and the rest from an already-mixed file`,`Exporting every track of a project`,`Widening the stereo image`,`Correcting a vocal's pitch`],e:`A stereo file becomes raw material again: each stem can be sliced, filtered, transposed, resampled.`,ref:`2020s · the working method`},
 {q:`What's the main risk of releasing an AI generation as-is?`,o:[`A competent but interchangeable result, with fragile rights`,`A file that's too large`,`An unstable tempo`,`Incompatibility with platforms`],e:`Hence the method rule: at least one personal transformation per element, re-singing, replaying, resampling.`,ref:`2020s · pitfalls`},
 {q:`You want to commercially release a track containing AI-generated parts. What do you check first?`,o:[`The commercial usage terms currently in force for your subscription`,`Nothing: everything generated is royalty-free`,`You speed the track up 5%`,`You master it louder`],e:`These terms have changed several times since 2024, through lawsuits and then licensing deals between generators and record labels. General information, not legal advice.`,ref:`2020s · the working method`}],
'focus:practices':[
 {q:`What level does Spotify normalize playback to by default?`,o:[`−14 integrated LUFS`,`−6 LUFS`,`0 dBFS peak`,`−23 LUFS`],e:`A louder master gets turned down on playback; a quieter one gets turned up, as long as its peaks stay under −1 dB.`,ref:`Practices · Mastering & release`},
 {q:`What true-peak margin does Spotify recommend for a master louder than −14 LUFS?`,o:[`−2 dBTP`,`0 dBTP`,`−0.1 dBTP`,`−6 dBTP`],e:`−1 dBTP as a general rule, −2 dBTP for dense masters, which generate more overshoots during lossy encoding.`,ref:`Practices · Mastering & release`},
 {q:`Why keep a constant listening volume while mixing?`,o:[`Perception of low and high end changes with volume: changing level means changing the mix`,`To save your speakers`,`Because plugins react to listening volume`,`To comply with normalization`],e:`At high volume, everything feels fuller and brighter. A moderate, fixed level yields decisions that hold up everywhere.`,ref:`Practices · Monitoring`},
 {q:`Why split creating, arranging and mixing into separate sessions?`,o:[`They're incompatible mindsets: analyzing kills an idea mid-flow`,`Live doesn't let you do all three at once`,`To lighten the CPU load`,`Because mixing has to happen in mono`],e:`In creation you generate without judging; in mixing you judge without generating. Mixing the two slows both down.`,ref:`Practices · Method`},
 {q:`A plugin clearly improves your track, but it also comes out 2 dB louder. What do you do?`,o:[`Compensate the output level, then compare bypass on/off`,`Keep it, the improvement is obvious`,`Turn every other track up 2 dB`,`Add a limiter behind it`],e:`Whatever comes out louder sounds better. Without a matched-level comparison, you don't actually know what the plugin adds.`,ref:`Practices · ERR01`},
 {q:`Mixing with a limiter left permanently active on the master is discouraged. Why?`,o:[`It masks excess level and low end: the mix collapses once you remove it`,`It adds latency`,`It's banned by platforms`,`It disables normalization`],e:`Distinguish this from a light bus compressor present from the start, which is an established practice.`,ref:`Practices · ERR cards, Mixing`},
 {q:`You have dozens of 8-bar loops and no finished track. What's the fix?`,o:[`A deadline, subtractive arrangement as soon as the loop works, and finishing no matter what`,`Buy new sample packs`,`Wait for a better idea`,`Spend more time on each loop`],e:`Arrangement, mixing and mastering can only be learned by finishing tracks, even imperfect ones.`,ref:`Practices · ERR cards, Method`},
 {q:`Two stacked kicks have less low end than one alone. Likely cause?`,o:[`Partial phase opposition between the two layers`,`A tempo that's too fast`,`Too much compression`,`Not enough reverb`],e:`Flip the polarity of one layer and keep whichever position gives the most low end; align their starts.`,ref:`Practices · ERR cards, Sound design`}],
'focus:marketing':[
 {q:`How long before release should you pitch a track to Spotify's editors for it to land in your followers' Release Radar?`,o:[`At least 7 days`,`The same day`,`At least 24 hours`,`At least 6 months`],e:`It's the one guaranteed lever, and it's free. Add your distributor's own lead time on top: aim for three to four weeks ahead.`,ref:`Release & promo · Release`},
 {q:`Since April 2024, what threshold does a track need to reach to earn master royalties on Spotify?`,o:[`1,000 streams in the past twelve months, plus a minimum number of unique listeners`,`From the very first stream`,`100,000 streams`,`10 followers`],e:`So it's better to support a handful of releases than to scatter dozens of quiet ones.`,ref:`Release & promo · Rights & income`},
 {q:`Why build a mailing list when you already have followers on social platforms?`,o:[`Followers belong to the platform; an email address belongs to you`,`Email is more modern`,`Social platforms ban music promotion`,`To avoid posting videos`],e:`One algorithm change, one rule change, one suspended account, and your reach is gone. The list is the one direct link no one can take from you.`,ref:`Release & promo · Strategy`},
 {q:`A service guarantees you 10,000 streams and a playlist placement for a fee. What should you make of it?`,o:[`It's banned by Spotify and counter-productive: unpaid, uncounted streams, and a risk of takedown`,`A normal way to launch a track`,`Fine if the price is low`,`Recommended by distributors`],e:`Spotify bans any service promising streams or placements for payment, and charges distributors and labels when blatant fraud is detected.`,ref:`Release & promo · Mistakes, MKT01`},
 {q:`How should you send a demo to a label?`,o:[`One to three finished tracks in a private listening link, four personalized lines, a single follow-up`,`Ten tracks as attachments, with your full biography`,`The same message CC'd to fifty labels`,`A public comment under their latest post`],e:`Demos that get listened to are short, easy to play, and show you know the label.`,ref:`Release & promo · Network and Templates`},
 {q:`Which network should you build first when starting out?`,o:[`Peers at your level and your local scene`,`International headliners`,`Journalists only`,`None: the music is enough`],e:`Your peers are reachable, rise alongside you, and become collaborators, remixers and bookers. And you give before you ask.`,ref:`Release & promo · Network`},
 {q:`Which metric best tells you whether a track resonates with the people discovering it?`,o:[`The ratio of saves to listeners`,`Total stream count`,`Number of posts`,`Number of countries reached`],e:`A stream count says nothing about attachment. Compare yourself to your previous release, not to other artists.`,ref:`Release & promo · Metrics`},
 {q:`Your release went unnoticed, even by your own followers. The track went live two days after the master was finished. Main cause?`,o:[`No preparation at all: no editorial pitch, no Release Radar, no content ready`,`The master wasn't loud enough`,`The track was too short`,`Friday is a bad day`],e:`Three to four weeks between delivery and release, following the countdown: that's the difference between uploading and releasing a track.`,ref:`Release & promo · Countdown`}]
};

EN.BEST=[
['meth',`Separate the phases: create, arrange, mix`,`These are three incompatible mindsets. Tweaking a compressor while you're hunting for a melody kills the idea.`,`One session = one phase. While creating, no mixing plugins. While mixing, no new parts.`,'arr'],
['meth',`Finish, even imperfect`,`You learn ten times more by finishing ten average tracks than by polishing one loop for six months.`,`Set a deadline and a number of sessions. Once that's up, export and move to the next one.`,'arr'],
['meth',`Give yourself constraints`,`Abundance is paralyzing. Every distinctive style was born from a technical limit.`,`Before you start: a palette (one synth, one kit, eight tracks) or a rule (no quantizing, no presets).`,'era:00s'],
['meth',`Work from a project template`,`Rebuilding routing for every track burns the session's opening energy, its most valuable resource.`,`A default Live Set with your groups, two or three returns, a reference track and your loudness meter.`,'mix'],
['meth',`Name, color, version, back up`,`An unreadable project never gets reopened. A project missing its samples is lost.`,`Numbered versions at every step, "Collect All and Save" before archiving, and a copy off the computer.`,'mix'],
['meth',`Commit: freeze to audio`,`As long as everything stays editable, nothing is actually decided. Freezing frees your attention, and the CPU.`,`Once a sound is right, freeze or resample it, and disable the original.`,'sd'],
['meth',`Listen without the screen, and take notes`,`Watching the timeline, you listen with your eyes: you anticipate, you excuse.`,`Export, listen elsewhere or with the screen off, note fixes with their timestamp. The next session just works through the list.`,'arr'],
['ecoute',`Mix at a moderate, constant volume`,`The ear doesn't perceive low and high end the same way at every volume: changing level means changing the mix. Loud, everything flatters and tires.`,`A level where you can hold a conversation without raising your voice. Mark it on your knob and leave it there; briefly check very quiet and very loud too.`,'mix'],
['ecoute',`Take breaks, and protect your hearing`,`Hearing fatigue skews judgment well before you notice it. The damage, on the other hand, is permanent.`,`Ten minutes every hour. WHO reference point: roughly 80 dB for 40 hours a week, with the safe duration halving for every +3 dB. Ringing after a session is a warning sign.`,'master'],
['ecoute',`Compare against references, at matched volume`,`With no outside anchor, the ear adjusts to almost anything within twenty minutes.`,`Two or three tracks in the same style on a dedicated track, matched to your mix's perceived level. Compare in slices: low end, then vocal, then air.`,'master'],
['ecoute',`Check elsewhere: mono, phone, car`,`A flaw audible everywhere comes from the track; a flaw audible in only one place comes from the monitoring.`,`At minimum: your main monitors, a second system, a phone, and mono.`,'master'],
['ecoute',`Learn your own monitoring`,`No headphones and no room are neutral. What matters is knowing how a good mix sounds on them.`,`Regularly listen to tracks you know by heart on your system. It pays off more than upgrading gear.`,'mix'],
['ecoute',`Measure the low end, listen to the rest`,`Below 80 Hz, most home listening setups either lie or go silent.`,`A spectrum analyzer for the sub, a loudness meter for the master. Everywhere else, let your ears decide.`,'bass'],
['compo',`One strong idea per track`,`Listeners remember one hook, not five.`,`Identify the central element. Everything else serves it, or it goes.`,'compo'],
['compo',`Arrange by subtraction`,`Building up from nothing is slow; stripping down from everything is fast and creates contrast.`,`Duplicate your full loop across the whole track, then remove things to carve out the sections. Keep something in reserve for the final peak.`,'arr'],
['compo',`One register, one role per element`,`Two parts in the same register at the same time is a mixing problem you're manufacturing yourself.`,`For every track: what role, what frequency zone, what moments? If you can't answer, cut it and listen for whether it's missed.`,'arr'],
['compo',`One change every 8 bars`,`Attention drifts the moment nothing moves anymore.`,`An element entering, leaving or transforming every block. A slow automation counts as a change.`,'arr'],
['compo',`Pick your key with the low end in mind`,`The tonic's fundamental should fall in the usable zone, roughly 41–55 Hz, or the bass will be either inaudible or weightless.`,`Before committing to a key, check where its low note lands. If needed, play the bass an octave up.`,'bass'],
['groove',`Work on velocities before adding elements`,`A stiff beat is almost always an execution problem, not a content one.`,`Three clear levels: accents, normal hits, ghost notes. Only after that, maybe, one more percussion.`,'groove'],
['groove',`A chosen, consistent placement`,`Groove comes from a repeated intent, not from chance.`,`A global swing, then at most one per-instrument offset, held throughout the track. The kick stays on the grid.`,'focus:swing'],
['grave',`All the low end in mono`,`Stereo low end cancels out in mono and becomes unpredictable on a big system.`,`Utility in Bass Mono mode around 120 Hz on the bass and drum bus. Width is worked above that.`,'bass'],
['grave',`Only one occupant of the sub at a time`,`Two long sounds in the same zone mask each other and eat into the master's headroom.`,`Short kick and long bass, or the reverse. Otherwise: bass between the kicks, or sidechain.`,'mix'],
['grave',`Give the bass harmonics`,`A large share of listeners are on speakers that don't go below 150–200 Hz.`,`Light saturation on the sub, or a mid layer cut below 120 Hz. Check with a temporary high-pass at 180 Hz on the master.`,'bass'],
['sd',`Get the sound right at the source`,`A well-chosen sound needs almost no processing. A poorly chosen one will always need too much.`,`Before opening an EQ, ask whether a different sample, preset or octave wouldn't solve the problem instead.`,'sd'],
['sd',`Fewer layers, better chosen`,`Every layer adds masking and phase issues. Three complementary sounds beat eight stacked ones.`,`One layer per function: attack, body, low end. Filter each so it only occupies its own zone.`,'sd'],
['voix',`Nail the take`,`No processing rescues a take recorded too close, too far, or in a room that rings.`,`Pop filter, about six inches from the mic, a damped room (a closet works fine), input level with headroom.`,'voix'],
['voix',`Ride levels by hand before compressing`,`A compressor forced to cover a 15 dB gap works poorly, and you can hear it.`,`Adjust the gain on too-loud or too-quiet passages clip by clip, then compress lightly, in two stages if needed.`,'voix'],
['voix',`De-ess before adding brightness`,`Compression and a treble boost both amplify sibilance.`,`The de-esser goes before the EQ that adds air, and should only act on "s" sounds that exceed the threshold.`,'voix'],
['mix',`Balance first: faders and pan`,`It does most of a mix's work. A plugin doesn't fix a shaky balance.`,`Everything at zero, bring up the kick, the bass, the vocal, then the rest in order of importance. No processing at this stage.`,'mix'],
['mix',`EQ in context, cut narrow, boost wide`,`A track only needs its share of the spectrum, and it's judged alongside the others.`,`Adjust with the whole track playing. If a boost exceeds 4 dB, look for the cause elsewhere.`,'mix'],
['mix',`Compare every treatment at matched volume`,`Whatever comes out louder sounds better. It's production's most expensive bias.`,`Compensate each plugin's output level, then bypass on/off. No clear preference: take it off.`,'comp'],
['mix',`Keep headroom everywhere`,`In floating point, a track never clips, but plenty of plugins react poorly to an excessive input level, and the master does clip.`,`Tracks averaging around −18 dBFS, master peaking near −6 dB before mastering.`,'mix'],
['mix',`Process in groups, share effects`,`Shared buses and returns bring coherence and cut down the number of decisions.`,`Drum bus, instrument bus, vocal bus. Two or three space returns for the whole track.`,'space'],
['mix',`Finish with automation`,`A static mix can only be right on average. Automation makes it right at every moment.`,`Vocal volume word by word, space sends by section, choruses opening up.`,'voix'],
['dyn',`Know why you're compressing`,`Controlling level swings, adding punch, gluing a group: three different goals, three different settings.`,`Name the goal before inserting the compressor. If you can't, don't insert one.`,'comp'],
['dyn',`Set it by exaggerating, then back off`,`At 2 dB of reduction, attack and release settings are almost inaudible.`,`Very low threshold and high ratio to dial in the timing, then back off to the target reduction, and compensate the level.`,'comp'],
['espace',`Two or three filtered returns, not a reverb per track`,`A shared space brings coherence; reverb inserts everywhere just add mud.`,`High-pass around 300 Hz and low-pass around 8 kHz on the returns, 20–40 ms pre-delay on the vocal. Kick and bass stay dry.`,'space'],
['master',`Target the level that serves the music, using platform benchmarks`,`Spotify normalizes to −14 integrated LUFS: a louder master simply gets turned down. A quieter master gets turned up, but only as long as its peaks stay under −1 dB.`,`Measure in integrated LUFS across the whole track. No point pushing past what the style calls for; also no point chasing −14 at all costs if the music wants to be denser.`,'master'],
['master',`Respect the true-peak margin`,`Lossy encoding (Ogg, AAC) can recreate higher peaks than the original file.`,`Spotify's recommendation: at most −1 dBTP, and <b>−2 dBTP if the master is louder than −14 LUFS</b>, since dense masters generate more overshoots.`,'master'],
['master',`Remember that not everyone normalizes`,`According to Spotify, its own web player and third-party devices (speakers, TVs) don't apply loudness normalization.`,`Don't master much louder or much quieter than comparable tracks in your style: check against your references.`,'master'],
['master',`Export cleanly`,`Every lossy conversion degrades the audio, and dither only makes sense once.`,`24-bit WAV at the project's sample rate. Dither only if you're dropping to 16-bit. No limiter on an export meant for outside mastering.`,'master'],
['master',`Don't master on mixing day`,`After a full day on a track, the ear has no perspective left on its tonal balance.`,`At least one night. Ideally, a fresh listen or a different person.`,'master'],
['droits',`Keep a log of your sources`,`The day a track takes off, you need to be able to prove where every sound came from.`,`One note per project: packs and licenses, samples and their origin, AI tools used with the date and subscription tier.`,'era:20s'],
