let mktState={mode:'best',dom:'',q:''};
function renderMarketing(){return `<div class="section active"><h2>Diffuser et faire connaître sa musique</h2>
  <p class="lede">Marketing, plateformes et réseau pour un artiste indépendant. Le principe directeur : on ne « perce » pas, on construit un public une personne à la fois, avec méthode et régularité.</p>
  <div class="chips" id="mmode" style="padding-top:0"></div>
  <input class="gq" id="mq" type="search" placeholder="Chercher : playlist, démo, label, DJ, liste…" autocomplete="off" spellcheck="false" style="margin-top:8px">
  <div class="chips" id="mdom"></div><div class="gcount" id="mcount"></div><div id="mlist"></div></div>`;}
function initMarketing(){
  const $=id=>document.getElementById(id),q=$('mq'),fmt=d=>d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  const draw=()=>{const st=mktState,nq=norm(st.q.trim()),words=nq?nq.split(/\s+/):[],open=(nq||st.dom)?' open':'';
    $('mmode').innerHTML=[['best','✓ Bonnes pratiques'],['bad','✕ Erreurs'],['plan','⏱ Rétro-planning de sortie'],['tpl','✎ Modèles']].map(([id,l])=>`<button class="chip${st.mode===id?' on':''}" data-m="${id}">${l}</button>`).join('');
    $('mmode').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st.mode=c.dataset.m;draw();});
    const isList=st.mode==='best'||st.mode==='bad';q.style.display=$('mdom').style.display=$('mcount').style.display=isList?'':'none';
    if(st.mode==='plan'){const rel=S.plan.date?new Date(S.plan.date+'T12:00:00'):null,today=new Date();today.setHours(12,0,0,0);const done=PLAN.filter((_,i)=>S.plan.done[i]).length;
      $('mlist').innerHTML=`<div class="card"><h3>date de sortie</h3><div class="row"><input type="date" id="mdate" value="${S.plan.date||''}" style="height:44px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-size:16px"><span class="pill">${done}/${PLAN.length} étapes</span><button class="btn" id="mreset">Réinitialiser</button></div>
        <p class="note">${rel?(rel.getDay()===5?`Un vendredi : c'est le jour mondial des sorties.`:`Ce n'est pas un vendredi. Rien d'interdit, mais les playlists de nouveautés et les médias sont calés sur le vendredi.`)+(()=>{const d=Math.round((rel-today)/864e5);return d>=28?` Sortie dans ${d} jours : le calendrier est tenable.`:d>=8?` Sortie dans ${d} jours : c'est court. Livre au distributeur et propose le titre aux éditeurs dès aujourd'hui.`:d>=0?` Sortie dans ${d} jour${d>1?'s':''} : le délai de 7 jours pour le Release Radar est dépassé ou sur le point de l'être. Envisage de décaler.`:` Cette date est passée.`;})():`Choisis une date : chaque étape recevra son échéance. Compte idéalement huit semaines entre le master validé et la sortie, quatre au strict minimum.`}</p></div>`+
        PLAN.map(([off,t,dsc],i)=>{const dt=rel?new Date(rel.getTime()+off*864e5):null,late=dt&&dt<today&&!S.plan.done[i];
          return `<label class="done" style="align-items:flex-start;margin:0;padding:12px 0;border-bottom:1px solid var(--border);min-height:44px"><input type="checkbox" data-p="${i}" ${S.plan.done[i]?'checked':''} style="margin-top:4px;flex:none">
            <span style="flex:1"><span class="mono" style="font-size:12px;color:var(--${late?'red':'accent'})">${off===0?'Jour J':off<0?'J−'+(-off):'J+'+off}${dt?' · '+fmt(dt):''}${late?' · en retard':''}</span><br><b>${t}</b><br><span style="color:var(--muted);font-size:14px">${dsc}</span></span></label>`;}).join('');
      $('mdate').onchange=e=>{S.plan.date=e.target.value;autoSave();draw();};$('mreset').onclick=()=>{S.plan={date:'',done:{}};autoSave();draw();};
      $('mlist').querySelectorAll('[data-p]').forEach(c=>c.onchange=()=>{if(c.checked)S.plan.done[c.dataset.p]=true;else delete S.plan.done[c.dataset.p];autoSave();draw();});return;}
    if(st.mode==='tpl'){$('mlist').innerHTML=`<p class="note" style="margin:4px 0 12px">Des trames à adapter, pas à copier telles quelles : un message qui sent le modèle est ignoré. Remplace chaque crochet, et supprime toute ligne pour laquelle tu n'as rien de vrai à dire.</p>`+
        TPL.map(([t,tip,body],i)=>`<div class="card"><h3>${t}</h3><p class="note" style="margin:0 0 10px">${tip}</p><textarea class="note-in" readonly id="tpl${i}" style="font-family:var(--mono);font-size:13px;min-height:60px">${esc(body)}</textarea><div class="row" style="margin-top:10px"><button class="btn" data-cp="${i}">Copier</button></div></div>`).join('');
      TPL.forEach((_,i)=>{const ta=$('tpl'+i);ta.style.height='auto';ta.style.height=(ta.scrollHeight||200)+'px';});
      $('mlist').querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{const ta=$('tpl'+b.dataset.cp);let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(e){try{ta.select();ok=document.execCommand('copy');}catch(e2){}}
        if(!ok)ta.select();toast(ok?'Copié ✓':'Texte sélectionné : copie-le avec Ctrl+C');});return;}
    const data=st.mode==='best'?MBEST:MBAD;
    $('mdom').innerHTML=[['','Tous'],...Object.entries(MDOM).filter(([k])=>data.some(d=>d[0]===k))].map(([id,l])=>`<button class="chip${st.dom===id?' on':''}" data-d="${id}">${l}</button>`).join('');
    $('mdom').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st.dom=c.dataset.d;draw();});
    if(st.dom&&!data.some(d=>d[0]===st.dom))st.dom='';
    const res=data.map((d,i)=>({d,i})).filter(({d})=>(!st.dom||d[0]===st.dom)&&words.every(w=>norm(d.slice(1).join(' ')).includes(w)));
    $('mcount').textContent=res.length+(st.mode==='best'?' pratique':' fiche')+(res.length>1?'s':'');
    $('mlist').innerHTML=res.length?res.map(({d,i})=>st.mode==='best'
      ?`<details class="prac"${open}><summary><span class="pk ok">✓</span><b>${d[1]}</b><span class="al">${MDOM[d[0]]}</span></summary><dl><div><dt>Pourquoi</dt><dd>${d[2]}</dd></div><div><dt>Comment</dt><dd>${d[3]}</dd></div></dl></details>`
      :`<details class="prac"${open}><summary><span class="pk ko">MKT${String(i+1).padStart(2,'0')}</span><b>${d[1]}</b><span class="al">${MDOM[d[0]]}</span></summary><dl><div><dt>Cause</dt><dd>${d[2]}</dd></div><div><dt>Manifestation</dt><dd>${d[3]}</dd></div><div><dt>Conséquences</dt><dd>${d[4]}</dd></div><div><dt>Correction</dt><dd>${d[5]}</dd></div></dl></details>`).join('')
      :`<p class="note">Rien ne correspond. Essaie un mot plus court ou retire le filtre.</p>`;};
  q.value=mktState.q;q.oninput=()=>{mktState.q=q.value;draw();};draw();
}

/* ============ glossaire ============ */
// [terme, alias / anglais, définition, thème]
const GLOSS=[
[`Accord`,`chord`,`Plusieurs notes jouées ensemble, en général trois (une triade). Porte l'émotion d'un passage.`,'compo'],
[`Degré`,`i, iv, V…`,`Position d'un accord dans la gamme, notée en chiffres romains : minuscule pour un accord mineur, majuscule pour un majeur.`,'compo'],
[`Gamme`,`scale`,`Les sept notes dans lesquelles on pioche pour écrire mélodies et accords d'un morceau.`,'compo'],
[`Hook`,`accroche`,`La courte phrase que l'auditeur retient et fredonne. Deux à quatre mesures, peu de notes, beaucoup de répétition.`,'compo'],
[`Mode dorien`,`dorian`,`Gamme mineure dont le sixième degré est majeur. Donne la couleur funk et disco, plus lumineuse qu'un mineur classique.`,'compo'],
[`Motif`,`riff, pattern`,`Petite cellule mélodique ou rythmique répétée et variée. La brique de base d'une mélodie.`,'compo'],
[`Progression`,`suite d'accords`,`L'enchaînement d'accords qui tourne en boucle sous le morceau, le plus souvent quatre accords.`,'compo'],
[`Question / réponse`,`call and response`,`Deux phrases liées : la première finit en suspens, la seconde conclut sur la tonique.`,'compo'],
[`Syncope`,`syncopation`,`Accent placé entre les temps forts. Crée la surprise rythmique à la base du groove.`,'compo'],
[`Tempo`,`BPM`,`La vitesse du morceau, en battements par minute. Une noire dure 60 000 ÷ BPM millisecondes.`,'compo'],
[`Tonalité`,`key`,`La gamme de référence du morceau et sa note de repos. « En sol mineur » signifie gamme de sol mineur, repos sur sol.`,'compo'],
[`Tonique`,`tonic`,`La note et l'accord de repos de la tonalité, le premier degré. Là où la musique « rentre à la maison ».`,'compo'],
[`Transposition`,`transpose`,`Déplacer un motif plus haut ou plus bas en gardant son dessin et son rythme.`,'compo'],

[`Backbeat`,``,`La caisse claire ou le clap sur les temps 2 et 4. L'accent sur lequel on tape dans les mains.`,'groove'],
[`Charley`,`hi-hat, HH`,`Cymbale double de la batterie. Fermé : son court qui marque la subdivision. Ouvert : son long, souvent sur les contretemps.`,'groove'],
[`Contretemps`,`offbeat, le « et »`,`Le milieu entre deux temps. En house, c'est la place du charley ouvert et souvent de la basse.`,'groove'],
[`Double-croche`,`16th note`,`Un quart de temps. Une mesure à 4 temps en contient 16 : c'est la grille des boîtes à rythmes.`,'groove'],
[`Flam`,``,`Deux frappes presque simultanées, entendues comme un décalage. Voulu chez un batteur, accidentel quand deux pistes n'ont pas le même swing.`,'groove'],
[`Four-on-the-floor`,`4/4 kick`,`Un kick sur chacun des quatre temps. Le squelette de la disco, de la house et de la techno.`,'groove'],
[`Ghost note`,`note fantôme`,`Frappe très douce glissée entre les accents, surtout à la caisse claire. Donne le mouvement sans se faire remarquer.`,'groove'],
[`Groove Pool`,`Ableton Live`,`Dans Live, la bibliothèque de grooves (swing, feeling) applicables aux clips, avec un réglage de quantité global.`,'groove'],
[`Humanisation`,`humanize`,`Petites variations aléatoires de placement et de vélocité, pour éviter la rigidité d'une programmation parfaite.`,'groove'],
[`Kick`,`grosse caisse, BD`,`Le tambour grave qui porte la pulsation. En électronique : un sinus dont la hauteur chute très vite, plus un clic d'attaque.`,'groove'],
[`Quantification`,`quantize`,`Recaler les notes sur la grille rythmique. À 100 %, tout est parfaitement en place, donc mécanique.`,'groove'],
[`Swing`,`shuffle`,`Retard appliqué aux doubles-croches paires. 50 % = droit ; plus on monte, plus le rythme balance vers le ternaire.`,'groove'],
[`Vélocité`,`velocity`,`La force d'une note MIDI, de 1 à 127. Sur une batterie, c'est elle qui crée les accents et la vie.`,'groove'],

[`808`,`TR-808`,`Boîte à rythmes de 1980, et par extension son kick long et accordé, utilisé comme une basse.`,'bass'],
[`Acid`,`TB-303`,`Basse en dent de scie ou carré dans un filtre très résonant, avec glissés et accents. Le caractère vient du cutoff automatisé.`,'bass'],
[`Couches`,`layering`,`Empiler plusieurs sons complémentaires pour n'en faire qu'un : par exemple un sub pour le poids et un médium pour la définition.`,'bass'],
[`Fondamentale`,`root, fundamental`,`La fréquence la plus grave d'un son, celle qui donne sa hauteur. Aussi : la note de base d'un accord, que joue la basse.`,'bass'],
[`Harmoniques`,`overtones`,`Fréquences multiples de la fondamentale, qui forment le timbre. Elles permettent à l'oreille de reconstituer une fondamentale absente.`,'bass'],
[`Low-end`,`le grave`,`Le bas du spectre, en gros sous 250 Hz : kick et basse. La zone la plus difficile à juger et à mixer.`,'bass'],
[`Reese`,`Reese bass`,`Basse faite de dents de scie désaccordées qui battent entre elles. Sombre et mouvante, typique de la drum & bass.`,'bass'],
[`Saturation`,`drive, distorsion douce`,`Écrêtage progressif du signal qui ajoute des harmoniques : densité, chaleur, et présence sur les petits systèmes.`,'bass'],
[`Sub`,`sub-bass`,`Les fréquences de 30 à 80 Hz environ. On les ressent plus qu'on ne les entend ; absentes des petites enceintes.`,'bass'],

[`Arrangement soustractif`,``,`Méthode : dupliquer la boucle complète sur toute la durée, puis retirer des éléments pour sculpter les sections.`,'arr'],
[`Automation`,``,`Courbe qui fait évoluer un réglage dans le temps : volume, cutoff, quantité de réverbe. Donne du mouvement à un son statique.`,'arr'],
[`Break`,`breakdown`,`Section où l'on retire la rythmique pour créer une respiration avant de relancer.`,'arr'],
[`Build`,`build-up, montée`,`Les mesures qui précèdent le drop, où la tension monte : filtre, riser, roulement.`,'arr'],
[`Drop`,``,`Le moment où tous les éléments entrent, après le build. Le sommet d'énergie d'une section.`,'arr'],
[`Impact`,`crash`,`Son percussif placé sur le premier temps d'une nouvelle section pour marquer l'entrée.`,'arr'],
[`Intro / outro`,``,`Début et fin du morceau. En musique de club : longs et dépouillés, pour permettre au DJ d'enchaîner.`,'arr'],
[`Locator`,`repère, marker`,`Marqueur posé sur la timeline pour nommer les sections et s'y déplacer.`,'arr'],
[`Reverse`,`son inversé`,`Cymbale ou réverbe lue à l'envers, qui « aspire » vers le temps fort suivant.`,'arr'],
[`Riser`,`uplifter`,`Bruit ou note qui monte en hauteur et en volume pour annoncer une nouvelle section.`,'arr'],
[`Roulement`,`fill, snare roll`,`Frappes de plus en plus serrées en fin de cycle, qui signalent un changement.`,'arr'],

[`ADSR`,`enveloppe`,`Attaque, Decay, Sustain, Release : la façon dont un réglage (souvent le volume) évolue du début à la fin d'une note.`,'sd'],
[`Carré`,`square wave`,`Forme d'onde ne contenant que les harmoniques impaires. Son creux, façon jeu vidéo ou clarinette.`,'sd'],
[`Cent`,``,`Un centième de demi-ton. L'unité du désaccord fin (detune).`,'sd'],
[`Cutoff`,`fréquence de coupure`,`La fréquence à partir de laquelle un filtre agit. Le réglage le plus expressif d'un synthé.`,'sd'],
[`Dent de scie`,`sawtooth`,`Forme d'onde contenant toutes les harmoniques. Riche et brillante : la matière première idéale pour un filtre.`,'sd'],
[`Detune`,`désaccord`,`Léger écart de hauteur entre deux voix. Crée des battements, donc de l'épaisseur et du mouvement.`,'sd'],
[`FM`,`modulation de fréquence`,`Synthèse où un oscillateur module la fréquence d'un autre. Timbres métalliques, cloches, pianos électriques.`,'sd'],
[`Forme d'onde`,`waveform`,`Le dessin d'un cycle du signal. Elle détermine le contenu en harmoniques, donc le timbre de base.`,'sd'],
[`LFO`,`low frequency oscillator`,`Oscillateur trop lent pour être entendu, utilisé pour faire bouger automatiquement un réglage.`,'sd'],
[`Oscillateur`,`OSC, VCO`,`Le générateur de son d'un synthé : il produit une forme d'onde à la hauteur de la note jouée.`,'sd'],
[`Passe-bas`,`low-pass, LPF`,`Filtre qui laisse passer le grave et atténue ce qui est au-dessus du cutoff. Assombrit et fait reculer un son.`,'sd'],
[`Preset`,``,`Un réglage de synthé ou d'effet enregistré. Un point de départ, à adapter au morceau.`,'sd'],
[`Résonance`,`Q du filtre`,`Accentuation de la zone autour du cutoff. Donne le « wah » et le sifflement caractéristique des filtres.`,'sd'],
[`Sampler`,`échantillonneur`,`Instrument qui joue des enregistrements, transposés, découpés et filtrés. Dans Live : Simpler, Sampler.`,'sd'],
[`Sinus`,`sine`,`Forme d'onde pure : une seule fréquence, aucune harmonique. Idéal pour un sub, inaudible sur petites enceintes s'il est grave.`,'sd'],
[`Synthèse soustractive`,``,`Partir d'une onde riche et retirer des fréquences avec un filtre. Le principe des synthés analogiques.`,'sd'],
[`Unison`,`unisson`,`Plusieurs copies d'une même voix, désaccordées et réparties en stéréo. Son large et dense (supersaw).`,'sd'],
[`Wavetable`,`table d'ondes`,`Synthèse qui balaye une série de formes d'onde : le timbre évolue au fil de la note.`,'sd'],

[`Bandes`,`bands`,`Dans un vocoder, le nombre de tranches de fréquences analysées. Peu : robotique. Beaucoup : intelligible.`,'voix'],
[`Correction de hauteur`,`Auto-Tune, pitch correction`,`Recale la hauteur de la voix sur la gamme. La voix reste la source ; réglé vite, donne l'effet en escalier.`,'voix'],
[`De-esser`,``,`Compresseur ciblé sur les sifflantes (5–9 kHz) : il ne baisse que les « s » et « ch » trop forts.`,'voix'],
[`Formant`,``,`Pic de résonance fixe créé par la forme de la bouche. Ce sont les formants qui distinguent les voyelles entre elles.`,'voix'],
[`Harmoniseur`,`harmonizer`,`Crée des copies transposées d'une voix pour fabriquer des chœurs.`,'voix'],
[`Modulateur`,`modulator`,`Dans un vocoder, le signal qui impose son articulation : la voix.`,'voix'],
[`Plosive`,`pop`,`Souffle de grave produit par les « p » et « b » dans le micro. Se traite au filtre anti-pop et au passe-haut.`,'voix'],
[`Porteuse`,`carrier`,`Dans un vocoder, le son qui est sculpté : un synthé. C'est elle qui décide des notes et du timbre.`,'voix'],
[`Sibilance`,`sifflantes`,`L'excès d'énergie des « s », « ch », « f », entre 5 et 9 kHz. Agressif après compression et boost d'aigus.`,'voix'],
[`Talk-box`,``,`Le son d'un synthé est envoyé dans la bouche par un tube ; la bouche le filtre et un micro capte le résultat.`,'voix'],
[`Unvoiced`,`non voisé`,`Les consonnes sans hauteur (s, t, ch). Sur un vocoder, réglage qui ajoute du bruit pour les restituer.`,'voix'],
[`Vocoder`,``,`Effet qui applique l'articulation d'une voix (modulateur) à un synthé (porteuse). Le synthé « prononce » les mots.`,'voix'],

/* ============ audio engine ============ */
let ctx=null,master=null,noiseBuf=null,timer=null,current=null;
function ac(){
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0.5;master.connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(ctx.state==='suspended')ctx.resume(); return ctx;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function startLoop(btn,bpm,steps,fn,cleanup){
  ac(); let step=0,next=ctx.currentTime+0.08; const dur=60/bpm/4;
  current={btn,label:btn.textContent,cleanup}; btn.textContent='■ Stop'; btn.classList.add('on');
  timer=setInterval(()=>{while(next<ctx.currentTime+0.15){fn(step%steps,next,dur);step++;next+=dur;}},25);
}
function stopLoop(){
  if(timer){clearInterval(timer);timer=null;}
  if(current){current.btn.textContent=current.label;current.btn.classList.remove('on');if(current.cleanup)current.cleanup();current=null;}
}
function toggleLoop(btn,bpm,steps,fn,setup,cleanup){
  if(current&&current.btn===btn){stopLoop();return;}
  stopLoop(); ac(); if(setup)setup(); startLoop(btn,bpm,steps,fn,cleanup);
}
function kick(t,dest,v=1){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);

eq(root){
  const P={hp:20,bf:350,bg:0,bq:1.4,sh:0}; let on=true,solo=false,F=null,pad=null,others=null,raf=0;
  const ex=(v,a,b)=>a*Math.pow(b/a,v/100), inv=(f,a,b)=>100*Math.log(f/a)/Math.log(b/a);
  root.innerHTML=`<canvas class="eqcv" id="cv"></canvas>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="play">▶ Lancer la boucle</button><button class="btn on" id="eon">EQ : on</button><button class="btn" id="solo">Solo nappe</button></div>
    ${slider('ehp','Passe-haut',0,100,1,0)}${slider('ebf','Cloche · fréq.',0,100,1,Math.round(inv(350,100,8000)))}${slider('ebg','Cloche · gain',-15,15,.5,0)}${slider('ebq','Cloche · Q',.3,10,.1,1.4)}${slider('esh','Air (shelf 8 kHz)',-12,12,.5,0)}`;
  const cv=root.querySelector('#cv'),g=cv.getContext&&cv.getContext('2d');
  const N=160,fr=new Float32Array(N).map((_,i)=>20*Math.pow(1000,i/(N-1))),m1=new Float32Array(N),m2=new Float32Array(N),m3=new Float32Array(N),ph=new Float32Array(N);

    F.hp.type='highpass';F.hp.Q.value=.7;F.bell.type='peaking';F.sh.type='highshelf';F.sh.frequency.value=8000;
    F.an.fftSize=4096;F.an.smoothingTimeConstant=.8;spec=new Float32Array(F.an.frequencyBinCount);
    F.hp.connect(F.bell).connect(F.sh).connect(F.an); F.an.connect(master); }
  function apply(){ if(!F)return; F.hp.frequency.value=P.hp;F.bell.frequency.value=P.bf;F.bell.gain.value=P.bg;F.bell.Q.value=P.bq;F.sh.gain.value=P.sh; draw(); }
  function route(){ if(!pad)return; pad.disconnect(); pad.connect(on?F.hp:F.an); others.gain.value=solo?0:1; }
  function draw(){ if(!g)return;
    const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,W=r.width||600,H=r.height||190;
    if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);} g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    const cs=getComputedStyle(document.documentElement),C=n=>cs.getPropertyValue(n).trim();
    const X=f=>Math.log(f/20)/Math.log(1000)*W;
    g.font='10px '+(C('--mono')||'monospace');g.fillStyle=C('--muted');g.strokeStyle=C('--border');g.lineWidth=1;
    [50,100,250,500,1000,2000,5000,10000].forEach(f=>{const x=X(f);g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();g.fillText(f>=1000?f/1000+'k':f,x+3,H-4);});
    if(F&&current&&spec){F.an.getFloatFrequencyData(spec);const ny=ctx.sampleRate/2;g.beginPath();g.moveTo(0,H);
      for(let i=0;i<N;i++){const b=Math.min(spec.length-1,Math.round(fr[i]/ny*spec.length)),db=Math.max(-100,Math.min(-15,spec[b]));g.lineTo(X(fr[i]),H-(db+100)/85*H);}

    if(F){F.hp.getFrequencyResponse(fr,m1,ph);F.bell.getFrequencyResponse(fr,m2,ph);F.sh.getFrequencyResponse(fr,m3,ph);
      g.beginPath();for(let i=0;i<N;i++){const db=on?20*Math.log10(Math.max(1e-6,m1[i]*m2[i]*m3[i])):0,y=H/2-Math.max(-24,Math.min(24,db))/24*(H/2-8);i?g.lineTo(X(fr[i]),y):g.moveTo(X(fr[i]),y);}
      g.strokeStyle=C('--accent');g.globalAlpha=on?1:.35;g.lineWidth=2.5;g.stroke();g.globalAlpha=1;}
    else{g.fillStyle=C('--muted');g.font='13px '+(C('--sans')||'sans-serif');g.fillText('Lance la boucle pour voir le spectre de la nappe',12,24);}
  }
  const loop=()=>{draw();raf=requestAnimationFrame(loop);};

prog(root){
  const D=[['i','Gm',[55,58,62],'repos'],['ii°','A°',[57,60,63],'tension'],['III','B♭',[58,62,65],'repos'],['iv','Cm',[60,63,67],'mouvement'],['v','Dm',[62,65,69],'tension'],['VI','E♭',[51,55,58],'mouvement'],['VII','F',[53,57,60],'tension']];
  let slots=[0,5,2,6],cur=0,lit=-1;
  root.innerHTML=`<div class="chords" id="sl"></div><div class="row" id="dg"></div><p class="note" id="rd"></p><div class="row" style="margin-top:12px"><button class="btn primary" id="play">▶ Écouter ma progression</button></div>`;
  const draw=()=>{
    root.querySelector('#sl').innerHTML=slots.map((d,i)=>`<div class="chord pick${i===cur?' sel':''}${i===lit?' lit':''}" data-i="${i}">${D[d][1]}<small>${D[d][0]} · ${D[d][3]}</small></div>`).join('');
    root.querySelectorAll('#sl .chord').forEach(c=>c.onclick=()=>{cur=+c.dataset.i;draw();});
    root.querySelector('#dg').innerHTML=D.map((d,i)=>`<button class="btn${slots[cur]===i?' on':''}" data-i="${i}">${d[0]} ${d[1]}</button>`).join('');
    root.querySelectorAll('#dg .btn').forEach(b=>b.onclick=()=>{slots[cur]=+b.dataset.i;cur=(cur+1)%4;draw();});
    const f=slots.map(i=>D[i][3]),last=f[3];
    root.querySelector('#rd').textContent=f.join(' → ')+'. '+(slots[0]!==0?`Elle ne démarre pas sur le i : la tonalité est plus ambiguë, ce qui peut être voulu. `:'')+
      (last==='tension'?`Elle finit sur une tension : la boucle se relance d'elle-même.`:last==='repos'?`Elle finit au repos : bonne fin de section, mais la boucle relance moins.`:`Elle finit en mouvement : fin ouverte, plus douce.`);};
  draw();
  root.querySelector('#play').onclick=e=>toggleLoop(e.currentTarget,110,64,(s,t,d)=>{

    if(s%4===0)kick(t,master,.5);
    if(s%4===2){noise(t,master,.08,'highpass',7000,.05);tone(t,mtof(c[0]-12),d*1.5,{vol:.28,cutoff:500});}
  },null,()=>{lit=-1;draw();});
},

    const k=cv2d(cv);if(!k)return;const {g,W,H,C}=k,span=q*8,X=t=>12+t/span*(W-24),base=H-24;
    g.font='10px '+(C('--mono')||'monospace');for(let b=0;b<=8;b++){g.strokeStyle=C('--border');g.lineWidth=b%4===0?2:1;g.beginPath();g.moveTo(X(b*q),10);g.lineTo(X(b*q),base);g.stroke();if(b<8){g.fillStyle=C('--muted');g.fillText(String(b%4+1),X(b*q)+3,H-8);}}
    for(let i=0;i<=60;i++){const t=i*dl,a=Math.pow(fb,i);if(t>span||(i&&a<.02))break;g.fillStyle=i?C('--accent'):C('--text');g.globalAlpha=i?Math.max(.3,1-i*.09):1;g.fillRect(X(t)-3,base-a*(base-16),6,a*(base-16));g.globalAlpha=1;}};
  VIZ.push(draw);choice(root,'#yd',T.map(t=>t[0]),()=>P.div,i=>{P.div=i;draw();});bind(root,'yf',v=>v+' %',v=>{P.fb=v;draw();});bind(root,'yb',v=>v+' BPM',v=>{P.bpm=v;draw();});
},

vlim(root){
  const P={drive:0,norm:false},N=640,sig=[];for(let i=0;i<N;i++){const ph=i%80,k=.95*Math.exp(-ph/9)*Math.sin(ph*.9),sn=(i%160>=80&&i%160<96)?.5*Math.exp(-(i%160-80)/6)*Math.sin(i*2.3):0,bed=.2*Math.sin(i*.37)*Math.sin(i*.051)+.12*Math.sin(i*1.31);sig.push(k+sn+bed);}
  const rms=a=>Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length),pk=a=>Math.max(...a.map(Math.abs)),r0=rms(sig);
  root.innerHTML=`<canvas class="eqcv" id="c" style="height:200px"></canvas>${slider('ld2','Gain dans le limiteur',0,18,.5,0)}<div class="row" style="margin-top:12px"><button class="btn" id="ln"></button></div><p class="note" id="lx"></p>`;
  const cv=root.querySelector('#c');
  const draw=()=>{const ceil=.89,gn=Math.pow(10,P.drive/20);let out=sig.map(v=>Math.max(-ceil,Math.min(ceil,v*gn)));const gain=20*Math.log10(rms(out)/r0);if(P.norm){const s=r0/rms(out);out=out.map(v=>v*s);}
    const crest=20*Math.log10(pk(out)/rms(out)),c0=20*Math.log10(pk(sig)/r0);
    root.querySelector('#lx').textContent=`Volume perçu gagné : +${gain.toFixed(1)} dB. Facteur de crête (écart entre les pics et le niveau moyen) : ${crest.toFixed(1)} dB, contre ${c0.toFixed(1)} dB au départ. `+(P.norm?`Après normalisation, la plateforme a ramené le morceau au volume de l'original : il ne sonne pas plus fort, mais ses frappes sont ${crest<c0-1?`désormais plus petites que celles de la version dynamique`:`intactes`}.`:P.drive>8?`Les pics de kick sont rabotés contre le plafond : le signal devient une « saucisse ». Active la normalisation pour voir ce que l'auditeur reçoit.`:`Tant que seuls quelques pics touchent le plafond, le limiteur reste transparent.`);
    const k=cv2d(cv);if(!k)return;const {g,W,H,C}=k,mid=H/2,sc=H/2-12,X=i=>i/(N-1)*W;
    const wave=(arr,col,al,lw)=>{g.beginPath();arr.forEach((v,i)=>i?g.lineTo(X(i),mid-v*sc):g.moveTo(X(i),mid-v*sc));g.strokeStyle=col;g.globalAlpha=al;g.lineWidth=lw;g.stroke();g.globalAlpha=1;};
    wave(sig,C('--text'),.28,1.2);wave(out,C('--accent'),1,1.6);
    g.setLineDash([4,4]);g.strokeStyle=C('--red');g.lineWidth=1;[-1,1].forEach(s=>{g.beginPath();g.moveTo(0,mid+s*ceil*sc);g.lineTo(W,mid+s*ceil*sc);g.stroke();});g.setLineDash([]);
    g.font='10px '+(C('--mono')||'monospace');g.fillStyle=C('--red');g.fillText('plafond −1 dB',6,mid-ceil*sc-3);g.fillStyle=C('--muted');g.fillText('gris : mix d\'origine · couleur : après limiteur'+(P.norm?' et normalisation':''),6,H-4);};
  VIZ.push(draw);bind(root,'ld2',v=>'+'+v+' dB',v=>{P.drive=v;draw();});toggleBtn(root,'#ln','Après normalisation de la plateforme',()=>P.norm,v=>{P.norm=v;draw();});
},

swinglab(root){
  const P={bpm:92,sw:50,res:0,q:100,sn:0,hh:0,rnd:0,acc:true};
  const PRE=[['Grille stricte',[120,50,0,100,0,0,0,0],`Tout sur la grille, vélocités plates. C'est le point de départ d'un clip MIDI dessiné à la souris, et le choix assumé de la trap, de la pop et de la techno dure.`],
   ['House',[124,57,0,100,0,0,2,1],`57 % sur les doubles-croches, tout quantifié, accents sur les charleys. Le kick ne bouge pas : c'est contre lui que le balancement s'entend.`],
   ['Sampler à pads',[90,63,0,100,10,0,3,1],`Quantifié à 100 %, mais sur une grille à 63 %. Régulier et pourtant traînant : le son du boom bap. La caisse claire est légèrement retardée.`],
   ['Non quantifié',[88,58,0,25,24,-11,5,1],`Quantification à 25 % : le geste d'origine est presque intact. Caisse claire nettement en retard, charleys en avance. Les instruments ne sont pas d'accord entre eux, et c'est exactement l'effet recherché.`],
   ['Beat « ivre »',[78,60,0,0,32,-9,8,1],`Aucune quantification, retard de caisse claire à la limite du flam. La pulsation semble trébucher à chaque mesure. Baisse le retard à 0 pour mesurer à quel point tout repose sur lui.`],
   ['Garage 2-step',[132,64,0,100,0,0,2,1],`Swing très marqué à tempo rapide. Remarque qu'à 132 BPM, 64 % ne représente que 32 ms de retard : il faut pousser le pourcentage pour qu'il s'entende.`],
   ['Shuffle en croches',[104,64,1,100,0,0,3,1],`Même pourcentage, mais appliqué aux croches : on bascule dans un shuffle de blues. C'est la résolution, pas la quantité, qui change le style.`]];
  let pre=0,now=-1;const els={};
  const PERF={k:[0,0,0,0,0,0,0,14,0,0,-9,0,0,0,0,0],s:[0,0,0,0,11,0,0,0,0,0,0,0,17,0,0,-6],h:[3,-8,6,12,-4,9,-7,15,2,-11,8,13,-5,10,-9,16]};
  const G={k:[2,0,0,0,0,0,0,1,0,0,2,0,0,0,0,0],s:[0,0,0,0,2,0,0,0,0,0,0,0,2,0,0,1],h:[2,1,1,1,2,1,1,1,2,1,1,1,2,1,1,1]};
  root.innerHTML=`<div class="row" id="lp"></div><p class="note" id="lt" style="margin:10px 0 12px"></p><canvas class="eqcv" id="c" style="height:190px"></canvas>
    ${slider('lb','Tempo',70,140,1,92)}${slider('lsw','Swing',50,75,1,50)}${slider('lq','Quantification',0,100,5,100)}${slider('lsn','Caisse claire',-30,40,1,0)}${slider('lhh','Charleys',-30,30,1,0)}${slider('lr','Aléatoire',0,20,1,0)}
    <div class="row" id="lres" style="margin-top:12px"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="play">▶ Écouter</button><button class="btn" id="la"></button></div><p class="note" id="lx"></p>`;
  const cv=root.querySelector('#c'),d16=()=>60/P.bpm/4;
  const swOff=s=>{const d=d16();if(P.res===0)return s%2?(P.sw-50)/50*d:0;return s%4===2?(P.sw-50)/50*2*d:0;};          // secondes
  const off=(lane,s)=>swOff(s)+PERF[lane][s]/1000*(1-P.q/100)+(lane==='s'?P.sn:lane==='h'?P.hh:0)/1000;
  const draw=()=>{const d=d16()*1000,so=P.res===0?(P.sw-50)/50*d:(P.sw-50)/50*2*d;
    root.querySelector('#lx').innerHTML=`À ${P.bpm} BPM, une double-croche dure <b>${Math.round(d)} ms</b>. Swing ${P.sw} % en ${P.res?'croches':'doubles-croches'} = retard de <b>${Math.round(so)} ms</b> sur les notes concernées.`+(P.sn?` Caisse claire ${P.sn>0?'en retard':'en avance'} de ${Math.abs(P.sn)} ms${Math.abs(P.sn)>30?', proche du flam':''}.`:'')+(P.hh?` Charleys ${P.hh>0?'en retard':'en avance'} de ${Math.abs(P.hh)} ms.`:'')+(P.q<100?` Quantification à ${P.q} % : il reste ${100-P.q} % du geste d'origine.`:'');
    const k=cv2d(cv);if(!k)return;const {g,W,H,C}=k,m=64,st=(W-m-12)/16,lanes=[['h','Charleys'],['s','Caisse claire'],['k','Kick']],lh=(H-34)/3;
    g.font='10px '+(C('--mono')||'monospace');for(let i=0;i<=16;i++){const x=m+i*st;g.strokeStyle=C('--border');g.lineWidth=i%4===0?2:1;g.setLineDash(i%4===0?[]:[3,4]);g.beginPath();g.moveTo(x,18);g.lineTo(x,H-14);g.stroke();if(i<16&&i%4===0){g.fillStyle=C('--muted');g.fillText(String(i/4+1),x+3,12);}}g.setLineDash([]);
    if(now>=0){g.fillStyle=C('--text');g.globalAlpha=.07;g.fillRect(m+now*st,18,st,H-32);g.globalAlpha=1;}
    lanes.forEach(([id,label],y)=>{const cy=24+lh*y+lh/2;g.fillStyle=C('--muted');g.font='11px '+(C('--sans')||'sans-serif');g.fillText(label,2,cy+4);
      for(let s=0;s<16;s++){const v=G[id][s];if(!v)continue;const o=off(id,s)*1000,x=m+s*st+o/d*st,r=(P.acc?(v===2?7:4):5.5);
        if(Math.abs(o)>.5){g.strokeStyle=o>0?C('--accent'):C('--amber');g.lineWidth=1.5;g.beginPath();g.moveTo(m+s*st,cy);g.lineTo(x,cy);g.stroke();}
        if(P.rnd){g.beginPath();g.arc(x,cy,r+P.rnd/d*st,0,Math.PI*2);g.fillStyle=C('--muted');g.globalAlpha=.18;g.fill();g.globalAlpha=1;}
        g.beginPath();g.arc(x,cy,r,0,Math.PI*2);g.fillStyle=Math.abs(o)<=.5?C('--text'):o>0?C('--accent'):C('--amber');g.fill();}});
    g.fillStyle=C('--muted');g.font='10px '+(C('--mono')||'monospace');g.fillText('couleur : en retard · ambre : en avance · halo : aléatoire',m,H-2);};
  VIZ.push(draw);
  [['lb','bpm',v=>v+' BPM'],['lsw','sw',v=>v+' %'],['lq','q',v=>v+' %'],['lsn','sn',v=>(v>0?'+':'')+v+' ms'],['lhh','hh',v=>(v>0?'+':'')+v+' ms'],['lr','rnd',v=>'± '+v+' ms']].forEach(([id,key,f])=>els[id]=bind(root,id,f,v=>{P[key]=v;draw();}));
  const resD=choice(root,'#lres',['Swing des doubles-croches','Swing des croches'],()=>P.res,i=>{P.res=i;draw();});
  const accB=root.querySelector('#la'),accD=()=>{accB.textContent='Accents : '+(P.acc?'on':'off');accB.classList.toggle('on',P.acc);};accB.onclick=()=>{P.acc=!P.acc;accD();draw();};
  const load=i=>{pre=i;const a=PRE[i][1];['lb','lsw',null,'lq','lsn','lhh','lr'].forEach((id,k)=>{if(id){els[id].value=a[k];els[id].oninput();}});P.res=a[2];P.acc=!!a[7];resD();accD();root.querySelector('#lt').textContent=PRE[i][2];draw();};
  choice(root,'#lp',PRE.map(p=>p[0]),()=>pre,load);load(0);
  const bass={0:31,7:31,10:34,14:29};
  root.querySelector('#play').onclick=e=>{const btn=e.currentTarget;if(current&&current.btn===btn){stopLoop();return;}stopLoop();ac();
    let step=0,next=ctx.currentTime+.1;current={btn,label:btn.textContent,cleanup:()=>{now=-1;draw();}};btn.textContent='■ Stop';btn.classList.add('on');
    timer=setInterval(()=>{while(next<ctx.currentTime+.15){const d=d16(),s=step%16,rn=()=>(Math.random()-.5)*2*P.rnd/1000,T=l=>Math.max(ctx.currentTime,next+.04+off(l,s)+rn()),vv=v=>P.acc?(v===2?1:.4):.7;
      if(G.k[s])kick(T('k'),master,.8*vv(G.k[s]));
      if(G.s[s]){const t=T('s'),v=vv(G.s[s]);noise(t,master,.5*v,'bandpass',1600,v<.6?.08:.16);if(v>=.6)tone(t,185,.05,{type:'triangle',vol:.2,cutoff:1200,a:.002,r:.06});}
      if(G.h[s])noise(T('h'),master,.15*(P.acc?[1,.35,.6,.35][s%4]:.6),'highpass',7500,.04);
      if(bass[s]!==undefined){const t=T('k');tone(t,mtof(bass[s]),d*1.6,{type:'sine',vol:.4,cutoff:2000,a:.005,r:.04});tone(t,mtof(bass[s]+12),d*1.6,{vol:.13,cutoff:600,a:.005,r:.04});}
      const ss=s;setTimeout(()=>{if(current&&current.btn===btn){now=ss;draw();}},Math.max(0,(next+.04-ctx.currentTime)*1000));step++;next+=d;}},25);};
},

    else if(v>-13){V.textContent='Baissé de '+Math.abs(a).toFixed(1)+' dB';V.style.color='var(--amber)';X.textContent='Zone courante pour l\'électro et la pop : dense mais encore dynamique. Vérifie que le kick garde son impact après le limiteur.';}
    else if(v>=-16){V.textContent='Quasi inchangé';V.style.color='var(--green)';X.textContent='Proche des cibles de streaming : ce que tu entends en studio est ce que l\'auditeur recevra.';}
    else{V.textContent='Plus faible que la cible';V.style.color='var(--amber)';X.textContent='Spotify remonte les masters plus faibles que sa cible, mais seulement tant que leurs crêtes restent 1 dB sous le maximum : un morceau très dynamique restera un peu en dessous des autres.';}
  });
}

const EN={};                    // EN.GLOSS, EN.QUIZ, EN.TOPICS… : mêmes structures que le français, champs texte seulement
EN.TOPICS=[
{lede:`Invent the raw material: a melody, some chords, a rhythm. If this stage is weak, nothing downstream will save it.`,
 concepts:[
  [`Key`,`The 7-note "pool" you draw from. In G minor: G A B♭ C D E♭ F. Staying inside it guarantees everything sounds coherent.`],
  [`Harmony`,`The chords that carry the emotion. The same melody turns sad, epic or funky depending on the chords placed under it.`],
  [`Melody & hook`,`The phrase you remember. A good hook fits in 2 to 4 bars, uses few notes, and repeats with small variations.`],
  [`Rhythm`,`Placement in time. Shifting a note by one 16th note (syncopation) is enough to turn a flat line into groove.`]],
 example:`<p>A single vocal motif repeated over an arpeggio in G minor at 110 BPM: the whole composition fits into <b>one hook + a 4-chord progression</b>. That's the French-house principle: the interest doesn't come from new ideas, but from how you reveal and transform the same one.</p>`,
 extras:[
  {title:`going further · the 7 chords of the key`,demo:'prog',html:`<p>Every note of the scale carries a chord. In G minor, that gives you 7 "free" chords that all sound right together. They sort into three functions (a simplified grouping, good enough for writing): <b>rest</b> (you're home), <b>movement</b> (you're drifting away), <b>tension</b> (you want to come back).</p>
   <p>Pick a slot, then choose a degree. Listen to how the order of functions changes the feeling, and what happens when the loop ends on tension versus on rest.</p>`},
  {title:`going further · motif and variation`,demo:'mel',html:`<p>A hook is memorized because it comes back, but it wears thin if it comes back unchanged. The skill is in the dosage: <b>change one thing at a time</b>. The loop plays the motif (bars 1 and 3) then the chosen variant (bars 2 and 4).</p>`},
  {title:`going further · the method`,cls:'',html:{steps:[
   [`Set the frame.`,`Key, tempo, and one mood reference. Constraints speed things up.`],
   [`Four chords.`,`Start on the i, end on tension. One bar per chord. Don't chase originality here.`],
   [`Bass on the fundamentals.`,`One note per chord, then a rhythm. It's the bass that installs the groove, not the melody.`],
   [`A 2-bar motif, 4 notes max.`,`Aim for chord notes on the strong beats: that's what makes a melody "stick".`],
   [`Question / answer.`,`Bars 1–2: the motif ends up in the air (not on the tonic). Bars 3–4: the same motif ends on the tonic. The ear hears a complete phrase.`],
   [`One variation per repeat, max.`,`Last note, or rhythm, or octave. Never all at once.`]]}}
 ],
 viz:[{title:`the scale and its chords on the keyboard`,demo:'vkbd',html:`<p>In plain color, the scale's notes; in bright color, the chosen chord's. Change the tonic or the mode: the pattern shifts, but the logic stays the same. A chord is built by taking <b>every other note</b> in the scale.</p>`}],
 err:`<p><b>Piling up ideas.</b> Three different melodies in the same track = none of them gets remembered. One strong hook, repeated and varied, always beats five average ideas.</p>`,
 todo:`<p>In Live 12, turn on <b>Scale</b> in a MIDI clip (G minor), then write a 2-bar motif with <b>4 notes max</b>. Duplicate it and change only the last note.</p>`},

{lede:`What makes heads move. Groove doesn't come from the number of elements, but from three things: where hits fall, how hard, and with what slight delay.`,
 concepts:[
  [`Roles`,`<b>Kick</b>: the pulse, the ground. <b>Snare or clap</b>: the backbeat, on beats 2 and 4. <b>Hi-hats</b>: the subdivision, which sets the felt speed. <b>Percussion</b>: color and responses.`],
  [`The 16-step grid`,`A 4-beat bar split into 16th notes. Steps 1, 5, 9, 13: the beats. Steps 3, 7, 11, 15: the offbeats ("and"). The rest: the weak 16ths, where syncopation lives.`],
  [`Velocity`,`The force of each hit. A drummer never plays two identical ones: accents on the beats, weak hits in between. That's the difference between a pulse and a machine gun.`],
  [`Ghost notes`,`Very soft snare hits slipped in between the accents. You barely notice them, but the beat falls flat if you remove them.`],
  [`Swing`,`Delaying the even 16th notes. At 50%: straight, mechanical. Around 54–58%: a subtle bounce, typical of house. Past 62%: outright triplet feel, hip-hop.`]],
 example:`<p>A 16-step sequencer. Load a style, listen, then edit it: one click places a strong hit, a second click makes it soft (ghost), a third erases it. Try removing a single kick from the house pattern, or adding two snare ghosts: the character changes instantly.</p>`,
 extras:[
  {title:`going further · the same pattern, three ways to play it`,demo:'feel',html:`<p>Strictly identical pattern: kick on the beats, clap on 2 and 4, hi-hats in 16th notes. Only the execution changes. <b>Machine</b>: everything at the same force, perfectly on the grid. <b>Accents</b>: tiered velocities. <b>Accents + human</b>: on top of that, a few milliseconds of imprecision and slight force variations.</p>`},
  {title:`going further · anatomy of a kick`,demo:'kickd',html:`<p>An electronic kick is a sine wave whose pitch drops very fast, plus an attack click. Four settings are enough to go from a dry house kick to an 808 acting as a bass. Notice a long kick occupies the low end continuously: it leaves no room for a bassline.</p>`},
  {title:`going further · rhythmic signatures by style`,cls:'',html:{grid:[
   [`House · 120–128 BPM`,`Kick on the 4 beats, clap on 2 and 4, open hi-hat on every offbeat. Light swing on the 16th notes.`],
   [`Disco / nu-disco · 110–125`,`Same skeleton as house, heavily accented 16th-note hi-hats, occasional syncopated kicks, an octave bass dialoguing with the kick.`],
   [`Funk · 95–115`,`A syncopated kick that avoids certain beats, snare on 2 and 4 surrounded by ghost notes. All the groove lives in the weak 16ths.`],
   [`Boom bap · 85–95`,`Heavy, offset kick, dry snare on 2 and 4, pronounced swing (60% and up), hi-hats in eighth notes.`],
   [`Techno · 125–140`,`Hard four-on-the-floor, little swing, metallic hi-hats and percussion. The groove comes from timbre and automation more than placement.`],
   [`Drum & bass · 170–175`,`"Two-step": kick on the 1 and just before the 3, snare on 2 and 4, fast ghosts and hi-hats in between.`]],note:`Tempos given as common ballpark figures; the borders between styles are porous.`}},
  {title:`going further · the method`,cls:'',html:{steps:[
   [`The skeleton.`,`Kick and backbeat alone. If that doesn't already nod the head with two elements, no hi-hat will save it.`],
   [`The subdivision.`,`Hi-hats in eighth or 16th notes: this choice sets the felt energy, at the same tempo.`],
   [`The velocities.`,`Tier them: strong beats, medium offbeats, weak 16ths. Start there before adding anything.`],
   [`Swing, the same everywhere.`,`The same amount of swing on every rhythmic element, bass included. Two different swings produce flams, not groove.`],
   [`The gaps.`,`Ghost notes and percussion in the holes left by the kick and snare. A percussion hit landing at the same time as an accent does nothing.`],
   [`Lock kick and bass together.`,`Either the bass plays with the kick (impact), or it answers in the gaps (dialogue). Decide, and stick to it for the section.`],
   [`Vary every 4 or 8 bars.`,`A dropped kick, a fill, an open hi-hat at the end of a cycle. The brain needs a landmark to feel the structure.`]]}}
 ],
 viz:[{title:`swing and accents, seen on the grid`,demo:'vswing',html:`<p>A 16-step bar. The dotted lines mark the exact grid; the dots show where hits actually fall. Turn up the swing and watch the even 16th notes slide to the right.</p>`}],
 err:`<p><b>Everything at the same velocity, 100% quantized.</b> The reflex when a beat feels lifeless is to add elements: one more percussion, one more loop. The problem is almost always execution, not content. Three well-accented elements groove more than ten flat ones.</p>`,
 todo:`<p>In a <b>Drum Rack</b>, program a kick, clap and hi-hats in 16th notes. Step 1: in the clip's velocity lane, lower every other hi-hat hit, then the weak 16ths too. Step 2: open the <b>Groove Pool</b>, drag a "Swing 16" groove onto the drum clip <b>and</b> the bass clip, and set the same global Amount. Compare at 0%, 30% and 60%.</p>`},

{lede:`The bass links the drums and the chords. It's also the hardest zone to judge: the one your headphones flatter, your phone ignores, and a club amplifies.`,
 concepts:[
  [`A dual role`,`<b>Harmonic</b>: it plays the chord's fundamental, telling the ear which chord it's hearing. <b>Rhythmic</b>: its placement relative to the kick builds the groove. A bassline is composed like a drum part that happens to have notes.`],
  [`Sub and low-mids`,`Two tiers. The <b>sub</b> (30–80 Hz) is felt: weight, pressure. The <b>low-mids</b> (100–800 Hz) is heard: it's what lets you follow the line, especially on small speakers.`],
  [`Fundamental and harmonics`,`A 49 Hz sine only exists at 49 Hz. A phone doesn't go below 150–200 Hz: for it, that bass note doesn't exist. With harmonics (98, 147, 196 Hz…), the ear <b>reconstructs</b> the missing note.`],
  [`Mono`,`Below 100–120 Hz, everything centered. Stereo low end translates into mono cancellations, an unpressable vinyl, and a club where the bass changes depending on where you're standing.`],
  [`Note length`,`Where a note stops matters as much as where it starts. Short notes leave gaps: it bounces. Held notes fill: it pushes. Silence is part of the line.`]],
 example:`<p>Same progression (Gm – E♭ – B♭ – F), same kick: only the bassline changes. Move from one style to another, then play with <b>note length</b>: at 30%, the line turns percussive; at 100%, it becomes a carpet. Notice the "offbeat" style naturally avoids the kick, with no processing at all.</p>`,
 extras:[
  {title:`going further · building a two-layer bass`,demo:'layers',html:`<p>A <b>sub</b> layer (pure sine) and a <b>mid</b> layer (filtered sawtooth, cut below 120 Hz so it doesn't double the sub). The <b>Small speakers</b> button simulates a phone by removing everything below 180 Hz.</p>
   <p>The experiment to run: sub alone, then Small speakers: the bass vanishes completely. Now turn on <b>saturation</b> on the sub: it manufactures harmonics, and the line becomes audible again even though there's still no low end at all. Finally, add the mid layer.</p>`},
  {title:`going further · the key decides the weight`,demo:'subnote',html:`<p>Not all low notes are equal. Too low, the sub only comes through on big systems; too high, it loses its weight. The usable zone sits roughly between <b>low E and A (41–55 Hz)</b>. Listen to each note, on headphones, at a moderate volume.</p>`},
  {title:`going further · six basses worth knowing`,cls:'',html:{grid:[
   [`Sub / 808`,`A sine or a very long tuned kick. All weight, no definition: needs saturation or a mid layer to exist everywhere.`],
   [`House pluck`,`Saw or square, closed filter with a short envelope. Percussive, placed on the offbeats. Filtered house's bass.`],
   [`Octave bass`,`Alternates the fundamental and its octave in eighth notes. A disco and nu-disco signature: maximum energy from two notes.`],
   [`Acid (303)`,`Saw or square in a very resonant filter, with slides and accents. The character comes from the automated cutoff, not the notes.`],
   [`Reese`,`Two detuned sawtooths beating against each other. Dark and moving, drum & bass and garage. Sub handled separately.`],
   [`FM bass`,`A metallic, sharp attack that cuts through the mix, with a round body. Electro-funk, synthwave. In Live: Operator.`]]}},
  {title:`going further · the method`,cls:'',html:{steps:[
   [`Pick the register.`,`Check where your key's fundamental falls. If it's below 35–40 Hz, play the line an octave higher.`],
   [`Write the rhythm first.`,`On a single note, against the kick. With it (impact) or between its hits (dialogue): decide before thinking about notes.`],
   [`Lay down the fundamentals.`,`One note per chord. That's enough 80% of the time. Then add octaves and fifths, and approach notes right before a chord change.`],
   [`Set the lengths.`,`Shorten until it bounces. Check that no note bleeds into the next kick.`],
   [`Build it in two layers.`,`A clean, stable sub, a mid layer for character. High-pass the mid layer around 100–120 Hz.`],
   [`Everything mono below 120 Hz.`,`No unison, chorus or widener on the sub. Width belongs to the mid layer.`],
   [`Check on three systems.`,`Headphones, spectrum, and a small-speakers simulation. The line has to stay readable on all three.`]]}}
 ],
 viz:[{title:`why a bass disappears on a phone`,demo:'vharm',html:`<p>The frequency content of a bass note. Compare the three sounds with small speakers turned on, then raise the note: the higher it is, the more of its harmonics make it through.</p>`}],
 err:`<p><b>A huge bass on headphones, absent everywhere else.</b> A pure sub flatters a good closed-back headphone and produces nothing on a phone, a laptop, or a smart speaker. The reflex is to turn the sub up: that changes nothing on those systems, and it eats into the master's entire headroom. The fix is in the harmonics, not the volume.</p>`,
 todo:`<p>Create a two-chain <b>Instrument Rack</b>. Chain 1: <b>Operator</b>, a single sine, followed by a light <b>Saturator</b>. Chain 2: <b>Analog</b> or <b>Wavetable</b> on sawtooth, closed filter, followed by an EQ Eight high-pass at 120 Hz. After the rack: <b>Utility</b>, Bass Mono at 120 Hz. Final test: temporarily place an EQ Eight high-pass at 180 Hz on the master. If you can no longer follow the line, reinforce chain 2.</p>`},

{lede:`Deciding who plays, when, and for how long. It's what turns an 8-bar loop into a 5-minute track.`,
 concepts:[
  [`Block structure`,`Dance music moves forward in 8- or 16-bar blocks: intro, build, drop, break, outro. The listener senses these blocks, even without counting.`],
  [`Tension / release`,`You remove energy (break) so its return (drop) has an effect. No dip, no peak.`],
  [`The 8-bar rule`,`Every 8 bars, something changes: an element enters, leaves, or transforms (a filter opening, a hi-hat doubling).`],
  [`Contrast`,`Dense/empty, low/high, dry/reverbed. The contrast between sections matters more than how rich each one is.`]],
 example:`<p>Click a section to see what's happening in it, in a typical French-house track (≈116 BPM). Solid square = the element plays; light square = filtered or partial. The bars at the bottom show perceived energy.</p>`,
 extras:[
  {title:`going further · transition tools`,cls:'',html:{grid:[
   [`Opening filter`,`Automated low-pass on the chords or the whole bus. The French-house signature: you reveal the sound instead of adding to it.`],
   [`Riser`,`Noise or a note rising in pitch and volume. Tells the listener something is coming.`],
   [`Snare roll`,`Quarter notes, then eighths, then sixteenths: rhythmic density accelerates and creates urgency.`],
   [`Silence`,`Cutting everything for a beat (or a bar) right before the drop. The most powerful contrast, and the cheapest.`],
   [`Impact / crash`,`Marks the first beat of the new section. Without it, the entrance feels soft.`],
   [`Reverse`,`A reversed cymbal or reverb that "pulls" toward the strong beat. Subtle, very effective right before a vocal.`]]}},
  {title:`going further · building a build`,demo:'trans',html:`<p>Four bars of build, then four bars of drop, on a loop. Turn each technique on and off to hear what it adds. Try especially: everything off (the drop arrives with no warning), then <b>silence alone</b>.</p>`},
  {title:`going further · density and attention`,cls:'',html:{concepts:[
   [`Three or four focal elements, no more`,`The ear follows a rhythm, a bass, a harmonic element and a vocal or lead. Beyond that, elements fight each other. If you add something, ask what's coming out.`],
   [`Arrangement is the first mixing pass`,`Two synths in the same register at the same time is an EQ problem you're creating yourself. Spread parts across register (low, mid, high) and in time.`],
   [`Keep something in reserve`,`If everything is spent on drop 1, drop 2 can only repeat. Hold back a layer: the lead, a bass octave, an open hi-hat.`],
   [`Automation = life`,`A static sound over 16 bars gets tiring. Cutoff, reverb send, volume: a slow movement is enough to keep the interest alive.`]]}},
  {title:`going further · the method`,cls:'',html:{steps:[
   [`Build the densest moment first.`,`Your complete loop = drop 2. Everything else follows from it.`],
   [`Duplicate across the whole length.`,`5 to 6 minutes for a club format, 3 to 4 for a listening format.`],
   [`Place section markers.`,`Locators in Live: Intro, Build, Drop 1, Break, Build 2, Drop 2, Outro, in 8- or 16-bar blocks.`],
   [`Subtract.`,`In each section, delete clips until you get the energy curve you want. Keep something in reserve for drop 2.`],
   [`Craft the 4 bars before every change.`,`Filter, riser, roll, silence. One or two techniques per transition, not all of them.`],
   [`Listen all the way through, screen off.`,`Note where your attention drops: that's where a change is missing.`]]}}
 ],
 viz:[{title:`a track's energy curve`,demo:'vtension',html:`<p>Arrangement is drawing this curve. Compare three profiles: a club track, a pop song, and a loop that was never arranged at all.</p>`}],
 err:`<p><b>The loop that never becomes a track.</b> Everything plays all the time, so nothing can "arrive". The drop only has impact if the bass and kick were absent right before it.</p>`,
 todo:`<p><b>Subtractive arrangement</b>: in Arrangement View, duplicate your full loop across 5 minutes, then <b>delete</b> elements to carve out the intro, break and outro. Much faster than building up from nothing.</p>`},

{lede:`Crafting the timbre of every instrument. Three settings explain 80% of a synth sound: the wave, the filter, the envelope.`,
 concepts:[
  [`Waveform`,`Sine = a single frequency, pure sound. Sawtooth = every harmonic, rich and bright. Square = odd harmonics, a hollow, video-game sound.`],
  [`Filter`,`A low-pass removes the highs above the cutoff frequency. Resonance accentuates the zone around the cutoff: the characteristic "wah".`],
  [`ADSR envelope`,`How volume evolves over time. Short attack + short release = percussive bass. Long attack = slowly rising pad.`],
  [`Modulation (LFO)`,`A setting that moves on its own, in time: cutoff wobbling, volume trembling. It's what makes a sound feel alive.`]],
 example:`<p>A French-house bass: sawtooth, low-pass filter around <b>300–800 Hz</b>, very short envelope. Open the cutoff during the build and you get the famous "opening filter". Try it below: same notes, radically different sounds.</p>`,
 extras:[
  {title:`going further · four synthesis families`,cls:'',html:{grid:[
   [`Subtractive`,`Rich wave + a filter that removes. Basses, leads, analog pads. In Live: Analog, Drift.`],
   [`FM`,`One oscillator modulates another's frequency. Metallic sounds, bells, electric pianos, percussive basses. In Live: Operator.`],
   [`Wavetable`,`Sweeping through a table of waveforms: the timbre evolves over time. Modern, moving sounds. In Live: Wavetable.`],
   [`Sampling`,`Starting from a recording that's sliced, transposed, filtered. All of filtered house comes from here. In Live: Simpler, Sampler.`]]}},
  {title:`going further · motion: an LFO on the filter`,demo:'lfo',html:`<p>An LFO is an oscillator too slow to be heard, used to <b>move a setting for you</b>. Here it drives a held bass's cutoff. Locked to the tempo, it becomes a rhythmic element in its own right.</p>
   <p>Try: 1/8 speed with a sine (a gentle pulse), then 1/16 with a square (a chopped effect), then depth at 0 to measure just how lifeless the sound becomes.</p>`},
  {title:`going further · thickness: unison and detune`,demo:'uni',html:`<p>A single voice sounds thin and centered. Stack several slightly detuned copies spread across the stereo field: the sound becomes wide and dense. That's the "supersaw" principle.</p>`},
  {title:`going further · the method`,cls:'',html:{steps:[
   [`Describe the target in three words.`,`For instance: "bass, round, short". Without a target, you're turning knobs at random.`],
   [`Choose the wave.`,`Rich (saw, square) if you plan to filter; sine for a sub or an FM base.`],
   [`Set the filter.`,`Cutoff for brightness, resonance for character.`],
   [`Set the volume envelope.`,`Attack and release decide whether it's a percussion hit, a bass, or a pad.`],
   [`Add motion.`,`An envelope or an LFO on the cutoff. One well-dosed movement beats four.`],
   [`Thicken last.`,`Unison, then effects (saturation, chorus). Never unison on the sub: the low end has to stay mono and stable.`]]}}
 ],
 viz:[{title:`waveform, harmonics and filter`,demo:'vwave',html:`<p>A periodic sound is a sum of sine waves: the fundamental and its harmonics. The waveform and the spectrum are two views of the same thing. In gray, the original harmonics; in color, what's left after the low-pass filter.</p>`},
  {title:`the ADSR envelope`,demo:'vadsr',html:`<p>Volume's path during a note. Load a preset, listen, then move a single slider: it's the envelope, more than the waveform, that makes something sound like a percussion hit, a bass, or a pad.</p>`}],
 err:`<p><b>Hunting for the perfect preset for an hour.</b> Take a preset that's 70% right and adjust cutoff + envelope: those two settings are what fit it to your track.</p>`,
 todo:`<p>Open <b>Wavetable</b> or <b>Analog</b> with the default preset. Touch only three things: the wave, the filter cutoff, the amp's attack/release. Build a bass, then a pad, using only these settings.</p>`},

{lede:`The voice is the element the ear follows first. Two topics here: what makes it intelligible, and how a vocoder grafts that intelligibility onto a synth.`,
 concepts:[
  [`Formants`,`Fixed resonance peaks, shaped by the mouth. They're what tells an "ah" from an "ee" apart, whatever note is being sung. Intelligibility lives mostly between 300 Hz and 3 kHz.`],
  [`Voiced / unvoiced`,`Vowels have pitch (vocal cords). Consonants like "s", "t", "ch", "f" are noise, with no pitch. Any vocal processing has to handle these two materials differently.`],
  [`Vocoder: modulator and carrier`,`The <b>voice</b> (modulator) is split into frequency bands; the level of each band is measured, and those levels are applied to the same bands of a <b>synth</b> (carrier). The synth "speaks" the words.`],
  [`Who decides what`,`The carrier decides the <b>notes</b> and the timbre. The voice only supplies <b>articulation</b>. The melody you sing into the mic doesn't matter at all: you can just talk.`]],
 example:`<p>Start by hearing what a formant is. Same note, same sound source: only three filters change, and you hear different vowels. Compare with the raw source, with no formants: a plain buzz. <b>That's exactly the information a vocoder transfers.</b></p>`,
 extras:[
  {title:`a vocoder, for real`,demo:'voc',html:`<p>The modulator is a synthesized voice running through vowels and a few consonants (or your mic, with headphones). The carrier is a held chord. Use <b>Listen</b> to isolate the three signals: the voice alone, the synth alone, then the result.</p>
   <p>Worth trying: 4 bands (retro robotic, barely intelligible) against 32 bands (precise). Square carrier, then noise (a whisper). Finally, turn on <b>Unvoiced</b>: a little noise added to the carrier gives the words their consonants back.</p>`},
  {title:`going further · four effects people confuse`,cls:'',html:{grid:[
   [`Vocoder`,`Replaces the voice's sound source with a synth. Notes come from the keyboard. Robotic, polyphonic sound. In Live: Vocoder.`],
   [`Talk box`,`The synth's sound is piped into the mouth through a tube; the mouth actually filters it, a mic captures the result. More organic and "wet" than a vocoder.`],
   [`Pitch correction`,`Auto-Tune style: the voice stays the source, only its pitch is snapped to the scale. Set aggressively, it gives the stair-step effect. In Live 12: Auto Shift.`],
   [`Harmonizer`,`Creates transposed copies of the voice to build harmonies. The voice stays recognizable.`]]}},
  {title:`going further · making a vocoder intelligible`,cls:'',html:{concepts:[
   [`A rich, sustained carrier`,`Sawtooth or square, in wide chords covering the spectrum. A sine has nothing to filter: a vocoder can only sculpt harmonics that already exist.`],
   [`A steady voice`,`Compress the voice before the vocoder. If its level drops, the bands close and the word disappears.`],
   [`Over-articulate`,`Exaggerate the consonants and open up the vowels, like on stage. A vocoder smooths out nuance: what feels overdone at the mic sounds normal at the output.`],
   [`Bring back the consonants`,`The Unvoiced setting adds noise when the voice is unvoiced. You can also blend in 10–20% of the natural voice, high-passed.`],
   [`Band count is an aesthetic choice`,`8 to 16: retro, robotic grain. 32 to 40: modern and clear. Neither is "better".`]]}},
  {title:`going further · a lead vocal chain`,cls:'',html:{steps:[
   [`Cleanup.`,`Remove noise between phrases, then high-pass around 80–100 Hz: nothing useful lives below that on a vocal.`],
   [`Subtractive EQ.`,`Sweep to find the "boxiness" (300–600 Hz) and the nasal zone (around 1 kHz). Narrow, moderate cuts.`],
   [`De-essing.`,`Tame the sibilance (5–9 kHz) only when it exceeds a threshold. Essential before adding brightness.`],
   [`Compression.`,`3:1, 3–6 dB of reduction. Two light compressors in series sound more natural than one working hard.`],
   [`Tonal EQ.`,`Wide presence around 3–5 kHz, an air shelf above 10 kHz. Wide, light boosts.`],
   [`Space, via sends.`,`A short plate with 30 ms pre-delay, a filtered delay. Never as an insert.`],
   [`Volume automation.`,`The last move, and the most effective: every word has to stay readable. A compressor doesn't replace the fader.`]]}}
 ],
 viz:[{title:`formants, and what a vocoder sees of them`,demo:'vform',html:`<p>Change the vowel: the three peaks move. Change the pitch: the harmonics move, <b>not the peaks</b>. Then choose a band count to see how precisely a vocoder captures this curve.</p>`}],
 err:`<p><b>A carrier that's too thin.</b> A single sine oscillator, one low note, or an over-filtered sound: the result is dull and incomprehensible, and the vocoder or the recording gets blamed unfairly. A vocoder only reveals harmonics the carrier already contains.</p>`,
 todo:`<p>Track A: your voice (or a voice isolated with Live's stem separation), with <b>Vocoder</b> as an insert, Carrier set to <b>External</b>. Track B: a sawtooth synth playing held chords, chosen as the external source; mute its direct output. Set Bands to 20, then raise <b>Unvoiced</b> until the consonants come back. Then compare Bands 8 and 40.</p>`},

{lede:`Getting every track to coexist so each one is audible in its place. Mixing is first about volumes, then about tidying up frequencies.`,
 concepts:[
  [`Volume balance`,`The mix's single most powerful setting. Before any plugin: faders only, starting from the kick and bass, then adding the rest around them.`],
  [`Gain staging`,`Keep headroom at every stage. If the master peaks around −6 dB before mastering, you're in good shape. Red = digital distortion, irreversible.`],
  [`Subtractive EQ`,`Every instrument only needs part of the spectrum. Cut what's unneeded (high-pass on everything except kick and bass) before boosting anything.`],
  [`Panning`,`Low end centered (kick, bass, lead vocal), high, decorative elements on the sides. Width frees up room at the center.`]],
 example:`<p><b>The kick / bass conflict</b>, the classic one. Both want the 50–120 Hz zone. Solution: decide who owns the sub. For instance the kick keeps 50–60 Hz, the bass is dipped slightly there, and the bass lives at 80–120 Hz, where the kick gets dipped. Explore the map below to know what to look for in each zone.</p>`,
 extras:[
  {title:`going further · the 5 filter shapes`,html:`<div class="ftypes">
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,38 C20,38 25,12 40,12 L80,12" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>High-pass</b><span>Removes everything below the cutoff. Cleanup tool number one: on everything except kick and bass.</span></div>
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,12 L40,12 C55,12 60,38 80,38" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>Low-pass</b><span>Removes the highs. Pushes a sound back in the mix, softens a pad or a reverb.</span></div>
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,20 L25,20 C35,20 35,6 40,6 C45,6 45,20 55,20 L80,20" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>Bell (peak)</b><span>Boosts or cuts a precise zone. Three settings: frequency, gain, and Q (width).</span></div>
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,26 L30,26 C45,26 45,10 60,10 L80,10" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>Shelf</b><span>Boosts or lowers everything beyond a frequency. For a vocal's air or a kick's weight.</span></div>
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,14 L35,14 L40,38 L45,14 L80,14" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>Notch</b><span>A very narrow surgical cut. For a resonance, a whistle, a 50 Hz hum.</span></div></div>
   <p class="note"><b>The Q rule:</b> narrow cuts, wide boosts. A narrow cut removes a flaw without touching the rest; a narrow boost sounds artificial and resonant, while a wide one stays natural.</p>`},
  {title:`going further · EQ'ing a pad in context`,demo:'eq',html:`<p>The loop contains a kick, bass, hi-hats, and a pad deliberately overloaded in the low-mids. The EQ acts <b>only on the pad</b>. The graph shows its live spectrum and, as a solid line, your EQ's curve.</p>
   <p>Try in this order: high-pass around 250 Hz, then a bell at −6 dB around 350–400 Hz, then a touch of air. Then hit <b>Solo pad</b>: alone, it sounds thin. In the mix, though, it's exactly what lets the kick and bass breathe. That's precisely why you don't EQ in solo.</p>`},
  {title:`going further · the kick / bass conflict, by ear`,demo:'kb',html:`<p>Here the kick and bass both hit around 50 Hz: the low end is blurry and the kick lacks shape. Two solutions, to be combined. Headphones only: these frequencies are inaudible on computer speakers.</p>`},
  {title:`going further · the method`,cls:'',html:`<ol class="steps">
    <li><b>Balance first.</b> <span>All faders at zero, bring up the kick, then the bass, then the rest in order of importance. No plugins at this stage.</span></li>
    <li><b>Cleanup: high-pass everywhere.</b> <span>On every track except kick and bass, raise the cutoff until the sound thins out in the mix, then back off a little.</span></li>
    <li><b>Hunting flaws by sweeping.</b> <span>Narrow bell (Q ≈ 8) at +10 dB, sweep slowly across the spectrum. When a zone turns outright unpleasant, flip the gain: −3 to −6 dB there. Lower the monitoring volume while sweeping.</span></li>
    <li><b>Conflicts two by two.</b> <span>Kick / bass, vocal / synths, pads / guitars: decide who owns the zone and dip the other by 2–3 dB.</span></li>
    <li><b>Boosts last, wide and light.</b> <span>If you go past +4 dB, the problem is probably elsewhere: the source sound, the arrangement, or another masking instrument.</span></li>
    <li><b>Check at matched volume.</b> <span>Bypass the EQ on/off: if you don't clearly prefer the processed version, take it off.</span></li></ol>`}
 ],
 viz:[{title:`kick / bass masking`,demo:'vmask',html:`<p>Two instruments in the same frequency zone: the red area is where they're fighting. Three ways to shrink it: dip the bass where the kick lives, dip the kick where the bass lives, or move the bass.</p>`}],
 err:`<p><b>Soloing a track to set it.</b> A gorgeous sound alone can be a cluttering one in the mix. EQ is set with the whole track playing: the question isn't "is it beautiful?" but "does it leave room for the others?".</p>`,
 todo:`<p>Put an <b>EQ Eight</b> as a high-pass on every track except kick and bass, and raise the cutoff until the sound thins out, then back off a little. Place <b>Utility</b> in mono below 120 Hz on the bass. Check with <b>Spectrum</b>.</p>`},

{lede:`A compressor is an automatic fader: it turns the volume down when the signal crosses a threshold. Result: less gap between the loud and quiet passages.`,
 concepts:[
  [`Threshold`,`The level above which the compressor acts. Below it, it does nothing.`],
  [`Ratio`,`The strength of the reduction. At 4:1, a signal that overshoots the threshold by 8 dB only overshoots by 2 dB at the output.`],
  [`Attack`,`The reaction time. <b>Slow (20–30 ms)</b>: the initial hit passes intact, the sound keeps its punch. <b>Fast (&lt; 5 ms)</b>: the hit is crushed, the sound recedes and softens.`],
  [`Release`,`The time to let go. Too short: audible "pumping". Locked to the tempo: it breathes with the track.`],
  [`Make-up gain`,`The compressor lowers the volume: you then bring the whole thing back up. That's where quiet sounds become more present.`]],
 example:`<p>Play the drum loop: the snare is deliberately way too loud and the ghost hi-hats too quiet. Turn on the compressor, lower the threshold until you see 4–6 dB of reduction, then compensate with make-up gain. The snare falls into line and the details come back up.</p>`,
 extra:{title:`sidechain: the French-house "pumping"`,demo:'sc',html:`<p>Here the compressor sits on the pad but <b>listens to the kick</b>: on every kick hit, the pad ducks then comes back. This clears room for the kick and creates filtered house's typical pulse.</p>`},
 extras:[
  {title:`going further · four compressor characters`,cls:'',html:{grid:[
   [`VCA`,`Precise, fast, transparent. The choice for buses and "glue". In Live: Glue Compressor, modeled on an 80s console bus compressor.`],
   [`FET`,`Very fast and colored, aggressive when pushed. Drums, rock vocals, anything that needs to move forward.`],
   [`Opto`,`Slow and gentle, reacts musically. Vocals and basses: it smooths things out without being heard working.`],
   [`Tube (vari-mu)`,`Very slow, warm. Used across the whole mix to glue things together with 1–2 dB of reduction.`]],note:`Live's stock Compressor is a neutral digital compressor: it can do all of this, with no coloration. It's the right tool to learn on.`}},
  {title:`going further · parallel compression`,demo:'par',html:`<p>Rather than choosing between dynamics and density, you keep both: the untouched signal, plus a copy <b>crushed without mercy</b> slid underneath it. Hits stay alive, but quiet details (ghosts, snare tail, ambience) come back up.</p>
   <p>Bring the fader up gradually: around 30–40%, the drums get bigger without losing their attack. At 100%, you hear the crushed copy taking over.</p>`},
  {title:`going further · starting-point settings`,html:`<table class="t"><thead><tr><th>Source</th><th>Ratio · attack · release</th><th>Reduction</th></tr></thead><tbody>
    <tr><td>Lead vocal</td><td style="color:var(--muted)">3:1 · 10 ms · 100 ms</td><td>3–6 dB</td></tr>
    <tr><td>Bass</td><td style="color:var(--muted)">4:1 · 20 ms · 150 ms</td><td>4–6 dB</td></tr>
    <tr><td>Snare</td><td style="color:var(--muted)">4:1 · 25 ms · 80 ms</td><td>3–5 dB</td></tr>
    <tr><td>Drum bus</td><td style="color:var(--muted)">2:1 to 4:1 · 30 ms · auto</td><td>2–3 dB</td></tr>
    <tr><td>Master bus</td><td style="color:var(--muted)">1.5:1 to 2:1 · 30 ms · auto</td><td>1–2 dB</td></tr>
    <tr><td>Pad sidechain</td><td style="color:var(--muted)">4:1 and up · 0 ms · 100–150 ms</td><td>6–12 dB</td></tr></tbody></table>
   <p class="note">These are common starting points, not rules: the ear decides, at matched volume.</p>`},
  {title:`going further · the method`,cls:'',html:{steps:[
   [`Name the goal.`,`Controlling level swings? Adding punch? Gluing a group? If you don't know why you're compressing, don't.`],
   [`Exaggerate first.`,`High ratio and very low threshold: 10 dB of reduction. The effect of attack and release becomes obvious.`],
   [`Set the attack.`,`Start from the fastest and slow it down until the hit regains its impact.`],
   [`Set the release.`,`Start from the slowest and speed it up until the compressor breathes with the tempo, without pumping.`],
   [`Come back to reason.`,`Raise the threshold and lower the ratio to the target reduction.`],
   [`Compensate and compare.`,`Make-up gain to match levels, then bypass on/off. No clear preference: take it off.`]]}}
 ],
 viz:[{title:`what the compressor does to the signal`,demo:'vcomp',html:`<p>Three hits of different strengths. In gray the input signal, in color the output, in red at the top the gain reduction over time. Compare a 0 ms and a 40 ms attack on the first hit, then lengthen the release and watch the second hit get crushed by the lingering reduction.</p>`},
  {title:`sidechain over time`,demo:'vduck',html:`<p>Four beats at 116 BPM. The pad's level dips on every kick and comes back up according to the release.</p>`}],
 err:`<p><b>Believing it's better because it's louder.</b> With make-up gain, the compressed sound comes out louder, so it seems better. Always compare at matched volume (bypass on/off): if at matched level you don't prefer the compressed version, take the compressor off.</p>`,
 todo:`<p>On a pad, place <b>Compressor</b>, open the <b>Sidechain</b> section, choose the kick track as the source. Ratio 4:1 or higher, minimum attack, release ≈ 100–150 ms, lower the threshold until you hear the breathing. On the drum bus, try <b>Glue Compressor</b> with 2–3 dB of reduction.</p>`},

{lede:`Placing sounds in a space and in depth. Dry = close, wet = far. It's the mix's third dimension, after volume and panning.`,
 concepts:[
  [`Reverb`,`Simulates a space. Decay = tail length. A short reverb (0.5 s) glues elements together; a long one (3 s+) creates atmosphere but quickly floods the mix.`],
  [`Pre-delay`,`The silence between the dry sound and the start of the reverb. 20–40 ms is enough to keep the voice up front while giving it space behind it.`],
  [`Delay`,`Repeats locked to the tempo. Fills the gaps between phrases without a reverb's haze.`],
  [`Send / return`,`You place <b>one</b> reverb on a return track and every instrument sends it a bit of signal. Everyone shares the same space: coherent, and light on the CPU.`]],
 example:`<p>Lead vocal: a plate-type reverb, 1.2–1.8 s, pre-delay ≈ 30 ms, with a 300 Hz high-pass on the return so the reverb doesn't add mud. For the delay, the exact times depend on the tempo:</p>`,
 extras:[
  {title:`going further · four types of reverb`,cls:'',html:{grid:[
   [`Room`,`Small room, 0.3–0.8 s. Gives body and realism to a sound without being heard as "a reverb". Drums, general glue.`],
   [`Plate`,`Metal plate, 1–2 s. Dense and bright, with no obvious early reflections. The classic for vocals and snare.`],
   [`Hall`,`Large room, 2–5 s. Majestic, but takes up a lot of space. Pads, breaks, sparse moments.`],
   [`Spring`,`Spring reverb: metallic, bouncy, vintage-flavored. Guitars, dub, effects.`]]}},
  {title:`going further · setting a reverb on a return`,demo:'rev',html:`<p>A real reverb on a return. The kick stays dry; the snare and synth send signal to it. Try in this order: decay from 0.5 s to 3 s (the room grows, the mix fills up), pre-delay from 0 to 60 ms (the source comes back up front), then the <b>high-pass on the return</b>: the bottom cleans up without the space disappearing.</p>`},
  {title:`going further · delay as an instrument`,demo:'dly',html:`<p>The phrase only plays on the first bar: it's the repeats that fill the second one. <b>Feedback</b> sets the number of repeats, and the filter in the loop darkens each echo so it recedes behind the source. Compare 1/8 (regular) and 3/16 (dotted eighth, a syncopated bounce).</p>`},
  {title:`going further · the method`,cls:'',html:{steps:[
   [`Think in three planes.`,`Front: dry or nearly so (kick, bass, lead vocal). Middle: a short room. Back: long reverb, delays. Decide each track's plane before touching a send.`],
   [`Two or three returns, no more.`,`A short room, a plate or a hall, a delay. The whole track shares these spaces.`],
   [`Filter the returns.`,`High-pass around 300 Hz and low-pass around 8 kHz on the reverb: it's heard, but clutters neither the low end nor presence.`],
   [`Dial it in context, then pull back a touch.`,`Raise the send until you hear the effect, then lower it 2–3 dB. It should be noticed when you cut it, not while it's there.`],
   [`In a dense passage, favor delay.`,`It gives space between the words without a long reverb's continuous haze.`],
   [`Automate it.`,`More reverb in the break, less in the drop. Space is part of the arrangement.`]]}}
 ],
 viz:[{title:`anatomy of a reverb`,demo:'vrev',html:`<p>What reaches the ear after a brief sound: the direct sound, a silence (pre-delay), a few distinct echoes bounced off nearby walls, then a dense tail fading out.</p>`},
  {title:`a delay's repeats on the grid`,demo:'vdly',html:`<p>Two bars. The dark line is the original sound, the colored bars its repeats. Compare 1/8 and 3/16: in the second case, the echoes fall <b>between</b> the beats.</p>`}],
 err:`<p><b>A different reverb inserted on every track.</b> Every sound ends up in a different room, the bottom of the spectrum piles up, and the mix turns blurry. Two returns (one reverb, one delay) cover 90% of what you need.</p>`,
 todo:`<p>Return A: <b>Hybrid Reverb</b> or Reverb, 100% wet, followed by an EQ Eight high-pass at 300 Hz. Return B: <b>Delay</b> or Echo synced to a dotted eighth. Then dial in each track with its Send A and Send B knobs. Keep kick and bass dry.</p>`},

{lede:`The final stage: bringing the stereo mix to its final level and making sure it sounds right everywhere, from headphones to a car.`,
 concepts:[
  [`LUFS`,`A measure of <b>perceived</b> loudness over the whole track, unlike a peak meter which only sees spikes. It's the unit platforms use.`],
  [`Limiter & true peak`,`The limiter prevents anything from exceeding a ceiling. A ceiling at −1 dBTP leaves margin for MP3/AAC conversion, which can recreate higher peaks.`],
  [`Normalization`,`Platforms bring tracks to a target loudness. A master crushed to be very loud simply gets turned down, keeping its destroyed dynamics.`],
  [`Reference tracks`,`Comparing, at matched volume, against a commercial track in the same style. The only reliable way to judge your own low/high balance, especially on headphones.`]],
 example:`<p>Move the slider to see what a platform does to your master. The targets below are commonly published reference values; they evolve and depend on the listener's own settings, so treat them as ballpark figures.</p>`,
 extras:[
  {title:`going further · the chain, in order`,cls:'',html:{steps:[
   [`Corrective EQ.`,`Wide, light corrections (1–2 dB): too much low-mid, harsh highs. If you need to correct 5 dB, go back to the mix. Live: EQ Eight.`],
   [`Glue compression.`,`Ratio 1.5:1 to 2:1, slow attack, 1–2 dB of reduction. Ties elements together without crushing. Live: Glue Compressor.`],
   [`Light saturation.`,`Adds harmonics: density and perceived loudness without raising the peaks. Dose it very lightly. Live: Saturator.`],
   [`Stereo control.`,`Mono below 120 Hz, mono-compatibility check. Live: Utility.`],
   [`Limiter, always last.`,`Ceiling at −1 dBTP, then raise the gain to your LUFS target. Aim for 2–4 dB of peak reduction. Live: Limiter.`],
   [`Dither, only for a 16-bit export.`,`Pointless at 24-bit. Once, at the very end.`]]}},
  {title:`going further · pushing a limiter, at matched loudness`,demo:'lim',html:`<p>Mastering's most instructive experiment. Raise the input gain: with <b>Loudness match off</b>, louder seems better. Switch it <b>on</b>: the app automatically brings the limited version back to the same perceived loudness as the original. What's left is what the limiter is actually doing to the sound: flattened hits.</p>`},
  {title:`going further · mono compatibility`,demo:'mono',html:`<p>Phone speakers, bar sound systems, some smart speakers: a chunk of your listeners are hearing this in mono. Stereo width obtained through phase inversion sounds huge on headphones… and <b>disappears</b> when left and right get summed. Headphones required for this one.</p>`},
  {title:`going further · before mastering`,cls:'',html:{concepts:[
   [`Leave headroom`,`Mix peaks around −6 dB, no limiter or maximizer on the master at export. Export as 24-bit WAV.`],
   [`Let your ears rest`,`At least one night between the mix and the master. You can't judge the tonal balance of a track you've heard 200 times in one day.`],
   [`Pick 2 or 3 references`,`Same style, same era, matched to your track's perceived loudness. Compare in slices: low end, then vocal, then air.`],
   [`Listen elsewhere`,`Headphones, speakers, phone, car. A flaw present everywhere is a flaw in the track; a flaw present in only one place comes from the monitoring.`]]}}
 ],
 viz:[{title:`the limiter, then normalization`,demo:'vlim',html:`<p>A mix seen as a waveform. Push the gain: the peaks crush against the ceiling. Then turn on normalization to see what a streaming platform does with it.</p>`}],
 err:`<p><b>Pushing the limiter to "sound pro".</b> Beyond a few dB of reduction, the kick's transients disappear and the track becomes fatiguing. And in poor listening conditions, you instinctively push harder: decide the level with a loudness meter, not by ear alone.</p>`,
