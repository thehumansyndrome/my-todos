<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studio001 — Production musicale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --text:#1F1E1D; --muted:#6B6A65; --border:#E3E1DA;
  --accent:#C2603F; --accent-soft:#F6E7E0; --green:#2E7D4F; --red:#B3403A; --amber:#9A6B12;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111113; --card:#19191C; --text:#ECECEC; --muted:#9A9A9F; --border:#2A2A2E;
    --accent:#E08A6A; --accent-soft:#2A1B15; --green:#5FBF86; --red:#E57373; --amber:#E0B050;
  }
}
:root[data-theme="dark"]{
  --bg:#111113; --card:#19191C; --text:#ECECEC; --muted:#9A9A9F; --border:#2A2A2E;
  --accent:#E08A6A; --accent-soft:#2A1B15; --green:#5FBF86; --red:#E57373; --amber:#E0B050;
}
:root[data-theme="sand"]{
  --bg:#F8F7FF; --card:#FFFFFF; --text:#23213A; --muted:#6A6885; --border:#E2E0F2;
  --accent:#6D28D9; --accent-soft:#EFE9FD; --green:#2E7D4F; --red:#B3403A; --amber:#9A6B12;
}
:root[data-theme="navy"]{
  --bg:#161925; --card:#1E2233; --text:#E6E8F2; --muted:#9299B5; --border:#2C3148;
  --accent:#8FA8FF; --accent-soft:#232A47; --green:#6FCF97; --red:#F08A8A; --amber:#E6C067;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;font-weight:400}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{background:var(--bg);color:var(--text);font-family:inherit;accent-color:var(--accent)}

:root{--hdr:52px}
.header{position:sticky;top:0;z-index:100;height:52px;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px}
.header h1{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header h1 span{color:var(--muted);font-weight:400}
.prog{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ibtn{width:44px;height:44px;border:none;background:transparent;font-size:17px;border-radius:8px}
.ibtn:hover{background:var(--accent-soft)}

.tabs{position:sticky;top:var(--hdr);z-index:99;height:57px;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;gap:4px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 14px;border:1px solid transparent;border-radius:8px;background:transparent;
  font-size:14px;color:var(--muted);white-space:nowrap}
.tab.active{color:var(--text);border-color:var(--border);background:var(--card);font-weight:500}
.tab .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.subtabs{position:sticky;top:calc(var(--hdr) + 57px);z-index:98;background:var(--bg);border-bottom:1px solid var(--border);display:flex;gap:2px;overflow-x:auto;padding:2px 12px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs[hidden]{display:none}
.subtabs .tab{font-size:13px;padding:0 12px;border-radius:0;border:none;border-bottom:2px solid transparent;background:transparent}
.subtabs .tab.active{border-bottom-color:var(--accent);color:var(--text);background:transparent;font-weight:500}
.sov{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);padding:6vh 12px 0;overflow-y:auto}
.sbox{max-width:680px;margin:0 auto 6vh;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px}
.sres{display:block;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--border);padding:11px 8px;min-height:44px;border-radius:6px}
.sres:hover,.sres.sel{background:var(--accent-soft)}
.sres .sl{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:2px}
.sres b{display:block;font-weight:600;font-size:15px;line-height:1.35}
.sres .ss{display:block;font-size:13px;color:var(--muted);line-height:1.45;margin-top:3px}
mark{background:transparent;color:var(--accent);font-weight:600}
.card{scroll-margin-top:calc(var(--hdr) + 118px)}
.card.flash{outline:2px solid var(--accent);outline-offset:3px;transition:outline-color .4s}
.grp{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted);margin:28px 0 10px}
@media (max-width:520px),(max-height:700px){:root{--hdr:0px}.header{position:static}.header .prog{display:none}}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle}

.page{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.section{display:none}.section.active{display:block}
h2{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.lede{font-size:18px;line-height:1.5;color:var(--muted);margin-bottom:24px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:12px;font-family:var(--mono)}
.card p{max-width:66ch}
.card p + p{margin-top:10px}
dl{display:grid;grid-template-columns:1fr;gap:14px}
dt{font-weight:600}
dd{color:var(--muted);max-width:64ch}
dd b, p b{color:var(--text);font-weight:600}
.card.ex{border-left:3px solid var(--accent)}
.card.err{border-left:3px solid var(--red)}
.card.todo{border-left:3px solid var(--green)}
code,.mono{font-family:var(--mono);font-size:.9em}
.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:13px;font-family:var(--mono);color:var(--muted);margin:2px 4px 2px 0}

.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="navy"] .btn.primary,:root[data-theme="dark"] .btn.primary{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme]) .btn.primary{color:#111}}
.btn.on{border-color:var(--accent);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.ctrl input[type=range]{width:100%;height:32px}
.ctrl output{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.note{font-size:14px;color:var(--muted);margin-top:12px;max-width:64ch}
.done{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px;font-size:15px;cursor:pointer}
.done input{width:20px;height:20px}
.badge{font-size:12px;color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.dbtn{min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:transparent;font-size:13px;font-weight:500;white-space:nowrap}
.dbtn.ok{border-color:var(--green);color:var(--green)}
textarea.note-in{width:100%;min-height:96px;resize:none;overflow:hidden;line-height:1.5;padding:12px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;color-scheme:light}
:root[data-theme="dark"] textarea.note-in,:root[data-theme="navy"] textarea.note-in{color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme]) textarea.note-in{color-scheme:dark}}
textarea.note-in:focus{outline:none;border-color:var(--accent)}
.card.notes{border-left:3px solid var(--amber)}
.eqcv{width:100%;height:190px;display:block;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.ftypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ftype{border:1px solid var(--border);border-radius:8px;padding:12px}
.ftype svg{width:100%;height:44px;display:block;margin-bottom:8px}
.ftype b{display:block;font-size:14px}
.ftype span{font-size:13px;color:var(--muted);line-height:1.4;display:block}
ol.steps{padding-left:22px;display:grid;gap:10px;max-width:64ch}
ol.steps li::marker{font-family:var(--mono);color:var(--accent);font-size:13px}
ol.steps li span{color:var(--muted)}
.seq{display:grid;grid-template-columns:74px repeat(16,1fr);gap:3px;min-width:560px;align-items:center;font-size:12px;color:var(--muted)}
.seq .c{height:34px;border:1px solid var(--border);border-radius:5px;background:var(--bg);padding:0}
.seq .c.b{border-color:var(--muted)}
.seq .c.s1{background:var(--accent-soft);border-color:var(--accent)}
.seq .c.s2{background:var(--accent);border-color:var(--accent)}
.seq .c.now{outline:2px solid var(--text);outline-offset:1px}
.seq .h{text-align:center;font-family:var(--mono);font-size:10px}
.idc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.idc div{border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.idc small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.idc b{font-weight:500;font-size:14px;line-height:1.35;display:block;margin-top:2px}
table.cmp{border-collapse:collapse;font-size:13px;min-width:980px;width:100%}
table.cmp th,table.cmp td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;line-height:1.4}
table.cmp thead th{font-weight:500;color:var(--muted);font-family:var(--mono);font-size:11px}
table.cmp tbody th{font-weight:600;white-space:nowrap}
table.cmp tbody th button{background:none;border:none;padding:0;font-weight:600;font-size:13px;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;min-height:28px}
.xl{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
details.prac{border-bottom:1px solid var(--border);padding:4px 0}
details.prac summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:10px 0;min-height:44px;flex-wrap:wrap}
details.prac summary::-webkit-details-marker{display:none}
details.prac summary b{font-weight:600;flex:1;min-width:200px}
details.prac .al{font-family:var(--mono);font-size:11px;color:var(--muted)}
details.prac .pk{font-family:var(--mono);font-size:12px;flex:none;min-width:22px}
details.prac .pk.ok{color:var(--green)}details.prac .pk.ko{color:var(--red)}
details.prac dl{padding:2px 0 8px 32px;gap:8px}
details.prac dt{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted)}
details.prac dd{color:var(--text);max-width:66ch}
details.prac>button{background:none;border:none;padding:0 0 10px 32px;min-height:28px;font-size:13px;color:var(--accent)}
details.prac[open] summary b{color:var(--accent)}
.gq{width:100%;height:48px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-family:var(--sans);font-size:16px}
.gq:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:transparent;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.gcount{font-family:var(--mono);font-size:12px;color:var(--muted);margin:8px 0 4px}
.gletter{font-family:var(--mono);font-size:13px;color:var(--accent);margin:22px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.gitem{padding:12px 0;border-bottom:1px solid var(--border)}
.gitem b{font-weight:600}.gitem .al{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px}
.gitem p{color:var(--muted);max-width:66ch;margin-top:2px}
.gitem button{background:none;border:none;padding:0;margin-top:4px;min-height:28px;font-size:13px;color:var(--accent)}
.meter.g div{background:var(--green)}
.mrow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:14px;margin-top:8px}
.mrow .meter{margin:0}.mrow span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.mrow button{background:none;border:none;text-align:left;padding:0;min-height:32px;font-size:14px;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.qhead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px}
.qq{font-weight:600;font-size:17px;line-height:1.4;margin-bottom:14px;max-width:60ch}
.qopts{display:grid;gap:8px}
.qopt{min-height:48px;padding:10px 14px;text-align:left;border:1px solid var(--border);border-radius:8px;background:transparent;font-size:15px;line-height:1.4}
.qopt:not(:disabled):hover{border-color:var(--accent)}
.qopt:disabled{cursor:default;opacity:.6}
.qopt.good{border-color:var(--green);color:var(--green);opacity:1;font-weight:500}
.qopt.bad{border-color:var(--red);color:var(--red);opacity:1}
.qfb{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.qfb b.ok{color:var(--green)}.qfb b.ko{color:var(--red)}
.qscore{font-family:var(--mono);font-size:28px;margin-bottom:6px}
.step .qs{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:200;display:none}
@media(max-width:520px){.badge .lbl{display:none}.header h1 span{display:none}}

/* overview flow */
.flow{display:grid;gap:8px}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-height:44px}
.step:hover{border-color:var(--accent)}
.step .n{font-family:var(--mono);color:var(--accent);font-size:14px;padding-top:2px}
.step b{display:block;font-weight:600}
.step span{color:var(--muted);font-size:14px}

/* chords */
.chords{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.chord{border:1px solid var(--border);border-radius:8px;padding:12px 4px;text-align:center;font-family:var(--mono)}
.chord small{display:block;color:var(--muted);font-size:11px}
.chord.pick{cursor:pointer}.chord.sel{border-color:var(--text);border-style:dashed}
.chord.lit{border-color:var(--accent);background:var(--accent-soft)}

/* arrangement grid */
.scroll{overflow-x:auto}
.arr{border-collapse:separate;border-spacing:3px;min-width:560px;width:100%;font-size:12px}
.arr th{font-weight:500;color:var(--muted);text-align:left;white-space:nowrap;padding-right:6px}
.arr thead th{text-align:center;padding:0}
.arr thead button{width:100%;min-height:44px;border:1px solid var(--border);border-radius:6px;background:transparent;font-size:12px;line-height:1.2}
.arr thead button.sel{border-color:var(--accent);color:var(--accent)}
.arr td{height:22px;border-radius:4px;background:var(--bg);border:1px solid var(--border)}
.arr td.v1{background:var(--accent);border-color:var(--accent)}
.arr td.v2{background:var(--accent-soft);border-color:var(--accent)}
.arr tr.energy td{background:transparent;border:none;height:60px;vertical-align:bottom;padding:0}
.arr tr.energy div{background:var(--text);opacity:.75;border-radius:3px 3px 0 0}

/* freq map */
.bands{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.band{min-height:64px;border:1px solid var(--border);border-radius:8px;background:transparent;font-size:12px;padding:4px 2px;line-height:1.25}
.band small{display:block;font-family:var(--mono);color:var(--muted);font-size:10px}
.band.sel{border-color:var(--accent);background:var(--accent-soft)}
@media(max-width:520px){.bands{grid-template-columns:repeat(4,1fr)}.ctrl{grid-template-columns:90px 1fr 62px}h2{font-size:24px}}

/* compressor */
.comp{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
@media(max-width:560px){.comp{grid-template-columns:1fr}.comp svg{max-width:220px;margin:0 auto;display:block}}
.meter{height:10px;border:1px solid var(--border);border-radius:5px;overflow:hidden;margin-top:6px;background:var(--bg)}
.meter div{height:100%;width:0;background:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left}
table.t th{font-weight:500;color:var(--muted)}
table.t td:last-child{font-family:var(--mono);text-align:right}
.big{font-family:var(--mono);font-size:22px;margin:10px 0 2px}
</style>
</head>
<body>
<div class="header">
  <h1>studio001 <span>· production musicale</span></h1>
  <div class="prog" id="prog"></div>
  <div class="badge" id="badge" title="État de la synchronisation">⚫ <span class="lbl">Local</span></div>
  <button class="dbtn" id="drive-btn">Drive</button>
  <button class="dbtn" id="lang-btn" aria-label="Langue / Language" style="padding:0 10px">EN</button>
  <button class="ibtn" id="search-btn" title="Rechercher ( / ou Ctrl+K )" aria-label="Rechercher dans toute l'application">⌕</button>
  <button class="ibtn" id="theme-btn" title="Changer de thème" aria-label="Changer de thème">☀︎</button>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<nav class="subtabs" id="subtabs" aria-label="Pages de la section" hidden></nav>
<div class="page" id="page"></div>
<div class="toast" id="toast"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
/* ============ state ============ */
const APP='studio001', SK='td_v4_'+APP, TK='td_theme_'+APP;
const CLIENT_ID='962903341875-aucgsp0h46olec36evehi500n2tgk32m.apps.googleusercontent.com'; // partagé — projet001
const SCOPES='https://www.googleapis.com/auth/drive.file', DRIVE_FILE=APP+'.json', TOKK='td_tok_'+APP, POLL_MS=30000;
let S={done:{},notes:{},quiz:{},qstat:{},updatedAt:0}, currentId='home';
function ensureState(){
  if(!S||typeof S!=='object'||Array.isArray(S))S={};
  if(!S.done||typeof S.done!=='object')S.done={};
  if(!S.notes||typeof S.notes!=='object')S.notes={};
  if(!S.quiz||typeof S.quiz!=='object')S.quiz={};
  if(!S.qstat||typeof S.qstat!=='object')S.qstat={};
  if(!S.checks||typeof S.checks!=='object')S.checks={};
  if(!S.plan||typeof S.plan!=='object')S.plan={};if(typeof S.plan.date!=='string')S.plan.date='';if(!S.plan.done||typeof S.plan.done!=='object')S.plan.done={};
  if(typeof S.updatedAt!=='number')S.updatedAt=0;
}
function load(){ try{const r=localStorage.getItem(SK); if(r)S=JSON.parse(r);}catch(e){} ensureState(); }
function save(){ try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){} }           // bulk ops : pull / import
function autoSave(){                                                                     // toute mutation utilisateur
  S.updatedAt=Date.now(); save();
  if(getTok()){ setBadge('pending'); clearTimeout(pushTimer); pushTimer=setTimeout(()=>{pushTimer=null;drivePush();},2000); }
  else setBadge('local');
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600);}

/* ============ themes ============ */
const THEMES=['auto','light','sand','navy','dark'];
const THEME_ICONS={auto:'◐',light:'☀︎',sand:'○',navy:'◑',dark:'☾'};
function getTheme(){ try{return localStorage.getItem(TK)||'auto';}catch(e){return 'auto';} }
function applyTheme(t){
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  document.getElementById('theme-btn').textContent=THEME_ICONS[t]||'◐';
  try{localStorage.setItem(TK,t);}catch(e){}
  if(typeof redrawViz==='function')requestAnimationFrame(redrawViz);
}
document.getElementById('theme-btn').onclick=()=>applyTheme(THEMES[(THEMES.indexOf(getTheme())+1)%THEMES.length]);

/* ============ content ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grid=list=>`<div class="ftypes">${list.map(([b,t])=>`<div class="ftype"><b>${b}</b><span>${t}</span></div>`).join('')}</div>`;
const stepList=list=>`<ol class="steps">${list.map(([b,t])=>`<li><b>${b}</b> <span>${t}</span></li>`).join('')}</ol>`;
const block=(cls,title,html)=>`<div class="card ${cls}"><h3>${title}</h3>${html}</div>`;
const concepts=list=>`<dl>${list.map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>`;

const TOPICS=[
{id:'compo',tab:'Composition',title:'Composition',
 lede:'Inventer la matière première : une mélodie, des accords, un rythme. Si cette étape est faible, rien en aval ne la sauvera.',
 concepts:[
  ['Tonalité','Le « réservoir » de 7 notes dans lequel on pioche. En sol mineur : Sol La Si♭ Do Ré Mi♭ Fa. Rester dedans garantit que tout sonne cohérent.'],
  ['Harmonie','Les accords qui portent l\'émotion. Une même mélodie devient triste, épique ou funky selon les accords placés dessous.'],
  ['Mélodie & hook','La phrase qu\'on retient. Un bon hook tient en 2 à 4 mesures, utilise peu de notes et se répète avec de petites variations.'],
  ['Rythme','Le placement dans le temps. Une note déplacée d\'une double-croche (syncope) suffit à transformer une ligne plate en groove.']],
 example:`<p>Un seul motif vocal répété sur un arpège en sol mineur à 110 BPM : toute la composition tient dans <b>un hook + une progression de 4 accords</b>. C'est le principe de la french house : l'intérêt ne vient pas de nouvelles idées, mais de la façon dont on révèle et transforme la même idée.</p>`,
 demo:'chords',
 extras:[
  {title:'aller plus loin · les 7 accords de la tonalité',html:`<p>Chaque note de la gamme porte un accord. En sol mineur, tu disposes donc de 7 accords « gratuits », qui sonnent tous juste ensemble. Ils se rangent en trois fonctions (classement simplifié, suffisant pour composer) : <b>repos</b> (on est à la maison), <b>mouvement</b> (on s'éloigne), <b>tension</b> (on veut revenir).</p>
   <p>Sélectionne une case, puis choisis un degré. Écoute comment l'ordre des fonctions change la sensation, et ce qui se passe quand la boucle finit sur une tension ou sur un repos.</p>`,demo:'prog'},
  {title:'aller plus loin · motif et variation',html:`<p>Un hook se mémorise parce qu'il revient, mais il lasse s'il revient à l'identique. Le métier est dans le dosage : <b>changer une seule chose à la fois</b>. La boucle joue le motif (mesures 1 et 3) puis la variante choisie (mesures 2 et 4).</p>`,demo:'mel'},
  {title:'aller plus loin · la méthode',cls:'',html:stepList([
   ['Fixe le cadre.','Tonalité, tempo, et une référence d\'ambiance. Les contraintes accélèrent.'],
   ['Quatre accords.','Pars du i, termine sur une tension. Une mesure par accord. Ne cherche pas l\'originalité ici.'],
   ['La basse sur les fondamentales.','Une note par accord, puis un rythme. C\'est la basse qui installe le groove, pas la mélodie.'],
   ['Un motif de 2 mesures, 4 notes maximum.','Sur les temps forts, vise des notes de l\'accord en cours : c\'est ce qui fait qu\'une mélodie « colle ».'],
   ['Question / réponse.','Mesures 1–2 : le motif finit en l\'air (pas sur la tonique). Mesures 3–4 : le même motif finit sur la tonique. L\'oreille entend une phrase complète.'],
   ['Une seule variation par répétition.','Dernière note, ou rythme, ou octave. Jamais tout à la fois.']])}
 ],
 viz:[{title:'la gamme et ses accords sur le clavier',demo:'vkbd',html:`<p>En clair, les notes de la gamme ; en couleur vive, celles de l'accord choisi. Change de tonique ou de mode : le dessin se déplace, mais la logique reste la même. Un accord se construit en prenant <b>une note sur deux</b> dans la gamme.</p>`}],
 err:`<p><b>Empiler les idées.</b> Trois mélodies différentes dans le même morceau = aucune n'est mémorisée. Un hook fort, répété et varié, bat toujours cinq idées moyennes.</p>`,
 todo:`<p>Dans Live 12, active <b>Scale</b> dans un clip MIDI (sol mineur), puis écris un motif de 2 mesures avec <b>4 notes maximum</b>. Duplique-le et ne change que la dernière note.</p>`},

{id:'groove',tab:'Groove & batterie',title:'Groove et batterie',
 lede:'Ce qui fait bouger la tête. Le groove ne vient pas du nombre d\'éléments, mais de trois choses : où tombent les frappes, avec quelle force, et avec quel léger retard.',
 concepts:[
  ['Les rôles','<b>Kick</b> : la pulsation, le sol. <b>Caisse claire ou clap</b> : le backbeat, sur les temps 2 et 4. <b>Charleys</b> : la subdivision, qui donne la vitesse ressentie. <b>Percussions</b> : la couleur et les réponses.'],
  ['La grille de 16 pas','Une mesure à 4 temps découpée en doubles-croches. Pas 1, 5, 9, 13 : les temps. Pas 3, 7, 11, 15 : les contretemps (« et »). Les autres : les doubles-croches faibles, là où vit la syncope.'],
  ['Vélocité','La force de chaque frappe. Un batteur n\'en joue jamais deux identiques : accents sur les temps, frappes faibles entre. C\'est la différence entre une pulsation et une mitraillette.'],
  ['Ghost notes','Frappes de caisse claire très douces, glissées entre les accents. On les remarque à peine, mais le beat s\'affaisse si on les retire.'],
  ['Swing','On retarde les doubles-croches paires. À 50 % : droit, mécanique. Vers 54–58 % : un balancement subtil, typique de la house. Au-delà de 62 % : franchement ternaire, hip-hop.']],
 example:`<p>Un séquenceur 16 pas. Charge un style, écoute, puis modifie-le : un clic pose une frappe forte, un deuxième clic la rend douce (ghost), un troisième l'efface. Essaie de retirer un seul kick dans le pattern house, ou d'ajouter deux ghosts de caisse claire : le caractère change immédiatement.</p>`,
 demo:'seq',
 extras:[
  {title:'aller plus loin · le même pattern, trois façons de le jouer',html:`<p>Pattern strictement identique : kick sur les temps, clap sur 2 et 4, charleys en doubles-croches. Seule l'exécution change. <b>Machine</b> : tout à la même force, parfaitement sur la grille. <b>Accents</b> : vélocités hiérarchisées. <b>Accents + humain</b> : en plus, quelques millisecondes d'imprécision et de légères variations de force.</p>`,demo:'feel'},
  {title:'aller plus loin · anatomie d\'un kick',html:`<p>Un kick électronique, c'est un sinus dont la hauteur chute très vite, plus un clic d'attaque. Quatre réglages suffisent à passer d'un kick house sec à une 808 qui fait office de basse. Remarque qu'un kick long occupe le grave en continu : il ne laisse plus de place à une ligne de basse.</p>`,demo:'kickd'},
  {title:'aller plus loin · signatures rythmiques par style',cls:'',html:grid([
   ['House · 120–128 BPM','Kick sur les 4 temps, clap sur 2 et 4, charley ouvert sur chaque contretemps. Swing léger sur les doubles-croches.'],
   ['Disco / nu-disco · 110–125','Même squelette que la house, charleys en doubles-croches très accentués, kicks syncopés ponctuels, basse en octaves qui dialogue avec le kick.'],
   ['Funk · 95–115','Kick syncopé qui évite certains temps, caisse claire sur 2 et 4 entourée de ghost notes. Tout le groove est dans les doubles-croches faibles.'],
   ['Boom bap · 85–95','Kick lourd et décalé, caisse claire sèche sur 2 et 4, swing prononcé (60 % et plus), charleys en croches.'],
   ['Techno · 125–140','Four-on-the-floor dur, peu de swing, charleys et percussions métalliques. Le groove vient des timbres et de l\'automation plus que du placement.'],
   ['Drum & bass · 170–175','« Two-step » : kick sur le 1 et juste avant le 3, caisse claire sur 2 et 4, ghosts et charleys rapides entre les deux.']])+`<p class="note">Tempos donnés comme ordres de grandeur usuels ; les frontières entre styles sont poreuses.</p>`},
  {title:'aller plus loin · la méthode',cls:'',html:stepList([
   ['Le squelette.','Kick et backbeat seuls. Si ça ne fait pas déjà hocher la tête à deux éléments, aucun charley ne le sauvera.'],
   ['La subdivision.','Charleys en croches ou en doubles-croches : c\'est ce choix qui fixe l\'énergie ressentie, à tempo égal.'],
   ['Les vélocités.','Hiérarchise : temps forts, contretemps moyens, doubles-croches faibles. Commence par là avant d\'ajouter quoi que ce soit.'],
   ['Le swing, partout pareil.','Même quantité de swing sur tous les éléments rythmiques, basse comprise. Deux swings différents produisent des flams, pas du groove.'],
   ['Les espaces.','Ghost notes et percussions dans les trous laissés par le kick et la caisse claire. Une percussion qui tombe en même temps qu\'un accent ne sert à rien.'],
   ['Verrouille kick et basse.','Soit la basse joue avec le kick (impact), soit elle répond dans les espaces (dialogue). Décide, et tiens-t\'y sur la section.'],
   ['Varie toutes les 4 ou 8 mesures.','Un kick retiré, un roulement, un charley ouvert en fin de cycle. Le cerveau a besoin d\'un repère pour sentir la structure.']])}
 ],
 viz:[{title:'le swing et les accents, vus sur la grille',demo:'vswing',html:`<p>Une mesure de 16 doubles-croches. Les traits pointillés marquent la grille exacte ; les points montrent où tombent réellement les frappes. Monte le swing et regarde les doubles-croches paires glisser vers la droite.</p>`}],
 err:`<p><b>Tout à la même vélocité, quantifié à 100 %.</b> Le réflexe face à un beat sans vie est d'ajouter des éléments : encore une percussion, encore une boucle. Le problème est presque toujours l'exécution, pas le contenu. Trois éléments bien accentués groovent plus que dix à plat.</p>`,
 todo:`<p>Dans un <b>Drum Rack</b>, programme kick, clap et charleys en doubles-croches. Étape 1 : dans le couloir de vélocité du clip, baisse une frappe de charley sur deux, puis encore les doubles-croches faibles. Étape 2 : ouvre le <b>Groove Pool</b>, glisse un groove « Swing 16 » sur le clip de batterie <b>et</b> sur celui de la basse, et règle le même Amount global. Compare à 0 %, 30 % et 60 %.</p>`},

{id:'bass',tab:'Basse & low-end',title:'Basse et low-end',
 lede:'La basse fait le lien entre la batterie et les accords. C\'est aussi la zone la plus difficile à juger : celle que ton casque flatte, que ton téléphone ignore et que le club amplifie.',
 concepts:[
  ['Un double rôle','<b>Harmonique</b> : elle joue la fondamentale de l\'accord, c\'est elle qui dit à l\'oreille quel accord on entend. <b>Rythmique</b> : son placement par rapport au kick fabrique le groove. Une basse se compose comme une partie de batterie qui aurait des notes.'],
  ['Sub et médium-grave','Deux étages. Le <b>sub</b> (30–80 Hz) se ressent : poids, pression. Le <b>médium-grave</b> (100–800 Hz) s\'entend : c\'est lui qui permet de suivre la ligne, surtout sur de petites enceintes.'],
  ['Fondamentale et harmoniques','Un sinus à 49 Hz n\'existe qu\'à 49 Hz. Un téléphone ne descend pas sous 150–200 Hz : pour lui, cette basse n\'existe pas. Avec des harmoniques (98, 147, 196 Hz…), l\'oreille <b>reconstitue</b> la note manquante.'],
  ['Mono','Sous 100–120 Hz, tout au centre. Du grave stéréo se traduit par des annulations en mono, un vinyle impossible à graver, et un club où la basse change selon l\'endroit où l\'on se tient.'],
  ['La longueur des notes','Où une note s\'arrête compte autant que là où elle commence. Des notes courtes laissent des trous : ça rebondit. Des notes tenues remplissent : ça pousse. Le silence fait partie de la ligne.']],
 example:`<p>Même progression (Gm – E♭ – B♭ – F), même kick : seule la ligne de basse change. Passe d'un style à l'autre, puis joue avec la <b>longueur des notes</b> : à 30 %, la ligne devient percussive ; à 100 %, elle devient un tapis. Remarque que le style « contretemps » évite naturellement le kick, sans aucun traitement.</p>`,
 demo:'bline',
 extras:[
  {title:'aller plus loin · construire une basse en deux couches',html:`<p>Une couche <b>sub</b> (sinus pur) et une couche <b>médium</b> (dent de scie filtrée, coupée sous 120 Hz pour ne pas doubler le sub). Le bouton <b>Petites enceintes</b> simule un téléphone en retirant tout ce qui est sous 180 Hz.</p>
   <p>L'expérience à faire : sub seul, puis Petites enceintes : la basse disparaît complètement. Active alors la <b>saturation</b> sur le sub : elle fabrique des harmoniques, et la ligne redevient audible alors qu'il n'y a toujours aucun grave. Ajoute enfin la couche médium.</p>`,demo:'layers'},
  {title:'aller plus loin · la tonalité décide du poids',html:`<p>Toutes les notes graves ne se valent pas. Trop bas, le sub n'est restitué que par de gros systèmes ; trop haut, il perd son poids. La zone utile se situe en gros entre <b>mi et la graves (41–55 Hz)</b>. Écoute chaque note, au casque, à volume modéré.</p>`,demo:'subnote'},
  {title:'aller plus loin · six basses à connaître',cls:'',html:grid([
   ['Sub / 808','Sinus ou kick très long accordé. Tout le poids, aucune définition : a besoin de saturation ou d\'une couche médium pour exister partout.'],
   ['Pluck house','Dent de scie ou carré, filtre fermé avec enveloppe courte. Percussive, placée sur les contretemps. La basse de la house filtrée.'],
   ['Basse en octaves','Alterne la fondamentale et son octave en croches. Signature disco et nu-disco : énergie maximale avec deux notes.'],
   ['Acid (303)','Scie ou carré dans un filtre très résonant, avec glissés et accents. Le caractère vient du cutoff automatisé, pas des notes.'],
   ['Reese','Deux dents de scie désaccordées qui battent entre elles. Sombre et mouvante, drum & bass et garage. Sub à gérer à part.'],
   ['Basse FM','Attaque métallique et nette qui perce le mix, corps rond. Électro-funk, synthwave. Dans Live : Operator.']])},
  {title:'aller plus loin · la méthode',cls:'',html:stepList([
   ['Choisis le registre.','Regarde où tombe la fondamentale de ta tonalité. Si elle passe sous 35–40 Hz, joue la ligne une octave plus haut.'],
   ['Écris le rythme d\'abord.','Sur une seule note, contre le kick. Avec lui (impact) ou entre ses frappes (dialogue) : décide avant de penser aux notes.'],
   ['Pose les fondamentales.','Une note par accord. C\'est suffisant dans 80 % des cas. Ajoute ensuite octaves et quintes, puis des notes d\'approche juste avant le changement d\'accord.'],
   ['Règle les longueurs.','Raccourcis jusqu\'à ce que ça rebondisse. Vérifie qu\'aucune note ne déborde sur le kick suivant.'],
   ['Construis en deux couches.','Sub propre et stable, couche médium pour le caractère. Passe-haut sur la couche médium vers 100–120 Hz.'],
   ['Tout en mono sous 120 Hz.','Aucun unison, chorus ou élargisseur sur le sub. La largeur, c\'est pour la couche médium.'],
   ['Contrôle sur trois écoutes.','Casque, spectre, et simulation de petites enceintes. La ligne doit rester lisible sur les trois.']])}
 ],
 viz:[{title:'pourquoi une basse disparaît sur un téléphone',demo:'vharm',html:`<p>Le contenu en fréquences d'une note de basse. Compare les trois sons avec les petites enceintes activées, puis monte la note : plus elle est aiguë, plus ses harmoniques passent la barrière.</p>`}],
 err:`<p><b>Une basse énorme au casque, absente partout ailleurs.</b> Un sub pur flatte un bon casque fermé et ne produit rien sur un téléphone, un ordinateur portable ou une enceinte connectée. Le réflexe est de monter le sub : ça ne change rien sur ces systèmes, et ça mange toute la marge du master. La solution est dans les harmoniques, pas dans le volume.</p>`,
 todo:`<p>Crée un <b>Instrument Rack</b> à deux chaînes. Chaîne 1 : <b>Operator</b>, un seul sinus, suivi d'un <b>Saturator</b> léger. Chaîne 2 : <b>Analog</b> ou <b>Wavetable</b> en dent de scie, filtre fermé, suivi d'un EQ Eight en passe-haut à 120 Hz. Après le rack : <b>Utility</b>, Bass Mono à 120 Hz. Test final : pose temporairement un EQ Eight passe-haut à 180 Hz sur le master. Si tu ne peux plus suivre la ligne, renforce la chaîne 2.</p>`},

{id:'arr',tab:'Arrangement',title:'Arrangement',
 lede:'Décider qui joue, quand, et pendant combien de temps. C\'est ce qui transforme une boucle de 8 mesures en un morceau de 5 minutes.',
 concepts:[
  ['Structure en blocs','La musique dansante avance par blocs de 8 ou 16 mesures : intro, build, drop, break, outro. L\'auditeur sent ces blocs, même sans les compter.'],
  ['Tension / relâchement','On retire de l\'énergie (break) pour que son retour (drop) fasse de l\'effet. Pas de creux, pas de sommet.'],
  ['Règle des 8 mesures','Toutes les 8 mesures, quelque chose change : un élément entre, sort, ou se transforme (filtre qui s\'ouvre, charley qui double).'],
  ['Contraste','Dense / vide, grave / aigu, sec / réverbéré. Le contraste entre sections compte plus que la richesse de chacune.']],
 example:`<p>Clique sur une section pour voir ce qui s'y passe dans un morceau french house type (≈ 116 BPM). Carré plein = l'élément joue ; carré clair = filtré ou partiel. Les barres du bas montrent l'énergie perçue.</p>`,
 demo:'arr',
 extras:[
  {title:'aller plus loin · les outils de transition',cls:'',html:grid([
   ['Filtre qui s\'ouvre','Passe-bas automatisé sur les accords ou tout le bus. La signature french house : on révèle le son au lieu d\'en ajouter.'],
   ['Riser','Bruit ou note qui monte en hauteur et en volume. Annonce à l\'auditeur que quelque chose arrive.'],
   ['Roulement de caisse claire','Noires, puis croches, puis doubles : la densité rythmique accélère et crée l\'urgence.'],
   ['Silence','Tout couper un temps (ou une mesure) juste avant le drop. Le contraste le plus puissant, et le moins cher.'],
   ['Impact / crash','Marque le premier temps de la nouvelle section. Sans lui, l\'entrée paraît molle.'],
   ['Reverse','Cymbale ou réverbe inversée qui « aspire » vers le temps fort. Discret, très efficace avant une voix.']])},
  {title:'aller plus loin · construire un build',html:`<p>Quatre mesures de build, puis quatre mesures de drop, en boucle. Active et désactive chaque technique pour entendre ce qu'elle apporte. Essaie surtout : tout désactivé (le drop arrive sans prévenir), puis <b>le silence seul</b>.</p>`,demo:'trans'},
  {title:'aller plus loin · densité et attention',cls:'',html:concepts([
   ['Trois ou quatre éléments focaux, pas plus','L\'oreille suit un rythme, une basse, un élément harmonique et une voix ou un lead. Au-delà, les éléments se battent. Si tu ajoutes quelque chose, demande-toi ce qui sort.'],
   ['L\'arrangement est le premier mixage','Deux synthés dans le même registre au même moment, c\'est un problème d\'EQ que tu crées. Répartis les parties par registre (grave, médium, aigu) et dans le temps.'],
   ['Garde une réserve','Si tout est donné au drop 1, le drop 2 ne peut que répéter. Retiens une couche : le lead, une octave de basse, un charley ouvert.'],
   ['Automation = vie','Un son statique pendant 16 mesures fatigue. Cutoff, send de réverbe, volume : un mouvement lent suffit à maintenir l\'intérêt.']])},
  {title:'aller plus loin · la méthode',cls:'',html:stepList([
   ['Construis d\'abord le moment le plus dense.','Ta boucle complète = le drop 2. Tout le reste en découle.'],
   ['Duplique sur toute la durée.','5 à 6 minutes pour un format club, 3 à 4 pour un format écoute.'],
   ['Pose des repères de sections.','Locators dans Live : Intro, Build, Drop 1, Break, Build 2, Drop 2, Outro, par blocs de 8 ou 16 mesures.'],
   ['Soustrais.','Dans chaque section, supprime des clips jusqu\'à obtenir la courbe d\'énergie voulue. Garde une réserve pour le drop 2.'],
   ['Soigne les 4 mesures avant chaque changement.','Filtre, riser, roulement, silence. Une ou deux techniques par transition, pas toutes.'],
   ['Écoute en entier, écran éteint.','Note à quels moments ton attention décroche : c\'est là qu\'il manque un changement.']])}
 ],
 viz:[{title:'la courbe d\'énergie d\'un morceau',demo:'vtension',html:`<p>L'arrangement, c'est dessiner cette courbe. Compare trois profils : celui d'un morceau de club, celui d'une chanson pop, et celui d'une boucle qu'on n'a jamais arrangée.</p>`}],
 err:`<p><b>La boucle qui ne devient jamais un morceau.</b> Tout joue tout le temps, donc rien ne peut « arriver ». Le drop n'a d'impact que si la basse et le kick ont été absents juste avant.</p>`,
 todo:`<p><b>Arrangement soustractif</b> : dans la vue Arrangement, duplique ta boucle complète sur 5 minutes, puis <b>supprime</b> des éléments pour sculpter intro, break et outro. Beaucoup plus rapide que de construire à partir du vide.</p>`},

{id:'sd',tab:'Sound design',title:'Sound design',
 lede:'Fabriquer le timbre de chaque instrument. Trois réglages expliquent 80 % d\'un son de synthé : l\'onde, le filtre, l\'enveloppe.',
 concepts:[
  ['Forme d\'onde','Sinus = une seule fréquence, son pur. Dent de scie = toutes les harmoniques, son riche et brillant. Carré = harmoniques impaires, son creux façon jeu vidéo.'],
  ['Filtre','Un passe-bas retire les aigus au-dessus de la fréquence de coupure (cutoff). La résonance accentue la zone autour du cutoff : c\'est le « wah » caractéristique.'],
  ['Enveloppe ADSR','Comment le volume évolue dans le temps. Attaque courte + release courte = basse percussive. Attaque longue = nappe qui monte doucement.'],
  ['Modulation (LFO)','Un réglage qui bouge tout seul, en rythme : cutoff qui ondule, volume qui tremble. C\'est ce qui rend un son vivant.']],
 example:`<p>Une basse french house : dent de scie, filtre passe-bas autour de <b>300–800 Hz</b>, enveloppe très courte. Ouvre le cutoff pendant le build et tu obtiens le fameux « filtre qui s'ouvre ». Essaie ci-dessous : même notes, sons radicalement différents.</p>`,
 demo:'synth',
 extras:[
  {title:'aller plus loin · quatre familles de synthèse',cls:'',html:grid([
   ['Soustractive','Onde riche + filtre qui retire. Basses, leads, nappes analogiques. Dans Live : Analog, Drift.'],
   ['FM','Un oscillateur module la fréquence d\'un autre. Sons métalliques, cloches, pianos électriques, basses percutantes. Dans Live : Operator.'],
   ['Wavetable','On balaye une table de formes d\'onde : le timbre évolue dans le temps. Sons modernes, mouvants. Dans Live : Wavetable.'],
   ['Échantillonnage','On part d\'un enregistrement que l\'on découpe, transpose, filtre. Toute la house filtrée vient de là. Dans Live : Simpler, Sampler.']])},
  {title:'aller plus loin · le mouvement : LFO sur le filtre',html:`<p>Un LFO est un oscillateur trop lent pour être entendu, qui sert à <b>bouger un réglage à ta place</b>. Ici il pilote le cutoff d'une basse tenue. Calé sur le tempo, il devient un élément rythmique à part entière.</p>
   <p>Essaie : vitesse 1/8 en sinus (pulsation douce), puis 1/16 en carré (effet haché), puis profondeur à 0 pour mesurer à quel point le son redevient inerte.</p>`,demo:'lfo'},
  {title:'aller plus loin · l\'épaisseur : unison et detune',html:`<p>Une seule voix sonne fine et centrée. Empile plusieurs copies légèrement désaccordées et réparties dans la stéréo : le son devient large et dense. C'est le principe de la « supersaw ».</p>`,demo:'uni'},
  {title:'aller plus loin · la méthode',cls:'',html:stepList([
   ['Décris la cible en trois mots.','Par exemple : « basse, ronde, courte ». Sans cible, on tourne des boutons au hasard.'],
   ['Choisis l\'onde.','Riche (scie, carré) si tu comptes filtrer ; sinus pour un sub ou une base FM.'],
   ['Règle le filtre.','Cutoff pour la brillance, résonance pour le caractère.'],
   ['Règle l\'enveloppe de volume.','Attaque et release décident si c\'est une percussion, une basse ou une nappe.'],
   ['Ajoute du mouvement.','Une enveloppe ou un LFO sur le cutoff. Un seul mouvement bien dosé vaut mieux que quatre.'],
   ['Épaissis en dernier.','Unison, puis effets (saturation, chorus). Jamais d\'unison sur le sub : le grave doit rester mono et stable.']])}
 ],
 viz:[{title:'forme d\'onde, harmoniques et filtre',demo:'vwave',html:`<p>Un son périodique est une somme de sinus : la fondamentale et ses harmoniques. La forme d'onde et le spectre sont deux vues de la même chose. En gris, les harmoniques d'origine ; en couleur, ce qu'il en reste après le filtre passe-bas.</p>`},
  {title:'l\'enveloppe ADSR',demo:'vadsr',html:`<p>Le trajet du volume pendant une note. Charge un preset, écoute, puis déplace un seul curseur : c'est l'enveloppe, plus que la forme d'onde, qui fait qu'on entend une percussion, une basse ou une nappe.</p>`}],
 err:`<p><b>Chercher le preset parfait pendant une heure.</b> Prends un preset à 70 % et ajuste cutoff + enveloppe : ce sont ces deux réglages qui l'adaptent à ton morceau.</p>`,
 todo:`<p>Ouvre <b>Wavetable</b> ou <b>Analog</b> avec le preset par défaut. Ne touche qu'à trois choses : l'onde, le cutoff du filtre, l'attaque/release de l'ampli. Fabrique une basse, puis une nappe, avec ces seuls réglages.</p>`},

{id:'voix',tab:'Voix & vocoder',title:'Voix et vocoder',
 lede:'La voix est l\'élément que l\'oreille suit en priorité. Deux sujets ici : ce qui la rend intelligible, et comment le vocoder greffe cette intelligibilité sur un synthé.',
 concepts:[
  ['Formants','Des pics de résonance fixes, créés par la forme de la bouche. Ce sont eux qui distinguent un « a » d\'un « i », quelle que soit la note chantée. L\'intelligibilité vit surtout entre 300 Hz et 3 kHz.'],
  ['Voisé / non voisé','Les voyelles ont une hauteur (cordes vocales). Les consonnes « s », « t », « ch », « f » sont du bruit, sans hauteur. Tout traitement vocal doit gérer ces deux matières différemment.'],
  ['Vocoder : modulateur et porteuse','La <b>voix</b> (modulateur) est découpée en bandes de fréquences ; on mesure le volume de chaque bande, et on applique ces volumes aux mêmes bandes d\'un <b>synthé</b> (porteuse). Le synthé « prononce » les mots.'],
  ['Qui décide de quoi','La porteuse décide des <b>notes</b> et du timbre. La voix ne fournit que l\'<b>articulation</b>. La mélodie que tu chantes dans le micro n\'a aucune importance : tu peux parler.']],
 example:`<p>Commence par entendre ce qu'est un formant. Même note, même source sonore : seuls trois filtres changent, et tu entends des voyelles différentes. Compare avec la source brute, sans formants : un simple bourdonnement. <b>C'est exactement cette information que le vocoder transfère.</b></p>`,
 demo:'vow',
 extras:[
  {title:'un vocoder, en vrai',html:`<p>Le modulateur est une voix de synthèse qui enchaîne des voyelles et quelques consonnes (ou ton micro, avec un casque). La porteuse est un accord tenu. Utilise <b>Écouter</b> pour isoler les trois signaux : la voix seule, le synthé seul, puis le résultat.</p>
   <p>À essayer : 4 bandes (robot rétro, peu intelligible) contre 32 bandes (précis). Porteuse carrée puis bruit (chuchotement). Enfin, active <b>Unvoiced</b> : un peu de bruit ajouté à la porteuse redonne leurs consonnes aux mots.</p>`,demo:'voc'},
  {title:'aller plus loin · quatre effets qu\'on confond',cls:'',html:grid([
   ['Vocoder','Remplace la source sonore de la voix par un synthé. Les notes viennent du clavier. Son robotique, polyphonique. Dans Live : Vocoder.'],
   ['Talk-box','Le son du synthé est envoyé dans la bouche par un tube ; la bouche le filtre réellement, un micro capte le résultat. Plus organique et « mouillé » qu\'un vocoder.'],
   ['Correction de hauteur','Type Auto-Tune : la voix reste la source, seule sa hauteur est recalée sur la gamme. Réglé vite, donne l\'effet en escalier. Dans Live 12 : Auto Shift.'],
   ['Harmoniseur','Crée des copies transposées de la voix pour fabriquer des chœurs. La voix reste reconnaissable.']])},
  {title:'aller plus loin · rendre un vocoder intelligible',cls:'',html:concepts([
   ['Une porteuse riche et tenue','Dent de scie ou carré, en accords larges qui couvrent le spectre. Un sinus n\'a rien à filtrer : le vocoder ne peut sculpter que des harmoniques qui existent.'],
   ['Une voix régulière','Compresse la voix avant le vocoder. Si son niveau chute, les bandes se ferment et le mot disparaît.'],
   ['Sur-articule','Exagère les consonnes et ouvre les voyelles, comme au théâtre. Le vocoder gomme les nuances : ce qui semble caricatural au micro sonne normal à la sortie.'],
   ['Rends les consonnes','Le réglage Unvoiced ajoute du bruit quand la voix est non voisée. Tu peux aussi mélanger 10–20 % de voix naturelle filtrée en passe-haut.'],
   ['Le nombre de bandes est un choix esthétique','8 à 16 : grain rétro, robotique. 32 à 40 : moderne et clair. Aucun n\'est « meilleur ».']])},
  {title:'aller plus loin · la chaîne d\'une voix lead',cls:'',html:stepList([
   ['Nettoyage.','Supprime les bruits entre les phrases, puis passe-haut vers 80–100 Hz : rien d\'utile en dessous sur une voix.'],
   ['EQ soustractif.','Cherche par balayage le « carton » (300–600 Hz) et le nasal (autour de 1 kHz). Coupes étroites et modérées.'],
   ['De-esser.','Atténue les sifflantes (5–9 kHz) uniquement quand elles dépassent. Indispensable avant d\'ajouter de la brillance.'],
   ['Compression.','3:1, 3–6 dB de réduction. Deux compresseurs légers en série sonnent plus naturel qu\'un seul qui travaille fort.'],
   ['EQ tonal.','Présence large vers 3–5 kHz, un shelf d\'air au-delà de 10 kHz. Boosts larges et légers.'],
   ['Espace, en sends.','Plate courte avec 30 ms de pre-delay, delay filtré. Jamais en insert.'],
   ['Automation de volume.','Le dernier geste, et le plus efficace : chaque mot doit rester lisible. Le compresseur ne remplace pas le fader.']])}
 ],
 viz:[{title:'les formants, et ce qu\'en voit un vocoder',demo:'vform',html:`<p>Change de voyelle : les trois pics se déplacent. Change la hauteur : les harmoniques bougent, <b>pas les pics</b>. Choisis ensuite un nombre de bandes pour voir avec quelle précision un vocoder capture cette courbe.</p>`}],
 err:`<p><b>Une porteuse trop pauvre.</b> Un seul oscillateur sinus, une note unique dans le grave, ou un son trop filtré : le résultat est sourd et incompréhensible, et on accuse à tort le vocoder ou la prise. Un vocoder ne révèle que ce que la porteuse contient déjà.</p>`,
 todo:`<p>Piste A : ta voix (ou une voix isolée avec la séparation de stems de Live), avec <b>Vocoder</b> en insert, Carrier sur <b>External</b>. Piste B : un synthé en dent de scie qui joue des accords tenus, choisi comme source externe ; coupe sa sortie directe. Règle Bands sur 20, puis monte <b>Unvoiced</b> jusqu'à retrouver les consonnes. Compare ensuite Bands 8 et 40.</p>`},

{id:'mix',tab:'Mixage & EQ',title:'Mixage & égalisation',
 lede:'Faire cohabiter toutes les pistes pour que chacune soit audible à sa place. Le mixage, c\'est d\'abord des volumes, ensuite du ménage dans les fréquences.',
 concepts:[
  ['Balance des volumes','Le réglage le plus puissant du mix. Avant tout plugin : faders seulement, en partant du kick et de la basse, puis en ajoutant le reste autour.'],
  ['Gain staging','Garder de la marge à chaque étage. Si le master tape vers −6 dB en crête avant mastering, tu es bien. Rouge = distorsion numérique, irréversible.'],
  ['EQ soustractive','Chaque instrument n\'a besoin que d\'une partie du spectre. On coupe ce qui est inutile (passe-haut sur tout sauf kick et basse) avant de booster quoi que ce soit.'],
  ['Panoramique','Grave au centre (kick, basse, voix lead), éléments aigus et décoratifs sur les côtés. La largeur libère de la place au centre.']],
 example:`<p><b>Conflit kick / basse</b>, le plus classique. Les deux veulent la zone 50–120 Hz. Solution : décider qui possède le sub. Par exemple le kick garde 50–60 Hz, on creuse légèrement la basse à cet endroit, et la basse vit à 80–120 Hz, où l'on creuse le kick. Explore la carte ci-dessous pour savoir quoi chercher dans chaque zone.</p>`,
 demo:'freq',
 extras:[
  {title:'aller plus loin · les 5 formes de filtre',cls:'',html:`<div class="ftypes">
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,38 C20,38 25,12 40,12 L80,12" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>Passe-haut</b><span>Retire tout ce qui est sous la coupure. L'outil de ménage n° 1 : sur tout sauf kick et basse.</span></div>
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,12 L40,12 C55,12 60,38 80,38" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>Passe-bas</b><span>Retire les aigus. Fait reculer un son dans le mix, adoucit une nappe ou une réverbe.</span></div>
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,20 L25,20 C35,20 35,6 40,6 C45,6 45,20 55,20 L80,20" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>Cloche (bell)</b><span>Monte ou creuse une zone précise. Trois réglages : fréquence, gain, et Q (la largeur).</span></div>
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,26 L30,26 C45,26 45,10 60,10 L80,10" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>Plateau (shelf)</b><span>Monte ou baisse tout ce qui est au-delà d'une fréquence. Pour l'air d'une voix ou le poids d'un kick.</span></div>
    <div class="ftype"><svg viewBox="0 0 80 40"><path d="M0,14 L35,14 L40,38 L45,14 L80,14" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><b>Notch</b><span>Coupe chirurgicale très étroite. Pour une résonance, un sifflement, une ronflette à 50 Hz.</span></div></div>
   <p class="note"><b>Règle du Q :</b> coupes étroites, boosts larges. Une coupe étroite retire un défaut sans toucher au reste ; un boost étroit sonne artificiel et résonant, alors qu'un boost large reste naturel.</p>`},
  {title:'aller plus loin · égaliser une nappe en contexte',html:`<p>La boucle contient kick, basse, charleys et une nappe volontairement trop chargée dans le bas-médium. L'EQ n'agit <b>que sur la nappe</b>. Le graphique montre son spectre en direct et, en trait plein, la courbe de ton EQ.</p>
   <p>Essaie dans l'ordre : passe-haut vers 250 Hz, puis une cloche à −6 dB autour de 350–400 Hz, puis un peu d'air. Appuie ensuite sur <b>Solo nappe</b> : seule, elle paraît amaigrie. Dans le mix, c'est pourtant elle qui laisse respirer kick et basse. C'est exactement pourquoi on n'égalise pas en solo.</p>`,demo:'eq'},
  {title:'aller plus loin · le conflit kick / basse à l\'oreille',html:`<p>Kick et basse tapent ici tous les deux autour de 50 Hz : le grave est flou et le kick manque de contour. Deux solutions, à combiner. Au casque uniquement : ces fréquences sont inaudibles sur des haut-parleurs d'ordinateur.</p>`,demo:'kb'},
  {title:'aller plus loin · la méthode',cls:'',html:`<ol class="steps">
    <li><b>Balance d'abord.</b> <span>Tous les faders à zéro, monte le kick, puis la basse, puis le reste par ordre d'importance. Aucun plugin à ce stade.</span></li>
    <li><b>Ménage : passe-haut partout.</b> <span>Sur chaque piste sauf kick et basse, monte la coupure jusqu'à entendre le son s'amincir dans le mix, puis redescends un peu.</span></li>
    <li><b>Chasse aux défauts par balayage.</b> <span>Cloche étroite (Q ≈ 8) à +10 dB, balaye lentement le spectre. Quand une zone devient franchement désagréable, inverse le gain : −3 à −6 dB à cet endroit. Baisse le volume d'écoute pendant le balayage.</span></li>
    <li><b>Conflits deux à deux.</b> <span>Kick / basse, voix / synthés, nappes / guitares : décide qui possède la zone et creuse l'autre de 2–3 dB.</span></li>
    <li><b>Boosts en dernier, larges et légers.</b> <span>Si tu dépasses +4 dB, le problème est probablement ailleurs : le son source, l'arrangement, ou un autre instrument qui masque.</span></li>
    <li><b>Vérifie à volume égal.</b> <span>Bypass on/off de l'EQ : si tu ne préfères pas nettement la version traitée, retire-le.</span></li></ol>`}
 ],
 viz:[{title:'le masquage kick / basse',demo:'vmask',html:`<p>Deux instruments dans la même zone de fréquences : la surface rouge est l'endroit où ils se battent. Trois façons de la réduire : creuser la basse là où vit le kick, creuser le kick là où vit la basse, ou déplacer la basse.</p>`}],
 err:`<p><b>Régler une piste en solo.</b> Un son magnifique seul peut être encombrant dans le mix. L'EQ se règle avec tout le morceau qui joue : la question n'est pas « est-ce beau ? » mais « est-ce que ça laisse la place aux autres ? ».</p>`,
 todo:`<p>Mets un <b>EQ Eight</b> en passe-haut sur toutes les pistes sauf kick et basse, et monte la coupure jusqu'à entendre le son s'amincir, puis redescends un peu. Place <b>Utility</b> en mono sous 120 Hz sur la basse. Vérifie avec <b>Spectrum</b>.</p>`},

{id:'comp',tab:'Compression',title:'Compression',
 lede:'Un compresseur est un fader automatique : il baisse le volume quand le signal dépasse un seuil. Résultat : moins d\'écart entre les passages forts et faibles.',
 concepts:[
  ['Threshold (seuil)','Le niveau à partir duquel le compresseur agit. En dessous, il ne fait rien.'],
  ['Ratio','La force de la réduction. À 4:1, un signal qui dépasse le seuil de 8 dB n\'en dépasse plus que de 2 dB en sortie.'],
  ['Attaque','Le temps de réaction. <b>Lente (20–30 ms)</b> : la frappe initiale passe intacte, le son garde son punch. <b>Rapide (&lt; 5 ms)</b> : la frappe est écrasée, le son recule et s\'adoucit.'],
  ['Release','Le temps pour relâcher. Trop court : ça « pompe » de façon audible. Calé sur le tempo : ça respire avec le morceau.'],
  ['Make-up gain','Le compresseur baisse le volume : on remonte ensuite l\'ensemble. C\'est là que les sons faibles deviennent plus présents.']],
 example:`<p>Lance la boucle de batterie : la caisse claire est volontairement beaucoup trop forte et les charleys fantômes trop faibles. Active le compresseur, baisse le seuil jusqu'à voir 4–6 dB de réduction, puis compense avec le make-up. La caisse claire rentre dans le rang et les détails remontent.</p>`,
 demo:'comp',
 extra:{title:'sidechain : le « pumping » french house',html:`<p>Ici le compresseur est posé sur la nappe mais <b>écoute le kick</b> : à chaque coup de kick, la nappe s'efface puis revient. Ça libère la place du kick et crée la pulsation typique de la house filtrée.</p>`,demo:'sc'},
 extras:[
  {title:'aller plus loin · quatre caractères de compresseur',cls:'',html:grid([
   ['VCA','Précis, rapide, transparent. Le choix pour les bus et le « glue ». Dans Live : Glue Compressor, modélisé sur un compresseur de bus de console des années 80.'],
   ['FET','Très rapide et coloré, agressif quand on le pousse. Batteries, voix rock, tout ce qui doit avancer.'],
   ['Optique','Lent et doux, réagit de façon musicale. Voix et basses : il lisse sans qu\'on l\'entende travailler.'],
   ['À lampes (vari-mu)','Très lent, chaleureux. Utilisé sur le mix entier pour lier l\'ensemble avec 1–2 dB de réduction.']])+`<p class="note">Le Compressor standard de Live est un compresseur numérique neutre : il fait tout, sans couleur. C'est le bon outil pour apprendre.</p>`},
  {title:'aller plus loin · compression parallèle',html:`<p>Plutôt que de choisir entre dynamique et densité, on garde les deux : le signal intact, plus une copie <b>écrasée sans ménagement</b> que l'on glisse dessous. Les frappes restent vivantes, mais les détails faibles (fantômes, queue de caisse claire, ambiance) remontent.</p>
   <p>Monte progressivement le curseur : vers 30–40 %, la batterie grossit sans perdre son attaque. À 100 %, tu entends la copie écrasée dominer.</p>`,demo:'par'},
  {title:'aller plus loin · réglages de départ',cls:'',html:`<table class="t"><thead><tr><th>Source</th><th>Ratio · attaque · release</th><th>Réduction</th></tr></thead><tbody>
    <tr><td>Voix lead</td><td style="color:var(--muted)">3:1 · 10 ms · 100 ms</td><td>3–6 dB</td></tr>
    <tr><td>Basse</td><td style="color:var(--muted)">4:1 · 20 ms · 150 ms</td><td>4–6 dB</td></tr>
    <tr><td>Caisse claire</td><td style="color:var(--muted)">4:1 · 25 ms · 80 ms</td><td>3–5 dB</td></tr>
    <tr><td>Bus batterie</td><td style="color:var(--muted)">2:1 à 4:1 · 30 ms · auto</td><td>2–3 dB</td></tr>
    <tr><td>Bus master</td><td style="color:var(--muted)">1,5:1 à 2:1 · 30 ms · auto</td><td>1–2 dB</td></tr>
    <tr><td>Sidechain nappe</td><td style="color:var(--muted)">4:1 et plus · 0 ms · 100–150 ms</td><td>6–12 dB</td></tr></tbody></table>
   <p class="note">Ce sont des points de départ usuels, pas des règles : l'oreille décide, à volume égal.</p>`},
  {title:'aller plus loin · la méthode',cls:'',html:stepList([
   ['Nomme l\'objectif.','Contrôler des écarts de niveau ? Donner du punch ? Coller un groupe ? Si tu ne sais pas pourquoi tu compresses, ne compresse pas.'],
   ['Exagère d\'abord.','Ratio élevé et seuil très bas : 10 dB de réduction. L\'effet de l\'attaque et du release devient évident.'],
   ['Règle l\'attaque.','Pars du plus rapide et ralentis jusqu\'à ce que la frappe retrouve son impact.'],
   ['Règle le release.','Pars du plus lent et accélère jusqu\'à ce que le compresseur respire avec le tempo, sans pomper.'],
   ['Reviens à la raison.','Remonte le seuil et baisse le ratio jusqu\'à la réduction visée.'],
   ['Compense et compare.','Make-up pour égaliser les niveaux, puis bypass on/off. Pas de préférence nette : retire-le.']])}
 ],
 viz:[{title:'ce que le compresseur fait au signal',demo:'vcomp',html:`<p>Trois frappes de forces différentes. En gris le signal d'entrée, en couleur la sortie, en rouge en haut la réduction de gain au fil du temps. Compare une attaque de 0 ms et de 40 ms sur la première frappe, puis allonge le release et regarde la deuxième frappe se faire écraser par la réduction qui traîne.</p>`},
  {title:'le sidechain dans le temps',demo:'vduck',html:`<p>Quatre temps à 116 BPM. Le niveau de la nappe plonge à chaque kick et remonte selon le release.</p>`}],
 err:`<p><b>Croire que c'est mieux parce que c'est plus fort.</b> Avec le make-up, le son compressé sort plus fort, donc paraît meilleur. Compare toujours à volume égal (bypass on/off) : si à niveau égal tu ne préfères pas la version compressée, retire le compresseur.</p>`,
 todo:`<p>Sur une nappe, place <b>Compressor</b>, ouvre la section <b>Sidechain</b>, choisis la piste du kick en source. Ratio 4:1 ou plus, attaque minimale, release ≈ 100–150 ms, baisse le seuil jusqu'à entendre la respiration. Sur le bus batterie, essaie <b>Glue Compressor</b> avec 2–3 dB de réduction.</p>`},

{id:'space',tab:'Espace',title:'Espace : réverbe et delay',
 lede:'Placer les sons dans un lieu et en profondeur. Sec = proche, réverbéré = loin. C\'est la troisième dimension du mix, après le volume et le panoramique.',
 concepts:[
  ['Réverbe','Simule un lieu. Decay = durée de la queue. Une réverbe courte (0,5 s) colle les éléments ensemble ; une longue (3 s +) crée une ambiance mais noie vite le mix.'],
  ['Pre-delay','Le silence entre le son sec et le début de la réverbe. 20–40 ms suffisent pour que la voix reste devant tout en ayant de l\'espace derrière.'],
  ['Delay','Des répétitions calées sur le tempo. Remplit les trous entre les phrases sans créer le brouillard d\'une réverbe.'],
  ['Send / retour','On place <b>une</b> réverbe sur une piste de retour et chaque instrument y envoie un peu de signal. Tout le monde partage le même lieu : cohérent et léger pour le CPU.']],
 example:`<p>Voix lead : réverbe type plate de 1,2–1,8 s, pre-delay ≈ 30 ms, avec un passe-haut à 300 Hz sur le retour pour que la réverbe n'ajoute pas de boue. Pour le delay, les temps exacts dépendent du tempo :</p>`,
 demo:'delay',
 extras:[
  {title:'aller plus loin · quatre types de réverbe',cls:'',html:grid([
   ['Room','Petite pièce, 0,3–0,8 s. Donne un corps et une réalité à un son sans qu\'on entende « de la réverbe ». Batteries, colle générale.'],
   ['Plate','Plaque métallique, 1–2 s. Dense et brillante, sans premières réflexions marquées. Le classique pour voix et caisse claire.'],
   ['Hall','Grande salle, 2–5 s. Majestueux, mais occupe beaucoup de place. Nappes, breaks, moments clairsemés.'],
   ['Spring','Ressort : son métallique et rebondissant, typé vintage. Guitares, dub, effets.']])},
  {title:'aller plus loin · régler une réverbe sur un retour',html:`<p>Une vraie réverbe sur un retour. Le kick reste sec ; caisse claire et synthé y envoient du signal. Essaie dans l'ordre : decay de 0,5 s à 3 s (la pièce grandit, le mix se remplit), pre-delay de 0 à 60 ms (la source revient devant), puis le <b>passe-haut sur le retour</b> : le bas se nettoie sans que l'espace disparaisse.</p>`,demo:'rev'},
  {title:'aller plus loin · le delay comme instrument',html:`<p>La phrase ne joue que sur la première mesure : ce sont les répétitions qui remplissent la seconde. Le <b>feedback</b> règle le nombre de répétitions, et le filtre dans la boucle assombrit chaque écho pour qu'il recule derrière la source. Compare 1/8 (régulier) et 3/16 (croche pointée, rebond syncopé).</p>`,demo:'dly'},
  {title:'aller plus loin · la méthode',cls:'',html:stepList([
   ['Pense en trois plans.','Devant : sec ou presque (kick, basse, voix lead). Milieu : room courte. Fond : réverbe longue, delays. Décide du plan de chaque piste avant de toucher un send.'],
   ['Deux ou trois retours, pas plus.','Une room courte, une plate ou un hall, un delay. Tout le morceau partage ces espaces.'],
   ['Filtre les retours.','Passe-haut vers 300 Hz et passe-bas vers 8 kHz sur la réverbe : elle s\'entend, mais n\'encombre ni le grave ni la présence.'],
   ['Dose en contexte, puis retire un peu.','Monte le send jusqu\'à entendre l\'effet, puis baisse de 2–3 dB. On doit le remarquer quand on le coupe, pas quand il est là.'],
   ['Dans un passage dense, préfère le delay.','Il donne de l\'espace entre les mots sans le brouillard continu d\'une réverbe longue.'],
   ['Automatise.','Plus de réverbe dans le break, moins dans le drop. L\'espace fait partie de l\'arrangement.']])}
 ],
 viz:[{title:'anatomie d\'une réverbe',demo:'vrev',html:`<p>Ce qui arrive à l'oreille après un son bref : le son direct, un silence (pre-delay), quelques échos distincts renvoyés par les murs proches, puis une queue dense qui s'éteint.</p>`},
  {title:'les répétitions d\'un delay sur la grille',demo:'vdly',html:`<p>Deux mesures. Le trait sombre est le son d'origine, les barres colorées ses répétitions. Compare 1/8 et 3/16 : dans le second cas, les échos tombent <b>entre</b> les temps.</p>`}],
 err:`<p><b>Une réverbe différente en insert sur chaque piste.</b> Chaque son se retrouve dans une pièce différente, le bas du spectre s'accumule et le mix devient flou. Deux retours (une réverbe, un delay) couvrent 90 % des besoins.</p>`,
 todo:`<p>Retour A : <b>Hybrid Reverb</b> ou Reverb, 100 % wet, suivi d'un EQ Eight passe-haut à 300 Hz. Retour B : <b>Delay</b> ou Echo synchronisé en 1/8 pointé. Dose ensuite chaque piste avec ses potards Send A et B. Laisse kick et basse secs.</p>`},

{id:'master',tab:'Mastering',title:'Mastering',
 lede:'La dernière étape : amener le mix stéréo au niveau final et s\'assurer qu\'il sonne correctement partout, du casque à la voiture.',
 concepts:[
  ['LUFS','La mesure du volume <b>perçu</b> sur la durée du morceau, contrairement au crête-mètre qui ne voit que les pics. C\'est l\'unité utilisée par les plateformes.'],
  ['Limiteur & true peak','Le limiteur empêche de dépasser un plafond. Un plafond à −1 dBTP laisse une marge pour la conversion en MP3/AAC, qui peut recréer des crêtes.'],
  ['Normalisation','Les plateformes ramènent les morceaux à un volume cible. Un master écrasé pour être très fort sera simplement baissé, en gardant sa dynamique détruite.'],
  ['Morceaux de référence','Comparer, à volume égal, avec un titre commercial du même style. C\'est le seul moyen fiable de juger son équilibre grave / aigu, surtout au casque.']],
 example:`<p>Déplace le curseur pour voir ce qu'une plateforme fait de ton master. Les cibles ci-dessous sont les valeurs de référence couramment publiées ; elles évoluent et dépendent des réglages de l'auditeur, donc à prendre comme ordre de grandeur.</p>`,
 demo:'lufs',
 extras:[
  {title:'aller plus loin · la chaîne, dans l\'ordre',cls:'',html:stepList([
   ['EQ correctif.','Corrections larges et légères (1–2 dB) : trop de bas-médium, aigus durs. Si tu dois corriger de 5 dB, retourne au mix. Live : EQ Eight.'],
   ['Compression de glue.','Ratio 1,5:1 à 2:1, attaque lente, 1–2 dB de réduction. Lie les éléments sans écraser. Live : Glue Compressor.'],
   ['Saturation légère.','Ajoute des harmoniques : densité et volume perçu sans monter les crêtes. À doser très bas. Live : Saturator.'],
   ['Contrôle stéréo.','Mono sous 120 Hz, vérification de la compatibilité mono. Live : Utility.'],
   ['Limiteur, toujours en dernier.','Plafond −1 dBTP, puis monte le gain jusqu\'à ta cible LUFS. Vise 2–4 dB de réduction sur les crêtes. Live : Limiter.'],
   ['Dither, seulement si export 16 bits.','Inutile en 24 bits. Une seule fois, à la toute fin.']])},
  {title:'aller plus loin · pousser un limiteur, à volume compensé',html:`<p>L'expérience la plus instructive du mastering. Monte le gain d'entrée : avec <b>Volume compensé off</b>, plus fort paraît mieux. Passe-le sur <b>on</b> : l'app ramène automatiquement la version limitée au même volume perçu que l'original. Ce qui reste, c'est ce que le limiteur fait vraiment au son : des frappes aplaties.</p>`,demo:'lim'},
  {title:'aller plus loin · compatibilité mono',html:`<p>Enceintes de téléphone, sonos de bar, certaines enceintes connectées : une partie de tes auditeurs écoute en mono. Un élargissement stéréo obtenu par inversion de phase sonne immense au casque… et <b>disparaît</b> quand gauche et droite sont additionnées. Au casque obligatoirement.</p>`,demo:'mono'},
  {title:'aller plus loin · avant de masteriser',cls:'',html:concepts([
   ['Laisse de la marge','Crêtes du mix vers −6 dB, aucun limiteur ni maximiseur sur le master à l\'export. Exporte en WAV 24 bits.'],
   ['Laisse reposer tes oreilles','Au moins une nuit entre le mix et le master. On ne juge pas l\'équilibre tonal d\'un morceau écouté 200 fois dans la journée.'],
   ['Choisis 2 ou 3 références','Même style, même époque, ramenées au même volume perçu que ton morceau. Compare par tranches : le grave, puis la voix, puis l\'air.'],
   ['Écoute ailleurs','Casque, enceintes, téléphone, voiture. Un défaut présent partout est un défaut du morceau ; un défaut présent à un seul endroit vient de l\'écoute.']])}
 ],
 viz:[{title:'le limiteur, puis la normalisation',demo:'vlim',html:`<p>Un mix vu comme une forme d'onde. Pousse le gain : les pics s'écrasent contre le plafond. Active ensuite la normalisation pour voir ce qu'une plateforme de streaming en fait.</p>`}],
 err:`<p><b>Pousser le limiteur pour « sonner pro ».</b> Au-delà de quelques dB de réduction, les transitoires du kick disparaissent et le morceau fatigue. Et dans de mauvaises conditions d'écoute, on pousse instinctivement plus fort : décide du niveau au loudness-mètre, pas à l'oreille seule.</p>`,
 todo:`<p>Sur le master : <b>Limiter</b> en dernier, plafond à −1 dB. Ajoute un mesureur LUFS (par exemple Youlean Loudness Meter, qui existe en version gratuite) et vise ta cible sur le passage le plus dense. Compare ensuite avec une référence importée sur une piste, ramenée au même niveau.</p>`}
];
