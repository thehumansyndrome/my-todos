['droits',`Read the license on your packs`,`"Royalty-free" doesn't mean "no conditions": reselling isolated sounds, for instance, is almost always banned.`,`Keep the license alongside the pack. If in doubt over a very recognizable melodic loop, transform it.`,'style:french'],

['ecoute',`Working with no reference`,`You think you already know the sound you're going for.`,`The mix sounds good for hours, then falls apart next to a commercial release.`,`A shifted low/high balance, usually too much low end or too much brightness.`,`Two or three references in the project, at matched volume, checked every twenty minutes.`,'master'],

['grave',`Too much sub, that you can't actually hear`,`A monitoring setup that doesn't reproduce the low end, or flatters it.`,`The master clips, or the limiter pumps for no obvious reason; in a club, the low end swallows everything.`,`Headroom spent on frequencies most listeners never hear.`,`A spectrum analyzer, a high-pass around 25–30 Hz on the bus, comparison against a reference.`,'bass'],

['grave',`A long kick and a long bass together`,`Each was chosen on its own, for its size.`,`A continuous mush in the low end, a kick with no shape.`,`Neither weight nor definition, a struggling limiter.`,`Shorten one of the two, or separate them in time (bass on the offbeats, or sidechain).`,'mix'],
['mix',`EQ'ing by habit, or with your eyes`,`Applying learned settings ("high-pass at 100 Hz on everything", "boost at 3 kHz on vocals") or sculpting a pretty-looking curve.`,`Thinned-out sounds, harsh vocals, decisions you can't justify by ear.`,`A mix with no body, real problems left untreated.`,`Every move answers a heard flaw. Close your eyes, move, listen, then look.`,'mix'],
['mix',`Stacking narrow boosts`,`Trying to make every instrument stand out by adding something to it.`,`Everything is boosted, so nothing stands out; artificial resonances show up.`,`An aggressive mix, inflated levels, less headroom.`,`Start by cutting in the others. Boosts wide, light, and last.`,'mix'],

['groove',`"Humanizing" through randomness`,`Confusing irregular with alive.`,`A drummer that seems clumsy: offsets with no logic to them.`,`A weakened groove instead of a reinforced one.`,`Constant, intentional offsets. Randomness, in tiny doses, last.`,'focus:swing'],

['droits',`Releasing with an uncleared sample`,`"It's too short", "it's unrecognizable", "no one will know".`,`A track that starts to take off, then a claim or a takedown.`,`Blocked or lost revenue, the track pulled.`,`Clearance, a replayed loop, or royalty-free material. General information, not legal advice.`,'style:french'],

EN.MBEST=[
['strat',`Know who you're talking to`,`"Everyone" isn't an audience. A specific style, scene and listening context let you pick the right channels and the right people.`,`One sentence: "for people who listen to X and Y, when they do Z." Three reference artists roughly your own size, not headliners: look at where they get played, shared, booked.`],
['strat',`A consistent, recognizable identity`,`People remember an artist, not one isolated track. Consistency across name, visuals, sound and tone is what gets you recognized on the third encounter.`,`The same name and profile picture everywhere, one color palette and typeface, an identical short bio on every profile. Check your artist name is unique across platforms before you commit to it.`],
['strat',`Own the link to your audience`,`A platform's followers belong to the platform: one algorithm change and your reach disappears. An email address belongs to you.`,`A mailing list from day one, fed by one smart link in every bio. One email per release is enough.`],
['strat',`Think in funnels, not virality`,`Discovery, listen, follow, direct link, support: each step loses people. The work is reducing that loss, not hoping for a lucky break.`,`One single call to action per piece of content: listen, follow, sign up. One smart link that routes everywhere.`],
['strat',`Consistency beats intensity`,`Platforms and people both reward continuous presence. Six well-prepared releases beat one album dropped with no follow-through.`,`A pace you can sustain for a year: for instance one track every six to eight weeks, with the same preparation ritual every time.`],
['strat',`Set one goal per release`,`Without a goal, you can't tell whether a release worked or what to change for the next one.`,`Just one, measurable: a hundred new followers, twenty sign-ups to the list, five DJs playing the track, a label replying.`],
['sortie',`Deliver early to the distributor`,`Spotify asks that music be delivered to them at least 7 days before release so editors have time to listen. Your distributor's own lead time adds on top.`,`Aim for three to four weeks ahead. A track uploaded two days before release gives up on almost every lever.`],
['sortie',`Pitch the track to Spotify's editors`,`According to Spotify, a track pitched at least 7 days before release gets added to your followers' Release Radar. It's the one guaranteed lever, and it's free.`,`In Spotify for Artists, Music then Upcoming. One track at a time, and it's no longer possible once the track is live. Fill in everything: genre, mood, instruments, context, and what you're doing to promote it.`],
['sortie',`Release on a Friday, unless there's a reason not to`,`Since 2015, Friday has been the global release day: new-music playlists and media are all set around it.`,`Pick your date with this tab's countdown, and check no heavyweight in your scene is releasing the same day.`],
['sortie',`Prepare every piece of content before the announcement`,`During release week, you'll have neither the time nor the perspective to create.`,`Before day −14: artwork, five to ten short videos, photos, bio, smart link, presentation text, mailing-list email.`],
['sortie',`Flawless metadata`,`A misspelled name, a missing credit or the wrong genre, and the track lands on the wrong profile or pays nothing to the right person.`,`Title, main and featured artists, writers and composers, producer, ID codes, genre, language, explicit-content flag. Proofread twice.`],
['sortie',`Keep the track alive after release`,`Most of an independent track's streams arrive in the following weeks, not on release day.`,`Plan for four weeks: video edits, behind-the-scenes, an instrumental or remix, thanking every playlist and outlet that shared it.`],
['plat',`Claim and maintain every one of your artist profiles`,`An empty profile signals an abandoned project. Artist tools also give you access to analytics and editorial pitching.`,`Spotify for Artists, Apple Music for Artists, an official YouTube artist channel, Deezer, SoundCloud, Bandcamp. Photo, bio, links, artist pick, kept current everywhere.`],
['plat',`Understand the three kinds of playlists`,`Editorial (curated by the platform), algorithmic (personalized per listener), and independent user/curator playlists. Each is earned differently.`,`Editorial: the official pitch. Algorithmic: they react to genuine engagement, saves, playlist adds, full listens; the exact formula isn't public. Independent: direct, personal outreach.`],
['plat',`Use short-form video as a trailer`,`Short-form video is today's leading place for music discovery. Fifteen well-chosen seconds do more than a music video.`,`Isolate the track's strongest moment. Turn it into several videos from different angles: how the sound was made, before/after, a performance, the story behind the track.`],
['plat',`Keep a direct-sales channel`,`Streaming pays by volume. A hundred people buying a track, a vinyl, or a sound pack earn you more than tens of thousands of streams.`,`A shop or direct-sales page, announced to your list. Even a small one reveals who your real supporters are.`],
['plat',`Send your music to DJs, if you make club music`,`In electronic music, a track exists first because it gets played. One DJ spinning it is worth a playlist.`,`A short list of DJs whose sets you actually know, a private WAV download link, a three-line message, and a request for feedback rather than promotion.`],
['contenu',`Document rather than promote`,`"New track out now" interests no one. The process does: how the sound was made, where the idea came from, what didn't work.`,`Film your sessions. A simple rule: four pieces of content that give something (knowledge, behind-the-scenes, music) for every one that asks for something.`],
['contenu',`Hook within the first two seconds`,`In short-form video as in streaming, the decision to stay is made instantly.`,`Start with the strongest moment, not an intro. On-screen text, since a lot of people watch with the sound off at first.`],
['contenu',`Reply to everyone`,`At a small scale, every person who comments or writes is a future active supporter. It's the advantage big artists no longer have.`,`Twenty minutes a day during release week, set aside just for replies.`],
['reseau',`Give before you ask`,`Networks are built on value given. Someone who only shows up to ask for a favor gets noticed for it very fast.`,`Share other people's work, give precise feedback when asked, recommend people. For months, with nothing expected in return.`],
['reseau',`Target your peers, not the headliners`,`Artists at your own level are reachable, share your problems, and will rise alongside you. They're your future collaborators, remixers and bookers.`,`Five to ten artists roughly your size in your scene: feedback exchanges, cross-remixes, shared playlists, shared shows.`],
['reseau',`Root yourself in a local scene`,`In-person meetings create bonds that ten messages never will, and first shows almost always come from the local scene.`,`Go to shows in your style, regularly. Introduce yourself to promoters and resident DJs without asking for anything the first time.`],
['reseau',`Send a demo like a professional`,`A label receives hundreds of demos. The ones that get listened to are short, personalized, and easy to play.`,`One to three finished tracks, in a private listening link (never an attachment), four lines: who you are, why this label, what you're sending. One follow-up, after two weeks. The template is in the Templates tab.`],
['reseau',`Collaborate to cross audiences`,`A collaboration exposes each artist to the other's audience, with an implicit recommendation. It's the cheapest growth there is.`,`A remix, a duet track, a swapped vocal or production. Splits agreed in writing before you start.`],
['reseau',`Be reliable`,`In a small scene, reputation travels ahead of you. Delivering on time and replying quickly is rarer, and so more noticed, than talent.`,`Keep to the deadlines you announce, flag a delay as soon as you see it coming, thank people by name.`],
['reseau',`Use pitch-to-curator services with discernment`,`Some services let you submit a track to curators, media and labels for a fee that pays for their listening time, with no guarantee of a result. Spotify urges strong skepticism toward services that charge to be "considered".`,`If you use one: target narrowly, pick curators whose taste genuinely fits, and judge the service by the quality of the feedback. Anything promising a placement or a stream count is to be avoided.`],
['droits',`Register your works and understand who pays you`,`Streaming generates several separate income streams: the recording (through your distributor), and publishing rights (through a collecting society, Sacem in France). Without registration, part of the money never reaches you.`,`Look into joining a performing-rights organization and, as the producer of your own recordings, into neighboring rights. Rules and thresholds to check with each body.`],
['droits',`Know Spotify's royalty threshold`,`Since April 2024, a track must reach at least 1,000 streams over the past twelve months, with an undisclosed minimum number of unique listeners, to generate recording royalties.`,`Practical takeaway: it's better to concentrate your efforts on a few releases than to scatter dozens of quiet ones.`],
['droits',`Diversify your income`,`For an independent artist, streaming is mostly a discovery tool. The income comes from elsewhere.`,`Direct sales, live and DJ performances, sound packs and presets, production and mixing for others, sync licensing (music for picture), teaching.`],
['mesure',`Track engagement metrics, not vanity ones`,`A stream count says nothing on its own. The ratio of listeners to saves, or listeners to followers, tells you whether the track resonates with the people discovering it.`,`For every release, note: saves relative to listeners, new followers, adds to personal playlists, listening sources, cities. Compare against your previous release, not other artists.`],
['mesure',`Write a wrap-up after every release`,`Without a wrap-up, you repeat the same actions with no idea which ones actually helped.`,`At day +14 and +28: what brought listeners in, what did nothing, what you'll change next time. Ten lines is enough.`],
['mesure',`Test paid ads with a small budget and a clear goal`,`Advertising amplifies what's already working; it doesn't rescue content that isn't landing.`,`Only on a video that has already performed well organically, a few dollars a day, driving to a smart link, with a measurable goal. Cut fast whatever doesn't convert.`]
];

['contenu',`Posting nothing but promotion`,`Only speaking up when you have something to sell.`,`A feed made of "new track out", "link in bio", "listen now", then weeks of silence.`,`Falling reach, followers drifting away, no relationship at all.`,`Document the work between releases. Four pieces of content that give, for every one that asks.`],

['sortie',`Neglecting metadata and credits`,`Rushing through the distributor's form.`,`Track lands on a namesake's profile, an uncredited feature, missing writers, the wrong genre.`,`Lost streams, misallocated royalties, slow and sometimes impossible fixes without pulling the track.`,`A standard release sheet, filled in once and proofread with your collaborators.`],
['droits',`Registering nothing, writing nothing down`,`"We'll sort it out once it takes off."`,`No written splits with collaborators, unregistered works, unverified samples or generated elements.`,`Money not collected, conflicts at the worst possible time, tracks pulled.`,`Splits in writing before release, works registered, a log of your sources.`],
['mesure',`Judging a release by its stream count`,`It's the most visible number, and the easiest to compare.`,`Discouragement after every release, or false satisfaction after a playlist add with no follow-through.`,`Decisions made on a metric that says nothing about audience attachment.`,`Saves, followers gained, list sign-ups, messages received. Compare yourself to your previous release.`],
['mesure',`Spending on ads with no goal or measurement`,`The idea that visibility can simply be bought.`,`A "boost" button pressed on a post, a budget spent, no idea what it produced.`,`Money lost, and often a poorly targeted audience that skews your recommendations.`,`A small budget, content already validated organically, a measurable smart link, a goal defined beforehand.`],

EN.TIMELINE=[['≈1970',`16- then 24-track tape recorders`,`Each instrument can be recorded on its own track and re-done: the birth of production as its own art form.`],
 ['≈1977',`First automated mixing consoles`,`Fader moves get remembered: the mix is no longer a one-off performance.`],
 ['1977',`"I Feel Love", fully sequenced`,`A dance track with no drummer or bassist: the blueprint for the next twenty years.`],
 ['≈1978',`First digital reverbs`,`Spaces that were physically impossible, adjustable and reproducible from one studio to another.`],
 ['≈1980',`Sample-based drum machines, with swing`,`Rhythm becomes programmable, quantized by default, and swing becomes a percentage.`],
 ['1982',`The compact disc`,`More dynamic range and bandwidth than vinyl; brightness becomes a selling point.`],
 ['1983',`The MIDI standard, and the first mass-market FM synth`,`Every machine can talk to every other. Digital timbres flood into pop music.`],
 ['≈1988',`Pad samplers with a built-in sequencer`,`The loop and the break become raw material; these machines' swing marks a whole generation.`],
 ['≈1991',`Affordable digital multitracks, first hard-disk workstations`,`The studio leaves the big complexes for apartments.`],
 ['≈1994',`Look-ahead digital limiters`,`Loudness levels previously unreachable: the loudness war begins.`],
 ['1997',`Automatic pitch correction`,`Invisible at first, then embraced as an effect by decade's end.`],
 ['≈2000',`Full production software on personal computers`,`Instruments, effects and mixing in the same window: "in the box" production.`],
 ['≈2003',`Online music stores and digital players`,`Listening moves to headphones, lossy files, track by track.`],
 ['≈2008',`Peak of the loudness war`,`Albums so compressed they spark public controversy; normalization would later end it.`],
 ['≈2012',`Sample and preset subscriptions, video tutorials`,`Everyone gets access to the same sounds and the same techniques: the difference shifts to taste and processing.`],

function trNode(root){
  if(!root)return;
  if(root.nodeType===3){const p=root.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;const s=root.nodeValue,k=s.trim();if(!k)return;const en=trKey(k);if(en!==null&&en!==k){if(p.nodeName==='H3'&&!p.dataset.fr)p.dataset.fr=p.textContent;root.nodeValue=s.replace(k,en);}return;}
  if(root.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.nodeName))return;
  const els=[root,...root.querySelectorAll('[placeholder],[title],[aria-label]')];els.forEach(el=>['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v){const en=trKey(v.trim());if(en!==null&&en!==v)el.setAttribute(a,en);}}));

  const notes=Object.keys(S.notes).map(id=>{const t=strip(S.notes[id]),tt='Mes notes · '+topicTitle(id);return {type:'note',label:'Mes notes',title:tt,text:t,nt:norm(tt),n:norm(tt+' '+t),w:2,act:()=>{go(id);focusCard('mes notes');}};});
  const nq=norm(query.trim()),words=nq.split(/\s+/).filter(Boolean);if(!words.length)return [];
  const out=[];SIDX.concat(notes).forEach(e=>{let sc=0;for(const wd of words){if(e.nt.includes(wd))sc+=10;else if(e.n.includes(wd))sc+=1;else return;}
    if(e.nt===nq)sc+=30;else if(e.nt.startsWith(nq))sc+=12;else if(e.nt.includes(nq))sc+=6;out.push({e,sc:sc+e.w});});
  return out.sort((a,b)=>b.sc-a.sc||a.e.title.length-b.e.title.length).slice(0,60).map(x=>x.e);
}
function snippet(e,words){const src=e.text||'';if(!src)return '';const n=norm(src);let pos=-1;for(const wd of words){const p=n.indexOf(wd);if(p>=0&&(pos<0||p<pos))pos=p;}
  const a=Math.max(0,(pos<0?0:pos)-50),b=Math.min(src.length,a+170);return (a>0?'… ':'')+hilite(src.slice(a,b),words)+(b<src.length?' …':'');}
function hilite(txt,words){const n=norm(txt),marks=[];words.forEach(wd=>{let i=0;while(wd&&(i=n.indexOf(wd,i))>=0){marks.push([i,i+wd.length]);i+=wd.length;}});
  if(n.length!==txt.length||!marks.length)return esc(txt);marks.sort((x,y)=>x[0]-y[0]);let out='',cur=0;marks.forEach(([x,y])=>{if(x<cur)return;out+=esc(txt.slice(cur,x))+'<mark>'+esc(txt.slice(x,y))+'</mark>';cur=y;});return out+esc(txt.slice(cur));}
const SO={el:null,sel:0,res:[]};
function openSearch(){
  if(!SO.el){const o=document.createElement('div');o.className='sov';o.innerHTML=`<div class="sbox" role="dialog" aria-label="Recherche dans toute l'application"><div class="row" style="gap:8px"><input class="gq" id="gsq" type="search" placeholder="Chercher dans toute l'application…" autocomplete="off" spellcheck="false" style="flex:1"><button class="btn" id="gsx" aria-label="Fermer">Fermer</button></div><div class="gcount" id="gsc"></div><div id="gsr"></div></div>`;
    document.body.appendChild(o);SO.el=o;o.addEventListener('click',e=>{if(e.target===o)closeSearch();});o.querySelector('#gsx').onclick=closeSearch;
    const inp=o.querySelector('#gsq');inp.oninput=()=>{SO.sel=0;drawSearch();};
    inp.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();SO.sel=Math.min(SO.res.length-1,SO.sel+1);markSel();}else if(e.key==='ArrowUp'){e.preventDefault();SO.sel=Math.max(0,SO.sel-1);markSel();}else if(e.key==='Enter'&&SO.res[SO.sel]){e.preventDefault();pick(SO.sel);}};}
  SO.el.style.display='block';const inp=SO.el.querySelector('#gsq');drawSearch();inp.focus();inp.select&&inp.select();
}
function closeSearch(){if(SO.el)SO.el.style.display='none';}
function pick(i){const e=SO.res[i];if(!e)return;closeSearch();stopLoop();e.act();}
function markSel(){const its=SO.el.querySelectorAll('.sres');its.forEach((x,i)=>x.classList.toggle('sel',i===SO.sel));const c=its[SO.sel];if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest'});}
function drawSearch(){
  const q=SO.el.querySelector('#gsq').value,box=SO.el.querySelector('#gsr'),cnt=SO.el.querySelector('#gsc'),words=norm(q.trim()).split(/\s+/).filter(Boolean);
  if(!words.length){SO.res=[];cnt.textContent='';box.innerHTML=`<p class="note" style="margin-top:8px">Cherche dans les thèmes, les styles, les époques, le swing, les pratiques, la diffusion, le glossaire et tes notes. Sans accents, en français ou en anglais.</p><div class="xl" style="margin-top:10px">${['sidechain','808','swing','LUFS','passe-haut','démo','Release Radar','sample','vocoder','ghost note'].map(x=>`<button class="chip" data-q="${x}">${x}</button>`).join('')}</div>`;
    box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=SO.el.querySelector('#gsq');i.value=b.dataset.q;SO.sel=0;drawSearch();i.focus();});return;}
  SO.res=searchAll(q);cnt.textContent=SO.res.length?(SO.res.length>=60?'60 premiers résultats':SO.res.length+' résultat'+(SO.res.length>1?'s':'')):'';
  box.innerHTML=SO.res.length?SO.res.map((e,i)=>`<button class="sres${i===SO.sel?' sel':''}" data-i="${i}"><span class="sl">${esc(e.label)}</span><b>${hilite(e.title,words)}</b>${e.text?`<span class="ss">${snippet(e,words)}</span>`:''}</button>`).join('')
    :`<p class="note" style="margin-top:8px">Aucun résultat. Essaie un mot plus court, un synonyme, ou le terme anglais.</p>`;
  box.querySelectorAll('.sres').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
}
document.getElementById('search-btn').onclick=openSearch;
document.addEventListener('keydown',e=>{const tg=e.target,typing=tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable);
  if((e.key==='k'||e.key==='K')&&(e.ctrlKey||e.metaKey)){e.preventDefault();openSearch();}
  else if(e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();openSearch();}
  else if(e.key==='Escape'&&SO.el&&SO.el.style.display==='block'){closeSearch();}});

  a.href=URL.createObjectURL(blob);a.download=APP+'_'+new Date().toISOString().slice(0,10)+'.json';a.click();

/* ============ Google Drive sync ============ */
let tokenClient=null,gisReady=false,pushTimer=null,pushing=false,fileId=null,lastModified=null;
function getTok(){try{return sessionStorage.getItem(TOKK);}catch(e){return null;}}
function setTok(t){try{t?sessionStorage.setItem(TOKK,t):sessionStorage.removeItem(TOKK);}catch(e){}}
function setBadge(st){
  const M={local:['⚫','Local'],pending:['🟡','Pending'],ok:['🟢','Sync ✓'],err:['🔴','Erreur']}[st];
  document.getElementById('badge').innerHTML=M[0]+' <span class="lbl">'+M[1]+'</span>';
}
function setDriveBtn(){const b=document.getElementById('drive-btn'),ok=!!getTok();b.textContent=ok?'Drive ✓':'Drive';b.classList.toggle('ok',ok);}
function initGIS(){
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){gisFail();return;}
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async resp=>{
    if(resp.error){setBadge('err');toast('Connexion Drive refusée');return;}
    setTok(resp.access_token);setDriveBtn();await drivePull();}});
  gisReady=true; setDriveBtn();
  if(getTok())drivePull();                                       // jeton encore en session : resync silencieuse, sans popup
}
function gisFail(){const b=document.getElementById('drive-btn');b.textContent='Drive indispo';b.disabled=true;b.style.opacity=.5;
  b.title='Google Identity Services bloqué dans cet environnement : ouvre le fichier depuis GitHub Pages.';}
document.getElementById('drive-btn').onclick=()=>{                // ② popup OAuth uniquement sur geste utilisateur
  if(!gisReady){toast('Drive pas encore prêt…');return;}
  if(getTok()){drivePull();toast('Synchronisation…');return;}
  tokenClient.requestAccessToken();
};
async function dfetch(url,opt={}){
  const tok=getTok(); if(!tok)throw new Error('notoken');
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401){setTok(null);setDriveBtn();setBadge('local');toast('Session Drive expirée : reconnecte-toi');throw new Error('401');}
  if(!r.ok)throw new Error('http '+r.status);
  return r;
}
async function findFile(){
  if(fileId)return fileId;
  const q=encodeURIComponent("name='"+DRIVE_FILE+"' and trashed=false");
  const j=await (await dfetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=1')).json();
  if(j.files&&j.files.length){fileId=j.files[0].id;lastModified=j.files[0].modifiedTime;}
  return fileId;
}
async function drivePush(retry){
  if(!getTok()){setBadge('local');return;}
  pushing=true;
  try{
    const fid=await findFile(),body=JSON.stringify(S);let r;
    if(!fid){
      const bd='studio001boundary',meta=JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'});
      const mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
      r=await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});
    }else{
      r=await dfetch('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media&fields=id,modifiedTime',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
    }
    const j=await r.json();fileId=j.id;lastModified=j.modifiedTime;setBadge('ok');
  }catch(e){
    if(e.message==='http 404'&&!retry){fileId=null;pushing=false;return drivePush(true);}   // fichier supprimé côté Drive : on le recrée
    if(e.message!=='401')setBadge('err');
  }finally{pushing=false;}
}
async function drivePull(){
  if(!getTok())return; setBadge('pending');
  try{
    const fid=await findFile();
    if(!fid){await drivePush();return;}
    const remote=await (await dfetch('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media')).json();
    const rt=(remote&&typeof remote.updatedAt==='number')?remote.updatedAt:0;
    if(rt>S.updatedAt){S=remote;ensureState();save();rerender();}       // ① ensureState après toute reconstruction de S
    else if(S.updatedAt>rt){await drivePush();return;}
    setBadge('ok');
  }catch(e){ if(e.message==='http 404')fileId=null; if(e.message!=='401')setBadge('err'); }
}
setInterval(async()=>{                                            // polling : détecte une modif faite sur un autre appareil
  if(!getTok()||document.hidden||pushTimer||pushing||!fileId)return;
  try{const j=await (await dfetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?fields=modifiedTime')).json();
    if(lastModified&&j.modifiedTime!==lastModified){lastModified=j.modifiedTime;await drivePull();}
  }catch(e){}
},POLL_MS);

load(); applyTheme(getTheme()); go('home'); setBadge('local');
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopLoop();});
