 todo:`<p>On the master: <b>Limiter</b> last, ceiling at −1 dB. Add a LUFS meter (Youlean Loudness Meter, for instance, which has a free version) and aim for your target on the densest passage. Then compare against a reference imported onto a track, matched to the same level.</p>`}
];

EN.STYLES=[
{lede:`Orchestral music played by humans to make people dance: a relentless rhythm section, rich harmony, strings and horns. Everything else on this list descends from it.`,
 idc:[[`Tempo`,`110–130 BPM, often 118–125`],[`Feeling`,`Straight, but played: human micro-variations, no programmed swing`],[`Harmony`,`Extended chords: m7, maj7, 9th, dominant 7th`],[`Form`,`Song form (verse/chorus) with long instrumental passages`]],
 tips:[
  [`Drums`,`Kick on the 4 beats, snare or clap on 2 and 4, <b>open hi-hat on every offbeat</b>, closed hi-hats in 16th notes. Add tambourine and congas: hand percussion is half the style.`],
  [`Bass`,`An electric bass, melodic and syncopated. The signature move: <b>fundamental / octave in eighth notes</b>. It dialogues with the kick rather than doubling it, and wanders through approach notes between chords.`],
  [`Harmony and instruments`,`Rhythm guitar in muted 16th notes, played very dry. Electric piano or clavinet for the chords. <b>Strings</b> in long lines and punctuations, horns as answers. A two-chord vamp (i7 – IV9, dorian color) is often enough.`],
  [`Sonic signature`,`Warmth and dynamics. Plate reverb on the snare and strings, very little on the rhythm section. Nothing is crushed: the drums breathe.`],
  [`Arrangement`,`In orchestral layers: the rhythm section runs uninterrupted, strings and horns come and go in 4- or 8-bar phrases. The "drums + bass alone" break is a classic.`],
  [`Mix and master`,`Generous mids, round but contained low end: little energy below 40 Hz. Light glue compression. Don't chase today's electronic loudness levels: disco lives on its dynamics.`]],
 traps:`<b>Quantizing everything to 100%</b> kills the style: keep lively velocities and slight offsets. <b>Too much sub</b>: disco's low end lives in the electric bass (60–120 Hz), not a synthetic sub. <b>Strings as a continuous pad</b>: they need to phrase, come in and out.`,
 live:`A Drum Rack with a dry acoustic kit, percussion as audio loops. Groove Pool with a groove extracted from a real drum loop rather than a mathematical swing. Light Glue Compressor on the drum bus.`,
 keys:`disco, 120 BPM, four-on-the-floor, octave bass, rhythm guitar, string section, brass stabs, Rhodes, congas, tambourine`,
 refs:`Chic, Earth Wind & Fire, Giorgio Moroder, Donna Summer, Cerrone, Bee Gees`,
 cmp:[`110–130`,`Human, unprogrammed`,`On the 4 beats`,`2 and 4`,`Electric, octaves`,`Strings, funk guitar, dynamics`,`A living rhythm section`]},

{lede:`Disco's vocabulary (octaves, funk guitars, strings) rebuilt with electronic music's tools: synths, sidechain, an arrangement built for the DJ.`,
 idc:[[`Tempo`,`110–122 BPM, slower than house`],[`Feeling`,`Light swing, 52–56%`],[`Harmony`,`4-chord maj7/m7 progressions, bittersweet color`],[`Form`,`Club format: 16–32 bar intro and outro, 5 to 7 minutes`]],
 tips:[
  [`Drums`,`A programmed disco skeleton (kick on 4 beats, clap on 2 and 4, open hi-hat on the offbeats), <b>doubled by real percussion loops</b>: tambourine, shaker, congas. It's this machine/human blend that makes the style.`],
  [`Bass`,`A round, percussive synth bass, analog-flavored: octaves, syncopations, small slides. Simpler and more repetitive than a played disco bass. Short-envelope filter, a bit of resonance.`],
  [`Harmony and instruments`,`Pads and chords in <b>maj7 and m7</b>, synth arpeggios, brass stabs, funk guitar licks. A vocoder or talk box for the hook works particularly well.`],
  [`Sonic signature`,`Manufactured "analog" warmth: light saturation, chorus on the pads, a hint of pitch wobble. <b>Sidechain</b> is present but dosed: it bounces, it doesn't pump.`],
  [`Arrangement`,`A slow, hypnotic build. Elements are revealed one by one, with filters opening over 16 bars. Save the lead or the vocal hook for the second third of the track.`],
  [`Mix and master`,`Clean, well-separated kick and bass, mono sub. Silky rather than bright highs: soften the hi-hats. A mid-loudness master, more dynamic than a mainstream house track.`]],
 traps:`<b>Too fast</b>: past 122 BPM, it turns into house and the groove loses its laid-back feel. <b>Sidechain too deep</b>: that's the French Touch signature, not nu-disco. <b>Cliché sonic imagery</b>: three stacked disco clichés sound like a pastiche; one or two typed elements are enough.`,
 live:`Analog or Drift for the bass, Wavetable for the pads with Chorus-Ensemble. Compressor in sidechain on the pad bus, 3 to 6 dB of reduction. Light Saturator on the instrument bus. Automated Auto Filter on the chords.`,
 keys:`nu-disco, 116 BPM, four-on-the-floor, syncopated synth bass, funk guitar, sidechained pads, maj7 chords, analog warmth, talkbox hook`,
 refs:`Todd Terje, Lindstrøm, Breakbot, Purple Disco Machine, Aeroplane, Poolside`,
 cmp:[`110–122`,`Light, 52–56%`,`On the 4 beats`,`2 and 4`,`Round synth, syncopated`,`Dosed sidechain, warmth, maj7`,`Kick / bass bounce`]},

{lede:`Filtered house: a one- or two-bar disco or funk loop, a filter you open and close, and a kick that pumps the whole mix. The art of doing a lot with almost nothing.`,
 idc:[[`Tempo`,`120–128 BPM`],[`Feeling`,`Straight or very light swing; the motion comes from the pumping`],[`Harmony`,`Whatever the loop has: usually 2 chords, m7 or maj7`],[`Form`,`Long filter-driven progressions, club format`]],
 tips:[
  [`The loop`,`The track's heart. <b>One to two bars</b>, harmonically rich (strings, guitar, Rhodes), sliced so as to create a syncopation on the repeat. Sampled, replayed or built from scratch: what matters is its hypnotic repetition.`],
  [`The filter`,`<b>The main instrument.</b> Low-pass with a bit of resonance, continuously automated: closed in the intro, opening over 16 or 32 bars. Alternating low-pass and high-pass, adding a slow phaser: these are the track's only "solos".`],
  [`Drums`,`Heavy kick on the 4 beats, clap on 2 and 4, open hi-hat on the offbeats. Few elements, very up front. The kick has to be long enough to trigger a generous pump.`],
  [`Bass`,`Often already contained in the loop. Otherwise: a simple synth bass following the fundamentals, placed on the offbeats to leave the kick alone on the beat.`],
  [`Sonic signature`,`<b>Deep sidechain</b> on everything but the drums: 8 to 12 dB of reduction, release timed so the sound returns just before the next kick. Heavily pushed bus compression, used as an effect. Vocoded vocals.`],
  [`Arrangement`,`By subtraction and by filter, never by adding ideas. Cut the kick for 4 or 8 bars while the filter closes, then reopen everything: that's the drop.`],
  [`Mix and master`,`Dense, loud, unapologetic. The kick is the boss and everything else steps aside for it. Careful: the pumping eats into headroom, dial it in before touching the limiter.`]],
 traps:`<b>Sampling without clearance</b>: releasing a track with an undeclared sample risks a takedown or a rights claim. Alternatives: replay the loop, use royalty-free packs, or build your own "fake loop" (see the demo). <b>Too many ideas</b>: add a third melodic part and you're out of the style. <b>A static filter</b>: if it doesn't move, nothing happens.`,
 live:`Simpler in Classic mode with the loop mapped, or an audio clip in Warp Beats. <b>Auto Filter</b> as a 24 dB low-pass, resonance around 30%, cutoff automated or assigned to a controller: play it by hand and record the automation. Compressor in sidechain on an "everything but drums" group. Glue Compressor on the master for cohesion.`,
 keys:`french house, filter house, 124 BPM, filtered disco loop, heavy sidechain pumping, low-pass filter sweep, phaser, vocoder vocals, four-on-the-floor`,
 refs:`Daft Punk (Homework, Discovery), Stardust, Cassius, Alan Braxe & Fred Falke, Modjo, Bob Sinclar (early work), Justice for the second wave`,
 cmp:[`120–128`,`Straight`,`On the 4 beats, heavy`,`2 and 4`,`In the loop, or minimal`,`Automated filter, pumping`,`The kick runs everything`]},

{lede:`Current, trap-influenced hip-hop: an 808 acting as bass, bursts of hi-hats, plenty of space. The production steps aside for the vocal.`,
 idc:[[`Tempo`,`130–160 BPM, felt at half that (65–80)`],[`Feeling`,`Straight; the motion comes from the hi-hat rolls`],[`Harmony`,`Dark minor, 2 to 4 chords, simple, repetitive melodies`],[`Form`,`Intro 4–8, chorus 8, verse 16 bars`]],
 tips:[
  [`Drums`,`<b>Snare or clap on beat 3</b> (half-time feel), sparse, syncopated kick. The hi-hats do the work: 16th notes, with <b>rolls</b> in 32nd notes or triplets, and ramping velocities.`],
  [`The 808`,`It's the bass <b>and</b> part of the kick. Tuned to the key, a long note, with <b>glides</b> (portamento) between certain notes. It usually follows the kick's rhythm.`],
  [`Melody and harmony`,`A short, dark, minor motif: bell, detuned piano, flute, pad. <b>Leave gaps.</b> A beat that sounds "empty" alone is often perfect once the vocal is on it.`],
  [`Sonic signature`,`A saturated 808 so it exists on a phone. Melodies often filtered, with reverb and delay. A strong contrast between a huge low end and a sparse top end.`],
  [`Arrangement`,`Built through <b>cuts</b>: dropping the drums a bar before the chorus, cutting the 808 for half a verse, dropping everything but the vocal on a punchline. Changes every 4 or 8 bars.`],
  [`Mix and master`,`Decide who owns the low end: a short kick over a long 808, with the kick lightly ducking the 808. All low end in mono. Vocal well up front, fairly dry. Loud master.`]],
 traps:`<b>An untuned 808</b>: it's a note, it has to be in the key. <b>Long kick + long 808</b>: mush in the low end. <b>Filling every gap</b>: there's no room left for the vocal. <b>Rolls everywhere</b>: they only work if they're rare.`,
 live:`Drum Rack; for the 808, a Simpler with Glide turned on in mono legato mode (two overlapping notes = a slide). Rolls: the piano roll's grid switched to 1/32 or triplets, velocities drawn as a ramp. Saturator on the 808, Utility in mono.`,
 keys:`trap, hip hop, 140 BPM half-time, 808 sub bass with glides, hi-hat rolls, dark minor bell melody, sparse, snare on the 3`,
 refs:`Metro Boomin, Southside, Mike WiLL Made-It, Zaytoven, Tay Keith`,
 cmp:[`130–160 (÷2)`,`Straight + rolls`,`Sparse, syncopated`,`Beat 3 (half-time)`,`Long 808, glides`,`Space, 808, hi-hat bursts`,`Vocal + 808`]},

{lede:`Golden-age hip-hop: a kick that goes "boom", a snare that goes "bap", a chopped jazz or soul sample, and a sampler's swing that drags just slightly.`,
 idc:[[`Tempo`,`85–95 BPM`],[`Feeling`,`Pronounced swing, 58–66%, snare sometimes a touch late`],[`Harmony`,`Whatever the sample has: jazz chords, m7, m9, maj7`],[`Form`,`2- or 4-bar loop, 16-bar verse, 8-bar chorus`]],
 tips:[
  [`Drums`,`Sounds <b>sampled from real breaks</b>, not synthesized ones. Heavy, dull kick, a cracking snare, often layered with a second sample. Sparse eighth-note hi-hats. The pattern is simple: everything is in the sound and the placement.`],
  [`The swing`,`The style's signature. MPC-style swing between 58 and 66%, then <b>turn off quantization on certain hits</b>: a snare a few milliseconds late gives the "lazy" feel.`],
  [`The sample`,`A jazz, soul or funk phrase, <b>chopped into slices</b> and replayed in a different order. Low-pass filtered to leave room for the vocal and the drums. Two to four bars, looping.`],
  [`Bass`,`Round, dull, discreet: a sine or a very low-filtered bass (low-pass around 200–300 Hz). It follows the sample's fundamentals with two or three notes per bar.`],
  [`Sonic signature`,`The grain: resolution reduction like 12-bit samplers, hiss and vinyl crackle, saturation. A spectrum centered on the mids, little extreme high end.`],
  [`Arrangement`,`The loop barely changes. Variation happens through <b>cutting</b>: the sample muted on the last bar, drums alone, scratches on the chorus.`],
  [`Mix and master`,`Loud, up-front drums, they're the star alongside the vocal. Parallel compression on the drum bus. Don't try to make it clean and bright: soften above 12 kHz.`]],
 traps:`<b>Too clean</b>: modern drum sounds and a bright mix sound out of style. <b>Everything quantized</b>: without the swing and the delays, it's just a slow beat. <b>Uncleared samples</b>: the same legal risk as French Touch. <b>Too many layers</b>: drums, bass, one sample, maybe a second element, no more.`,
 live:`Simpler in <b>Slice</b> mode to chop the sample and replay it on pads. Groove Pool: "MPC" grooves at 58–66%. <b>Redux</b> for the 12-bit grain, <b>Vinyl Distortion</b> for the crackle, <b>Drum Buss</b> on the drums. Auto Filter low-pass on the sample.`,
 keys:`boom bap, 90 BPM, swung MPC drums, chopped jazz sample, dusty vinyl, SP-1200, filtered bassline, scratches`,
 refs:`DJ Premier, Pete Rock, J Dilla, Large Professor, The Alchemist, Madlib`,
 cmp:[`85–95`,`Pronounced, 58–66%`,`Heavy, offset`,`2 and 4, a touch late`,`Dull, filtered`,`Chopped sample, grain, swing`,`Drums up front`]},

{lede:`One single criterion: the song. Every production decision serves the vocal and the chorus. It's the style most constrained by form, and the freest with sounds.`,
 idc:[[`Tempo`,`90–128 BPM, highly variable`],[`Feeling`,`Straight, precise, tight`],[`Harmony`,`4-chord loop: I–V–vi–IV and its permutations`],[`Form`,`Verse / pre-chorus / chorus / bridge, 2:30 to 3:30`]],
 tips:[
  [`Form`,`Very short intro (under 10 seconds), <b>first chorus before 45 seconds</b>. The pre-chorus raises the tension, the chorus releases it. After the second chorus, a bridge brings contrast, then a final, bigger chorus.`],
  [`Topline and vocals`,`The vocal melody is the song. A chorus melody higher and more sustained than the verse's. Careful vocal production: doubles, harmonies, ad-libs, pitch correction, tight compression, de-essing.`],
  [`Verse / chorus contrast`,`<b>The setting that makes or breaks a hit.</b> Verse: narrow, stripped down, low. Chorus: wide (panned doubles), dense, higher, with the bass an octave up and cymbals. The chorus has to "open up".`],
  [`Drums and bass`,`Simple, clean, in service. Tight kick and snare, bass on the fundamentals. A good pop pattern goes unnoticed.`],
  [`Ear candy`,`One small event every 4 to 8 bars: a reverse, an echo on a word, a sound that appears only once. It's what holds attention on the twentieth listen.`],
  [`Arrangement`,`Make room for the vocal: <b>nothing should compete with it between 1 and 4 kHz</b> while it's singing. Melodic instruments go in the gaps of the vocal, not on top of it.`],
  [`Mix and master`,`Vocal up front, clear, stable from the first word to the last (volume automation). Controlled low end, bright but not harsh highs. Loud but clean master: no audible distortion.`]],
 traps:`<b>Intro too long</b>: the listener is gone before the singing starts. <b>A chorus that doesn't lift off</b>: if the verse and chorus have the same density and width, there's no chorus. <b>The instrumental fighting the vocal</b>: a synth lead during the singing is one too many. <b>Too many ideas</b>: a pop song is one hook, not five.`,
 live:`Work the structure in Arrangement View with locators from the start. A "vocal" group with a de-esser, two light compressors in series, sends to a short plate and a filtered delay. Chorus doubles panned left and right. EQ Eight as a visual sidechain to spot what's masking the vocal.`,
 keys:`modern pop, 104 BPM, catchy topline, four-chord progression, clean punchy drums, wide chorus, vocal doubles and harmonies, radio-ready`,
 refs:`Productions by Max Martin, Jack Antonoff, Finneas, Stuart Price; Dua Lipa and The Weeknd for disco- and synthwave-flavored pop`,
 cmp:[`90–128`,`Straight`,`Simple, tight`,`2 and 4`,`Fundamentals`,`Verse / chorus contrast`,`The vocal, always`]},

{lede:`The matrix of all club music: a kick on every beat, an open hi-hat in between, and on top, keyboard chords inherited from gospel, soul and jazz.`,
 idc:[[`Tempo`,`118–128 BPM`],[`Feeling`,`Lightly swung hi-hats, 54–60%`],[`Harmony`,`m7 and m9 chords moved in parallel, two to four chords`],[`Form`,`Club format: 16- and 32-bar blocks, 6 to 8 minutes`]],
 tips:[
  [`Drums`,`Kick on the 4 beats, clap on 2 and 4, <b>open hi-hat on every offbeat</b>. Closed hi-hats and a shaker in 16th notes, swung: that light bounce is what sets house apart from a plain pulse.`],
  [`Bass`,`Simple and repetitive, on the offbeats or syncopated around the kick. Round and warm in deep house, more percussive in classic house. One to three notes is enough.`],
  [`The chords`,`The harmonic signature: an <b>m7 or m9 chord played as syncopated stabs</b>, then the same chord shape moved as-is to other roots. Sounds: organ, piano, electric piano, pads.`],
  [`Vocals`,`Soul or gospel phrases, often chopped into rhythmic fragments that become an instrument. One repeated word can be a hook.`],
  [`Sonic signature`,`Warmth, space, repetition. Moderate sidechain so the chords breathe with the kick. Reverb and delay on the stabs, never on the kick or bass.`],
  [`Arrangement`,`A slow, steady progression. One element comes or goes every 8 or 16 bars. The break strips out the kick and bares the chords and vocal, then the kick returns alone with the bass.`],
  [`Mix and master`,`The kick/bass pair occupies the center, everything else is organized around it. Hi-hats present but soft. Keep dynamics: a house track breathes.`]],
 traps:`<b>Perfectly straight hi-hats</b>: without swing, the track loses its bounce. <b>Too many chords</b>: a complex progression breaks the hypnosis; two well-voiced chords are enough. <b>Intro too short</b>: a DJ needs 16 to 32 bars of rhythm alone to mix in.`,
 live:`A Drum Rack with 909-style sounds. Groove Pool: 16th swing between 54 and 60% on hi-hats and percussion. For the stabs: a whole chord played from a single key thanks to the MIDI <b>Chord</b> device, which reproduces the parallel-movement effect. Echo as a send on the stabs.`,
 keys:`house, deep house, 123 BPM, four-on-the-floor, 909 drums, offbeat open hi-hat, swung shakers, minor ninth organ stabs, soulful vocal chops`,
 refs:`Frankie Knuckles, Marshall Jefferson, Larry Heard (Mr. Fingers), Masters at Work, Kerri Chandler, Moodymann`,
 cmp:[`118–128`,`Swung hi-hats, 54–60%`,`On the 4 beats`,`2 and 4 (clap)`,`Simple, on the offbeats`,`Parallel m9 stabs, open hi-hat`,`Kick / bass pair`]},

{lede:`A music of texture and hypnosis. Almost no harmony, almost no melody: a kick, a rumble, a handful of percussive sounds, and all the interest in their slow evolution.`,
 idc:[[`Tempo`,`125–140 BPM, and beyond for harder forms`],[`Feeling`,`Straight, mechanical, unapologetic`],[`Harmony`,`Minimal: one note, one minor chord, or pitchless sounds`],[`Form`,`16- and 32-bar phrases, 6 to 8 minutes, built for the DJ mix`]],
 tips:[
  [`The kick`,`The central element, to nail before anything else: a clean attack, a short, hard, tuned body. It occupies the mix on its own. Many tracks are built from the kick and nothing else.`],
  [`The rumble`,`Techno's "bass": a <b>low growl between the kicks</b>, obtained by sending the kick into a reverb, then low-pass filtering the result and having it duck under the kick. It fills space without playing any notes.`],
  [`Percussion`,`Open hi-hat on the offbeats, closed hi-hats in 16th notes with offset accents, claps and metallic percussion. Loops of 3 or 5 steps running against the 4-beat bar create hypnotic offsets.`],
  [`The synth`,`A single, very short motif, often a stab or a note, run through a <b>delay</b> and constantly modulated: cutoff, resonance, length, reverb amount. Automation is what composes the track.`],
  [`Sonic signature`,`Saturation and distortion as timbral tools. Dark reverbs, synced delays. A lot of energy in the low end and low-mids, few bright elements.`],
  [`Arrangement`,`Additive and subtractive, in layers, with no verse or chorus. The break strips out the kick for 8 to 32 bars while tension rises, then it returns. One single idea, exploited to the fullest.`],
  [`Mix and master`,`Kick and rumble first: if the two work together, the track is half done. Strictly mono low end. A loud master, but the kick has to keep its attack.`]],
 traps:`<b>Too many melodic elements</b>: the moment a melody settles in, it's no longer techno. <b>A rumble that bleeds into the kick</b>: it has to fully clear out on every hit. <b>Nothing moving</b>: a static 8-bar loop repeated 40 times isn't hypnotic, it's boring; the difference is modulation.`,
 live:`Kick: a Drum Rack with the kick on its own chain. Rumble: send from the kick to a return with <b>Hybrid Reverb</b>, then EQ Eight low-pass around 120 Hz, then Compressor in sidechain on the kick, then Saturator. For the synth: <b>Echo</b> as an insert, and long automations on the cutoff. <b>Roar</b> or Saturator for the grain.`,
 keys:`techno, 132 BPM, hard driving kick, sub rumble, offbeat open hat, hypnotic, dub chord stab with delay, industrial percussion, minimal, dark warehouse`,
 refs:`Juan Atkins, Derrick May, Kevin Saunderson for the origins; Jeff Mills, Robert Hood, Underground Resistance, Surgeon, Ben Klock`,
 cmp:[`125–140+`,`Straight`,`On the 4 beats, hard, central`,`Discreet or absent`,`Rumble: growl between kicks`,`Slow modulation, delay, saturation`,`Kick + rumble`]},

{lede:`Everything is rhythm. Every instrument, guitar, keys and horns included, behaves like a percussion, and the whole thing interlocks like a mechanism.`,
 idc:[[`Tempo`,`90–115 BPM`],[`Feeling`,`16th notes, light swing, heavily played`],[`Harmony`,`Often a single chord: dominant 7th, 9th, or dorian m7`],[`Form`,`An extended vamp, with a bridge on a second chord`]],
 tips:[
  [`"The One"`,`The founding principle: <b>everyone hits the first beat of the bar</b>. Between two "ones", everyone syncopates freely. That shared accent is what holds the whole thing up.`],
  [`Drums`,`A syncopated kick that avoids certain beats, snare on 2 and 4 surrounded by <b>ghost notes</b>, 16th-note hi-hats with occasional opens. The groove lives in the weak 16ths.`],
  [`Bass`,`The star. Syncopated, percussive, with <b>dead notes</b> that serve rhythm alone, octaves, and the minor seventh as a passing note. Slap or fingerstyle.`],
  [`Guitar and keys`,`Guitar in muted 16th notes, on two or three strings, almost never playing the full chord. Clavinet or organ as counter-rhythm. No one plays at the same time as anyone else.`],
  [`Horns`,`Short, sharp punctuations, in unison or tight harmony. They answer the vocal, they don't accompany it.`],
  [`Arrangement`,`The interlock: each part occupies the 16th notes the others leave free. If two instruments play the same rhythm, one of them is redundant. "Drums alone" breaks are hip-hop's raw material.`],
  [`Mix and master`,`Dry, close, dynamic. Very little reverb. Bass and drums up front, guitar thin and panned. Don't compress to the point of flattening the ghost notes: they are the groove.`]],
 traps:`<b>Everyone playing all the time</b>: funk is about space. <b>Full chords on guitar</b>: they clog the mids; two notes are enough. <b>A bass with no silences</b>: dead notes and gaps matter as much as the notes. <b>Too much reverb</b>: the style is dry.`,
 live:`Program the drums with three clearly distinct velocity levels (accent, normal, ghost). For the bass, very short, low-velocity notes simulate dead notes. Auto Filter with an envelope on a keyboard for the "wah" effect. Groove Pool: a groove extracted from a real break rather than a regular swing.`,
 keys:`funk, 102 BPM, syncopated slap bass, chicken scratch guitar, clavinet, tight horn stabs, ghost notes, dominant ninth vamp, dry and punchy`,
 refs:`James Brown, Parliament-Funkadelic, Sly & the Family Stone, The Meters, Prince, Zapp & Roger`,
 cmp:[`90–115`,`Light, heavily played`,`Syncopated, avoids beats`,`2 and 4 + ghost notes`,`Star: syncopated, dead notes`,`Rhythmic interlock, "The One"`,`Bass and drums, dry`]},

{lede:`Early-80s funk, once drum machines and synthesizers replace the rhythm section: a funk groove, machine sounds, vocals run through a talk box or a vocoder.`,
 idc:[[`Tempo`,`105–125 BPM`],[`Feeling`,`Swung 16th notes, 54–58%`],[`Harmony`,`m7 and 9th chords, two- to four-chord vamps`],[`Form`,`Song form, with long instrumental stretches`]],
 tips:[
  [`Drums`,`<b>Drum machines</b>, and it should be heard: 808-type kick and cowbell, LinnDrum-type snare and claps, synthetic hi-hats. Generous claps on 2 and 4, with a short reverb.`],
  [`Bass`,`A fat, <b>synth</b> funk bass, played like a slap bass: octaves, syncopations, slides. Sawtooth or square, fast-envelope filter with resonance. The most up-front element after the vocal.`],
  [`Keys`,`Warm, wide analog pads in the background, <b>synthetic brass stabs</b> as syncopated punctuations. Rich chords, hit short.`],
  [`Vocals`,`The signature: <b>talk box or vocoder</b> for the lead, with a very melodic sung phrasing, and chopped ad-libs. Harmonized backing vocals answering.`],
  [`Sonic signature`,`Chorus on the pads, bright, 80s-flavored digital reverbs, wide claps. A sound both mechanical from the machines and loose from the swing.`],
  [`Arrangement`,`The groove is set from the first bar and never stops. Variation comes through the horns, electronic drum fills and vocal answers. Long intro and outro if you're aiming at DJs.`],
  [`Mix and master`,`Synth bass and kick share the low end: short kick, higher bass. Bright but not aggressive claps and cowbell. Talk-box vocal centered, well up front, with little reverb.`]],
 traps:`<b>Acoustic or overly modern drum sounds</b>: the style rests on the timbre of period machines. <b>No swing</b>: without it, you get stiff electro, not funk. <b>An unintelligible vocoder</b>: the vocal is the lead, it has to be understood.`,
 live:`A Drum Rack mixing 808 and LinnDrum kits. Bass: Analog or Drift, low-pass filter with a fast envelope and resonance, Glide on for the slides. Pads: Wavetable or Drift with <b>Chorus-Ensemble</b>. Vocoder with Carrier set to External on a sawtooth synth. Groove Pool at 54–58%.`,
 keys:`80s electro-funk, 118 BPM, TR-808 kick and cowbell, LinnDrum snare and claps, funky synth bass in octaves, analog brass stabs, Juno pads, talkbox lead, swung sixteenths`,
 refs:`Zapp & Roger, Cameo, The Gap Band, Midnight Star, Afrika Bambaataa; Dâm-Funk and Chromeo for current reinterpretations`,
 cmp:[`105–125`,`Swung, 54–58%`,`808, syncopated`,`2 and 4, LinnDrum claps`,`Synth in octaves, slides`,`Drum machines, talk box, synth horns`,`Synth bass + vocals`]},

{lede:`An imagined 80s soundtrack: analog synths, electronic drums with reverb cut off sharp, an eighth-note bass that never stops, and unapologetic nostalgia.`,
 idc:[[`Tempo`,`80–120 BPM; slower for the dreamy side, faster for outrun`],[`Feeling`,`Straight, mechanical`],[`Harmony`,`Minor, 4 chords: i – VI – III – VII and variants`],[`Form`,`Song form, or a themed instrumental`]],
 tips:[
  [`Drums`,`A round kick, and above all the <b>gated-reverb snare</b>: a large reverb abruptly cut off after a quarter second. Simple eighth-note hi-hats, and descending <b>electronic toms</b> for transitions.`],
  [`Bass`,`A synth bass in <b>continuous eighth notes</b> on the fundamental, sometimes with an octave jump: it's the style's engine. Sawtooth, a fairly closed filter, a short envelope. It almost never syncopates.`],
  [`Pads and arpeggios`,`Wide, detuned sawtooth pads with chorus, and an <b>arpeggio in 16th notes</b> spelling out the chord's notes. These two layers do most of the coloring.`],
  [`The lead`,`A simple, singable, sustained melody, with vibrato and glides between notes. A bright synth or a distorted guitar sound. Long reverb and a dotted-eighth delay.`],
  [`Sonic signature`,`Chorus everywhere, long, bright reverbs, a slight tape-style pitch wobble. Sidechain is a modern addition, to be dosed lightly.`],
  [`Arrangement`,`An atmospheric intro (pad, filtered arpeggio), then the bass and drums come in together. Theme, verse, theme. Tom fills announce every section change.`],
  [`Mix and master`,`Wide and spacious, but keep the bass and kick dry and centered, or everything drowns. Clean up the pads' low-mids: with that many synths, that's where the mud sets in.`]],
 traps:`<b>Drowning the mix in reverb</b>: long on the lead and snare, absent on the bass and kick. <b>Overly modern sounds</b>: aggressive digital timbres break the mold. <b>A syncopated bass</b>: it should stay a steady engine. <b>Stacking five pads</b>: two is enough.`,
 live:`Gated reverb: on a return, <b>Reverb</b> with a long decay, followed by <b>Gate</b> whose sidechain listens to the snare; set Hold and Release for a clean cutoff. Pads: Drift or Analog with two detuned oscillators, then Chorus-Ensemble. Arpeggio: the <b>Arpeggiator</b> MIDI device at 1/16. Lead: Glide on, Echo on a dotted eighth.`,
 keys:`synthwave, outrun, retrowave, 100 BPM, gated reverb snare, driving eighth-note synth bass, analog pads with chorus, sixteenth arpeggio, soaring lead, electronic tom fills`,
 refs:`Kavinsky, College, Carpenter Brut, Perturbator, The Midnight, Timecop1983, FM-84`,
 cmp:[`80–120`,`Straight`,`Round, on the beats`,`2 and 4, gated reverb`,`Continuous eighths, fundamental`,`Pads + arpeggio + chorus, gated snare`,`Space, without drowning kick and bass`]},

{lede:`Breakbeats at 174 BPM and a bass moving twice as slow. All the style's tension comes from the contrast between frantic drums and a slow, massive low end.`,
 idc:[[`Tempo`,`170–176 BPM`],[`Feeling`,`Straight; the motion comes from the break's ghost notes`],[`Harmony`,`Minor, slow pads, often 2 to 4 stretched chords`],[`Form`,`32- to 64-bar intro, drop, break, second drop`]],
 tips:[
  [`Drums`,`The <b>two-step</b>: kick on the 1, snare on the 2, kick just before the 3, snare on the 4. On top, ghost notes and fast hi-hats. A sampled break is often layered in for grain, over clean hits for impact.`],
  [`The snare`,`The most crafted element: body around 200 Hz for weight, a crack in the highs, very short. It has to cut through the mix on every hit.`],
  [`Bass`,`Two clearly separated tiers: a <b>sine sub</b>, clean and mono, and a moving mid layer, typically a <b>Reese</b> (detuned saws) with a moving filter. Long notes, slow rhythm.`],
  [`Atmosphere`,`Pads, distant vocals, reverbed pianos: the melodic elements move at half-tempo, which gives the style its combination of fast and floaty.`],
  [`Arrangement`,`A long, low-end-free atmospheric intro, a build, then the <b>drop</b> where the full drums and bass enter together. Drum variations every 8 or 16 bars, a bass-sound change at the second drop.`],
  [`Mix and master`,`Strictly mono, stable sub. High-pass everything else, including the sampled break. The bass's mid layer shouldn't mask the snare. A loud, dense master.`]],
 traps:`<b>A bass that's too busy</b>: at this tempo, fast low-end notes turn into mush. <b>Unison on the sub</b>: the Reese is the mid layer; the sub stays a lone sine. <b>A snare with no body</b>: it disappears behind the bass. <b>Overly clean drums</b>: without a real break's grain, the style sounds sterile.`,
 live:`Break: an audio clip in Warp Beats mode, or chopped in Simpler's Slice mode. Layer the kick and snare in a Drum Rack. Bass: a two-chain Instrument Rack, Operator on sine for the sub, Wavetable with two detuned oscillators for the Reese with a modulated Auto Filter, EQ Eight high-pass at 120 Hz on that chain. Utility in mono on the sub.`,
 keys:`drum and bass, 174 BPM, two-step breakbeat, chopped amen break, reese bass, deep sine sub, atmospheric pads, liquid, half-time melody`,
 refs:`Goldie, LTJ Bukem, Roni Size, Andy C, Calibre, Noisia`,
 cmp:[`170–176`,`Straight + ghost notes`,`1 and just before the 3`,`2 and 4, heavily crafted`,`Sine sub + Reese, long notes`,`Fast drums, slow low end`,`Mono sub + snare`]}
];

EN.ERAS=[
{tag:`Tape and the room`,
 lede:`Musicians are recorded playing together, onto magnetic tape with a strictly limited track count. Every decision is final: it's a constraint, and it's the reason these records sound like performances.`,
 idc:[[`Medium`,`Magnetic tape, 16 then 24 tracks`],[`Dominant tools`,`Analog console, microphones, hardware compressors, plate reverbs and echo chambers`],[`Constraint`,`Few tracks, no undo, razor-blade editing`],[`The sound`,`Warm, dry, dead, dynamic`]],
 steps:[[`Write and rehearse before entering the studio.`,`Studio time is expensive: the arrangement is locked in beforehand, on paper or in rehearsal.`],
  [`Record the rhythm section together.`,`Drums, bass, guitar, keys play at the same time, often in the same room. Every mic's sound carries a bit of the others: this "bleed" glues the whole thing together.`],
  [`Add through overdubbing.`,`Vocals, backing vocals, strings, horns, solos are then stacked, track by track.`],
  [`Decide at the take.`,`EQ and compression are applied to the recording itself. When tracks run out, several get bounced down to one: no going back.`],
  [`Mix by hand.`,`Several people on the console, each responsible for a few faders, to perform the mix live. Automation only shows up at the decade's end.`],
  [`Master for vinyl.`,`Centered low end, controlled sibilance, a limited running time per side: the medium dictates its own rules to the mix.`]],
 codes:[[`"Dead" drums`,`Muted skins, a heavily damped room, close mics. A short, dull snare, a felted kick, almost no reverb on the rhythm section.`],
  [`A tempo that breathes`,`The click isn't a given. The tempo widens in the choruses, tightens in the verses. It's not a flaw, it's an interpretation.`],
  [`Tape saturation`,`Recording hot onto tape compresses gently and rounds off the highs. That's the "warmth": less extreme high end, softened transients, dense low-mids.`],
  [`Physical spaces`,`Plate reverbs, concrete echo chambers, tape echo. Few effects, identifiable, shared across several instruments.`],
  [`Real orchestras`,`Strings, horns, choirs recorded as a group. Early (monophonic) synthesizers serve as soloists or basses, not pads.`]],
 today:`Keep velocities and placement lively: partial quantization, or a groove extracted from a real drummer. A dry acoustic kit, <b>Reverb</b> in plate mode on a return, for vocals and strings only. Gentle <b>Saturator</b> on the buses, then <b>EQ Eight</b> softening beyond 10–12 kHz and removing below 40 Hz. A slight pitch wobble via <b>Echo</b>'s modulation. Deliberately cap yourself at 16 or 24 tracks: the constraint is part of the sound.`,
 traps:`<b>Too much sub and too much brightness</b>: these records live between 60 Hz and 10 kHz. <b>Long digital reverbs</b>: out of period. <b>Snapping everything to the grid</b>: the first thing you hear is that nobody is playing.`,
 refs:`Stevie Wonder (Innervisions), Steely Dan (Aja), Fleetwood Mac (Rumours), Pink Floyd (The Dark Side of the Moon), Chic, Marvin Gaye (What's Going On). At the turning point: Kraftwerk, and Donna Summer and Giorgio Moroder's fully sequenced "I Feel Love" (1977).`,
 cmp:[`16–24 track tape`,`The console and the room`,`Played, free tempo`,`Round, contained`,`Plates, chambers, dry`,`Dynamic`,`The track count`]},

{tag:`Machines and MIDI`,
 lede:`The drum machine replaces the drummer, the sequencer plays instead of hands, and MIDI links every machine together. The sound becomes larger than life: precise, bright, wide, spectacular.`,
 idc:[[`Medium`,`Synced 24-track tape, then early digital multitracks`],[`Dominant tools`,`Drum machines, digital and polyphonic synths, first samplers, digital reverbs, large automated consoles`],[`Constraint`,`Prohibitively expensive machines, a few seconds of sampling memory`],[`The sound`,`Big, bright, wide, precise`]],
 steps:[[`Program the rhythm section.`,`Drum machine or sequencer, quantized by design. It's the first time a perfectly regular rhythm becomes the norm.`],
  [`Stack synths over MIDI.`,`One keyboard drives several: a digital sound for the attack, an analog one for the body. "Layering" is born here.`],
  [`Lay it to synced tape.`,`The machines run in sync with the tape recorder: a sequencer part can be redone without touching anything else.`],
  [`Add the human element.`,`Vocals, guitars, saxophone, sometimes real toms or cymbals on top of the drum machine.`],
  [`Mix on a large console.`,`Gate and compressor on every channel, a bus compressor on the mix, fader automation, and digital reverbs on almost everything.`],
  [`Master for two formats.`,`Vinyl and CD (from 1982). The CD allows more low and high end, and pushes toward brightness.`]],
 codes:[[`The gated snare`,`A huge reverb cut off sharp by a noise gate. Born from a studio accident at the very start of the decade, it became ten years of pop's drum sound.`],
  [`Chorus everywhere`,`On pads, clean guitars, fretless basses. It widens and adds sparkle.`],
  [`Digital timbres`,`FM-synthesized electric pianos and bells, crystalline and percussive, alongside warm analog pads. The contrast between the two defines the era.`],
  [`The sample as an event`,`Orchestra hits, chopped vocals, noises: samplers are expensive and their memory tiny, so they get used for short, striking effects.`],
  [`Programmed swing`,`Because everything is quantized, drum-machine makers add a "shuffle" control. That's the birth of swing as a percentage.`]],
 today:`A Drum Rack with 808, 909 and LinnDrum kits. Snare: a long <b>Reverb</b> on a return, followed by <b>Gate</b> sidechained to the snare. <b>Operator</b> for FM electric pianos and bells, <b>Drift</b> or <b>Analog</b> for pads, <b>Chorus-Ensemble</b> on almost everything. <b>Hybrid Reverb</b> with a bright hall algorithm. <b>Glue Compressor</b> on the master for console-style glue. 100% quantization, and a little global swing.`,
 traps:`<b>Drowning the mix</b>: the reverbs are long, but the bass and kick stay dry. <b>Stacking five synths in the low-mids</b>: every layer needs its own register. <b>Modern drum sounds</b>: the timbre of period machines is half the style.`,
 refs:`Michael Jackson (Thriller, produced by Quincy Jones), Prince (1999, Purple Rain), Trevor Horn's productions, Peter Gabriel and Phil Collins for the gated drums, Jimmy Jam & Terry Lewis (Janet Jackson, Control), Depeche Mode, New Order, Nile Rodgers as producer (Let's Dance, Like a Virgin).`,
 cmp:[`Synced tape, then digital`,`Drum machine + MIDI`,`Quantized, programmed shuffle`,`Synth or slap, precise`,`Digital reverbs, gated`,`Loud and bright`,`The price of machines`]},

{tag:`The sampler and the home studio`,
 lede:`The sampler becomes the central instrument and the studio moves into the bedroom. Music is no longer played, it's chopped, looped, glued back together. Cheap machines' grain becomes an aesthetic.`,
 idc:[[`Medium`,`Affordable digital multitracks, then hard disk`],[`Dominant tools`,`Samplers and pad samplers, computer MIDI sequencers, rack expanders, secondhand 80s machines`],[`Constraint`,`A few seconds of memory, limited polyphony, 12- or 16-bit`],[`The sound`,`Grainy, deep low end, dry and up front`]],
 steps:[[`Hunt for the material.`,`Hours in bins of vinyl: a drum break, two bars of strings, an electric-piano chord.`],
  [`Sample smart.`,`Memory is scarce: you sample the 45 RPM pressing of a record, then pitch it down inside the sampler. You save memory, and you gain a grain.`],
  [`Chop, loop, reorder.`,`The sample is sliced and replayed on pads in a different order. It's a composition in its own right, not a quote.`],
  [`Program with swing.`,`The pad sampler's sequencer imposes its own grid and swing. Some producers turn quantization off and play everything by hand.`],
  [`Record vocals at home.`,`A digital cassette multitrack or an early hard-disk workstation: no more need for a big studio to finish a record.`],
  [`Mix loud.`,`The first look-ahead digital limiters allow levels that were previously impossible. The loudness war begins.`]],
 codes:[[`The breakbeat`,`A few bars of funk drums, looped, sped up, chopped: hip-hop, jungle, big beat and trip-hop all come from the same move.`],
  [`The 12-bit grain`,`Hiss, clipped highs, aliasing: cheap samplers' flaws give a patina that people will later try to imitate.`],
  [`The filter on the sample`,`A low-pass to pull a bassline out of a record, an automated filter on a disco loop: French Touch is a sampler's idea.`],
  [`Audible time-stretch`,`Stretching a sound's length without changing its pitch produces a metallic grain. Jungle turns it into a signature.`],
  [`A new kind of low end`,`Sine subs, elongated 808s, jungle basses: digital gear and sound systems push the low end lower than ever before.`],
  [`The return of raw`,`As a reaction to the 80s: understated reverbs, dry, close vocals, and on the rock side, a return to live takes in big rooms.`]],
 today:`<b>Simpler</b> in Slice mode to chop and replay. For the grain: transpose your sample up several semitones, export it, reimport it and pitch it back down in <b>Re-Pitch</b> Warp mode; add <b>Redux</b> and <b>Vinyl Distortion</b>. Groove Pool with MPC grooves. <b>Drum Buss</b> on the drums, <b>Auto Filter</b> on the loops. For a period-accurate time-stretch, Warp mode Beats or Texture pushed to the extreme rather than Complex Pro, which is too clean.`,
 traps:`<b>Too clean</b>: a transparent time-stretch and 24-bit samples sound out of period. <b>Uncleared samples</b>: case law hardened precisely during this decade. <b>Too many layers</b>: limited polyphony forced sparse arrangements.`,
 refs:`DJ Premier, Pete Rock, Dr. Dre (The Chronic), J Dilla, Daft Punk (Homework), The Prodigy, The Chemical Brothers, Massive Attack, Portishead, Goldie, Timbaland with Missy Elliott; Nirvana (Nevermind) for the rock side.`,
 cmp:[`Affordable digital, hard disk`,`The sampler`,`Breaks, sampler swing`,`Deep sub`,`Dry, up front`,`Getting louder`,`The sampler's memory`]},

{tag:`Everything in the computer`,
 lede:`The entire studio fits in a laptop: unlimited tracks, infinite undo, total recall. For the first time, there's no more technical constraint at all. The sound becomes very loud, very dense, very edited.`,
 idc:[[`Medium`,`Digital audio workstation, "in the box"`],[`Dominant tools`,`Production software, plugin instruments and effects, pitch correction, brickwall limiters`],[`Constraint`,`None: the risk becomes decision paralysis`],[`The sound`,`Loud, dense, clean, snapped to the grid`]],
 steps:[[`Compose straight inside the software.`,`Starting from a loop, a preset, a sample pack. Writing, arranging and mixing all happen at once, in the same window.`],
  [`Edit with a scalpel.`,`Comping the best take syllable by syllable, note-by-note pitch correction, drums snapped to the grid, hits replaced by samples.`],
  [`Automate everything.`,`Every parameter of every plugin can move. Filter and white-noise risers become a language of their own.`],
  [`Mix inside the computer.`,`Instant recall of any mix. A track can be revisited months later, and it is.`],
  [`Master very loud.`,`Absolute-ceiling limiters: the peak of the loudness war lands at the end of the decade.`],
  [`Distribute as files.`,`MP3, portable players and earbuds: mixing now happens for tiny earphones as much as for speakers.`]],
 codes:[[`Sidechain as an effect`,`Pumping, once a flaw, becomes the signature of filter house and then all of mainstream dance music.`],
  [`Corrected, then transformed vocals`,`Pitch correction, designed to be invisible, gets pushed to the extreme and becomes a timbre in its own right in R&B and hip-hop.`],
  [`The perfect grid`,`Everything is quantizable, audio included. As a reaction, it's also the decade that rediscovers unquantized playing.`],
  [`Supersaws and presets`,`A handful of virtual synths define an entire scene's sound. The question is no longer "how do I build this sound" but "which preset".`],
  [`Synthetic minimalism`,`In hip-hop and R&B: few elements, very dry, very up front, a lot of silence. The exact opposite of the wall of sound.`]],
 today:`This is, for the most part, your current way of working: the era's lesson is mostly in its excesses. <b>Wavetable</b> with unison for the supersaws, <b>Compressor</b> in deep sidechain, <b>Auto Shift</b> for the robotic voice, white-noise risers with <b>Auto Filter</b>. For the period's master sound, push a <b>Limiter</b> by 8 to 10 dB, then compare at matched volume to hear what it costs.`,
 traps:`<b>Mastering like it's 2008</b>: with platform normalization, a crushed master just gets turned down and sounds smaller than everyone else's. <b>Over-editing</b>: drums 100% snapped and a vocal 100% corrected no longer carry any performance. <b>The preset collection</b>: abundance is this era's constraint, so set yourself limits.`,
 refs:`The Neptunes, Timbaland (FutureSex/LoveSounds), Daft Punk (Discovery), Justice (†), Kanye West (808s & Heartbreak), Max Martin's pop productions. Against the grain: Burial (Untrue), assembled by hand with no grid, and J Dilla (Donuts).`,
 cmp:[`The computer`,`The software and its plugins`,`The perfect grid`,`Sub + sidechain`,`Plugins, artificial spaces`,`Maximum`,`Abundance`]},

{tag:`The streaming and the 808`,
 lede:`Streaming becomes the dominant way to listen, and it rewrites the rules: loudness is normalized, a listener can skip in a second, and everyone has access to the same sounds. Hip-hop's 808 becomes the bass of all of pop.`,
 idc:[[`Medium`,`Laptop; streaming distribution`],[`Dominant tools`,`Wavetable synths, subscription sample libraries, video tutorials, instrumentals sold online`],[`Constraint`,`The listener's attention: a play only counts after roughly thirty seconds`],[`The sound`,`Huge, clean low end, bright highs, plenty of space, heavily processed vocals`]],
 steps:[[`Start from shared material.`,`A sample pack, a preset, a melodic loop, an instrumental bought online. Thousands of producers start from the same sources: the difference is made in the processing.`],
  [`Collaborate remotely.`,`Stems and sessions get emailed around. A pop track passes through the hands of a topline writer, a beatmaker, a vocal producer, a mixer.`],
  [`Design the money moment.`,`The drop in electronic music, the 808 and its slide in hip-hop: most of the sound-design time goes into a few decisive seconds.`],
  [`Produce the vocal as an instrument.`,`Pitch correction, stacks, rhythmic chops, formant shifts. Fragments of voice become the lead instrument.`],
  [`Mix for earbuds and a phone.`,`A clean sub for headphones and the club, harmonics for small speakers. Fewer elements than before, but each one bigger.`],
  [`Master for normalization.`,`Platforms bring everything to the same loudness: pushing the limiter harder no longer pays off. The loudness war fades out mid-decade.`],
  [`Adapt the format.`,`Shorter intros, the chorus or hook arriving very early, shorter tracks.`]],
 codes:[[`The 808 everywhere`,`Tuned, long, slid, saturated so it exists on a phone. Born in southern US hip-hop, it becomes global pop's default bass.`],
  [`The drop`,`Build, silence, release: festival electronic music's grammar. Supersaws, then future bass's pitched chords and chopped pads, then dubstep's aggressive basses.`],
  [`Extreme multiband compression`,`A setting that lifts every quiet detail and squashes every loud one, band by band. It gives that hyper-detailed, bright sound, and becomes a decade-long tic.`],
  [`Chopped vocals`,`A sampled, transposed, keyboard-replayed syllable stands in for the lead melody.`],
  [`Less, but bigger`,`Compared to the 2000s' walls of sound: few elements, a lot of empty space, a sharp contrast between a massive low end and an airy top end.`],
  [`Half-time`,`Fast tempos felt at half speed, snare on beat 3, bursts of hi-hats.`]],
 today:`<b>Wavetable</b> for moving leads and basses. Multiband Dynamics' <b>OTT</b> preset, dosed with the Amount control rather than at 100%. <b>Simpler</b> to chop and replay a vocal. An 808 in a mono-legato Simpler with Glide, followed by <b>Saturator</b> and mono <b>Utility</b>. For the master's loudness, aim for the normalization target rather than the maximum: the limiter is now just there to catch peaks.`,
 traps:`<b>Multiband compression on everything</b>: flattering at first, tiring within a minute. <b>A drop with no contrast</b>: no emptiness before it, no impact. <b>An untuned 808</b>. <b>The same packs as everyone else, with no transformation</b>: this is the decade where sounding "professional" becomes easy and sounding like yourself becomes hard.`,
 refs:`Skrillex, Flume, Avicii, Calvin Harris, Major Lazer, Metro Boomin, Mike WiLL Made-It, Noah "40" Shebib with Drake, Kanye West (Yeezus), Kaytranada, Billie Eilish and Finneas. Against the grain: Daft Punk (Random Access Memories), recorded with studio musicians and on tape.`,
 cmp:[`Laptop + streaming`,`Sample packs, wavetable synths`,`Grid, half-time, rolls`,`Tuned 808, huge and clean`,`A lot of empty space, contrast`,`Normalized: the race ends`,`The listener's attention`]},

{tag:`AI, the short format, the hybrid`,
 lede:`Producing a sketch now takes only a few minutes, and AI tools separate, correct, master or generate. The producer's work shifts: less building, more choosing, transforming and signing off. A decade still in progress, so a provisional portrait.`,
 idc:[[`Medium`,`Computer, mobile and online services`],[`Dominant tools`,`Stem separation, mixing and mastering assistants, AI generation, vocal tools, online collaboration`],[`Constraint`,`Capturing attention within seconds, inside an unprecedented flow of releases; and the question of rights`],[`The sound`,`Hybrid and referenced, close, intimate vocals, controlled low end, short tracks`]],
 steps:[[`Sketch very fast.`,`A loop, a voice memo, a generator: the idea exists within minutes. The bottleneck is no longer the building.`],
  [`Sort.`,`Ten sketches for every one kept. The producer becomes an editor too: knowing what to throw away is the central skill.`],
  [`Separate and resample.`,`Stem separation isolates vocals, drums, bass and the rest from an already-mixed file, generations included. Every stem becomes raw material again: to slice, filter, transpose.`],
  [`Put a gesture back in.`,`Re-singing, replaying the bass, reprogramming the drums, re-harmonizing. That's what turns a generic result into a signed track.`],
  [`Mix with assistance, decide for yourself.`,`Reference-matched EQ, assisted mastering: useful as a second opinion, not as a pilot.`],
  [`Spin off versions.`,`A short edit, a sped-up or slowed-down version, an instrumental, sometimes an immersive mix. A release is now a family of files.`],
  [`Check the rights before releasing.`,`Samples, vocals, and the commercial usage terms of generators, which change from one year to the next.`]],
 codes:[[`The hook in the first second`,`No intro, the chorus right away, a runtime around two to two and a half minutes: the format is sculpted by short-form video.`],
  [`Openly worn references`,`Disco, funk, synthwave, 90s house, 2000s pop: the decade quotes openly, with a current production, meaning a clean low end and a very close vocal.`],
  [`The intimate vocal`,`Sung close to the mic, almost whispered, lightly reverbed, heavily compressed. The listener is on headphones: it's spoken into their ear.`],
  [`Digital you can hear`,`The opposite extreme: over-pitched vocals, digital distortion, deliberate clipping. All-computer flaws become an aesthetic, just as tape's and the sampler's once did.`],
  [`Sped-up and slowed-down versions`,`Born on social platforms, now officially released alongside the original.`],
  [`Globalized rhythms`,`Drill and its heavily slid 808s, afrobeats, amapiano and its "log drum": grooves that are neither straight nor triplet, and that a simple swing percentage can't reproduce.`],
  [`Immersive audio`,`Spatial-audio mixes offered by major platforms since 2021. Still optional for an independent producer.`]],
 today:`Live's built-in <b>stem separation</b> to isolate and resample. Live 12's <b>MIDI generators and transformations</b> to kick out a starting idea, to be reworked by hand afterward. <b>Auto Shift</b> for pitched-up vocals, <b>Roar</b> for deliberate digital distortion. A rule of method more than a setting: for every generated or pack-sourced element, force yourself to make <b>at least one personal transformation</b> before keeping it.`,
 traps:`<b>Releasing a generation as-is</b>: the result is competent and interchangeable, and its rights are the most fragile. <b>Ignoring usage terms</b>: they've changed several times since 2024 and will keep changing, check your subscription's current terms before any commercial release. <b>Handing the decision to the assistant</b>: automated mastering doesn't know what you wanted. <b>Multiplying versions</b> instead of finishing the track.`,
 refs:`Dua Lipa (Future Nostalgia), The Weeknd (After Hours), Beyoncé (Renaissance), Fred again.., PinkPantheress, Charli XCX (Brat), 100 gecs, Kaytranada, Burna Boy, Tyla.`,
 cmp:[`Laptop, mobile, online`,`Stems, assistants, AI generation`,`Everything coexists: grid, swing, polyrhythms`,`Controlled, built for earbuds`,`Close vocal; immersive optional`,`Normalized`,`Attention, and rights`]}
];

EN.SWING={
 ess:[[`Swing is a ratio, not an effect`,`Take every pair of 16th notes and decide where the second one falls. At <b>50%</b>, in the middle: straight. At <b>66.7%</b>, two thirds of the way: that's an exact triplet, the blues and jazz shuffle. Today's music lives almost entirely <b>in between</b>, from 54 to 62%, where the ear hears neither straight nor triplet.`],
  [`Swinging eighths or 16ths`,`In jazz, blues, rock shuffle, it's the <b>eighth notes</b> that get delayed. In funk, hip-hop, house, garage, it's the <b>16th notes</b>, and the eighths stay straight. Swinging the wrong subdivision is the most common mistake.`],
  [`Quantize strength has degrees`,`Quantizing isn't all or nothing. At 100%, every note snaps to the grid. At 50%, it goes halfway there: you tighten up a take without erasing the musician's original feel.`],
  [`You quantize to a grid… which can itself be swung`,`Swing and quantization aren't opposites. A pad-sampler beat is quantized 100%, but onto a 62% grid. It's regular <b>and</b> it grooves.`],
  [`Per-instrument microtiming`,`Beyond swing, each instrument can be shifted as a block by a few milliseconds: snare <b>behind the beat</b> (laid-back, heavy), hi-hats <b>ahead</b> (edgy, rushed). These constant offsets read as character, not as mistakes.`],
  [`The same percentage doesn't sound the same at every tempo`,`Swing is a ratio, but the ear hears milliseconds. 58% at 90 BPM is a 27 ms delay, very audible. At 140 BPM, 17 ms, almost imperceptible. The slower the tempo, the more swing "speaks".`]],
 today:[[`Trap-influenced hip-hop`,`A <b>strictly straight</b> grid, zero swing. The motion comes from elsewhere: 32nd-note and triplet rolls, triplet vocal flows, sliding 808s. The straight/triplet contrast replaces swing.`],
  [`Lo-fi and current boom bap`,`Sampler swing between 58 and 66%, often combined with partial or no quantization. A late snare has become a genre marker in its own right.`],
  [`Neo-soul and "drunk" beats`,`J Dilla's legacy: no quantization, and deliberately <b>contradictory</b> offsets between instruments, kick a touch early, snare late, hi-hats straight. The pulse seems to stumble without ever falling.`],
  [`House and tech-house`,`A straight kick on the beat, and everything else (hi-hats, shakers, percussion) swung between 54 and 60%. Many producers use grooves extracted from drum machines or pad samplers rather than a percentage.`],
  [`UK garage and 2-step`,`One of electronic music's most pronounced swings, on the 16th notes, with kicks shifted off the beat. The bounce is the genre's identity.`],
  [`Afrobeats and amapiano`,`Percussion whose placement sits <b>between straight and triplet</b>, layered over straight elements. A single swing percentage isn't enough to reproduce it: it has to be worked layer by layer.`],
  [`Mainstream pop and dance`,`A strict grid, minimal or no swing. The rhythmic relief is carried by the vocal, which stays free and often sits ahead of or behind the instrumental.`],
  [`Drum & bass`,`No programmed swing: the groove comes from the original break, played by a real drummer, with its own ghost notes and irregularities, which get chopped without ever being re-quantized.`]],
 todayNote:`General trends: within every one of these movements, some artists do exactly the opposite, and that's often what sets them apart.`,
 hist:[[`≈1980`,`First programmable drum machines`,`They quantize by default. To bring back some flexibility, their designers add a "shuffle" control expressed as a percentage: the 50% → 66% scale comes from there.`],
  [`Late 80s`,`Pad samplers with a built-in sequencer`,`The same swing control, applied to sampled sounds. Values between 54 and 62% become the sound of hip-hop and house.`],
  [`90s`,`Unquantized playing on machines`,`Producers turn quantization off and play their pads like an instrument, with different offsets for each sound.`],
  [`≈2000`,`The "drunk beat" moves to musicians`,`Drummers and bands reproduce by hand a placement that was born on machines. The loop closes: the human imitates the machine that once imitated the human.`],
  [`2000s`,`Extracted grooves and fine controls in software`,`A recording's placement can be copied and applied to any clip, with timing, velocity and randomness dosed separately.`],
  [`Today`,`Two schools coexist`,`The perfect grid (trap, pop, EDM) and note-by-note microtiming (lo-fi, neo-soul, house). Both are choices; the only failure is a grid you didn't choose.`]],
 method:[[`Decide first: grid or placement?`,`Trap, pop, hard techno: stay straight and look for motion elsewhere. Organic hip-hop, house, funk, garage: placement is part of the writing.`],
  [`Pick the right subdivision.`,`16th notes for almost all of today's music. Eighth notes only for a blues, jazz or rock shuffle.`],
  [`Start with a global swing.`,`The same percentage on every rhythmic element, bass included. 54–58% for a subtle bounce, 60–64% for a sampler feel.`],
  [`Then add a per-instrument offset.`,`One at a time, constant throughout the track: a snare 10 to 25 ms late, or hi-hats 5 to 12 ms early. Past about 30 ms, you hear a flam.`],
  [`Dose randomness last, and sparingly.`,`A few milliseconds and a few percent of velocity. Randomness alone doesn't create groove: a drummer is irregular in a <b>consistent</b> way, not a random one.`],
  [`Check at the final tempo.`,`If you change the tempo by 20 BPM, listen to the swing again: the same percentage no longer produces the same effect.`],
  [`Leave the kick alone.`,`In club music, the kick stays on the grid: it's the reference every other offset makes sense against.`]],
 live:`<p><b>Groove Pool</b>: drag a groove onto a clip, then set <b>Timing</b> (strength of the placement), <b>Random</b>, <b>Velocity</b>, and the resolution with <b>Base</b> (1/8 or 1/16). The global <b>Amount</b> slider dials in every groove in the project at once. The grooves in the MPC folder use the classic values, from 54 to 66%.</p>
   <p><b>Extracting a groove</b>: right-click an audio clip, Extract Groove. A real drummer's or break's placement becomes applicable to your MIDI clips.</p>
   <p><b>Partial quantization</b>: in the quantize settings, set Amount to 50–70% rather than 100%.</p>
   <p><b>Per-instrument offset</b>: each track's <b>Track Delay</b> field, in milliseconds, positive to delay, negative to push ahead. It's the microtiming tool: constant, reversible, without touching the notes.</p>
   <p><b>Everything by hand</b>: turn off grid snapping in the MIDI editor and move notes freely.</p>`,
 err:`<p><b>Believing randomness humanizes.</b> Random offsets give you a clumsy drummer, not a grooving one. <b>Two different swings by accident</b>: a sampled drum loop at 60% against hi-hats programmed at 50% produces flams. Contradictory offsets, yes, but chosen ones. <b>Swinging the wrong subdivision</b>: eighth-note swing on a house beat turns it into a blues shuffle. <b>Setting swing on an isolated element</b>: it's only heard against a straight reference, so judge it against the kick.</p>`
};

EN.GLOSS=[
[`Chord`,``,`Several notes played together, usually three (a triad). Carries the emotion of a passage.`,'compo'],
[`Degree`,`i, iv, V…`,`A chord's position in the scale, written in roman numerals: lowercase for a minor chord, uppercase for a major one.`,'compo'],
[`Scale`,``,`The seven notes you draw from to write a song's melodies and chords.`,'compo'],
[`Hook`,``,`The short phrase the listener remembers and hums. Two to four bars, few notes, heavy repetition.`,'compo'],
[`Dorian mode`,``,`A minor scale whose sixth degree is major. Gives a funk and disco color, brighter than a plain minor.`,'compo'],
[`Motif`,`riff, pattern`,`A small melodic or rhythmic cell, repeated and varied. The basic building block of a melody.`,'compo'],
[`Progression`,`chord sequence`,`The chord sequence that loops under the track, most often four chords.`,'compo'],
[`Call and response`,`question / answer`,`Two linked phrases: the first ends in suspense, the second resolves on the tonic.`,'compo'],
[`Syncopation`,``,`An accent placed between the strong beats. Creates the rhythmic surprise at the root of groove.`,'compo'],
[`Tempo`,`BPM`,`The speed of the track, in beats per minute. A quarter note lasts 60,000 ÷ BPM milliseconds.`,'compo'],
[`Key`,`tonality`,`The track's reference scale and its resting note. "In G minor" means the G minor scale, resolving on G.`,'compo'],
[`Tonic`,``,`The resting note and chord of the key, the first degree. Where the music "comes home".`,'compo'],
[`Transposition`,`transpose`,`Moving a motif higher or lower while keeping its shape and rhythm.`,'compo'],

[`Backbeat`,``,`The snare or clap on beats 2 and 4. The accent you clap your hands on.`,'groove'],
[`Hi-hat`,`HH`,`The drum kit's double cymbal. Closed: a short sound marking the subdivision. Open: a longer sound, often on the offbeats.`,'groove'],
[`Offbeat`,`the "and"`,`The midpoint between two beats. In house, that's where the open hi-hat, and often the bass, lives.`,'groove'],
[`16th note`,``,`A quarter of a beat. A 4-beat bar holds 16 of them: the grid that drum machines are built on.`,'groove'],
[`Flam`,``,`Two nearly simultaneous hits, heard as a slight offset. Intentional from a drummer, accidental when two tracks don't share the same swing.`,'groove'],
[`Four-on-the-floor`,`4/4 kick`,`A kick on every one of the four beats. The skeleton of disco, house and techno.`,'groove'],
[`Ghost note`,``,`A very soft hit slipped in between accents, usually on the snare. Adds motion without drawing attention.`,'groove'],
[`Groove Pool`,`Ableton Live`,`In Live, the library of grooves (swing, feel) that can be applied to clips, with a global amount setting.`,'groove'],
[`Humanize`,`humanization`,`Small random variations in placement and velocity, meant to soften the rigidity of a perfectly programmed part.`,'groove'],
[`Kick`,`bass drum, BD`,`The low drum that carries the pulse. In electronic music: a sine wave whose pitch drops very fast, plus a click for the attack.`,'groove'],
[`Quantize`,`quantization`,`Snapping notes onto the rhythmic grid. At 100%, everything sits perfectly in place, hence mechanical.`,'groove'],
[`Swing`,`shuffle`,`A delay applied to the even 16th notes. 50% = straight; the higher it goes, the more the rhythm leans toward triplet feel.`,'groove'],
[`Velocity`,``,`The force of a MIDI note, from 1 to 127. On a drum part, it's what creates the accents and the life.`,'groove'],

[`808`,`TR-808`,`A 1980 drum machine, and by extension its long, tuned kick, used as a bass.`,'bass'],
[`Acid`,`TB-303`,`A saw or square bass in a very resonant filter, with slides and accents. The character comes from the automated cutoff.`,'bass'],
[`Layering`,``,`Stacking several complementary sounds into one: for instance a sub for weight and a mid layer for definition.`,'bass'],
[`Fundamental`,`root`,`The lowest frequency of a sound, the one that sets its pitch. Also: a chord's base note, which the bass plays.`,'bass'],
[`Harmonics`,`overtones`,`Multiples of the fundamental that shape a sound's timbre. They let the ear reconstruct a fundamental that isn't actually there.`,'bass'],
[`Low end`,``,`The bottom of the spectrum, roughly under 250 Hz: kick and bass. The hardest zone to judge and to mix.`,'bass'],
[`Reese bass`,`Reese`,`A bass made of detuned saw waves beating against each other. Dark and moving, typical of drum & bass.`,'bass'],
[`Saturation`,`drive, soft distortion`,`Progressive clipping of the signal that adds harmonics: density, warmth, and presence on small systems.`,'bass'],
[`Sub`,`sub-bass`,`Roughly the 30–80 Hz range. Felt more than heard; absent on small speakers.`,'bass'],

[`Subtractive arrangement`,``,`Method: duplicate the full loop across the whole track, then remove elements to carve out the sections.`,'arr'],
[`Automation`,``,`A curve that moves a setting over time: volume, cutoff, reverb amount. Gives motion to a static sound.`,'arr'],
[`Break`,`breakdown`,`A section where the rhythm section drops out to create a breather before building back up.`,'arr'],
[`Build`,`build-up`,`The bars before the drop, where tension rises: filter, riser, roll.`,'arr'],
[`Drop`,``,`The moment every element enters, after the build. The energy peak of a section.`,'arr'],
[`Impact`,`crash`,`A percussive hit placed on the first beat of a new section to mark the entrance.`,'arr'],
[`Intro / outro`,``,`The start and end of the track. In club music: long and stripped down, so a DJ can mix in and out.`,'arr'],
[`Locator`,`marker`,`A marker placed on the timeline to name sections and jump between them.`,'arr'],
[`Reverse`,``,`A cymbal or reverb played backwards, which "pulls" toward the next strong beat.`,'arr'],
[`Riser`,`uplifter`,`A noise or note that rises in pitch and volume to announce a new section.`,'arr'],
[`Fill`,`roll, snare roll`,`Increasingly tight hits at the end of a cycle, signaling a change.`,'arr'],

[`ADSR`,`envelope`,`Attack, Decay, Sustain, Release: how a setting (often volume) evolves from the start to the end of a note.`,'sd'],
[`Square wave`,``,`A waveform containing only odd harmonics. Hollow sound, video-game or clarinet-like.`,'sd'],
[`Cent`,``,`One hundredth of a semitone. The unit for fine detuning.`,'sd'],
[`Cutoff`,`cutoff frequency`,`The frequency above (or below) which a filter acts. A synth's most expressive control.`,'sd'],
[`Sawtooth`,``,`A waveform containing every harmonic. Rich and bright: the ideal raw material for a filter.`,'sd'],
[`Detune`,``,`A slight pitch offset between two voices. Creates beating, hence thickness and motion.`,'sd'],
[`FM`,`frequency modulation`,`Synthesis where one oscillator modulates another's frequency. Metallic timbres, bells, electric pianos.`,'sd'],
[`Waveform`,``,`The shape of one signal cycle. It determines the harmonic content, hence the base timbre.`,'sd'],
[`LFO`,`low frequency oscillator`,`An oscillator too slow to be heard, used to automatically move a setting.`,'sd'],
[`Oscillator`,`OSC, VCO`,`A synth's sound generator: it produces a waveform at the pitch of the played note.`,'sd'],
[`Low-pass`,`LPF`,`A filter that lets the low end through and attenuates what's above the cutoff. Darkens a sound and pushes it back.`,'sd'],
[`Preset`,``,`A saved synth or effect setting. A starting point, to be adapted to the track.`,'sd'],
[`Resonance`,`filter Q`,`A boost around the cutoff frequency. Produces the characteristic "wah" and whistle of filters.`,'sd'],
[`Sampler`,``,`An instrument that plays recordings, transposed, sliced and filtered. In Live: Simpler, Sampler.`,'sd'],
[`Sine`,``,`A pure waveform: a single frequency, no harmonics. Ideal for a sub, inaudible on small speakers if it's low.`,'sd'],
[`Subtractive synthesis`,``,`Start from a rich waveform and remove frequencies with a filter. The principle behind analog synths.`,'sd'],
[`Unison`,``,`Several copies of the same voice, detuned and spread across the stereo field. Wide, dense sound (supersaw).`,'sd'],
[`Wavetable`,``,`Synthesis that sweeps through a series of waveforms: the timbre evolves over the course of the note.`,'sd'],

[`Bands`,``,`In a vocoder, the number of frequency slices being analyzed. Few: robotic. Many: intelligible.`,'voix'],
[`Pitch correction`,`Auto-Tune`,`Snaps the vocal's pitch onto the scale. The voice stays the source; set aggressively, it gives the stair-step effect.`,'voix'],
[`De-esser`,``,`A compressor aimed at sibilance (5–9 kHz): it only tames "s" and "sh" sounds when they get too loud.`,'voix'],
[`Formant`,``,`A fixed resonance peak shaped by the mouth. Formants are what tell vowels apart from one another.`,'voix'],
[`Harmonizer`,``,`Creates transposed copies of a voice to build harmonies.`,'voix'],
[`Modulator`,``,`In a vocoder, the signal that imposes its articulation: the voice.`,'voix'],
[`Plosive`,`pop`,`A burst of low-end air produced by "p" and "b" sounds into the mic. Treated with a pop filter and a high-pass.`,'voix'],
[`Carrier`,``,`In a vocoder, the sound being sculpted: a synth. It decides the notes and the timbre.`,'voix'],
[`Sibilance`,``,`Excess energy in "s", "sh", "f" sounds, between 5 and 9 kHz. Harsh after compression and a treble boost.`,'voix'],
[`Talk box`,``,`A synth's sound is piped into the mouth through a tube; the mouth filters it and a mic captures the result.`,'voix'],
[`Unvoiced`,``,`Consonants without pitch (s, t, ch). On a vocoder, a setting that adds noise to restore them.`,'voix'],
[`Vocoder`,``,`An effect that applies a voice's articulation (modulator) to a synth (carrier). The synth "speaks" the words.`,'voix'],

[`Spectrum analyzer`,``,`A real-time display of each frequency's level. Essential for the low end, which is hard to hear correctly.`,'mix'],
[`Balance`,`gain staging levels`,`The relative volume setting of all tracks. Mixing's single most powerful tool.`,'mix'],
[`Sweep`,``,`Technique: a narrow, heavily boosted bell moved across the spectrum to locate an offending frequency, then inverted.`,'mix'],
[`Mud`,``,`A buildup in the low-mids (250–500 Hz) that makes a mix sound blurry and heavy.`,'mix'],
[`Bus`,`group`,`A track that receives several tracks to process them together: drum bus, vocal bus.`,'mix'],
[`Bell`,`peak`,`An EQ filter shape that boosts or cuts a specific zone. Controls: frequency, gain, Q.`,'mix'],
[`dBFS`,`decibels full scale`,`The digital level scale. 0 dBFS is the absolute ceiling; anything above it clips.`,'mix'],
[`EQ`,`equalizer`,`A tool that boosts or cuts frequency zones. Used first to make room, only then to add polish.`,'mix'],
[`Subtractive EQ`,``,`An approach based on cutting what's getting in the way rather than boosting what seems to be missing.`,'mix'],
[`Gain staging`,``,`Keeping a healthy level and headroom at every stage of the chain, from the track to the master.`,'mix'],
[`Headroom`,``,`The gap between a signal's peaks and 0 dBFS. Aim for about 6 dB on the master before mastering.`,'mix'],
[`Insert`,``,`An effect placed directly on a track: the whole signal runs through it. The opposite of a send.`,'mix'],
[`Masking`,``,`When two sounds occupy the same frequency zone, the louder one hides the other.`,'mix'],
[`Notch`,``,`A very narrow, deep cut, used to remove a precise resonance or hum.`,'mix'],
[`Pan`,`panning`,`A track's left-right placement. Low end at the center, decorative elements on the sides.`,'mix'],
[`High-pass`,`HPF, low-cut`,`A filter that removes everything below its cutoff frequency. Mixing's number one cleanup tool.`,'mix'],
[`Shelf`,``,`An EQ filter shape that boosts or cuts everything beyond a frequency.`,'mix'],
[`Q`,`quality factor, width`,`The width of an EQ band. High Q = narrow. Rule of thumb: narrow cuts, wide boosts.`,'mix'],
[`Solo`,``,`Listening to a track alone. Useful for spotting a flaw, misleading for setting an EQ.`,'mix'],

[`Attack`,``,`A compressor's reaction time. Slow: the transient gets through, the sound keeps its punch. Fast: it's squashed.`,'comp'],
[`Compressor`,``,`An automatic fader that turns the volume down when the signal crosses a threshold. Narrows the gap between loud and quiet.`,'comp'],
[`Parallel compression`,`New York compression`,`Blending an untouched signal with a heavily compressed copy: density without losing the hits.`,'comp'],
[`Dynamic range`,``,`The gap between a signal's quietest and loudest passages.`,'comp'],
[`Glue`,``,`Light compression on a bus or the whole mix (1–3 dB) that ties elements together.`,'comp'],
[`Knee`,``,`How gradually compression kicks in around the threshold. Soft: transparent. Hard: abrupt.`,'comp'],
[`Make-up gain`,``,`Volume added after compression to restore the original level. Essential for a fair comparison.`,'comp'],
[`Pumping`,``,`An audible breathing of the volume. A flaw when it's unintentional, a stylistic effect when it's locked to the kick.`,'comp'],
[`Ratio`,``,`The strength of the compression. At 4:1, an 8 dB overshoot above the threshold comes out as 2 dB.`,'comp'],
[`Gain reduction`,`GR`,`The number of dB the compressor is removing at a given moment. The meter worth watching.`,'comp'],
[`Release`,``,`The time a compressor takes to return to rest. Set so it breathes with the tempo.`,'comp'],
[`Sidechain`,``,`A compressor processes one signal but listens to another. Classic case: a pad ducking on every kick.`,'comp'],
[`Threshold`,``,`The level above which a compressor starts acting.`,'comp'],
[`Transient`,``,`The very start of a sound, its hit. It's what gives punch, and what fast compression crushes.`,'comp'],
[`VCA / FET / opto`,`compressor types`,`Technologies with different characters: VCA precise (buses), FET fast and aggressive, opto slow and gentle.`,'comp'],

[`Decay`,`RT60, reverb time`,`How long a reverb's tail takes to fade out. Short: glue. Long: atmosphere, but fills the mix fast.`,'space'],
[`Delay`,`echo`,`Repeats of the signal, usually synced to the tempo. Gives space without a reverb's haze.`,'space'],
[`Feedback`,``,`The portion of a delay's output fed back into its input. Sets how many repeats you get.`,'space'],
[`Hall`,``,`A large-room reverb, 2 to 5 s. Majestic, but takes up a lot of space.`,'space'],
[`Plate`,``,`A dense, bright reverb, 1 to 2 s. The classic choice for vocals and snare.`,'space'],
[`Pre-delay`,``,`The silence between the dry sound and the start of the reverb. 20–40 ms keeps the source up front.`,'space'],
[`Reverb`,``,`A simulation of a space's reflections. Places a sound in depth: dry = close, wet = far.`,'space'],
[`Room`,``,`A small-room reverb, under a second. Adds body without being heard as an effect.`,'space'],
[`Send / return`,`aux, effect bus`,`Sending a portion of several tracks to a shared effect sitting on a return track.`,'space'],
[`Spring`,``,`A metallic, bouncy, vintage-flavored reverb: guitars, dub.`,'space'],
[`Wet / dry`,``,`The balance between the processed signal (wet) and the untouched one (dry). On a return, the effect sits at 100% wet.`,'space'],

[`Clipping`,``,`Exceeding 0 dBFS: the waveform gets truncated, producing harsh distortion.`,'master'],
[`Dither`,``,`Very low-level noise added when reducing bit depth (down to 16-bit) to mask rounding errors.`,'master'],
[`Limiter`,``,`A compressor with an infinite ratio: nothing passes its ceiling. Always last in the chain.`,'master'],
[`LUFS`,`loudness units`,`A measure of perceived loudness, averaged over time. The reference unit used by streaming platforms.`,'master'],
[`Mastering`,``,`The final stage: final level, tonal balance, and consistent playback across every system.`,'master'],
[`Mono compatibility`,``,`What's left of a mix when the left and right channels are summed. Reveals phase cancellations.`,'master'],
[`Loudness normalization`,`normalization`,`Streaming platforms bring every track to a target loudness: a master that's too loud simply gets turned down.`,'master'],
[`Phase`,`polarity`,`A waveform's position within its cycle. Two identical signals in opposite phase cancel out.`,'master'],
[`Reference track`,``,`A commercial track in the same style, compared at matched loudness to judge your own balance.`,'master'],
[`True peak`,`dBTP`,`The actual peak level after conversion, which can exceed what a standard peak meter shows. Common ceiling: −1 dBTP.`,'master'],
[`24-bit WAV`,`export format`,`The lossless format to use when exporting a mix ahead of mastering.`,'master'],

[`Extended chords`,`m7, maj7, 9th`,`Four- or five-note chords: add the seventh, then the ninth, to the triad. Soul, jazz, disco color.`,'style:nudisco'],
[`Parallel chords`,``,`The same chord shape moved as-is to different roots, ignoring the scale. House's harmonic signature.`,'style:house'],
[`Ad-lib`,``,`A short interjection or phrase added around the lead vocal, often panned and processed differently.`,'style:hiphop'],
[`Amen break`,``,`A six-second drum break from The Winstons' "Amen, Brother" (1969). Chopped and sped up, it underpins jungle and drum & bass.`,'style:dnb'],
[`Arpeggio`,`arpeggiator`,`A chord's notes played one after another in a fast loop, often via an arpeggiator. Central to the synthwave color.`,'style:synthwave'],
[`Loop`,``,`A short excerpt, one to four bars, played on repeat. In French Touch and boom bap, it constitutes the whole track.`,'style:french'],
[`Breakbeat`,`drum break`,`A passage where the drums play alone on a funk or soul record. Sampled, it supplies hip-hop and drum & bass with their rhythm and grain.`,'style:boombap'],
[`Chicken scratch`,``,`A rhythmic guitar style in 16th notes, strings half-muted, on two or three strings. Percussive more than harmonic.`,'style:funk'],
[`Chop`,`slice`,`Cutting a sample into slices to replay them in a different order, on pads or a keyboard.`,'style:boombap'],
[`Clavinet`,``,`An electric keyboard with struck strings, dry and percussive. Iconic in 70s funk.`,'style:funk'],
[`Cowbell`,``,`A metallic percussion sound. The TR-808's version, with its very recognizable synthetic timbre, is an electro-funk signature.`,'style:electrofunk'],
[`Vinyl crackle`,`dust`,`The surface noise of a record, added on purpose to give a vintage, warm grain.`,'style:boombap'],
[`Deep house`,``,`House's smoother side: moderate tempo, jazz chords, round basses, a more introspective mood.`,'style:house'],
[`Sample clearance`,``,`Permission that must be obtained from the rights holders before releasing a track built on an extract of another recording.`,'style:french'],
[`Ear candy`,``,`Small one-off sonic events (a reverse, an echo on a word, a sound heard once) that keep attention across repeat listens.`,'style:pop'],
[`Vocal double`,`double tracking`,`A second take of the same vocal part, layered on the first. Thickens the voice; panned, it widens it.`,'style:pop'],
[`Filter house`,``,`Another name for French Touch: a disco or funk loop with a continuously automated filter.`,'style:french'],
[`Glide`,`portamento`,`A continuous slide from one note to the next instead of a jump. Essential to hip-hop 808s and synthwave leads.`,'style:hiphop'],
[`Half-time`,``,`A feel where the snare falls on beat 3 instead of 2 and 4: the track feels twice as slow as its actual tempo.`,'style:hiphop'],
[`LinnDrum`,`LM-2`,`A 1982 drum machine built from real drum samples. Its snare and claps shaped 80s pop and funk.`,'style:electrofunk'],
[`Lo-fi`,`low fidelity`,`An aesthetic that embraces sonic flaws: hiss, reduced bandwidth, low resolution, pitch wobble.`,'style:boombap'],
[`MPC`,`Akai MPC`,`A pad-based sampler-sequencer. Its particular swing and quantization defined boom bap's groove.`,'style:boombap'],
