{id:'pop',name:'Pop',
 lede:'Un seul critère : la chanson. Chaque décision de production sert la voix et le refrain. C\'est le style le plus contraint par la forme, et le plus libre sur les sons.',
 idc:[['Tempo','90–128 BPM, très variable'],['Feeling','Droit, précis, net'],['Harmonie','Boucle de 4 accords : I–V–vi–IV et ses permutations'],['Forme','Couplet / pré-refrain / refrain / pont, 2 min 30 à 3 min 30']],
 tips:[
  ['La forme','Intro très courte (moins de 10 secondes), <b>premier refrain avant 45 secondes</b>. Le pré-refrain fait monter la tension, le refrain la libère. Après le second refrain, un pont apporte un contraste, puis un dernier refrain augmenté.'],
  ['Topline et voix','La mélodie vocale est le morceau. Mélodie de refrain plus haute et plus tenue que celle du couplet. Production vocale soignée : doublages, harmonies, ad-libs, justesse corrigée, compression serrée, de-esser.'],
  ['Le contraste couplet / refrain','<b>Le réglage qui fait un tube ou pas.</b> Couplet : étroit, dépouillé, grave. Refrain : large (doublages panoramisés), dense, plus aigu, avec la basse à l\'octave et les cymbales. Le refrain doit « s\'ouvrir ».'],
  ['Batterie et basse','Simples, propres, au service. Kick et caisse claire nets, basse sur les fondamentales. Un bon pattern pop ne se remarque pas.'],
  ['Détails d\'oreille','Un petit événement toutes les 4 à 8 mesures : un reverse, un écho sur un mot, un son qui n\'apparaît qu\'une fois. C\'est ce qui tient l\'attention à la vingtième écoute.'],
  ['Arrangement','Fais de la place à la voix : <b>rien ne doit la concurrencer entre 1 et 4 kHz</b> quand elle chante. Instruments mélodiques dans les trous du chant, pas dessus.'],
  ['Mix et master','Voix devant, claire, stable du premier au dernier mot (automation de volume). Grave contrôlé, aigus brillants sans dureté. Master fort mais propre : pas de distorsion audible.']],
 traps:`<b>Intro trop longue</b> : l'auditeur est parti avant le chant. <b>Refrain qui ne décolle pas</b> : si couplet et refrain ont la même densité et la même largeur, il n'y a pas de refrain. <b>L'instrumental qui se bat avec la voix</b> : un lead de synthé pendant le chant, c'est un de trop. <b>Trop d'idées</b> : une chanson pop, c'est un hook, pas cinq.`,
 live:`Travaille la structure en vue Arrangement avec des locators dès le début. Groupe « voix » avec de-esser, deux compresseurs légers en série, sends vers une plate courte et un delay filtré. Doublages de refrain panoramisés à gauche et à droite. EQ Eight en sidechain visuel pour repérer ce qui masque la voix.`,
 keys:`modern pop, 104 BPM, catchy topline, four-chord progression, clean punchy drums, wide chorus, vocal doubles and harmonies, radio-ready`,
 refs:`Productions de Max Martin, Jack Antonoff, Finneas, Stuart Price ; Dua Lipa et The Weeknd pour la pop à couleur disco et synthwave`,
 links:['compo','arr','voix'],
 cmp:['90–128','Droit','Simple, net','2 et 4','Fondamentales','Contraste couplet / refrain','La voix, toujours'],

  drums:{k:[2,0,0,0,0,0,0,0,2,0,1,0,0,0,0,0],s:at(16,[4,12]),ch:r4([2,0,1,0]),oh:z16()},pad:{cut:3000,vol:.06},
  bass:[[0,2,4,6,8,10,12,14].map(x=>[x,0,1.6])],bassSound:'pluck',sc:.3,lead:{notes:{2:70,4:74,6:72,10:70,20:69,22:72,26:70,34:70,36:74,38:77,42:74,52:75,54:74,58:70}}}},

{id:'house',name:'House',
 lede:'La matrice de toute la musique de club : un kick sur chaque temps, un charley ouvert entre, et par-dessus des accords de clavier hérités du gospel, de la soul et du jazz.',
 idc:[['Tempo','118–128 BPM'],['Feeling','Charleys légèrement swingués, 54–60 %'],['Harmonie','Accords m7 et m9 déplacés en parallèle, deux à quatre accords'],['Forme','Format club : blocs de 16 et 32 mesures, 6 à 8 minutes']],
 tips:[
  ['Batterie','Kick sur les 4 temps, clap sur 2 et 4, <b>charley ouvert sur chaque contretemps</b>. Des charleys fermés et un shaker en doubles-croches, swingués : c\'est ce léger balancement qui distingue la house d\'une simple pulsation.'],
  ['Basse','Simple et répétitive, sur les contretemps ou en syncope autour du kick. Ronde et chaude en deep house, plus percussive en house classique. Une à trois notes suffisent.'],
  ['Les accords','La signature harmonique : un <b>accord m7 ou m9 joué en stabs syncopés</b>, puis le même accord déplacé tel quel vers d\'autres fondamentales. Sons : orgue, piano, piano électrique, nappes.'],
  ['Voix','Phrases soul ou gospel, souvent découpées en fragments rythmiques qui deviennent un instrument. Un mot répété vaut un refrain.'],
  ['Signature sonore','Chaleur, espace, répétition. Sidechain modéré pour que les accords respirent avec le kick. Réverbe et delay sur les stabs, jamais sur le kick ni la basse.'],
  ['Arrangement','Progression lente et régulière. Un élément entre ou sort toutes les 8 ou 16 mesures. Le break retire le kick et met les accords et la voix à nu, puis le kick revient seul avec la basse.'],
  ['Mix et master','Le couple kick / basse occupe le centre, tout le reste s\'organise autour. Charleys présents mais doux. Garde de la dynamique : un morceau house respire.']],
 traps:`<b>Charleys parfaitement droits</b> : sans swing, le morceau perd son balancement. <b>Trop d'accords</b> : une progression complexe casse l'hypnose ; deux accords bien voicés suffisent. <b>Intro trop courte</b> : un DJ a besoin de 16 à 32 mesures de rythmique seule pour mixer.`,
 live:`Drum Rack avec des sons de type 909. Groove Pool : swing 16 entre 54 et 60 % sur charleys et percussions. Pour les stabs : un accord joué sur une seule touche grâce au device MIDI <b>Chord</b>, ce qui reproduit le déplacement parallèle. Echo en send sur les stabs.`,
 keys:`house, deep house, 123 BPM, four-on-the-floor, 909 drums, offbeat open hi-hat, swung shakers, minor ninth organ stabs, soulful vocal chops`,
 refs:`Frankie Knuckles, Marshall Jefferson, Larry Heard (Mr. Fingers), Masters at Work, Kerri Chandler, Moodymann`,
 links:['groove','bass','arr'],
 cmp:['118–128','Charleys swingués, 54–60 %','Sur les 4 temps','2 et 4 (clap)','Simple, sur les contretemps','Stabs m9 en parallèle, charley ouvert','Couple kick / basse'],

{id:'techno',name:'Techno',
 lede:'Une musique de texture et d\'hypnose. Presque pas d\'harmonie, presque pas de mélodie : un kick, un grondement, quelques sons percussifs, et tout l\'intérêt dans leur évolution lente.',
 idc:[['Tempo','125–140 BPM, et au-delà pour les formes dures'],['Feeling','Droit, mécanique, assumé'],['Harmonie','Minimale : une note, un accord mineur, ou des sons sans hauteur'],['Forme','Phrases de 16 et 32 mesures, 6 à 8 minutes, pensée pour le mix DJ']],
 tips:[
  ['Le kick','L\'élément central, à soigner avant tout le reste : attaque nette, corps court et dur, accordé. Il occupe le mix à lui seul. Beaucoup de morceaux se construisent à partir du kick et de rien d\'autre.'],
  ['Le rumble','La « basse » de la techno : un <b>grondement grave entre les kicks</b>, obtenu en envoyant le kick dans une réverbe, puis en filtrant le résultat en passe-bas et en le faisant pomper par le kick. Il remplit l\'espace sans jouer de notes.'],
  ['Percussions','Charley ouvert sur les contretemps, charleys fermés en doubles-croches avec des accents décalés, claps et percussions métalliques. Des boucles de 3 ou 5 pas qui tournent contre la mesure de 4 créent des décalages hypnotiques.'],
  ['Le synthé','Un seul motif très court, souvent un stab ou une note, passé dans un <b>delay</b> et modulé en permanence : cutoff, résonance, longueur, quantité de réverbe. C\'est l\'automation qui compose le morceau.'],
  ['Signature sonore','Saturation et distorsion comme outils de timbre. Réverbes sombres, delays synchronisés. Beaucoup d\'énergie dans le grave et le bas-médium, peu d\'éléments brillants.'],
  ['Arrangement','Additif et soustractif, par couches, sans couplet ni refrain. Le break retire le kick pendant 8 à 32 mesures pendant que la tension monte, puis il revient. Une seule idée, exploitée jusqu\'au bout.'],
  ['Mix et master','Kick et rumble d\'abord : s\'ils fonctionnent à deux, le morceau est à moitié fait. Grave strictement mono. Niveau de master élevé, mais le kick doit garder son attaque.']],
 traps:`<b>Trop d'éléments mélodiques</b> : dès qu'une mélodie s'installe, ce n'est plus de la techno. <b>Un rumble qui bave sur le kick</b> : il doit s'effacer complètement à chaque frappe. <b>Rien ne bouge</b> : une boucle statique de 8 mesures répétée 40 fois n'est pas hypnotique, elle est ennuyeuse ; la différence, c'est la modulation.`,
 live:`Kick : un Drum Rack avec le kick sur sa propre chaîne. Rumble : send du kick vers un retour avec <b>Hybrid Reverb</b>, puis EQ Eight en passe-bas vers 120 Hz, puis Compressor en sidechain sur le kick, puis Saturator. Pour le synthé : <b>Echo</b> en insert, et des automations longues sur le cutoff. <b>Roar</b> ou Saturator pour le grain.`,
 keys:`techno, 132 BPM, hard driving kick, sub rumble, offbeat open hat, hypnotic, dub chord stab with delay, industrial percussion, minimal, dark warehouse`,
 refs:`Juan Atkins, Derrick May, Kevin Saunderson pour les origines ; Jeff Mills, Robert Hood, Underground Resistance, Surgeon, Ben Klock`,
 links:['groove','sd','space'],
 cmp:['125–140+','Droit','Sur les 4 temps, dur, central','Discret ou absent','Rumble : grondement entre les kicks','Modulation lente, delay, saturation','Kick + rumble'],

  drums:{k:r4([2,0,0,0]),s:at(16,[4,12],1),ch:r4([1,1,0,2]),oh:r4([0,0,2,0])},hardKick:true,stabs:{steps:[3,11],cut:7000,vol:.075,len:.5},echo:true,sweep:true,

{id:'funk',name:'Funk',
 lede:'Tout est rythme. Chaque instrument, y compris la guitare, les claviers et les cuivres, se comporte comme une percussion, et l\'ensemble s\'emboîte comme un mécanisme.',
 idc:[['Tempo','90–115 BPM'],['Feeling','Doubles-croches, swing léger, très joué'],['Harmonie','Souvent un seul accord : 7e de dominante, 9e, ou m7 dorien'],['Forme','Vamp prolongé, avec un pont sur un second accord']],
 tips:[
  ['« The One »','Le principe fondateur : <b>tout le monde appuie le premier temps de la mesure</b>. Entre deux « un », chacun syncope librement. Cet accent commun est ce qui tient l\'édifice.'],
  ['Batterie','Kick syncopé qui évite certains temps, caisse claire sur 2 et 4 entourée de <b>ghost notes</b>, charleys en doubles-croches avec des ouvertures ponctuelles. Le groove vit dans les doubles-croches faibles.'],
  ['Basse','La vedette. Syncopée, percussive, avec des <b>notes étouffées</b> qui ne servent qu\'au rythme, des octaves, et la septième mineure comme note de passage. Slap ou jeu aux doigts.'],
  ['Guitare et claviers','Guitare en doubles-croches étouffées, sur deux ou trois cordes, qui ne joue presque jamais l\'accord entier. Clavinet ou orgue en contre-rythme. Personne ne joue en même temps que les autres.'],
  ['Cuivres','En ponctuations courtes et tranchantes, à l\'unisson ou en harmonie serrée. Ils répondent à la voix, ils ne l\'accompagnent pas.'],
  ['Arrangement','L\'emboîtement : chaque partie occupe des doubles-croches que les autres laissent libres. Si deux instruments jouent le même rythme, l\'un des deux est de trop. Les breaks « batterie seule » sont la matière première du hip-hop.'],
  ['Mix et master','Sec, proche, dynamique. Très peu de réverbe. Basse et batterie devant, guitare fine et panoramisée. Ne compresse pas au point d\'écraser les ghost notes : elles sont le groove.']],
 traps:`<b>Tout le monde joue tout le temps</b> : le funk, c'est de l'espace. <b>Des accords complets à la guitare</b> : ils bouchent le médium ; deux notes suffisent. <b>Une basse sans silences</b> : les notes étouffées et les trous comptent autant que les notes. <b>Trop de réverbe</b> : le style est sec.`,
 live:`Programme la batterie avec trois niveaux de vélocité bien distincts (accent, normal, ghost). Pour la basse, des notes très courtes à faible vélocité simulent les notes étouffées. Auto Filter en enveloppe sur un clavier pour l'effet « wah ». Groove Pool : un groove extrait d'un vrai break plutôt qu'un swing régulier.`,
 keys:`funk, 102 BPM, syncopated slap bass, chicken scratch guitar, clavinet, tight horn stabs, ghost notes, dominant ninth vamp, dry and punchy`,
 refs:`James Brown, Parliament-Funkadelic, Sly & the Family Stone, The Meters, Prince, Zapp & Roger`,
 links:['groove','bass','comp'],
 cmp:['90–115','Léger, très joué','Syncopé, évite des temps','2 et 4 + ghost notes','Vedette : syncopée, notes étouffées','Emboîtement rythmique, « The One »','Basse et batterie, sec'],

{id:'electrofunk',name:'Electro-funk',
 lede:'Le funk du début des années 80, quand les boîtes à rythmes et les synthétiseurs remplacent la section rythmique : groove de funk, sons de machines, voix passées dans une talk-box ou un vocoder.',
 idc:[['Tempo','105–125 BPM'],['Feeling','Doubles-croches swinguées, 54–58 %'],['Harmonie','m7 et accords de 9e, vamps de deux à quatre accords'],['Forme','Chanson, avec de longues plages instrumentales']],
 tips:[
  ['Batterie','Des <b>boîtes à rythmes</b>, et ça doit s\'entendre : kick et cowbell de type 808, caisse claire et claps de type LinnDrum, charleys synthétiques. Claps généreux sur 2 et 4, avec une réverbe courte.'],
  ['Basse','Basse <b>synthé</b> funk, grasse, jouée comme une basse slap : octaves, syncopes, glissés. Dent de scie ou carré, filtre à enveloppe rapide avec de la résonance. C\'est l\'élément le plus en avant après la voix.'],
  ['Claviers','Nappes analogiques chaudes et larges en fond, <b>stabs de cuivres synthétiques</b> en ponctuations syncopées. Des accords riches, plaqués court.'],
  ['Voix','La signature : <b>talk-box ou vocoder</b> pour le lead, avec un phrasé chanté très mélodique, et des ad-libs hachés. Chœurs harmonisés en réponse.'],
  ['Signature sonore','Chorus sur les nappes, réverbes numériques brillantes typées années 80, claps larges. Un son à la fois mécanique par les machines et souple par le swing.'],
  ['Arrangement','Groove installé dès la première mesure, qui ne s\'arrête plus. Les variations passent par les cuivres, les breaks de batterie électronique et les réponses vocales. Intro et outro longues si tu vises le DJ.'],
  ['Mix et master','Basse synthé et kick se partagent le grave : kick court, basse plus haute. Claps et cowbell brillants mais pas agressifs. Voix talk-box au centre, bien en avant, avec peu de réverbe.']],
 traps:`<b>Des sons de batterie acoustiques ou trop modernes</b> : le style repose sur le timbre des machines de l'époque. <b>Pas de swing</b> : sans lui, on obtient de l'électro raide, pas du funk. <b>Un vocoder inintelligible</b> : la voix est le lead, elle doit se comprendre.`,
 live:`Drum Rack avec des kits 808 et LinnDrum mélangés. Basse : Analog ou Drift, filtre passe-bas avec enveloppe courte et résonance, Glide activé pour les glissés. Nappes : Wavetable ou Drift avec <b>Chorus-Ensemble</b>. Vocoder avec Carrier External sur un synthé en dent de scie. Groove Pool à 54–58 %.`,
 keys:`80s electro-funk, 118 BPM, TR-808 kick and cowbell, LinnDrum snare and claps, funky synth bass in octaves, analog brass stabs, Juno pads, talkbox lead, swung sixteenths`,
 refs:`Zapp & Roger, Cameo, The Gap Band, Midnight Star, Afrika Bambaataa ; Dâm-Funk et Chromeo pour les relectures actuelles`,
 links:['groove','voix','sd'],
 cmp:['105–125','Swingué, 54–58 %','808, syncopé','2 et 4, claps LinnDrum','Synthé en octaves, glissés','Boîtes à rythmes, talk-box, cuivres synthé','Basse synthé + voix'],

{id:'synthwave',name:'Synthwave',
 lede:'Une bande-son imaginaire des années 80 : synthétiseurs analogiques, batterie électronique à la réverbe coupée net, basse en croches qui ne s\'arrête jamais, et une nostalgie assumée.',
 idc:[['Tempo','80–120 BPM ; plus lent pour le versant rêveur, plus rapide pour l\'outrun'],['Feeling','Droit, mécanique'],['Harmonie','Mineur, 4 accords : i – VI – III – VII et variantes'],['Forme','Chanson, ou instrumental à thèmes']],
 tips:[
  ['Batterie','Kick rond, et surtout la <b>caisse claire à réverbe « gated »</b> : une grosse réverbe coupée brutalement après un quart de seconde. Charleys simples en croches, et des <b>toms électroniques</b> en descente pour les transitions.'],
  ['Basse','Une basse synthé en <b>croches continues</b> sur la fondamentale, parfois avec un saut d\'octave : c\'est le moteur du style. Dent de scie, filtre assez fermé, enveloppe courte. Elle ne syncope presque jamais.'],
  ['Nappes et arpèges','Nappes larges en dents de scie désaccordées avec chorus, et un <b>arpège en doubles-croches</b> qui égrène les notes de l\'accord. Ces deux couches font l\'essentiel de la couleur.'],
  ['Le lead','Mélodie simple et chantante, tenue, avec du vibrato et du glissé entre les notes. Son de synthé brillant ou de guitare saturée. Réverbe longue et delay en croche pointée.'],
  ['Signature sonore','Chorus partout, réverbes longues et brillantes, un léger flottement de hauteur façon bande magnétique. Le sidechain est un ajout moderne, à doser légèrement.'],
  ['Arrangement','Intro atmosphérique (nappe, arpège filtré), puis la basse et la batterie entrent ensemble. Thème, couplet, thème. Les descentes de toms annoncent chaque changement de section.'],
  ['Mix et master','Large et spacieux, mais garde basse et kick secs et au centre, sinon tout se noie. Nettoie le bas-médium des nappes : avec autant de synthés, c\'est là que la boue s\'installe.']],
 traps:`<b>Noyer le mix dans la réverbe</b> : longue sur le lead et la caisse claire, absente sur la basse et le kick. <b>Des sons trop modernes</b> : les timbres numériques agressifs sortent du cadre. <b>Une basse syncopée</b> : elle doit rester un moteur régulier. <b>Empiler cinq nappes</b> : deux suffisent.`,
 live:`Réverbe gated : sur un retour, <b>Reverb</b> avec un decay long, suivi de <b>Gate</b> dont le sidechain écoute la caisse claire ; règle Hold et Release pour une coupure nette. Nappes : Drift ou Analog à deux oscillateurs désaccordés, puis Chorus-Ensemble. Arpège : device MIDI <b>Arpeggiator</b> en 1/16. Lead : Glide activé, Echo en croche pointée.`,
 keys:`synthwave, outrun, retrowave, 100 BPM, gated reverb snare, driving eighth-note synth bass, analog pads with chorus, sixteenth arpeggio, soaring lead, electronic tom fills`,
 refs:`Kavinsky, College, Carpenter Brut, Perturbator, The Midnight, Timecop1983, FM-84`,
 links:['sd','space','compo'],
 cmp:['80–120','Droit','Rond, sur les temps','2 et 4, réverbe gated','Croches continues, fondamentale','Nappes + arpège + chorus, caisse claire gated','Espace, sans noyer kick et basse'],

{id:'dnb',name:'Drum & bass',
 lede:'Des breakbeats à 174 BPM et une basse qui avance deux fois moins vite. Toute la tension du style vient de ce contraste entre une batterie frénétique et un grave lent et massif.',
 idc:[['Tempo','170–176 BPM'],['Feeling','Droit ; le mouvement vient des ghost notes du break'],['Harmonie','Mineur, nappes lentes, souvent 2 à 4 accords étirés'],['Forme','Intro de 32 à 64 mesures, drop, break, second drop']],
 tips:[
  ['Batterie','Le <b>two-step</b> : kick sur le 1, caisse claire sur le 2, kick juste avant le 3, caisse claire sur le 4. Par-dessus, des ghost notes et des charleys rapides. On superpose souvent un break échantillonné, pour le grain, à des frappes propres, pour l\'impact.'],
  ['La caisse claire','L\'élément le plus travaillé : un corps autour de 200 Hz pour le poids, un claquement dans les aigus, très courte. Elle doit traverser le mix à chaque frappe.'],
  ['Basse','Deux étages bien séparés : un <b>sub en sinus</b>, propre et mono, et une couche médium en mouvement, typiquement une <b>Reese</b> (dents de scie désaccordées) dont le filtre bouge. Notes longues, rythme lent.'],
  ['Atmosphère','Nappes, voix lointaines, pianos réverbérés : les éléments mélodiques avancent à mi-tempo, ce qui donne au style son côté à la fois rapide et planant.'],
  ['Arrangement','Longue introduction atmosphérique sans grave, montée, puis le <b>drop</b> où batterie complète et basse entrent ensemble. Variations de batterie toutes les 8 ou 16 mesures, changement de son de basse au second drop.'],
  ['Mix et master','Sub strictement mono et stable. Coupe le grave de tout le reste, y compris du break échantillonné. La couche médium de la basse ne doit pas masquer la caisse claire. Master fort et dense.']],
 traps:`<b>Une basse trop bavarde</b> : à ce tempo, des notes rapides dans le grave deviennent de la bouillie. <b>De l'unison sur le sub</b> : la Reese, c'est la couche médium ; le sub reste un sinus seul. <b>Une caisse claire sans corps</b> : elle disparaît derrière la basse. <b>Une batterie trop propre</b> : sans le grain d'un vrai break, le style sonne stérile.`,
 live:`Break : clip audio en mode Warp Beats, ou découpé dans Simpler en mode Slice. Superpose kick et caisse claire dans un Drum Rack. Basse : Instrument Rack à deux chaînes, Operator en sinus pour le sub, Wavetable à deux oscillateurs désaccordés pour la Reese avec Auto Filter modulé, EQ Eight passe-haut à 120 Hz sur cette chaîne. Utility en mono sur le sub.`,
 keys:`drum and bass, 174 BPM, two-step breakbeat, chopped amen break, reese bass, deep sine sub, atmospheric pads, liquid, half-time melody`,
 refs:`Goldie, LTJ Bukem, Roni Size, Andy C, Calibre, Noisia`,
 links:['groove','bass','mix'],

  drums:{k:[2,0,0,0,0,0,0,0,0,0,2,0,0,0,0,0],s:[0,0,0,0,2,0,0,1,0,1,0,0,2,0,0,1],ch:r4([2,0,1,1]),oh:z16()},pad:{cut:1800,vol:.05},
  bass:[[[0,0,8],[10,0,5]],[[0,0,6],[8,0,3],[12,0,3.5]]],bassSound:'reese',sc:0}}
];
const CMPH=['Tempo (BPM)','Swing','Kick','Backbeat','Basse','Signature','Priorité du mix'];
let styleSel='cmp';
function renderStyles(){return `<div class="section active"><h2>Conseils par style</h2>
  <p class="lede">${STYLES.length} styles, leurs codes et leurs pièges. Chaque fiche contient une boucle de démonstration qui applique les règles décrites.</p>
  <div class="chips" id="schips" style="padding-top:0"></div><div id="sbody" style="margin-top:12px"></div></div>`;}
function initStyles(){
  const chips=document.getElementById('schips'),body=document.getElementById('sbody');
  const draw=()=>{stopLoop();quizActive=false;
    chips.innerHTML=[['cmp','Comparer'],...STYLES.map(x=>[x.id,x.name])].map(([id,l])=>`<button class="chip${styleSel===id?' on':''}" data-s="${id}">${l}</button>`).join('');
    chips.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{styleSel=c.dataset.s;draw();});
    if(styleSel==='cmp'){body.innerHTML=block('','les styles côte à côte',`<div class="scroll"><table class="cmp"><thead><tr><th>Style</th>${CMPH.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${STYLES.map(x=>`<tr><th><button data-s="${x.id}">${x.name}</button></th>${x.cmp.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="note">Tempos et pourcentages de swing : repères usuels, pas des frontières. Beaucoup de morceaux marquants se situent précisément à cheval entre deux colonnes.</p>`)+
      block('','comment lire ces fiches',`<p>Un style, c'est un petit nombre de <b>contraintes</b> acceptées. Trois suffisent en général à le rendre reconnaissable : un tempo, une façon de placer la batterie, et une signature sonore. Au-delà, tout est libre. Commence par respecter ces trois-là à la lettre, puis écarte-toi d'une seule à la fois.</p>`);
      body.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{styleSel=c.dataset.s;draw();window.scrollTo(0,0);});return;}
    const x=STYLES.find(k=>k.id===styleSel);
    body.innerHTML=`<p class="lede" style="margin-bottom:16px">${x.lede}</p>
      ${block('','carte d\'identité',`<div class="idc">${x.idc.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div>`)}
      ${block('ex','à l\'écoute',`<p>Une boucle construite avec les règles ci-dessous : batterie, basse, harmonie et traitement typiques du style. Synthétisée, donc schématique : elle illustre les placements et les gestes, pas le grain des vrais instruments.</p><div id="demo-style" style="margin-top:14px"></div>`)}
      ${block('','les codes',concepts(x.tips))}
      ${block('err','pièges',`<p>${x.traps}</p>`)}
      ${block('todo','dans Ableton Live',`<p>${x.live}</p>`)}
      ${block('','pour aller plus loin',`<dl><div><dt>À écouter</dt><dd>${x.refs}</dd></div><div><dt>Mots-clés</dt><dd>Pour chercher des samples, des presets, ou décrire le style à un générateur : <span class="mono">${x.keys}</span></dd></div>
        <div><dt>Thèmes liés</dt><dd><div class="xl">${x.links.map(id=>`<button class="chip" data-go="${id}">${topicTitle(id)}</button>`).join('')}</div></dd></div></dl>`)}
      <div class="card"><h3>quiz</h3><div id="quiz"></div></div>`;
    body.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
    stylePlayer(document.getElementById('demo-style'),x);initQuiz('style:'+x.id);};
  draw();
}
function stylePlayer(root,x,anon){
  const c=x.cfg,V=[0,.35,1];let N=null;
  root.innerHTML=anon?`<div class="row"><button class="btn primary" id="play">▶ Écouter la boucle mystère</button></div>`
    :`<div class="row"><button class="btn primary" id="play">▶ Boucle ${x.name}</button><span class="pill">${c.bpm} BPM</span><span class="pill">swing ${c.sw} %</span></div>`;
  const bassNote=(t,m,len,dest)=>{
    if(c.bassSound==='reese'){const f=ctx.createBiquadFilter(),a=ctx.createGain();f.type='lowpass';f.Q.value=3;f.frequency.setValueAtTime(350,t);f.frequency.linearRampToValueAtTime(900,t+len*.5);f.frequency.linearRampToValueAtTime(350,t+len);
      a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(.2,t+.01);a.gain.setValueAtTime(.2,t+len);a.gain.linearRampToValueAtTime(0,t+len+.04);f.connect(a).connect(dest);
      [-16,16].forEach(dt=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=mtof(m+12);o.detune.value=dt;o.connect(f);o.start(t);o.stop(t+len+.06);});tone(t,mtof(m),len,{type:'sine',vol:.45,cutoff:2000,a:.006,r:.04,dest});return;}
    if(c.bassSound==='rumble'){tone(t,mtof(m),len,{type:'sine',vol:.3,cutoff:2000,a:.01,r:.05,dest});tone(t,mtof(m),len,{vol:.1,cutoff:140,a:.01,r:.05,dest});return;}
    if(c.bassSound==='slap'){tone(t,mtof(m),len,{type:'sine',vol:.38,cutoff:2000,a:.003,r:.03,dest});tone(t,mtof(m+12),len,{vol:.17,cutoff:1700,q:3,a:.003,r:.03,dest});return;}
    if(c.bassSound==='round'){tone(t,mtof(m),len,{type:'sine',vol:.5,cutoff:2000,a:.006,r:.05,dest});tone(t,mtof(m),len,{type:'triangle',vol:.14,cutoff:280,a:.006,r:.05,dest});}
    else{tone(t,mtof(m),len,{type:'sine',vol:.4,cutoff:2000,a:.004,r:.03,dest});tone(t,mtof(m+12),len,{vol:.17,cutoff:750,q:2.5,a:.004,r:.03,dest});}};
  const sub808=(t,m,len,glideTo)=>{const o=ctx.createOscillator(),ws=ctx.createWaveShaper(),g=ctx.createGain(),f=mtof(m);o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f,t+.035);
    if(glideTo!==undefined){o.frequency.setValueAtTime(f,t+len*.55);o.frequency.exponentialRampToValueAtTime(mtof(glideTo),t+len*.8);}
    ws.curve=N.sat;g.gain.setValueAtTime(.62,t);g.gain.setValueAtTime(.62,t+len*.6);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(ws).connect(g).connect(master);o.start(t);o.stop(t+len+.05);};
  root.querySelector('#play').onclick=e=>toggleLoop(e.currentTarget,c.bpm,c.len,(s,t0,d)=>{
    const st=s%16,bar=(s>>4)%c.roots.length,g=c.drums,i=s%g.k.length,t=t0+(s%2?(c.sw-50)/50*d:0)+.005;
    if(g.k[i]){kick(t,master,(c.trap?.6:.8)*V[g.k[i]]);if(c.sc){N.duck.gain.cancelScheduledValues(t);N.duck.gain.setValueAtTime(1-c.sc,t);N.duck.gain.linearRampToValueAtTime(1,t+d*2.6);}
      if(c.trap){const pat={0:[31,5.5],7:[31,2.5],10:[31,5],16:[27,5.5],22:[27,4],27:[29,4.5,41]}[s%32];if(pat)sub808(t,pat[0],d*pat[1],pat[2]);}}
    if(g.s[i]){const tt=t+(c.lazy?.012:0),sv=V[g.s[i]];noise(tt,master,.5*sv,'bandpass',c.dust?1400:1750,sv<1?.08:.17);
      if(sv===1){if(!c.dust)noise(tt+.011,master,.28,'bandpass',1500,.1);tone(tt,185,.05,{type:'triangle',vol:.2,cutoff:1200,a:.002,r:.06});
        if(c.gated){const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),a=ctx.createGain();n.buffer=noiseBuf;f.type='bandpass';f.frequency.value=1300;f.Q.value=.5;
          a.gain.setValueAtTime(.3,tt+.02);a.gain.setValueAtTime(.26,tt+.2);a.gain.linearRampToValueAtTime(0,tt+.225);n.connect(f).connect(a).connect(master);n.start(tt+.02);n.stop(tt+.26);}}}
    if(c.hardKick&&g.k[i])noise(t,master,.22,'highpass',3000,.01);
    if(c.cow&&c.cow.includes(st))[540,800].forEach(f=>tone(t,f,.06,{type:'square',vol:.035,cutoff:2600,a:.002,r:.16}));
    if(g.ch[i])noise(t,master,(c.dust?.1:.15)*V[g.ch[i]],'highpass',c.dust?5500:7500,.04);
    if(g.oh[i])noise(t,master,.12*V[g.oh[i]],'highpass',6500,.26);
    if(c.trap){if(s%32===14)[1,2].forEach(k=>noise(t+d*k/3,master,.07+.03*k,'highpass',7500,.03));if(s%32===29)[.5,1,1.5].forEach((k,n)=>noise(t+d*k,master,.06+.03*n,'highpass',7500,.03));
      const mel={0:74,6:75,12:70,16:74,22:72,28:67}[s%32];if(mel!==undefined){tone(t,mtof(mel),d*3,{type:'sine',vol:.13,cutoff:5000,a:.003,r:.5,dest:N.mus});tone(t,mtof(mel+12),d*1.5,{type:'triangle',vol:.04,cutoff:6000,a:.003,r:.4,dest:N.mus});}}
    if(c.chords){const ch=c.chords[bar];
      if(c.pad&&st===0)ch.forEach(m=>tone(t0,mtof(m),d*15.5,{vol:c.pad.vol,cutoff:c.pad.cut,q:.7,a:.04,r:.12,dest:N.mus}));
      if(c.stabs&&c.stabs.steps.includes(st))(c.echo?[[0,1],[3,.5],[6,.25],[9,.12]]:[[0,1]]).forEach(([off,k])=>ch.forEach(m=>tone(t+off*d,mtof(m),d*c.stabs.len,{type:c.stabs.type||'sawtooth',vol:c.stabs.vol*k,cutoff:c.stabs.cut,a:.004,r:.08,dest:N.mus})));}
    if(c.bass)c.bass[bar%c.bass.length].forEach(n=>{if(n[0]===st)bassNote(t,c.roots[bar]+n[1],Math.max(.05,n[2]*d-.02),N.mus);});
    if(c.arp&&s%2===0){const ch=c.chords[bar],m=ch[(s/2)%ch.length]+12;tone(t,mtof(m),d*.8,{type:'square',vol:.035,cutoff:3500,a:.003,r:.1,dest:N.mus});}
    if(c.lead){const tl=c.lead.notes[s];if(tl!==undefined)tone(t,mtof(tl),d*(c.lead.len||1.7),{type:c.lead.type||'triangle',vol:c.lead.vol||.13,cutoff:c.lead.cut||4000,a:.006,r:.18,dest:c.lead.bus?N.mus:master});}
    if(c.dust&&Math.random()<.35)noise(t+Math.random()*d,master,.02+Math.random()*.03,'highpass',3000,.004);
    if(c.sweep){const ph=s/c.len,tri=ph<.5?ph*2:2-ph*2;N.flt.frequency.setTargetAtTime(260*Math.pow(60,tri),t,.04);}
  },()=>{N={mus:ctx.createGain(),flt:ctx.createBiquadFilter(),duck:ctx.createGain()};N.flt.type='lowpass';N.flt.frequency.value=c.sweep?260:19000;N.flt.Q.value=c.sweep?3.5:.7;
    N.mus.connect(N.flt).connect(N.duck).connect(master);const k=new Float32Array(1024);for(let j=0;j<1024;j++){const v=j/511.5-1;k[j]=Math.tanh(3*v)/Math.tanh(3);}N.sat=k;},
  ()=>{const n=N;N=null;if(n)setTimeout(()=>[n.mus,n.flt,n.duck].forEach(q=>{try{q.disconnect();}catch(e){}}),700);});
}

/* ============ époques ============ */
const ERAS=[
{id:'70s',name:'Années 70',tag:'La bande et la pièce',
 lede:`On enregistre des musiciens qui jouent ensemble, sur une bande magnétique au nombre de pistes compté. Chaque décision est définitive : c'est une contrainte, et c'est la raison pour laquelle ces disques sonnent comme des performances.`,
 idc:[['Support','Bande magnétique, 16 puis 24 pistes'],['Outils rois','Console analogique, micros, compresseurs matériels, réverbes à plaque et chambres d\'écho'],['Contrainte','Peu de pistes, pas d\'annulation, montage au rasoir'],['Le son','Chaud, mat, sec, dynamique']],
 steps:[['Écrire et répéter avant d\'entrer en studio.','Le temps de studio coûte cher : l\'arrangement est fixé en amont, sur partition ou en répétition.'],
  ['Enregistrer la section rythmique ensemble.','Batterie, basse, guitare, claviers jouent en même temps, souvent dans la même pièce. Le son de chaque micro contient un peu des autres instruments : cette « repisse » soude l\'ensemble.'],
  ['Ajouter par re-recording.','Voix, chœurs, cordes, cuivres, solos sont empilés ensuite, piste par piste.'],
  ['Décider à la prise.','EQ et compression sont appliqués à l\'enregistrement. Quand les pistes manquent, on en fusionne plusieurs sur une seule : impossible de revenir en arrière.'],
  ['Mixer à la main.','Plusieurs personnes sur la console, chacune responsable de quelques faders, pour exécuter le mix en temps réel. L\'automation n\'apparaît qu\'à la fin de la décennie.'],
  ['Masteriser pour le vinyle.','Grave centré, sifflantes contrôlées, durée par face limitée : le support impose ses règles au mix.']],
 codes:[['La batterie « morte »','Peaux étouffées, pièce très amortie, micros proches. Une caisse claire courte et mate, un kick feutré, presque aucune réverbe sur la rythmique.'],
  ['Un tempo qui respire','Le clic n\'est pas systématique. Le tempo s\'élargit dans les refrains, se resserre dans les couplets. Ce n\'est pas un défaut, c\'est une interprétation.'],
  ['La saturation de bande','Enregistrer fort sur bande compresse en douceur et arrondit les aigus. C\'est la « chaleur » : moins d\'extrême aigu, des transitoires adoucis, un bas-médium dense.'],
  ['Des espaces physiques','Réverbes à plaque, chambres d\'écho en béton, écho à bande. Des effets peu nombreux, identifiables, partagés par plusieurs instruments.'],
  ['De vrais orchestres','Cordes, cuivres, chœurs enregistrés en groupe. Les premiers synthétiseurs (monophoniques) servent de solistes ou de basses, pas de nappes.']],
 today:`Garde des vélocités et un placement vivants : quantification partielle, ou groove extrait d'un vrai batteur. Kit acoustique sec, <b>Reverb</b> en mode plate sur un retour pour la voix et les cordes seulement. <b>Saturator</b> doux sur les bus, puis <b>EQ Eight</b> qui adoucit au-delà de 10–12 kHz et retire sous 40 Hz. Un léger flottement de hauteur avec la modulation d'<b>Echo</b>. Limite-toi volontairement à 16 ou 24 pistes : la contrainte fait partie du son.`,
 traps:`<b>Trop de sub et trop de brillance</b> : ces disques vivent entre 60 Hz et 10 kHz. <b>Des réverbes numériques longues</b> : hors époque. <b>Tout caler sur la grille</b> : la première chose qu'on entend, c'est que personne ne joue.`,
 refs:`Stevie Wonder (Innervisions), Steely Dan (Aja), Fleetwood Mac (Rumours), Pink Floyd (The Dark Side of the Moon), Chic, Marvin Gaye (What's Going On). À la charnière : Kraftwerk, et « I Feel Love » de Donna Summer et Giorgio Moroder (1977), entièrement séquencé.`,
 cmp:['Bande 16–24 pistes','La console et la pièce','Joué, tempo libre','Rond, contenu','Plaques, chambres, sec','Dynamique','Le nombre de pistes'],links:['style:disco','style:funk','groove']},
{id:'80s',name:'Années 80',tag:'Les machines et le MIDI',
 lede:`La boîte à rythmes remplace le batteur, le séquenceur joue à la place des mains, et le MIDI relie toutes les machines. Le son devient plus grand que nature : précis, brillant, large, spectaculaire.`,
 idc:[['Support','Bande 24 pistes synchronisée, puis premiers multipistes numériques'],['Outils rois','Boîtes à rythmes, synthés numériques et polyphoniques, premiers samplers, réverbes numériques, grandes consoles automatisées'],['Contrainte','Machines hors de prix, mémoire d\'échantillonnage de quelques secondes'],['Le son','Grand, brillant, large, précis']],
 steps:[['Programmer la rythmique.','Boîte à rythmes ou séquenceur, quantifiée par construction. C\'est la première fois qu\'un rythme parfaitement régulier est la norme.'],
  ['Empiler les synthés par MIDI.','Un clavier en pilote plusieurs : un son numérique pour l\'attaque, un analogique pour le corps. Le « layering » naît ici.'],
  ['Coucher sur bande synchronisée.','Les machines tournent en synchro avec le magnétophone : on peut refaire une partie de séquenceur sans toucher au reste.'],
  ['Ajouter l\'humain.','Voix, guitares, saxophone, parfois de vrais toms ou cymbales par-dessus la boîte à rythmes.'],
  ['Mixer sur grande console.','Gate et compresseur sur chaque tranche, compresseur de bus sur le mix, automation des faders, et des réverbes numériques sur presque tout.'],
  ['Masteriser pour deux supports.','Vinyle et CD (à partir de 1982). Le CD autorise plus de grave et d\'aigu, et pousse à la brillance.']],
 codes:[['La caisse claire gated','Une énorme réverbe coupée net par un noise gate. Née d\'un accident de studio au tout début de la décennie, devenue le son de batterie de dix ans de pop.'],
  ['Le chorus partout','Sur les nappes, les guitares claires, les basses fretless. Il élargit et fait scintiller.'],
  ['Les timbres numériques','Pianos électriques et cloches en synthèse FM, cristallins et percussifs, à côté des nappes analogiques chaudes. Le contraste entre les deux fait l\'époque.'],
  ['L\'échantillon comme événement','Coups d\'orchestre, voix découpées, bruits : le sampler est cher et sa mémoire minuscule, donc on l\'utilise pour des effets courts et marquants.'],
  ['Le swing programmé','Parce que tout est quantifié, les concepteurs de boîtes à rythmes ajoutent un réglage de « shuffle ». C\'est l\'acte de naissance du swing en pourcentage.']],
 today:`Drum Rack avec des kits 808, 909 et LinnDrum. Caisse claire : <b>Reverb</b> long sur un retour, suivi de <b>Gate</b> en sidechain sur la caisse claire. <b>Operator</b> pour les pianos électriques et cloches FM, <b>Drift</b> ou <b>Analog</b> pour les nappes, <b>Chorus-Ensemble</b> sur presque tout. <b>Hybrid Reverb</b> avec un algorithme de hall brillant. <b>Glue Compressor</b> sur le master pour la colle de console. Quantification à 100 %, et un peu de swing global.`,
 traps:`<b>Noyer le mix</b> : les réverbes sont longues mais la basse et le kick restent secs. <b>Empiler cinq synthés dans le bas-médium</b> : chaque couche doit avoir son registre. <b>Des sons de batterie modernes</b> : le timbre des machines d'époque est la moitié du style.`,
 refs:`Michael Jackson (Thriller, produit par Quincy Jones), Prince (1999, Purple Rain), les productions de Trevor Horn, Peter Gabriel et Phil Collins pour la batterie gated, Jimmy Jam & Terry Lewis (Janet Jackson, Control), Depeche Mode, New Order, Nile Rodgers producteur (Let's Dance, Like a Virgin).`,
 cmp:['Bande synchro, puis numérique','Boîte à rythmes + MIDI','Quantifié, shuffle programmé','Synthé ou slap, précis','Réverbes numériques, gated','Fort et brillant','Le prix des machines'],links:['style:synthwave','style:electrofunk','sd']},
{id:'90s',name:'Années 90',tag:'Le sampler et le home-studio',
 lede:`Le sampler devient l'instrument central et le studio entre dans la chambre. On ne joue plus la musique, on la découpe, on la boucle, on la recolle. Le grain des machines bon marché devient une esthétique.`,
 idc:[['Support','Multipistes numériques abordables, puis disque dur'],['Outils rois','Samplers et samplers à pads, séquenceurs MIDI sur ordinateur, expandeurs, machines des années 80 rachetées d\'occasion'],['Contrainte','Quelques secondes de mémoire, polyphonie limitée, 12 ou 16 bits'],['Le son','Granuleux, grave profond, sec et frontal']],
 steps:[['Chercher la matière.','Des heures dans les bacs de vinyles : un break de batterie, deux mesures de cordes, un accord de piano électrique.'],
  ['Échantillonner malin.','La mémoire est comptée : on échantillonne le disque en 45 tours puis on redescend la hauteur dans le sampler. On gagne de la mémoire, et on y gagne un grain.'],
  ['Découper, boucler, réordonner.','Le sample est tranché et rejoué aux pads dans un autre ordre. C\'est une composition à part entière, pas une citation.'],
  ['Programmer avec du swing.','Le séquenceur du sampler à pads impose sa grille et son swing. Certains désactivent la quantification et jouent tout à la main.'],
  ['Enregistrer les voix à la maison.','Multipiste numérique à cassettes ou premières stations sur disque dur : plus besoin d\'un grand studio pour finir un disque.'],
  ['Mixer fort.','Les premiers limiteurs numériques à anticipation permettent des niveaux impossibles auparavant. La guerre du volume commence.']],
 codes:[['Le breakbeat','Quelques mesures de batterie de funk, bouclées, accélérées, découpées : hip-hop, jungle, big beat, trip-hop partent du même geste.'],
  ['Le grain 12 bits','Souffle, aigus rabotés, aliasing : les défauts des samplers bon marché donnent une patine que l\'on cherchera ensuite à imiter.'],
  ['Le filtre sur le sample','Un passe-bas pour extraire une ligne de basse d\'un disque, un filtre automatisé sur une boucle disco : la French Touch est une idée de sampler.'],
  ['Le time-stretch audible','Étirer un son sans changer sa hauteur produit un grain métallique. La jungle en fait une signature.'],
  ['Un grave nouveau','Subs de sinus, 808 allongées, basses de jungle : le numérique et les sound-systems poussent le grave plus bas que jamais.'],
  ['Le retour du brut','En réaction aux années 80 : réverbes discrètes, voix sèches et proches, et côté rock, le retour aux prises live dans de grandes pièces.']],
 today:`<b>Simpler</b> en mode Slice pour découper et rejouer. Pour le grain : transpose ton sample de plusieurs demi-tons vers le haut, exporte-le, réimporte-le et redescends-le en mode Warp <b>Re-Pitch</b> ; ajoute <b>Redux</b> et <b>Vinyl Distortion</b>. Groove Pool avec les grooves MPC. <b>Drum Buss</b> sur la batterie, <b>Auto Filter</b> sur les boucles. Pour un time-stretch d'époque, le mode Warp Beats ou Texture poussé à l'extrême plutôt que Complex Pro, trop propre.`,
 traps:`<b>Trop propre</b> : un time-stretch transparent et des samples en 24 bits sonnent hors époque. <b>Samples non déclarés</b> : la jurisprudence s'est durcie précisément pendant cette décennie. <b>Trop de couches</b> : la polyphonie limitée imposait des arrangements aérés.`,
 refs:`DJ Premier, Pete Rock, Dr. Dre (The Chronic), J Dilla, Daft Punk (Homework), The Prodigy, The Chemical Brothers, Massive Attack, Portishead, Goldie, Timbaland avec Missy Elliott ; Nirvana (Nevermind) pour le versant rock.`,
 cmp:['Numérique abordable, disque dur','Le sampler','Breaks, swing de sampler','Sub profond','Sec, frontal','De plus en plus fort','La mémoire du sampler'],links:['style:boombap','style:french','style:dnb']},
{id:'00s',name:'Années 2000',tag:'Tout dans l\'ordinateur',
 lede:`Le studio entier tient dans un ordinateur portable : pistes illimitées, annulation infinie, rappel total. Pour la première fois, il n'y a plus de contrainte technique. Le son devient très fort, très dense, très édité.`,
 idc:[['Support','Station audionumérique, « in the box »'],['Outils rois','Logiciels de production, instruments et effets en plugins, correction de hauteur, limiteurs « brickwall »'],['Contrainte','Aucune : le risque devient la paralysie du choix'],['Le son','Fort, dense, propre, calé sur la grille']],
 steps:[['Composer directement dans le logiciel.','On part d\'une boucle, d\'un preset, d\'un pack de samples. Écriture, arrangement et mixage se font en même temps, dans la même fenêtre.'],
  ['Éditer au scalpel.','Montage de la meilleure prise syllabe par syllabe, justesse corrigée note par note, batterie recalée sur la grille, frappes remplacées par des échantillons.'],
  ['Automatiser tout.','Chaque paramètre de chaque plugin peut bouger. Les montées de filtre et de bruit blanc deviennent un langage.'],
  ['Mixer dans l\'ordinateur.','Rappel instantané de n\'importe quel mix. On peut retoucher un morceau des mois plus tard, et on le fait.'],
  ['Masteriser très fort.','Limiteurs à plafond absolu : le sommet de la guerre du volume se situe à la fin de la décennie.'],
  ['Diffuser en fichiers.','MP3, baladeurs et écouteurs : on mixe désormais pour de petites oreillettes autant que pour des enceintes.']],
 codes:[['Le sidechain comme effet','Le pompage, qui était un défaut, devient la signature de la house filtrée puis de toute la dance grand public.'],
  ['La voix corrigée, puis transformée','La correction de hauteur, conçue pour être invisible, est poussée à l\'extrême et devient un timbre à part entière dans le R&B et le hip-hop.'],
  ['La grille parfaite','Tout est quantifiable, y compris l\'audio. Par réaction, c\'est aussi la décennie où l\'on redécouvre le jeu non quantifié.'],
  ['Les supersaws et les presets','Quelques synthés virtuels définissent le son de toute une scène. La question n\'est plus « comment fabriquer ce son » mais « quel preset ».'],
  ['Le minimalisme synthétique','En hip-hop et en R&B : peu d\'éléments, très secs, très en avant, beaucoup de silence. L\'exact opposé du mur de son.']],
 today:`C'est, pour l'essentiel, ta méthode de travail actuelle : la leçon de l'époque est surtout dans ses excès. <b>Wavetable</b> avec unison pour les supersaws, <b>Compressor</b> en sidechain profond, <b>Auto Shift</b> pour la voix robotisée, montées de bruit blanc avec <b>Auto Filter</b>. Pour le son de master de l'époque, pousse un <b>Limiter</b> de 8 à 10 dB, puis compare à volume égal pour entendre ce que ça coûte.`,
 traps:`<b>Masteriser comme en 2008</b> : avec la normalisation des plateformes, un master écrasé est simplement baissé et sonne plus petit que les autres. <b>Sur-éditer</b> : une batterie 100 % calée et une voix 100 % corrigée ne contiennent plus d'interprétation. <b>La collection de presets</b> : l'abondance est la contrainte de l'époque, fixe-toi des limites.`,
 refs:`The Neptunes, Timbaland (FutureSex/LoveSounds), Daft Punk (Discovery), Justice (†), Kanye West (808s & Heartbreak), les productions pop de Max Martin. À contre-courant : Burial (Untrue), assemblé à la main sans grille, et J Dilla (Donuts).`,
 cmp:['Ordinateur','Le logiciel et ses plugins','Grille parfaite','Sub + sidechain','Plugins, espaces artificiels','Maximum','L\'abondance'],links:['style:french','style:pop','master']},
{id:'10s',name:'Années 2010',tag:'Le streaming et la 808',
 lede:`Le streaming devient le mode d'écoute dominant et change les règles : le volume est normalisé, l'auditeur peut zapper en une seconde, et tout le monde a accès aux mêmes sons. La 808 du hip-hop devient la basse de toute la pop.`,
 idc:[['Support','Ordinateur portable ; diffusion en streaming'],['Outils rois','Synthés à tables d\'ondes, banques de samples par abonnement, tutoriels vidéo, instrumentaux vendus en ligne'],['Contrainte','L\'attention de l\'auditeur : une écoute ne compte qu\'après une trentaine de secondes'],['Le son','Grave énorme et propre, aigus brillants, beaucoup d\'espace, voix très traitées']],
 steps:[['Partir d\'une matière partagée.','Pack de samples, preset, boucle mélodique, instrumental acheté en ligne. Des milliers de producteurs partent des mêmes sources : la différence se fait dans le traitement.'],
  ['Collaborer à distance.','On s\'envoie des stems et des sessions. Un morceau de pop passe entre les mains d\'un auteur de mélodies vocales, d\'un beatmaker, d\'un producteur vocal, d\'un mixeur.'],
  ['Concevoir le moment fort.','Le drop en musique électronique, la 808 et son glissé en hip-hop : l\'essentiel du temps de sound design va à quelques secondes décisives.'],
  ['Produire la voix comme un instrument.','Justesse corrigée, empilements, découpes rythmiques, changements de formants. Des fragments de voix deviennent le lead instrumental.'],
  ['Mixer pour des écouteurs et un téléphone.','Un sub propre pour le casque et le club, des harmoniques pour les petits haut-parleurs. Moins d\'éléments qu\'avant, mais chacun plus gros.'],
  ['Masteriser pour la normalisation.','Les plateformes ramènent tout au même volume : pousser le limiteur ne rapporte plus rien. La course au volume s\'éteint au milieu de la décennie.'],
  ['Adapter le format.','Introductions raccourcies, refrain ou hook très tôt, morceaux plus courts.']],
 codes:[['La 808 partout','Accordée, longue, glissée, saturée pour exister sur téléphone. Née dans le hip-hop du sud des États-Unis, elle devient la basse par défaut de la pop mondiale.'],
  ['Le drop','Montée, silence, libération : la grammaire de la musique électronique de festival. Supersaws, puis accords pitchés et nappes découpées de la future bass, puis basses agressives du dubstep.'],
  ['La compression multibande extrême','Un réglage qui remonte tous les détails faibles et écrase les forts, bande par bande. Il donne ce son hyper-détaillé et brillant, et devient un tic de la décennie.'],
  ['Les voix découpées','Une syllabe échantillonnée, transposée et rejouée au clavier tient lieu de mélodie principale.'],
  ['Moins, mais plus gros','Par rapport aux murs de son des années 2000 : peu d\'éléments, beaucoup de vide, un contraste fort entre un grave massif et un haut du spectre aéré.'],
  ['Le half-time','Des tempos rapides ressentis à la moitié, caisse claire sur le temps 3, charleys en rafales.']],
 today:`<b>Wavetable</b> pour les leads et les basses en mouvement. Le préréglage <b>OTT</b> de <b>Multiband Dynamics</b>, dosé avec le réglage Amount plutôt qu'à 100 %. <b>Simpler</b> pour découper et rejouer une voix. 808 dans un Simpler en mono legato avec Glide, suivi de <b>Saturator</b> et d'<b>Utility</b> en mono. Pour le master, vise le niveau de normalisation plutôt que le maximum : le limiteur ne sert plus qu'à attraper les crêtes.`,
 traps:`<b>La compression multibande sur tout</b> : brillant au premier abord, fatigant au bout d'une minute. <b>Un drop sans contraste</b> : s'il n'y a pas de vide avant, il n'y a pas d'impact. <b>Une 808 désaccordée</b>. <b>Les mêmes packs que tout le monde, sans transformation</b> : c'est la décennie où il devient facile de sonner « pro » et difficile de sonner comme soi.`,
 refs:`Skrillex, Flume, Avicii, Calvin Harris, Major Lazer, Metro Boomin, Mike WiLL Made-It, Noah « 40 » Shebib avec Drake, Kanye West (Yeezus), Kaytranada, Billie Eilish et Finneas. À contre-courant : Daft Punk (Random Access Memories), enregistré avec des musiciens de studio et sur bande.`,
 cmp:['Portable + streaming','Packs de samples, synthés à tables d\'ondes','Grille, half-time, roulements','808 accordée, énorme et propre','Beaucoup de vide, contrastes','Normalisé : fin de la course','L\'attention de l\'auditeur'],links:['style:hiphop','style:pop','bass']},
{id:'20s',name:'Années 2020',tag:'L\'IA, le format court, l\'hybride',
 lede:`Produire une esquisse ne prend plus que quelques minutes, et des outils d'intelligence artificielle séparent, corrigent, masterisent ou génèrent. Le travail du producteur se déplace : moins fabriquer, davantage choisir, transformer et signer. Décennie en cours, donc portrait provisoire.`,
 idc:[['Support','Ordinateur, mobile et services en ligne'],['Outils rois','Séparation de stems, assistants de mixage et de mastering, génération par IA, outils vocaux, collaboration en ligne'],['Contrainte','Capter l\'attention en quelques secondes, dans un flux de sorties sans précédent ; et la question des droits'],['Le son','Hybride et référencé, voix proche et intime, grave maîtrisé, morceaux courts']],
 steps:[['Esquisser très vite.','Une boucle, un mémo vocal, un générateur : l\'idée existe en quelques minutes. Le goulot d\'étranglement n\'est plus la fabrication.'],
  ['Trier.','Dix esquisses pour une gardée. Le producteur devient aussi éditeur : savoir ce qu\'on jette est la compétence centrale.'],
  ['Séparer et rééchantillonner.','La séparation de stems isole voix, batterie, basse et le reste d\'un fichier mixé, y compris d\'une génération. Chaque stem redevient une matière à découper, filtrer, transposer.'],
  ['Remettre du geste.','Rechanter, rejouer la basse, reprogrammer la batterie, réharmoniser. C\'est ce qui transforme un résultat générique en morceau signé.'],
  ['Mixer avec assistance, décider soi-même.','Égalisation par comparaison à une référence, mastering assisté : utiles comme second avis, pas comme pilote.'],
  ['Décliner.','Version courte, version accélérée ou ralentie, instrumentale, parfois mixage immersif. Un titre est désormais une famille de fichiers.'],
  ['Vérifier les droits avant de publier.','Samples, voix, et conditions d\'utilisation commerciale des générateurs, qui changent d\'une année sur l\'autre.']],
 codes:[['Le hook à la première seconde','Pas d\'introduction, refrain d\'emblée, durée autour de deux minutes à deux minutes trente : le format est sculpté par la vidéo courte.'],
  ['Les références assumées','Disco, funk, synthwave, house des années 90, pop des années 2000 : la décennie cite ouvertement, avec une production actuelle, c\'est-à-dire un grave propre et une voix très proche.'],
  ['La voix intime','Chantée près du micro, presque chuchotée, peu réverbérée, très compressée. L\'auditeur écoute au casque : on lui parle à l\'oreille.'],
  ['Le numérique qui s\'entend','À l\'opposé : voix sur-transposées, distorsion numérique, écrêtage revendiqué. Les défauts du tout-ordinateur deviennent une esthétique, comme ceux de la bande et du sampler avant eux.'],
  ['Les versions accélérées et ralenties','Nées des réseaux, désormais publiées officiellement à côté de l\'original.'],
  ['Des rythmes mondialisés','Drill et ses 808 glissées, afrobeats, amapiano et son « log drum » : des grooves qui ne sont ni droits ni ternaires, et qu\'un simple pourcentage de swing ne reproduit pas.'],
  ['L\'audio immersif','Des mixages en son spatial proposés par les grandes plateformes depuis 2021. Encore optionnel pour un producteur indépendant.']],
 today:`La <b>séparation de stems</b> intégrée à Live pour isoler et rééchantillonner. Les <b>générateurs et transformations MIDI</b> de Live 12 pour sortir une idée de départ, à retravailler ensuite à la main. <b>Auto Shift</b> pour les voix transposées, <b>Roar</b> pour la distorsion numérique assumée. Une règle de méthode plus qu'un réglage : pour chaque élément généré ou tiré d'un pack, impose-toi <b>au moins une transformation personnelle</b> avant de le garder.`,
 traps:`<b>Publier une génération telle quelle</b> : le résultat est compétent et interchangeable, et les droits dessus sont les plus fragiles. <b>Ignorer les conditions d'utilisation</b> : elles ont changé plusieurs fois depuis 2024 et changeront encore, vérifie celles de ton abonnement avant toute sortie commerciale. <b>Confier la décision à l'assistant</b> : un mastering automatique ne sait pas ce que tu voulais. <b>Multiplier les versions</b> au lieu de finir le morceau.`,
 refs:`Dua Lipa (Future Nostalgia), The Weeknd (After Hours), Beyoncé (Renaissance), Fred again.., PinkPantheress, Charli XCX (Brat), 100 gecs, Kaytranada, Burna Boy, Tyla.`,
 cmp:['Portable, mobile, en ligne','Stems, assistants, génération par IA','Tout coexiste : grille, swing, polyrythmies','Maîtrisé, pensé pour écouteurs','Voix proche ; immersif en option','Normalisé','L\'attention, et les droits'],links:['style:nudisco','style:synthwave','master']}
];
const ERAH=['Support','Outil roi','Rythme','Grave','Espace','Niveau','Contrainte'];
const TIMELINE=[['≈1970','Magnétophones 16 puis 24 pistes','On peut séparer chaque instrument et empiler les prises : naissance de la production comme art distinct.'],
 ['≈1977','Premières consoles automatisées','Les mouvements de faders sont mémorisés : le mix n\'est plus une performance unique.'],
 ['1977','« I Feel Love », entièrement séquencé','Un morceau de danse sans batteur ni bassiste : le programme des vingt années suivantes.'],
 ['≈1978','Premières réverbes numériques','Des espaces impossibles, réglables et reproductibles d\'un studio à l\'autre.'],
 ['≈1980','Boîtes à rythmes à échantillons, avec swing','Le rythme devient programmable, quantifié par défaut, et le swing devient un pourcentage.'],
 ['1982','Le disque compact','Plus de dynamique et de bande passante que le vinyle ; la brillance devient un argument.'],
 ['1983','La norme MIDI, et le premier synthé FM grand public','Toutes les machines se parlent. Les timbres numériques envahissent la pop.'],
 ['≈1988','Samplers à pads avec séquenceur','La boucle et le break deviennent la matière première ; le swing de ces machines marque une génération.'],
 ['≈1991','Multipistes numériques abordables, premières stations sur disque dur','Le studio quitte les grands complexes pour les appartements.'],
 ['≈1994','Limiteurs numériques à anticipation','Des niveaux inatteignables auparavant : début de la guerre du volume.'],
 ['1997','Correction automatique de hauteur','D\'abord invisible, puis effet revendiqué dès la fin de la décennie.'],
 ['≈2000','Logiciels de production complets sur ordinateur personnel','Instruments, effets et mixage dans la même fenêtre : le « tout dans l\'ordinateur ».'],
 ['≈2003','Boutiques de musique en ligne et baladeurs numériques','On écoute au casque, en fichiers compressés, titre par titre.'],
 ['≈2008','Sommet de la guerre du volume','Des albums si compressés qu\'ils déclenchent une controverse publique ; la normalisation viendra ensuite y mettre fin.'],
 ['≈2012','Banques de samples et de presets par abonnement, tutoriels vidéo','Tout le monde a accès aux mêmes sons et aux mêmes techniques : la différence se déplace vers le goût et le traitement.'],
 ['≈2014','Mastering automatisé en ligne','Premier maillon de la chaîne confié à un algorithme.'],
 ['≈2015','Normalisation du volume généralisée sur le streaming','Masteriser plus fort ne sert plus à rien : fin progressive de la course au volume.'],
 ['≈2018','La vidéo courte devient prescriptrice','Un extrait de quinze secondes peut lancer un titre : le hook passe en tête, les morceaux raccourcissent.'],
 ['2021','Audio spatial sur les grandes plateformes','Le mixage immersif sort des salles de cinéma.'],
 ['≈2023','Séparation de stems et génération de morceaux complets par IA','Démixer un fichier, ou obtenir une chanson à partir d\'un texte, devient accessible à tous.'],
 ['2024–2025','Procès, puis premiers accords de licence','Les grandes maisons de disques attaquent des générateurs en 2024 ; les premiers accords sont signés fin 2025. Situation encore mouvante.']];
let eraSel='cmp';
function renderEras(){return `<div class="section active"><h2>Méthodes de production par décennie</h2>
  <p class="lede">Chaque époque a son outil central, sa contrainte, et la méthode de travail qui en découle. Le « son » d'une décennie est la trace audible de cette méthode.</p>
  <div class="chips" id="echips" style="padding-top:0"></div><div id="ebody" style="margin-top:12px"></div></div>`;}
function initEras(){
  const chips=document.getElementById('echips'),body=document.getElementById('ebody');
  const draw=()=>{stopLoop();quizActive=false;
    chips.innerHTML=[['cmp','Vue d\'ensemble'],...ERAS.map(x=>[x.id,x.name])].map(([id,l])=>`<button class="chip${eraSel===id?' on':''}" data-s="${id}">${l}</button>`).join('');
    chips.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{eraSel=c.dataset.s;draw();});
    if(eraSel==='cmp'){body.innerHTML=block('ex','la même progression, produite à six époques',`<p>Quatre accords identiques, six méthodes. Écoute-les à la suite : ce qui change, ce n'est pas la musique, c'est la façon de la fabriquer. Synthétisé, donc schématique : l'exercice porte sur les gestes de production, pas sur le grain exact des machines.</p><div id="demo-eracmp" style="margin-top:14px"></div><p class="note" id="eratxt"></p>`)+
      block('','six décennies côte à côte',`<div class="scroll"><table class="cmp"><thead><tr><th>Époque</th>${ERAH.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${ERAS.map(x=>`<tr><th><button data-s="${x.id}">${x.name}</button></th>${x.cmp.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)+
      block('','les inventions qui ont changé la méthode',`<div class="scroll"><table class="cmp" style="min-width:620px"><tbody>${TIMELINE.map(r=>`<tr><th class="mono" style="font-weight:500;color:var(--accent)">${r[0]}</th><td><b>${r[1]}</b></td><td style="color:var(--muted)">${r[2]}</td></tr>`).join('')}</tbody></table></div><p class="note">Dates indicatives, arrondies quand plusieurs machines concurrentes sortent à quelques mois d'écart.</p>`)+
      block('','le fil conducteur',`<p>À chaque décennie, <b>une contrainte disparaît</b> : le nombre de pistes, puis le besoin de musiciens, puis le besoin d'un studio, puis toute limite technique, puis l'accès aux sons, et désormais le temps de fabrication lui-même. Ce qui reste rare, c'est l'attention de l'auditeur et le goût de celui qui produit. Et à chaque fois, le son de l'époque précédente devient une esthétique que l'on cherche à retrouver. Le bon usage de cette histoire : choisir délibérément une contrainte d'époque (16 pistes, pas de quantification, 12 bits, un seul synthé) et s'y tenir le temps d'un morceau.</p>`);
      body.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{eraSel=c.dataset.s;draw();window.scrollTo(0,0);});eraCompare(document.getElementById('demo-eracmp'));return;}
    const x=ERAS.find(k=>k.id===eraSel);
    body.innerHTML=`<p class="lede" style="margin-bottom:16px"><b style="color:var(--text)">${x.tag}.</b> ${x.lede}</p>
      ${block('','carte d\'identité',`<div class="idc">${x.idc.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div>`)}
      ${block('ex','à l\'écoute',`<p>La progression de référence, produite avec les gestes de l'époque.</p><div id="demo-era" style="margin-top:14px"></div>`)}
      ${block('','la méthode de travail',stepList(x.steps))}
      ${block('','les codes sonores',concepts(x.codes))}
      ${block('todo','retrouver ce son aujourd\'hui, dans Live',`<p>${x.today}</p>`)}
      ${block('err','pièges',`<p>${x.traps}</p>`)}
      ${block('','pour aller plus loin',`<dl><div><dt>À écouter</dt><dd>${x.refs}</dd></div><div><dt>Voir aussi</dt><dd><div class="xl">${x.links.map(id=>`<button class="chip" data-go="${id}">${glossLabel(id)}</button>`).join('')}</div></dd></div></dl>`)}
      <div class="card"><h3>quiz</h3><div id="quiz"></div></div>`;
    body.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>glossGo(b.dataset.go));
    eraPlayer(document.getElementById('demo-era'),x.id);initQuiz('era:'+x.id);};
  draw();
}
const ERATXT={'70s':`Années 70 : frappes légèrement irrégulières, batterie mate et courte sans réverbe, aigus arrondis et léger écrêtage doux de la bande, flottement de hauteur, souffle.`,
 '80s':`Années 80 : tout exactement sur la grille, caisse claire à réverbe gated, cloches FM cristallines sur une nappe à chorus, basse synthé en croches, roulement de toms électroniques.`,
 '90s':`Années 90 : swing de sampler à 62 %, caisse claire un peu en retard, batterie passée en basse résolution, accords filtrés et redéclenchés comme un sample, sub en sinus, craquements.`,
 '00s':`Années 2000 : kick sur tous les temps, supersaws qui pompent sous un sidechain profond, tout calé, tout brillant, et l'ensemble poussé dans un limiteur jusqu'à l'écrêtage.`,
 '10s':`Années 2010 : 140 BPM ressentis à la moitié, caisse claire sur le 3, 808 longue avec un glissé, rafales de charleys, nappe en retrait, et une voix découpée en guise de mélodie. Beaucoup de vide, un grave énorme, un master propre.`,
 '20s':`Années 2020 : un groove disco-funk ouvertement référencé (kick sur les temps, charley ouvert, basse en octaves, accords de septième), mais avec un grave net et sec, un sidechain discret, et un thème partagé entre une cloche années 80 et une voix découpée.`};
function eraCompare(root){let sel='70s';root.innerHTML=`<div class="row" id="ec"></div><div id="ep" style="margin-top:12px"></div>`;
  const ids=ERAS.map(e=>e.id),load=()=>{stopLoop();eraPlayer(root.querySelector('#ep'),sel);const t=document.getElementById('eratxt');if(t)t.textContent=ERATXT[sel];};
  choice(root,'#ec',ERAS.map(e=>e.name),()=>ids.indexOf(sel),i=>{sel=ids[i];load();});load();}
function eraPlayer(root,era){

/* ============ focus swing ============ */
const SWING={
 ess:[['Le swing est un rapport, pas un effet','On prend chaque paire de doubles-croches et on décide où tombe la seconde. À <b>50 %</b>, au milieu : droit. À <b>66,7 %</b>, aux deux tiers : c\'est un triolet, le shuffle du blues et du jazz. Tout l\'intérêt de la musique actuelle est <b>entre les deux</b>, de 54 à 62 %, là où l\'oreille n\'entend ni du binaire ni du ternaire.'],
  ['Swing de croches ou de doubles-croches','En jazz, en blues, en rock shuffle, ce sont les <b>croches</b> qu\'on retarde. En funk, hip-hop, house, garage, ce sont les <b>doubles-croches</b>, et les croches restent droites. Se tromper de résolution est l\'erreur la plus courante.'],
  ['La quantification a une force','Quantifier n\'est pas tout ou rien. À 100 %, chaque note est collée à la grille. À 50 %, elle fait la moitié du chemin : on resserre une prise sans effacer le geste du musicien.'],
  ['On quantifie vers une grille… qui peut être swinguée','Swing et quantification ne s\'opposent pas. Un beat de sampler à pads est quantifié à 100 %, mais sur une grille à 62 %. C\'est régulier <b>et</b> ça balance.'],
  ['Le micro-placement par instrument','Au-delà du swing, chaque instrument peut être décalé en bloc de quelques millisecondes : caisse claire <b>derrière le temps</b> (nonchalant, lourd), charleys <b>devant</b> (nerveux, pressé). Ces décalages constants s\'entendent comme un caractère, pas comme une erreur.'],
  ['Le même pourcentage ne sonne pas pareil à tous les tempos','Le swing est un rapport, mais l\'oreille entend des millisecondes. 58 % à 90 BPM, c\'est un retard de 27 ms, très audible. À 140 BPM, 17 ms, presque imperceptible. Plus le tempo est lent, plus le swing « parle ».']],
 today:[['Hip-hop d\'influence trap','Grille <b>strictement droite</b>, zéro swing. Le mouvement vient d\'ailleurs : roulements en triples-croches et en triolets, flows vocaux en triolets, 808 qui glissent. Le contraste binaire / triolet remplace le swing.'],
  ['Lo-fi et boom bap actuel','Swing de sampler entre 58 et 66 %, souvent combiné à une quantification partielle ou absente. La caisse claire en retard est devenue un code de genre à part entière.'],
  ['Neo-soul et beats « ivres »','L\'héritage de J Dilla : pas de quantification, et des décalages volontairement <b>contradictoires</b> entre instruments, kick un peu tôt, caisse claire tard, charleys droits. La pulsation semble trébucher sans jamais tomber.'],
  ['House et tech-house','Kick droit sur le temps, et tout le reste (charleys, shakers, percussions) swingué entre 54 et 60 %. Beaucoup de producteurs utilisent des grooves extraits de boîtes à rythmes ou de samplers à pads plutôt qu\'un pourcentage.'],
  ['UK garage et 2-step','Un des swings les plus marqués de la musique électronique, sur les doubles-croches, avec des kicks déplacés hors des temps. Le balancement est l\'identité du genre.'],
  ['Afrobeats et amapiano','Des percussions dont le placement se situe <b>entre le binaire et le ternaire</b>, superposées à des éléments droits. Un pourcentage de swing unique ne suffit pas à le reproduire : il faut travailler couche par couche.'],
  ['Pop et dance grand public','Grille stricte, swing minimal ou nul. Le relief rythmique est porté par la voix, qui reste, elle, libre et souvent en avance ou en retard sur l\'instrumental.'],
  ['Drum & bass','Pas de swing programmé : le groove vient du break d\'origine, joué par un vrai batteur, avec ses ghost notes et ses irrégularités, qu\'on découpe sans le recaler.']],
 todayNote:`Tendances générales : dans chacun de ces courants, des artistes font exactement l'inverse, et c'est souvent ce qui les distingue.`,
 hist:[['≈1980','Premières boîtes à rythmes programmables','Elles quantifient par défaut. Pour retrouver de la souplesse, leur concepteur ajoute un réglage de « shuffle » exprimé en pourcentage : l\'échelle 50 % → 66 % vient de là.'],
  ['Fin des années 80','Samplers à pads avec séquenceur','Le même réglage de swing, appliqué à des sons échantillonnés. Les valeurs entre 54 et 62 % deviennent le son du hip-hop et de la house.'],
  ['Années 90','Le jeu non quantifié sur machine','Des producteurs désactivent la quantification et jouent leurs pads comme un instrument, avec des décalages différents pour chaque son.'],
  ['≈2000','Le « beat ivre » passe chez les musiciens','Des batteurs et des groupes reproduisent à la main ce placement né sur des machines. La boucle est bouclée : l\'humain imite la machine qui imitait l\'humain.'],
  ['Années 2000','Grooves extraits et réglages fins dans les logiciels','On peut copier le placement d\'un enregistrement et l\'appliquer à n\'importe quel clip, doser timing, vélocité et aléatoire séparément.'],
  ['Aujourd\'hui','Deux écoles coexistent','La grille parfaite (trap, pop, EDM) et le micro-placement travaillé note par note (lo-fi, neo-soul, house). Les deux sont des choix ; le seul échec, c\'est la grille subie.']],
 method:[['Décide d\'abord : grille ou placement ?','Trap, pop, techno dure : reste droit et cherche le mouvement ailleurs. Hip-hop organique, house, funk, garage : le placement fait partie de l\'écriture.'],
  ['Choisis la bonne résolution.','Doubles-croches pour presque toute la musique actuelle. Croches seulement pour un shuffle blues, jazz ou rock.'],
  ['Commence par un swing global.','Le même pourcentage sur tous les éléments rythmiques, basse comprise. 54–58 % pour un balancement discret, 60–64 % pour un feeling de sampler.'],
  ['Ajoute ensuite un décalage par instrument.','Un seul à la fois, constant sur tout le morceau : caisse claire de 10 à 25 ms en retard, ou charleys de 5 à 12 ms en avance. Au-delà de 30 ms, on entend un flam.'],
  ['Dose l\'aléatoire en dernier, et peu.','Quelques millisecondes et quelques pour cent de vélocité. L\'aléatoire seul ne crée pas de groove : un batteur est irrégulier de façon <b>cohérente</b>, pas au hasard.'],
  ['Vérifie au tempo final.','Si tu changes le tempo de 20 BPM, réécoute le swing : le même pourcentage ne produit plus le même effet.'],
  ['Laisse le kick tranquille.','En musique de club, le kick reste sur la grille : c\'est la référence contre laquelle tous les autres décalages prennent leur sens.']],
 live:`<p><b>Groove Pool</b> : glisse un groove sur un clip, puis règle <b>Timing</b> (force du placement), <b>Random</b>, <b>Velocity</b>, et la résolution avec <b>Base</b> (1/8 ou 1/16). Le curseur <b>Amount</b> global dose tous les grooves du projet d'un coup. Les grooves du dossier MPC reprennent les valeurs classiques, de 54 à 66 %.</p>
   <p><b>Extraire un groove</b> : clic droit sur un clip audio, Extract Groove. Le placement d'un vrai batteur ou d'un break devient applicable à tes clips MIDI.</p>
   <p><b>Quantification partielle</b> : dans les réglages de quantification, règle Amount à 50–70 % plutôt que 100 %.</p>
   <p><b>Décalage par instrument</b> : le champ <b>Track Delay</b> de chaque piste, en millisecondes, positif pour retarder, négatif pour avancer. C'est l'outil du micro-placement : constant, réversible, sans toucher aux notes.</p>
   <p><b>Tout à la main</b> : désactive l'aimantation de la grille dans l'éditeur MIDI et déplace les notes librement.</p>`,
 err:`<p><b>Croire que l'aléatoire humanise.</b> Des décalages au hasard donnent un batteur maladroit, pas un batteur qui groove. <b>Deux swings différents par accident</b> : une boucle de batterie échantillonnée à 60 % sur des charleys programmés à 50 % produit des flams. Décalages contradictoires, oui, mais choisis. <b>Swinguer le mauvais niveau</b> : un swing de croches sur un beat house le transforme en shuffle de blues. <b>Régler le swing sur un élément isolé</b> : il ne s'entend que contre une référence droite, juge-le avec le kick.</p>`
};
function renderSwing(){
  return `<div class="section active"><h2>Swing et quantification</h2>
  <p class="lede">Où tombent les notes par rapport à la grille, à quelques millisecondes près. C'est le réglage le plus discret d'une production actuelle, et celui qui sépare le plus sûrement un beat qui « tourne » d'un beat posé là.</p>
  ${block('','l\'essentiel',concepts(SWING.ess))}
  ${block('ex','le laboratoire',`<p>Un groove complet dont tu contrôles chaque dimension du placement. En haut, la grille exacte en pointillés et la position réelle de chaque frappe : <b>en couleur</b> quand elle est en retard, <b>en ambre</b> quand elle est en avance. Commence par charger les préréglages un par un, au casque.</p><div id="demo-swinglab" style="margin-top:14px"></div>`)}
  ${block('','le swing dans la musique actuelle',concepts(SWING.today)+`<p class="note">${SWING.todayNote}</p>`)}
  ${block('','d\'où ça vient',`<div class="scroll"><table class="cmp" style="min-width:620px"><tbody>${SWING.hist.map(r=>`<tr><th class="mono" style="font-weight:500;color:var(--accent);white-space:nowrap">${r[0]}</th><td><b>${r[1]}</b></td><td style="color:var(--muted)">${r[2]}</td></tr>`).join('')}</tbody></table></div>`)}
  ${block('','la méthode',stepList(SWING.method))}
  ${block('todo','dans Ableton Live',SWING.live)}
  ${block('err','pièges',SWING.err)}
  <div class="card"><h3>quiz</h3><div id="quiz"></div></div></div>`;
}

 ['start','Avant de commencer une session',['L\'objectif de la session tient en une phrase, écrite','Phase choisie : création, arrangement ou mixage, pas les trois','Modèle de projet chargé, pistes nommées','Références importées et ramenées au volume du projet','Volume d\'écoute réglé sur le repère habituel','Une contrainte choisie pour aujourd\'hui','Heure de fin fixée']],
 ['mix','Avant d\'exporter le mix',['Aucune piste, aucun bus n\'écrête','Le master culmine vers −6 dB, sans limiteur actif','Contrôle en mono : rien d\'important ne disparaît','Contrôle « petites enceintes » : passe-haut temporaire à 180 Hz, la basse reste lisible','Grave en mono sous 120 Hz','Voix stable du premier au dernier mot','Début et fin propres : pas de clic, queues de réverbe complètes','Comparaison à une référence, à volume égal','Écoute complète après une pause, écran éteint','Export WAV 24 bits, à la fréquence du projet','Version numérotée, projet sauvegardé avec « Collect All and Save »']],

let pracState={mode:'best',dom:'',q:''};
function renderPractices(){return `<div class="section active"><h2>Bonnes et mauvaises pratiques</h2>
  <p class="lede">Ce qui fait consensus aujourd'hui chez les producteurs et ingénieurs du son, et les erreurs documentées les plus coûteuses. ${BEST.length} pratiques à adopter, ${BAD.length} fiches d'erreurs, trois check-lists.</p>
  <div class="chips" id="pmode" style="padding-top:0"></div>
  <input class="gq" id="pq" type="search" placeholder="Chercher : sub, référence, limiteur, sample…" autocomplete="off" spellcheck="false" style="margin-top:8px">
  <div class="chips" id="pdom"></div><div class="gcount" id="pcount"></div><div id="plist"></div></div>`;}
function initPractices(){
  const $=id=>document.getElementById(id),q=$('pq');
  const draw=()=>{const st=pracState,nq=norm(st.q.trim()),words=nq?nq.split(/\s+/):[],open=(nq||st.dom)?' open':'';
    $('pmode').innerHTML=[['best','✓ À adopter'],['bad','✕ Erreurs (fiches ERR)'],['check','☑ Check-lists']].map(([id,l])=>`<button class="chip${st.mode===id?' on':''}" data-m="${id}">${l}</button>`).join('');
    $('pmode').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st.mode=c.dataset.m;draw();});
    const isList=st.mode!=='check';q.style.display=$('pdom').style.display=$('pcount').style.display=isList?'':'none';
    if(!isList){$('plist').innerHTML=CHECKS.map(([id,title,items])=>{const done=items.filter((_,i)=>S.checks[id+':'+i]).length;
        return `<div class="card"><h3>${title} · ${done}/${items.length}</h3>${items.map((it,i)=>`<label class="done" style="margin:0;min-height:40px;align-items:flex-start;padding:6px 0"><input type="checkbox" data-c="${id}:${i}" ${S.checks[id+':'+i]?'checked':''} style="margin-top:3px;flex:none"><span>${it}</span></label>`).join('')}
          <div class="row" style="margin-top:10px"><button class="btn" data-r="${id}">Tout décocher</button></div></div>`;}).join('');
      $('plist').querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{if(c.checked)S.checks[c.dataset.c]=true;else delete S.checks[c.dataset.c];autoSave();draw();});
      $('plist').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{Object.keys(S.checks).forEach(k=>{if(k.indexOf(b.dataset.r+':')===0)delete S.checks[k];});autoSave();draw();});return;}
    const data=st.mode==='best'?BEST:BAD;
    $('pdom').innerHTML=[['','Tous'],...Object.entries(PDOM).filter(([k])=>data.some(d=>d[0]===k))].map(([id,l])=>`<button class="chip${st.dom===id?' on':''}" data-d="${id}">${l}</button>`).join('');
    $('pdom').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st.dom=c.dataset.d;draw();});
    const res=data.map((d,i)=>({d,i})).filter(({d})=>(!st.dom||d[0]===st.dom)&&words.every(w=>norm(d.slice(1,-1).join(' ')).includes(w)));
    $('pcount').textContent=res.length+(st.mode==='best'?' pratique':' fiche')+(res.length>1?'s':'');
    $('plist').innerHTML=res.length?res.map(({d,i})=>st.mode==='best'
      ?`<details class="prac"${open}><summary><span class="pk ok">✓</span><b>${d[1]}</b><span class="al">${PDOM[d[0]]}</span></summary><dl><div><dt>Pourquoi</dt><dd>${d[2]}</dd></div><div><dt>Comment</dt><dd>${d[3]}</dd></div></dl><button data-go="${d[4]}">→ ${glossLabel(d[4])}</button></details>`
      :`<details class="prac"${open}><summary><span class="pk ko">ERR${String(i+1).padStart(2,'0')}</span><b>${d[1]}</b><span class="al">${PDOM[d[0]]}</span></summary><dl><div><dt>Cause</dt><dd>${d[2]}</dd></div><div><dt>Manifestation</dt><dd>${d[3]}</dd></div><div><dt>Conséquences</dt><dd>${d[4]}</dd></div><div><dt>Correction</dt><dd>${d[5]}</dd></div></dl><button data-go="${d[6]}">→ ${glossLabel(d[6])}</button></details>`).join('')
      :`<p class="note">Rien ne correspond. Essaie un mot plus court ou retire le filtre.</p>`;
    $('plist').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>glossGo(b.dataset.go));};
  q.value=pracState.q;q.oninput=()=>{pracState.q=q.value;draw();};draw();
}
