compo:[
 {l:'Rappel',q:'Combien de notes différentes contient une gamme comme sol mineur ?',o:['7','5','8','12'],e:'Sol La Si♭ Do Ré Mi♭ Fa : sept notes. Les 12 notes correspondent à la gamme chromatique complète.',ref:'Tonalité'},
 {l:'Compréhension',q:'On garde la même mélodie mais on change les accords placés dessous. Qu\'est-ce qui change le plus ?',o:['L\'émotion perçue','Le tempo','La tonalité, obligatoirement','Le volume'],e:'L\'harmonie porte l\'émotion : la même mélodie peut sonner triste, épique ou funky selon les accords.',ref:'Harmonie'},
 {l:'Application',q:'Dans l\'alternance Gm – C, quelle note donne la couleur dorienne (funk / disco) ?',o:['Le Mi naturel','Le Si bémol','Le Fa dièse','Le Ré'],e:'Sol mineur contient un Mi♭. L\'accord de Do majeur (Do–Mi–Sol) apporte un Mi naturel : c\'est la sixte majeure caractéristique du mode dorien.',ref:'la démo des progressions (Funk / disco)'},
 {l:'Compréhension',q:`Dans une tonalité mineure, quel accord donne la sensation de repos, de « maison » ?`,o:[`Le i`,`Le v`,`Le VII`,`Le ii°`],e:`Le premier degré est le point de repos. Les accords de tension (v, VII, ii°) donnent envie d'y revenir : c'est ce qui fait tourner une boucle.`,ref:`les 7 accords de la tonalité`},
 {l:'Compréhension',q:`Une syncope, c'est…`,o:[`Un accent placé entre les temps forts`,`Un changement de tonalité`,`Un accord de quatre notes`,`Un silence d'une mesure`],e:`Déplacer une note d'une double-croche hors du temps crée de la surprise rythmique : c'est la base du groove.`,ref:`Rythme`},
 {l:'Application',q:`Quelle variation préserve le mieux l'identité d'un motif ?`,o:[`Garder le rythme et ne changer que la dernière note`,`Changer toutes les notes et le rythme`,`Le jouer une seule fois pour ne pas lasser`,`Changer de tonalité à chaque répétition`],e:`On reconnaît un motif d'abord à son rythme. Une seule chose change à la fois, sinon l'auditeur entend une nouvelle idée.`,ref:`la démo motif et variation`},
 {l:'Application',q:`Ta mélodie est dans la gamme mais sonne « à côté » des accords. Correction la plus efficace ?`,o:[`Placer sur les temps forts des notes appartenant à l'accord en cours`,`Ajouter plus de notes`,`Monter la mélodie d'une octave`,`Ajouter de la réverbe`],e:`Être dans la gamme ne suffit pas : les notes accentuées doivent s'appuyer sur l'accord du moment. Les autres notes servent de passage.`,ref:`la méthode, étape 4`},
 {l:'Diagnostic',q:'Ton morceau contient trois mélodies différentes et personne n\'en retient aucune. Quelle est la meilleure action ?',o:['Garder la plus forte et la répéter avec de petites variations','Ajouter une quatrième mélodie plus accrocheuse','Monter le volume des mélodies au mixage','Changer de tonalité'],e:'Un hook se mémorise par la répétition. Plus d\'idées = moins de mémorisation, et le mixage ne répare pas un problème de composition.',ref:'Mélodie & hook'}],
groove:[
 {l:'Rappel',q:`Le backbeat, c'est…`,o:[`La caisse claire ou le clap sur les temps 2 et 4`,`Le kick sur chaque temps`,`Un charley ouvert sur les contretemps`,`Un roulement en fin de mesure`],e:`C'est la réponse au kick, l'accent sur lequel on tape dans les mains. Presque toute la musique populaire repose dessus.`,ref:`Les rôles`},
 {l:'Rappel',q:`« Four-on-the-floor » signifie…`,o:[`Un kick sur chacun des quatre temps`,`Quatre pistes de batterie`,`Un tempo de 4 BPM`,`Quatre mesures d'introduction`],e:`C'est le squelette de la disco, de la house et de la techno : une pulsation continue et régulière.`,ref:`signatures rythmiques par style`},
 {l:'Compréhension',q:`Que fait le swing ?`,o:[`Il retarde les doubles-croches paires, ce qui crée un balancement`,`Il accélère progressivement le tempo`,`Il augmente la vélocité des temps forts`,`Il ajoute de la réverbe aux charleys`],e:`À 50 % tout est droit. Plus on monte, plus la seconde double-croche de chaque paire arrive tard, jusqu'au feeling ternaire.`,ref:`Swing, et le curseur du séquenceur`},
 {l:'Compréhension',q:`Une ghost note est…`,o:[`Une frappe très douce placée entre les accents`,`Une note supprimée par erreur`,`Un kick sans attaque`,`Une note jouée en dehors de la tonalité`],e:`On ne la remarque pas consciemment, mais elle remplit l'espace et donne son mouvement au beat.`,ref:`Ghost notes`},
 {l:'Compréhension',q:`Pourquoi hiérarchiser les vélocités des charleys ?`,o:[`Des frappes identiques sonnent comme une mitraillette ; les accents créent la pulsation`,`Pour réduire le volume général`,`Pour éviter la saturation du master`,`Parce que les charleys n'ont pas de hauteur`],e:`Temps forts, contretemps moyens, doubles-croches faibles : c'est ce relief qui fait « respirer » une ligne de charleys.`,ref:`la démo « trois façons de le jouer »`},
 {l:'Application',q:`Dans un pattern house classique, où tombe le charley ouvert ?`,o:[`Sur chaque contretemps, entre deux kicks`,`En même temps que chaque kick`,`Uniquement sur le temps 1`,`Sur les temps 2 et 4 avec le clap`],e:`Kick sur le temps, charley ouvert sur le « et » : cette alternance grave / aigu est le moteur de la house.`,ref:`le preset House du séquenceur`},
 {l:'Application',q:`Tu appliques 60 % de swing aux charleys mais la basse reste droite. Résultat ?`,o:[`Des décalages qui sonnent comme des erreurs : il faut le même swing sur tous les éléments rythmiques`,`Un groove plus riche, c'est recommandé`,`Aucune différence audible`,`La basse devient plus forte`],e:`Deux grilles différentes superposées produisent des flams. Le groove est une grille commune, partagée par tout le monde.`,ref:`la méthode, étape 4`},
 {l:'Application',q:`Tu utilises un kick type 808 très long, et ta ligne de basse devient illisible. Pourquoi ?`,o:[`Le kick long occupe le grave en continu : il faut le raccourcir ou lui laisser le rôle de basse`,`Le kick est trop aigu`,`Il manque du swing`,`Le tempo est trop lent`],e:`Un kick long EST une basse. Soit il tient ce rôle seul, soit on le raccourcit pour libérer l'espace entre les frappes.`,ref:`anatomie d'un kick`},
 {l:'Diagnostic',q:`Ton beat a un bon pattern mais sonne rigide et sans vie. Premier geste ?`,o:[`Travailler les vélocités et un léger swing, sans rien ajouter`,`Ajouter une boucle de percussions`,`Monter le tempo de 10 BPM`,`Compresser plus fort le bus batterie`],e:`Le problème est presque toujours l'exécution, pas le contenu. Trois éléments bien accentués groovent plus que dix à plat.`,ref:`l'erreur classique`}],
bass:[
 {l:'Rappel',q:`Quel est le double rôle de la basse ?`,o:[`Elle relie le rythme (avec le kick) et l'harmonie (fondamentale des accords)`,`Elle remplace le kick et les charleys`,`Elle joue la mélodie principale et les chœurs`,`Elle sert uniquement à remplir le spectre`],e:`C'est la seule partie qui appartient à la fois à la section rythmique et à l'harmonie.`,ref:`Un double rôle`},
 {l:'Rappel',q:`Sous 100–120 Hz, le grave doit être…`,o:[`Mono, au centre`,`Le plus large possible`,`Panoramisé à gauche`,`Réverbéré`],e:`Du grave stéréo s'annule en mono et devient imprévisible sur un gros système. La largeur se travaille au-dessus.`,ref:`Mono`},
 {l:'Compréhension',q:`Pourquoi une basse en sinus pur disparaît-elle sur un téléphone ?`,o:[`Le haut-parleur ne reproduit rien sous 150–200 Hz, et un sinus n'a aucune harmonique au-dessus`,`Le téléphone compresse trop le signal`,`Le sinus est toujours trop faible`,`Le téléphone lit en mono`],e:`Pas de fondamentale restituée, pas d'harmoniques pour la suggérer : il ne reste littéralement rien.`,ref:`la démo deux couches (sub seul + petites enceintes)`},
 {l:'Compréhension',q:`À quoi sert une saturation légère sur un sub ?`,o:[`À créer des harmoniques qui rendent la note audible sur les petits systèmes`,`À le rendre plus grave`,`À l'élargir en stéréo`,`À réduire son volume`],e:`L'oreille reconstitue la fondamentale à partir de ses harmoniques : on « entend » un 49 Hz que l'enceinte ne joue pas.`,ref:`Fondamentale et harmoniques`},
 {l:'Compréhension',q:`Que change la longueur des notes d'une ligne de basse ?`,o:[`Le groove : des notes courtes rebondissent, des notes tenues poussent`,`La tonalité du morceau`,`Le tempo`,`Rien, seule la position de départ compte`],e:`Le silence entre les notes fait partie du rythme. C'est souvent le réglage le plus rentable sur une ligne qui « ne marche pas ».`,ref:`la démo des lignes de basse (curseur de longueur)`},
 {l:'Application',q:`Tu empiles un sub et une couche médium. Quel traitement sur la couche médium ?`,o:[`Un passe-haut vers 100–120 Hz, pour ne pas doubler le sub`,`Un passe-bas à 100 Hz`,`Un boost à 50 Hz`,`Aucun, les deux doivent couvrir tout le spectre`],e:`Deux sources dans le sub créent des battements et des annulations. Chaque couche a son étage.`,ref:`la méthode, étape 5`},
 {l:'Application',q:`Ton morceau est en do. La fondamentale do grave est à 33 Hz. Que fais-tu ?`,o:[`Tu joues la basse une octave plus haut (65 Hz), quitte à la renforcer par des couches`,`Tu boostes 33 Hz à l'EQ`,`Tu gardes 33 Hz : plus c'est grave, mieux c'est`,`Tu passes la basse en stéréo`],e:`À 33 Hz, la plupart des systèmes ne restituent rien, et ton limiteur travaille pour du son que personne n'entend.`,ref:`la tonalité décide du poids`},
 {l:'Application',q:`Dans une ligne house classique, où tombent les notes de basse pour cohabiter avec le kick sans aucun traitement ?`,o:[`Sur les contretemps, entre les kicks`,`Exactement sur chaque kick`,`Uniquement sur le temps 1`,`En doubles-croches continues`],e:`Kick sur le temps, basse sur le « et » : ils ne jouent jamais ensemble, donc ne se masquent pas. L'arrangement règle le problème avant le mixage.`,ref:`la démo des lignes de basse (Contretemps)`},
 {l:'Diagnostic',q:`Ta basse est énorme au casque mais absente en voiture et sur téléphone. Correction ?`,o:[`Ajouter des harmoniques : saturation ou couche médium`,`Monter le sub de 6 dB`,`Ajouter de la réverbe sur la basse`,`Élargir la basse en stéréo`],e:`Monter le sub ne change rien sur des systèmes qui ne le reproduisent pas, et consomme la marge du master.`,ref:`l'erreur classique`}],
arr:[
 {l:'Rappel',q:'En musique dansante, les sections avancent typiquement par blocs de…',o:['8 ou 16 mesures','3 ou 5 mesures','10 mesures','1 minute exactement'],e:'Les puissances de 2 (4, 8, 16, 32) structurent presque toute la musique de club : l\'auditeur et le DJ anticipent les changements.',ref:'Structure en blocs'},
 {l:'Compréhension',q:'Pourquoi retirer le kick et la basse pendant le break ?',o:['Pour que leur retour crée un impact','Pour économiser du CPU','Parce que la réverbe ne supporte pas les graves','Pour raccourcir le morceau'],e:'Tension / relâchement : sans creux, pas de sommet. L\'impact du drop vient de l\'absence qui le précède.',ref:'Tension / relâchement'},
 {l:'Application',q:'Ta boucle de 8 mesures est complète et sonne bien. Quelle est la méthode la plus rapide pour en faire un morceau ?',o:['La dupliquer sur 5 minutes puis supprimer des éléments pour sculpter les sections','Composer une nouvelle boucle pour chaque section','Ajouter des pistes jusqu\'à ce que ça dure 5 minutes','Ralentir le tempo'],e:'C\'est l\'arrangement soustractif : on part du moment le plus dense (le drop final) et on enlève pour créer intro, break et outro.',ref:'l\'exercice Ableton'},
 {l:'Compréhension',q:`À quoi sert un riser ?`,o:[`À annoncer une nouvelle section en faisant monter la tension`,`À augmenter le volume du master`,`À remplacer la ligne de basse`,`À corriger le tempo`],e:`Hauteur et volume qui montent : l'auditeur comprend que quelque chose arrive, et l'attend.`,ref:`les outils de transition`},
 {l:'Compréhension',q:`Pourquoi tout couper pendant un temps juste avant le drop ?`,o:[`Le silence crée le contraste maximal et renforce l'impact`,`Pour laisser le limiteur se reposer`,`Pour que le DJ puisse parler`,`Pour éviter un problème de phase`],e:`L'impact est une affaire de différence. Rien ne contraste plus avec « tout » que « rien ».`,ref:`la démo build (silence seul)`},
 {l:'Compréhension',q:`Combien d'éléments peuvent réellement capter l'attention en même temps ?`,o:[`Trois ou quatre`,`Un seul`,`Huit à dix`,`Autant que de pistes`],e:`Rythme, basse, harmonie, voix ou lead. Au-delà, les parties se concurrencent : si un élément entre, un autre devrait sortir.`,ref:`densité et attention`},
 {l:'Application',q:`Tu veux que le drop 2 dépasse le drop 1. Que fais-tu ?`,o:[`Tu gardes un élément en réserve pour le drop 2`,`Tu montes simplement le volume du drop 2`,`Tu rends le drop 1 plus long`,`Tu supprimes le break`],e:`Un lead, une octave de basse, un charley ouvert : ce qui n'a pas encore été entendu fait le sommet.`,ref:`Garde une réserve`},
 {l:'Diagnostic',q:'Ton drop tombe à plat alors que tous les éléments y jouent. Cause la plus probable ?',o:['Ces éléments jouaient déjà juste avant : il n\'y a pas de contraste','Il manque une piste supplémentaire','Le master n\'est pas assez fort','Le tempo est trop lent'],e:'Si la basse et le kick sont déjà là pendant le build, rien ne peut « arriver ». Retire-les 8 mesures avant.',ref:'Contraste et la grille d\'arrangement'}],
sd:[
 {l:'Rappel',q:'Quelle forme d\'onde contient toutes les harmoniques et sonne riche et brillante ?',o:['La dent de scie','Le sinus','Le carré','Le bruit blanc'],e:'Le sinus n\'a que la fondamentale, le carré seulement les harmoniques impaires. La dent de scie est la matière première idéale pour un filtre.',ref:'Forme d\'onde'},
 {l:'Compréhension',q:'Un filtre passe-bas réglé à 300 Hz…',o:['Atténue ce qui est au-dessus de 300 Hz','Atténue ce qui est en dessous de 300 Hz','Booste la zone autour de 300 Hz uniquement','Coupe le volume 300 fois par seconde'],e:'Passe-bas = laisse passer le bas. C\'est la résonance, pas le filtre lui-même, qui accentue la zone autour du cutoff.',ref:'Filtre'},
 {l:'Application',q:'Tu veux transformer une basse percussive en nappe, sans changer de preset. Tu modifies en priorité…',o:['L\'attaque (et la release) de l\'enveloppe, en les allongeant','La forme d\'onde','Le panoramique','La tonalité'],e:'Le caractère percussif ou planant vient de l\'enveloppe de volume. Teste-le dans la démo avec une attaque à 300 ms.',ref:'Enveloppe ADSR'},
 {l:'Compréhension',q:`Un LFO sert à…`,o:[`Faire varier automatiquement un réglage dans le temps`,`Produire les notes graves`,`Filtrer les aigus`,`Augmenter le nombre de voix`],e:`C'est un oscillateur trop lent pour être entendu, utilisé comme une main invisible sur un bouton.`,ref:`la démo LFO`},
 {l:'Compréhension',q:`Un LFO carré calé en 1/16 sur le cutoff produit…`,o:[`Un effet haché, rythmique, synchronisé au tempo`,`Une montée lente sur 16 mesures`,`Un son plus large en stéréo`,`Aucun effet audible`],e:`Le carré bascule brutalement entre ouvert et fermé ; en 1/16, cela découpe le son en doubles-croches.`,ref:`la démo LFO`},
 {l:'Compréhension',q:`Que produit l'unison avec detune ?`,o:[`Un son plus épais et plus large`,`Un son plus grave`,`Un son plus court`,`Un son mono parfaitement stable`],e:`Plusieurs copies légèrement désaccordées battent entre elles : densité, largeur, mouvement.`,ref:`la démo unison`},
 {l:'Application',q:`Tu cherches un son de cloche ou de piano électrique métallique. Quelle synthèse ?`,o:[`FM`,`Soustractive avec un sinus`,`Un passe-bas très fermé`,`De l'unison sur une dent de scie`],e:`La modulation de fréquence génère des harmoniques inharmoniques, typiques des timbres métalliques. Dans Live : Operator.`,ref:`quatre familles de synthèse`},
 {l:'Application',q:`Tu as mis 7 voix d'unison très désaccordées sur ta basse. Le grave est flou et instable. Pourquoi ?`,o:[`Les voix désaccordées s'annulent par moments dans le grave : le sub doit rester une voix unique et mono`,`Il n'y a pas assez de voix`,`Le cutoff est trop bas`,`Le tempo est trop rapide`],e:`Les battements entre voix créent des trous de niveau, très audibles dans le grave. Unison sur la couche médium, sub séparé et mono.`,ref:`la méthode, étape 6`},
 {l:'Diagnostic',q:'Ton synthé lead est agressif et masque la voix. Premier geste côté sound design ?',o:['Baisser le cutoff du passe-bas','Augmenter la résonance','Passer du sinus à la dent de scie','Raccourcir la release'],e:'L\'agressivité vient des harmoniques aiguës : baisser le cutoff les retire à la source, avant même de toucher au mix.',ref:'Filtre'}],
voix:[
 {l:'Rappel',q:`Dans un vocoder, la voix joue le rôle de…`,o:[`Modulateur`,`Porteuse`,`Limiteur`,`Métronome`],e:`La voix module le synthé : elle lui impose son articulation, bande par bande.`,ref:`Vocoder : modulateur et porteuse`},
 {l:'Rappel',q:`Qu'est-ce qui détermine les notes entendues à la sortie d'un vocoder ?`,o:[`La porteuse (le synthé)`,`La mélodie chantée dans le micro`,`Le nombre de bandes`,`Le tempo`],e:`La voix ne fournit que l'articulation. Tu peux parler d'une voix monocorde : les notes viennent du clavier.`,ref:`Qui décide de quoi`},
 {l:'Compréhension',q:`Qu'est-ce qui distingue un « a » d'un « i » chantés sur la même note ?`,o:[`Les formants, des pics de résonance liés à la forme de la bouche`,`Le volume`,`La fréquence fondamentale`,`La réverbe de la pièce`],e:`La source (cordes vocales) est la même ; c'est le filtre (la bouche) qui change. La démo des voyelles le montre avec trois filtres.`,ref:`la démo des voyelles`},
 {l:'Compréhension',q:`Quel est l'effet du nombre de bandes d'un vocoder ?`,o:[`Peu de bandes : robotique et flou. Beaucoup : précis et intelligible`,`Plus de bandes = plus de volume`,`Plus de bandes = son plus grave`,`Aucun effet audible`],e:`Chaque bande est un « pixel » du spectre de la voix. 8 à 16 donne le grain rétro, 32 à 40 la clarté moderne.`,ref:`la démo vocoder (4 contre 32 bandes)`},
 {l:'Compréhension',q:`Pourquoi les « s », « t », « ch » passent-ils mal dans un vocoder ?`,o:[`Ce sont des bruits sans hauteur, qu'une porteuse harmonique restitue mal`,`Ils sont trop graves`,`Le micro ne les capte pas`,`Ils sont supprimés par le limiteur`],e:`Les consonnes non voisées sont du bruit large bande. La solution : ajouter du bruit à la porteuse à ces instants, c'est le rôle du réglage Unvoiced.`,ref:`Voisé / non voisé`},
 {l:'Compréhension',q:`Différence entre un vocoder et une correction de hauteur type Auto-Tune ?`,o:[`Le vocoder remplace la source sonore par un synthé ; la correction garde la voix et recale sa hauteur`,`Aucune, ce sont deux noms du même effet`,`Le vocoder ne fonctionne qu'en mono`,`La correction de hauteur ajoute des accords`],e:`Avec un vocoder tu n'entends plus les cordes vocales du chanteur, seulement son articulation. Avec la correction, c'est toujours sa voix.`,ref:`quatre effets qu'on confond`},
 {l:'Application',q:`Ton vocoder sonne sourd et incompréhensible. La porteuse est un sinus grave. Correction ?`,o:[`Une porteuse riche en harmoniques : dent de scie, en accords tenus`,`Augmenter le volume de la voix`,`Ajouter de la réverbe`,`Réduire le nombre de bandes à 4`],e:`Le vocoder sculpte des harmoniques existantes. Un sinus n'en a aucune : il n'y a rien à sculpter entre 300 Hz et 3 kHz.`,ref:`l'erreur classique`},
 {l:'Application',q:`Sur une voix lead, où placer le passe-haut ?`,o:[`Vers 80–100 Hz`,`Vers 1 kHz`,`Vers 20 Hz, donc inutile`,`Vers 500 Hz systématiquement`],e:`Sous 80–100 Hz, une voix ne contient que des bruits de manipulation, des plosives et du ronflement.`,ref:`la chaîne d'une voix lead, étape 1`},
 {l:'Diagnostic',q:`Des mots entiers disparaissent de ta voix vocodée quand le chanteur chante doucement. Que fais-tu ?`,o:[`Tu compresses la voix avant le vocoder pour stabiliser son niveau`,`Tu ajoutes des bandes`,`Tu changes la tonalité de la porteuse`,`Tu montes la réverbe`],e:`Le niveau de la voix ouvre les bandes. Voix faible = bandes fermées = silence. Un modulateur régulier est la condition d'un vocoder lisible.`,ref:`rendre un vocoder intelligible`}],
mix:[
 {l:'Rappel',q:'Quel est le premier outil du mixage, avant tout plugin ?',o:['Les faders de volume','Le compresseur','La réverbe','Le limiteur'],e:'La balance des volumes fait l\'essentiel d\'un mix. Un plugin ne rattrape pas une balance bancale.',ref:'Balance des volumes'},
 {l:'Compréhension',q:'Pourquoi mettre un passe-haut sur les voix, nappes et charleys ?',o:['Pour retirer des graves inutiles qui s\'accumulent et gênent kick et basse','Pour les rendre plus forts','Pour ajouter de la brillance','Pour les rendre mono'],e:'Chaque piste apporte un peu de grave inaudible seul ; additionnés, ils brouillent le bas du spectre.',ref:'EQ soustractive'},
 {l:'Application',q:'Kick et basse se marchent dessus autour de 60 Hz. Que fais-tu ?',o:['Tu attribues le sub à l\'un des deux et tu creuses l\'autre à cet endroit','Tu boostes 60 Hz sur les deux','Tu ajoutes de la réverbe sur la basse','Tu panoramises la basse à gauche'],e:'Deux sources ne peuvent pas dominer la même zone. On décide qui possède le sub et on creuse l\'autre. Le grave reste au centre.',ref:'l\'exemple kick / basse'},
 {l:'Compréhension',q:'Tu veux ajouter de la brillance à toute la zone aiguë d\'une voix, de façon naturelle. Quel filtre ?',o:['Un plateau (shelf) haut','Un notch','Un passe-haut','Une cloche très étroite à 10 kHz'],e:'Le shelf monte tout ce qui est au-delà d\'une fréquence, en douceur. Une cloche étroite créerait une résonance artificielle.',ref:'les 5 formes de filtre'},
 {l:'Compréhension',q:'Quelle est la bonne règle pour le réglage du Q ?',o:['Coupes étroites, boosts larges','Coupes larges, boosts étroits','Toujours le Q le plus élevé possible','Le Q n\'a pas d\'effet audible'],e:'Une coupe étroite retire un défaut sans abîmer le reste. Un boost étroit sonne résonant et artificiel ; large, il reste naturel.',ref:'la règle du Q'},
 {l:'Application',q:'Comment localiser précisément une fréquence gênante dans un son ?',o:['Cloche étroite à +10 dB, balayer le spectre, puis couper là où c\'est le plus désagréable','Couper au hasard jusqu\'à ce que ça s\'améliore','Mettre la piste en solo et monter le volume','Ajouter de la réverbe pour la masquer'],e:'C\'est la technique du balayage : on exagère pour trouver, puis on inverse le gain avec modération (−3 à −6 dB).',ref:'la méthode, étape 3'},
 {l:'Application',q:'Dans la démo, la nappe égalisée paraît maigre en solo mais le mix sonne mieux. Conclusion ?',o:['C\'est normal : on juge un réglage d\'EQ dans le mix, pas en solo','Il faut annuler l\'EQ : la nappe doit être belle seule','Il faut remonter le grave de la nappe','Il faut baisser le kick'],e:'Chaque piste n\'a besoin que de sa part du spectre. Un son « complet » en solo est souvent un son encombrant dans le mix.',ref:'la démo EQ en contexte'},
 {l:'Diagnostic',q:'Ton mix sonne « boueux », sans définition. Quelle zone inspecter en premier ?',o:['Le bas-médium, 250–500 Hz','L\'air, 12–20 kHz','Le haut-médium, 2–6 kHz','Le sub, 20–60 Hz'],e:'C\'est la zone où presque tous les instruments s\'accumulent. Un creux léger sur les nappes et guitares clarifie souvent tout.',ref:'la carte des fréquences'}],
comp:[
 {l:'Rappel',q:'Le threshold d\'un compresseur, c\'est…',o:['Le niveau à partir duquel il commence à agir','La vitesse à laquelle il réagit','Le volume ajouté en sortie','La fréquence qu\'il traite'],e:'En dessous du seuil, le compresseur ne fait rien. La vitesse, c\'est l\'attaque ; le volume de sortie, le make-up.',ref:'Threshold'},
 {l:'Compréhension',q:'Ratio 4:1. Le signal dépasse le seuil de 8 dB. De combien dépasse-t-il en sortie ?',o:['2 dB','4 dB','8 dB','32 dB'],e:'8 ÷ 4 = 2. Le dépassement est divisé par le ratio.',ref:'Ratio'},
 {l:'Application',q:'Tu veux contrôler la caisse claire tout en gardant son punch. Quelle attaque ?',o:['Lente, 20–30 ms','La plus rapide possible','Peu importe, seul le ratio compte','Identique à la release'],e:'Une attaque lente laisse passer la frappe initiale (le transitoire) avant de compresser le corps du son.',ref:'Attaque, à vérifier dans la démo'},
 {l:'Application',q:'Pour obtenir le « pumping » french house sur une nappe, le compresseur est…',o:['Posé sur la nappe et déclenché par le kick','Posé sur le kick et déclenché par la nappe','Posé sur le master sans sidechain','Remplacé par une réverbe'],e:'Sidechain : le compresseur traite la nappe mais écoute le kick. À chaque kick, la nappe s\'efface puis revient.',ref:'la démo sidechain'},
 {l:'Compréhension',q:`La compression parallèle consiste à…`,o:[`Mélanger le signal intact avec une copie très compressée`,`Enchaîner deux compresseurs l'un après l'autre`,`Compresser gauche et droite séparément`,`Compresser uniquement les aigus`],e:`On garde les frappes du signal d'origine et on ajoute dessous la densité de la copie écrasée.`,ref:`la démo compression parallèle`},
 {l:'Compréhension',q:`Quel caractère de compresseur choisir pour « coller » un bus batterie ou un mix ?`,o:[`VCA de bus, type Glue Compressor`,`Un FET poussé à fond`,`Un noise gate`,`Aucun : un bus ne se compresse jamais`],e:`Précis et transparent, avec 2–3 dB de réduction : il lie les éléments sans imposer de couleur agressive.`,ref:`quatre caractères de compresseur`},
 {l:'Application',q:`Pourquoi commencer le réglage avec un seuil très bas et un ratio élevé ?`,o:[`Pour entendre clairement l'effet de l'attaque et du release avant de doser`,`Parce que c'est le réglage final recommandé`,`Pour protéger les enceintes`,`Pour gagner du volume`],e:`À 1–2 dB de réduction, les réglages de temps sont presque inaudibles. On exagère pour régler, puis on revient à la raison.`,ref:`la méthode, étape 2`},
 {l:'Diagnostic',q:'La version compressée te semble meilleure, mais elle est aussi plus forte. Que fais-tu ?',o:['Tu compares à volume égal avant de décider','Tu la gardes : plus fort, c\'est mieux','Tu augmentes encore le ratio','Tu ajoutes un second compresseur'],e:'L\'oreille préfère presque toujours le plus fort. Ajuste le make-up pour que bypass on/off soient au même niveau, puis juge.',ref:'l\'erreur classique'}],
space:[
 {l:'Rappel',q:'Dans un mix, un son sec (sans réverbe) est perçu comme…',o:['Proche','Lointain','Plus grave','Plus large'],e:'La réverbe est un indice de distance : plus il y en a, plus la source semble loin.',ref:'Réverbe'},
 {l:'Compréhension',q:'À quoi sert le pre-delay d\'une réverbe ?',o:['À séparer le son direct de la réverbe pour qu\'il reste devant','À rallonger la queue de réverbe','À caler la réverbe sur la tonalité','À réduire l\'usage CPU'],e:'20–40 ms de silence avant la réverbe : le cerveau perçoit d\'abord la voix nette, puis l\'espace derrière.',ref:'Pre-delay'},
 {l:'Application',q:'À 120 BPM, combien dure une croche (1/8) ?',o:['250 ms','500 ms','125 ms','375 ms'],e:'Noire = 60 000 ÷ 120 = 500 ms. La croche vaut la moitié : 250 ms. 375 ms serait la croche pointée.',ref:'le calculateur de delay'},
 {l:'Compréhension',q:`Quelle réverbe est le choix classique pour une voix ou une caisse claire : dense, brillante, 1 à 2 s ?`,o:[`Plate`,`Spring`,`Hall de 5 s`,`Aucune, elles doivent rester sèches`],e:`La plate donne de la tenue et de l'éclat sans dessiner une pièce identifiable, donc sans éloigner la source.`,ref:`quatre types de réverbe`},
 {l:'Compréhension',q:`Sur un delay, le feedback règle…`,o:[`Le nombre de répétitions`,`Le temps entre les répétitions`,`Le volume du signal sec`,`La largeur stéréo`],e:`Une partie de la sortie est réinjectée à l'entrée : plus il y en a, plus les échos durent. Proche de 100 %, ils ne s'éteignent plus.`,ref:`la démo delay`},
 {l:'Compréhension',q:`Pourquoi assombrir (passe-bas) les répétitions d'un delay ?`,o:[`Pour qu'elles reculent derrière la source, comme un écho naturel`,`Pour les rendre plus fortes`,`Pour les accélérer`,`Pour économiser du CPU`],e:`Dans la nature, un écho perd ses aigus. Des répétitions aussi brillantes que l'original se battent avec lui.`,ref:`la démo delay`},
 {l:'Application',q:`Couplet dense : la voix doit avoir de l'espace sans être noyée. Tu privilégies…`,o:[`Un delay discret plutôt qu'une réverbe longue`,`Un hall de 4 s à fort niveau`,`Une réverbe en insert à 100 %`,`Aucun effet, et tu montes la voix de 6 dB`],e:`Le delay remplit les silences entre les mots et laisse les mots eux-mêmes nets ; la réverbe longue ajoute un voile continu.`,ref:`la méthode, étape 5`},
 {l:'Diagnostic',q:'Mix flou, bas du spectre chargé, et une réverbe différente en insert sur chaque piste. Quelle correction ?',o:['Une réverbe commune sur un retour, avec un passe-haut sur ce retour','Allonger le decay de chaque réverbe','Ajouter aussi de la réverbe sur le kick et la basse','Monter le volume général'],e:'Un lieu partagé donne de la cohérence, et le passe-haut empêche la réverbe d\'ajouter de la boue. Kick et basse restent secs.',ref:'Send / retour'}],
master:[
 {l:'Rappel',q:'Que mesure le LUFS ?',o:['Le volume perçu, moyenné dans le temps','Le niveau de crête instantané','La largeur stéréo','Le nombre de pistes'],e:'Le crête-mètre voit les pics ; le LUFS reflète ce que l\'oreille ressent comme « fort ». C\'est l\'unité des plateformes.',ref:'LUFS'},
 {l:'Compréhension',q:'Pourquoi régler le plafond du limiteur à −1 dBTP plutôt qu\'à 0 ?',o:['L\'encodage MP3/AAC peut recréer des crêtes plus hautes','Pour gagner 1 dB de volume','Parce que les plateformes refusent les fichiers à 0 dB','Pour élargir la stéréo'],e:'La compression avec pertes modifie la forme d\'onde : sans marge, certaines crêtes dépassent 0 et saturent à la lecture.',ref:'Limiteur & true peak'},
 {l:'Application',q:'Ton master est à −8 LUFS. Sur une plateforme qui normalise à −14 LUFS, il sera…',o:['Baissé d\'environ 6 dB','Monté d\'environ 6 dB','Lu tel quel, plus fort que les autres','Refusé'],e:'−14 − (−8) = −6 dB. Il sera lu au même niveau que les autres, mais avec la dynamique que tu as écrasée.',ref:'le simulateur LUFS'},
 {l:'Compréhension',q:`Dans une chaîne de mastering, le limiteur se place…`,o:[`En dernier (avant un éventuel dither)`,`En premier`,`Juste avant l'EQ`,`Peu importe`],e:`Tout traitement placé après lui peut recréer des crêtes au-dessus du plafond qu'il garantit.`,ref:`la chaîne, dans l'ordre`},
 {l:'Compréhension',q:`Pourquoi contrôler son mix en mono ?`,o:[`Pour détecter les éléments qui s'annulent par opposition de phase`,`Parce que le streaming diffuse en mono`,`Pour gagner du volume`,`Pour réduire la taille du fichier`],e:`Ce qui est large par inversion de phase disparaît quand gauche et droite s'additionnent, comme sur beaucoup de petits systèmes.`,ref:`la démo compatibilité mono`},
 {l:'Application',q:`Quel mix envoyer au mastering ?`,o:[`Crêtes vers −6 dB, sans limiteur sur le master, en WAV 24 bits`,`Le plus fort possible, déjà limité`,`Un MP3 320 kbps`,`Normalisé à 0 dB avec un maximiseur`],e:`La marge laisse de la place aux traitements, et un fichier sans pertes évite d'empiler les dégradations.`,ref:`avant de masteriser`},
 {l:'Application',q:`À volume compensé, la version au limiteur poussé ne sonne pas mieux que l'originale. Conclusion ?`,o:[`Le gain était une illusion de volume : tu reviens en arrière`,`Il faut pousser encore davantage`,`Il faut désactiver la compensation`,`Il faut ajouter un second limiteur`],e:`Si l'avantage disparaît à niveau égal, il ne reste que les inconvénients : transitoires aplatis et fatigue d'écoute.`,ref:`la démo limiteur`},
 {l:'Diagnostic',q:'Après le limiteur, ton kick a perdu son impact. Que fais-tu ?',o:['Tu réduis le gain d\'entrée du limiteur : il écrase les transitoires','Tu pousses encore le limiteur','Tu ajoutes des aigus sur le master','Tu passes le morceau en mono'],e:'Au-delà de quelques dB de réduction, ce sont les transitoires qui disparaissent en premier. Moins fort, mais vivant.',ref:'l\'erreur classique'}],
'style:disco':[
 {l:'Rappel',q:`En disco, où tombe le charley ouvert ?`,o:[`Sur chaque contretemps`,`Sur chaque temps, avec le kick`,`Uniquement sur le temps 4`,`Sur les temps 2 et 4`],e:`Kick sur le temps, charley ouvert sur le « et » : l'alternance qui sera reprise telle quelle par la house.`,ref:`Disco · Batterie`},
 {l:'Compréhension',q:`Quel est le geste de basse le plus typique du disco ?`,o:[`Fondamentale et octave alternées en croches`,`Une note tenue par accord`,`Une 808 longue avec des glissés`,`Des doubles-croches partout sauf sur le kick`],e:`Deux notes, une énergie maximale. C'est aussi une ligne très lisible sur n'importe quel système.`,ref:`Disco · Basse`},
 {l:'Application',q:`Comment écrire des cordes disco ?`,o:[`En phrases qui entrent et sortent, par blocs de 4 ou 8 mesures`,`En nappe continue du début à la fin`,`À l'unisson avec la basse`,`Uniquement dans l'intro`],e:`Les cordes phrasent et ponctuent. Une nappe permanente bouche le médium et supprime tout effet d'entrée.`,ref:`Disco · Harmonie et instruments`},
 {l:'Diagnostic',q:`Ta production disco sonne rigide et synthétique. Cause la plus probable ?`,o:[`Tout est quantifié à 100 % avec des vélocités plates`,`Le tempo est trop lent`,`Il manque une 808`,`Il n'y a pas assez de sidechain`],e:`Le disco est une musique jouée : micro-écarts de placement et vélocités vivantes font la différence, avant tout choix de sons.`,ref:`Disco · Pièges`}],
'style:nudisco':[
 {l:'Rappel',q:`Quelle est la plage de tempo typique du nu-disco ?`,o:[`110–122 BPM`,`125–135 BPM`,`85–95 BPM`,`170–175 BPM`],e:`Plus lent que la house : c'est ce tempo retenu qui donne son côté nonchalant au groove.`,ref:`Nu Disco · Carte d'identité`},
 {l:'Compréhension',q:`Quelle différence de sidechain entre nu-disco et French Touch ?`,o:[`Dosé pour faire rebondir en nu-disco, profond pour faire pomper en French Touch`,`Aucune, c'est le même réglage`,`Le nu-disco n'en utilise jamais`,`La French Touch le place sur le kick`],e:`3 à 6 dB de réduction contre 8 à 12 dB : même outil, intention opposée.`,ref:`Nu Disco · Signature sonore`},
 {l:'Application',q:`Comment obtenir la batterie typique du nu-disco ?`,o:[`Un squelette programmé, doublé par des boucles de percussions réelles`,`Uniquement un break échantillonné accéléré`,`Une boîte à rythmes seule, sans swing`,`Une batterie acoustique enregistrée en une prise`],e:`Le mélange machine / humain est la signature : la précision du kick programmé, la vie du tambourin et des congas.`,ref:`Nu Disco · Batterie`},
 {l:'Diagnostic',q:`Ton morceau nu-disco à 126 BPM sonne comme de la house. Que fais-tu ?`,o:[`Tu ralentis sous 122 BPM`,`Tu ajoutes du sidechain`,`Tu retires la basse`,`Tu ajoutes des roulements de charleys`],e:`Au-delà de 122 BPM, le groove se tend et bascule dans la house. Le style tient d'abord à son tempo.`,ref:`Nu Disco · Pièges`}],
'style:french':[
 {l:'Rappel',q:`En French Touch, quel est l'« instrument » principal ?`,o:[`Le filtre, automatisé en continu`,`Le piano`,`La 808`,`La guitare solo`],e:`La boucle ne change pas : c'est l'ouverture et la fermeture du filtre qui racontent le morceau.`,ref:`French Touch · Le filtre`},
 {l:'Compréhension',q:`Quelle est la longueur typique de la boucle en French Touch ?`,o:[`Une à deux mesures`,`Seize mesures`,`Un couplet entier`,`Une demi-seconde`],e:`Assez courte pour devenir hypnotique, assez longue pour contenir une syncope à la reprise.`,ref:`French Touch · La boucle`},
 {l:'Application',q:`Comment régler le sidechain pour obtenir le pompage French Touch ?`,o:[`8 à 12 dB de réduction, release calé pour que le son revienne juste avant le kick suivant`,`1 dB de réduction, release très long`,`Sur le kick, déclenché par la nappe`,`Uniquement sur les charleys`],e:`Profond et rythmique : le son s'efface à chaque kick et remonte dans l'intervalle. Tout sauf la batterie y passe.`,ref:`French Touch · Signature sonore`},
 {l:'Diagnostic',q:`Tu veux publier un morceau bâti sur un extrait d'un disque des années 70. Que faut-il faire ?`,o:[`Obtenir l'autorisation des ayants droit, ou rejouer la boucle, ou partir d'un pack libre de droits`,`Rien, en dessous de 5 secondes c'est libre`,`Filtrer l'extrait suffit à le rendre légal`,`Le ralentir de 2 BPM`],e:`Aucune durée n'est « libre » par défaut, et transformer l'extrait ne change pas son statut. Information générale, pas un avis juridique.`,ref:`French Touch · Pièges`}],
'style:hiphop':[
 {l:'Rappel',q:`Dans le hip-hop d'influence trap, où tombe la caisse claire ?`,o:[`Sur le temps 3 (feeling half-time)`,`Sur les temps 2 et 4`,`Sur chaque temps`,`Sur les contretemps`],e:`À 140 BPM avec la caisse claire sur le 3, le morceau se ressent à 70 : c'est le half-time.`,ref:`Hip Hop · Batterie`},
 {l:'Compréhension',q:`Quel est le rôle de la 808 dans un beat hip-hop ?`,o:[`Elle sert de basse et d'une partie du kick, accordée sur la tonalité`,`Elle remplace les charleys`,`Elle joue la mélodie principale dans l'aigu`,`Elle sert uniquement de transition`],e:`C'est une note : elle doit être dans la tonalité du morceau, comme n'importe quelle basse.`,ref:`Hip Hop · La 808`},
 {l:'Application',q:`Comment obtenir un glissé entre deux notes de 808 dans Live ?`,o:[`Glide activé en mode mono legato, avec deux notes qui se chevauchent`,`En automatisant le volume`,`En ajoutant un delay`,`En doublant la piste`],e:`En legato, la seconde note ne redéclenche pas l'attaque : la hauteur glisse de l'une à l'autre.`,ref:`Hip Hop · Dans Ableton Live`},
 {l:'Diagnostic',q:`Le grave de ton beat hip-hop est une bouillie. Cause la plus probable ?`,o:[`Un kick long superposé à une 808 longue`,`Trop de roulements de charleys`,`Une caisse claire trop forte`,`Un tempo trop rapide`],e:`Deux sons longs dans la même zone. Kick court par-dessus la 808, avec un léger sidechain de la 808 par le kick.`,ref:`Hip Hop · Pièges`}],
'style:boombap':[
 {l:'Rappel',q:`Quel swing caractérise le boom bap ?`,o:[`Marqué, 58–66 %`,`Aucun, 50 %`,`Très léger, 51–52 %`,`Variable à chaque mesure`],e:`C'est le swing des samplers à pads, nettement audible, qui fait traîner le beat.`,ref:`Boom Bap · Le swing`},
 {l:'Compréhension',q:`En boom bap, pourquoi filtrer le sample en passe-bas ?`,o:[`Pour laisser la place à la voix et à la batterie`,`Pour le rendre plus fort`,`Pour le rendre légal`,`Pour accélérer le tempo`],e:`Le sample devient un fond chaud et mat ; le haut du spectre reste libre pour la caisse claire et le rappeur.`,ref:`Boom Bap · Le sample`},
 {l:'Application',q:`Comment obtenir le feeling « paresseux » d'une batterie boom bap ?`,o:[`Laisser la caisse claire quelques millisecondes en retard, sans la quantifier`,`Accélérer le tempo`,`Mettre toutes les vélocités au maximum`,`Ajouter des roulements de charleys`],e:`Un retard constant de la caisse claire donne l'impression que le batteur tire en arrière, sans que le tempo bouge.`,ref:`Boom Bap · Le swing`},
 {l:'Diagnostic',q:`Ton beat boom bap sonne trop propre et moderne. Correction ?`,o:[`Sons tirés de vrais breaks, réduction de résolution, saturation, moins d'extrême aigu`,`Ajouter un sub très profond`,`Élargir la stéréo`,`Monter le niveau du master`],e:`Le style est défini par son grain : samplers 12 bits, vinyle, médiums en avant.`,ref:`Boom Bap · Signature sonore`}],
'style:pop':[
 {l:'Rappel',q:`En pop actuelle, quand doit arriver le premier refrain ?`,o:[`Avant 45 secondes environ`,`Après 2 minutes`,`Jamais avant le pont`,`À la toute fin`],e:`Intro très courte, couplet, pré-refrain, refrain : l'auditeur doit avoir entendu le hook avant de décrocher.`,ref:`Pop · La forme`},
 {l:'Compréhension',q:`À quoi sert le pré-refrain ?`,o:[`À faire monter la tension pour que le refrain la libère`,`À présenter les musiciens`,`À remplacer le pont`,`À ralentir le morceau`],e:`C'est une rampe : harmonie en suspens, montée de densité, parfois un vide juste avant le refrain.`,ref:`Pop · La forme`},
 {l:'Application',q:`Comment faire « décoller » un refrain pop ?`,o:[`Plus large (doublages panoramisés), plus dense et plus aigu que le couplet`,`Exactement la même production, en plus fort`,`Retirer la voix`,`Baisser le tempo`],e:`Le contraste fait le refrain : couplet étroit et dépouillé, refrain large et plein.`,ref:`Pop · Le contraste couplet / refrain`},
 {l:'Diagnostic',q:`Pendant le couplet, un lead de synthé se bat avec la voix. Que fais-tu ?`,o:[`Tu le retires ou tu le déplaces dans les trous du chant`,`Tu montes les deux de 3 dB`,`Tu ajoutes de la réverbe sur la voix`,`Tu élargis le synthé`],e:`Rien ne doit concurrencer la voix entre 1 et 4 kHz quand elle chante. C'est un problème d'arrangement avant d'être un problème de mix.`,ref:`Pop · Arrangement`}],
'style:house':[
 {l:'Rappel',q:`Qu'est-ce qui distingue une house d'une simple pulsation kick / clap ?`,o:[`Des charleys et percussions légèrement swingués`,`Un tempo supérieur à 140 BPM`,`L'absence de basse`,`Une caisse claire sur le temps 3`],e:`Le balancement des doubles-croches, entre 54 et 60 %, est ce qui fait « rouler » la house.`,ref:`House · Batterie`},
 {l:'Compréhension',q:`Que sont les accords parallèles ?`,o:[`Un même accord déplacé tel quel vers d'autres fondamentales`,`Deux accords joués en même temps`,`Des accords joués à l'octave`,`Une progression de huit accords différents`],e:`Hérité des samplers et du device Chord : on transpose l'accord entier, sans l'adapter à la gamme.`,ref:`House · Les accords`},
 {l:'Application',q:`Quelle introduction pour un morceau house destiné aux DJ ?`,o:[`16 à 32 mesures de rythmique seule`,`Moins de 10 secondes`,`Un couplet chanté a cappella`,`Aucune, on commence par le drop`],e:`Le DJ a besoin de temps et d'éléments stables pour caler et superposer les deux morceaux.`,ref:`House · Pièges`},
 {l:'Diagnostic',q:`Ta progression house de huit accords casse l'effet hypnotique. Que fais-tu ?`,o:[`Tu la réduis à deux accords bien voicés`,`Tu en ajoutes quatre`,`Tu changes de tonalité à chaque section`,`Tu retires le kick`],e:`L'hypnose vient de la répétition. La richesse se joue dans le voicing et le son, pas dans le nombre d'accords.`,ref:`House · Pièges`}],
'style:techno':[
 {l:'Rappel',q:`En techno, qu'est-ce que le rumble ?`,o:[`Un grondement grave entre les kicks, issu du kick réverbéré et filtré`,`Un roulement de caisse claire`,`Une mélodie au piano`,`Un effet de voix`],e:`Il joue le rôle de la basse sans jouer de notes, et s'efface à chaque frappe de kick.`,ref:`Techno · Le rumble`},
 {l:'Compréhension',q:`Qu'est-ce qui « compose » un morceau techno ?`,o:[`La modulation lente des réglages : cutoff, decay, réverbe`,`Une progression d'accords complexe`,`Les paroles`,`Les changements de tempo`],e:`Le matériau est minimal et fixe. C'est son évolution continue qui crée le récit.`,ref:`Techno · Le synthé`},
 {l:'Application',q:`Dans quel ordre construire un rumble ?`,o:[`Send du kick → réverbe → passe-bas vers 120 Hz → sidechain par le kick → saturation`,`Saturation → limiteur → kick`,`Réverbe sur le master`,`Passe-haut à 120 Hz puis delay`],e:`La réverbe fabrique la matière, le passe-bas ne garde que le grave, le sidechain la fait disparaître sous le kick.`,ref:`Techno · Dans Ableton Live`},
 {l:'Diagnostic',q:`Ta boucle techno de 8 mesures répétée 40 fois est ennuyeuse. Correction ?`,o:[`Moduler lentement ses réglages, sans ajouter de mélodie`,`Ajouter une mélodie et des accords`,`Monter le tempo à 170`,`Ajouter une voix pop`],e:`La différence entre hypnotique et ennuyeux, c'est le mouvement. Une mélodie ferait sortir du style.`,ref:`Techno · Pièges`}],
'style:funk':[
 {l:'Rappel',q:`Que désigne « The One » ?`,o:[`L'accent commun de tous les musiciens sur le premier temps de la mesure`,`Le premier morceau d'un album`,`Un accord à une seule note`,`Le solo de batterie`],e:`Tout le monde se retrouve sur le « un », et syncope librement entre deux. C'est ce qui tient l'édifice.`,ref:`Funk · « The One »`},
 {l:'Compréhension',q:`En funk, deux instruments jouent exactement le même rythme. Conclusion ?`,o:[`L'un des deux est de trop`,`C'est idéal, ça renforce le groove`,`Il faut en ajouter un troisième`,`Il faut les panoramiser au centre`],e:`Le funk est un emboîtement : chaque partie occupe les doubles-croches que les autres laissent libres.`,ref:`Funk · Arrangement`},
 {l:'Application',q:`Comment jouer la guitare rythmique funk ?`,o:[`Deux ou trois cordes étouffées en doubles-croches, jamais l'accord entier`,`De grands accords ouverts tenus`,`Des arpèges lents avec beaucoup de réverbe`,`Des power chords saturés`],e:`Percussive et fine : elle ajoute du rythme sans boucher le médium.`,ref:`Funk · Guitare et claviers`},
 {l:'Diagnostic',q:`Après une forte compression du bus batterie, ton groove funk a disparu. Pourquoi ?`,o:[`La compression a nivelé les ghost notes et les accents`,`Le tempo a changé`,`Le swing a été supprimé`,`La basse est devenue mono`],e:`Le groove funk vit dans l'écart entre accents et ghost notes. Remonter les unes et écraser les autres l'aplatit.`,ref:`Funk · Mix et master`}],
'style:electrofunk':[
 {l:'Rappel',q:`Quels sons de batterie définissent l'électro-funk ?`,o:[`Des boîtes à rythmes : type 808 et LinnDrum`,`Un break de jazz échantillonné`,`Une batterie acoustique avec balais`,`Uniquement des percussions à main`],e:`Le timbre des machines du début des années 80 fait partie de l'identité du style, cowbell comprise.`,ref:`Electro-funk · Batterie`},
 {l:'Compréhension',q:`Comment la basse électro-funk est-elle conçue ?`,o:[`Un synthé joué comme une basse slap : octaves, syncopes, glissés`,`Une contrebasse jouée à l'archet`,`Un sub sinus tenu`,`Elle est absente`],e:`Le phrasé vient du funk, le son vient du synthétiseur : filtre à enveloppe rapide, résonance, glide.`,ref:`Electro-funk · Basse`},
 {l:'Application',q:`Comment traiter le lead vocal pour rester dans le style électro-funk ?`,o:[`Talk-box ou vocoder, avec une porteuse riche, et une voix intelligible`,`Voix naturelle noyée dans un hall`,`Voix pitchée très aiguë`,`Voix uniquement parlée, sans effet`],e:`La voix robotisée est le lead : elle doit rester compréhensible, donc porteuse en dent de scie et articulation exagérée.`,ref:`Electro-funk · Voix`},
 {l:'Diagnostic',q:`Ton morceau sonne comme de l'électro raide, pas comme du funk. Que manque-t-il ?`,o:[`Du swing sur les doubles-croches, vers 54–58 %`,`Plus de distorsion`,`Un tempo plus rapide`,`Moins de basse`],e:`Les sons sont mécaniques, mais le placement doit rester souple. Sans swing, le funk disparaît.`,ref:`Electro-funk · Pièges`}],
'style:synthwave':[
 {l:'Rappel',q:`Quel traitement de caisse claire signe la synthwave ?`,o:[`La réverbe gated`,`Un bitcrusher`,`Un flanger`,`Aucun, elle est sèche`],e:`Une grosse réverbe coupée net après une fraction de seconde : le son de batterie des années 80.`,ref:`Synthwave · Batterie`},
 {l:'Compréhension',q:`Comment se comporte la basse en synthwave ?`,o:[`Croches continues sur la fondamentale, presque sans syncope`,`Notes très longues avec des glissés`,`Ligne slap syncopée`,`Elle ne joue que sur les contretemps`],e:`C'est un moteur régulier. Elle avance, elle ne danse pas.`,ref:`Synthwave · Basse`},
 {l:'Application',q:`Comment fabriquer une réverbe gated dans Live ?`,o:[`Reverb, puis Gate dont le sidechain écoute la caisse claire`,`Gate, puis Limiter`,`Deux delays en série`,`Un chorus sur le master`],e:`Le gate s'ouvre avec la frappe et se referme brutalement : la queue de réverbe est tronquée.`,ref:`Synthwave · Dans Ableton Live`},
 {l:'Diagnostic',q:`Ton mix synthwave est noyé et flou. Correction ?`,o:[`Garder kick et basse secs, et nettoyer le bas-médium des nappes`,`Ajouter une troisième nappe`,`Mettre de la réverbe sur la basse`,`Élargir le kick`],e:`L'espace se réserve au lead, à la caisse claire et aux nappes. Le moteur rythmique reste sec et centré.`,ref:`Synthwave · Mix et master`}],
'style:dnb':[
 {l:'Rappel',q:`Quel est le pattern two-step ?`,o:[`Kick sur le 1, caisse claire sur le 2, kick juste avant le 3, caisse claire sur le 4`,`Kick sur les 4 temps`,`Caisse claire sur le 3 uniquement`,`Deux kicks par temps`],e:`Deux kicks et deux caisses claires par mesure : à 174 BPM, c'est largement suffisant.`,ref:`Drum & bass · Batterie`},
 {l:'Compréhension',q:`D'où vient la tension de la drum & bass ?`,o:[`Du contraste entre une batterie très rapide et un grave lent`,`De changements de tonalité constants`,`De l'absence de basse`,`D'un tempo qui accélère`],e:`La batterie court à 174 BPM, la basse et les nappes avancent à la moitié : rapide et planant à la fois.`,ref:`Drum & bass · Basse`},
 {l:'Application',q:`Comment construire une basse Reese exploitable ?`,o:[`Un sub sinus mono, plus une couche de scies désaccordées coupée sous 120 Hz`,`Sept voix d'unison sur tout le spectre`,`Un seul sinus très saturé`,`Deux subs désaccordés`],e:`Le désaccord fait battre le son : dans le sub, cela crée des trous. On le réserve à la couche médium.`,ref:`Drum & bass · Basse`},
 {l:'Diagnostic',q:`En drum & bass, ta caisse claire disparaît derrière la basse. Pourquoi ?`,o:[`Elle manque de corps vers 200 Hz et la couche médium de la basse la masque`,`Elle est trop courte`,`Le tempo est trop lent`,`Il y a trop de charleys`],e:`La caisse claire doit traverser le mix : du poids en bas, un claquement en haut, et une basse qui lui laisse la place.`,ref:`Drum & bass · La caisse claire`}],
'focus:swing':[
 {l:'Rappel',q:`À quoi correspond un swing de 50 % ?`,o:[`Aucun swing : les doubles-croches sont parfaitement régulières`,`La moitié des notes sont supprimées`,`Un triolet exact`,`Le tempo est divisé par deux`],e:`50 % signifie que la seconde note de chaque paire tombe exactement au milieu. Le triolet exact, lui, correspond à 66,7 %.`,ref:`Swing · l'essentiel`},
 {l:'Rappel',q:`Dans la musique actuelle (hip-hop, house, funk), quelle subdivision swingue-t-on ?`,o:[`Les doubles-croches`,`Les croches`,`Les noires`,`Les rondes`],e:`Le swing de croches donne un shuffle de blues ou de jazz. Presque toute la production actuelle swingue les doubles-croches et laisse les croches droites.`,ref:`Swing · l'essentiel`},
 {l:'Compréhension',q:`Un beat de sampler à pads est quantifié à 100 % avec 62 % de swing. Comment est-ce possible ?`,o:[`On quantifie vers une grille qui est elle-même swinguée`,`C'est impossible, les deux réglages s'annulent`,`Le swing est appliqué uniquement au kick`,`La quantification n'agit que sur les vélocités`],e:`Quantifier, c'est coller à une grille. Rien n'oblige cette grille à être régulière : régulier et balancé ne sont pas contradictoires.`,ref:`Swing · l'essentiel`},
 {l:'Compréhension',q:`Pourquoi 58 % de swing s'entend-il mieux à 90 BPM qu'à 140 BPM ?`,o:[`Le même rapport représente plus de millisecondes à tempo lent`,`Le swing est désactivé au-dessus de 120 BPM`,`Les charleys sont plus forts à tempo lent`,`L'oreille n'entend pas le swing à tempo rapide, quel qu'il soit`],e:`L'oreille perçoit des durées. 8 % d'une paire de doubles-croches font 27 ms à 90 BPM, 17 ms à 140 BPM.`,ref:`Swing · le laboratoire (curseur de tempo)`},
 {l:'Compréhension',q:`Que fait une quantification à 50 % ?`,o:[`Elle rapproche chaque note de la grille en ne faisant que la moitié du chemin`,`Elle quantifie une note sur deux`,`Elle divise le tempo par deux`,`Elle applique 50 % de swing`],e:`On resserre une prise imprécise en conservant une partie du geste du musicien.`,ref:`Swing · l'essentiel`},
 {l:'Application',q:`Tu veux un feeling nonchalant, « assis », sans modifier les notes. Quel geste dans Live ?`,o:[`Un Track Delay positif de 10 à 25 ms sur la piste de caisse claire`,`Monter le tempo`,`Quantifier à 100 % sans swing`,`Ajouter 20 ms d'aléatoire sur toutes les pistes`],e:`Un décalage constant d'un seul instrument s'entend comme un caractère. Au-delà de 30 ms environ, il s'entend comme un flam.`,ref:`Swing · dans Ableton Live`},
 {l:'Application',q:`Comment le hip-hop d'influence trap crée-t-il du mouvement rythmique ?`,o:[`Grille droite, mais roulements de charleys et flows en triolets`,`Swing très élevé sur tous les éléments`,`Aucune quantification`,`Des changements de tempo`],e:`Le contraste entre une grille strictement binaire et des figures en triolets remplace le swing.`,ref:`Swing · le swing dans la musique actuelle`},
 {l:'Diagnostic',q:`Tu as ajouté 15 ms d'aléatoire partout pour « humaniser », et le beat sonne maladroit. Pourquoi ?`,o:[`Un batteur est irrégulier de façon cohérente, pas au hasard : il faut des décalages constants par instrument`,`15 ms, c'est trop peu`,`Il fallait aussi randomiser le tempo`,`L'aléatoire ne fonctionne que sur le kick`],e:`Le groove vient d'une intention répétée : caisse claire toujours un peu tard, charleys toujours un peu tôt. Le hasard pur ne produit que de l'imprécision.`,ref:`Swing · pièges`},
 {l:'Diagnostic',q:`Ta boucle de batterie échantillonnée et tes charleys programmés produisent des flams. Cause probable ?`,o:[`La boucle a son propre swing, différent de celui de tes charleys`,`La boucle est trop forte`,`Le tempo du projet est trop lent`,`Les charleys sont en mono`],e:`Extrais le groove de la boucle et applique-le aux charleys, pour que tout le monde partage la même grille.`,ref:`Swing · dans Ableton Live (Extract Groove)`}],
'era:70s':[
 {l:'Rappel',q:`Sur quel support enregistre-t-on dans les années 70 ?`,o:[`Bande magnétique multipiste, 16 puis 24 pistes`,`Disque dur d'ordinateur`,`Cassettes numériques`,`Directement sur vinyle`],e:`Le nombre de pistes limité impose de décider tôt, et de fusionner des pistes sans retour possible.`,ref:`Années 70 · carte d'identité`},
 {l:'Compréhension',q:`Pourquoi les disques des années 70 sonnent-ils comme des performances ?`,o:[`La section rythmique joue ensemble, dans la même pièce, sans clic systématique`,`Tout est programmé sur séquenceur`,`Les voix sont corrigées note par note`,`Le mastering est très fort`],e:`Le tempo respire, les micros captent un peu de tout le monde, et les décisions sont prises sur le moment.`,ref:`Années 70 · la méthode de travail`},
 {l:'Application',q:`Quel traitement rapproche un mix actuel d'un son années 70 ?`,o:[`Saturation douce, aigus adoucis au-delà de 10–12 kHz, batterie sèche et mate`,`Réverbe gated sur la caisse claire`,`Sidechain profond sur tout le mix`,`Limiteur poussé de 10 dB`],e:`La bande arrondit les aigus et compresse en douceur ; la batterie est étouffée et prise de près, sans réverbe.`,ref:`Années 70 · retrouver ce son aujourd'hui`}],
'era:80s':[
 {l:'Rappel',q:`Quelle norme de 1983 permet à toutes les machines de communiquer ?`,o:[`Le MIDI`,`Le MP3`,`L'USB`,`Le VST`],e:`Un clavier peut piloter plusieurs synthés, un séquenceur peut jouer tout un arrangement : le layering et la programmation se généralisent.`,ref:`Années 80 · la méthode de travail`},
 {l:'Compréhension',q:`Pourquoi le réglage de swing en pourcentage apparaît-il dans les années 80 ?`,o:[`Les boîtes à rythmes quantifient par défaut : il faut réintroduire de la souplesse`,`Les batteurs ne savaient plus jouer`,`La bande magnétique se dérégulait`,`Le CD l'imposait`],e:`Le rythme parfaitement régulier devient la norme. Le « shuffle » est la réponse de leurs concepteurs.`,ref:`Années 80 · les codes sonores`},
 {l:'Application',q:`Quels éléments signent immédiatement une production années 80 ?`,o:[`Caisse claire gated, chorus sur les nappes, cloches et pianos électriques FM`,`Break échantillonné et craquements de vinyle`,`808 avec glissés et roulements de charleys`,`Batterie étouffée et cordes réelles`],e:`De grandes réverbes numériques, des timbres cristallins face à des nappes chaudes, et une précision de machine.`,ref:`Années 80 · les codes sonores`}],
'era:90s':[
 {l:'Rappel',q:`Quel instrument devient central dans les années 90 ?`,o:[`Le sampler`,`Le magnétophone à bande`,`Le synthétiseur FM`,`La correction de hauteur`],e:`On découpe, on boucle, on réordonne : hip-hop, jungle, trip-hop, big beat et French Touch partent du même geste.`,ref:`Années 90 · carte d'identité`},
 {l:'Compréhension',q:`Pourquoi échantillonnait-on parfois un vinyle en 45 tours pour le ralentir ensuite dans le sampler ?`,o:[`Pour économiser la mémoire, très limitée, avec un grain en prime`,`Pour contourner le droit d'auteur`,`Pour accorder le sample`,`Parce que les platines ne lisaient pas le 33 tours`],e:`Un son lu plus vite dure moins longtemps, donc occupe moins de mémoire. Redescendu en hauteur, il perd des aigus : c'est une partie du « grain ».`,ref:`Années 90 · la méthode de travail`},
 {l:'Application',q:`Tu veux un time-stretch au grain années 90 dans Live. Quel mode de Warp éviter ?`,o:[`Complex Pro, trop transparent`,`Beats`,`Texture`,`Re-Pitch`],e:`Les artefacts faisaient partie du son. Beats ou Texture poussés à l'extrême, ou Re-Pitch pour l'effet « vitesse de platine ».`,ref:`Années 90 · retrouver ce son aujourd'hui`}],
'era:00s':[
 {l:'Rappel',q:`Que signifie produire « in the box » ?`,o:[`Tout faire dans l'ordinateur : instruments, effets, mixage`,`Enregistrer dans une cabine insonorisée`,`Utiliser uniquement des boîtes à rythmes`,`Mixer sur une console analogique`],e:`Pistes illimitées, annulation infinie, rappel total : pour la première fois, plus aucune contrainte technique.`,ref:`Années 2000 · carte d'identité`},
 {l:'Compréhension',q:`Quelle est la « contrainte » propre aux années 2000 ?`,o:[`L'abondance : trop de choix, trop de presets, trop de pistes`,`Le nombre de pistes`,`La mémoire des samplers`,`Le prix des machines`],e:`Quand tout est possible et réversible, finir un morceau devient le problème. D'où l'intérêt de s'imposer des limites.`,ref:`Années 2000 · carte d'identité`},
 {l:'Diagnostic',q:`Pourquoi masteriser aujourd'hui aussi fort qu'en 2008 est-il contre-productif ?`,o:[`Les plateformes normalisent le volume : le master écrasé est baissé et sonne plus petit`,`Les limiteurs actuels sont moins bons`,`Le MP3 n'existe plus`,`Les enceintes actuelles saturent plus vite`],e:`À volume égal, il ne reste que les inconvénients : transitoires aplatis et fatigue d'écoute.`,ref:`Années 2000 · pièges`}],
'era:10s':[
 {l:'Rappel',q:`Qu'est-ce qui met fin à la course au volume au milieu des années 2010 ?`,o:[`La normalisation du volume par les plateformes de streaming`,`L'interdiction des limiteurs`,`Le retour du vinyle`,`L'abandon du MP3`],e:`Quand tous les morceaux sont ramenés au même volume perçu, masteriser plus fort ne rapporte plus rien et coûte de la dynamique.`,ref:`Années 2010 · la méthode de travail`},
 {l:'Compréhension',q:`Pourquoi les introductions raccourcissent-elles à l'ère du streaming ?`,o:[`L'auditeur peut zapper instantanément, et une écoute ne compte qu'après une trentaine de secondes`,`Les fichiers doivent être plus légers`,`Les plateformes limitent la durée des morceaux`,`Les DJ n'en ont plus besoin`],e:`Le format suit l'économie de l'attention : hook très tôt, morceaux plus courts.`,ref:`Années 2010 · carte d'identité`},
 {l:'Application',q:`Tu utilises le préréglage OTT de Multiband Dynamics. Comment éviter un son fatigant ?`,o:[`Le doser avec le réglage Amount, et ne pas le mettre sur toutes les pistes`,`Le pousser à 100 % sur le master`,`L'empiler deux fois`,`Le placer avant chaque instrument et sur chaque retour`],e:`Cette compression remonte tous les détails : spectaculaire sur un lead, épuisante quand elle est partout.`,ref:`Années 2010 · pièges`}],
'era:20s':[
 {l:'Rappel',q:`À quoi sert la séparation de stems ?`,o:[`À isoler voix, batterie, basse et le reste à partir d'un fichier déjà mixé`,`À exporter chaque piste d'un projet`,`À élargir la stéréo`,`À corriger la justesse d'une voix`],e:`Un fichier stéréo redevient une matière première : chaque stem peut être découpé, filtré, transposé, rééchantillonné.`,ref:`Années 2020 · la méthode de travail`},
 {l:'Compréhension',q:`Quel est le risque principal de publier une génération par IA telle quelle ?`,o:[`Un résultat compétent mais interchangeable, avec des droits fragiles`,`Un fichier trop volumineux`,`Un tempo instable`,`Une incompatibilité avec les plateformes`],e:`D'où la règle de méthode : au moins une transformation personnelle par élément, rechanter, rejouer, rééchantillonner.`,ref:`Années 2020 · pièges`},
 {l:'Diagnostic',q:`Tu veux sortir commercialement un morceau qui contient des parties générées par IA. Que fais-tu d'abord ?`,o:[`Tu vérifies les conditions d'utilisation commerciale en vigueur pour ton abonnement`,`Rien : tout ce qui est généré est libre de droits`,`Tu accélères le morceau de 5 %`,`Tu le masterises plus fort`],e:`Ces conditions ont changé plusieurs fois depuis 2024, au fil des procès puis des accords entre générateurs et maisons de disques. Information générale, pas un avis juridique.`,ref:`Années 2020 · la méthode de travail`}],
'focus:practices':[
 {l:'Rappel',q:`À quel niveau Spotify normalise-t-il la lecture par défaut ?`,o:[`−14 LUFS intégrés`,`−6 LUFS`,`0 dBFS en crête`,`−23 LUFS`],e:`Un master plus fort est baissé à la lecture ; un master plus faible est remonté, tant que ses crêtes restent sous −1 dB.`,ref:`Pratiques · Mastering & diffusion`},
 {l:'Rappel',q:`Quelle marge en crête vraie Spotify recommande-t-il pour un master plus fort que −14 LUFS ?`,o:[`−2 dBTP`,`0 dBTP`,`−0,1 dBTP`,`−6 dBTP`],e:`−1 dBTP en règle générale, −2 dBTP pour les masters denses, qui génèrent davantage de dépassements à l'encodage avec pertes.`,ref:`Pratiques · Mastering & diffusion`},
 {l:'Compréhension',q:`Pourquoi garder un volume d'écoute constant pendant le mixage ?`,o:[`La perception du grave et de l'aigu change avec le volume : changer de niveau, c'est changer de mix`,`Pour économiser les enceintes`,`Parce que les plugins réagissent au volume d'écoute`,`Pour respecter la normalisation`],e:`À fort volume tout paraît plus plein et plus brillant. Un niveau modéré et fixe donne des décisions qui tiennent partout.`,ref:`Pratiques · Écoute`},
 {l:'Compréhension',q:`Pourquoi séparer création, arrangement et mixage en sessions distinctes ?`,o:[`Ce sont des états d'esprit incompatibles : analyser tue l'idée en cours`,`Live ne permet pas de faire les trois à la fois`,`Pour réduire la charge du processeur`,`Parce que le mixage doit se faire en mono`],e:`En création on génère sans juger ; en mixage on juge sans générer. Mélanger les deux ralentit l'un et l'autre.`,ref:`Pratiques · Méthode`},
 {l:'Application',q:`Un plugin améliore nettement ta piste, mais elle sort aussi 2 dB plus fort. Que fais-tu ?`,o:[`Tu compenses le niveau de sortie, puis tu compares bypass on/off`,`Tu le gardes, l'amélioration est évidente`,`Tu montes toutes les autres pistes de 2 dB`,`Tu ajoutes un limiteur derrière`],e:`Ce qui sort plus fort paraît meilleur. Sans comparaison à niveau égal, tu ne sais pas ce que le plugin apporte.`,ref:`Pratiques · ERR01`},
 {l:'Application',q:`Mixer dans un limiteur laissé actif en permanence sur le master est déconseillé. Pourquoi ?`,o:[`Il masque les excès de niveau et de grave : le mix s'effondre quand on le retire`,`Il ajoute de la latence`,`Il est interdit par les plateformes`,`Il désactive la normalisation`],e:`À distinguer du compresseur de bus léger présent dès le départ, qui est une pratique établie.`,ref:`Pratiques · fiches ERR, Mixage`},
 {l:'Diagnostic',q:`Tu as des dizaines de boucles de 8 mesures et aucun morceau terminé. Quelle correction ?`,o:[`Une date de fin, l'arrangement soustractif dès que la boucle fonctionne, et terminer quoi qu'il arrive`,`Acheter de nouveaux packs de samples`,`Attendre d'avoir une meilleure idée`,`Passer plus de temps sur chaque boucle`],e:`L'arrangement, le mixage et le mastering ne s'apprennent qu'en terminant des morceaux, même imparfaits.`,ref:`Pratiques · fiches ERR, Méthode`},
 {l:'Diagnostic',q:`Deux kicks superposés ont moins de grave qu'un seul. Cause probable ?`,o:[`Une opposition de phase partielle entre les deux couches`,`Un tempo trop rapide`,`Trop de compression`,`Un manque de réverbe`],e:`Inverse la polarité de l'une des couches et garde la position qui donne le plus de grave ; aligne les départs.`,ref:`Pratiques · fiches ERR, Sound design`}],
'focus:marketing':[
 {l:'Rappel',q:`Combien de temps avant la sortie faut-il proposer un titre aux éditeurs de Spotify pour qu'il entre dans le Release Radar de tes abonnés ?`,o:[`Au moins 7 jours`,`Le jour même`,`Au moins 24 heures`,`Au moins 6 mois`],e:`C'est le seul levier garanti, et il est gratuit. Compte en plus les délais de ton distributeur : vise trois à quatre semaines d'avance.`,ref:`Diffusion · Sortie`},
 {l:'Rappel',q:`Depuis avril 2024, à partir de quel seuil un titre génère-t-il des redevances d'enregistrement sur Spotify ?`,o:[`1 000 écoutes sur les douze derniers mois, avec un minimum d'auditeurs uniques`,`Dès la première écoute`,`100 000 écoutes`,`10 abonnés`],e:`Mieux vaut donc soutenir quelques sorties que disperser des dizaines de titres confidentiels.`,ref:`Diffusion · Droits & revenus`},
 {l:'Compréhension',q:`Pourquoi construire une liste de diffusion alors qu'on a des abonnés sur les réseaux ?`,o:[`Les abonnés appartiennent à la plateforme ; une adresse e-mail t'appartient`,`Les e-mails sont plus modernes`,`Les réseaux sociaux interdisent la promotion musicale`,`Pour éviter de publier des vidéos`],e:`Un changement d'algorithme, de règles, ou un compte suspendu, et la portée disparaît. La liste est le seul lien direct que personne ne peut te retirer.`,ref:`Diffusion · Stratégie`},
 {l:'Compréhension',q:`Un service te garantit 10 000 écoutes et un placement en playlist contre paiement. Que faut-il en penser ?`,o:[`C'est interdit par Spotify et contre-productif : écoutes non rémunérées, non comptées, et risque de retrait`,`C'est une pratique normale pour lancer un titre`,`C'est acceptable si le prix est bas`,`C'est recommandé par les distributeurs`],e:`Spotify interdit tout service promettant écoutes ou placements contre paiement, et facture distributeurs et labels en cas de fraude flagrante.`,ref:`Diffusion · Erreurs, MKT01`},
 {l:'Application',q:`Comment envoyer une démo à un label ?`,o:[`Un à trois titres terminés en lien d'écoute privé, quatre lignes personnalisées, une seule relance`,`Dix titres en pièces jointes, avec ta biographie complète`,`Le même message à cinquante labels en copie`,`Un message public sous leur dernière publication`],e:`Les démos lues sont courtes, faciles à écouter, et montrent que tu connais le label.`,ref:`Diffusion · Réseau et Modèles`},

let quizActive=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const qhash=(id,str)=>{let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return id+':'+(h>>>0).toString(36);};
Object.keys(QUIZ).forEach(id=>QUIZ[id].forEach(q=>{q.k=qhash(id,q.q);}));     // clé calculée sur l'énoncé français : l'historique survit au changement de langue
const qkey=(id,q)=>q.k||qhash(id,q.q);   // clé stable même si l'ordre des questions change
function record(id,q,ok){const k=qkey(id,q),st=S.qstat[k]||{ok:0,ko:0};ok?st.ok++:st.ko++;st.last=ok?1:0;st.at=Date.now();S.qstat[k]=st;autoSave();}
const topicTitle=id=>(TOPICS.find(t=>t.id===id)||{}).tab||id;
function runQuestions(root,items,showTheme,onEnd){
  quizActive=true;let i=0,score=0;const missed=[];
  const ask=()=>{const it=items[i],q=it.q,opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
    root.innerHTML=`<div class="qhead"><span>${showTheme?glossLabel(it.id)+' · ':''}${q.l}</span><span>${i+1} / ${items.length}</span></div><div class="qq">${q.q}</div>
      <div class="qopts">${opts.map((o,k)=>`<button class="qopt" data-k="${k}">${o.t}</button>`).join('')}</div><div id="qfb"></div>`;
    root.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
      const pick=opts[+b.dataset.k];
      root.querySelectorAll('.qopt').forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add('good');});
      if(pick.ok)score++;else{b.classList.add('bad');missed.push(it);}
      record(it.id,q,pick.ok);
      const last=i===items.length-1;
      root.querySelector('#qfb').innerHTML=`<div class="qfb"><p><b class="${pick.ok?'ok':'ko'}">${pick.ok?'Exact.':'Pas tout à fait.'}</b> ${q.e}</p>
        <div class="row" style="margin-top:12px"><button class="btn primary" id="qn">${last?'Voir le résultat':'Question suivante'}</button></div></div>`;
      const n=root.querySelector('#qn');n.onclick=()=>{i++;if(last){quizActive=false;onEnd(score,missed);}else ask();};n.focus&&n.focus();
    });};
  ask();
}
function initQuiz(id){
  const Q=QUIZ[id],root=document.getElementById('quiz'); if(!Q||!root)return;
  const intro=()=>{quizActive=false;const r=S.quiz[id];
    root.innerHTML=`<p>${Q.length} questions progressives, du rappel au diagnostic, avec correction immédiate.</p>
      ${r?`<p class="note">Dernier score ${r.last}/${r.n} · meilleur ${r.best}/${r.n}</p>`:''}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="qs">${r?'Refaire le quiz':'Lancer le quiz'}</button></div>`;
    root.querySelector('#qs').onclick=run;};
  const run=()=>runQuestions(root,Q.map(q=>({id,q})),false,(score,missed)=>{
    const prev=S.quiz[id],sameN=prev&&prev.n===Q.length;
    S.quiz[id]={last:score,best:Math.max(score,sameN?prev.best:0),n:Q.length,at:Date.now()};autoSave();renderTabs(currentId);
    const perfect=score===Q.length;
    root.innerHTML=`<div class="qscore" style="color:var(--${perfect?'green':score>=Q.length/2?'amber':'red'})">${score} / ${Q.length}</div>
      <p>${perfect?`Notions acquises. Passe à la mise en pratique dans Live si ce n'est pas fait : c'est là que ça s'ancre.`:'À revoir avant de refaire le quiz : <b>'+[...new Set(missed.map(m=>m.q.ref))].join('</b>, <b>')+'</b>.'}</p>
      <div class="row" style="margin-top:12px"><button class="btn" id="qr">Refaire le quiz</button></div>`;
    root.querySelector('#qr').onclick=run;});
  intro();
}

  ['Batterie','Squelette disco programmé (kick sur 4 temps, clap 2 et 4, charley ouvert sur les contretemps), <b>doublé par des boucles de percussions réelles</b> : tambourin, shaker, congas. C\'est ce mélange machine / humain qui fait le style.'],
  ['Basse','Basse synthé ronde et percussive, type analogique : octaves, syncopes, petits glissés. Plus simple et plus répétitive qu\'une basse disco jouée. Filtre à enveloppe courte, un peu de résonance.'],
  ['Harmonie et instruments','Nappes et accords en <b>maj7 et m7</b>, arpèges de synthé, stabs cuivrés, licks de guitare funk. Un vocoder ou une talk-box pour le hook fonctionne particulièrement bien.'],
  ['Signature sonore','Chaleur « analogique » fabriquée : saturation légère, chorus sur les nappes, un soupçon de flottement de hauteur. Le <b>sidechain</b> est présent mais dosé : il fait rebondir, il ne pompe pas.'],
  ['Arrangement','Montée lente et hypnotique. On révèle les éléments un par un, avec des filtres qui s\'ouvrent sur 16 mesures. Garde le lead ou le hook vocal pour le second tiers du morceau.'],
  ['Mix et master','Kick net et basse bien séparés, sub mono. Aigus soyeux plutôt que brillants : adoucis les charleys. Niveau de master intermédiaire, plus dynamique qu\'un titre house grand public.']],

{id:'french',name:'French Touch',
 lede:'House filtrée : une boucle de disco ou de funk de une à deux mesures, un filtre qu\'on ouvre et qu\'on ferme, et un kick qui fait pomper tout le mix. L\'art de faire beaucoup avec presque rien.',
 idc:[['Tempo','120–128 BPM'],['Feeling','Droit ou swing très léger ; le mouvement vient du pompage'],['Harmonie','Celle de la boucle : souvent 2 accords, m7 ou maj7'],['Forme','Longues progressions par le filtre, format club']],
 tips:[
  ['La boucle','Le cœur du morceau. <b>Une à deux mesures</b>, riches en harmoniques (cordes, guitare, Rhodes), découpées de façon à créer une syncope à la reprise. Échantillonnée, rejouée ou fabriquée : c\'est sa répétition hypnotique qui compte.'],
  ['Le filtre','<b>L\'instrument principal.</b> Passe-bas avec un peu de résonance, automatisé en continu : fermé dans l\'intro, il s\'ouvre sur 16 ou 32 mesures. Alterner passe-bas et passe-haut, ajouter un phaser lent : ce sont les seuls « solos » du morceau.'],
  ['Batterie','Kick lourd sur les 4 temps, clap sur 2 et 4, charley ouvert sur les contretemps. Peu d\'éléments, très en avant. Le kick doit être assez long pour déclencher un pompage généreux.'],
  ['Basse','Souvent déjà contenue dans la boucle. Sinon : une basse synthé simple qui suit les fondamentales, placée sur les contretemps pour laisser le kick seul sur le temps.'],
  ['Signature sonore','<b>Sidechain profond</b> sur tout sauf la batterie : 8 à 12 dB de réduction, release calé pour que le son revienne juste avant le kick suivant. Compression de bus poussée, utilisée comme un effet. Voix vocodées.'],
  ['Arrangement','Par soustraction et par filtre, jamais par ajout d\'idées. Couper le kick 4 ou 8 mesures avec le filtre qui se ferme, puis tout rouvrir : c\'est le drop.'],
  ['Mix et master','Dense, fort, assumé. Le kick est le patron et tout le reste s\'écarte devant lui. Attention : le pompage consomme la marge, règle-le avant de toucher au limiteur.']],
 traps:`<b>Échantillonner sans autorisation</b> : publier un morceau contenant un sample non déclaré expose à un retrait ou à une réclamation de droits. Alternatives : rejouer la boucle, utiliser des packs libres de droits, ou construire ta propre « fausse boucle » (voir la démo). <b>Trop d'idées</b> : si tu ajoutes une troisième partie mélodique, tu sors du style. <b>Un filtre statique</b> : s'il ne bouge pas, il ne se passe rien.`,

{id:'hiphop',name:'Hip Hop',
 lede:'Le hip-hop actuel, d\'influence trap : une 808 qui sert de basse, des charleys en rafales, beaucoup d\'espace. La production s\'efface devant la voix.',
 idc:[['Tempo','130–160 BPM, ressenti à la moitié (65–80)'],['Feeling','Droit ; le mouvement vient des roulements de charleys'],['Harmonie','Mineur sombre, 2 à 4 accords, mélodies simples et répétitives'],['Forme','Intro 4–8, refrain 8, couplet 16 mesures']],
 tips:[
  ['Batterie','<b>Caisse claire ou clap sur le temps 3</b> (feeling half-time), kick clairsemé et syncopé. Les charleys font le travail : doubles-croches, avec des <b>roulements</b> en triples-croches ou en triolets, et des vélocités en rampe.'],
  ['La 808','C\'est la basse <b>et</b> une partie du kick. Accordée sur la tonalité, note longue, avec des <b>glissés</b> (portamento) entre certaines notes. Elle suit généralement le rythme du kick.'],
  ['Mélodie et harmonie','Un motif court, sombre, en mineur : cloche, piano désaccordé, flûte, pad. <b>Laisse des trous.</b> Un beat qui sonne « vide » seul est souvent parfait une fois la voix posée.'],
  ['Signature sonore','808 saturée pour exister sur téléphone. Mélodies souvent filtrées, avec réverbe et delay. Contraste fort entre un grave énorme et un haut du spectre clairsemé.'],
  ['Arrangement','Par <b>coupures</b> : retirer la batterie une mesure avant le refrain, couper la 808 sur un demi-couplet, faire tomber tout sauf la voix sur une punchline. Des changements toutes les 4 ou 8 mesures.'],
  ['Mix et master','Décide qui tient le grave : kick court par-dessus une 808 longue, avec un léger sidechain de la 808 par le kick. Tout le grave en mono. Voix très en avant, plutôt sèche. Master fort.']],
 traps:`<b>Une 808 désaccordée</b> : c'est une note, elle doit être dans la tonalité. <b>Kick long + 808 longue</b> : bouillie dans le grave. <b>Remplir tout l'espace</b> : il n'y a plus de place pour la voix. <b>Roulements partout</b> : ils n'ont d'effet que s'ils sont rares.`,

{id:'boombap',name:'Boom Bap',
 lede:'Le hip-hop de l\'âge d\'or : un kick qui fait « boom », une caisse claire qui fait « bap », un sample de jazz ou de soul découpé, et un swing de sampler qui traîne légèrement.',
 idc:[['Tempo','85–95 BPM'],['Feeling','Swing marqué, 58–66 %, caisse claire parfois un peu en retard'],['Harmonie','Celle du sample : accords jazz, m7, m9, maj7'],['Forme','Boucle de 2 ou 4 mesures, couplet 16, refrain 8']],
 tips:[
  ['Batterie','Des sons <b>échantillonnés sur de vrais breaks</b>, pas des sons de synthèse. Kick lourd et mat, caisse claire claquante, souvent superposée à un second sample. Charleys en croches, peu nombreux. Le pattern est simple : tout est dans le son et le placement.'],
  ['Le swing','La signature du style. Swing de type MPC entre 58 et 66 %, puis <b>désactive la quantification sur certaines frappes</b> : une caisse claire quelques millisecondes en retard donne le feeling « paresseux ».'],
  ['Le sample','Une phrase de jazz, soul ou funk, <b>découpée en tranches</b> et rejouée dans un autre ordre. Filtrée en passe-bas pour laisser la place à la voix et à la batterie. Deux à quatre mesures qui tournent.'],
  ['Basse','Ronde, sourde, discrète : sinus ou basse filtrée très bas (passe-bas vers 200–300 Hz). Elle suit les fondamentales du sample avec deux ou trois notes par mesure.'],
  ['Signature sonore','Le grain : réduction de résolution façon samplers 12 bits, souffle et craquements de vinyle, saturation. Spectre centré sur les médiums, peu d\'extrême aigu.'],
  ['Arrangement','La boucle ne change presque pas. On varie en <b>coupant</b> : sample muet sur la dernière mesure, batterie seule, scratches sur le refrain.'],
  ['Mix et master','Batterie forte et devant, c\'est elle la vedette avec la voix. Compression parallèle sur le bus batterie. N\'essaie pas de rendre le tout propre et brillant : adoucis au-delà de 12 kHz.']],
 traps:`<b>Trop propre</b> : des sons de batterie modernes et un mix brillant sonnent hors style. <b>Tout quantifié</b> : sans le swing et les retards, c'est juste un beat lent. <b>Samples non déclarés</b> : même risque juridique que pour la French Touch. <b>Trop de couches</b> : batterie, basse, un sample, éventuellement un second élément, pas plus.`,
